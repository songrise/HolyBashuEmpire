l_simp_chinese:
 hbe_military_chengdu_plain: "渠乡习射"
 hbe_has_military_chengdu_plain_tt: "已研究「$hbe_military_chengdu_plain$」"
 hbe_military_chengdu_plain_desc: "渠口各乡轮派壮丁习射，弩具与箭料分册保管。守堰者依水次轮换，农忙时仍须回田，不再把织坊的名册当作军册。"
 hbe_military_southern_salt_wine: "井灶护运法"
 hbe_has_military_southern_salt_wine_tt: "已研究「$hbe_military_southern_salt_wine$」"
 hbe_military_southern_salt_wine_desc: "井户与运盐人议定护送的路段，兵器、粮料与误期赔付各记一栏。护运者按程交接，盐场的产额与军中的点名从此分开核算。"
 hbe_military_eastern_river: "江岸编伍"
 hbe_has_military_eastern_river_tt: "已研究「$hbe_military_eastern_river$」"
 hbe_military_eastern_river_desc: "沿江寨户按泊口编伍，守夜、巡岸与船上接应各有班次。船帮仍照常转运，寨兵却须另领粮械，不因船货增多便临时添派乡丁。"
 hbe_military_northern_shudao: "关隘轮戍法"
 hbe_has_military_northern_shudao_tt: "已研究「$hbe_military_northern_shudao$」"
 hbe_military_northern_shudao_desc: "驿堡把到岗和归乡的日期分别登记，关军依册交接器械与粮额。道路可以通商，守关的轮次却须另有军令，不再混入驿夫的脚程。"
 hbe_military_central_hills: "义仓团练约"
 hbe_has_military_central_hills_tt: "已研究「$hbe_military_central_hills$」"
 hbe_military_central_hills_desc: "仓社议定守仓与护田的班次，抽练者领取明列的粮额。丰年仍以耕作为本，遇警方按册集结；开仓赈借不再兼作征兵的口令。"
 hbe_military_western_tea_horse: "茶路护骑法"
 hbe_has_military_western_tea_horse_tt: "已研究「$hbe_military_western_tea_horse$」"
 hbe_military_western_tea_horse_desc: "商队与护骑在山口验过驮具，按程分领马料与护送凭据。向导负责择路，骑手负责警戒，交割场的茶引不再代替军中的点验。"
 hbe_military_southwestern_valleys: "联寨编伍"
 hbe_has_military_southwestern_valleys_tt: "已研究「$hbe_military_southwestern_valleys$」"
 hbe_military_southwestern_valleys_desc: "各寨把出人的数额和归还的期限写入共同军册，留守者接续照料田畜。谷市的买卖仍依旧约，驻防则另认粮额与轮替，不把盟约当作无期征令。"
 hbe_can_cross_circle_industry: "可以跨圈经营"
 MODIFIER_TYPE_NAME_hbe_can_cross_circle_industry: "可以跨圈经营"

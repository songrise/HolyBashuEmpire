 hbe.101.title: "井下与灶前"
 hbe.101.desc: "新打出的[Concept('hbe_term_salt', '盐井')|e]卤味颇浓，井主请求添灶开煎。盐商已等在井口，愿按约收走头几批井盐。灶户却呈报，汲卤绳索磨损严重，轮班的工人也已多日没有休息。\n\n掌盐官希望趁高价加紧煎盐。我们也可以拨款整修井架，让灶户轮休，或将采办与承销交给商人处理。"
 hbe.101.a: "让井灶昼夜开煎。"
 hbe.101.b: "拨款修井，准灶户轮休。"
 hbe.101.c: "交给盐商承销，免去官府垫款。"

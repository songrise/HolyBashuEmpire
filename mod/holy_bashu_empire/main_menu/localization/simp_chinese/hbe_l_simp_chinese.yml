 HBE_BANQUET_PANEL_TITLE: "三十六家，一张账单"
 HBE_BANQUET_PANEL_BODY: "本国立场：[Player.MakeScope.GetVariable('hbe_stance').GetValue|0]（1 [Concept('hbe_term_common', '共锅')|e]、2 [Concept('hbe_term_divided', '分锅')|e]、3 账房）。[Concept('hbe_term_contribution', '个人贡献')|e]：[Player.MakeScope.GetVariable('hbe_contribution').GetValue|0]。\n阶段：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_chapter').GetValue|0] / 5。@hbe_dispute! [Concept('hbe_term_dispute', '分歧')|e]：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_dispute').GetValue|0] / 100。\n届次：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_round').GetValue|0]；本届月份：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_round_month').GetValue|0] / 36。\n主工程：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_project_kind').GetValue|0]（1 [Concept('hbe_term_saltproject', '盐船共账')|e]、2 [Concept('hbe_term_teaproject', '茶马过蜀道')|e]）。三项交付：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_role_1').GetValue|0] / [GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_role_2').GetValue|0] / [GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_role_3').GetValue|0]。\n[Concept('hbe_term_success', '成功工程')|e]：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_completed_projects').GetValue|0]。章程：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_charter').GetValue|0]（0 未定、1 [Concept('hbe_term_common', '共锅')|e]、2 [Concept('hbe_term_divided', '分锅')|e]、3 账房）。\n[Concept('hbe_term_charter', '百年章程')|e]至少在1437年、[Concept('hbe_term_chapter', '第五阶段')|e]与三十次[Concept('hbe_term_success', '成功工程')|e]后提案，由[Concept('hbe_term_circle', '七圈')|e]授权表决。合并诸侯后，原府州首府仍构成[Concept('hbe_term_seat', '固定代表席位')|e]。"
 HBE_BANQUET_PANEL_HELP: "[Concept('hbe_term_commitment', '前六个月')|e]在决议中出资或签专业合同；半年交付，第十二个月兑现承诺，第三十六个月统一结算。\n三份[Concept('hbe_term_delivery', '地方援助')|e]齐全且@hbe_dispute! [Concept('hbe_term_dispute', '分歧')|e]低于75才算成功。1437年以后、[Concept('hbe_term_chapter', '第五阶段')|e]且至少30次成功项目，皇帝可提请[Concept('hbe_term_charter', '百年章程')|e]。\n[Concept('hbe_term_common', '共锅')|e]、[Concept('hbe_term_divided', '分锅')|e]、[Concept('hbe_term_ledger', '账房立场')|e]在局势地图上分别为红、蓝、黄。全部帝国成员参加；[Concept('hbe_term_isolation', '自治盟约')|e]一直有效。"
 hbe_tech_common_1_desc: "乡里的借券与府库的收支各有写法，一项事业往往留下几本相互矛盾的账。我们应使出资、交付与验收各有凭据，让继任者能够接续前人的责任。"
 hbe_tech_common_1_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。"
 hbe_tech_common_2_desc: "山道隔开了市集，也使同名的斗斛有了不同的分量。若盐粮仍依各府旧尺交割，合作便免不了在秤前争执；共同认可的度量，是诸侯彼此信任的第一步。"
 hbe_tech_common_2_effects: "整合其他旧府州后，地方援助可以使用10点义气作替代担保。"
 hbe_tech_common_3_desc: "一府可以修补自己的渠岸，却难以独力承担贯通数圈的工程。应将勘查、备料和验收分别登记，使主持者的名望建立在实际交付之上。"
 hbe_tech_common_3_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。"
 hbe_tech_common_4_desc: "织机、井具和桥栈的诀窍，多藏在作坊口授的经验里。让匠人带着器样往来各府，彼此观摩而保有本业，远比将所有技艺锁在一处更有益于巴蜀。"
 hbe_tech_common_4_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。\n配合锦江讲会和跨区工艺学堂，加快技术与制度传播。"
 hbe_tech_common_5_desc: "一位巧匠的手艺未必能够传至下一代，行会的旧规也未必容得下后来者。我们应为学徒、师傅与主持采办的人留下可循的传习章程。"
 hbe_tech_common_5_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。\n提高锦坊、井灶和诸谷作坊的实际产出，支持新生产方式。"
 hbe_tech_common_6_desc: "来自井灶、渠田与山路的经验，需要不同的器具，也需要共同的语言。若各圈愿意共同供养讲习之所，远道而来的匠人便不再只能在客舍中交换口传。"
 hbe_tech_common_6_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。"
 hbe_tech_common_7_desc: "驿卒所记的里程，往往没有写下暴雨后的断栈与渡口的候船之苦。我们将派人重勘道路，把关隘、歇脚处与备料地点一并录入图册。"
 hbe_tech_common_7_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。\n降低原版道路工期与碎石路成本；可与蜀道接递叠加。"
 hbe_tech_common_8_desc: "府界上的几幅旧图各自完整，拼在一起却遗漏了跨圈的桥栈。我们需要一份可供共同治事的总图，使主持工程的人看见通路，也看见沿途的责任。"
 hbe_tech_common_8_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。"
 hbe_tech_chengdu_plain_1_desc: "渠水入田并不意味着每一乡都能及时受水。岁修所需的木石、人手和开口顺序，应由实际承担渠务的人共同议定，免使丰年留下的争执在旱年加倍。"
 hbe_tech_chengdu_plain_1_effects: "解锁本圈三年[Concept('hbe_term_local_service', '地方事业')|e]与地方援助资格。"
 hbe_tech_chengdu_plain_2_desc: "[Concept('hbe_history_shujin', '蜀锦')|e]的声名来自织造，也来自染料、丝线与熟练人手的相互配合。锦户若能按工序相助，府库便可在采办时分清谁交付何物，而不只追求一匹成锦。"
 hbe_tech_chengdu_plain_2_effects: "取得本圈成长验收的课题资格。\n解锁机构生产方式：锦坊试织。"
 hbe_tech_chengdu_plain_3_desc: "每一处渠口都有旧例，却未必有能够互相核对的记载。将水次与岁修之责写入同一簿册，才可使上游的便利与下游的生计一同进入公议。"
 hbe_tech_chengdu_plain_3_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。"
 hbe_tech_chengdu_plain_4_desc: "相邻的沟渠并非各自孤立，修好一段也可能将水患推向另一乡。我们应以整条通水脉络安排备料与验收，让各府能够共同承担受益之地的维护。"
 hbe_tech_chengdu_plain_4_effects: "取得本圈旧约重审验收的课题资格。\n解锁机构生产方式：锦坊绣作。\n解锁机构生产方式：蜀纸描样。\n解锁“渠田共济”：运行渠务所、近五年完成本圈事业、役负低于70，且水权储备至少30时获得额外联动收益；条件不满足时暂停。"
 hbe_tech_chengdu_plain_5_desc: "平原的丰收若只留在各府私库，荒岁时仍会有人求粮无门。把入仓、出贷与补还的凭据相互核验，天府的富庶方能成为各乡能够依靠的常备。"
 hbe_tech_chengdu_plain_5_effects: "取得本圈地区重组及百年章程验收的课题资格。"
 hbe_tech_chengdu_plain_6_desc: "蜀中兴学的旧事使人敬重书卷，但渠旁与作坊同样需要懂得治事的人。让讲会接纳实际主持[Concept('hbe_term_local_service', '地方事业')|e]者，使书院中的议论能够回到田亩与街市。"
 hbe_tech_chengdu_plain_6_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。"
 hbe_tech_chengdu_plain_7_desc: "使者在堂上坐定之前，常已为议题的先后与签押的格式争论许久。我们应规定呈议、质问与记录的次序，给不同府州留下明白作答的机会。"
 hbe_tech_chengdu_plain_7_effects: "取得本圈旧约重审验收的课题资格。\n解锁“锦江讲会”：运行锦户讲习院、近五年完成本圈事业、役负低于70，且义气至少60时获得额外联动收益；条件不满足时暂停。"
 hbe_tech_chengdu_plain_8_desc: "巴蜀的公议不能只靠一代主持者的声望维系。将官学、议事与[Concept('hbe_term_contract', '旧约')|e]的保存相联系，使后来的诸侯仍能查阅当初为何承诺，又应如何履约。"
 hbe_tech_chengdu_plain_8_effects: "取得本圈地区重组及百年章程验收的课题资格。"
 hbe_tech_southern_salt_wine_1_desc: "井口的卤水、灶上的燃料与运盐的脚钱分由不同人掌握，一笔总价常掩去了各自承担的劳苦。我们应从井灶公账入手，令成本与交付都有可查的来处。"
 hbe_tech_southern_salt_wine_1_effects: "解锁本圈三年[Concept('hbe_term_local_service', '地方事业')|e]与地方援助资格。\n解锁机构生产方式：井灶汲卤。"
 hbe_tech_southern_salt_wine_2_desc: "盐与酒都需器具、燃料和可靠的运送，却有不同的工序与候时。联合采办可以减少相互挤占，前提是商户愿意将所需之物与到货之期写得明白。"
 hbe_tech_southern_salt_wine_2_effects: "取得本圈成长验收的课题资格。"
 hbe_tech_southern_salt_wine_3_desc: "蜀中井盐的旧技并非一成不变，井架、绳具与汲卤办法仍有改进余地。投入器具和查验人手，既关乎产出，也关乎井户能否平安度过下一次作业。"
 hbe_tech_southern_salt_wine_3_effects: "解锁机构生产方式：井灶精煎。"
 hbe_tech_southern_salt_wine_4_desc: "一张盐引写下的是未来交付，而库吏眼前需要的却是今日的钱。若以盐业收益作保，借款、利息与偿还之期便须同时公开，免使担保变成无尽的拖欠。"
 hbe_tech_southern_salt_wine_4_effects: "解锁盐引贷款，并取得本圈旧约重审验收资格。\n解锁“井盐担保”：运行井灶公廨、近五年完成本圈事业、役负低于70，且盐债不超过20时获得额外联动收益；条件不满足时暂停。"
 hbe_tech_southern_salt_wine_5_desc: "各井各灶都能向邻府承诺供盐，却难以在丰歉之间承担共同责任。让总号协调有限的担保与交付，使它的信用始终有真实经营可以支撑。"
 hbe_tech_southern_salt_wine_5_effects: "取得本圈地区重组及百年章程验收的课题资格。"
 hbe_tech_southern_salt_wine_6_desc: "酒坊的好坏不只在窖中，也在粮料、器皿与守时的工匠。分清酿造、储存与交付的责任，可以使宴席所需不再挤占其他[Concept('hbe_term_local_service', '地方事业')|e]的备料。"
 hbe_tech_southern_salt_wine_6_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。"
 hbe_tech_southern_salt_wine_7_desc: "诸侯的[Concept('hbe_term_alliance', '会盟')|e]离不开待客，负责采办的人却常在散席后才收到催账的使者。我们应先议数量、价钱与交期，再以[Concept('hbe_term_contract', '契约')|e]确认谁承担临时增添的费用。"
 hbe_tech_southern_salt_wine_7_effects: "取得本圈旧约重审验收的课题资格。\n解锁“盐酒席面”：运行盐酒契券所、近五年完成本圈事业、役负低于70，且盐引信用至少30时获得额外联动收益；条件不满足时暂停。"
 hbe_tech_southern_salt_wine_8_desc: "一次盛会能使承办者扬名，也能留下多年未清的旧账。将席面、运送和核账分别验收，才可使庆典的荣誉与本府的经营相互成全。"
 hbe_tech_southern_salt_wine_8_effects: "取得本圈地区重组及百年章程验收的课题资格。"
 hbe_tech_eastern_river_1_desc: "船只到岸之后，货物仍要经过卸载、储放和再次装运。[Concept('hbe_history_river', '川江')|e]两岸的转运之所若无共同规矩，一段顺畅的水程也会在码头化作长久的等候。"
 hbe_tech_eastern_river_1_effects: "解锁本圈三年[Concept('hbe_term_local_service', '地方事业')|e]与地方援助资格。"
 hbe_tech_eastern_river_2_desc: "险滩前的船工必须同声同力，岸上的出资者却未必懂得这份配合。把纤夫、船户与转运人手的责任写进互助约定，是可靠江运的根本。"
 hbe_tech_eastern_river_2_effects: "取得本圈成长验收的课题资格。\n解锁机构生产方式：江船备料。"
 hbe_tech_eastern_river_3_desc: "每一道关卡都有自己的旧额，往来的商旅却承受着累积的盘查。各府若能认可彼此的券据，就可以减少重复征索，也让维护通路的费用更清楚。"
 hbe_tech_eastern_river_3_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。"
 hbe_tech_eastern_river_4_desc: "一条船的损失可以使小商户多年经营付诸流水，单靠邻里的情面难以承担。互保需要事先认缴、出险查验与有限赔付，而非事故之后才临时求援。"
 hbe_tech_eastern_river_4_effects: "取得本圈旧约重审验收的课题资格。\n解锁机构生产方式：船帮联作。\n解锁“川江互保”：运行江岸转运仓、近五年完成本圈事业、役负低于70，且江运互保至少30时获得额外联动收益；条件不满足时暂停。"
 hbe_tech_eastern_river_5_desc: "江运通畅使盐粮与器物得以往来，所得却散在各段岸口。我们应将通行与共同维护写入长约，使上下游的承诺不会随一次换主而消失。"
 hbe_tech_eastern_river_5_effects: "取得本圈地区重组及百年章程验收的课题资格。"
 hbe_tech_eastern_river_6_desc: "崖岸为守备提供便利，也限制了粮秣与人手的调集。依山筑垒之时，应一并察看取水、仓储和退守之路，免使险地成为困住守军的牢笼。"
 hbe_tech_eastern_river_6_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。"
 hbe_tech_eastern_river_7_desc: "江面上的巡察与岸上的驻守各有职责，若互不通报，敌情与误报同样容易沿江传开。建立水陆交接的办法，才能使守备跟得上往来的船只。"
 hbe_tech_eastern_river_7_effects: "取得本圈旧约重审验收的课题资格。\n解锁“江岸会防”：运行山城联防寨、近五年完成本圈事业、役负低于70，且完成本圈成长验收时获得额外联动收益；条件不满足时暂停。"
 hbe_tech_eastern_river_8_desc: "山城的可靠不在某一段高墙，而在关口、岸仓与援兵能够彼此照应。将各处守备纳入同一调度，使保护通路成为诸侯共同维护的事业。"
 hbe_tech_eastern_river_8_effects: "取得本圈地区重组及百年章程验收的课题资格。"
 hbe_tech_northern_shudao_1_desc: "[Concept('hbe_history_shudao', '蜀道')|e]的艰险既在山势，也在风雨之后无人查验的旧栈。勘绘须记录落脚处、木石来源与易损之段，不能只把两座城池之间画上一道直线。"
 hbe_tech_northern_shudao_1_effects: "解锁本圈三年[Concept('hbe_term_local_service', '地方事业')|e]与地方援助资格。"
 hbe_tech_northern_shudao_2_desc: "驿站与堡垒各守一处，却共同依赖沿路送来的文书与粮料。我们应规定接递、候援与报损的次序，使路上的消息不再止于府界。"
 hbe_tech_northern_shudao_2_effects: "取得本圈成长验收的课题资格。"
 hbe_tech_northern_shudao_3_desc: "关门可以阻住来敌，也可能阻住本府急需的粮秣。守备的章程应同时安排驻守与通行，令山关的险固建立在能够长期维持的供给上。"
 hbe_tech_northern_shudao_3_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。"
 hbe_tech_northern_shudao_4_desc: "轮戍之约最难处，在于当值之府是否真的送来了足额人手。把交接、补缺与逾期责任写明，才可避免诸侯在危急时又争论谁应先行。"
 hbe_tech_northern_shudao_4_effects: "取得本圈旧约重审验收的课题资格。\n解锁“关隘轮守”：运行栈道驿堡、近五年完成本圈事业、役负低于70，且轮戍履约至少30时获得额外联动收益；条件不满足时暂停。"
 hbe_tech_northern_shudao_5_desc: "一处山关失去供给，会使邻近的关堡同样陷入困境。总镇应先协调援粮与轮替，再议统摄之权，使共同防务得到各府实际承认。"
 hbe_tech_northern_shudao_5_effects: "取得本圈地区重组及百年章程验收的课题资格。"
 hbe_tech_northern_shudao_6_desc: "商旅需要能够说明去向的券据，关市也需要维持驿路的经费。通行之券若能沿途核验，府州便可减少重征，也更易分辨无理盘索。"
 hbe_tech_northern_shudao_6_effects: "解锁机构生产方式：关驿抄券。"
 hbe_tech_northern_shudao_7_desc: "文书走得快，并不代表消息传得明白。不同驿站应保有一致的交接记录，让下一位收文者知道何时发出、由谁承递，又在何处耽搁。"
 hbe_tech_northern_shudao_7_effects: "取得本圈旧约重审验收的课题资格。\n解锁机构生产方式：蜀纸精抄。\n解锁“蜀道接递”：运行关市券所、近五年完成本圈事业、役负低于70，且完成本圈成长验收时获得额外联动收益；条件不满足时暂停。"
 hbe_tech_northern_shudao_8_desc: "驿传关系到征调、[Concept('hbe_term_alliance', '会盟')|e]与日常采办，不能只在战事紧急时才受重视。建立共同保管的程册，使诸侯的命令能够沿路送达，也能沿路追究责任。"
 hbe_tech_northern_shudao_8_effects: "取得本圈地区重组及百年章程验收的课题资格。"
 hbe_tech_central_hills_1_desc: "丘陵间的田亩依靠各自的塘堰，雨水稍有不同，邻乡便可能一丰一歉。整理坡田与水塘的维护办法，可以使日常蓄水不再只凭一家之力。"
 hbe_tech_central_hills_1_effects: "解锁本圈三年[Concept('hbe_term_local_service', '地方事业')|e]与地方援助资格。"
 hbe_tech_central_hills_2_desc: "市集的往来比府库的账册更为频繁，口头约定却经不起多人转手。明确交割的地点、日期与见证人，是将地方经营纳入@hbe_guoqi! [Concept('hbe_term_guoqi', '共同信用')|e]的起点。"
 hbe_tech_central_hills_2_effects: "取得本圈成长验收的课题资格。"
 hbe_tech_central_hills_3_desc: "仓粮集中一处便于掌管，却未必能及时送到远乡。分仓赈贷需要各乡保管、统一核账，使荒岁中的借粮能够到达真正需要的人手中。"
 hbe_tech_central_hills_3_effects: "解锁机构生产方式：仓社附田。"
 hbe_tech_central_hills_4_desc: "借出的粮食既要救急，也要留有来年补还的办法。乡社若能共同见证借贷与歉收，府库便不必在宽纵旧欠和逼迫穷户之间反复摇摆。"
 hbe_tech_central_hills_4_effects: "取得本圈旧约重审验收的课题资格。\n解锁机构生产方式：塘堰轮作。\n解锁“义仓相济”：运行分仓义廪、近五年完成本圈事业、役负低于70，且义仓储备至少30时获得额外联动收益；条件不满足时暂停。"
 hbe_tech_central_hills_5_desc: "各乡的义仓都有善举，也都有难以对外查明的旧账。联社应将入仓、赈借与回补相互核对，使相邻府州能够放心调剂有限的储备。"
 hbe_tech_central_hills_5_effects: "取得本圈地区重组及百年章程验收的课题资格。"
 hbe_tech_central_hills_6_desc: "[Concept('hbe_term_contract', '契约')|e]能够写下承诺，却还需要有人证明签押与交割。让见证者承担查验之责，可以减少权势之家以一句否认推翻乡民多年经营的风险。"
 hbe_tech_central_hills_6_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。"
 hbe_tech_central_hills_7_desc: "票据在不同府州之间转手，真正应还之人有时已经难以辨认。清算应循券追查交付，明确受让与偿付的关系，使信用不至于脱离实际经营。"
 hbe_tech_central_hills_7_effects: "取得本圈旧约重审验收的课题资格。\n解锁“乡社清算”：运行公信券馆、近五年完成本圈事业、役负低于70，且义气至少60时获得额外联动收益；条件不满足时暂停。"
 hbe_tech_central_hills_witness_8_desc: "诸侯公信来自接受查验，而非仅在券面上盖下显赫的印。会馆若能保存争议与裁定的凭据，就可让今日受理的纠纷成为来日能够引用的规矩。"
 hbe_tech_central_hills_witness_8_effects: "取得本圈地区重组及百年章程验收的课题资格。"
 hbe_tech_western_tea_horse_1_desc: "茶与马的交换跨越不同山地和生活习惯，双方对品质与价钱也各有判断。集市需要可靠的秤量和见证，使远来的商队愿意在此完成交割。"
 hbe_tech_western_tea_horse_1_effects: "解锁本圈三年[Concept('hbe_term_local_service', '地方事业')|e]与地方援助资格。\n解锁机构生产方式：驮具修造。"
 hbe_tech_western_tea_horse_2_desc: "图册可以记下山口，却不能替代熟知季节与道路的向导。把带路、候宿与报险的责任议定，可以使远途的采办不再依赖临时寻找的熟人。"
 hbe_tech_western_tea_horse_2_effects: "取得本圈成长验收的课题资格。"
 hbe_tech_western_tea_horse_3_desc: "商队走出本府之后仍要依靠沿途的协助，一纸承诺不足以抵挡事故。互保应确认实际同行的人与货物，再议有限的救助与损失分担。"
 hbe_tech_western_tea_horse_3_effects: "解锁机构生产方式：边茶压砖。\n解锁机构生产方式：蜀纸包茶。"
 hbe_tech_western_tea_horse_4_desc: "山路穿过不同府州，维护者与使用者未必是同一群人。通路会约应安排备料、候援与通行，不应只把所有费用都推给最远的关口。"
 hbe_tech_western_tea_horse_4_effects: "取得本圈旧约重审验收的课题资格。\n解锁“茶马通路”：运行茶马交割场、近五年完成本圈事业、役负低于70，且商队互保至少30时获得额外联动收益；条件不满足时暂停。"
 hbe_tech_western_tea_horse_5_desc: "茶马往来要有可信的交割之所，也要有能够持续维护的路程。公所的职责是保存券据、协调事故与受理争议，使远途合作不随掌事者更替而断绝。"
 hbe_tech_western_tea_horse_5_effects: "取得本圈地区重组及百年章程验收的课题资格。"
 hbe_tech_western_tea_horse_6_desc: "山门对行旅的接济既是善举，也需要田产、人手与实际物资。将施济的责任与使用分明登记，才可使过路者的需求与地方的负担相互体谅。"
 hbe_tech_western_tea_horse_6_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。"
 hbe_tech_western_tea_horse_7_desc: "跨地纠纷最难之处，往往是双方只认可自己的见证。调停应给不同乡里的代表作答之机，使裁定建立在愿意共同接受的程序之上。"
 hbe_tech_western_tea_horse_7_effects: "取得本圈旧约重审验收的课题资格。\n解锁“山门公议”：运行山程护行所、近五年完成本圈事业、役负低于70，且义气至少60时获得额外联动收益；条件不满足时暂停。"
 hbe_tech_western_tea_horse_8_desc: "诸山之间的公议必须承认不同旧俗，也须留下可以共同履行的约定。把互市、施济与调停汇成可查的章程，使各方在保有旧权时仍能维护通路。"
 hbe_tech_western_tea_horse_8_effects: "取得本圈地区重组及百年章程验收的课题资格。"
 hbe_tech_southwestern_valleys_1_desc: "山谷中的集市规模虽小，却连接着不同乡寨的日常所需。让交割、歇脚与巡察有固定的安排，是使地方往来免受猜疑与临时征索侵扰的第一步。"
 hbe_tech_southwestern_valleys_1_effects: "解锁本圈三年[Concept('hbe_term_local_service', '地方事业')|e]与地方援助资格。\n解锁机构生产方式：谷市农具。"
 hbe_tech_southwestern_valleys_2_desc: "一道府令未必能够说明各谷口的旧权与劳役。地方盟约须由实际承担维护的人共同签认，才可使主印之外的承诺同样为诸侯所知。"
 hbe_tech_southwestern_valleys_2_effects: "取得本圈成长验收的课题资格。"
 hbe_tech_southwestern_valleys_3_desc: "近路可以省下脚程，也可能使沿途的桥栈承受更多劳苦。换市应先查明使用与维护的关系，再议新的交割地点，免将便利建立在旁人的无偿付出上。"
 hbe_tech_southwestern_valleys_3_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。"
 hbe_tech_southwestern_valleys_4_desc: "商盟的互保离不开谷口的见证，远处的总账难以察看每一次实际交付。把报险与赔补交由相互认可的人查验，可以使小商户也愿意加入共同经营。"
 hbe_tech_southwestern_valleys_4_effects: "取得本圈旧约重审验收的课题资格。\n解锁机构生产方式：诸谷铁木联作。\n解锁“诸谷换市”：运行谷市盟栈、近五年完成本圈事业、役负低于70，且地方共治至少30时获得额外联动收益；条件不满足时暂停。"
 hbe_tech_southwestern_valleys_5_desc: "分散的谷市各有长处，也有无法独力承担的缺口。商盟应协调有限的采办与维护，使各乡在参与共同事业时仍保有自己的经营与旧例。"
 hbe_tech_southwestern_valleys_5_effects: "取得本圈地区重组及百年章程验收的课题资格。"
 hbe_tech_southwestern_valleys_6_desc: "山寨之间可以相互望见，却未必能够及时送出求援的消息。守望之约应包括报信、候援与避难的办法，而不是只约定危急时的一句相助。"
 hbe_tech_southwestern_valleys_6_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。"
 hbe_tech_southwestern_valleys_7_desc: "驻防带来守备，也带来粮料与驻地的负担。将当值期限、供给与旧权写进议约，才能使外来的援守得到实际受其影响的乡寨认可。"
 hbe_tech_southwestern_valleys_7_effects: "取得本圈旧约重审验收的课题资格。\n解锁“乡寨共保”：运行乡寨议约寨、近五年完成本圈事业、役负低于70，且完成本圈成长验收时获得额外联动收益；条件不满足时暂停。"
 hbe_tech_southwestern_valleys_8_desc: "共保盟府的权威应来自守约与受理争议，而非一味收走谷中的旧权。把驻守、互市与地方见证合在可查的盟约之内，才可能获得长久的支持。"
 hbe_tech_southwestern_valleys_8_effects: "取得本圈地区重组及百年章程验收的课题资格。"
 hbe_stance_change_1.title: "支持共建派"
 hbe_stance_change_1.title.entry: "支持共建派"
 hbe_stance_change_1.desc.entry: "改为支持共建派。当前已支持该派或距上次换派不足五年时不可办理；换派不会重置本届出资次数。原派其他成员对本府态度−5，每年恢复1点，最长五年。"
 hbe_stance_change_2.title: "支持兴业派"
 hbe_stance_change_2.title.entry: "支持兴业派"
 hbe_stance_change_2.desc.entry: "改为支持兴业派。当前已支持该派或距上次换派不足五年时不可办理；换派不会重置本届出资次数。原派其他成员对本府态度−5，每年恢复1点，最长五年。"
 hbe_stance_change_3.title: "转向兴业派"
 hbe_stance_change_3.title.entry: "转向[Concept('hbe_term_ledger', '兴业派')|e]"
 hbe_stance_change_3.desc.entry: "名望可以让一份承诺容易被接纳，却不能说明货物何时送达。我们愿以公账和凭据衡量共同事业，使出资者与承担者按实际交付取得回报。\n\n转向账房之议，是请诸侯将情面之外的责任写明。规矩越清楚，主持者也越须接受同样的查验。"
 hbe_project_fund.title: "为会盟出资"
 hbe_project_fund.title.entry: "为会盟出资"
 hbe_project_fund.desc.entry: "邻府的道路修好，本府的货物也能少走远路。我们可以拿出一笔钱，共同筹办这一届的[Concept('hbe_term_local_service', '地方事业')|e]。\n\n费用为月度贸易与税收收入的35%，最低2、最高64金币；每国每届一次。立即获得2信誉、1贡献和两年建设速度+11%、商人容量+11%。两派合计12贡献便能在本届结束时领取额外收益。"
 hbe_project_pledge.title: "分账会：先认账，届中付款"
 hbe_project_pledge.title.entry: "[Concept('hbe_term_round', '分账会')|e]：[Concept('hbe_term_pledge', '先认账')|e]，届中付款"
 hbe_project_pledge.desc.entry: "库中暂不便调度现钱，府臣却不愿因此错过本届共同事业。先签一份承诺，可以使主持者知道我们愿意分担，也把届中付款之日明白写定。\n\n印信并不能替代金币。核账之时若无款可交，本府便须承担违约的声望与公议后果。"
 hbe_project_reconsider.title: "分账会：撤回暂缓意见"
 hbe_project_reconsider.title.entry: "[Concept('hbe_term_round', '分账会')|e]：撤回暂缓意见"
 hbe_project_reconsider.desc.entry: "此前的暂缓之议已经传到各府，新的采办安排却使我们有了重新参与的余地。旧意见可以撤回，后来作出的承诺仍须与其他诸侯一样接受查验。\n\n在[Concept('hbe_term_commitment', '承诺期')|e]内改明立场，可以重新出资或认领[Concept('hbe_term_delivery', '地方援助')|e]，让本府的改变有实际事业可以支撑。"
 hbe_project_select_1.title: "本届工程：盐船共账"
 hbe_project_select_1.title.entry: "本届工程：[Concept('hbe_term_saltproject', '盐船共账')|e]"
 hbe_project_select_1.desc.entry: "井灶可以供盐，江岸可以转运，乡社可以核验粮数；三者若各自为政，货物便可能停在彼此的交接之间。\n\n皇帝将本届共同事业定为盐船运粮，先约定所需环节，再请有能力的府州认领交付。工程的名目由主持者提出，成果则必须由各圈实际完成。"
 hbe_project_select_2.title: "本届工程：茶马过蜀道"
 hbe_project_select_2.title.entry: "本届工程：[Concept('hbe_term_teaproject', '茶马过蜀道')|e]"
 hbe_project_select_2.desc.entry: "茶马互市不能只停留在集市的秤前。山路的接递、谷口的见证与采办的凭据同样决定一趟远行是否可靠。\n\n本届共同事业将围绕茶路展开，把远途交割与沿途维护一并记入公账，令不同山地的承诺能够在同一次验收中相互说明。"
 hbe_role_chengdu_plain.title: "本届交付：水粮担保"
 hbe_role_chengdu_plain.title.entry: "本届交付：水粮担保"
 hbe_role_chengdu_plain.desc.entry: "渠田、作坊与官学各有熟悉事务的掌事者，共同工程却需要他们的交付在同一期限内得到认可。\n\n我们愿认领这项专业合同，出钱备办并以地方储备作保。半年后的查验，将决定这份承诺能否成为本届工程真正齐备的一环。"
 hbe_role_southern_salt_wine.title: "本届交付：盐引承销"
 hbe_role_southern_salt_wine.title.entry: "本届交付：盐引承销"

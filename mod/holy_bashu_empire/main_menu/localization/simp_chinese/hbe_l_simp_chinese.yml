 hbe_coordinate_western_tea_horse.desc.entry: "川西茶马圈的维护不能全由主持者决定，却可以由他先认下一份费用。我们愿将本届地方储备与[Concept('hbe_term_alliance', '会盟')|e]信用用于此事，公布分摊，留下后续可查的凭据。\n\n在任且机构正常时，出资办理一次本圈协调，降低@hbe_burden! [Concept('hbe_term_burden', '役负')|e]、取得履约；三年间隔，续约科技可再减轻负担。"
 hbe_coordinate_western_tea_horse.a: "办理此事"
 hbe_guest_western_tea_horse.title: "订立川西茶马圈客籍议约"
 hbe_guest_western_tea_horse.title.entry: "订立川西茶马圈客籍议约"
 hbe_guest_western_tea_horse.desc: "整合一处旧府州，并不等于掌握当地所有技艺。本府愿认可旧日见证，承担机构维护，并请当地承办者依原约保留本业。\n\n研究「匠人互访」与「统一度量」，采用「乡社议办」，义气达到60，并拥有该圈至少一处直属土地后，可签订客籍议约。支付按月税贸收入75%计算的雇办费（最低3金币），消耗10义气，取得当地机构、基础生产方式及基础军制资格。营建仍限该圈土地，高级工艺须另行解锁，不复制地区科技的数值加成。"
 hbe_guest_western_tea_horse.desc.entry: "整合一处旧府州，并不等于掌握当地所有技艺。本府愿认可旧日见证，承担机构维护，并请当地承办者依原约保留本业。\n\n研究「匠人互访」与「统一度量」，采用「乡社议办」，义气达到60，并拥有该圈至少一处直属土地后，可签订客籍议约。支付按月税贸收入75%计算的雇办费（最低3金币），消耗10义气，取得当地机构、基础生产方式及基础军制资格。营建仍限该圈土地，高级工艺须另行解锁，不复制地区科技的数值加成。"
 hbe_guest_western_tea_horse.a: "办理此事"
 hbe_fuyi_southwestern_valleys: "乡寨驻防"
 hbe_fuyi_southwestern_valleys_desc: "将本圈的分摊与维护提交原版议会；通过后进入地方府议事件，沿用五年议事间隔。"
 hbe_civic.112.title: "谷市的农具：府议"
 hbe_civic.112.title.entry: "援军留在谷口"
 hbe_civic.112.desc: "谷市的铁木作坊接到一批农具订单，匠人却在为运料争执。官吏要求按期出货，[Concept('hbe_term_valleys', '乡寨')|e]长者说山民还须照管自己的田地，不能总随官府调遣。\n\n我们可以督促作坊交货，拨款修路并雇用工匠，或承认乡寨自行安排互市。作坊的收益、乡里的负担与官府的权威，今次很难一并照顾。\n\n府议已将争议送到我们面前。公款、地方储备与民役都有人提出，各方希望我们明确今后由谁承担费用。"
 hbe_civic.112.a: "府库付钱，给乡里减役。"
 hbe_civic.112.b: "动用地方储备，由乡社主持。"
 hbe_civic.112.c: "增征民役，加紧办完。"
 hbe_civic.113.title: "木契与印信：府议"
 hbe_civic.113.title.entry: "诸谷重签[Concept('hbe_term_contract', '旧约')|e]"
 hbe_civic.113.desc: "一桩铁料交易只有刻木为凭，府城书记不肯照约准运。谷中长者带来几名见证人，声称买卖早已成交，官吏此时扣料是在破坏乡约。\n\n我们可以要求作坊先交官府的货物，出资整修道路并请匠人重新签约，或准许[Concept('hbe_term_valleys', '乡寨')|e]沿用自己的互市凭证。\n\n府议已将争议送到我们面前。公款、地方储备与民役都有人提出，各方希望我们明确今后由谁承担费用。"
 hbe_civic.113.a: "府库付钱，给乡里减役。"
 hbe_civic.113.b: "动用地方储备，由乡社主持。"
 hbe_civic.113.c: "增征民役，加紧办完。"
 hbe_seek_southwestern_valleys.title: "请任诸谷约正"
 hbe_seek_southwestern_valleys.title.entry: "请任诸谷约正"
 hbe_seek_southwestern_valleys.desc: "川西南山谷圈的公账载明近期交付，圈署尚缺能够主持维护的人。我们愿将本府已经承担的事业作为凭据，申请这一届委任。\n\n须完成成长验收、本圈委任科技，维持机构，最近五年真实交付；任期五年，每国至多两项委任。"
 hbe_seek_southwestern_valleys.desc.entry: "川西南山谷圈的公账载明近期交付，圈署尚缺能够主持维护的人。我们愿将本府已经承担的事业作为凭据，申请这一届委任。\n\n须完成成长验收、本圈委任科技，维持机构，最近五年真实交付；任期五年，每国至多两项委任。"
 hbe_seek_southwestern_valleys.a: "办理此事"

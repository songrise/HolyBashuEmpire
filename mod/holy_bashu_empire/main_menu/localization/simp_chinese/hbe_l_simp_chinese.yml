 game_concept_hbe_term_feast_dividend: "派内分红"
 game_concept_hbe_term_feast_dividend_desc: "#T 每两年结算的派内分红#!\n无论共同目标是否完成，有贡献的成员都参与派内分红。每位贡献国按结算时半个月税贸收入增加一笔帝国奖金，最低8、最高64金币；再加上这些成员本届实际出资的25%，组成派内金币奖池。帝国奖金直接生成，不额外扣取任何成员的国库。每派另有3点威望。\n\n分配权重为ln(1＋本届贡献)：1、2、3贡献分别约为0.693、1.099、1.386。三贡献约得一贡献的两倍。\n个人金币或威望＝本派对应奖励池×个人权重÷本派权重总和。零贡献既不增加帝国奖金，也不领取奖励；仅完成[Concept('hbe_term_local_service', '地方事业')|e]而未现金出资，仍可获得金币与威望。8—64金币限制的是每位贡献国加入奖池的金额，个人最终分红按权重计算。\n\n例如两国贡献1与3、各出资2金币，且均触发最低奖金，奖池共17金币，分别领取约5.67和11.33金币。按结算时所属派系分配；换派不重置出资记录。共同成功另有的3点声望奖励仍保留。"

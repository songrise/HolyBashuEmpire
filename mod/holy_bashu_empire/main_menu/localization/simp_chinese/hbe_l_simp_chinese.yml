 country_history_BAX: "宋元之际的兵火曾使蜀地城郭与乡里凋敝，今日的渠堰、井灶与关驿仍须由留在当地的人重新接续。本剧本假设，朝廷以转运贡额和关津保证承认诸府共同签立的自治敕约：三十六府州分别治事，[Concept('hbe_term_circle', '七圈')|e]协调邻府，皇帝主持跨圈公议。此约是架空[Concept('hbe_term_alliance', '会盟')|e]的起点，并非史实中的四川帝国。\n\n[Concept('hbe_history_river', '川江')|e]的险滩令岸仓、引水人和船帮缺一不可。宋元攻守曾使沿江山城成为避难与守备之地；[Concept('hbe_term_alliance', '会盟')|e]中的川东既须守住寨门，也须保证仓场开放、军粮有据。\n\n昌州的地方经营介于丘陵与江路之间，市集的货物并不能凭一张水运图便自动抵达码头。沿路转运和府界上的查验，是本府每天都要处理的事务。\n\n重庆掌握圈中的[Concept('hbe_term_elector', '选侯')|e]席位，昌州则可在通行公约中为自己的商户争取便利。若选择崖岸守备，本府又须将驻守与供给同时办好。以小国的实务参与大圈的规则，是昌州扩张影响的可行之路。"

 hbe_civic_council.title: "召开本府府议"
 hbe_civic_council.title.entry: "召开本府府议"
 hbe_civic_council.desc: "各乡与承办者已将[Concept('hbe_term_contract', '旧约')|e]带到公所。府库愿先核对尚未解决的分摊，再决定下一轮事业的办理方式。\n\n每五年召开一次，依本圈选择出资、储备分摊或追加征办；拥有维护中的府议公所可降低事后负担，小国亦可借官署办理。"
 hbe_civic_council.desc.entry: "各乡与承办者已将[Concept('hbe_term_contract', '旧约')|e]带到公所。府库愿先核对尚未解决的分摊，再决定下一轮事业的办理方式。\n\n每五年召开一次，依本圈选择出资、储备分摊或追加征办；拥有维护中的府议公所可降低事后负担，小国亦可借官署办理。"
 hbe_civic_council.a: "办理此事"
 hbe_civic_relief.title: "议定减役与补偿"
 hbe_civic_relief.title.entry: "议定减役与补偿"
 hbe_civic_relief.desc: "征令送到乡里时，耕作与供养不会因此停止。我们应以府库承担部分支出，让先前因急征留下的责任逐步减轻。\n\n支付0.5个月税贸收入（至少2金），@hbe_burden! [Concept('hbe_term_burden', '役负')|e]降低10；三年内不得再次办理。"
 hbe_civic_relief.desc.entry: "征令送到乡里时，耕作与供养不会因此停止。我们应以府库承担部分支出，让先前因急征留下的责任逐步减轻。\n\n支付0.5个月税贸收入（至少2金），@hbe_burden! [Concept('hbe_term_burden', '役负')|e]降低10；三年内不得再次办理。"
 hbe_civic_relief.a: "办理此事"
 hbe_civic_garrison.title: "签认驻防粮额"
 hbe_civic_garrison.title.entry: "签认驻防粮额"
 hbe_civic_garrison.desc: "士卒须有固定粮额，驻地也须知道本府愿驻守多久。乡社见证人提出，把供给、轮替与查验写在同一纸约上，免使临时援守化作无期旧役。\n\n支付0.5个月税贸收入（至少2金），五年取得议约驻防资格，允许义仓团练与联寨山卒招募；到期需续办。"
 hbe_civic_garrison.desc.entry: "士卒须有固定粮额，驻地也须知道本府愿驻守多久。乡社见证人提出，把供给、轮替与查验写在同一纸约上，免使临时援守化作无期旧役。\n\n支付0.5个月税贸收入（至少2金），五年取得议约驻防资格，允许义仓团练与联寨山卒招募；到期需续办。"
 hbe_civic_garrison.a: "办理此事"
 hbe_fuyi_chengdu_plain: "渠工分水"
 hbe_fuyi_chengdu_plain_desc: "将本圈的分摊与维护提交原版议会；通过后进入地方府议事件，沿用五年议事间隔。"
 hbe_civic.100.title: "争水：府议"
 hbe_civic.100.title.entry: "下游未开渠"
 hbe_civic.100.desc: "上游乡民正在加高水口，以备夏日缺水。下游的庄户却来到府衙，声称新水口已让他们的田沟见底。双方都曾派人岁修，如今也都要求我们承认他们优先取水的权利。\n\n渠吏主张增调民夫，另开一道[Concept('hbe_term_water', '分水')|e]口。乡老愿按旧约自行安排，掌库官则提醒我们，雇工的钱只能从本府支出。\n\n府议已将争议送到我们面前。公款、地方储备与民役都有人提出，各方希望我们明确今后由谁承担费用。"
 hbe_civic.100.a: "府库付钱，给乡里减役。"
 hbe_civic.100.b: "动用地方储备，由乡社主持。"
 hbe_civic.100.c: "增征民役，加紧办完。"
 hbe_civic.101.title: "绣坊的订单：府议"
 hbe_civic.101.title.entry: "织机旁的学徒"
 hbe_civic.101.desc: "锦江边的绣坊收到一批外地衣料订单，商人愿预付银钱，条件是如期交货。绣工们却正逢农忙，许多家庭已有人被征去修堰。\n\n坊主请求官府督促交货，并优先保障桑田用水。乡老希望准许工匠缓役；若让乡社自行分派，我们也就得接受他们对[Concept('hbe_term_water', '工期')|e]和税额的安排。\n\n府议已将争议送到我们面前。公款、地方储备与民役都有人提出，各方希望我们明确今后由谁承担费用。"
 hbe_civic.101.a: "府库付钱，给乡里减役。"
 hbe_civic.101.b: "动用地方储备，由乡社主持。"
 hbe_civic.101.c: "增征民役，加紧办完。"
 hbe_seek_chengdu_plain.title: "请任分水都理"
 hbe_seek_chengdu_plain.title.entry: "请任分水都理"
 hbe_seek_chengdu_plain.desc: "成都平原圈的公账载明近期交付，圈署尚缺能够主持维护的人。我们愿将本府已经承担的事业作为凭据，申请这一届委任。\n\n须完成成长验收、本圈委任科技，维持机构，最近五年真实交付；任期五年，每国至多两项委任。"
 hbe_seek_chengdu_plain.desc.entry: "成都平原圈的公账载明近期交付，圈署尚缺能够主持维护的人。我们愿将本府已经承担的事业作为凭据，申请这一届委任。\n\n须完成成长验收、本圈委任科技，维持机构，最近五年真实交付；任期五年，每国至多两项委任。"
 hbe_seek_chengdu_plain.a: "办理此事"
 hbe_coordinate_chengdu_plain.title: "分水都理：主持本圈协调"
 hbe_coordinate_chengdu_plain.title.entry: "分水都理：主持本圈协调"
 hbe_coordinate_chengdu_plain.desc: "成都平原圈的维护不能全由主持者决定，却可以由他先认下一份费用。我们愿将本届地方储备与[Concept('hbe_term_alliance', '会盟')|e]信用用于此事，公布分摊，留下后续可查的凭据。\n\n在任且机构正常时，出资办理一次本圈协调，降低@hbe_burden! [Concept('hbe_term_burden', '役负')|e]、取得履约；三年间隔，续约科技可再减轻负担。"
 hbe_coordinate_chengdu_plain.desc.entry: "成都平原圈的维护不能全由主持者决定，却可以由他先认下一份费用。我们愿将本届地方储备与[Concept('hbe_term_alliance', '会盟')|e]信用用于此事，公布分摊，留下后续可查的凭据。\n\n在任且机构正常时，出资办理一次本圈协调，降低@hbe_burden! [Concept('hbe_term_burden', '役负')|e]、取得履约；三年间隔，续约科技可再减轻负担。"
 hbe_coordinate_chengdu_plain.a: "办理此事"
 hbe_guest_chengdu_plain.title: "订立成都平原圈客籍议约"
 hbe_guest_chengdu_plain.title.entry: "订立成都平原圈客籍议约"
 hbe_guest_chengdu_plain.desc: "整合一处旧府州，并不等于掌握当地所有技艺。本府愿认可旧日见证，承担机构维护，并请当地承办者依原约保留本业。\n\n研究「匠人互访」与「统一度量」，采用「乡社议办」，义气达到60，并拥有该圈至少一处直属土地后，可签订客籍议约。支付按月税贸收入75%计算的雇办费（最低3金币），消耗10义气，取得当地机构、基础生产方式及基础军制资格。营建仍限该圈土地，高级工艺须另行解锁，不复制地区科技的数值加成。"
 hbe_guest_chengdu_plain.desc.entry: "整合一处旧府州，并不等于掌握当地所有技艺。本府愿认可旧日见证，承担机构维护，并请当地承办者依原约保留本业。\n\n研究「匠人互访」与「统一度量」，采用「乡社议办」，义气达到60，并拥有该圈至少一处直属土地后，可签订客籍议约。支付按月税贸收入75%计算的雇办费（最低3金币），消耗10义气，取得当地机构、基础生产方式及基础军制资格。营建仍限该圈土地，高级工艺须另行解锁，不复制地区科技的数值加成。"
 hbe_guest_chengdu_plain.a: "办理此事"
 hbe_fuyi_southern_salt_wine: "盐引担保"
 hbe_fuyi_southern_salt_wine_desc: "将本圈的分摊与维护提交原版议会；通过后进入地方府议事件，沿用五年议事间隔。"
 hbe_civic.102.title: "井下与灶前：府议"
 hbe_civic.102.title.entry: "井架上的旧绳"
 hbe_civic.102.desc: "新打出的[Concept('hbe_term_salt', '盐井')|e]卤味颇浓，井主请求添灶开煎。盐商已等在井口，愿按约收走头几批井盐。灶户却呈报，汲卤绳索磨损严重，轮班的工人也已多日没有休息。\n\n掌盐官希望趁高价加紧煎盐。我们也可以拨款整修井架，让灶户轮休，或将采办与承销交给商人处理。\n\n府议已将争议送到我们面前。公款、地方储备与民役都有人提出，各方希望我们明确今后由谁承担费用。"
 hbe_civic.102.a: "府库付钱，给乡里减役。"
 hbe_civic.102.b: "动用地方储备，由乡社主持。"
 hbe_civic.102.c: "增征民役，加紧办完。"
 hbe_civic.103.title: "同一张盐引：府议"
 hbe_civic.103.title.entry: "换印不换债"
 hbe_civic.103.desc: "几名盐商持同样编号的引券来到府衙，都说自己有权收取下一批盐货。账房承认转押时未及时注销旧券，如今井主无法按所有契纸交货。\n\n多开几灶可以赶交欠货，却要灶户承担额外劳作。修整[Concept('hbe_term_salt', '井灶')|e]、重定工期需要府库垫款；商人也愿接下索偿，只要官府让出一部分承销权。\n\n府议已将争议送到我们面前。公款、地方储备与民役都有人提出，各方希望我们明确今后由谁承担费用。"
 hbe_civic.103.a: "府库付钱，给乡里减役。"
 hbe_civic.103.b: "动用地方储备，由乡社主持。"
 hbe_civic.103.c: "增征民役，加紧办完。"

 hbe_assembly: "召开帝国茶会"
 hbe_assembly.desc: "皇帝出资召集诸侯，讨论公共经费与自治。五年可召开一次。"
 hbe_assembly.a: "执行"
 hbe.1.title: "巴蜀敕书，诸侯开席"
 hbe.1.desc: "大元以稳定盐粮、茶马供应换取巴蜀自治。朝廷写的是治事会盟，我们印的是神圣帝国。\n你是三十六个独立诸侯之一；七圈协作，七席选侯。天府之国常驻加成：粮食产出与本地建造速度各 +10%。"
 hbe.1.a: "先把本府经营起来。"
 hbe.2.title: "课题告成"
 hbe.2.desc: "本国资助的地方课题已经完成。后续研究与地区验收现在可以在决议中推进。"
 hbe.2.a: "记入本府账簿。"
 hbe.3.title: "事业交付，账目入册"
 hbe.3.desc: "三年的地方投入已经交付。地区履约、@hbe_yiqi! 义气与临时经营收益已结算；这项事业五年后可以再办。"
 hbe.3.a: "这次确实出了力。"
 hbe.4.title: "会盟账本"
 hbe.4.desc: "本国@hbe_yiqi! 义气：[ROOT.GetVariable('hbe_yiqi').GetValue|0] / 100。\n帝国@hbe_guoqi! 锅气：[GetUniqueInternationalOrganization('hbe_empire').MakeScope.GetVariable('hbe_guoqi').GetValue|0] / 100。\n地区研究通过决议资助，完成计时后自动交付；同一时刻只能研究一项。\n自治盟约限制域外宣战与战争召集。百年经营继续开放，天府加成不会到期。"
 hbe.4.a: "账看完了，继续忙。"
 hbe.10.title: "第一代事业，第二本账"
 hbe.10.desc: "地方课题开始长成圈级事业。接下来的验收需要更成熟的研究与更多地区履约。"
 hbe.10.a: "旧约重认，事业续办。"
 hbe.11.title: "旧约重审，人人有功"
 hbe.11.desc: "三十五年过去，旧合同的受益者与新主持需要重新认账。深化课题与第三阶段任务继续开放。"
 hbe.11.a: "旧约重认，事业续办。"
 hbe.12.title: "地区重组，债随人走"
 hbe.12.desc: "皇帝换了，诸侯换了，欠条还在。地区终点研究与第四阶段任务现在进入长期治理。"
 hbe.12.a: "旧约重认，事业续办。"
 hbe.13.title: "八十五载，商路换了"
 hbe.13.desc: "外部市场和采购条件改变，但自治盟约仍然有效。保持地区事业，不断续办公共项目。"
 hbe.13.a: "旧约重认，事业续办。"
 hbe.14.title: "百年巴蜀，重新盖章"
 hbe.14.desc: "百年章程验收开放。地区治理须继续出资与履约；统一国家也可以继续维护本乡机构。"
 hbe.14.a: "旧约重认，事业续办。"
 hbe.5.title: "皇帝请喝茶，账单请看清"

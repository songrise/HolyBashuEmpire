 hbe_civic.110.title: "山外的茶客：府议"
 hbe_civic.110.title.entry: "向导请改山程"
 hbe_civic.110.desc: "来自山外的商人愿以较高价钱收走今年的边茶，要求茶坊不再向其他商队出售同样的货物。常年往来的驮户听闻此事，担心今后连采办都要仰人鼻息。\n\n独家承销能带来眼下的收益。若由府库分担[Concept('hbe_term_tea', '护行')|e]，各家商队便可继续入市；附近山门也请求留出一部分茶货，供来往僧侣与使者使用。\n\n府议已将争议送到我们面前。公款、地方储备与民役都有人提出，各方希望我们明确今后由谁承担费用。"
 hbe_civic.110.a: "府库付钱，给乡里减役。"
 hbe_civic.110.b: "动用地方储备，由乡社主持。"
 hbe_civic.110.c: "增征民役，加紧办完。"
 hbe_civic.111.title: "护行的价钱：府议"
 hbe_civic.111.title.entry: "山门灯火"
 hbe_civic.111.desc: "山道上的向导要求提高报酬，几支商队因此停在[Concept('hbe_term_tea', '茶市')|e]，不肯先行付款。茶坊等着发货，山门长者却提醒我们，近年的道路维护多由山民承担。\n\n一个大商队愿独家承销，以自己的护行费用抵偿差额。我们也可以分担费用开放互市，或留茶待客，借山门往来缓和争执。\n\n府议已将争议送到我们面前。公款、地方储备与民役都有人提出，各方希望我们明确今后由谁承担费用。"
 hbe_civic.111.a: "府库付钱，给乡里减役。"
 hbe_civic.111.b: "动用地方储备，由乡社主持。"
 hbe_civic.111.c: "增征民役，加紧办完。"

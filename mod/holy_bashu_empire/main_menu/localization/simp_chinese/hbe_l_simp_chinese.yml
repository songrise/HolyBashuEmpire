 hbe_seek_northern_shudao.desc: "川北[Concept('hbe_history_shudao', '蜀道')|e]圈的公账载明近期交付，圈署尚缺能够主持维护的人。我们愿将本府已经承担的事业作为凭据，申请这一届委任。\n\n须完成成长验收、本圈委任科技，维持机构，最近五年真实交付；任期五年，每国至多两项委任。"

 hbe_civic.108.title: "仓中余粮：府议"
 hbe_civic.108.title.entry: "借粮待来岁"
 hbe_civic.108.desc: "今年的秋收超过预料，仓吏却没有足够的人手翻晒新增[Concept('hbe_term_grain', '粮食')|e]。粮商愿立即买走余粮，乡老希望宽免去年向义仓借粮的贫户，乡兵头领则要求留下口粮。\n\n出售粮食能充实府库；整修仓廒并减免旧欠需要另付费用。若把余粮拨给乡兵，我们在下一季也得供养更多人。\n\n府议已将争议送到我们面前。公款、地方储备与民役都有人提出，各方希望我们明确今后由谁承担费用。"
 hbe_civic.108.a: "府库付钱，给乡里减役。"
 hbe_civic.108.b: "动用地方储备，由乡社主持。"
 hbe_civic.108.c: "增征民役，加紧办完。"
 hbe_civic.109.title: "借粮的归期：府议"
 hbe_civic.109.title.entry: "见证人的旧印"
 hbe_civic.109.desc: "赈贷册上有许多尚未归还的[Concept('hbe_term_grain', '粮食')|e]，出借者催促追偿，欠粮乡户却称近年的收成只够糊口。掌库官建议收回能收的部分，趁市价尚高售出。\n\n乡老请求减免欠粮并整修旧仓。乡兵也愿接手一部分仓储，条件是把这些粮食留作长期军粮。\n\n府议已将争议送到我们面前。公款、地方储备与民役都有人提出，各方希望我们明确今后由谁承担费用。"
 hbe_civic.109.a: "府库付钱，给乡里减役。"
 hbe_civic.109.b: "动用地方储备，由乡社主持。"
 hbe_civic.109.c: "增征民役，加紧办完。"

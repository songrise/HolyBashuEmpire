 hbe_propose_charter_3.title.entry: "[Concept('hbe_term_charter', '百年章程')|e]：[Concept('hbe_term_charter_contract', '各吃各的，账照样交')|e]"
 hbe_propose_charter_3.desc.entry: "百年的共同事业已留下许多可查的凭据，今日的诸侯却仍要选择今后怎样继续。此份章程主张按实际交付核定共同收益，以[Concept('hbe_term_contract', '契约')|e]保存彼此责任。\n\n皇帝将呈上草案，请旧府州的席位逐一授权；提出章程只开启议约，不能代替各圈的同意。"

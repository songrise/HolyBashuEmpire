 country_history_BBI: "宋元之际的兵火曾使蜀地城郭与乡里凋敝，今日的渠堰、井灶与关驿仍须由留在当地的人重新接续。本剧本假设，朝廷以转运贡额和关津保证承认诸府共同签立的自治敕约：三十六府州分别治事，[Concept('hbe_term_circle', '七圈')|e]协调邻府，皇帝主持跨圈公议。此约是架空[Concept('hbe_term_alliance', '会盟')|e]的起点，并非史实中的四川帝国。\n\n[Concept('hbe_history_shudao', '蜀道')|e]关驿连缀在山间，险隘可以阻敌，却不能自行修补桥栈或供给当值者。[Concept('hbe_history_shudao', '金牛道')|e]与剑门的历史给诸府留下声望，也留下轮戍、接递与关市该由谁出钱的长久争议。\n\n保宁的城郭连着川北往来的驿路，地方仓储与接递的文书都要按时到达。守备希望优先取得粮料，行旅则希望关市早日放行，两种需要常在同一条路上相遇。\n\n本府是[Concept('hbe_history_shudao', '蜀道')|e]圈最初的[Concept('hbe_term_elector', '选侯')|e]，可以以轮戍互援统筹关防，也可以以驿传总局协调通路。主持之权必须由当值与接递的记录支撑；若只令邻府承差而不说明分担，保宁的名望终会遭到质问。"

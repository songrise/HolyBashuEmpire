 hbe_civic.3.title: "圈署委任落印"
 hbe_civic.3.title.entry: "[Concept('hbe_term_civic_office', '圈署委任')|e]落印"
 hbe_civic.3.desc: "公账中的交付已经得到查验，圈中同意由本府暂任一项维护之责。落印不是对旧役的免除，也不是将其他诸侯的储备划入本府；它要求我们先能交代自己的承诺，再主持共同议题。\n\n这届委任为期五年。若机构失去供养，或@hbe_burden! [Concept('hbe_term_burden', '役负')|e]已经妨碍履约，委任便须提前交还；每个国家至多同时承担两项。"
 hbe_civic.3.a: "按簿履任，待期复核。"
 hbe_civic.4.title: "将印信交还圈中"
 hbe_civic.4.title.entry: "将印信交还圈中"
 hbe_civic.4.desc: "这一届维护委任已经到期，或其所依靠的机构无法再承担责任。掌事者将印信和旧簿一并带到案房，使下一位主持者知道尚有哪些未清之约。\n\n过去交付的功绩仍然保存在[Concept('hbe_term_alliance', '会盟')|e]公账中，退任不会抹去其记录；本府若恢复[Concept('hbe_term_operating', '机构供养')|e]，并完成新的[Concept('hbe_term_local_service', '地方事业')|e]，仍可争取下一届委任。"
 hbe_civic.4.a: "保存旧簿，明白交接。"
 hbe_civic.5.title: "乡里呈上减役之请"
 hbe_civic.5.title.entry: "乡里呈上减役之请"
 hbe_civic.5.desc: "征调的文书接连到来，乡里已经很难在田亩、修路与驻守之间安排人手。府臣仍能列出每道命令的理由，却无法解释为何它们合在一起，就应由同一批人无休止地承担。\n\n见证者请求重新议定期限。我们可以用现钱替代部分劳役，也可以暂缓急办；若继续维持旧额，本府的信用和阶层支持将一并受损。"
 hbe_civic.5.a: "出资补偿，并承诺复核。"
 hbe_civic.5.b: "放缓办理，给乡里留下耕作时日。"
 hbe_civic.5.c: "仍依旧额，命各乡按期到场。"
 hbe_civic.6.title: "共役公账的复核"
 hbe_civic.6.title.entry: "共役公账的复核"
 hbe_civic.6.desc: "案房把近年的付费、雇价与轮役分别抄列。旧簿中的总数尚能相合，却有一些支出只记承办人，有些征调只记乡名，继任者难以查明同一份责任是否被记了两次。\n\n复核将花费府库和书记的人手，能使未清的分摊得到处理，也为1457年之后的续约留下可循的凭据。"
 hbe_civic.6.a: "出资复核，公布承担与交付。"
 hbe_civic.6.b: "将未清的部分暂存，日后再查。"
 hbe_civic_audit.title: "复核共役公账"
 hbe_civic_audit.title.entry: "复核共役公账"
 hbe_civic_audit.desc: "旧账不应仅因更换主持者就成为无人认领的支出。我们请案房查明实际出资、供养与验收，留下一份各乡能够重新核对的册籍。\n\n完成公账审计[Concept('hbe_term_research', '课题')|e]，维护共役案房；五年一次，出资后@hbe_burden! [Concept('hbe_term_burden', '役负')|e]-8、@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]+3，取得十年修约凭据。"
 hbe_civic_audit.desc.entry: "旧账不应仅因更换主持者就成为无人认领的支出。我们请案房查明实际出资、供养与验收，留下一份各乡能够重新核对的册籍。\n\n完成公账审计[Concept('hbe_term_research', '课题')|e]，维护共役案房；五年一次，出资后@hbe_burden! [Concept('hbe_term_burden', '役负')|e]-8、@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]+3，取得十年修约凭据。"
 hbe_civic_audit.a: "办理此事"
 hbe_civic.7.title: "修约之后，仍须履约"
 hbe_civic.7.title.entry: "修约之后，仍须履约"
 hbe_civic.7.desc: "[Concept('hbe_term_charter', '百年章程')|e]早已确定了诸侯合作的方式，却没有使每一代人的负担自动相同。新的作坊、岸仓和驻守要用新的粮料，乡社和行会也应有机会指出旧额难以接续之处。\n\n今天的修约沿用已经承认的章程，不另造帝国代表席位。我们将依[Concept('hbe_term_common', '共锅')|e]、[Concept('hbe_term_divided', '分锅')|e]或[Concept('hbe_term_contract', '契约')|e]安排，明确未来五年的维护与分摊。"
 hbe_civic.7.a: "按现行章程续订维护。"
 hbe_civic.7.b: "保留[Concept('hbe_term_contract', '旧约')|e]，下一届再议。"
 hbe_civic_revision.title: "续订维护与驻守之约"
 hbe_civic_revision.title.entry: "续订维护与驻守之约"
 hbe_civic_revision.desc: "旧章程之下的新责任仍须有人出资，也须得到实际承担者认可。我们愿依最近的公账复核，重新签认未来五年的维护，免使长期合作只剩下最初的名号。\n\n1457年后、已有[Concept('hbe_term_charter', '百年章程')|e]与公账审计凭据可办理；三种章程均能续约，五年间隔，不改变三十六旧席。"
 hbe_civic_revision.desc.entry: "旧章程之下的新责任仍须有人出资，也须得到实际承担者认可。我们愿依最近的公账复核，重新签认未来五年的维护，免使长期合作只剩下最初的名号。\n\n1457年后、已有[Concept('hbe_term_charter', '百年章程')|e]与公账审计凭据可办理；三种章程均能续约，五年间隔，不改变三十六旧席。"
 hbe_civic_revision.a: "办理此事"

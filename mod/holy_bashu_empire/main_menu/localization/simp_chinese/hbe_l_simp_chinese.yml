 hbe_granary_militia_desc: "义仓团练从本地经营和议约中获得可靠人手，沿用本地区的训练办法。它的优势建立在固定职责之上，也保留相应弱点。\n\n1352年后开放，须完成本圈第二项[Concept('hbe_term_research', '课题')|e]并维持招募机构；由原版招募系统提供兵员和物资。\n所有议约军共用一个容量，@hbe_burden! [Concept('hbe_term_burden', '役负')|e]过高暂停新募。"
 hbe_tea_riders: "茶路护骑"

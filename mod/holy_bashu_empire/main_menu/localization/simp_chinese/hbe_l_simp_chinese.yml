 country_history_BBR: "宋元之际的兵火曾使蜀地城郭与乡里凋敝，今日的渠堰、井灶与关驿仍须由留在当地的人重新接续。本剧本假设，朝廷以转运贡额和关津保证承认诸府共同签立的自治敕约：三十六府州分别治事，[Concept('hbe_term_circle', '七圈')|e]协调邻府，皇帝主持跨圈公议。此约是架空[Concept('hbe_term_alliance', '会盟')|e]的起点，并非史实中的四川帝国。\n\n丘陵圈的塘堰、义仓和市集各有乡社维持。宋代赈济、仓储与[Concept('hbe_term_contract', '契约')|e]的旧事提供了可借鉴的经验，诸府仍须决定借粮何时偿还、见证由谁作保，才可让互济度过歉岁。\n\n遂宁的[Concept('hbe_term_local_service', '地方事业')|e]以乡田、市集与仓粮为根，丰歉之间的调剂决定了许多家庭能否继续经营。仓门的开闭看似属于府库，却会同时影响乡社信用与邻府的借贷。\n\n作为丘陵圈最初的[Concept('hbe_term_elector', '选侯')|e]，本府可主持义仓联社，也可发展诸侯公信会馆。替人保管粮食与替人裁定[Concept('hbe_term_contract', '契约')|e]，都要求主持者接受查验；遂宁必须使自身的公议权与实际承担的责任相称。"

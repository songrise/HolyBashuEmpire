 game_concept_hbe_term_local_service_desc: "#T 地方事业：本圈公共工程#!\n打开本国「内容 → 决议」，寻找本圈的事业决议：\n• 修渠分水与官学讲会\n• 井灶公账与宴席采办\n• 江岸转运与河防巡察\n• 关隘轮戍与驿路接力\n• 分仓赈贷与契约见证\n• 茶马采办与山门调停\n• 山谷互市与地方议约\n\n完成本圈第一项科技后开放。基础费用4金币，办理三年；国家共享五年开工间隔，役负须低于70。乡社议办还需完成本圈公议并有至少5地区储备；行会雇办需另付雇办费。\n\n工期结束后的月初自动结算，增加本圈储备和信誉，并激活五年内完成事业的联动资格。大开席进行期间，完成时增加2点本届贡献，每国每届限一次；开始办理时不计贡献。\n\n建造普通或特色建筑、完成科技、为会盟出资，均不等于完成地方事业。建筑可以增强事业收益，但必须实际完成上述三年项目。"

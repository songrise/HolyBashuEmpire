 hbe_mission_southwestern_valleys_4.desc: "川西南山谷圈的谷市、乡寨与地方见证仍须由实际承担者接续。[Concept('hbe_term_local_service', '地方事业')|e]渐有规模，分散的经营却开始争夺同样的备料与主持权。我们应先整理交接与查验，再将原本各自为政的事务纳入可靠的协作。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。\n\n#T 办理与验收#!\n地区重组验收需要研究、持续交付与真实出资。消耗 10 点@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]和 8 金币；@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]增加 5，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]增加 2。"

 hbe_banquet.1.title: "你这行省，怎么还选皇帝？"
 hbe_banquet.1.desc: "大元使者前来查盐粮交割，却发现三十六家正在给第七位选侯挪椅子。使者答应按旧敕书维护巴蜀自治，但诸侯必须共同担保工程与交付。\n你已参加「巴蜀大开席」。分账会每三年召开，拒绝某项出资仍保有成员席位。选择一项政治立场；各派均可经营和竞选皇帝。"
 hbe_banquet.1.a: "共锅派：公共事业，皇帝牵头。"
 hbe_banquet.1.b: "分锅派：各府自己管，圈里共同办。"
 hbe_banquet.1.c: "账房派：先看合同，再谈情义。"
 hbe_project_fund: "分账会：出资三金"
 hbe_project_fund.desc: "本届公共经费出资三金，取得个人履约一份。出资不替代地区专业交付；项目成功后才有共同收益。"
 hbe_project_fund.a: "执行"
 hbe_project_pledge: "分账会：先认账，届中付款"
 hbe_project_pledge.desc: "先签四金承诺，第十二个月核账。届时国库不足会违约，@hbe_dispute! 争席度上升；不强制把国库扣成负数。"
 hbe_project_pledge.a: "执行"
 hbe_banquet.2.title: "三十六张椅子，第三十七张账单"
 hbe_banquet.2.desc: "本届公共项目已经开账。盐船共账需要川南盐引、川东江运、川中核账；茶马过蜀道需要川西采购、川北驿路、山谷互市。\n前六个月可出资、认账或暂不参加。地区专业交付在决议中另行签约：支付二金与十点地区储备，半年后验收。本届第三十六个月统一结算。皇帝可以在前三个月改选工程。"
 hbe_banquet.2.a: "这次出三金。"
 hbe_banquet.2.b: "先认四金，届中兑付。"
 hbe_banquet.2.c: "本届先保留意见。"
 hbe_banquet.2.d: "留出额度，稍后签专业交付。"
 hbe_project_reconsider: "分账会：撤回暂缓意见"
 hbe_project_reconsider.desc: "在承诺期内重新参加，之后可以出资或签地区交付合同。"
 hbe_project_reconsider.a: "执行"
 hbe_project_select_1: "本届工程：盐船共账"
 hbe_project_select_1.desc: "皇帝在前三个月确定主工程，消耗三金。已有专业交付时不能改项；出资者和承诺保持有效。"
 hbe_project_select_1.a: "执行"

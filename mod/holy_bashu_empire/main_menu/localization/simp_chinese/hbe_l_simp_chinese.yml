 hbe.104.title: "仓中余粮"
 hbe.104.desc: "今年的秋收超过预料，仓吏却没有足够的人手翻晒新增[Concept('hbe_term_grain', '粮食')|e]。粮商愿立即买走余粮，乡老希望宽免去年向义仓借粮的贫户，乡兵头领则要求留下口粮。\n\n出售粮食能充实府库；整修仓廒并减免旧欠需要另付费用。若把余粮拨给乡兵，我们在下一季也得供养更多人。"

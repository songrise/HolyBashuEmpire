 hbe_office_count: "有效委任数"
 hbe_civic.1.title: "案房之外，还有乡里"
 hbe_civic.1.title.entry: "案房之外，还有乡里"
 hbe_civic.1.desc: "一项渠工、一段栈道或一批岸仓货物，都需要有人实际承担。府库的案房能记下支出，却不能替乡里决定谁来服役，也不能使一道征令变成各方认可的议约。\n\n从今以后，本府将把[Concept('hbe_term_local_service', '地方事业')|e]所留的@hbe_burden! [Concept('hbe_term_burden', '役负')|e]一并入册。府議公所、行会与乡社可以采取不同办法；将来圈署的委任，也须以真实交付而非一纸名号取得。"
 hbe_civic.1.a: "先看清本府能够承担什么。"
 hbe_civic.2.title: "本府民役与委任簿"
 hbe_civic.2.title.entry: "本府民役与委任簿"
 hbe_civic.2.desc: "府议簿不只记录完成了什么，也记载由谁承办、由谁付费，以及未能随一次交付清除的负担。历任主持者应在[Concept('hbe_term_contract', '旧约')|e]旁留下新签押，使乡里不必在每次换任后重新证明自己的责任。\n\n#T 本府公账#!\n@hbe_burden! [Concept('hbe_term_burden','役负')|e]：[ROOT.GetVariable('hbe_burden').GetValue|0] / 100。民役政策：[ROOT.GetVariable('hbe_labor_policy').GetValue|0]（0未立、1征办、2议办、3雇办）。\n有效[Concept('hbe_term_civic_office', '圈署委任')|e]：[ROOT.GetVariable('hbe_office_count').GetValue|0] / 2。特色军现额：[ROOT.GetVariable('hbe_special_record').GetValue|0]。\n分水都理：[ROOT.GetVariable('hbe_office_chengdu_plain').GetValue|0]（1在任、0未任）\n盐引会首：[ROOT.GetVariable('hbe_office_southern_salt_wine').GetValue|0]（1在任、0未任）\n江运总理：[ROOT.GetVariable('hbe_office_eastern_river').GetValue|0]（1在任、0未任）\n关驿都巡：[ROOT.GetVariable('hbe_office_northern_shudao').GetValue|0]（1在任、0未任）\n义仓监理：[ROOT.GetVariable('hbe_office_central_hills').GetValue|0]（1在任、0未任）\n茶路公议使：[ROOT.GetVariable('hbe_office_western_tea_horse').GetValue|0]（1在任、0未任）\n诸谷约正：[ROOT.GetVariable('hbe_office_southwestern_valleys').GetValue|0]（1在任、0未任）\n原版招募列表显示当前有效军额；@hbe_burden! [Concept('hbe_term_burden', '役负')|e]70以上暂停新募。"
 hbe_civic.2.a: "合上簿册。"

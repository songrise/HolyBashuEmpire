 country_history_BAJ: "宋元之际的兵火曾使蜀地城郭与乡里凋敝，今日的渠堰、井灶与关驿仍须由留在当地的人重新接续。本剧本假设，朝廷以转运贡额和关津保证承认诸府共同签立的自治敕约：三十六府州分别治事，[Concept('hbe_term_circle', '七圈')|e]协调邻府，皇帝主持跨圈公议。此约是架空[Concept('hbe_term_alliance', '会盟')|e]的起点，并非史实中的四川帝国。\n\n成都平原的水路使田亩与市镇相依，[Concept('hbe_history_dujiangyan', '都江堰')|e]的岁修、渠首的分水和锦坊的备料却各有承担者。平原圈须把丰饶背后的日常劳力写入公账，使官学的讲会与渠旁的旧例彼此说明。\n\n邛州的城郭与作坊连着平原西缘的行旅，器物的流转也连着乡里的日常生计。[Concept('hbe_history_qiong', '邛窑')|e]旧日的声名提醒掌事者：地方巧技只有得到可靠采办与传习，才能超出一时的好奇。\n\n在新的[Concept('hbe_term_alliance', '会盟')|e]中，邛州无需与大府争夺每一次主持权。修渠保产、组织作坊与参加匠人互访，都能为本府积累履约信誉。如何使工匠的长处成为诸侯共同需要的事业，将决定这座小国的前途。"
 country_description_category_name_hbe_profile_baj: "邛州：渠田、作坊与官学"

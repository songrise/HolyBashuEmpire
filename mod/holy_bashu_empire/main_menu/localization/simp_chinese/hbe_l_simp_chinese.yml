 hbe_mission_central_hills_4.desc.entry: "川中丘陵圈的塘堰、义仓与券据仍须由实际承担者接续。[Concept('hbe_term_local_service', '地方事业')|e]渐有规模，分散的经营却开始争夺同样的备料与主持权。我们应先整理交接与查验，再将原本各自为政的事务纳入可靠的协作。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。"
 hbe_mission_central_hills_5.title: "川中丘陵圈：百年章程"
 hbe_mission_central_hills_5.title.entry: "川中丘陵圈：[Concept('hbe_term_charter', '百年章程')|e]"
 hbe_mission_central_hills_5.desc.entry: "川中丘陵圈的塘堰、义仓与券据仍须由实际承担者接续。百年前的开创者已经不在，今日的乡里仍在使用他们留下的道路与规矩。把实际交付写入新的章程，是让后来的主持者能够继续治事，而非只诵读先人的名号。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。"
 hbe_service_western_tea_horse.title: "茶马采办与山门调停"
 hbe_service_western_tea_horse.title.entry: "茶马采办与山门调停"
 hbe_service_western_tea_horse.desc.entry: "川西茶马圈的茶市、商队与山门不能只在[Concept('hbe_term_alliance', '会盟')|e]之时才受重视。府臣请将备料、主持与查验分别入册，使日常经营有持续的接续。\n\n本府愿[Concept('hbe_term_trial', '出资试办')|e]三年，验收后再将成果与地方储备一并登记；只有真实完成的事业，才值得要求邻府认可。\n\n#T 民役与供养#!\n@hbe_burden! [Concept('hbe_term_burden', '役负')|e]70以上暂停新办。府额征办结算+6@hbe_burden! [Concept('hbe_term_burden', '役负')|e]；乡社议办结算+2并额外+1@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]，开工储备须5并有五年内府议认约；行会雇办另付按税贸收入计的雇价，结算不加@hbe_burden! [Concept('hbe_term_burden', '役负')|e]。"
 hbe_mission_western_tea_horse_1.title: "川西茶马圈：起业"
 hbe_mission_western_tea_horse_1.title.entry: "川西茶马圈：起业"
 hbe_mission_western_tea_horse_1.desc.entry: "川西茶马圈的茶市、商队与山门仍须由实际承担者接续。共同事业初立，乡里的旧例仍各有写法。我们应先把本府承担的一项实务交付清楚，让圈中诸侯看见可以查验的成果。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。"
 hbe_mission_western_tea_horse_2.title: "川西茶马圈：成长"
 hbe_mission_western_tea_horse_2.title.entry: "川西茶马圈：成长"
 hbe_mission_western_tea_horse_2.desc.entry: "川西茶马圈的茶市、商队与山门仍须由实际承担者接续。最初的试办已有人接续，下一步却不能只沿用主持者个人的情面。让承担者、使用者与府库共同认可凭据，地方经营才能逐步成为常例。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。"

 hbe_civic_over_supply: "议约军供养不足"
 hbe_civic_over_supply_desc: "议约军供养不足持续期间按所列数值生效；重复维护只替换期限，不叠加。"
 hbe_term_burden: "@hbe_burden! [Concept('hbe_term_burden', '役负')|e]"
 hbe_term_burden_desc: "全国0—100的徭役和驻地压力，初始20。事业征办+6、议办+2、雇办不增加；新募议约军每队+1。和平且近年无急征时每年-3，付费减役可另降10。40起影响农民支持，70起暂停事业和新募，并触发有五年间隔的请愿。"
 hbe_term_civic_office: "[Concept('hbe_term_civic_office', '圈署委任')|e]"
 hbe_term_civic_office_desc: "须委任科技、成长验收、有效机构与最近五年真实交付。一个圈同时一位主持，每国至多两任，任期五年；断供、失去[Concept('hbe_term_alliance', '会盟')|e]或@hbe_burden! [Concept('hbe_term_burden', '役负')|e]70以上提前退任。请任按空缺和明确资格办理，不增加皇帝选票或帝国旧席。"
 hbe_term_operating: "[Concept('hbe_term_operating', '机构供养')|e]"
 hbe_term_operating_desc: "本府拥有机构，有效建筑等级至少0.25，且有同类机构实际雇用至少50人。原版有效等级随供养变化；不满足则暂停相应招募和委任。原版建筑本身的效果亦依就业与商品获取缩放。"
 hbe_term_civic_army: "[Concept('hbe_term_civic_army', '议约军额')|e]"
 hbe_term_civic_army_desc: "九种军种共用一个原版unit family。以潜在陆军人数20%折算500人单位，并以有效地区机构总等级取较小值；能供养500人时至少容许一队，前提是机构容量达一队。@hbe_burden! [Concept('hbe_term_burden', '役负')|e]70时容量归零，新募停止；现有部队不删除，超过容量时全军维护效率-10%。"
 hbe_term_civic_policy: "[Concept('hbe_term_civic_policy', '民役议约')|e]"
 hbe_term_civic_policy_desc: "原版民役法律内择一政策，选择后五年锁定。征办承受@hbe_burden! [Concept('hbe_term_burden', '役负')|e]，议办保留地方见证，雇办付现钱。它与大开席的三种章程分别治理国内办理方式和跨府合作，不共用投票。"

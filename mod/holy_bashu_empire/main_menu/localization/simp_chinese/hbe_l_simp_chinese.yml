 hbe_project_subsidize.title: "皇帝垫账：补一项缺口"
 hbe_project_subsidize.title.entry: "[Concept('hbe_term_subsidy', '皇帝垫账')|e]：补一项缺口"
 hbe_project_subsidize.desc.entry: "验收的日子渐近，账册中仍有一项无人交足。若任其空缺，已出资与已交货的府州也将失去共同事业的回报。\n\n皇帝可以出钱聘请本地机构补办，但补缺并不免去原有查验。本届仅能这样垫付一次，主持者须慎重选择何时动用府库。"
 hbe_audit_accounts.title: "公开公账：三金核账"
 hbe_audit_accounts.title.entry: "[Concept('hbe_term_audit', '公开公账')|e]：[Concept('hbe_term_audit', '三金核账')|e]"
 hbe_audit_accounts.desc.entry: "诸侯各自保存的凭据已经到了堂上，争执却仍在于同一笔交付究竟由谁认领。继续争论名望，只会使下届采办同样受阻。\n\n我们愿拨款公开核账，使出资、货物与未履行的责任逐项相对。经得起查验的公账，才能让不同府州继续合作。"
 hbe_banquet_ledger.title: "查看两派与本届收益"
 hbe_banquet_ledger.title.entry: "查看两派与本届收益"
 hbe_banquet_ledger.desc.entry: "查看两派成员、本届贡献和奖励。\n\n出资记1贡献，完成[Concept('hbe_term_local_service', '地方事业')|e]记2贡献。每两年结算，达到共同目标后，两派参与国都能获益；贡献领先的派另有奖励。"
 hbe_propose_charter_1.title: "百年章程：一锅巴蜀"
 hbe_propose_charter_1.title.entry: "[Concept('hbe_term_charter', '百年章程')|e]：[Concept('hbe_term_charter_common', '一锅巴蜀')|e]"
 hbe_propose_charter_1.desc.entry: "百年的共同事业已留下许多可查的凭据，今日的诸侯却仍要选择今后怎样继续。此份章程主张集中主持共同工程，并由皇帝承担持续维护。\n\n皇帝将呈上草案，请旧府州的席位逐一授权；提出章程只开启议约，不能代替各圈的同意。"
 hbe_ballot_vote_1.title: "章程授权：支持一锅巴蜀"
 hbe_ballot_vote_1.title.entry: "章程授权：支持[Concept('hbe_term_charter_common', '一锅巴蜀')|e]"
 hbe_ballot_vote_1.desc.entry: "百年的共同事业已留下许多可查的凭据，今日的诸侯却仍要选择今后怎样继续。此份章程主张集中主持共同工程，并由皇帝承担持续维护。\n\n本府将以所掌握的旧席签认此案。每圈须取得本圈席位的严格多数，至少四圈同意，章程方能成为共同认可的安排。"
 hbe_propose_charter_2.title: "百年章程：万国茶会"
 hbe_propose_charter_2.title.entry: "[Concept('hbe_term_charter', '百年章程')|e]：[Concept('hbe_term_charter_divided', '万国茶会')|e]"

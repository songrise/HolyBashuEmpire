 hbe_mission_eastern_river_5.desc: "重庆川东圈的码头、船帮与岸仓仍须由实际承担者接续。百年前的开创者已经不在，今日的乡里仍在使用他们留下的道路与规矩。把实际交付写入新的章程，是让后来的主持者能够继续治事，而非只诵读先人的名号。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。\n\n#T 办理与验收#!\n[Concept('hbe_term_charter', '百年章程')|e]验收需要研究、持续交付与真实出资。消耗 10 点@hbe_river! [Concept('hbe_term_river', '江运互保')|e]和 10 金币；@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]增加 5，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]增加 2。"
 hbe_mission_eastern_river_5.a: "依议办理。"
 hbe.102.title: "码头的船位"
 hbe.102.desc: "江水上涨后，数批商货一同抵达码头。[Concept('hbe_term_river', '船帮')|e]要求先装价高的货物，仓吏却担心粮船再等几日就会误了交割。江岸守军也在征用渡船，催促把兵员送到对岸。\n\n我们可以向商人出售优先装运的船位，出资扩充护航与修船，或先满足守军的调度。船只有限，今次无法同时照顾各方。"
 hbe.102.a: "优先装运商货，收取加急费用。"
 hbe.102.b: "府库承担护航与修船开支。"
 hbe.102.c: "把船只留给江岸守军。"
 hbe_service_northern_shudao: "关隘轮戍与驿路接力"
 hbe_service_northern_shudao.desc: "川北[Concept('hbe_history_shudao', '蜀道')|e]圈的关堡、驿站与桥栈不能只在[Concept('hbe_term_alliance', '会盟')|e]之时才受重视。府臣请将备料、主持与查验分别入册，使日常经营有持续的接续。\n\n本府愿[Concept('hbe_term_trial', '出资试办')|e]三年，验收后再将成果与地方储备一并登记；只有真实完成的事业，才值得要求邻府认可。\n\n#T 办理与验收#!\n投入 4 金币，三年后交付本圈事业，取得 10 点@hbe_roads! [Concept('hbe_term_roads', '轮戍履约')|e]、3 点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]与五年经营收益。\n当前@hbe_roads! [Concept('hbe_term_roads', '轮戍履约')|e]：[ROOT.GetVariable('hbe_roads').GetValue|0]。\n\n#T 民役与供养#!\n@hbe_burden! [Concept('hbe_term_burden', '役负')|e]70以上暂停新办。府额征办结算+6@hbe_burden! [Concept('hbe_term_burden', '役负')|e]；乡社议办结算+2并额外+1@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]，开工储备须5并有五年内府议认约；行会雇办另付按税贸收入计的雇价，结算不加@hbe_burden! [Concept('hbe_term_burden', '役负')|e]。"
 hbe_service_northern_shudao.a: "依议办理。"
 hbe_mission_northern_shudao_1: "川北[Concept('hbe_history_shudao', '蜀道')|e]圈：起业"
 hbe_mission_northern_shudao_1.desc: "川北[Concept('hbe_history_shudao', '蜀道')|e]圈的关堡、驿站与桥栈仍须由实际承担者接续。共同事业初立，乡里的旧例仍各有写法。我们应先把本府承担的一项实务交付清楚，让圈中诸侯看见可以查验的成果。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。\n\n#T 办理与验收#!\n起业验收需要研究、持续交付与真实出资。消耗 10 点@hbe_roads! [Concept('hbe_term_roads', '轮戍履约')|e]和 2 金币；@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]增加 5，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]增加 2。"

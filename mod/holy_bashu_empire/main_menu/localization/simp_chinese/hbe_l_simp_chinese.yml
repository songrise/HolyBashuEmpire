 hbe_banquet.3.title: "交付不是在纸上画个勾"
 hbe_banquet.3.desc: "盐货、驿路或公账的半年合同已经验收。专业交付已经记入本届项目，个人履约增加二份；水粮担保提高@hbe_guoqi! 锅气。最终工程收益将在分账会结束时结算。"
 hbe_banquet.3.a: "把货与签押一起收好。"
 hbe_banquet.4.title: "船到了，账也对上了"
 hbe_banquet.4.desc: "三个关键环节全部交付，本届公共项目结算成功。实际出资或交付的诸侯取得三年地方经营收益；未参加者保留自治与席位，下届再选。"
 hbe_banquet.4.a: "这一届，总算没白忙。"
 hbe_banquet.5.title: "盐船没来，菜单先来了"
 hbe_banquet.5.desc: "本届项目缺少关键交付，或者@hbe_dispute! 争席度达到七十五，工程无法按期结清。@hbe_guoqi! 锅气下降，@hbe_dispute! 争席度上升；履约诸侯保留个人记录，但没有成功工程收益。自治敕书仍然有效。"
 hbe_banquet.5.a: "下届重开账，不撕敕书。"
 hbe_banquet.6.title: "签押还在，国库空了"
 hbe_banquet.6.desc: "你承诺的四金没有按期到账。本届履约取消，@hbe_yiqi! 义气减少八，@hbe_dispute! 争席度增加五。未强行向国库追扣；下届可以以真实交付恢复信用。"
 hbe_banquet.6.a: "欠的不是一张签名。"
 hbe_project_subsidize: "皇帝垫账：补一项缺口"
 hbe_project_subsidize.desc: "支付十金聘请本地机构补交一个缺失环节。本届限一次；优先补第一项，再补第二、第三项。"
 hbe_project_subsidize.a: "执行"
 hbe_audit_accounts: "公开公账：三金核账"
 hbe_audit_accounts.desc: "支付三金，降低四点@hbe_dispute! 争席度并增加二点@hbe_yiqi! 义气；两年可核账一次。"
 hbe_audit_accounts.a: "执行"
 hbe_banquet_ledger: "查看大开席账本"
 hbe_banquet_ledger.desc: "查看立场、本届交付、@hbe_dispute! 争席度、长期章程和个人履约。"
 hbe_banquet_ledger.a: "执行"
 hbe_banquet.7.title: "席位、账目与锅底"
 hbe_banquet.7.desc: "本国立场：[ROOT.GetVariable('hbe_stance').GetValue|0]（1 共锅、2 分锅、3 账房）。个人履约：[ROOT.GetVariable('hbe_contribution').GetValue|0]。\n阶段：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_chapter').GetValue|0] / 5。@hbe_dispute! 争席度：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_dispute').GetValue|0] / 100。\n届次：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_round').GetValue|0]；本届月份：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_round_month').GetValue|0] / 36。\n主工程：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_project_kind').GetValue|0]（1 盐船共账、2 茶马过蜀道）。三项交付：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_role_1').GetValue|0] / [GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_role_2').GetValue|0] / [GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_role_3').GetValue|0]。\n成功工程：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_completed_projects').GetValue|0]。章程：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_charter').GetValue|0]（0 未定、1 共锅、2 分锅、3 账房）。\n百年章程至少在1437年、第五阶段与三十次成功工程后提案，由七圈授权表决。合并诸侯后，原府州首府仍构成固定代表席位。"
 hbe_banquet.7.a: "账看完了，继续忙。"
 hbe_banquet.12.title: "账单送到谁家"
 hbe_banquet.12.desc: "第一代合作已经验收，分账方式成为政治议题。公账、盐引与跨圈的技术路线开始影响履约。"
 hbe_banquet.12.a: "旧约重认，事业续办。"
 hbe_banquet.13.title: "祖宗坐过这个位置"
 hbe_banquet.13.desc: "旧约经历一代人。合并的旧府州仍通过原首府拥有固定代表席；释放小国不会平白增加票数。"
 hbe_banquet.13.a: "旧约重认，事业续办。"
 hbe_banquet.14.title: "换皇帝，还是换锅底"
 hbe_banquet.14.desc: "共同项目与旧债积累多年。中央财政、圈级自治和契约治理开始争夺下一代章程。"
 hbe_banquet.14.a: "旧约重认，事业续办。"
 hbe_banquet.15.title: "百年了，重新排座次"
 hbe_banquet.15.desc: "进入百年重审阶段；1437年以后且成功项目至少三十次，皇帝可以提请七圈授权。1457年以后分账与地方事件继续。"
 hbe_banquet.15.a: "旧约重认，事业续办。"
 hbe_propose_charter_1: "百年章程：一锅巴蜀"
 hbe_propose_charter_1.desc: "皇帝出五金、消耗二十@hbe_guoqi! 锅气，开启六个月授权表决。每圈须有超过半数原府州席位赞成，七圈至少四圈支持。原三十六首府的当前帝国成员领主行使席位，释放小国不增加席位。失败后五年才能重提。"
 hbe_propose_charter_1.a: "执行"
 hbe_ballot_vote_1: "章程授权：支持一锅巴蜀"
 hbe_ballot_vote_1.desc: "明确支持这一份章程，替代本国上次表态；六个月议决期间可调整。本国拥有多个原首府时一并行使这些固定席位。"
 hbe_ballot_vote_1.a: "执行"
 hbe_propose_charter_2: "百年章程：万国茶会"
 hbe_propose_charter_2.desc: "皇帝出五金、消耗二十@hbe_guoqi! 锅气，开启六个月授权表决。每圈须有超过半数原府州席位赞成，七圈至少四圈支持。原三十六首府的当前帝国成员领主行使席位，释放小国不增加席位。失败后五年才能重提。"
 hbe_propose_charter_2.a: "执行"
 hbe_ballot_vote_2: "章程授权：支持万国茶会"
 hbe_ballot_vote_2.desc: "明确支持这一份章程，替代本国上次表态；六个月议决期间可调整。本国拥有多个原首府时一并行使这些固定席位。"
 hbe_ballot_vote_2.a: "执行"
 hbe_propose_charter_3: "百年章程：各吃各的，账照样交"
 hbe_propose_charter_3.desc: "皇帝出五金、消耗二十@hbe_guoqi! 锅气，开启六个月授权表决。每圈须有超过半数原府州席位赞成，七圈至少四圈支持。原三十六首府的当前帝国成员领主行使席位，释放小国不增加席位。失败后五年才能重提。"
 hbe_propose_charter_3.a: "执行"
 hbe_ballot_vote_3: "章程授权：支持各吃各的，账照样交"
 hbe_ballot_vote_3.desc: "明确支持这一份章程，替代本国上次表态；六个月议决期间可调整。本国拥有多个原首府时一并行使这些固定席位。"
 hbe_ballot_vote_3.a: "执行"
 hbe_banquet.20.title: "皇帝递来一张百年合同"
 hbe_banquet.20.desc: "皇帝已提请百年章程授权。各圈以原府州首府为固定席位：本圈超过半数赞成才能授权，七圈至少四圈通过。\n你可以批准当前提案，或要求保持现约；六个月内也可在决议中改变表态。"
 hbe_banquet.20.a: "同意本次提案。"
 hbe_banquet.20.b: "现约先留着，提案再改改。"
 hbe_banquet.21.title: "这次盖章，真有七圈的印"
 hbe_banquet.21.desc: "至少四圈正式授权，百年章程生效。共锅章程提高本地建造速度，皇帝每年承担一金维护；分锅章程提高粮食产出，地区事业交付追加声望；契约章程各项提高少量，成功出资者取得合同返还。分账会和区域机构继续运行。"
 hbe_banquet.21.a: "锅底换了，账还要记。"
 hbe_banquet.22.title: "七圈的印，少了几枚"
 hbe_banquet.22.desc: "本次章程没有取得至少四圈授权。旧章继续，@hbe_dispute! 争席度增加五，五年后可重提；已完成的地区项目和个人履约保留。"
 hbe_banquet.22.a: "皇帝可以提案，不能替圈盖章。"
 hbe_banquet.23.title: "锅底都换了，欠条还在"
 hbe_banquet.23.desc: "@hbe_dispute! 争席度已到七十五。诸侯提出暂停公共项目结算，先清旧债与轮值主持权。可以共同出资核账、消耗积累的@hbe_guoqi! 锅气和解，或坚持独立处理。外部自治敕书继续生效。"
 hbe_banquet.23.a: "出五金，公开账簿。"
 hbe_banquet.23.b: "以共同信用担保调停。"
 hbe_banquet.23.c: "本府自理，先保留意见。"
 hbe_banquet.100.title: "上游说修渠，下游说放水"
 hbe_banquet.100.desc: "新闸门刚装好，上游称蓄水是为了全圈，下游却拿着干田要求共同验收。\n@hbe_water! 水权储备与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.100.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.100.b: "以成熟地方技术公开凭据。"
 hbe_banquet.100.c: "先顾本府，另开一本账。"
 hbe_banquet.101.title: "锦官城的座次图"
 hbe_banquet.101.desc: "成都官学绘制帝国座次图，把本城画在中央。其他府州要求把出资与水权一起写上去。\n@hbe_water! 水权储备与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.101.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.101.b: "以成熟地方技术公开凭据。"
 hbe_banquet.101.c: "先顾本府，另开一本账。"
 hbe_banquet.102.title: "都江堰不认选票"
 hbe_banquet.102.desc: "百年旧闸需要换木梁，选侯争论谁能在新梁上刻名字；工匠只关心木料是否送到。\n@hbe_water! 水权储备与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.102.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.102.b: "以成熟地方技术公开凭据。"
 hbe_banquet.102.c: "先顾本府，另开一本账。"
 hbe_banquet.103.title: "皇帝点菜，盐商结账"
 hbe_banquet.103.desc: "宴席菜单写着盐商赞助，盐商的借据却写着全帝国担保。两张纸正在同桌流传。\n@hbe_salt! 盐引信用与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.103.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.103.b: "以成熟地方技术公开凭据。"
 hbe_banquet.103.c: "先顾本府，另开一本账。"
 hbe_banquet.104.title: "盐引背面还有盐引"
 hbe_banquet.104.desc: "新式承销把旧债叠在新盐引下面，账面信用很好，仓里的盐却没有增加。\n@hbe_salt! 盐引信用与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.104.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.104.b: "以成熟地方技术公开凭据。"
 hbe_banquet.104.c: "先顾本府，另开一本账。"
 hbe_banquet.105.title: "三代灶户，一张百年欠条"
 hbe_banquet.105.desc: "井灶换了三代人，旧工程欠条仍以祖父的名字追认。灶户要求重审而不是重抄。\n@hbe_salt! 盐引信用与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.105.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.105.b: "以成熟地方技术公开凭据。"
 hbe_banquet.105.c: "先顾本府，另开一本账。"
 hbe_banquet.106.title: "重庆说上席不在上游"
 hbe_banquet.106.desc: "重庆使者拒绝按河流方向排座次，称转运的关键是到港，不是离源头近。\n@hbe_river! 江运互保与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.106.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.106.b: "以成熟地方技术公开凭据。"
 hbe_banquet.106.c: "先顾本府，另开一本账。"
 hbe_banquet.107.title: "过滩一次，收费三次"
 hbe_banquet.107.desc: "同一条盐船在三个辖境盖了四次章。@hbe_river! 江运互保允许核查哪一次确有护航。\n@hbe_river! 江运互保与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.107.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.107.b: "以成熟地方技术公开凭据。"
 hbe_banquet.107.c: "先顾本府，另开一本账。"
 hbe_banquet.108.title: "码头换主，船牌不换"
 hbe_banquet.108.desc: "府州合并后，新领主把旧船牌当成外邦凭证。船主要求承认仍在帝国内的共同合同。\n@hbe_river! 江运互保与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.108.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.108.b: "以成熟地方技术公开凭据。"
 hbe_banquet.108.c: "先顾本府，另开一本账。"
 hbe_banquet.109.title: "祖传轮戍，轮到别人"
 hbe_banquet.109.desc: "各府都拿出祖上传下来的免轮戍书，关口的守军只能一人检查六份免役凭证。\n@hbe_roads! 轮戍履约与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.109.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.109.b: "以成熟地方技术公开凭据。"
 hbe_banquet.109.c: "先顾本府，另开一本账。"
 hbe_banquet.110.title: "驿马在账上跑得最快"
 hbe_banquet.110.desc: "驿路账簿显示一天百里，驿站却说马在去年就退休了。路政研究可以追查虚报的段落。\n@hbe_roads! 轮戍履约与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.110.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.110.b: "以成熟地方技术公开凭据。"
 hbe_banquet.110.c: "先顾本府，另开一本账。"
 hbe_banquet.111.title: "剑门借印，不借守军"
 hbe_banquet.111.desc: "新任主持请邻府借关印，好在茶会上证明轮值完成；邻府要求先见人再见印。\n@hbe_roads! 轮戍履约与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.111.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.111.b: "以成熟地方技术公开凭据。"
 hbe_banquet.111.c: "先顾本府，另开一本账。"
 hbe_banquet.112.title: "义仓赈粮，亲戚先领"
 hbe_banquet.112.desc: "仓单上排在前面的姓氏过于整齐。核账官建议按受灾与库存重新排榜。\n@hbe_grain! 义仓储备与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.112.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.112.b: "以成熟地方技术公开凭据。"
 hbe_banquet.112.c: "先顾本府，另开一本账。"
 hbe_banquet.113.title: "调停书比诉状还厚"
 hbe_banquet.113.desc: "两个府州争的原是三亩边田，契约见证处把三代账本都抬来了。裁决需要把旧功与新债分开。\n@hbe_grain! 义仓储备与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.113.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.113.b: "以成熟地方技术公开凭据。"
 hbe_banquet.113.c: "先顾本府，另开一本账。"
 hbe_banquet.114.title: "丰收年也要翻旧仓"
 hbe_banquet.114.desc: "丰年里无人愿意承担义仓维护。粮政研究指出，公共储备不能只在歉收年记一次。\n@hbe_grain! 义仓储备与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.114.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.114.b: "以成熟地方技术公开凭据。"
 hbe_banquet.114.c: "先顾本府，另开一本账。"
 hbe_banquet.115.title: "茶价未涨，印章先涨"
 hbe_banquet.115.desc: "茶马采购仍按旧价收货，沿线却多了几个收盖章费的山门。\n@hbe_tea! 商队互保与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.115.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.115.b: "以成熟地方技术公开凭据。"
 hbe_banquet.115.c: "先顾本府，另开一本账。"
 hbe_banquet.116.title: "马认识路，诸侯不认账"
 hbe_banquet.116.desc: "商队已翻过山口，采购府州和运输府州都说另一方应付山门调停费。\n@hbe_tea! 商队互保与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.116.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.116.b: "以成熟地方技术公开凭据。"
 hbe_banquet.116.c: "先顾本府，另开一本账。"
 hbe_banquet.117.title: "山门茶会，谁算东道"
 hbe_banquet.117.desc: "调停寺院为两位领主各留一把主位，结果被要求再为旧府州保留第三把。\n@hbe_tea! 商队互保与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.117.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.117.b: "以成熟地方技术公开凭据。"
 hbe_banquet.117.c: "先顾本府，另开一本账。"
 hbe_banquet.118.title: "谷口的敕书有两个译本"
 hbe_banquet.118.desc: "同一份共治条款在谷内表示轮值商谈，在府城表示统一征收。翻译已经成为财政问题。\n@hbe_valleys! 地方共治与课题路线会影响处理办法；旧问题可以在下一代重新发生。"
 hbe_banquet.118.a: "按共同合同处理，拨二金核验。"
 hbe_banquet.118.b: "以成熟地方技术公开凭据。"
 hbe_banquet.118.c: "先顾本府，另开一本账。"
 hbe_banquet.119.title: "互市赶集，不能只赶账"
 hbe_banquet.119.desc: "互市商贩按旧惯例以物换物，账房要求统一交割；@hbe_valleys! 地方共治可以协调两种凭证。\n@hbe_valleys! 地方共治与课题路线会影响处理办法；旧问题可以在下一代重新发生。"

 hbe_service_chengdu_plain: "修渠分水与官学讲会"
 hbe_service_chengdu_plain.desc: "成都平原圈的渠田、作坊与官学不能只在[Concept('hbe_term_alliance', '会盟')|e]之时才受重视。府臣请将备料、主持与查验分别入册，使日常经营有持续的接续。\n\n本府愿[Concept('hbe_term_trial', '出资试办')|e]三年，验收后再将成果与地方储备一并登记；只有真实完成的事业，才值得要求邻府认可。\n\n#T 办理与验收#!\n投入 4 金币，三年后交付本圈事业，取得 10 点@hbe_water! [Concept('hbe_term_water', '水权储备')|e]、3 点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]与五年经营收益。\n当前@hbe_water! [Concept('hbe_term_water', '水权储备')|e]：[ROOT.GetVariable('hbe_water').GetValue|0]。\n\n#T 民役与供养#!\n@hbe_burden! [Concept('hbe_term_burden', '役负')|e]70以上暂停新办。府额征办结算+6@hbe_burden! [Concept('hbe_term_burden', '役负')|e]；乡社议办结算+2并额外+1@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]，开工储备须5并有五年内府议认约；行会雇办另付按税贸收入计的雇价，结算不加@hbe_burden! [Concept('hbe_term_burden', '役负')|e]。"
 hbe_service_chengdu_plain.a: "依议办理。"
 hbe_mission_chengdu_plain_1: "成都平原圈：起业"
 hbe_mission_chengdu_plain_1.desc: "成都平原圈的渠田、作坊与官学仍须由实际承担者接续。共同事业初立，乡里的旧例仍各有写法。我们应先把本府承担的一项实务交付清楚，让圈中诸侯看见可以查验的成果。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。\n\n#T 办理与验收#!\n起业验收需要研究、持续交付与真实出资。消耗 10 点@hbe_water! [Concept('hbe_term_water', '水权储备')|e]和 2 金币；@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]增加 5，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]增加 2。"
 hbe_mission_chengdu_plain_1.a: "依议办理。"
 hbe_mission_chengdu_plain_2: "成都平原圈：成长"
 hbe_mission_chengdu_plain_2.desc: "成都平原圈的渠田、作坊与官学仍须由实际承担者接续。最初的试办已有人接续，下一步却不能只沿用主持者个人的情面。让承担者、使用者与府库共同认可凭据，地方经营才能逐步成为常例。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。\n\n#T 办理与验收#!\n成长验收需要研究、持续交付与真实出资。消耗 10 点@hbe_water! [Concept('hbe_term_water', '水权储备')|e]和 4 金币；@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]增加 5，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]增加 2。"
 hbe_mission_chengdu_plain_2.a: "依议办理。"
 hbe_mission_chengdu_plain_3: "成都平原圈：[Concept('hbe_term_contract', '旧约')|e]重审"
 hbe_mission_chengdu_plain_3.desc: "成都平原圈的渠田、作坊与官学仍须由实际承担者接续。早年的约定已经经历数次换主，当初认可的人手与供给也有所变化。重审[Concept('hbe_term_contract', '旧约')|e]，需要说明哪些责任仍可履行，哪些分担必须重新取得认同。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。\n\n#T 办理与验收#!\n[Concept('hbe_term_contract', '旧约')|e]重审验收需要研究、持续交付与真实出资。消耗 10 点@hbe_water! [Concept('hbe_term_water', '水权储备')|e]和 6 金币；@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]增加 5，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]增加 2。"
 hbe_mission_chengdu_plain_3.a: "依议办理。"
 hbe_mission_chengdu_plain_4: "成都平原圈：地区重组"
 hbe_mission_chengdu_plain_4.desc: "成都平原圈的渠田、作坊与官学仍须由实际承担者接续。[Concept('hbe_term_local_service', '地方事业')|e]渐有规模，分散的经营却开始争夺同样的备料与主持权。我们应先整理交接与查验，再将原本各自为政的事务纳入可靠的协作。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。\n\n#T 办理与验收#!\n地区重组验收需要研究、持续交付与真实出资。消耗 10 点@hbe_water! [Concept('hbe_term_water', '水权储备')|e]和 8 金币；@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]增加 5，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]增加 2。"
 hbe_mission_chengdu_plain_4.a: "依议办理。"
 hbe_mission_chengdu_plain_5: "成都平原圈：[Concept('hbe_term_charter', '百年章程')|e]"
 hbe_mission_chengdu_plain_5.desc: "成都平原圈的渠田、作坊与官学仍须由实际承担者接续。百年前的开创者已经不在，今日的乡里仍在使用他们留下的道路与规矩。把实际交付写入新的章程，是让后来的主持者能够继续治事，而非只诵读先人的名号。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。\n\n#T 办理与验收#!\n[Concept('hbe_term_charter', '百年章程')|e]验收需要研究、持续交付与真实出资。消耗 10 点@hbe_water! [Concept('hbe_term_water', '水权储备')|e]和 10 金币；@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]增加 5，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]增加 2。"
 hbe_mission_chengdu_plain_5.a: "依议办理。"
 hbe.100.title: "争水"
 hbe.100.desc: "上游乡民正在加高水口，以备夏日缺水。下游的庄户却来到府衙，声称新水口已让他们的田沟见底。双方都曾派人岁修，如今也都要求我们承认他们优先取水的权利。\n\n渠吏主张增调民夫，另开一道[Concept('hbe_term_water', '分水')|e]口。乡老愿按旧约自行安排，掌库官则提醒我们，雇工的钱只能从本府支出。"
 hbe.100.a: "增派渠工，先保今年的收成。"
 hbe.100.b: "由府库出钱，雇工代役。"
 hbe.100.c: "依乡约分水，官府不再包揽。"
 hbe_service_southern_salt_wine: "井灶公账与宴席采办"
 hbe_service_southern_salt_wine.desc: "川南盐酒圈的井灶、窖坊与采办不能只在[Concept('hbe_term_alliance', '会盟')|e]之时才受重视。府臣请将备料、主持与查验分别入册，使日常经营有持续的接续。\n\n本府愿[Concept('hbe_term_trial', '出资试办')|e]三年，验收后再将成果与地方储备一并登记；只有真实完成的事业，才值得要求邻府认可。\n\n#T 办理与验收#!\n投入 4 金币，三年后交付本圈事业，取得 10 点@hbe_salt! [Concept('hbe_term_salt', '盐引信用')|e]、3 点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]与五年经营收益。\n当前@hbe_salt! [Concept('hbe_term_salt', '盐引信用')|e]：[ROOT.GetVariable('hbe_salt').GetValue|0]。\n\n#T 民役与供养#!\n@hbe_burden! [Concept('hbe_term_burden', '役负')|e]70以上暂停新办。府额征办结算+6@hbe_burden! [Concept('hbe_term_burden', '役负')|e]；乡社议办结算+2并额外+1@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]，开工储备须5并有五年内府议认约；行会雇办另付按税贸收入计的雇价，结算不加@hbe_burden! [Concept('hbe_term_burden', '役负')|e]。"
 hbe_service_southern_salt_wine.a: "依议办理。"

 HBE_FEAST_REWARDS: "参与：建设+11%、商人容量+11%（两年）。\n成功：依经济规模发放金币、2威望、4义气；生产效率最多+5%、粮食最多+8%（三年）。\n领先派额外：共建派建设+14%，兴业派商人容量+18%、文化影响力+14%。同类短期生产和粮食安排取较强效果，不叠加。\n派内金币与威望分红另计，奖金池规则不变。"

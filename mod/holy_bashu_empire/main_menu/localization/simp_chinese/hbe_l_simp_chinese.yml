 country_history_BBS: "宋元之际的兵火曾使蜀地城郭与乡里凋敝，今日的渠堰、井灶与关驿仍须由留在当地的人重新接续。本剧本假设，朝廷以转运贡额和关津保证承认诸府共同签立的自治敕约：三十六府州分别治事，[Concept('hbe_term_circle', '七圈')|e]协调邻府，皇帝主持跨圈公议。此约是架空[Concept('hbe_term_alliance', '会盟')|e]的起点，并非史实中的四川帝国。\n\n丘陵圈的塘堰、义仓和市集各有乡社维持。宋代赈济、仓储与[Concept('hbe_term_contract', '契约')|e]的旧事提供了可借鉴的经验，诸府仍须决定借粮何时偿还、见证由谁作保，才可让互济度过歉岁。\n\n潼川的乡里需要在分散田亩之间调剂粮水，城中的券据又常与这些地方交付相联系。纸上的一笔清算，可能关系到哪一乡来年还能补足种粮。\n\n本府可以以分仓赈贷保障地方生计，也可以以[Concept('hbe_term_contract', '契约')|e]见证明确偿付。义仓与公信是不同的经营道路，前者要保有真实储备，后者要保存真实交割；潼川必须选择自己最能长期承担的职责。"

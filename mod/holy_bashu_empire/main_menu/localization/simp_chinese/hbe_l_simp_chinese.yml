 country_history_BAL: "宋元之际的兵火曾使蜀地城郭与乡里凋敝，今日的渠堰、井灶与关驿仍须由留在当地的人重新接续。本剧本假设，朝廷以转运贡额和关津保证承认诸府共同签立的自治敕约：三十六府州分别治事，[Concept('hbe_term_circle', '七圈')|e]协调邻府，皇帝主持跨圈公议。此约是架空[Concept('hbe_term_alliance', '会盟')|e]的起点，并非史实中的四川帝国。\n\n成都平原的水路使田亩与市镇相依，[Concept('hbe_history_dujiangyan', '都江堰')|e]的岁修、渠首的分水和锦坊的备料却各有承担者。平原圈须把丰饶背后的日常劳力写入公账，使官学的讲会与渠旁的旧例彼此说明。\n\n眉州的乡田与市集养育了自己的地方社会，[Concept('hbe_history_sansu', '三苏')|e]留下的文章与声名又使它在蜀中文脉中有一席之地。书卷可以传得很远，乡里的渠务与借券却仍须有人逐件办理。\n\n本府可以沿水权之路维持粮政，也可以在官学讲会中争取主持之誉。若以议论代替交付，声望终究会被邻府的账册质问；若让公议回应地方生计，眉州便能将文化之名化为长久的[Concept('hbe_term_alliance', '会盟')|e]信用。"
 country_description_category_name_hbe_profile_bal: "眉州：渠田、作坊与官学"
 country_description_category_desc_hbe_profile_bal: "眉州的乡田与市集养育了自己的地方社会，[Concept('hbe_history_sansu', '三苏')|e]留下的文章与声名又使它在蜀中文脉中有一席之地。书卷可以传得很远，乡里的渠务与借券却仍须有人逐件办理。\n\n本府可以沿水权之路维持粮政，也可以在官学讲会中争取主持之誉。若以议论代替交付，声望终究会被邻府的账册质问；若让公议回应地方生计，眉州便能将文化之名化为长久的[Concept('hbe_term_alliance', '会盟')|e]信用。"
 country_history_BAO: "宋元之际的兵火曾使蜀地城郭与乡里凋敝，今日的渠堰、井灶与关驿仍须由留在当地的人重新接续。本剧本假设，朝廷以转运贡额和关津保证承认诸府共同签立的自治敕约：三十六府州分别治事，[Concept('hbe_term_circle', '七圈')|e]协调邻府，皇帝主持跨圈公议。此约是架空[Concept('hbe_term_alliance', '会盟')|e]的起点，并非史实中的四川帝国。\n\n川南井盐与酿造为府库带来收入，也将木料、汲卤、煎盐和远途采办联在一起。宋代四川盐井技术留下的积累仍在，盐引的信用却只能靠后来者按期交割维持。\n\n嘉定的山门、河谷与往来行旅，使此地同时面对施济、渡运和采办的需要。峨眉山周边不同生活习惯并存，府库的安排必须得到实际承担事务的人理解。\n\n本府属于川南盐酒圈，却不必只凭井盐经营立足。盐酒协作的宴席支线给嘉定留下了待客与采办的道路；清楚的[Concept('hbe_term_contract', '契约')|e]和可靠的交割，可以使山门与市集成为本府参与帝国事业的根基。"
 country_description_category_name_hbe_profile_bao: "嘉定：井灶、窖坊与采办"
 country_description_category_desc_hbe_profile_bao: "嘉定的山门、河谷与往来行旅，使此地同时面对施济、渡运和采办的需要。峨眉山周边不同生活习惯并存，府库的安排必须得到实际承担事务的人理解。\n\n本府属于川南盐酒圈，却不必只凭井盐经营立足。盐酒协作的宴席支线给嘉定留下了待客与采办的道路；清楚的[Concept('hbe_term_contract', '契约')|e]和可靠的交割，可以使山门与市集成为本府参与帝国事业的根基。"
 country_history_BAP: "宋元之际的兵火曾使蜀地城郭与乡里凋敝，今日的渠堰、井灶与关驿仍须由留在当地的人重新接续。本剧本假设，朝廷以转运贡额和关津保证承认诸府共同签立的自治敕约：三十六府州分别治事，[Concept('hbe_term_circle', '七圈')|e]协调邻府，皇帝主持跨圈公议。此约是架空[Concept('hbe_term_alliance', '会盟')|e]的起点，并非史实中的四川帝国。\n\n川南井盐与酿造为府库带来收入，也将木料、汲卤、煎盐和远途采办联在一起。宋代四川盐井技术留下的积累仍在，盐引的信用却只能靠后来者按期交割维持。\n\n叙州的水程与城中的采办相互依赖，盐酒、粮料和行旅在此需要可信的交割安排。沿江便利带来了商机，也使一笔拖延的款项能够牵动不止一家经营。\n\n作为川南盐酒圈最初的[Concept('hbe_term_elector', '选侯')|e]，叙州可以沿井灶担保走向共同融资，也可以以席面采购赢得诸侯的委托。总号的印信不会自行生出信用；本府必须在借款的便利与偿还的责任之间守住自己的分寸。"
 country_description_category_name_hbe_profile_bap: "叙州：井灶、窖坊与采办"
 country_description_category_desc_hbe_profile_bap: "叙州的水程与城中的采办相互依赖，盐酒、粮料和行旅在此需要可信的交割安排。沿江便利带来了商机，也使一笔拖延的款项能够牵动不止一家经营。\n\n作为川南盐酒圈最初的[Concept('hbe_term_elector', '选侯')|e]，叙州可以沿井灶担保走向共同融资，也可以以席面采购赢得诸侯的委托。总号的印信不会自行生出信用；本府必须在借款的便利与偿还的责任之间守住自己的分寸。"

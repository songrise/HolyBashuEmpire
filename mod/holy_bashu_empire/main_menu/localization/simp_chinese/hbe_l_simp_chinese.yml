 country_history_BAB: "宋元之际的兵火曾使蜀地城郭与乡里凋敝，今日的渠堰、井灶与关驿仍须由留在当地的人重新接续。本剧本假设，朝廷以转运贡额和关津保证承认诸府共同签立的自治敕约：三十六府州分别治事，[Concept('hbe_term_circle', '七圈')|e]协调邻府，皇帝主持跨圈公议。此约是架空[Concept('hbe_term_alliance', '会盟')|e]的起点，并非史实中的四川帝国。\n\n成都平原的水路使田亩与市镇相依，[Concept('hbe_history_dujiangyan', '都江堰')|e]的岁修、渠首的分水和锦坊的备料却各有承担者。平原圈须把丰饶背后的日常劳力写入公账，使官学的讲会与渠旁的旧例彼此说明。\n\n锦官城的织机与平原的渠田，使成都在巴蜀诸府之中享有声望。[Concept('hbe_history_dujiangyan', '都江堰')|e]留下的治水传统、[Concept('hbe_history_shujin', '蜀锦')|e]的经营与[Concept('hbe_history_wenweng', '文翁')|e]兴学的旧事，提供了不同的治国道路。\n\n如今本府掌握平原圈的[Concept('hbe_term_elector', '选侯')|e]席位，也主持帝国最初的公议。邻府认可成都的名望，却未必愿意长期承担由成都决定的费用。皇位可以带来主持之权；能否使渠旁的人同样受益，才决定这种权威能维持多久。"
 country_description_category_name_hbe_profile_bab: "成都：渠田、作坊与官学"
 country_description_category_desc_hbe_profile_bab: "锦官城的织机与平原的渠田，使成都在巴蜀诸府之中享有声望。[Concept('hbe_history_dujiangyan', '都江堰')|e]留下的治水传统、[Concept('hbe_history_shujin', '蜀锦')|e]的经营与[Concept('hbe_history_wenweng', '文翁')|e]兴学的旧事，提供了不同的治国道路。\n\n如今本府掌握平原圈的[Concept('hbe_term_elector', '选侯')|e]席位，也主持帝国最初的公议。邻府认可成都的名望，却未必愿意长期承担由成都决定的费用。皇位可以带来主持之权；能否使渠旁的人同样受益，才决定这种权威能维持多久。"
 country_history_BAE: "宋元之际的兵火曾使蜀地城郭与乡里凋敝，今日的渠堰、井灶与关驿仍须由留在当地的人重新接续。本剧本假设，朝廷以转运贡额和关津保证承认诸府共同签立的自治敕约：三十六府州分别治事，[Concept('hbe_term_circle', '七圈')|e]协调邻府，皇帝主持跨圈公议。此约是架空[Concept('hbe_term_alliance', '会盟')|e]的起点，并非史实中的四川帝国。\n\n成都平原的水路使田亩与市镇相依，[Concept('hbe_history_dujiangyan', '都江堰')|e]的岁修、渠首的分水和锦坊的备料却各有承担者。平原圈须把丰饶背后的日常劳力写入公账，使官学的讲会与渠旁的旧例彼此说明。\n\n汉州居于平原北部，受水的田亩与连接邻府的通路同样重要。城中的库吏关注交割，乡里的掌事者则关心何时开渠、何处备料，两者未必总能在同一本账上作答。\n\n成都近在一旁，给本府带来市场与议事的便利，也使汉州必须争取自己的声音。以真实渠务取得@hbe_water! [Concept('hbe_term_water', '水权储备')|e]，再将[Concept('hbe_term_local_service', '地方事业')|e]写入共同账册，本府便能用稳妥的交付换取比疆域更广的影响。"
 country_description_category_name_hbe_profile_bae: "汉州：渠田、作坊与官学"
 country_description_category_desc_hbe_profile_bae: "汉州居于平原北部，受水的田亩与连接邻府的通路同样重要。城中的库吏关注交割，乡里的掌事者则关心何时开渠、何处备料，两者未必总能在同一本账上作答。\n\n成都近在一旁，给本府带来市场与议事的便利，也使汉州必须争取自己的声音。以真实渠务取得@hbe_water! [Concept('hbe_term_water', '水权储备')|e]，再将[Concept('hbe_term_local_service', '地方事业')|e]写入共同账册，本府便能用稳妥的交付换取比疆域更广的影响。"
 country_history_BAF: "宋元之际的兵火曾使蜀地城郭与乡里凋敝，今日的渠堰、井灶与关驿仍须由留在当地的人重新接续。本剧本假设，朝廷以转运贡额和关津保证承认诸府共同签立的自治敕约：三十六府州分别治事，[Concept('hbe_term_circle', '七圈')|e]协调邻府，皇帝主持跨圈公议。此约是架空[Concept('hbe_term_alliance', '会盟')|e]的起点，并非史实中的四川帝国。\n\n成都平原的水路使田亩与市镇相依，[Concept('hbe_history_dujiangyan', '都江堰')|e]的岁修、渠首的分水和锦坊的备料却各有承担者。平原圈须把丰饶背后的日常劳力写入公账，使官学的讲会与渠旁的旧例彼此说明。\n\n彭州位于平原与山地相接之处，田亩的受水、山口的通行与地方采办相互牵连。一项看似只关渠口的决定，往往也改变了沿路乡里的负担。\n\n本府疆域有限，难以单靠兵势左右成都的公议，却可以在修渠与讲会之间选择自己的长处。让旧水次得到清楚记录，或以官学联络各府，都能使彭州成为平原圈不能轻易忽略的一员。"

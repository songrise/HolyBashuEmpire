 country_description_category_name_hbe_profile_bbz: "黎州：谷市、乡寨与地方见证"
 country_description_category_desc_hbe_profile_bbz: "黎州的山程连接互市与地方生活，宋代雅州、黎州茶马往来的旧事，为今日的行旅留下了可资援引的背景。旧券记得谁能通行，却未必说明谁应修桥与候援。\n\n本府在山谷圈中可以以换市与互保建立经营，也可以以地方议约保护旧权。让实际维护道路的人共同见证通行之约，是黎州把历史通路转化为长久[Concept('hbe_term_alliance', '会盟')|e]职责的起点。"
 country_history_BCA: "宋元之际的兵火曾使蜀地城郭与乡里凋敝，今日的渠堰、井灶与关驿仍须由留在当地的人重新接续。本剧本假设，朝廷以转运贡额和关津保证承认诸府共同签立的自治敕约：三十六府州分别治事，[Concept('hbe_term_circle', '七圈')|e]协调邻府，皇帝主持跨圈公议。此约是架空[Concept('hbe_term_alliance', '会盟')|e]的起点，并非史实中的四川帝国。\n\n西南诸谷沿山程与互市维持往来，乡寨对援守、候宿和粮额各有[Concept('hbe_term_contract', '旧约')|e]。这里的共治始于逐谷认可，而非一纸府令；主持者须使商路受益与寨中负担能够相互对账。\n\n马湖的地方往来需要考虑渡运与沿岸乡里的实际承载。府库可以在券面列出额度，船户与转运之人却必须根据现有器具和人手完成它。\n\n本府可借商盟互保协调交割，也可沿共治守备支线明确沿途责任。无论选择哪条道路，马湖都应让真实运力进入公议，避免以无法兑现的承诺换取一时声望，使小国的可靠成为自身的长处。"
 country_description_category_name_hbe_profile_bca: "马湖：谷市、乡寨与地方见证"

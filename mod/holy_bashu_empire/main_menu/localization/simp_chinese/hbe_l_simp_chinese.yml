 hbe_mission_western_tea_horse_1: "川西茶马圈：起业"
 hbe_mission_western_tea_horse_1.desc: "川西茶马圈的茶市、商队与山门仍须由实际承担者接续。共同事业初立，乡里的旧例仍各有写法。我们应先把本府承担的一项实务交付清楚，让圈中诸侯看见可以查验的成果。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。\n\n#T 办理与验收#!\n起业验收需要研究、持续交付与真实出资。消耗 10 点@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]和 2 金币；@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]增加 5，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]增加 2。"
 hbe_mission_western_tea_horse_1.a: "依议办理。"
 hbe_mission_western_tea_horse_2: "川西茶马圈：成长"
 hbe_mission_western_tea_horse_2.desc: "川西茶马圈的茶市、商队与山门仍须由实际承担者接续。最初的试办已有人接续，下一步却不能只沿用主持者个人的情面。让承担者、使用者与府库共同认可凭据，地方经营才能逐步成为常例。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。\n\n#T 办理与验收#!\n成长验收需要研究、持续交付与真实出资。消耗 10 点@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]和 4 金币；@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]增加 5，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]增加 2。"
 hbe_mission_western_tea_horse_2.a: "依议办理。"
 hbe_mission_western_tea_horse_3: "川西茶马圈：[Concept('hbe_term_contract', '旧约')|e]重审"
 hbe_mission_western_tea_horse_3.desc: "川西茶马圈的茶市、商队与山门仍须由实际承担者接续。早年的约定已经经历数次换主，当初认可的人手与供给也有所变化。重审[Concept('hbe_term_contract', '旧约')|e]，需要说明哪些责任仍可履行，哪些分担必须重新取得认同。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。\n\n#T 办理与验收#!\n[Concept('hbe_term_contract', '旧约')|e]重审验收需要研究、持续交付与真实出资。消耗 10 点@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]和 6 金币；@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]增加 5，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]增加 2。"
 hbe_mission_western_tea_horse_3.a: "依议办理。"
 hbe_mission_western_tea_horse_4: "川西茶马圈：地区重组"
 hbe_mission_western_tea_horse_4.desc: "川西茶马圈的茶市、商队与山门仍须由实际承担者接续。[Concept('hbe_term_local_service', '地方事业')|e]渐有规模，分散的经营却开始争夺同样的备料与主持权。我们应先整理交接与查验，再将原本各自为政的事务纳入可靠的协作。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。\n\n#T 办理与验收#!\n地区重组验收需要研究、持续交付与真实出资。消耗 10 点@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]和 8 金币；@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]增加 5，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]增加 2。"
 hbe_mission_western_tea_horse_4.a: "依议办理。"
 hbe_mission_western_tea_horse_5: "川西茶马圈：[Concept('hbe_term_charter', '百年章程')|e]"
 hbe_mission_western_tea_horse_5.desc: "川西茶马圈的茶市、商队与山门仍须由实际承担者接续。百年前的开创者已经不在，今日的乡里仍在使用他们留下的道路与规矩。把实际交付写入新的章程，是让后来的主持者能够继续治事，而非只诵读先人的名号。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。\n\n#T 办理与验收#!\n[Concept('hbe_term_charter', '百年章程')|e]验收需要研究、持续交付与真实出资。消耗 10 点@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]和 10 金币；@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]增加 5，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]增加 2。"
 hbe_mission_western_tea_horse_5.a: "依议办理。"
 hbe.105.title: "山外的茶客"
 hbe.105.desc: "来自山外的商人愿以较高价钱收走今年的边茶，要求茶坊不再向其他商队出售同样的货物。常年往来的驮户听闻此事，担心今后连采办都要仰人鼻息。\n\n独家承销能带来眼下的收益。若由府库分担[Concept('hbe_term_tea', '护行')|e]，各家商队便可继续入市；附近山门也请求留出一部分茶货，供来往僧侣与使者使用。"
 hbe.105.a: "向商隊出售独家茶货。"
 hbe.105.b: "府库分担护行，开放茶市。"
 hbe.105.c: "留茶待客，支持山门往来。"
 hbe_service_southwestern_valleys: "山谷互市与地方议约"
 hbe_service_southwestern_valleys.desc: "川西南山谷圈的谷市、乡寨与地方见证不能只在[Concept('hbe_term_alliance', '会盟')|e]之时才受重视。府臣请将备料、主持与查验分别入册，使日常经营有持续的接续。\n\n本府愿[Concept('hbe_term_trial', '出资试办')|e]三年，验收后再将成果与地方储备一并登记；只有真实完成的事业，才值得要求邻府认可。\n\n#T 办理与验收#!\n投入 4 金币，三年后交付本圈事业，取得 10 点@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]、3 点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]与五年经营收益。\n当前@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]：[ROOT.GetVariable('hbe_valleys').GetValue|0]。\n\n#T 民役与供养#!\n@hbe_burden! [Concept('hbe_term_burden', '役负')|e]70以上暂停新办。府额征办结算+6@hbe_burden! [Concept('hbe_term_burden', '役负')|e]；乡社议办结算+2并额外+1@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]，开工储备须5并有五年内府议认约；行会雇办另付按税贸收入计的雇价，结算不加@hbe_burden! [Concept('hbe_term_burden', '役负')|e]。"
 hbe_service_southwestern_valleys.a: "依议办理。"
 hbe_mission_southwestern_valleys_1: "川西南山谷圈：起业"
 hbe_mission_southwestern_valleys_1.desc: "川西南山谷圈的谷市、乡寨与地方见证仍须由实际承担者接续。共同事业初立，乡里的旧例仍各有写法。我们应先把本府承担的一项实务交付清楚，让圈中诸侯看见可以查验的成果。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。\n\n#T 办理与验收#!\n起业验收需要研究、持续交付与真实出资。消耗 10 点@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]和 2 金币；@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]增加 5，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]增加 2。"

 country_history_BBU: "宋元之际的兵火曾使蜀地城郭与乡里凋敝，今日的渠堰、井灶与关驿仍须由留在当地的人重新接续。本剧本假设，朝廷以转运贡额和关津保证承认诸府共同签立的自治敕约：三十六府州分别治事，[Concept('hbe_term_circle', '七圈')|e]协调邻府，皇帝主持跨圈公议。此约是架空[Concept('hbe_term_alliance', '会盟')|e]的起点，并非史实中的四川帝国。\n\n雅州与黎州一带的宋代茶马往来，使秤量交割与沿途供给紧密相联。[Concept('hbe_term_alliance', '会盟')|e]的茶马圈无意抹平山地旧俗，而须让向导、商队与山门都能在公议中说明自己承担的路程。\n\n雅州的茶与往来商队连着山地互市，宋代茶马经营留下的旧事使本地重视秤量、交割与通路。离开市集之后，山程上的候宿与报险又要依靠沿途各方。\n\n本府是茶马圈最初的[Concept('hbe_term_elector', '选侯')|e]，可以发展@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]与通商公所，也可以以山门施济与跨地调停取得支持。商业主持和公议主持各有责任；雅州必须让自己的券据在山外与山内同样得到认可。"

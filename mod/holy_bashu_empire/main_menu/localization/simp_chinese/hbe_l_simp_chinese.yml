 hbe.103.title: "断了的栈道"
 hbe.103.desc: "山雨冲断了栈道，驿吏将积压的公文送到府衙。关口的守军尚有存粮，过路商人却无法继续等候。附近乡民已经出过一轮[Concept('hbe_term_roads', '驿役')|e]，听说还要抽丁修路便起了争执。\n\n增征人手能尽快接通道路；由府库付工钱，并统一驿券，也许更适于长久经营。几支商队愿自行设站，只要求官吏不再逐处干预。"
 hbe.103.a: "增调驿役，尽快接通栈道。"
 hbe.103.b: "出钱修造，编印驿券。"
 hbe.103.c: "准沿途商队自设驿站。"

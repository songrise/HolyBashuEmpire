 hbe_valley_soldiers: "联寨山卒"
 hbe_valley_soldiers_desc: "联寨山卒从本地经营和议约中获得可靠人手，沿用本地区的训练办法。它的优势建立在固定职责之上，也保留相应弱点。\n\n1352年后开放，须完成本圈第二项[Concept('hbe_term_research', '课题')|e]并维持招募机构；由原版招募系统提供兵员和物资。\n所有议约军共用一个容量，@hbe_burden! [Concept('hbe_term_burden', '役负')|e]过高暂停新募。"
 hbe_trained_river: "江防精练寨兵"
 hbe_trained_river_desc: "由川江寨兵改编的常备军，训练与驻守不再随短期轮役中断。\n\n基础战斗力1.20（前身1.00），杀伤+8%，士气损失−12%。编制仍为500人，补给负担+20%。1457年后，完成本圈续约课题及百年验收，并维持招募机构供养后可用；替代原有兵种。"
 hbe_permanent_pass: "关镇长值兵"
 hbe_permanent_pass_desc: "由关隘轮戍兵改编的常备军，训练与驻守不再随短期轮役中断。\n\n基础战斗力1.15（前身1.00），兵力损失−15%，士气损失−8%。编制仍为500人，补给负担+20%。1457年后，完成本圈续约课题及百年验收，并维持招募机构供养后可用；替代原有兵种。"
 hbe_levy_policy: "府额征办"
 hbe_communal_policy: "乡社议办"
 hbe_communal_policy_desc: "由乡社见证分摊与期限。事业结算@hbe_burden! [Concept('hbe_term_burden', '役负')|e]+2、@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]额外+1；开工须有[Concept('hbe_term_regional', '本圈储备')|e]至少5，驻防粮额沿用议约。"
 hbe_paid_policy: "行会雇办"
 hbe_paid_policy_desc: "从府库付费采购人手。事业开工须另付雇办费（0.75个月税贸收入，至少3金）；结算@hbe_burden! [Concept('hbe_term_burden', '役负')|e]不增加，拖欠将暂停新办。"
 hbe_civil_service_law: "[Concept('hbe_term_civic_policy', '民役议约')|e]"
 hbe_civil_service_law_desc: "全国择一民役政策，选择后五年不得改换。[Concept('hbe_term_local_service', '地方事业')|e]、请愿与驻防均依本约办理。"
 hbe_village_witnesses: "乡社见证权"
 hbe_village_witnesses_desc: "认可承担者的见证与议价权，使[Concept('hbe_term_local_service', '地方事业')|e]有可追究的签押。满意度提高，也使该阶层保有更多政治影响。撤销前必须降低乡里压力，并终止尚未结算的[Concept('hbe_term_local_service', '地方事业')|e]。"
 hbe_guild_payment_guarantee: "行会雇价保任"
 hbe_guild_payment_guarantee_desc: "认可承担者的见证与议价权，使[Concept('hbe_term_local_service', '地方事业')|e]有可追究的签押。满意度提高，也使该阶层保有更多政治影响。撤销前必须降低乡里压力，并终止尚未结算的[Concept('hbe_term_local_service', '地方事业')|e]。"
 hbe_civic_common_1: "府议与民役簿"
 hbe_civic_common_1_desc: "使乡社、行会与府库分别认下办理[Concept('hbe_term_local_service', '地方事业')|e]的责任，避免在工成之后才向乡里追征。"
 hbe_civic_common_1_effects: "本课题的永久加成立即生效，并推进后续地区课题与验收。"
 hbe_civic_common_2: "修约与公账审计"
 hbe_civic_common_2_desc: "前人的签押留下了权利与责任；后来的主持者应能核对凭据，延续其仍然有效的承诺。"
 hbe_civic_common_2_effects: "开放公账审计与逐圈客籍议约。签订某圈议约后授予该圈机构及基础兵种资格；仍需当地领土和实际供养，不一次开放全部七圈。"

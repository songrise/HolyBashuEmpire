 hbe_service_chengdu_plain.title: "修渠分水与官学讲会"
 hbe_service_chengdu_plain.title.entry: "修渠分水与官学讲会"
 hbe_service_chengdu_plain.desc.entry: "成都平原圈的渠田、作坊与官学不能只在[Concept('hbe_term_alliance', '会盟')|e]之时才受重视。府臣请将备料、主持与查验分别入册，使日常经营有持续的接续。\n\n本府愿[Concept('hbe_term_trial', '出资试办')|e]三年，验收后再将成果与地方储备一并登记；只有真实完成的事业，才值得要求邻府认可。\n\n#T 民役与供养#!\n@hbe_burden! [Concept('hbe_term_burden', '役负')|e]70以上暂停新办。府额征办结算+6@hbe_burden! [Concept('hbe_term_burden', '役负')|e]；乡社议办结算+2并额外+1@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]，开工储备须5并有五年内府议认约；行会雇办另付按税贸收入计的雇价，结算不加@hbe_burden! [Concept('hbe_term_burden', '役负')|e]。"
 hbe_mission_chengdu_plain_1.title: "成都平原圈：起业"
 hbe_mission_chengdu_plain_1.title.entry: "成都平原圈：起业"
 hbe_mission_chengdu_plain_1.desc.entry: "成都平原圈的渠田、作坊与官学仍须由实际承担者接续。共同事业初立，乡里的旧例仍各有写法。我们应先把本府承担的一项实务交付清楚，让圈中诸侯看见可以查验的成果。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。"
 hbe_mission_chengdu_plain_2.title: "成都平原圈：成长"
 hbe_mission_chengdu_plain_2.title.entry: "成都平原圈：成长"
 hbe_mission_chengdu_plain_2.desc.entry: "成都平原圈的渠田、作坊与官学仍须由实际承担者接续。最初的试办已有人接续，下一步却不能只沿用主持者个人的情面。让承担者、使用者与府库共同认可凭据，地方经营才能逐步成为常例。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。"
 hbe_mission_chengdu_plain_3.title: "成都平原圈：旧约重审"
 hbe_mission_chengdu_plain_3.title.entry: "成都平原圈：[Concept('hbe_term_contract', '旧约')|e]重审"
 hbe_mission_chengdu_plain_3.desc.entry: "成都平原圈的渠田、作坊与官学仍须由实际承担者接续。早年的约定已经经历数次换主，当初认可的人手与供给也有所变化。重审[Concept('hbe_term_contract', '旧约')|e]，需要说明哪些责任仍可履行，哪些分担必须重新取得认同。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。"

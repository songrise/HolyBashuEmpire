 hbe_civic.104.title: "码头的船位：府议"
 hbe_civic.104.title.entry: "船已到，仓未开"
 hbe_civic.104.desc: "江水上涨后，数批商货一同抵达码头。[Concept('hbe_term_river', '船帮')|e]要求先装价高的货物，仓吏却担心粮船再等几日就会误了交割。江岸守军也在征用渡船，催促把兵员送到对岸。\n\n我们可以向商人出售优先装运的船位，出资扩充护航与修船，或先满足守军的调度。船只有限，今次无法同时照顾各方。\n\n府议已将争议送到我们面前。公款、地方储备与民役都有人提出，各方希望我们明确今后由谁承担费用。"
 hbe_civic.104.a: "府库付钱，给乡里减役。"
 hbe_civic.104.b: "动用地方储备，由乡社主持。"
 hbe_civic.104.c: "增征民役，加紧办完。"
 hbe_civic.105.title: "峡口失船：府议"
 hbe_civic.105.title.entry: "寨中粮额"
 hbe_civic.105.desc: "一艘货船在峡口触礁，幸存船夫指称引水员未及时查看水势。[Concept('hbe_term_river', '船帮')|e]担心下一批商人改走别处，要求府库修补船只并增雇熟悉江道的人手。\n\n仓吏建议加收急运费，让商货尽快离岸。守军则认为应暂留渡船加强江防。商路与防务争用的人手，都要由本府安排。\n\n府议已将争议送到我们面前。公款、地方储备与民役都有人提出，各方希望我们明确今后由谁承担费用。"
 hbe_civic.105.a: "府库付钱，给乡里减役。"
 hbe_civic.105.b: "动用地方储备，由乡社主持。"
 hbe_civic.105.c: "增征民役，加紧办完。"

 hbe_stance_change_1: "转向[Concept('hbe_term_common', '共建派')|e]"
 hbe_stance_change_1.desc: "改为支持共建派。当前已支持该派或距上次换派不足五年时不可办理；换派不会重置本届出资次数。原派其他成员对本府态度−5，每年恢复1点，最长五年。"
 hbe_stance_change_1.a: "依议办理。"
 hbe_stance_change_2: "转向[Concept('hbe_term_divided', '兴业派')|e]"
 hbe_stance_change_2.desc: "改为支持兴业派。当前已支持该派或距上次换派不足五年时不可办理；换派不会重置本届出资次数。原派其他成员对本府态度−5，每年恢复1点，最长五年。"
 hbe_stance_change_2.a: "依议办理。"
 hbe_stance_change_3: "转向[Concept('hbe_term_ledger', '兴业派')|e]"
 hbe_stance_change_3.desc: "名望可以让一份承诺容易被接纳，却不能说明货物何时送达。我们愿以公账和凭据衡量共同事业，使出资者与承担者按实际交付取得回报。\n\n转向账房之议，是请诸侯将情面之外的责任写明。规矩越清楚，主持者也越须接受同样的查验。\n\n#T 办理与验收#!\n改变公共财政、地区自治和[Concept('hbe_term_contract', '契约')|e]治理的立场；五年内不能再次改换。"
 hbe_stance_change_3.a: "依议办理。"
 hbe_banquet.1.title: "两派同席"
 hbe_banquet.1.desc: "[Concept('hbe_term_alliance', '会盟')|e]诸府使者齐聚锦江，商议新一年的钱粮用途。共建派要求先修道路、仓廪与水渠，兴业派则希望扶持作坊、茶市与江运。两方都已备好文书，等待我们决定本府今后支持哪一种主张。"
 hbe_banquet.1.a: "共建派：先修路、建仓。"
 hbe_banquet.1.b: "兴业派：先兴商、养业。"
 hbe_banquet.1.c: "[Concept('hbe_term_ledger', '兴业派')|e]：先看合同，再谈情义。"
 hbe_project_fund: "[Concept('hbe_term_round', '分账会')|e]：[Concept('hbe_term_funding', '出资三金')|e]"
 hbe_project_fund.desc: "邻府的道路修好，本府的货物也能少走远路。我们可以拿出一笔钱，共同筹办这一届的[Concept('hbe_term_local_service', '地方事业')|e]。\n\n费用为月度贸易与税收收入的35%，最低2、最高64金币；每国每届一次。立即获得2信誉、1贡献和两年建设速度+11%、商人容量+11%。两派合计12贡献便能在本届结束时领取额外收益。"
 hbe_project_fund.a: "依议办理。"
 hbe_project_pledge: "[Concept('hbe_term_round', '分账会')|e]：[Concept('hbe_term_pledge', '先认账')|e]，届中付款"
 hbe_project_pledge.desc: "库中暂不便调度现钱，府臣却不愿因此错过本届共同事业。先签一份承诺，可以使主持者知道我们愿意分担，也把届中付款之日明白写定。\n\n印信并不能替代金币。核账之时若无款可交，本府便须承担违约的声望与公议后果。\n\n#T 办理与验收#!\n先签四金承诺，第十二个月核账。届时国库不足会违约，@hbe_dispute! [Concept('hbe_term_dispute', '分歧')|e]上升；不强制把国库扣成负数。"
 hbe_project_pledge.a: "依议办理。"
 hbe_banquet.2.title: "再开一席"
 hbe_banquet.2.desc: "上一届的使者离席后，[Concept('hbe_term_alliance', '会盟')|e]的新任掌事官将修桥与采办的清单送来。若府库愿先付一份费用，本府便可在共同事业中占有一席；乡老却希望留住现钱，待本地工程办成后再带着成果赴会。"
 hbe_banquet.2.a: "拿出本府的一份。"
 hbe_banquet.2.b: "我们先办好[Concept('hbe_term_local_service', '地方事业')|e]。"
 hbe_banquet.2.c: "本届先保留意见。"
 hbe_banquet.2.d: "留出额度，稍后签[Concept('hbe_term_delivery', '地方援助')|e]。"
 hbe_project_reconsider: "[Concept('hbe_term_round', '分账会')|e]：撤回暂缓意见"
 hbe_project_reconsider.desc: "此前的暂缓之议已经传到各府，新的采办安排却使我们有了重新参与的余地。旧意见可以撤回，后来作出的承诺仍须与其他诸侯一样接受查验。\n\n在[Concept('hbe_term_commitment', '承诺期')|e]内改明立场，可以重新出资或认领[Concept('hbe_term_delivery', '地方援助')|e]，让本府的改变有实际事业可以支撑。\n\n#T 办理与验收#!\n在[Concept('hbe_term_commitment', '承诺期')|e]内重新参加，之后可以出资或签地区交付合同。"
 hbe_project_reconsider.a: "依议办理。"
 hbe_project_select_1: "本届工程：[Concept('hbe_term_saltproject', '盐船共账')|e]"
 hbe_project_select_1.desc: "井灶可以供盐，江岸可以转运，乡社可以核验粮数；三者若各自为政，货物便可能停在彼此的交接之间。\n\n皇帝将本届共同事业定为盐船运粮，先约定所需环节，再请有能力的府州认领交付。工程的名目由主持者提出，成果则必须由各圈实际完成。\n\n#T 办理与验收#!\n皇帝在前三个月确定主工程，消耗三金。已有[Concept('hbe_term_delivery', '地方援助')|e]时不能改项；出资者和承诺保持有效。"
 hbe_project_select_1.a: "依议办理。"
 hbe_project_select_2: "本届工程：[Concept('hbe_term_teaproject', '茶马过蜀道')|e]"
 hbe_project_select_2.desc: "茶马互市不能只停留在集市的秤前。山路的接递、谷口的见证与采办的凭据同样决定一趟远行是否可靠。\n\n本届共同事业将围绕茶路展开，把远途交割与沿途维护一并记入公账，令不同山地的承诺能够在同一次验收中相互说明。\n\n#T 办理与验收#!\n皇帝在前三个月确定主工程，消耗三金。已有[Concept('hbe_term_delivery', '地方援助')|e]时不能改项；出资者和承诺保持有效。"
 hbe_project_select_2.a: "依议办理。"
 hbe_role_chengdu_plain: "本届交付：水粮担保"
 hbe_role_chengdu_plain.desc: "渠田、作坊与官学各有熟悉事务的掌事者，共同工程却需要他们的交付在同一期限内得到认可。\n\n我们愿认领这项专业合同，出钱备办并以地方储备作保。半年后的查验，将决定这份承诺能否成为本届工程真正齐备的一环。\n\n#T 办理与验收#!\n成都平原圈承担水粮担保，支付二金并消耗十点@hbe_water! [Concept('hbe_term_water', '水权储备')|e]，半年验收。同届只能参加一种交付或出资。研究地方第一项[Concept('hbe_term_research', '课题')|e]后开放；整合后的旧府州可由共同公账技术接办，没有本地储备时改用十点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]作担保。"
 hbe_role_chengdu_plain.a: "依议办理。"
 hbe_role_southern_salt_wine: "本届交付：盐引承销"
 hbe_role_southern_salt_wine.desc: "井灶、窖坊与采办各有熟悉事务的掌事者，共同工程却需要他们的交付在同一期限内得到认可。\n\n我们愿认领这项专业合同，出钱备办并以地方储备作保。半年后的查验，将决定这份承诺能否成为本届工程真正齐备的一环。\n\n#T 办理与验收#!\n川南盐酒圈承担盐引承销，支付二金并消耗十点@hbe_salt! [Concept('hbe_term_salt', '盐引信用')|e]，半年验收。同届只能参加一种交付或出资。研究地方第一项[Concept('hbe_term_research', '课题')|e]后开放；整合后的旧府州可由共同公账技术接办，没有本地储备时改用十点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]作担保。"
 hbe_role_southern_salt_wine.a: "依议办理。"
 hbe_role_eastern_river: "本届交付：江船转运"
 hbe_role_eastern_river.desc: "码头、船帮与岸仓各有熟悉事务的掌事者，共同工程却需要他们的交付在同一期限内得到认可。\n\n我们愿认领这项专业合同，出钱备办并以地方储备作保。半年后的查验，将决定这份承诺能否成为本届工程真正齐备的一环。\n\n#T 办理与验收#!\n重庆川东圈承担江船转运，支付二金并消耗十点@hbe_river! [Concept('hbe_term_river', '江运互保')|e]，半年验收。同届只能参加一种交付或出资。研究地方第一项[Concept('hbe_term_research', '课题')|e]后开放；整合后的旧府州可由共同公账技术接办，没有本地储备时改用十点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]作担保。"
 hbe_role_eastern_river.a: "依议办理。"
 hbe_role_northern_shudao: "本届交付：驿路轮戍"
 hbe_role_northern_shudao.desc: "关堡、驿站与桥栈各有熟悉事务的掌事者，共同工程却需要他们的交付在同一期限内得到认可。\n\n我们愿认领这项专业合同，出钱备办并以地方储备作保。半年后的查验，将决定这份承诺能否成为本届工程真正齐备的一环。\n\n#T 办理与验收#!\n川北[Concept('hbe_history_shudao', '蜀道')|e]圈承担驿路轮戍，支付二金并消耗十点@hbe_roads! [Concept('hbe_term_roads', '轮戍履约')|e]，半年验收。同届只能参加一种交付或出资。研究地方第一项[Concept('hbe_term_research', '课题')|e]后开放；整合后的旧府州可由共同公账技术接办，没有本地储备时改用十点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]作担保。"
 hbe_role_northern_shudao.a: "依议办理。"
 hbe_role_central_hills: "本届交付：公账审计"
 hbe_role_central_hills.desc: "塘堰、义仓与券据各有熟悉事务的掌事者，共同工程却需要他们的交付在同一期限内得到认可。\n\n我们愿认领这项专业合同，出钱备办并以地方储备作保。半年后的查验，将决定这份承诺能否成为本届工程真正齐备的一环。\n\n#T 办理与验收#!\n川中丘陵圈承担公账审计，支付二金并消耗十点@hbe_grain! [Concept('hbe_term_grain', '义仓储备')|e]，半年验收。同届只能参加一种交付或出资。研究地方第一项[Concept('hbe_term_research', '课题')|e]后开放；整合后的旧府州可由共同公账技术接办，没有本地储备时改用十点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]作担保。"
 hbe_role_central_hills.a: "依议办理。"
 hbe_role_western_tea_horse: "本届交付：茶马采办"
 hbe_role_western_tea_horse.desc: "茶市、商队与山门各有熟悉事务的掌事者，共同工程却需要他们的交付在同一期限内得到认可。\n\n我们愿认领这项专业合同，出钱备办并以地方储备作保。半年后的查验，将决定这份承诺能否成为本届工程真正齐备的一环。\n\n#T 办理与验收#!\n川西茶马圈承担茶马采办，支付二金并消耗十点@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]，半年验收。同届只能参加一种交付或出资。研究地方第一项[Concept('hbe_term_research', '课题')|e]后开放；整合后的旧府州可由共同公账技术接办，没有本地储备时改用十点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]作担保。"
 hbe_role_western_tea_horse.a: "依议办理。"
 hbe_role_southwestern_valleys: "本届交付：山谷互市"
 hbe_role_southwestern_valleys.desc: "谷市、乡寨与地方见证各有熟悉事务的掌事者，共同工程却需要他们的交付在同一期限内得到认可。\n\n我们愿认领这项专业合同，出钱备办并以地方储备作保。半年后的查验，将决定这份承诺能否成为本届工程真正齐备的一环。\n\n#T 办理与验收#!\n川西南山谷圈承担山谷互市，支付二金并消耗十点@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]，半年验收。同届只能参加一种交付或出资。研究地方第一项[Concept('hbe_term_research', '课题')|e]后开放；整合后的旧府州可由共同公账技术接办，没有本地储备时改用十点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]作担保。"
 hbe_role_southwestern_valleys.a: "依议办理。"
 hbe_banquet.3.title: "凭据与实物"
 hbe_banquet.3.desc: "验收人员回到府衙，随行者带着出库记录、沿途交接与实物清单。纸上所载的数量终于能够与仓场或关驿相互对照，本府承办的[Concept('hbe_term_delivery', '地方援助')|e]已获确认。\n\n[Concept('hbe_term_contribution', '个人贡献')|e]由此留下新的记录，然而一段工作完成，还不等于整项事业告成。邻圈仍须交付各自所承的环节，最后的共同收益要待[Concept('hbe_term_round', '本届分账会')|e]结清之后，才能落实到参与者的田地与作坊。"
 hbe_banquet.3.a: "把货与签押一起收好。"
 hbe_banquet.4.title: "席散而百业兴"
 hbe_banquet.4.desc: "各府承办的工程终于按期告成。商旅沿新修的道路抵达市镇，粮仓与作坊也收到所需材料。[Concept('hbe_term_alliance', '会盟')|e]已经拨下本府应得的赏金。\n\n掌库官希望将钱留下备用，乡老请求从中支付一部分民夫工钱。商人也提出，可用这笔钱举办一场货会，招徕下一季的买家。"
 hbe_banquet.4.a: "把赏金存入府库。"
 hbe_banquet.5.title: "留待下一届"
 hbe_banquet.5.desc: "[Concept('hbe_term_alliance', '会盟')|e]约定的期限到了，几处工程却仍缺人手。出席的使者只好将未完事项留给下一届。\n\n掌事官请求拨一笔钱安顿已经出工的乡民，以免下次难以招募。府库不愿再付费用；另有官员主张公开追查失期之责，借此维护本府的名望。"
 hbe_banquet.5.a: "先付款项，安顿出工的乡民。"
 hbe_banquet.6.title: "签押未兑"
 hbe_banquet.6.desc: "届中核账的使者已经抵达，国库却无法拿出先前承诺的四金。库吏解释了近来的支出，契尾那枚属于我们的印信却仍清晰可辨，无法随解释一并抹去。\n\n[Concept('hbe_term_alliance', '会盟')|e]不会因此强行取尽本府的钱粮，但这份承诺不能算作履约。盟友对我们的@hbe_yiqi! [Concept('hbe_term_yiqi', '信誉')|e]将有所疑虑，@hbe_dispute! [Concept('hbe_term_dispute', '分歧')|e]也会增加。今后若能以真实出资或货物交付重新取信，今日的缺失才可能被后来的一册账所弥补。"
 hbe_banquet.6.a: "欠的不是一张签名。"
 hbe_project_subsidize: "[Concept('hbe_term_subsidy', '皇帝垫账')|e]：补一项缺口"
 hbe_project_subsidize.desc: "验收的日子渐近，账册中仍有一项无人交足。若任其空缺，已出资与已交货的府州也将失去共同事业的回报。\n\n皇帝可以出钱聘请本地机构补办，但补缺并不免去原有查验。本届仅能这样垫付一次，主持者须慎重选择何时动用府库。\n\n#T 办理与验收#!\n支付十金聘请本地机构补交一个缺失环节。本届限一次；优先补第一项，再补第二、第三项。"
 hbe_project_subsidize.a: "依议办理。"
 hbe_audit_accounts: "[Concept('hbe_term_audit', '公开公账')|e]：[Concept('hbe_term_audit', '三金核账')|e]"
 hbe_audit_accounts.desc: "诸侯各自保存的凭据已经到了堂上，争执却仍在于同一笔交付究竟由谁认领。继续争论名望，只会使下届采办同样受阻。\n\n我们愿拨款公开核账，使出资、货物与未履行的责任逐项相对。经得起查验的公账，才能让不同府州继续合作。\n\n#T 办理与验收#!\n支付三金，降低四点@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]并增加二点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]；两年可核账一次。"
 hbe_audit_accounts.a: "依议办理。"
 hbe_banquet_ledger: "查看大开席账本"
 hbe_banquet_ledger.desc: "查看两派成员、本届贡献和奖励。\n\n出资记1贡献，完成[Concept('hbe_term_local_service', '地方事业')|e]记2贡献。每两年结算，达到共同目标后，两派参与国都能获益；贡献领先的派另有奖励。"
 hbe_banquet_ledger.a: "执行"
 hbe_banquet.7.title: "两派与会盟"
 hbe_banquet.7.desc: "第[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_round').GetValue|0]届 · 第[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_round_month').GetValue|0] / 24个月\n[Concept('hbe_term_alliance', '共同贡献')|e]：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_feast_total').GetValue|0] / [GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_feast_required').GetValue|0] · 已成功[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_completed_projects').GetValue|0]届\n\n出资记1贡献，完成[Concept('hbe_term_local_service', '地方事业')|e]记2贡献，每届各限一次。\n每两年结算，达到共同目标，两派参与国均获奖励；领先派再获专属支持。\n\n参与：建设+15%、商人容量+15%（两年）。\n成功：6金币、3声望、5信誉；生产和粮食+8%（三年）。"
 hbe_banquet.7.a: "回到本府治事。"
 hbe_banquet.12.title: "分摊之议"
 hbe_banquet.12.desc: "早期事业已有数次交付，诸侯开始发现，临时募款不能长久支撑沿江与山道上的开支。受益较多的府州主张按货量分担，地处上游和关口者则要求计入维护之劳。\n\n第一代主持者曾以交情化解的差额，如今成为公账上的正式争议。@hbe_salt! [Concept('hbe_term_salt', '盐引信用')|e]、@hbe_river! [Concept('hbe_term_river', '江运互保')|e]与各地的新法正在改变交割方式。[Concept('hbe_term_alliance', '会盟')|e]若要继续前行，就须把这些经验写成后来者也能遵循的约定。"
 hbe_banquet.12.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe_banquet.13.title: "故治与新主"
 hbe_banquet.13.desc: "一些旧府州已被整合，原有治所却仍是仓廒、渠工和交割的所在。新领主带着更大的疆域来到[Concept('hbe_term_alliance', '会盟')|e]，旧日机构的掌事者则要求继续依原约分配水权与路役。\n\n诸侯决定仍以原首府维持[Concept('hbe_term_seat', '固定代表席位')|e]，使一次合并不会抹去地方，一次分封也不会凭空增加授权。能够接掌旧治的人，还须接掌它留下的责任。此后，版图上的一处归属将同时牵动几份[Concept('hbe_term_contract', '旧契')|e]。"
 hbe_banquet.13.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe_banquet.14.title: "公治之争"
 hbe_banquet.14.desc: "多年事业使[Concept('hbe_term_alliance', '会盟')|e]有了自己的仓场、簿册与办事人员，诸府对它的期望也逐渐分歧。有人希望皇帝统一筹办公共财政，有人认为圈内议事足以自理，还有人只愿承认能够核验的[Concept('hbe_term_contract', '契约')|e]。\n\n争论并非起于一张文书。井灶的收入、渠田的水权与关驿的轮役，都在决定各地愿交出多少权力。下一代章程尚未成文，各派已经在今日的[Concept('hbe_term_success', '共同项目')|e]中展示自己的治事办法。"
 hbe_banquet.14.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe_banquet.15.title: "长约待议"
 hbe_banquet.15.desc: "最早的盟誓已在各府家谱中留下记载，许多后来者却只熟悉眼前的交割。经过数代延续，[Concept('hbe_term_circle', '七圈')|e]事业已积累到足以重审总约的地步；旧制所能涵盖的情形，也渐渐显得不足。\n\n[Concept('hbe_term_charter', '百年章程')|e]将等待约定的年限与足够的[Concept('hbe_term_success', '成功工程')|e]，再由各圈授权。它不能仅凭一位皇帝的意愿成立。诸府须向那些承担渠工、路役与互市的人说明，为何今日的新约值得他们继续遵守。"
 hbe_banquet.15.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe_propose_charter_1: "[Concept('hbe_term_charter', '百年章程')|e]：[Concept('hbe_term_charter_common', '一锅巴蜀')|e]"
 hbe_propose_charter_1.desc: "百年的共同事业已留下许多可查的凭据，今日的诸侯却仍要选择今后怎样继续。此份章程主张集中主持共同工程，并由皇帝承担持续维护。\n\n皇帝将呈上草案，请旧府州的席位逐一授权；提出章程只开启议约，不能代替各圈的同意。\n\n#T 办理与验收#!\n皇帝出五金、消耗二十@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]，开启六个月授权表决。每圈须有超过半数原府州席位赞成，[Concept('hbe_term_circle', '七圈')|e]至少四圈支持。原三十六首府的当前帝国成员领主行使席位，释放小国不增加席位。失败后五年才能重提。"
 hbe_propose_charter_1.a: "依议办理。"
 hbe_ballot_vote_1: "章程授权：支持[Concept('hbe_term_charter_common', '一锅巴蜀')|e]"
 hbe_ballot_vote_1.desc: "百年的共同事业已留下许多可查的凭据，今日的诸侯却仍要选择今后怎样继续。此份章程主张集中主持共同工程，并由皇帝承担持续维护。\n\n本府将以所掌握的旧席签认此案。每圈须取得本圈席位的严格多数，至少四圈同意，章程方能成为共同认可的安排。\n\n#T 办理与验收#!\n明确支持这一份章程，替代本国上次表态；六个月议决期间可调整。本国拥有多个原首府时一并行使这些[Concept('hbe_term_seat', '固定席位')|e]。"
 hbe_ballot_vote_1.a: "依议办理。"
 hbe_propose_charter_2: "[Concept('hbe_term_charter', '百年章程')|e]：[Concept('hbe_term_charter_divided', '万国茶会')|e]"
 hbe_propose_charter_2.desc: "百年的共同事业已留下许多可查的凭据，今日的诸侯却仍要选择今后怎样继续。此份章程主张保留各府自治经营，以[Concept('hbe_term_local_service', '地方事业')|e]与粮政相互扶助。\n\n皇帝将呈上草案，请旧府州的席位逐一授权；提出章程只开启议约，不能代替各圈的同意。\n\n#T 办理与验收#!\n皇帝出五金、消耗二十@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]，开启六个月授权表决。每圈须有超过半数原府州席位赞成，[Concept('hbe_term_circle', '七圈')|e]至少四圈支持。原三十六首府的当前帝国成员领主行使席位，释放小国不增加席位。失败后五年才能重提。"
 hbe_propose_charter_2.a: "依议办理。"
 hbe_ballot_vote_2: "章程授权：支持[Concept('hbe_term_charter_divided', '万国茶会')|e]"
 hbe_ballot_vote_2.desc: "百年的共同事业已留下许多可查的凭据，今日的诸侯却仍要选择今后怎样继续。此份章程主张保留各府自治经营，以[Concept('hbe_term_local_service', '地方事业')|e]与粮政相互扶助。\n\n本府将以所掌握的旧席签认此案。每圈须取得本圈席位的严格多数，至少四圈同意，章程方能成为共同认可的安排。\n\n#T 办理与验收#!\n明确支持这一份章程，替代本国上次表态；六个月议决期间可调整。本国拥有多个原首府时一并行使这些[Concept('hbe_term_seat', '固定席位')|e]。"
 hbe_ballot_vote_2.a: "依议办理。"
 hbe_propose_charter_3: "[Concept('hbe_term_charter', '百年章程')|e]：[Concept('hbe_term_charter_contract', '各吃各的，账照样交')|e]"
 hbe_propose_charter_3.desc: "百年的共同事业已留下许多可查的凭据，今日的诸侯却仍要选择今后怎样继续。此份章程主张按实际交付核定共同收益，以[Concept('hbe_term_contract', '契约')|e]保存彼此责任。\n\n皇帝将呈上草案，请旧府州的席位逐一授权；提出章程只开启议约，不能代替各圈的同意。\n\n#T 办理与验收#!\n皇帝出五金、消耗二十@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]，开启六个月授权表决。每圈须有超过半数原府州席位赞成，[Concept('hbe_term_circle', '七圈')|e]至少四圈支持。原三十六首府的当前帝国成员领主行使席位，释放小国不增加席位。失败后五年才能重提。"
 hbe_propose_charter_3.a: "依议办理。"
 hbe_ballot_vote_3: "章程授权：支持[Concept('hbe_term_charter_contract', '各吃各的，账照样交')|e]"
 hbe_ballot_vote_3.desc: "百年的共同事业已留下许多可查的凭据，今日的诸侯却仍要选择今后怎样继续。此份章程主张按实际交付核定共同收益，以[Concept('hbe_term_contract', '契约')|e]保存彼此责任。\n\n本府将以所掌握的旧席签认此案。每圈须取得本圈席位的严格多数，至少四圈同意，章程方能成为共同认可的安排。\n\n#T 办理与验收#!\n明确支持这一份章程，替代本国上次表态；六个月议决期间可调整。本国拥有多个原首府时一并行使这些[Concept('hbe_term_seat', '固定席位')|e]。"
 hbe_ballot_vote_3.a: "依议办理。"
 hbe_banquet.20.title: "章程呈议"
 hbe_banquet.20.desc: "皇帝的提案连同历届交付记录送至本府。使者没有催促立即落印，而是请我们核对本府所掌旧首府的代表席位，确认此议是否符合各处机构与居民的利益。\n\n依[Concept('hbe_term_charter', '百年章程')|e]的议决办法，一圈须有过半原席位赞成才能授权，[Concept('hbe_term_circle', '七圈')|e]至少四圈支持方可成约。议期为六个月，我们可以接受当前文本，也可保留[Concept('hbe_term_contract', '旧约')|e]、要求修订。今日的一次表态，将影响此后很长一段岁月的公治。"
 hbe_banquet.20.a: "同意本次提案。"
 hbe_banquet.20.b: "现约先留着，提案再改改。"
 hbe_banquet.21.title: "新约成文"
 hbe_banquet.21.desc: "各圈的印信终于聚齐，书记将授权文书逐页核对，交由主持者正式颁行。[Concept('hbe_term_charter', '百年章程')|e]由此成为诸府共同认可的规矩，旧日临时安排也有了可以追溯的依据。\n\n获准的章程将按公治、地方自治或[Concept('hbe_term_contract', '契约')|e]治理之法，给予境内事业相应收益。渠工仍要岁修，仓场仍要交割，下一届[Concept('hbe_term_round', '分账会')|e]也不会因此停办。新约为这些劳作定下长久的责任，而它的成效仍须由后来人证明。"
 hbe_banquet.21.a: "锅底换了，账还要记。"
 hbe_banquet.22.title: "议而未定"
 hbe_banquet.22.desc: "归来的使者带回几圈同意的印信，也带回另几圈要求修订的条款。各方并未否认[Concept('hbe_term_alliance', '会盟')|e]本身，却无法就谁主持财政、如何维护地方权利达成足够的授权。\n\n本次提案因此不能成约，旧制继续施行。已经完成的工程和[Concept('hbe_term_contribution', '个人贡献')|e]仍记在册中，@hbe_dispute! [Concept('hbe_term_dispute', '分歧')|e]则因议事未决有所增加。五年之后可以再次呈议；在此之前，我们或许应先以实际事业说明这份章程将如何治事。"
 hbe_banquet.22.a: "皇帝可以提案，不能替圈盖章。"
 hbe_banquet.23.title: "盟中争议"
 hbe_banquet.23.desc: "[Concept('hbe_term_alliance', '会盟')|e]收到的诉状已不再只关乎一批盐货或一次轮役。诸府开始质疑彼此的主持权，旧欠款、交割差额与地方权利被并列写入申诉，@hbe_dispute! [Concept('hbe_term_dispute', '分歧')|e]已使共同结算难以顺利进行。\n\n有人请公开簿册，以钱粮支持逐项核验；有人愿用积累的@hbe_guoqi! [Concept('hbe_term_guoqi', '合作信心')|e]担保调停。我们也可以坚持由本府自行处置，但盟友未必会因此重新相信我们的承诺。山外的[Concept('hbe_term_isolation', '自治盟约')|e]仍在，境内的和睦却只能由诸府自己维持。"
 hbe_banquet.23.a: "拨款，公开账簿。"
 hbe_banquet.23.b: "以@hbe_guoqi! [Concept('hbe_term_guoqi', '共同信用')|e]担保调停。"
 hbe_banquet.23.c: "本府自理，先保留意见。"
 hbe_banquet.100.title: "争水"
 hbe_banquet.100.desc: "上游乡民正在加高水口，以备夏日缺水。下游的庄户却来到府衙，声称新水口已让他们的田沟见底。双方都曾派人岁修，如今也都要求我们承认他们优先取水的权利。\n\n渠吏主张增调民夫，另开一道[Concept('hbe_term_water', '分水')|e]口。乡老愿按旧约自行安排，掌库官则提醒我们，雇工的钱只能从本府支出。"
 hbe_banquet.100.a: "增派渠工，先保今年的收成。"
 hbe_banquet.100.b: "由府库出钱，雇工代役。"
 hbe_banquet.100.c: "依乡约分水，官府不再包揽。"
 hbe_banquet.101.title: "绣坊的订单"
 hbe_banquet.101.desc: "锦江边的绣坊收到一批外地衣料订单，商人愿预付银钱，条件是如期交货。绣工们却正逢农忙，许多家庭已有人被征去修堰。\n\n坊主请求官府督促交货，并优先保障桑田用水。乡老希望准许工匠缓役；若让乡社自行分派，我们也就得接受他们对[Concept('hbe_term_water', '工期')|e]和税额的安排。"
 hbe_banquet.101.a: "增派渠工，先保今年的收成。"
 hbe_banquet.101.b: "由府库出钱，雇工代役。"
 hbe_banquet.101.c: "依乡约分水，官府不再包揽。"
 hbe_banquet.102.title: "重修堰口"
 hbe_banquet.102.desc: "春汛冲坏了旧堰的竹笼，渠吏建议趁农闲重修。下游的新田比祖辈时更多，旧有水口已无法照顾所有庄户。\n\n增征[Concept('hbe_term_water', '渠工')|e]可以早日保住收成，雇用工匠则能让乡民留在田里。几处乡社也愿接手工程，只是他们不肯再按官府原定的役额出人。"
 hbe_banquet.102.a: "增派渠工，先保今年的收成。"
 hbe_banquet.102.b: "由府库出钱，雇工代役。"
 hbe_banquet.102.c: "依乡约分水，官府不再包揽。"
 hbe_banquet.103.title: "井下与灶前"
 hbe_banquet.103.desc: "新打出的[Concept('hbe_term_salt', '盐井')|e]卤味颇浓，井主请求添灶开煎。盐商已等在井口，愿按约收走头几批井盐。灶户却呈报，汲卤绳索磨损严重，轮班的工人也已多日没有休息。\n\n掌盐官希望趁高价加紧煎盐。我们也可以拨款整修井架，让灶户轮休，或将采办与承销交给商人处理。"
 hbe_banquet.103.a: "让井灶昼夜开煎。"
 hbe_banquet.103.b: "拨款修井，准灶户轮休。"
 hbe_banquet.103.c: "交给盐商承销，免去官府垫款。"
 hbe_banquet.104.title: "同一张盐引"
 hbe_banquet.104.desc: "几名盐商持同样编号的引券来到府衙，都说自己有权收取下一批盐货。账房承认转押时未及时注销旧券，如今井主无法按所有契纸交货。\n\n多开几灶可以赶交欠货，却要灶户承担额外劳作。修整[Concept('hbe_term_salt', '井灶')|e]、重定工期需要府库垫款；商人也愿接下索偿，只要官府让出一部分承销权。"
 hbe_banquet.104.a: "让井灶昼夜开煎。"
 hbe_banquet.104.b: "拨款修井，准灶户轮休。"
 hbe_banquet.104.c: "交给盐商承销，免去官府垫款。"
 hbe_banquet.105.title: "祖父的盐井"
 hbe_banquet.105.desc: "一户灶主的后人继承了[Concept('hbe_term_salt', '盐井')|e]，也收到祖父留下的欠款文书。他们声称井架年久失修，眼下的盐利不足以同时养家和还债。债主则要求官府兑现旧年担保。\n\n我们可以督促增产偿债，出钱整修并宽限劳作，或请盐商承销这口井的出货。每种办法都会改变井户今后依靠谁来维持生计。"
 hbe_banquet.105.a: "让井灶昼夜开煎。"
 hbe_banquet.105.b: "拨款修井，准灶户轮休。"
 hbe_banquet.105.c: "交给盐商承销，免去官府垫款。"
 hbe_banquet.106.title: "码头的船位"
 hbe_banquet.106.desc: "江水上涨后，数批商货一同抵达码头。[Concept('hbe_term_river', '船帮')|e]要求先装价高的货物，仓吏却担心粮船再等几日就会误了交割。江岸守军也在征用渡船，催促把兵员送到对岸。\n\n我们可以向商人出售优先装运的船位，出资扩充护航与修船，或先满足守军的调度。船只有限，今次无法同时照顾各方。"
 hbe_banquet.106.a: "优先装运商货，收取加急费用。"
 hbe_banquet.106.b: "府库承担护航与修船开支。"
 hbe_banquet.106.c: "把船只留给江岸守军。"
 hbe_banquet.107.title: "峡口失船"
 hbe_banquet.107.desc: "一艘货船在峡口触礁，幸存船夫指称引水员未及时查看水势。[Concept('hbe_term_river', '船帮')|e]担心下一批商人改走别处，要求府库修补船只并增雇熟悉江道的人手。\n\n仓吏建议加收急运费，让商货尽快离岸。守军则认为应暂留渡船加强江防。商路与防务争用的人手，都要由本府安排。"
 hbe_banquet.107.a: "优先装运商货，收取加急费用。"
 hbe_banquet.107.b: "府库承担护航与修船开支。"
 hbe_banquet.107.c: "把船只留给江岸守军。"
 hbe_banquet.108.title: "江防与转仓"
 hbe_banquet.108.desc: "沿江守军请求扩大船队，转运仓的商人却反对继续抽调货船。多年贸易带来的泊位已十分拥挤，新添的[Concept('hbe_term_river', '江防')|e]支出又要府库承担。\n\n若先照顾商运，我们能多收一笔费用；若出资修造，两方都可减轻眼下的困难。将现有船只留给守军，则能立即增强江岸防备。"
 hbe_banquet.108.a: "优先装运商货，收取加急费用。"
 hbe_banquet.108.b: "府库承担护航与修船开支。"
 hbe_banquet.108.c: "把船只留给江岸守军。"
 hbe_banquet.109.title: "断了的栈道"
 hbe_banquet.109.desc: "山雨冲断了栈道，驿吏将积压的公文送到府衙。关口的守军尚有存粮，过路商人却无法继续等候。附近乡民已经出过一轮[Concept('hbe_term_roads', '驿役')|e]，听说还要抽丁修路便起了争执。\n\n增征人手能尽快接通道路；由府库付工钱，并统一驿券，也许更适于长久经营。几支商队愿自行设站，只要求官吏不再逐处干预。"
 hbe_banquet.109.a: "增调驿役，尽快接通栈道。"
 hbe_banquet.109.b: "出钱修造，编印驿券。"
 hbe_banquet.109.c: "准沿途商队自设驿站。"
 hbe_banquet.110.title: "驿券与纸坊"
 hbe_banquet.110.desc: "驿站领用的纸张参差不齐，有的券尾受潮后已无法辨认。关吏因此扣留几批商货，声称须待府衙核实印记才能放行。\n\n抄券人请求府库扶持附近纸坊，重订领用章程。我们也可增派[Concept('hbe_term_roads', '驿役')|e]逐站查验，或准商队自行凭保任书通行。"
 hbe_banquet.110.a: "增调驿役，尽快接通栈道。"
 hbe_banquet.110.b: "出钱修造，编印驿券。"
 hbe_banquet.110.c: "准沿途商队自设驿站。"
 hbe_banquet.111.title: "剑门的轮守"
 hbe_banquet.111.desc: "剑门守将呈报，轮戍名册仍沿用数十年前的丁额，几处山村已难按册出人。沿途商队则愿分担补给，以换取在[Concept('hbe_term_roads', '驿站')|e]落脚的便利。\n\n继续征调能保住关道的工期与补给，出资整理簿券可以减少乡里的负担。接受商人设站的请求，则会让他们在山道上取得更多自主权。"
 hbe_banquet.111.a: "增调驿役，尽快接通栈道。"
 hbe_banquet.111.b: "出钱修造，编印驿券。"
 hbe_banquet.111.c: "准沿途商队自设驿站。"
 hbe_banquet.112.title: "仓中余粮"
 hbe_banquet.112.desc: "今年的秋收超过预料，仓吏却没有足够的人手翻晒新增[Concept('hbe_term_grain', '粮食')|e]。粮商愿立即买走余粮，乡老希望宽免去年向义仓借粮的贫户，乡兵头领则要求留下口粮。\n\n出售粮食能充实府库；整修仓廒并减免旧欠需要另付费用。若把余粮拨给乡兵，我们在下一季也得供养更多人。"
 hbe_banquet.112.a: "趁粮价尚高，售出余粮。"
 hbe_banquet.112.b: "拨钱整仓，减免贫户欠粮。"
 hbe_banquet.112.c: "粮食留下，供养乡兵。"
 hbe_banquet.113.title: "借粮的归期"
 hbe_banquet.113.desc: "赈贷册上有许多尚未归还的[Concept('hbe_term_grain', '粮食')|e]，出借者催促追偿，欠粮乡户却称近年的收成只够糊口。掌库官建议收回能收的部分，趁市价尚高售出。\n\n乡老请求减免欠粮并整修旧仓。乡兵也愿接手一部分仓储，条件是把这些粮食留作长期军粮。"
 hbe_banquet.113.a: "趁粮价尚高，售出余粮。"
 hbe_banquet.113.b: "拨钱整仓，减免贫户欠粮。"
 hbe_banquet.113.c: "粮食留下，供养乡兵。"
 hbe_banquet.114.title: "仓社换主"
 hbe_banquet.114.desc: "几座仓廒随田产转入了新的领主名下，原有乡社却坚持[Concept('hbe_term_grain', '粮食')|e]仍由村中管理。仓吏发现旧仓已有漏雨之处，部分存粮不宜再久放。\n\n我们须决定售粮充库、出资重修并宽免旧欠，还是交给乡兵作为粮站。每个办法都能解决眼下的一部分问题，也会改变今后的供养。"
 hbe_banquet.114.a: "趁粮价尚高，售出余粮。"
 hbe_banquet.114.b: "拨钱整仓，减免贫户欠粮。"
 hbe_banquet.114.c: "粮食留下，供养乡兵。"
 hbe_banquet.115.title: "山外的茶客"
 hbe_banquet.115.desc: "来自山外的商人愿以较高价钱收走今年的边茶，要求茶坊不再向其他商队出售同样的货物。常年往来的驮户听闻此事，担心今后连采办都要仰人鼻息。\n\n独家承销能带来眼下的收益。若由府库分担[Concept('hbe_term_tea', '护行')|e]，各家商队便可继续入市；附近山门也请求留出一部分茶货，供来往僧侣与使者使用。"
 hbe_banquet.115.a: "向商隊出售独家茶货。"
 hbe_banquet.115.b: "府库分担护行，开放茶市。"
 hbe_banquet.115.c: "留茶待客，支持山门往来。"
 hbe_banquet.116.title: "护行的价钱"
 hbe_banquet.116.desc: "山道上的向导要求提高报酬，几支商队因此停在[Concept('hbe_term_tea', '茶市')|e]，不肯先行付款。茶坊等着发货，山门长者却提醒我们，近年的道路维护多由山民承担。\n\n一个大商队愿独家承销，以自己的护行费用抵偿差额。我们也可以分担费用开放互市，或留茶待客，借山门往来缓和争执。"
 hbe_banquet.116.a: "向商隊出售独家茶货。"
 hbe_banquet.116.b: "府库分担护行，开放茶市。"
 hbe_banquet.116.c: "留茶待客，支持山门往来。"
 hbe_banquet.117.title: "旧马与新茶"
 hbe_banquet.117.desc: "沿袭旧约的商人仍按祖辈的比例以马换茶，茶坊则认为如今的茶货更精细，旧价已不足以补偿采办。山地买家担心新价使互市难以继续。\n\n我们可以准许独家承销商另定价格，出资维持开放[Concept('hbe_term_tea', '茶市')|e]，或将一部分茶货拨给山门供客。贸易的规模与山地诸家的信任，需要各付代价。"
 hbe_banquet.117.a: "向商隊出售独家茶货。"
 hbe_banquet.117.b: "府库分担护行，开放茶市。"
 hbe_banquet.117.c: "留茶待客，支持山门往来。"
 hbe_banquet.118.title: "谷市的农具"
 hbe_banquet.118.desc: "谷市的铁木作坊接到一批农具订单，匠人却在为运料争执。官吏要求按期出货，[Concept('hbe_term_valleys', '乡寨')|e]长者说山民还须照管自己的田地，不能总随官府调遣。\n\n我们可以督促作坊交货，拨款修路并雇用工匠，或承认乡寨自行安排互市。作坊的收益、乡里的负担与官府的权威，今次很难一并照顾。"
 hbe_banquet.118.a: "让铁木作坊加紧交货。"
 hbe_banquet.118.b: "拨款修路，雇用谷中工匠。"
 hbe_banquet.118.c: "承认乡寨自办互市的权利。"
 hbe_banquet.119.title: "木契与印信"
 hbe_banquet.119.desc: "一桩铁料交易只有刻木为凭，府城书记不肯照约准运。谷中长者带来几名见证人，声称买卖早已成交，官吏此时扣料是在破坏乡约。\n\n我们可以要求作坊先交官府的货物，出资整修道路并请匠人重新签约，或准许[Concept('hbe_term_valleys', '乡寨')|e]沿用自己的互市凭证。"
 hbe_banquet.119.a: "让铁木作坊加紧交货。"
 hbe_banquet.119.b: "拨款修路，雇用谷中工匠。"
 hbe_banquet.119.c: "承认乡寨自办互市的权利。"
 hbe_banquet.120.title: "乡寨的路钱"
 hbe_banquet.120.desc: "几处[Concept('hbe_term_valleys', '乡寨')|e]已合力修好入谷的小路，却不肯继续缴纳原定的路钱。掌事官担心别处也提出同样要求，作坊匠人则希望用这笔钱购买铁料。\n\n征调人手并督促交货可以增加眼下的产出。府库出资能让道路与工匠都受益；承认乡寨自办互市，则须让出一部分地方事务。"
 hbe_banquet.120.a: "让铁木作坊加紧交货。"
 hbe_banquet.120.b: "拨款修路，雇用谷中工匠。"
 hbe_banquet.120.c: "承认乡寨自办互市的权利。"
 hbe_banquet.200.title: "锦城的公治"
 hbe_banquet.200.desc: "[Concept('hbe_history_shujin', '蜀锦')|e]之名使成都在诸府之间享有声望，城中官学与作坊也确实汇聚了许多能够掌事的人。府臣因此请将首届主持的若干职责留在本城，作为长期公治的根基。\n\n邻府承认成都的便利，却要求一切主持权都附有可验收的责任。我们可以先以出资和履约说明本府足以承担此任，也可以坚持旧有声望已经足够。今日的选择，将影响盟友如何看待锦城此后的倡议。"
 hbe_banquet.200.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.200.b: "守旧例，暂不承诺共担。"
 hbe_banquet.201.title: "汉州水口"
 hbe_banquet.201.desc: "渠吏送来本府各处水口的查验记录，请将共同签押与实际到水一并核对。沿渠乡人担心，若只认可案上的印信，旱时的先后顺序仍会由少数上游田主决定。\n\n[Concept('hbe_history_dujiangyan', '都江堰')|e]水系所维系的利益远超一地，汉州的凭据也须能经邻府查验。付费试办一套实量与签押相合的办法，或许能够积累@hbe_yiqi! [Concept('hbe_term_yiqi', '信誉')|e]；守住现有旧例，则可免去一时的支出与地方阻力。"
 hbe_banquet.201.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.201.b: "守旧例，暂不承诺共担。"
 hbe_banquet.202.title: "彭州山门"
 hbe_banquet.202.desc: "山门商路的掌事者请求本府在共同议事中呈报沿途所费。他们说，平原田亩虽易丈量，翻山接运与雨雪时的维护却不能只按土地多少分摊。\n\n彭州既与平原诸府往来，也须回应山中行旅的要求。若出资把这些费用写成可验收的[Concept('hbe_term_contract', '契约')|e]，便能为以后争取认可；若继续只依旧例办事，本府虽少了一项试办之费，山门的疑虑却仍会留待下一届。"
 hbe_banquet.202.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.202.b: "守旧例，暂不承诺共担。"
 hbe_banquet.203.title: "邛州窑火"
 hbe_banquet.203.desc: "邛州的工匠呈来一批新制器物，并请求将领料、烧造与交付分册记录。乡人说起[Concept('hbe_history_qiong', '邛窑')|e]旧法，尤其推重[Concept('hbe_history_qiong', '省油灯')|e]的巧思，认为善制之名应有真正的技艺作凭。\n\n本府若愿[Concept('hbe_term_trial', '资助试办')|e]，便可把匠人的经验纳入[Concept('hbe_term_contract', '共同契约')|e]，使交付不再只凭经手者一句保证。若守旧例，作坊仍能自行经营，邻府却未必愿以同样的信用承认我们送去的器物。"
 hbe_banquet.203.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.203.b: "守旧例，暂不承诺共担。"
 hbe_banquet.204.title: "眉州议疏"
 hbe_banquet.204.desc: "眉州士人援引[Concept('hbe_history_sansu', '三苏')|e]论事之风，为本府撰成一篇议疏，详论共同事业与地方旧权。文辞颇受赞许，书记却请他们另列一份清楚的出资与验收办法，方能交由诸府议定。\n\n文章可以使一项主张传得更远，具体的责任仍须落到府库与乡里。我们若愿[Concept('hbe_term_trial', '出资试办')|e]，议疏便能随实绩一同流传；若只以文名维护旧例，盟友所见的也许终究只是一篇漂亮的文章。"
 hbe_banquet.204.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.204.b: "守旧例，暂不承诺共担。"
 hbe_banquet.205.title: "嘉定的见证"
 hbe_banquet.205.desc: "嘉定的山门与乡里常受请托，为邻地争端出面见证。如今有人希望先取得本府的签押，再补写具体的责任；掌事者却担心，一次空泛的认可会损伤往后调停的公信。\n\n本府可以[Concept('hbe_term_trial', '出资试办')|e]，以实际调查与[Concept('hbe_term_contract', '契约')|e]记录维护见证之名；也可依旧例，将签押视作彼此熟识的便利。对于需要过河、采办与托运的人，一份能够查验的凭据往往比含糊的保证更有分量。"
 hbe_banquet.205.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.205.b: "守旧例，暂不承诺共担。"
 hbe_banquet.206.title: "叙州盐券"
 hbe_banquet.206.desc: "本府的盐商请将承销担保与共同采办一并登记，说明每一份盐引究竟由何人认账。府臣看见可得的盐利，灶户却先问，若承运失期，井主是否也须替沿江的差额负责。\n\n叙州可以用一次[Concept('hbe_term_trial', '出资试办')|e]把责任划得更明，使@hbe_salt! [Concept('hbe_term_salt', '盐引信用')|e]建立在实际交割之上；若维持既有惯例，眼下的交易仍可进行，尚未说清的担保却会随着货物送到更远的地方。"
 hbe_banquet.206.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.206.b: "守旧例，暂不承诺共担。"
 hbe_banquet.207.title: "泸州采办"
 hbe_banquet.207.desc: "共同采办送来的酒坛已经抵达，掌事者提议逐批查验成色与数量。酒户愿意保证所交之物，却要求验收不得无限拖延，否则本府既取其货，又迟迟不认其账。\n\n泸州的试办可以为采办定下明确期限与见证，使府库、商人与邻地都知何时算作交付。出资建立这套[Concept('hbe_term_contract', '契约')|e]将留下[Concept('hbe_term_contribution', '履约记录')|e]；仍依熟人之间的旧例，则免去眼前开支，也保留了旧争端发生的余地。"
 hbe_banquet.207.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.207.b: "守旧例，暂不承诺共担。"
 hbe_banquet.208.title: "长宁竹契"
 hbe_banquet.208.desc: "长宁的掌事者请以竹材制作耐用的交割记号，随货一并送往转仓之处。沿途纸券常因潮湿难辨，收货人既怕误认，也不愿只听承运者口述数目。\n\n这项办法属于本府拟办的新约，须以实物、印记和书记记录相互核对。若愿[Concept('hbe_term_trial', '出资试行')|e]，便可让邻府看到可验收的改进；若维持旧制，本府无需另备费用，行旅却仍要承担凭据受损的疑虑。"
 hbe_banquet.208.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.208.b: "守旧例，暂不承诺共担。"
 hbe_banquet.209.title: "昌州刻券"
 hbe_banquet.209.desc: "本府的出资承诺已被刻在石上，乡人称它比纸契更能流传。账房却指出，钱粮的用途与承担者仍须随实际交割查验，坚固的刻石并不会自动使一次承诺完成。\n\n昌州可以[Concept('hbe_term_trial', '资助试办')|e]，把碑记与可追溯的簿册相互印证；也可将旧有题记视作足够的保证。前者要花费眼下的钱粮，后者则将信任更多地寄托于后来者是否愿继续解释石上所记的责任。"
 hbe_banquet.209.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.209.b: "守旧例，暂不承诺共担。"
 hbe_banquet.210.title: "山城转仓"
 hbe_banquet.210.desc: "重庆的码头与仓场之间须循坡路搬运，商人请在共同预算中计入这段常被忽略的费用。纸上只记船只到岸，岸上的挑运、堆存与再交割却同样需要人手。\n\n[Concept('hbe_history_river', '川江')|e]的货运不止发生在水面。本府若[Concept('hbe_term_trial', '出资试办')|e]转仓[Concept('hbe_term_contract', '契约')|e]，便能使自己的运力和损耗获得共同承认；若只依旧例索取便利，沿江盟友可能仍将这些费用看作重庆一府应当自行承担的事。"
 hbe_banquet.210.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.210.b: "守旧例，暂不承诺共担。"
 hbe_banquet.211.title: "两岸渡牌"
 hbe_banquet.211.desc: "涪州的渡船来往于两岸，船主却常需分别取得许可，再把同一批货物申报两次。两处经手者各有账册，重复验印所费便被夹在交割之后，无人愿意列入共同预算。\n\n本府可以[Concept('hbe_term_trial', '出资试办')|e]一份两岸共同认可的渡牌，以减少争端、积累履约；也可维护各处旧权。方便往来与保全已有收入之间的取舍，将决定邻府是否愿意继续把转运交到我们手中。"
 hbe_banquet.211.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.211.b: "守旧例，暂不承诺共担。"
 hbe_banquet.212.title: "合州水口"
 hbe_banquet.212.desc: "合州的几处水口分别记载进出货物，账房请将同船的重复申报加以核对。地方长者谈起[Concept('hbe_history_diaoyu', '钓鱼城')|e]旧事，提醒诸府，守城与屯粮向来须使各处力量能够相接。\n\n如今要衔接的是仓场与账册。本府若[Concept('hbe_term_trial', '出资试办')|e]一套跨水口的交割办法，便可让[Concept('hbe_term_contract', '共同契约')|e]更易核验；若各自沿用旧簿，眼下的旧权得以保全，重复费用也将继续成为沿江的疑虑。"
 hbe_banquet.212.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.212.b: "守旧例，暂不承诺共担。"
 hbe_banquet.213.title: "峡口护运"
 hbe_banquet.213.desc: "夔州的掌事者愿为过峡货物提供护运，请以实际出动的人手与交割作为领款依据。也有人主张，只要船只经过本府险要之处，便应承担一项固定费用。\n\n[Concept('hbe_history_river', '川江')|e]险滩使熟悉水程的人格外重要，却也使收费容易被险阻掩盖。[Concept('hbe_term_trial', '出资试办')|e]可让夔州以真实的护运取得@hbe_yiqi! [Concept('hbe_term_yiqi', '信誉')|e]；依旧例办事虽可省去新约的开支，船主却未必愿将每一笔费用都视作必要之劳。"
 hbe_banquet.213.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.213.b: "守旧例，暂不承诺共担。"
 hbe_banquet.214.title: "酉阳的山程"
 hbe_banquet.214.desc: "府中收到的互市图将几段曲折山路画得十分简略，据此定下的运输额度远高于实际可运之数。沿途掌事者请以站点、歇宿与季候重新估量，不愿让纸上的短路变成商队的过重承诺。\n\n酉阳可以[Concept('hbe_term_trial', '出资试办')|e]沿程查验，让地方经验进入[Concept('hbe_term_contract', '共同契约')|e]；也可先守现有图册。若不说明真正的山程，本府以后每一次交付都可能再次被同样的额度所牵制。"
 hbe_banquet.214.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.214.b: "守旧例，暂不承诺共担。"
 hbe_banquet.215.title: "忠州的届次"
 hbe_banquet.215.desc: "忠州的书记发现，几份来文虽记着同样的费用，却属于不同届次。有人将旧年未偿者并入本届交割，有人则把过去的出资再次作为今日的履约，双方都能出示印信。\n\n将凭据注明届次，看似只是掌簿的小事，却能厘清功劳与债务。本府若[Concept('hbe_term_trial', '出资试办')|e]，便可使后来的[Concept('hbe_term_contract', '契约')|e]更易查验；若仍依经手者的记忆解释旧账，争论很可能比那些经手者活得更久。"
 hbe_banquet.215.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.215.b: "守旧例，暂不承诺共担。"
 hbe_banquet.216.title: "保宁的印信"
 hbe_banquet.216.desc: "保宁主持者请核对[Concept('hbe_term_elector', '选侯')|e]印信所附的担保，不许将同一份承诺反复用于不同事业。府臣认为这样有助维护[Concept('hbe_term_alliance', '会盟')|e]信用，地方旧家却担心，先人的习惯将被新的核验所约束。\n\n[Concept('hbe_history_shudao', '蜀道')|e]的轮役与圈内的授权虽各有用途，签押的分量却同样取决于持印者是否履约。[Concept('hbe_term_trial', '资助试办')|e]能够使本府的见证更受信任；守住旧例，则要接受盟友继续追问印后究竟承担了什么。"
 hbe_banquet.216.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.216.b: "守旧例，暂不承诺共担。"
 hbe_banquet.217.title: "巴州关役"
 hbe_banquet.217.desc: "新铸的关印已送到巴州，掌事者准备以它确认本届轮值。巡察人员同时请求查验驻守与交接记录，指出一枚完整的印信仍须有真实的守备作为凭据。\n\n本府可以出资把人手、粮料与关役编成可验收的[Concept('hbe_term_contract', '契约')|e]，使@hbe_roads! [Concept('hbe_term_roads', '轮戍履约')|e]得到清楚承认；也可维护原有签押方式。关口的事务越是倚赖彼此信任，账上缺少的那一段经历就越难长久略过。"
 hbe_banquet.217.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.217.b: "守旧例，暂不承诺共担。"
 hbe_banquet.218.title: "广元回程"
 hbe_banquet.218.desc: "沿[Concept('hbe_history_shudao', '蜀道')|e]往来的驿使带回一份请款，要求将回程的人马与粮料一并计入。共同预算过去只重送到[Concept('hbe_term_alliance', '会盟')|e]的货物，却未详记返还时仍需维持的关驿与接力。\n\n广元既是行旅经过之地，也须使人马能够持续往返。本府若[Concept('hbe_term_trial', '出资试办')|e]两程交接，便可为今后的轮役争取更清楚的认可；若只维持旧例，遗漏的费用仍将落在沿途少数肯承担者身上。"
 hbe_banquet.218.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.218.b: "守旧例，暂不承诺共担。"
 hbe_banquet.219.title: "剑州栈路"
 hbe_banquet.219.desc: "本府修治的一段险路已可通行，掌事者请以实地查验代替冗长的功绩文书。乡里愿为所出木石作证，邻府却还要求核对这段工程与原定共同事业的关系。\n\n[Concept('hbe_history_jianmen', '剑门关')|e]与[Concept('hbe_history_shudao', '蜀道')|e]的声名来自险要，也来自历代通行者的维护。剑州若愿资助可验收的交接，便能使新修之路进入共同记录；若只援引本府旧功，所得认可未必与所费相称。"
 hbe_banquet.219.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.219.b: "守旧例，暂不承诺共担。"
 hbe_banquet.220.title: "龙安山货"
 hbe_banquet.220.desc: "龙安准备以山中所出货物承担一部分共同费用，账房却在谷口价与府城价之间难以取舍。若按远处高价入账，承运者将负担损耗；若只按产地计价，本府的实际劳作又未能得到承认。\n\n我们可以[Concept('hbe_term_trial', '出资试办')|e]明确的换算与交割，给后来同类事务留下依据；也可依旧例继续商谈。如何把地方之物变成盟友愿认的凭据，正是本府参与公治时首先面对的问题。"
 hbe_banquet.220.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.220.b: "守旧例，暂不承诺共担。"
 hbe_banquet.221.title: "达州驿粮"
 hbe_banquet.221.desc: "达州的驿使换马之后取得了另一份口粮凭据，府中发现这段接力在两地账上都有记载。驿吏声称费用确实发生，审计者则要求分清哪些是连续行程，哪些已经重复给付。\n\n本府若[Concept('hbe_term_trial', '出资试办')|e]驿粮核验，便可让[Concept('hbe_history_shudao', '蜀道')|e]与邻路的接力更为可信；若维护原有做法，则少了一项眼下的开支。共同事业要经得起远行，首先须经得起对同一段行程的两份记述。"
 hbe_banquet.221.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.221.b: "守旧例，暂不承诺共担。"
 hbe_banquet.222.title: "顺庆接运"
 hbe_banquet.222.desc: "顺庆的掌事者请将江船抵岸与驿路启运记在同一份合同里。水程和陆程各有经手者，交接之间的停留与损耗却常由最后收货的一方承担。\n\n本府连接两种运输，既能争取更多公款，也须承担更明确的验收。[Concept('hbe_term_trial', '出资试办')|e]将为跨圈合作留下[Concept('hbe_term_contribution', '履约记录')|e]；仍依各自旧簿办事，则意味着下一次货物换程时，责任仍可能随凭据一同失去去向。"
 hbe_banquet.222.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.222.b: "守旧例，暂不承诺共担。"
 hbe_banquet.223.title: "简州目录"
 hbe_banquet.223.desc: "简州的掌簿吏提出为每届[Concept('hbe_term_contract', '共同合同')|e]编制目录，方便查寻先前的签押。试排之后，他们发现几份名称不同的文书竟指向同一笔旧欠款，几家当事者却一直各按自己的叫法索偿。\n\n本府可以[Concept('hbe_term_trial', '资助这项试办')|e]，使[Concept('hbe_term_contract', '契约')|e]与出资更易查验；也可将它视作书记应自行完成的小事。若愿为眼下的核对付出钱粮，后来的领主或许就不必再从同一箱杂乱旧券中寻找答案。"
 hbe_banquet.223.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.223.b: "守旧例，暂不承诺共担。"
 hbe_banquet.224.title: "遂宁出仓"
 hbe_banquet.224.desc: "遂宁仓吏请以实际出库与受领记录作为赈粮信用的依据。几家乡人已经送来谢意，也有人认为有了题名和见证便应算作交付，未必需要逐项核对数量。\n\n@hbe_grain! [Concept('hbe_term_grain', '义仓储备')|e]应能在急时成为真正可用的粮食。本府若[Concept('hbe_term_trial', '出资试办')|e]出仓[Concept('hbe_term_contract', '契约')|e]，便可使赈济与共同账目相互印证；若依旧例办理，表面上的和睦能够维持，仓中实物与案上功绩却可能渐渐分离。"
 hbe_banquet.224.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.224.b: "守旧例，暂不承诺共担。"
 hbe_banquet.225.title: "潼川印号"
 hbe_banquet.225.desc: "潼川准备为[Concept('hbe_term_contract', '共同契约')|e]的印记编定次序，以便追明每一份文书何时颁行、由谁认领。旧家担心新规使过去的凭据难再援引，书记则说，正因要承认[Concept('hbe_term_contract', '旧约')|e]，才须分清新旧。\n\n[Concept('hbe_term_trial', '出资试办')|e]可以为本府积累一份可验收的事业，也有望减少错引与重复担保。若维护原有惯例，省下的只是眼下的编册费用；后来发生争议时，各方仍须逐枚印信寻找它曾经代表的承诺。"
 hbe_banquet.225.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.225.b: "守旧例，暂不承诺共担。"
 hbe_banquet.226.title: "广安旧粮券"
 hbe_banquet.226.desc: "广安运来旧年的仓粮凭据，请[Concept('hbe_term_alliance', '会盟')|e]承认此前救急时所出的粮食。掌事者同时指出，这些功绩应记入旧届，不能借此免去本届另已答应的交割。\n\n@hbe_yiqi! [Concept('hbe_term_yiqi', '信誉')|e]既须尊重过去，也须辨明今日的责任。本府可以[Concept('hbe_term_trial', '出资试办')|e]分届核验，使先人的贡献与现任的履约各得其所；也可以坚持旧券足以涵盖眼下的要求，但其他诸府未必愿以同样的理解共同认账。"
 hbe_banquet.226.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.226.b: "守旧例，暂不承诺共担。"
 hbe_banquet.227.title: "雅州茶马券"
 hbe_banquet.227.desc: "雅州商队把茶货与换得的马匹写在同一页凭据上，采办者觉得简明，承运者却要求分别注明各段责任。[Concept('hbe_history_tea', '雅州茶马司')|e]的旧事仍被传说，今日的互市也须使货与价能够彼此对照。\n\n本府若[Concept('hbe_term_trial', '资助试办')|e]，将采购和运输分项核验，便可使@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]更为可靠；若仍沿用熟人之间的旧法，眼前交易虽能继续，下一次发生损耗时却仍难说明应由哪一方承担。"
 hbe_banquet.227.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.227.b: "守旧例，暂不承诺共担。"
 hbe_banquet.228.title: "茂州轮值"
 hbe_banquet.228.desc: "茂州的山门调停名单上，同一位掌事者被几府同时列作轮值。当地长者说，此人确有公信，却不能一身同时赴几处谷口，名单上的整齐并不能让争端自动平息。\n\n我们可以[Concept('hbe_term_trial', '出资试办')|e]按实际人员交接的议约，让@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]与地方见证更能持续；也可维护旧有名义。对于须走过山路才能到来的调停者，履约首先意味着他确实能够抵达。"
 hbe_banquet.228.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.228.b: "守旧例，暂不承诺共担。"
 hbe_banquet.229.title: "松潘长路"
 hbe_banquet.229.desc: "松潘的商队将沿途站点逐一列出，请府中重新估量运输所费。共同预算过去只留一项山程费用，却未分明雪阻、歇宿和换驮各自发生在何处。\n\n本府可以出资把这些经验写成可验收的[Concept('hbe_term_contract', '契约')|e]，使长路上的劳作不再只见于行旅的口述；也可先依旧例办事。若诸府仍只按图上的一条线分摊，本府此后的交付便会继续承担那些无人愿认的差额。"
 hbe_banquet.229.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.229.b: "守旧例，暂不承诺共担。"
 hbe_banquet.230.title: "盐源旧尺"
 hbe_banquet.230.desc: "盐源互市沿用的量尺与府城新定尺度略有不同，商人因此在换算时各执一词。乡里并不拒绝共同交割，却担心突然改尺会使自己原有的货物与债约一并贬损。\n\n本府若[Concept('hbe_term_trial', '出资试办')|e]登记换算，便能使旧习和新[Concept('hbe_term_contract', '契约')|e]在同一册中相互核验，积累@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]。若维护原来的做法，眼下的买卖不会骤变，跨圈的交易却仍须逐回重新商谈数量。"
 hbe_banquet.230.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.230.b: "守旧例，暂不承诺共担。"
 hbe_banquet.231.title: "德昌轮签"
 hbe_banquet.231.desc: "德昌的议事者提议，共同文书先由各谷轮流见证，再由本府呈报。府臣担心手续增加，地方长者则认为，只有让实际承担者知道条款，府城的签押才不会在谷口失去分量。\n\n[Concept('hbe_term_trial', '资助试办')|e]将花费钱粮，也会给@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]留下可验收的记录；依旧例集中用印则较为简便。我们如何安排两者，将决定日后的共同事业被看作本府命令，还是各地愿意继续履行的约定。"
 hbe_banquet.231.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.231.b: "守旧例，暂不承诺共担。"
 hbe_banquet.232.title: "黎州通行约"
 hbe_banquet.232.desc: "黎州的掌事者请先确认共用山路的商队，再依使用与维护划分费用。旧券只记路权，途中由谁修桥、何时须为行旅开路，却多凭长者记忆相传。\n\n[Concept('hbe_history_tea', '雅州茶马司')|e]曾使周边互市更有章法，今日的山程仍需要实际使用者共同认账。本府若愿[Concept('hbe_term_trial', '出资试办')|e]，便可将这段经验纳入@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]；若仅依旧券行事，未说清的维护之责仍会在下一次风雨后重现。"
 hbe_banquet.232.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.232.b: "守旧例，暂不承诺共担。"
 hbe_banquet.233.title: "马湖渡额"
 hbe_banquet.233.desc: "府库按理想船型定下渡运额度，马湖船户却带来现有船只的量度。水程、吃水与可载之物都有实际限制，纸上多列的一份货物并不能因此送到彼岸。\n\n我们可以[Concept('hbe_term_trial', '出资试办')|e]真实运力的查验，使@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]与共同采办相互印证；也可继续维持旧额。前者须承担眼下的核验之费，后者则让船户在每次交付时为同一项不切实际的承诺寻求通融。"
 hbe_banquet.233.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.233.b: "守旧例，暂不承诺共担。"
 hbe_banquet.234.title: "建昌诸谷议事"
 hbe_banquet.234.desc: "建昌的代表请求，让谷中实际承担互市与维护的人参加议约。府臣认为本府主印已经能够代表辖境，长者却指出，不同山谷的习惯与所费不能只由一份总数涵盖。\n\n若[Concept('hbe_term_trial', '出资试办')|e]地方见证，建昌可以使自己的主持权建立在更清楚的@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]之上；若沿用旧例，议事固然简便，签押所要求的义务却未必为每一处谷口同样理解。"
 hbe_banquet.234.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.234.b: "守旧例，暂不承诺共担。"
 hbe_banquet.235.title: "永宁互市场"
 hbe_banquet.235.desc: "永宁有人建议将互市安排得更近商队必经之处，以减少往返和停留。现有掌事者担心新场所增加巡察之劳，沿途居民则愿以自己的见证换取共同认可。\n\n本府可以[Concept('hbe_term_trial', '出资试办')|e]交割与议约，使便于行旅的安排成为可验收的事业；也可维持现有地点与旧权。互市最终能否为地方所用，取决于货物、人手与规则是否真能在同一处相遇。"
 hbe_banquet.235.a: "拨款，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.235.b: "守旧例，暂不承诺共担。"
 hbe_banquet.30.title: "渠旁与堂上"
 hbe_banquet.30.desc: "本届主持者要求在议事堂增设本府的座位，理由是近年所承渠工甚多。沿江诸侯随即呈上护运凭据，关驿的代表则指出，若无道路通畅，堂中的文书便根本送不到各府。\n\n究竟依旧日名望排列席次，还是按实际事业承认功劳，已成为诸侯彼此试探的题目。一个看似微小的安排，可能决定某府今后是否愿意继续为[Concept('hbe_term_success', '共同项目')|e]承担额外之劳。"
 hbe_banquet.30.a: "拨款项重审共同规则。"
 hbe_banquet.30.b: "拿三点@hbe_yiqi! [Concept('hbe_term_yiqi', '信誉')|e]担保下一届。"
 hbe_banquet.30.c: "保留本府意见。"
 hbe_banquet.31.title: "先人的签押"
 hbe_banquet.31.desc: "一位使者呈上祖辈留下的保证书，声称本府与[Concept('hbe_term_alliance', '会盟')|e]的情谊由来已久，应免去此次核验。书记承认旧印无误，却在库册中找不到本届相应的出资与货物。\n\n前人的声望可以使一份承诺更易被接受，却不能替后来者完成交割。我们若尊重[Concept('hbe_term_contract', '旧约')|e]，须确认继承它的人同样承担义务；若只按眼前的账数行事，又可能让那些曾经相助的家族觉得被轻慢。"
 hbe_banquet.31.a: "拨款项重审共同规则。"
 hbe_banquet.31.b: "拿三点@hbe_yiqi! [Concept('hbe_term_yiqi', '信誉')|e]担保下一届。"
 hbe_banquet.31.c: "保留本府意见。"
 hbe_banquet.32.title: "继任者的库册"
 hbe_banquet.32.desc: "皇帝已经更替，公共采办的清单却仍沿用旧例。库吏逐项报出所需钱粮，众人这才发现，有些府州的辖境已变，有些承担费用的机构也早已并入他处。\n\n主持者可以重新安排公款，但每一次更动都会牵涉旧受益者与新负担者。[Concept('hbe_term_alliance', '会盟')|e]若要比一代人的在位更长久，便须使责任随机构和事业延续，而非只追随一枚属于现任的印信。"
 hbe_banquet.32.a: "拨款项重审共同规则。"
 hbe_banquet.32.b: "拿三点@hbe_yiqi! [Concept('hbe_term_yiqi', '信誉')|e]担保下一届。"
 hbe_banquet.32.c: "保留本府意见。"
 hbe_banquet.33.title: "敕书重录"
 hbe_banquet.33.desc: "府库中的[Concept('hbe_term_isolation', '旧敕书')|e]因纸损需要重录，掌事者因此重新核对了自治与盐粮交割的条款。山外的传闻时时变化，诸侯却仍须依现有盟约维护通商与境内秩序。\n\n重录并非重新立约。有人希望趁此改动几句文字，使本府少负一项义务；也有人坚持原文一字不易。我们应如何保存先人留下的保障，又如何让后来者明白其中的责任，不能只由抄写文书的人决定。"
 hbe_banquet.33.a: "拨款项重审共同规则。"
 hbe_banquet.33.b: "拿三点@hbe_yiqi! [Concept('hbe_term_yiqi', '信誉')|e]担保下一届。"
 hbe_banquet.33.c: "保留本府意见。"
 hbe_banquet.34.title: "图册上的山路"
 hbe_banquet.34.desc: "新修的圈际图册已经送来，谷中代表却指出，一条常用的山路在图上被缩成了不起眼的支线。沿途需修的桥栈与安置的转运人手，因此未列入共同费用。\n\n纸上的远近与行旅实际所费并不总是相同。若愿重勘道路，@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]和驿路的经验便能成为依据；若只据现有图册拨款，被漏下的地方将不得不自行补足缺口。"
 hbe_banquet.34.a: "拨款项重审共同规则。"
 hbe_banquet.34.b: "拿三点@hbe_yiqi! [Concept('hbe_term_yiqi', '信誉')|e]担保下一届。"
 hbe_banquet.34.c: "保留本府意见。"
 hbe_banquet.35.title: "百年约首"
 hbe_banquet.35.desc: "章程草案已经写成，开篇所列的却不是颂辞，而是共同事业应由谁出资、谁验收、谁对未交付之事负责。阅卷的诸侯有人欣慰，有人则认为如此直白有失典礼。\n\n百年的[Concept('hbe_term_contract', '旧约')|e]之所以还能被援引，正在于它留下了可行的办法。我们今日的文书若只适合诵读，却不能用于渠旁与仓场，后来者终究还要为同样的问题再开一次[Concept('hbe_term_alliance', '会盟')|e]。"
 hbe_banquet.35.a: "拨款项重审共同规则。"
 hbe_banquet.35.b: "拿三点@hbe_yiqi! [Concept('hbe_term_yiqi', '信誉')|e]担保下一届。"
 hbe_banquet.35.c: "保留本府意见。"
 hbe_banquet.36.title: "续约之年"
 hbe_banquet.36.desc: "最早的主持者已无一在世，许多府州也经历了更易与整合。官吏仍按时重开簿册，商队仍在关口请求验印，受水的乡里则继续为下一次岁修备料。\n\n[Concept('hbe_term_alliance', '会盟')|e]的意义已不再只属于开创之人。是否按约交付、是否认可地方旧权，正由今日的领主重新作答。若我们愿把这份事业留给后人，便须承认[Concept('hbe_term_charter', '百年章程')|e]也只是持续治事的开端。"
 hbe_banquet.36.a: "拨款项重审共同规则。"
 hbe_banquet.36.b: "拿三点@hbe_yiqi! [Concept('hbe_term_yiqi', '信誉')|e]担保下一届。"
 hbe_banquet.36.c: "保留本府意见。"

 hbe_guest_eastern_river.title: "订立重庆川东圈客籍议约"
 hbe_guest_eastern_river.title.entry: "订立重庆川东圈客籍议约"
 hbe_guest_eastern_river.desc: "整合一处旧府州，并不等于掌握当地所有技艺。本府愿认可旧日见证，承担机构维护，并请当地承办者依原约保留本业。\n\n研究「匠人互访」与「统一度量」，采用「乡社议办」，义气达到60，并拥有该圈至少一处直属土地后，可签订客籍议约。支付按月税贸收入75%计算的雇办费（最低3金币），消耗10义气，取得当地机构、基础生产方式及基础军制资格。营建仍限该圈土地，高级工艺须另行解锁，不复制地区科技的数值加成。"

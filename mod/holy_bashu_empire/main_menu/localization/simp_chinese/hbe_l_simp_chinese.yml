 country_description_category_name_hbe_profile_baq: "泸州：井灶、窖坊与采办"
 country_description_category_desc_hbe_profile_baq: "泸州的城郭面对江运，酒坊与沿岸采办又各有自己的守时办法。府库既希望集中采购，也不得不依赖船户、作坊与乡里的实际供给。\n\n叙州拥有本圈最初的主持名望，泸州则可凭稳定的供应争取更多份额。井灶公账与窖坊分工是两条不同的道路：前者重在信用担保，后者重在采办[Concept('hbe_term_contract', '契约')|e]；本府的选择将决定它在共同事业中承担何种责任。"
 country_history_BAW: "宋元之际的兵火曾使蜀地城郭与乡里凋敝，今日的渠堰、井灶与关驿仍须由留在当地的人重新接续。本剧本假设，朝廷以转运贡额和关津保证承认诸府共同签立的自治敕约：三十六府州分别治事，[Concept('hbe_term_circle', '七圈')|e]协调邻府，皇帝主持跨圈公议。此约是架空[Concept('hbe_term_alliance', '会盟')|e]的起点，并非史实中的四川帝国。\n\n川南井盐与酿造为府库带来收入，也将木料、汲卤、煎盐和远途采办联在一起。宋代四川盐井技术留下的积累仍在，盐引的信用却只能靠后来者按期交割维持。\n\n长宁的山地与邻近通路，使货物出产和送达不能分开筹划。对本府而言，一份已经收下的订单，只有经过备料、候运与核账，才算真正完成。\n\n在川南盐酒圈中，长宁没有天然属于自己的总号或[Concept('hbe_term_elector', '选侯')|e]席位，却能从可靠的小规模交付起业。先积累@hbe_salt! [Concept('hbe_term_salt', '盐引信用')|e]，再选择担保或宴席经营，可以使偏处的府州逐步参与更大的跨圈事业。"
 country_description_category_name_hbe_profile_baw: "长宁：井灶、窖坊与采办"

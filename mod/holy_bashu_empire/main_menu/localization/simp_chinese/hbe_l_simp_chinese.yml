 hbe_salt_loan.title: "发行盐引周转"
 hbe_salt_loan.title.entry: "发行盐引周转"
 hbe_salt_loan.desc.entry: "盐业的交付还在来年，工程所需的钱却已经到了眼前。井灶掌事愿以预期收入作保，库吏也提醒我们，一枚盐引的便利将伴随此后逐年的利息。\n\n借来的钱可以使事业早日动工，偿还的责任却不能交给尚未到来的丰年。我们应让担保、欠额与还款同时入册。"
 hbe_salt_repay.title: "归还盐债"
 hbe_salt_repay.title.entry: "归还[Concept('hbe_term_debt', '盐债')|e]"
 hbe_salt_repay.desc.entry: "库中已有可以调度的钱，旧盐引仍写着本府的承诺。将债额减去一份，不仅使往后的担保更有余地，也让出借者看见诸侯的印信能够对应真实偿付。\n\n府臣将重核旧券，按实际还款注销相应欠额，并将这次履约记入[Concept('hbe_term_alliance', '会盟')|e]公账。"
 hbe_status.title: "查看巴蜀会盟账本"
 hbe_status.title.entry: "查看[Concept('hbe_term_alliance', '巴蜀会盟')|e]账本"
 hbe_status.desc.entry: "府臣呈上各处事业的簿册，想知道我们在诸侯间的声望究竟依托何物。名号可以在典礼上宣读，履约却须逐笔说明。\n\n查阅本府的@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]、地方储备与未结事项，下一次采办和议约便有了可以核对的依据。"
 hbe_assembly.title: "召开帝国茶会"
 hbe_assembly.title.entry: "召开帝国茶会"
 hbe_assembly.desc.entry: "各府使者带着不同的账册来到议事堂，有人请求共修，有人坚持旧权。皇帝的主持并不能使这些差别自行消失，却能给各方留下当堂说明的机会。\n\n本府愿出资召开茶议，使共同经费与自治之责得到明确作答；堂上今日认可的安排，终须回到渠旁、仓场与关驿接受查验。"

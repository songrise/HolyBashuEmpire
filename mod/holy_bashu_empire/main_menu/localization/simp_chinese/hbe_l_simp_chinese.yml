 hbe_civic.106.title: "断了的栈道：府议"
 hbe_civic.106.title.entry: "当值者未至"
 hbe_civic.106.desc: "山雨冲断了栈道，驿吏将积压的公文送到府衙。关口的守军尚有存粮，过路商人却无法继续等候。附近乡民已经出过一轮[Concept('hbe_term_roads', '驿役')|e]，听说还要抽丁修路便起了争执。\n\n增征人手能尽快接通道路；由府库付工钱，并统一驿券，也许更适于长久经营。几支商队愿自行设站，只要求官吏不再逐处干预。\n\n府议已将争议送到我们面前。公款、地方储备与民役都有人提出，各方希望我们明确今后由谁承担费用。"
 hbe_civic.106.a: "府库付钱，给乡里减役。"
 hbe_civic.106.b: "动用地方储备，由乡社主持。"
 hbe_civic.106.c: "增征民役，加紧办完。"
 hbe_civic.107.title: "驿券与纸坊：府议"
 hbe_civic.107.title.entry: "栈木谁来补"
 hbe_civic.107.desc: "驿站领用的纸张参差不齐，有的券尾受潮后已无法辨认。关吏因此扣留几批商货，声称须待府衙核实印记才能放行。\n\n抄券人请求府库扶持附近纸坊，重订领用章程。我们也可增派[Concept('hbe_term_roads', '驿役')|e]逐站查验，或准商队自行凭保任书通行。\n\n府议已将争议送到我们面前。公款、地方储备与民役都有人提出，各方希望我们明确今后由谁承担费用。"
 hbe_civic.107.a: "府库付钱，给乡里减役。"
 hbe_civic.107.b: "动用地方储备，由乡社主持。"
 hbe_civic.107.c: "增征民役，加紧办完。"

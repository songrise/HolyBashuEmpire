 hbe_mission_southwestern_valleys_5: "川西南山谷圈：[Concept('hbe_term_charter', '百年章程')|e]"
 hbe_mission_southwestern_valleys_5.desc: "川西南山谷圈的谷市、乡寨与地方见证仍须由实际承担者接续。百年前的开创者已经不在，今日的乡里仍在使用他们留下的道路与规矩。把实际交付写入新的章程，是让后来的主持者能够继续治事，而非只诵读先人的名号。\n\n我们将呈上本府的交付凭据，请圈中查验这项事业是否已经能够承担下一阶段的责任。\n\n#T 办理与验收#!\n[Concept('hbe_term_charter', '百年章程')|e]验收需要研究、持续交付与真实出资。消耗 10 点@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]和 10 金币；@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]增加 5，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]增加 2。"
 hbe_mission_southwestern_valleys_5.a: "依议办理。"
 hbe.106.title: "谷市的农具"
 hbe.106.desc: "谷市的铁木作坊接到一批农具订单，匠人却在为运料争执。官吏要求按期出货，[Concept('hbe_term_valleys', '乡寨')|e]长者说山民还须照管自己的田地，不能总随官府调遣。\n\n我们可以督促作坊交货，拨款修路并雇用工匠，或承认乡寨自行安排互市。作坊的收益、乡里的负担与官府的权威，今次很难一并照顾。"
 hbe.106.a: "让铁木作坊加紧交货。"
 hbe.106.b: "拨款修路，雇用谷中工匠。"
 hbe.106.c: "承认乡寨自办互市的权利。"
 hbe_salt_loan: "发行盐引周转"
 hbe_salt_loan.desc: "盐业的交付还在来年，工程所需的钱却已经到了眼前。井灶掌事愿以预期收入作保，库吏也提醒我们，一枚盐引的便利将伴随此后逐年的利息。\n\n借来的钱可以使事业早日动工，偿还的责任却不能交给尚未到来的丰年。我们应让担保、欠额与还款同时入册。\n\n#T 办理与验收#!\n取得 15 金币，增加 10 点[Concept('hbe_term_debt', '盐债')|e]；每年需支付 1 金币利息，欠债上限 30。"
 hbe_salt_loan.a: "依议办理。"
 hbe_salt_repay: "归还[Concept('hbe_term_debt', '盐债')|e]"
 hbe_salt_repay.desc: "库中已有可以调度的钱，旧盐引仍写着本府的承诺。将债额减去一份，不仅使往后的担保更有余地，也让出借者看见诸侯的印信能够对应真实偿付。\n\n府臣将重核旧券，按实际还款注销相应欠额，并将这次履约记入[Concept('hbe_term_alliance', '会盟')|e]公账。\n\n#T 办理与验收#!\n支付 10 金币，归还 10 点[Concept('hbe_term_debt', '盐债')|e]并恢复@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]。"
 hbe_salt_repay.a: "依议办理。"
 hbe_status: "查看[Concept('hbe_term_alliance', '巴蜀会盟')|e]账本"
 hbe_status.desc: "府臣呈上各处事业的簿册，想知道我们在诸侯间的声望究竟依托何物。名号可以在典礼上宣读，履约却须逐笔说明。\n\n查阅本府的@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]、地方储备与未结事项，下一次采办和议约便有了可以核对的依据。\n\n#T 办理与验收#!\n查看@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]、@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]、研究进度和[Concept('hbe_term_isolation', '自治盟约')|e]。"
 hbe_status.a: "执行"
 hbe_assembly: "召开帝国茶会"
 hbe_assembly.desc: "各府使者带着不同的账册来到议事堂，有人请求共修，有人坚持旧权。皇帝的主持并不能使这些差别自行消失，却能给各方留下当堂说明的机会。\n\n本府愿出资召开茶议，使共同经费与自治之责得到明确作答；堂上今日认可的安排，终须回到渠旁、仓场与关驿接受查验。\n\n#T 办理与验收#!\n皇帝出资召集诸侯，讨论公共经费与自治。五年可召开一次。"
 hbe_assembly.a: "依议办理。"
 hbe.1.title: "山川之间的盟誓"
 hbe.1.desc: "宋元兵事留下的山城与荒田，至今仍在提醒蜀中诸府：险阻足以守境，却不能独自养民。岷江的水、井灶的盐与山外的马，各有其主，也各有所缺。\n\n诸侯于是依[Concept('hbe_term_isolation', '自治盟约')|e]共立[Concept('hbe_term_alliance', '会盟')|e]，分圈治事，推举皇帝主持盐粮交割与道路修复。敕书所保的是诸府的旧权，盟誓所求的是巴蜀的长治；要使两者相容，仍须有人先付出钱粮。"
 hbe.1.a: "先把本府经营起来。"
 hbe.2.title: "匠师呈来新法"
 hbe.2.desc: "官学的案头终于摆上了新修的图样与簿册。学者考订旧法，匠师以实物反复试验，来自乡里的经验也被写入其中。有人说这些不过是祖辈早已熟悉的技艺，有人却指出，旧事一经厘清，便能传授给更多的人。\n\n[Concept('hbe_term_research', '课题')|e]已经告成，府中可以据此筹办后续事业。真正的考验将发生在渠旁、井下与山道上；成书只是一项新法开始被使用的日子。"
 hbe.2.a: "记入本府账簿。"
 hbe.3.title: "工成而后论功"
 hbe.3.desc: "三年工期已满，掌事者带着领料簿、交接凭据与乡里签押来到府衙。曾经在图上细如一线的渠道和道路，如今已有百姓沿它往来；曾经空着的仓位，也终于能够按册交割。\n\n验收官确认本府完成了所承事业，[Concept('hbe_term_regional', '地区履约')|e]因此有了新的凭据。各家自然都愿将功劳写得长些，然而明年的维护与下一次续办，才会决定这番投入能留下多久。"
 hbe.3.a: "这次确实出了力。"
 hbe.4.title: "府库与会盟"
 hbe.4.desc: "掌簿吏将地方账册与[Concept('hbe_term_alliance', '会盟')|e]来文并排铺开。一册记本府的@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]，一册记诸侯共同维持的@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]；各圈的储备、正在资助的[Concept('hbe_term_research', '地方课题')|e]，以及久未兑付的[Concept('hbe_term_debt', '盐债')|e]，也都有案可查。\n\n领主可以更替，债券与[Concept('hbe_term_contract', '契约')|e]却不会随之消失。若要为后来的执政者留下一份可用的家业，我们须先分清哪些是本府已有的积累，哪些只是向盟友许下的承诺。\n\n#T 账册摘录#!\n本国@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]：[ROOT.GetVariable('hbe_yiqi').GetValue|0] / 100。\n帝国@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]：[GetUniqueInternationalOrganization('hbe_empire').MakeScope.GetVariable('hbe_guoqi').GetValue|0] / 100。\n[Concept('hbe_term_research', '地区研究')|e]通过决议资助，完成计时后自动交付；同一时刻只能研究一项。\n[Concept('hbe_term_isolation', '自治盟约')|e]限制域外宣战与战争召集。百年经营继续开放，[Concept('hbe_term_tianfu', '天府加成')|e]不会到期。"
 hbe.4.a: "账看完了，继续忙。"
 hbe.10.title: "初业之后"
 hbe.10.desc: "[Concept('hbe_term_alliance', '会盟')|e]初立时的主持者已渐渐退居幕后，接替他们的人面对的是逐年增加的凭据与[Concept('hbe_term_contract', '旧约')|e]。前一代愿凭交情相助，后一代却要知道父辈究竟答应了什么。\n\n渠工、盐运和互市不再只是一次试办。诸府开始为长期事业筹措人手，要求[Concept('hbe_term_research', '地方课题')|e]与实际履约相互印证。一份能延续的章程，须比一场成功的议会更经得起岁月。"
 hbe.10.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe.11.title: "旧契的分量"
 hbe.11.desc: "库中[Concept('hbe_term_contract', '旧契')|e]已有纸色泛黄者，契尾的名字也有不少只见于家谱。如今承接田地、井灶与船场的人，既享受前人的便利，也被要求继续负担旧日的费用。\n\n有的府州愿按原约办事，有的则主张重新核定水权、路役与交割。若将所有旧承诺一笔勾销，盟友必有疑虑；若不问情势变化，又会让后来者背上无法承担的义务。"
 hbe.11.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe.12.title: "治所更易"
 hbe.12.desc: "几个府州的治所与辖境已经改变，商路却仍沿旧日的河谷伸展。并入大国的城镇保留着自己的仓场、匠人和水渠，[Concept('hbe_term_contract', '旧契')|e]上也仍认得它们的地名。\n\n[Concept('hbe_term_alliance', '会盟')|e]必须决定如何让这些机构继续运作。新领主可以接掌旧府州的事业，却不能凭一次改名便抹去邻地的权利。地区重组所考验的，是我们治理旧有关系的本领。"
 hbe.12.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe.13.title: "山外的货价"
 hbe.13.desc: "过关的商人带来新的市价：同一篓茶、同一引盐，已经不能换回祖辈记忆中的货物。道路未必改变，沿途的需求、损耗与采购条件却时时不同。\n\n诸府必须重新估量[Concept('hbe_term_service', '公共事业')|e]的用途。山外局势纵然纷扰，[Concept('hbe_term_isolation', '自治盟约')|e]仍维持着[Concept('hbe_term_alliance', '会盟')|e]的边界；在其庇护之内，我们也不能把旧账上的价格当作永远不变的天数。"
 hbe.13.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe.14.title: "百年之约"
 hbe.14.desc: "初盟之年的乡人，早已成为家祠中受祭的先辈。渠水依旧入田，井灶仍冒白烟，但主持这些事业的人已换过数代。如今诸府要为这百年的积累重新定名、定责。\n\n[Concept('hbe_term_charter', '百年章程')|e]的验收将检视[Concept('hbe_term_research', '地方课题')|e]与持续交付，而非只看文书上有多少颂辞。若后人仍能借这些机构取水、通商、赈饥，我们今日的签押便有了超出一代人的意义。"
 hbe.14.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe.5.title: "会盟茶议"
 hbe.5.desc: "茶盏沿长案依次摆开，来自平原、江岸与山谷的使者将各自文书交给书记。此次议事既有修渠护运的请款，也有圈际费用的争论；每一项看似微小的差额，背后都牵着一处府库或一季收成。\n\n作为主持者，皇帝可以先以@hbe_guoqi! [Concept('hbe_term_guoqi', '共同信用')|e]承担开支，换取诸府的信任；也可以要求各家多尽一份义务。茶汤尚温，众人却已望向案上的账册，等待我们表明立场。"
 hbe.5.a: "[Concept('hbe_term_service', '公共事业')|e]，皇帝[Concept('hbe_term_pledge', '先认账')|e]。"
 hbe.5.b: "各位也该分担一点。"
 hbe_BAB_scenario: "成都锦官公国"
 hbe_BAB_scenario_desc: "锦官城的织机与平原的渠田，使成都在巴蜀诸府之中享有声望。[Concept('hbe_history_dujiangyan', '都江堰')|e]留下的治水传统、[Concept('hbe_history_shujin', '蜀锦')|e]的经营与[Concept('hbe_history_wenweng', '文翁')|e]兴学的旧事，提供了不同的治国道路。\n\n如今本府掌握平原圈的[Concept('hbe_term_elector', '选侯')|e]席位，也主持帝国最初的公议。邻府认可成都的名望，却未必愿意长期承担由成都决定的费用。皇位可以带来主持之权；能否使渠旁的人同样受益，才决定这种权威能维持多久。"
 hbe_BAE_scenario: "汉州侯国"
 hbe_BAE_scenario_desc: "汉州居于平原北部，受水的田亩与连接邻府的通路同样重要。城中的库吏关注交割，乡里的掌事者则关心何时开渠、何处备料，两者未必总能在同一本账上作答。\n\n成都近在一旁，给本府带来市场与议事的便利，也使汉州必须争取自己的声音。以真实渠务取得@hbe_water! [Concept('hbe_term_water', '水权储备')|e]，再将[Concept('hbe_term_local_service', '地方事业')|e]写入共同账册，本府便能用稳妥的交付换取比疆域更广的影响。"
 hbe_BAF_scenario: "彭州侯国"
 hbe_BAF_scenario_desc: "彭州位于平原与山地相接之处，田亩的受水、山口的通行与地方采办相互牵连。一项看似只关渠口的决定，往往也改变了沿路乡里的负担。\n\n本府疆域有限，难以单靠兵势左右成都的公议，却可以在修渠与讲会之间选择自己的长处。让旧水次得到清楚记录，或以官学联络各府，都能使彭州成为平原圈不能轻易忽略的一员。"
 hbe_BAJ_scenario: "邛州侯国"
 hbe_BAJ_scenario_desc: "邛州的城郭与作坊连着平原西缘的行旅，器物的流转也连着乡里的日常生计。[Concept('hbe_history_qiong', '邛窑')|e]旧日的声名提醒掌事者：地方巧技只有得到可靠采办与传习，才能超出一时的好奇。\n\n在新的[Concept('hbe_term_alliance', '会盟')|e]中，邛州无需与大府争夺每一次主持权。修渠保产、组织作坊与参加匠人互访，都能为本府积累履约信誉。如何使工匠的长处成为诸侯共同需要的事业，将决定这座小国的前途。"
 hbe_BAL_scenario: "眉州侯国"
 hbe_BAL_scenario_desc: "眉州的乡田与市集养育了自己的地方社会，[Concept('hbe_history_sansu', '三苏')|e]留下的文章与声名又使它在蜀中文脉中有一席之地。书卷可以传得很远，乡里的渠务与借券却仍须有人逐件办理。\n\n本府可以沿水权之路维持粮政，也可以在官学讲会中争取主持之誉。若以议论代替交付，声望终究会被邻府的账册质问；若让公议回应地方生计，眉州便能将文化之名化为长久的[Concept('hbe_term_alliance', '会盟')|e]信用。"
 hbe_BAO_scenario: "嘉定山门侯国"
 hbe_BAO_scenario_desc: "嘉定的山门、河谷与往来行旅，使此地同时面对施济、渡运和采办的需要。峨眉山周边不同生活习惯并存，府库的安排必须得到实际承担事务的人理解。\n\n本府属于川南盐酒圈，却不必只凭井盐经营立足。盐酒协作的宴席支线给嘉定留下了待客与采办的道路；清楚的[Concept('hbe_term_contract', '契约')|e]和可靠的交割，可以使山门与市集成为本府参与帝国事业的根基。"
 hbe_BAP_scenario: "叙州盐酒商邦"
 hbe_BAP_scenario_desc: "叙州的水程与城中的采办相互依赖，盐酒、粮料和行旅在此需要可信的交割安排。沿江便利带来了商机，也使一笔拖延的款项能够牵动不止一家经营。\n\n作为川南盐酒圈最初的[Concept('hbe_term_elector', '选侯')|e]，叙州可以沿井灶担保走向共同融资，也可以以席面采购赢得诸侯的委托。总号的印信不会自行生出信用；本府必须在借款的便利与偿还的责任之间守住自己的分寸。"
 hbe_BAQ_scenario: "泸州侯国"
 hbe_BAQ_scenario_desc: "泸州的城郭面对江运，酒坊与沿岸采办又各有自己的守时办法。府库既希望集中采购，也不得不依赖船户、作坊与乡里的实际供给。\n\n叙州拥有本圈最初的主持名望，泸州则可凭稳定的供应争取更多份额。井灶公账与窖坊分工是两条不同的道路：前者重在信用担保，后者重在采办[Concept('hbe_term_contract', '契约')|e]；本府的选择将决定它在共同事业中承担何种责任。"
 hbe_BAW_scenario: "长宁侯国"
 hbe_BAW_scenario_desc: "长宁的山地与邻近通路，使货物出产和送达不能分开筹划。对本府而言，一份已经收下的订单，只有经过备料、候运与核账，才算真正完成。\n\n在川南盐酒圈中，长宁没有天然属于自己的总号或[Concept('hbe_term_elector', '选侯')|e]席位，却能从可靠的小规模交付起业。先积累@hbe_salt! [Concept('hbe_term_salt', '盐引信用')|e]，再选择担保或宴席经营，可以使偏处的府州逐步参与更大的跨圈事业。"
 hbe_BAX_scenario: "昌州侯国"
 hbe_BAX_scenario_desc: "昌州的地方经营介于丘陵与江路之间，市集的货物并不能凭一张水运图便自动抵达码头。沿路转运和府界上的查验，是本府每天都要处理的事务。\n\n重庆掌握圈中的[Concept('hbe_term_elector', '选侯')|e]席位，昌州则可在通行公约中为自己的商户争取便利。若选择崖岸守备，本府又须将驻守与供给同时办好。以小国的实务参与大圈的规则，是昌州扩张影响的可行之路。"
 hbe_BAZ_scenario: "重庆山城公国"
 hbe_BAZ_scenario_desc: "重庆的山城与[Concept('hbe_history_river', '川江')|e]相互依存，崖岸提供险固，江路带来物资，两者都需要持续维护。船户、岸仓与守备各有自己的账，也都希望主持者先听见本方的需要。\n\n本府是川东圈最初的[Concept('hbe_term_elector', '选侯')|e]，可以推动通商总约，也可以整合山城江防。地形的便利并不能代替可靠的供给；能够让船帮与守军共同认账的重庆，才有资格向其他诸侯要求更大的主持之权。"
 hbe_BBB_scenario: "涪州侯国"
 hbe_BBB_scenario_desc: "涪州的沿江往来依靠码头与岸上的转运，货物在此停留时需要储放，人手在此交接时需要凭据。一次看似微小的延误，便可能沿水程传至远处的采办方。\n\n本府可以以船帮协作积累@hbe_river! [Concept('hbe_term_river', '江运互保')|e]，加入各关认可的通行公约；也可以为崖岸守备准备供给。疆域虽小，若每届都能承担一份可靠的交付，涪州在[Concept('hbe_term_alliance', '会盟')|e]中的声音便不会只取决于版图。"
 hbe_BBC_scenario: "合州侯国"
 hbe_BBC_scenario_desc: "合州以山城守备的旧事为地方记忆，[Concept('hbe_history_diaoyu', '钓鱼城')|e]的遗址又使人明白险固与粮秣必须相互支撑。高处的城壁令人仰望，守住它的人却仍要依靠田亩、仓粮与援路。\n\n在新的府州[Concept('hbe_term_alliance', '会盟')|e]中，合州可将旧日守备经验转为水陆协防，也可投身@hbe_river! [Concept('hbe_term_river', '江运互保')|e]，让运输保护与共同经营相互成全。如何维持供给而不耗尽地方财力，是本府必须反复回答的题目。"
 hbe_BBE_scenario: "夔州侯国"
 hbe_BBE_scenario_desc: "夔州辖境较广，山峡间的水程与分散的地方事务需要不同的掌事者。府库看到的是一项总额，船户看到的却是沿途每一次停泊、候援与交接。\n\n重庆的主持权不能自动说明夔州的所有负担。本府可以凭通行公约协调分散岸口，也可以沿江防之路整合守备。用能够查验的共同事业维护广阔辖境，是夔州取得圈内影响的根本。"
 hbe_BBF_scenario: "酉阳侯国"
 hbe_BBF_scenario_desc: "酉阳的山地使行旅不能只依赖一条水程，市集与渡运还要由沿途乡里接续。地方见证在此尤其重要，因为远处的账房难以看见每一次实际交割。\n\n本府属于川东圈，却有自己的山地负担。借@hbe_river! [Concept('hbe_term_river', '江运互保')|e]安排可靠的转运，或以水陆协防保护通路，都需要先取得地方的认可。酉阳若能使谷中的旧例与圈内公约彼此说明，便能在[Concept('hbe_term_alliance', '会盟')|e]中争得独特的位置。"
 hbe_BBH_scenario: "忠州侯国"
 hbe_BBH_scenario_desc: "忠州的岸口与腹地田亩相互依赖，江上的通商便利必须由乡里的道路和仓储接住。船到岸后的责任若无人认领，一次顺利的运输仍可能以争执收场。\n\n本府可以从码头转运与船帮协作起步，用稳定交付积累@hbe_river! [Concept('hbe_term_river', '江运互保')|e]。较大的诸侯或许能够左右议题，忠州却可用公账与通行[Concept('hbe_term_contract', '契约')|e]争取自己的利益，让沿江经营成为不易被取代的[Concept('hbe_term_alliance', '会盟')|e]职责。"
 hbe_BBI_scenario: "保宁[Concept('hbe_history_shudao', '蜀道')|e]侯国"
 hbe_BBI_scenario_desc: "保宁的城郭连着川北往来的驿路，地方仓储与接递的文书都要按时到达。守备希望优先取得粮料，行旅则希望关市早日放行，两种需要常在同一条路上相遇。\n\n本府是[Concept('hbe_history_shudao', '蜀道')|e]圈最初的[Concept('hbe_term_elector', '选侯')|e]，可以以轮戍互援统筹关防，也可以以驿传总局协调通路。主持之权必须由当值与接递的记录支撑；若只令邻府承差而不说明分担，保宁的名望终会遭到质问。"
 hbe_BBJ_scenario: "巴州侯国"
 hbe_BBJ_scenario_desc: "巴州的山路联系着分散乡里，也使府库难以用一份统一程册说明沿途的劳苦。桥栈、候宿与地方供给，都需要近处的人逐段承担。\n\n本府可选择[Concept('hbe_history_shudao', '蜀道')|e]的守备支线，将轮戍的责任讲清；也可推动驿券与分驿，减少通路上的重复征索。保宁拥有圈中的席位，巴州若能以可靠的接力与援助建立信用，便能让自己的路程成为议事中的依据。"
 hbe_BBL_scenario: "广元侯国"
 hbe_BBL_scenario_desc: "广元连接[Concept('hbe_history_shudao', '蜀道')|e]沿线的转运与行旅，[Concept('hbe_history_shudao', '金牛道')|e]的旧路线说明它与山外交通之间的关系。进入巴蜀的路并非只是一处关门，而是连续的驿站、桥栈与供给。\n\n[Concept('hbe_term_alliance', '会盟')|e]敕书维护外部隔离，广元仍需经营境内的通行与守备。本府可以从驿堡联络起业，在轮戍或关市之间选择长处；维护关键路段的实际贡献，将使这座小国在川北公议中拥有分量。"
 hbe_BBM_scenario: "剑州侯国"
 hbe_BBM_scenario_desc: "剑州的地方名望与[Concept('hbe_history_shudao', '蜀道')|e]、剑门的历史记忆相联系，山势的险峻令人重视守备，也容易使人忽略维持守备所需的日常劳力。木石、粮料与接递之人，同样属于关防。\n\n本府可以沿山关防务建立轮戍互援，也可以转向驿券与公文分驿。险固不必只服务征战：让各府能够通行、让当值之人得到补给，同样是剑州争取圈内主持权的办法。"
 hbe_BBN_scenario: "龙安侯国"
 hbe_BBN_scenario_desc: "龙安的山地与沿路乡里，需要把报险、修栈和送粮合在一起筹划。府令到达之后，真正承担事务的人仍要依据季节与道路决定如何履行。\n\n龙安无需在开局便与大府争夺长久统摄之权。以栈道勘绘和驿堡联络建立自己的程册，再选择守备或驿传，可以使本府的地方经验成为[Concept('hbe_history_shudao', '蜀道')|e]圈共同规则的一部分。"
 hbe_BBO_scenario: "达州侯国"
 hbe_BBO_scenario_desc: "达州的地方往来分散在不同路程之间，市集、乡田与沿路堡驿各有需要。府库若只追求一次征调的总额，便难以说明哪个乡里承担了额外的接递。\n\n本府可以以轮戍之约协调人手，也可以用关市驿券降低通路摩擦。达州的影响未必来自最险的关口，而可以来自能够让邻府放心接续的交付与文书，使道路成为长期协作的纽带。"
 hbe_BBP_scenario: "顺庆侯国"
 hbe_BBP_scenario_desc: "顺庆的城郭与沿途经营需要稳定接递，田亩的出产也要经由道路送往更远的采办方。守备、行旅与府库之间的责任，不能只在危急时才临时商议。\n\n本府可以从驿堡联络建立@hbe_roads! [Concept('hbe_term_roads', '轮戍履约')|e]，再选择关防或驿传的长处。圈中的[Concept('hbe_term_elector', '选侯')|e]位于保宁，顺庆若愿保存清楚的交割与当值记录，便可使自己的规模与经营转化为公议中可核验的贡献。"
 hbe_BBQ_scenario: "简州侯国"
 hbe_BBQ_scenario_desc: "简州的丘陵田亩与市集相互支撑，塘堰所蓄的水和乡社所存的粮都与年景紧密相连。地方经营需要的不只是丰年多收，还包括歉岁仍能按约相助的安排。\n\n本府可走分仓赈贷的道路，经营可调剂的@hbe_grain! [Concept('hbe_term_grain', '义仓储备')|e]；也可沿[Concept('hbe_term_contract', '契约')|e]见证与票据清算建立公信。面对较大的诸侯，简州的长处在于把日常小事做成可查的共同责任。"
 hbe_BBR_scenario: "遂宁义仓侯国"
 hbe_BBR_scenario_desc: "遂宁的[Concept('hbe_term_local_service', '地方事业')|e]以乡田、市集与仓粮为根，丰歉之间的调剂决定了许多家庭能否继续经营。仓门的开闭看似属于府库，却会同时影响乡社信用与邻府的借贷。\n\n作为丘陵圈最初的[Concept('hbe_term_elector', '选侯')|e]，本府可主持义仓联社，也可发展诸侯公信会馆。替人保管粮食与替人裁定[Concept('hbe_term_contract', '契约')|e]，都要求主持者接受查验；遂宁必须使自身的公议权与实际承担的责任相称。"
 hbe_BBS_scenario: "潼川侯国"
 hbe_BBS_scenario_desc: "潼川的乡里需要在分散田亩之间调剂粮水，城中的券据又常与这些地方交付相联系。纸上的一笔清算，可能关系到哪一乡来年还能补足种粮。\n\n本府可以以分仓赈贷保障地方生计，也可以以[Concept('hbe_term_contract', '契约')|e]见证明确偿付。义仓与公信是不同的经营道路，前者要保有真实储备，后者要保存真实交割；潼川必须选择自己最能长期承担的职责。"
 hbe_BBT_scenario: "广安侯国"
 hbe_BBT_scenario_desc: "广安的辖境连接不同乡里的市集与田亩，一项地方安排往往有多处受益，也有多处承担维护。府库若不能说明这些差别，账面上的整齐便可能掩去实际不平。\n\n本府可以凭规模建立分仓互济，也可以用票据清算协调跨地交易。遂宁主持圈中的初始公议，广安则能够以连续交付争取更大的影响，让乡社的凭据进入诸侯之间的议约。"
 hbe_BBU_scenario: "雅州茶马侯国"
 hbe_BBU_scenario_desc: "雅州的茶与往来商队连着山地互市，宋代茶马经营留下的旧事使本地重视秤量、交割与通路。离开市集之后，山程上的候宿与报险又要依靠沿途各方。\n\n本府是茶马圈最初的[Concept('hbe_term_elector', '选侯')|e]，可以发展@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]与通商公所，也可以以山门施济与跨地调停取得支持。商业主持和公议主持各有责任；雅州必须让自己的券据在山外与山内同样得到认可。"
 hbe_BBV_scenario: "茂州侯国"
 hbe_BBV_scenario_desc: "茂州的山地使不同乡里各有通路与旧俗，远来的府令需要经过见证与说明，才能成为实际可行的安排。向导、歇脚之所与地方调停，是往来经营的一部分。\n\n雅州的茶马市集给本府提供合作机会，却不能替茂州解决每一处山程的负担。本府可沿@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]争取订单，也可沿山门与调停支线保存地方认可，让自己的旧例与共同通路相互成全。"
 hbe_BBW_scenario: "松潘侯国"
 hbe_BBW_scenario_desc: "松潘的辖境分散在广阔山地，府库与各乡之间的距离使报险、候援和采办都需要可靠接续。一个看似充足的总数，未必代表每一段道路都有人维护。\n\n本府可以沿通路会约协调@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]，也可以以跨地调停加强地方见证。规模带来经营机会，也带来更多无法轻忽的负担；松潘若能把分散的承诺整理成可查的约定，便能取得茶马圈中独特的影响。"
 hbe_BBX_scenario: "盐源侯国"
 hbe_BBX_scenario_desc: "盐源的谷市连接附近乡里，地方经营需要将道路、供给与交割一并商议。一处市集的便利若由另一处谷口无偿承担，旧例便很容易转为新的争执。\n\n本府属于山谷圈，可以沿小路换市与商盟互保发展经营，也可以以联寨守望保存@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]。盐源的前途不必只由国力大小决定；让实际使用道路的人认同维护之约，便能逐步积累可靠的[Concept('hbe_term_alliance', '会盟')|e]信用。"
 hbe_BBY_scenario: "德昌侯国"
 hbe_BBY_scenario_desc: "德昌的谷地与往来通路相互依靠，市集的货物需要经过乡里接续，府库的征调也需要得到掌事者认可。守备与经营在此并不是两项互不相关的事务。\n\n本府可以发展山谷互市，用商盟之约扩大合作；也可以沿议约驻防明确援守的粮料与期限。建昌主持圈中的最初公议，德昌若能把自身负担写入凭据，便可争取与贡献相称的声音。"
 hbe_BBZ_scenario: "黎州侯国"
 hbe_BBZ_scenario_desc: "黎州的山程连接互市与地方生活，宋代雅州、黎州茶马往来的旧事，为今日的行旅留下了可资援引的背景。旧券记得谁能通行，却未必说明谁应修桥与候援。\n\n本府在山谷圈中可以以换市与互保建立经营，也可以以地方议约保护旧权。让实际维护道路的人共同见证通行之约，是黎州把历史通路转化为长久[Concept('hbe_term_alliance', '会盟')|e]职责的起点。"
 hbe_BCA_scenario: "马湖侯国"
 hbe_BCA_scenario_desc: "马湖的地方往来需要考虑渡运与沿岸乡里的实际承载。府库可以在券面列出额度，船户与转运之人却必须根据现有器具和人手完成它。\n\n本府可借商盟互保协调交割，也可沿共治守备支线明确沿途责任。无论选择哪条道路，马湖都应让真实运力进入公议，避免以无法兑现的承诺换取一时声望，使小国的可靠成为自身的长处。"
 hbe_BCB_scenario: "建昌共治侯国"
 hbe_BCB_scenario_desc: "建昌辖内各谷的生活与旧例并不完全相同，主印所代表的总数也不能说明每处乡寨的实际负担。互市与驻守都需要取得本地承担者的见证。\n\n本府是山谷圈最初的[Concept('hbe_term_elector', '选侯')|e]，既可主持商盟，也可沿议约驻防建立共保盟府。集中的主持权与分散的地方认可必须相互支撑；能够令各谷真正愿意履约的建昌，才可能获得超出名号的权威。"
 hbe_BCC_scenario: "永宁侯国"
 hbe_BCC_scenario_desc: "永宁的乡寨与互市场所，需要在行旅便利和地方巡察之间取得平衡。把市集移得更近通路，可以减少脚程，却也可能改变周边居民承担的维护。\n\n本府可以沿山谷商盟发展有限的共同采办，也可以以联寨守望维持共治。比起只在纸上扩大经营，永宁更需要让交割、驻守与旧权彼此说明；这样的地方约定，才有机会被更大的诸侯接受。"
 hbe_banquet: "巴蜀大开席"
 hbe_banquet_desc: "各府围绕两种主张聚在一席：共建派重视一起修路建仓，兴业派重视商贸与地方经营。每两年办一届，出资或完成[Concept('hbe_term_local_service', '地方事业')|e]都能贡献。参与立即获益，合作成功再领回报。"

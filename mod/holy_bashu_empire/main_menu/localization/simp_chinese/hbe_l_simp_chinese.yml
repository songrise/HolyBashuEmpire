 game_concept_hbe_term_guoqi: "锅气"
 game_concept_hbe_term_guoqi_desc: "#T 共同信用与公款余力#!\n帝国共有，范围0–100；各府看到的是同一份数值。成功的分账项目、[Concept('hbe_term_research', '地方课题')|e]和[Concept('hbe_term_mission', '阶段验收')|e]可增加锅气；失败工程会损失锅气。\n\n皇帝茶议、争端调停和[Concept('hbe_term_charter', '百年章程')|e]会消耗它。提出章程需至少20点。它不是粮食库存，也不自动兑换金币。"
 game_concept_hbe_term_yiqi: "义气"
 game_concept_hbe_term_yiqi_desc: "#T 本国的履约信誉#!\n每国独立，范围0–100，开局40。完成[Concept('hbe_term_research', '课题')|e]、[Concept('hbe_term_local_service', '地方事业')|e]与实际交付可以增加；违约和部分自行其是的处理会降低。\n\n它可用于事件中的信用担保；整合旧府州、具备统一度量且缺少本地储备时，[Concept('hbe_term_delivery', '专业交付')|e]可改用10点义气担保。它不会直接代替原版关系或[Concept('hbe_term_elector', '选侯')|e]投票。"
 game_concept_hbe_term_dispute: "争席度"
 game_concept_hbe_term_dispute_desc: "#T [Concept('hbe_term_alliance', '会盟')|e]内的共同争端#!\n局势共有，范围0–100，开局15。未结清项目、违约与部分争端选择会提高；成功结算、[Concept('hbe_term_audit', '公开公账')|e]和调停可以降低。\n\n本届第三十六个月结算时必须低于75，即使三项交付齐全也一样。达到75会触发争端事件，该事件有五年间隔。"
 game_concept_hbe_term_water: "水权储备"
 game_concept_hbe_term_water_desc: "成都平原圈的地方履约积累，开局20，上限100。续办[Concept('hbe_term_service', '公共事业')|e]三年交付后增加10，地区事件也可改变它。\n\n[Concept('hbe_term_mission', '阶段验收')|e]消耗10；水粮担保消耗10与2金，半年完成，增加@hbe_guoqi! [Concept('hbe_term_guoqi', '共同信用')|e]并帮助降低@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]，但不代替两类主工程的三项交付。"
 game_concept_hbe_term_salt: "盐引信用"
 game_concept_hbe_term_salt_desc: "川南盐酒圈的地方履约积累，开局20，上限100。[Concept('hbe_term_service', '公共事业')|e]及事件可增加，地区[Concept('hbe_term_mission', '阶段验收')|e]和[Concept('hbe_term_delivery', '专业交付')|e]可消耗。\n\n[Concept('hbe_term_saltproject', '盐船共账')|e]中的盐引承销需要第一项[Concept('hbe_term_research', '地方课题')|e]、10点储备与2金；半年验收。盐引信用与[Concept('hbe_term_debt', '盐债')|e]分别记账，不能直接当作金币偿债。"
 game_concept_hbe_term_river: "江运互保"
 game_concept_hbe_term_river_desc: "重庆川东圈的地方履约积累，开局20，上限100，代表经核验的转运与河防合作。[Concept('hbe_term_service', '公共事业')|e]交付增加10，[Concept('hbe_term_mission', '阶段验收')|e]消耗10。\n\n本届[Concept('hbe_term_saltproject', '盐船共账')|e]可签江船转运，消耗10与2金，半年交付，为主工程补齐第二项环节。"
 game_concept_hbe_term_roads: "轮戍履约"
 game_concept_hbe_term_roads_desc: "川北[Concept('hbe_history_shudao', '蜀道')|e]圈的地方履约积累，开局20，上限100。完成关隘与驿路[Concept('hbe_term_service', '公共事业')|e]后增加，事件及验收也会改变它。\n\n[Concept('hbe_term_teaproject', '茶马过蜀道')|e]的驿路轮戍需要地方第一项[Concept('hbe_term_research', '课题')|e]、10点储备与2金；半年交付，补齐第二项环节。"
 game_concept_hbe_term_grain: "义仓储备"
 game_concept_hbe_term_grain_desc: "川中丘陵圈的地方履约积累，开局20，上限100；它是专项经营数值，与原版粮食库存分开。地方[Concept('hbe_term_service', '公共事业')|e]交付增加10。\n\n[Concept('hbe_term_saltproject', '盐船共账')|e]的公账审计消耗10与2金，半年交付，补齐第三项环节；地区[Concept('hbe_term_mission', '阶段验收')|e]同样消耗10。"
 game_concept_hbe_term_tea: "商队互保"
 game_concept_hbe_term_tea_desc: "川西茶马圈的地方履约积累，开局20，上限100。续办茶马采办与山门调停可在三年交付后增加10。\n\n[Concept('hbe_term_teaproject', '茶马过蜀道')|e]的采办合同需第一项[Concept('hbe_term_research', '地方课题')|e]、10点储备和2金，半年交付，为主工程补齐第一项环节。"
 game_concept_hbe_term_valleys: "地方共治"
 game_concept_hbe_term_valleys_desc: "川西南山谷圈的地方履约积累，开局20，上限100。互市与议约[Concept('hbe_term_service', '公共事业')|e]交付增加10；[Concept('hbe_term_mission', '阶段验收')|e]、事件及[Concept('hbe_term_delivery', '专业交付')|e]会消耗。\n\n[Concept('hbe_term_teaproject', '茶马过蜀道')|e]的山谷互市合同需第一项[Concept('hbe_term_research', '地方课题')|e]、10点储备与2金，半年交付，补齐第三项环节。"
 game_concept_hbe_term_tianfu: "天府之国"
 game_concept_hbe_term_tianfu_desc: "域内每个地块永久获得粮食产出+7%、本地建造速度+7%。同一地块不重复叠加；它随帝国成员对域内地块的治理维持，域外非成员接掌后移除。\n\n与[Concept('hbe_term_charter', '百年章程')|e]和限时工程收益分别计算，无须每届重新申请。\n本地疾病抗性 +5%。"
 game_concept_hbe_term_isolation: "自治盟约"
 game_concept_hbe_term_isolation_desc: "本模组的架空自治背景与外交规则：[Concept('hbe_term_alliance', '会盟')|e]依共同盐粮交割保持区域自治。帝国境内与域外之间的宣战和战争召集受边界门槛限制；内部诸侯战争和本地叛乱仍可发生。\n\n拒绝某届工程、发生争席危机或未通过[Concept('hbe_term_charter', '百年章程')|e]，都不会使盟约因计时而失效。"
 game_concept_hbe_term_circle: "帝国圈"
 game_concept_hbe_term_circle_desc: "七个圈级协作组织，各自关联[Concept('hbe_term_research', '地方课题')|e]、[Concept('hbe_term_service', '公共事业')|e]、[Concept('hbe_term_mission', '阶段验收')|e]与专属履约积累。开局每圈推一席[Concept('hbe_term_elector', '选侯')|e]。\n\n章程议决时每圈只提供一份授权，须先取得该圈[Concept('hbe_term_seat', '原首府席位')|e]的严格过半支持；总计至少四圈授权才能通过。"
 game_concept_hbe_term_elector: "选侯"
 game_concept_hbe_term_elector_desc: "皇帝选举的七个投票席位，开局每圈一席，走原生组织选举界面。选举须取得严格多数；经营实力与诸侯关系会影响AI选择。\n\n它与[Concept('hbe_term_charter', '百年章程')|e]的[Concept('hbe_term_seat', '固定代表席位')|e]是两套规则：不是只有选侯才能参与章程授权。"
 game_concept_hbe_term_research: "地方课题"
 game_concept_hbe_term_research_desc: "通过研究决议资助，付费后等待该项研究的年数，完成时由月度维护结算。每国同时只能研究一项，须满足年代与前置条件。\n\n共64项：共同知识8项，各圈8项。研究结果保存在国家上，不随统治者更替丢失；它们仍以决议作为入口。"
 game_concept_hbe_term_specialization: "互斥专精"
 game_concept_hbe_term_specialization_desc: "每圈的第三项与第六项[Concept('hbe_term_research', '课题')|e]开启两条互斥路线；研究其中一项后，另一项不能再开始。后续节点沿各自前置推进。\n\n第三、四、五阶段的[Concept('hbe_term_mission', '地区验收')|e]接受任一路线的对应成熟节点，无须两条路线同时完成。"
 game_concept_hbe_term_service: "公共事业"
 game_concept_hbe_term_service_desc: "地方循环事业：第一项本圈[Concept('hbe_term_research', '课题')|e]完成后，支付4金开始，三年交付，得到10点地方履约积累、3点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]及五年本地收益。\n\n续办间隔从开始时计算五年。它和局势的[Concept('hbe_term_delivery', '专业交付')|e]是独立项目，前者可用于为后者积累储备。"
 game_concept_hbe_term_mission: "阶段验收"
 game_concept_hbe_term_mission_desc: "每圈五阶段，最早分别在1337、1352、1372、1397、1437年开放。须完成前一阶段、对应[Concept('hbe_term_research', '课题')|e]并持有至少10点[Concept('hbe_term_regional', '本圈储备')|e]。\n\n消耗10点储备与2/4/6/8/10金，增加5点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]、2点@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]及2点声望。各阶段只能验收一次。"
 game_concept_hbe_term_round: "分账会"
 game_concept_hbe_term_round_desc: "局势的36个月循环。前6个月接受本国出资或合同，第12个月核付承诺，第36个月检查三个专业环节并结算。\n\n成功须三个环节各至少一次有效交付且@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]低于75。下一届会清除本届参加状态，保留长期[Concept('hbe_term_contribution', '个人履约')|e]与成功项目总数。"
 game_concept_hbe_term_commitment: "承诺期"
 game_concept_hbe_term_commitment_desc: "每届第0至第5个月可以出资、认账或签专业合同。每国每届只参加一种；暂缓后可在期内撤回意见再参加。\n\n皇帝仅在前三个月、尚无专业承接时改选主工程。过了承诺期，[Concept('hbe_term_subsidy', '皇帝补缺')|e]仍有自己的时间门槛。"
 game_concept_hbe_term_funding: "现金出资"
 game_concept_hbe_term_funding_desc: "本届[Concept('hbe_term_commitment', '承诺期')|e]内支付3金，立即获得1份[Concept('hbe_term_contribution', '个人履约')|e]、2点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]与1点@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]。它提供公款，不补齐主工程的专业环节。\n\n同届不能再认账或承接专业合同；共同收益仍需本届项目最终成功。"
 game_concept_hbe_term_pledge: "付款承诺"
 game_concept_hbe_term_pledge_desc: "在[Concept('hbe_term_commitment', '承诺期')|e]签下4金承诺，第12个月检查国库并实际付款。付清后获得1份[Concept('hbe_term_contribution', '个人履约')|e]、3点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]与1点@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]。\n\n届时不足4金不会强扣国库，改为违约：@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]-8、@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]+5，本次不能算作有效交付。"
 game_concept_hbe_term_delivery: "专业交付"
 game_concept_hbe_term_delivery_desc: "[Concept('hbe_term_commitment', '承诺期')|e]内按本圈合同支付2金与10点储备，半年验收。需地方第一项[Concept('hbe_term_research', '课题')|e]；整合旧地可用统一度量和辖境接办，缺储备时改以10@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]担保。\n\n同届只能承担一种交付或出资。验收增加2份[Concept('hbe_term_contribution', '个人履约')|e]、3@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]与1声望；对应环节记入当前主工程，水粮担保则另增@hbe_guoqi! [Concept('hbe_term_guoqi', '共同信用')|e]。"
 game_concept_hbe_term_contribution: "个人履约"
 game_concept_hbe_term_contribution_desc: "国家长期累计的履约次数，开局0，不随每届清账或领主更替归零。真实出资计1，半年[Concept('hbe_term_delivery', '专业交付')|e]计2，[Concept('hbe_term_trial', '府州试办')|e]也可增加。\n\n它用于记录本国贡献，不等同于局势的[Concept('hbe_term_success', '成功工程')|e]总数；仅有个人记录不能替代章程所需的30次共同成功。"
 game_concept_hbe_term_saltproject: "盐船共账"
 game_concept_hbe_term_saltproject_desc: "三项专业环节：川南盐引承销、川东江船转运、川中公账审计。各环节至少一次有效交付且@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]低于75，届末才成功。\n\n成都水粮担保、[Concept('hbe_term_funding', '现金出资')|e]和[Concept('hbe_term_pledge', '付款承诺')|e]均不代替这三项。[Concept('hbe_term_subsidy', '皇帝补缺')|e]可在限定时间内补一个缺失环节。"
 game_concept_hbe_term_teaproject: "茶马过蜀道"
 game_concept_hbe_term_teaproject_desc: "三项专业环节：川西茶马采办、川北驿路轮戍、川西南山谷互市。每项至少一次交付且@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]低于75，届末才成功。\n\n[Concept('hbe_term_alliance', '会盟')|e]每届默认与[Concept('hbe_term_saltproject', '盐船共账')|e]轮换；皇帝可在早期满足条件时改选。[Concept('hbe_term_funding', '现金出资')|e]不能代替[Concept('hbe_term_delivery', '专业交付')|e]。"
 game_concept_hbe_term_subsidy: "皇帝补缺"
 game_concept_hbe_term_subsidy_desc: "本届第12至第29个月，皇帝可付10金补一个缺失的专业环节；依第一、第二、第三项的顺序补缺。每届限一次。\n\n它不能单次替代三个环节，也不降低@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]。是否能够成功仍由第36个月统一检查。"
 game_concept_hbe_term_audit: "公开公账"
 game_concept_hbe_term_audit_desc: "支付3金，@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]-4、@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]+2，每两年可执行一次。它用于缓和共有争端，不直接增加[Concept('hbe_term_success', '成功工程')|e]，也不填补[Concept('hbe_term_delivery', '专业交付')|e]。"
 game_concept_hbe_term_chapter: "章程阶段"
 game_concept_hbe_term_chapter_desc: "局势按时间与已成功项目共同推进：1352年且3次、1372年且8次、1397年且14次、1422年且22次，分别进入第二至第五阶段。\n\n仅等待年份不会自动推进。第五阶段也仍须等到1437年、成功30次，并满足其他提案条件，才能议[Concept('hbe_term_charter', '百年章程')|e]。"
 game_concept_hbe_term_charter: "百年章程"
 game_concept_hbe_term_charter_desc: "最早1437年，局势[Concept('hbe_term_chapter', '第五阶段')|e]且共同成功项目至少30次。皇帝立场须与提案一致，付5金、消耗20@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]，启动六个月议决。\n\n每圈[Concept('hbe_term_seat', '原首府席位')|e]严格过半赞成，[Concept('hbe_term_circle', '七圈')|e]至少四圈授权才能通过。失败后五年可重提；通过后仍继续循环工程。"
 game_concept_hbe_term_seat: "固定代表席位"
 game_concept_hbe_term_seat_desc: "章程议决固定使用开局36个原府州首府。首府的当前帝国成员领主代表该席；一国整合多个首府时，其表态用于这些席位。\n\n分封不会新增席位；非成员持有的首府不计赞成，但圈内通过仍须越过原有席位总数的一半。"
 game_concept_hbe_term_common: "共锅派"
 game_concept_hbe_term_common_desc: "倾向由皇帝主持共同财政与[Concept('hbe_term_service', '公共事业')|e]。各派都能经营、交付和竞选；五年内只能改换一次立场，地图显示为红。\n\n共锅派皇帝可提出[Concept('hbe_term_charter_common', '一锅巴蜀')|e]章程，但仍需各圈正式授权，选择立场本身不会直接颁行章程。"
 game_concept_hbe_term_divided: "分锅派"
 game_concept_hbe_term_divided_desc: "重视府州自治与圈级协作。地图显示为蓝，立场改换有五年间隔。\n\n对应[Concept('hbe_term_charter_divided', '万国茶会')|e]章程。它与所有成员一样须参与实际出资或交付才能取得[Concept('hbe_term_success', '成功工程')|e]的参与者收益，并不自动免去合同责任。"
 game_concept_hbe_term_ledger: "账房派"
 game_concept_hbe_term_ledger_desc: "倾向以明确合同、核验与[Concept('hbe_term_contribution', '履约记录')|e]协调诸府。地图显示为黄，立场改换有五年间隔。\n\n对应[Concept('hbe_term_charter_contract', '契约共治')|e]章程。仅选此派不会自动得到返还，仍须章程通过与本届真实交付后成功结算。"
 game_concept_hbe_term_debt: "盐债"
 game_concept_hbe_term_debt_desc: "川南盐引贷款的独立债务数值。成熟盐引[Concept('hbe_term_research', '课题')|e]完成后，发行一次取得15金、增加10盐债，五年间隔，债务上限30。\n\n有欠债时每年扣1金利息。支付10金可归还10盐债并恢复信用。@hbe_salt! [Concept('hbe_term_salt', '盐引信用')|e]不是债务余额；贷款不改变[Concept('hbe_term_isolation', '自治盟约')|e]。"
 game_concept_hbe_term_charter_common: "一锅巴蜀"
 game_concept_hbe_term_charter_common_desc: "[Concept('hbe_term_common', '共锅')|e]章程通过后，域内成员地块本地建造速度额外+5%。皇帝每年承担1金维护；不足支付时增加5@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]。\n\n它叠加在[Concept('hbe_term_tianfu', '天府之国')|e]之上，亦不终止三年分账循环。"
 game_concept_hbe_term_charter_divided: "万国茶会"
 game_concept_hbe_term_charter_divided_desc: "[Concept('hbe_term_divided', '分锅')|e]章程通过后，域内成员地块粮食产出额外+5%；地区[Concept('hbe_term_service', '公共事业')|e]交付追加2声望。\n\n它不会免费提供[Concept('hbe_term_regional', '本圈储备')|e]，也不取消地方验收所需[Concept('hbe_term_research', '课题')|e]与钱粮。"
 game_concept_hbe_term_charter_contract: "契约共治"
 game_concept_hbe_term_charter_contract_desc: "[Concept('hbe_term_contract', '契约')|e]章程通过后，域内成员地块粮食产出与本地建造速度各额外+2.5%。本届真实出资或交付且[Concept('hbe_term_success', '共同项目')|e]成功者，另返还1金。\n\n返还来自成功结算，认账未付款或未参加本届者不获返还。"
 game_concept_hbe_term_regional: "地区履约积累"
 game_concept_hbe_term_regional_desc: "各圈自己的专项数值，开局20、通常上限100。[Concept('hbe_term_circle', '七圈')|e]分别使用@hbe_water! [Concept('hbe_term_water', '水权储备')|e]、@hbe_salt! [Concept('hbe_term_salt', '盐引信用')|e]、@hbe_river! [Concept('hbe_term_river', '江运互保')|e]、@hbe_roads! [Concept('hbe_term_roads', '轮戍履约')|e]、@hbe_grain! [Concept('hbe_term_grain', '义仓储备')|e]、@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]和@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]。\n\n地方[Concept('hbe_term_service', '公共事业')|e]三年交付增加10，[Concept('hbe_term_mission', '阶段验收')|e]和[Concept('hbe_term_delivery', '专业交付')|e]通常各消耗10。资源保存在国家上；进入本圈指南可看具体用途。"
 game_concept_hbe_term_contract: "共同契约"
 game_concept_hbe_term_contract_desc: "共同事务须同时有明确责任、实际交割和各方认可的凭据。地方[Concept('hbe_term_service', '公共事业')|e]、[Concept('hbe_term_trial', '府州试办')|e]和本届[Concept('hbe_term_delivery', '专业交付')|e]分别按各自规则验收。\n\n叙事中的契约用于表达地方权利与承诺；支付金额、等待时间和效果以所选行动的条件与结果提示为准。"
 game_concept_hbe_term_trial: "府州试办"
 game_concept_hbe_term_trial_desc: "每个原府州有一次专属试办事件，通常在1338–1343年间到来。支付2金可增加3@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]、1份[Concept('hbe_term_contribution', '个人履约')|e]和1@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]，并给域内所辖地块三年的工程收益。\n\n此记录长期保留，但不代替本届主工程的三个专业环节。守旧选择会降低@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]并增加@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]。"
 game_concept_hbe_term_success: "成功工程"
 game_concept_hbe_term_success_desc: "两类主工程在第三十六个月结算成功时，局势的共同成功总数增加1。三个专业环节各至少一次交付、@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]低于75，缺一不可。\n\n参与且真实履约者得到三年本地收益，@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]+5、@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]-5。[Concept('hbe_term_chapter', '章程阶段')|e]及[Concept('hbe_term_charter', '百年章程')|e]使用此总数，[Concept('hbe_term_trial', '府州试办')|e]和单次地方交付不单独计入。"
 game_concept_hbe_term_alliance: "巴蜀会盟"
 game_concept_hbe_term_alliance_desc: "神圣巴蜀帝国组织及[Concept('hbe_term_circle', '七圈')|e]协作的共同体。开局36个府州诸侯；全部帝国成员在1337年10月的大开席启动后自动参加。\n\n成员可以选择立场、参与循环工程、经营[Concept('hbe_term_service', '地区事业')|e]并授权章程。皇帝主持议事，[Concept('hbe_term_elector', '选侯')|e]推举帝位；[Concept('hbe_term_tianfu', '天府之国')|e]与[Concept('hbe_term_isolation', '自治盟约')|e]维持域内治理。"
 game_concept_hbe_term_burden: "役负"
 game_concept_hbe_term_burden_desc: "全国0—100的徭役和驻地压力，初始20。事业征办+6、议办+2、雇办不增加；新募议约军每队+1。和平且近年无急征时每年-3，付费减役可另降10。40起影响农民支持，70起暂停事业和新募，并触发有五年间隔的请愿。"
 game_concept_hbe_term_civic_office: "圈署委任"
 game_concept_hbe_term_civic_office_desc: "须委任科技、成长验收、有效机构与最近五年真实交付。一个圈同时一位主持，每国至多两任，任期五年；断供、失去[Concept('hbe_term_alliance', '会盟')|e]或@hbe_burden! [Concept('hbe_term_burden', '役负')|e]70以上提前退任。请任按空缺和明确资格办理，不增加皇帝选票或帝国旧席。"
 game_concept_hbe_term_operating: "机构供养"
 game_concept_hbe_term_operating_desc: "本府拥有机构，有效建筑等级至少0.25，且有同类机构实际雇用至少50人。原版有效等级随供养变化；不满足则暂停相应招募和委任。原版建筑本身的效果亦依就业与商品获取缩放。"
 game_concept_hbe_term_civic_army: "议约军额"
 game_concept_hbe_term_civic_army_desc: "九种军种共用一个原版unit family。以潜在陆军人数20%折算500人单位，并以有效地区机构总等级取较小值；能供养500人时至少容许一队，前提是机构容量达一队。@hbe_burden! [Concept('hbe_term_burden', '役负')|e]70时容量归零，新募停止；现有部队不删除，超过容量时全军维护效率-10%。"
 game_concept_hbe_term_civic_policy: "民役议约"
 game_concept_hbe_term_civic_policy_desc: "原版民役法律内择一政策，选择后五年锁定。征办承受@hbe_burden! [Concept('hbe_term_burden', '役负')|e]，议办保留地方见证，雇办付现钱。它与大开席的三种章程分别治理国内办理方式和跨府合作，不共用投票。"
 game_concept_hbe_history_dujiangyan: "都江堰"
 game_concept_hbe_history_dujiangyan_desc: "#T 历史背景#!\n都江堰始建于战国时期，利用地势与水流分水、排沙和灌溉；唐宋元明均有改扩修。鱼嘴、飞沙堰与宝瓶口是其核心构件。\n\n它与[Concept('hbe_history_qingcheng', '青城山')|e]共同构成平原水利和山门文化的历史背景。水权与岁修需要受益各地持续合作。"
 game_concept_hbe_history_qingcheng: "青城山"
 game_concept_hbe_history_qingcheng_desc: "#T 历史背景#!\n青城山与早期道教传统紧密相连，与成都平原水利景观共同形成重要历史文化环境。\n\n山门、地方文教与乡里见证，可由这些既有传统取得声望。"
 game_concept_hbe_history_shujin: "蜀锦"
 game_concept_hbe_history_shujin_desc: "#T 历史背景#!\n成都织锦长期为蜀地著名产业。《蜀锦谱》记载锦院与宋代茶马用锦，显示织造、官府采办和互市之间的联系。\n\n作坊分工、采购与交割，因而同时牵动匠户和地方府库。"
 game_concept_hbe_history_salt: "卓筒井"
 game_concept_hbe_history_salt_desc: "#T 历史背景#!\n北宋庆历年间，蜀地已有以绳式顿钻取得深处卤水的卓筒井技术。井盐的生产需要钻井、取卤与煎盐等环节配合。\n\n从井灶到承运，再到盐引交割，各环节须使实物与担保相互衔接。"
 game_concept_hbe_history_tea: "雅州茶马司"
 game_concept_hbe_history_tea_desc: "#T 历史背景#!\n宋代雅州、黎州是西南茶马贸易的重要地方，名山茶用于以茶易马，官府设置机构组织交易。\n\n采办、运送与互市各有承担者，统一凭据能使不同地方承认同一份交割。"
 game_concept_hbe_history_shudao: "蜀道"
 game_concept_hbe_history_shudao_desc: "#T 历史背景#!\n连接关中、汉中与蜀地的道路体系长期承担行旅、军需与驿传。元代金牛道经七盘关、朝天与广元等处进入蜀地。\n\n险路与关驿需要接力维护，人马、粮料和交接凭据缺一不可。"
 game_concept_hbe_history_jianmen: "剑门关"
 game_concept_hbe_history_jianmen_desc: "#T 历史背景#!\n剑门关位于[Concept('hbe_history_shudao', '蜀道')|e]要段，险峻地势使其长期具有守备与交通价值。\n\n地势之险可以助守，关役仍须依靠真实的人马、粮料与沿路维护。"
 game_concept_hbe_history_diaoyu: "钓鱼城"
 game_concept_hbe_history_diaoyu_desc: "#T 历史背景#!\n合州钓鱼城是南宋山城防御体系的重要节点，宋元攻防持续至十三世纪后期。其守备兼顾山城、水路与屯粮。\n\n这段旧事为合州的跨水口协作与公共粮政提供历史记忆。"
 game_concept_hbe_history_qiong: "邛窑"
 game_concept_hbe_history_qiong_desc: "#T 历史背景#!\n邛窑所制省油灯在晚唐出现、宋代流行，是蜀地器用与工匠经验的一例。\n\n匠师的成法既可由师徒传习，也可借实物、图样和验收记录传给更多作坊。"
 game_concept_hbe_history_sansu: "三苏"
 game_concept_hbe_history_sansu_desc: "#T 历史背景#!\n北宋苏洵、苏轼、苏辙与眉州文脉密切相连，其文章成为后世蜀地士人可以援引的传统。\n\n议疏能使治事主张传得更远，具体的钱粮与责任仍须另有清楚的记录。"
 game_concept_hbe_history_wenweng: "文翁石室"
 game_concept_hbe_history_wenweng_desc: "#T 历史背景#!\n西汉蜀郡守文翁兴学、培养郡县人才，成为成都官学传统的重要历史来源。\n\n[Concept('hbe_term_research', '地方课题')|e]与官学讲会借这一文脉，为匠师经验和治事簿册寻找共同的表达。"
 game_concept_hbe_history_river: "川江"
 game_concept_hbe_history_river_desc: "#T 历史背景#!\n川江水急滩多，航运依靠熟悉水程的船工及沿途协作。劳动号子用于协调动作，险滩与水位也影响实际交割。\n\n转运与护航的价值应由经过的水程、人手和到货记录相互核验。"

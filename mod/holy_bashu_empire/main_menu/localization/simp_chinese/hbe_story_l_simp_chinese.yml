 hbe_short_central_hills.12.desc: "一位外乡桑农写信教女儿在新乡种桑，信中提到几种不同于本地的剪枝办法。女儿给邻里试过，几株桑树长得好，行会却认为她未经旧师傅传习，不该向织户收取蚕叶钱。\n\n蚕户发现不同龄的春蚕吃叶也不同，新枝并非处处合用。老师傅愿参与记录，却请求不要让外乡人的姓名列在最前。府署可以并记发现，也可以按行会旧次序刊册。\n\n“寄来的种桑信”第2篇。"

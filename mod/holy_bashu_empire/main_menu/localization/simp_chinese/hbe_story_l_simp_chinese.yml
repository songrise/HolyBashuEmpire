 hbe_short_shared.82.title: "山上第一场雪"
 hbe_short_shared.82.desc: "围栏与牧路的争执已有处理，第一场雪却让两边的人又为牲畜和草料碰在一起。\n\n迁户的牲畜不惯雪路，山民愿提供草料和向导。旧牧主要求新户先承认牧界，府署可以供草料，也可要求双方以救助重订冬牧约。山民把干草背到坡下，迁户的牲畜还站在雪里。帮忙的人愿先开草捆，旧牧主却要对方先认界。"

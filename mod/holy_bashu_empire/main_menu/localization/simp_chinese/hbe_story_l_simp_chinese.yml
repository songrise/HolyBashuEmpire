 hbe_short_shared.210.title: "小院里供的旧乡神"
 hbe_short_shared.210.desc: "迁户在院中供起旧乡的神像，邻居担心他们不参加本村的共同祭礼。新户说仍会出修桥的钱，只是不愿把祖辈的祭法丢在船上。寺院愿让他们在一侧留席，条件是先承认本地祭日的次序。\n\n府署可以承认各家礼俗并限定公共责任，也可以坚持统一祭期，或促成并存的共席。新乡的规矩若只靠谁更熟悉某一种神号来决定，出钱与劳作便很难成为共同的凭据。"

 hbe_story_southern_salt_wine.104.title: "叙州酒宴的空座"
 hbe_story_southern_salt_wine.104.desc: "叙州商人设宴款待船主，邀请了许多熟识的贵族，却给为酒坊酿酒多年的老师傅留了一个门外座位。老师傅起身离去，其他灶户也不再供酒。\n\n宴主请府署出面恢复供应，声称礼数不可随意改变。船主只希望下一批盐酒能按约上船。我们可以让工匠入席，也可另给赏钱，或把交割从这场宴会中分开，按明白的契约处理。"

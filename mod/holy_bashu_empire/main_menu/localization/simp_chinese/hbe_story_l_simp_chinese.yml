 hbe_story_chengdu_plain.1.title: "竹林中的黑白足迹"
 hbe_story_chengdu_plain.1.desc: "彭州山民在雪后发现一串宽厚脚印，竹林里还留下了啃食过的竹秆。猎户带来一张[Concept('hbe_history_panda', '黑白相间的兽皮')|e]，声称能替府衙找到活兽。\n\n山中住户靠砍竹和采药维生，担心官府借珍兽之名封山。我们须先决定怎样进入他们的山林。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_2_1: "共同诊治"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_2_1: "由这次抉择形成的短期安排。具体影响见下列数值。"

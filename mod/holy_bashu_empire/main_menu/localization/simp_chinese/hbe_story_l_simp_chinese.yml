 hbe_story_southwestern_valleys.104.desc: "会川商队沿路留下红土与碎矿，村民发现雨后井水变了颜色。运矿人认为这是山中常见的土色，拒绝支付清井的钱。\n\n府医愿查验，铁坊又担心停止运输会误工。我们可以先给村民另寻饮水，责令运矿人改用围车，或按旧路继续运货并另收修井费。一个孩子带来的水罐已经放在堂上，没有人能只凭一句惯常如此就说明它是否适合饮用。"

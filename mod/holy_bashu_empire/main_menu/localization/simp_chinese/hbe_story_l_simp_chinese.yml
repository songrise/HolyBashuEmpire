 hbe_story_chengdu_plain.1.title: "竹林中的黑白足迹"
 hbe_story_chengdu_plain.1.desc: "彭州山民在雪后发现一串宽厚脚印，竹林里还留下了啃食过的竹秆。猎户带来一张[Concept('hbe_history_panda', '黑白相间的兽皮')|e]，声称能替府衙找到活兽。\n\n山中住户靠砍竹和采药维生，担心官府借珍兽之名封山。我们须先决定怎样进入他们的山林。\n\n本篇是“竹林中的白熊”的第1章。前面的选择将决定最后保留哪一种长期章程。"

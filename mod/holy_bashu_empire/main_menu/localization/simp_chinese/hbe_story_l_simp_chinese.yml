 hbe_story_southern_salt_wine.7.title: "代代相传的井谱"
 hbe_story_southern_salt_wine.7.desc: "巨骨该怎样解释，各方仍有自己的说法；井工手里的出土记号却一页页积攒下来。\n\n年轻井工已会在挖到巨骨时留下周围石片，师生也能按旧编号找到许多井口。几家盐场请求以这些记录换取府署对新井的支持。府学担心图谱落入少数井主手中；掌盐官则认为实用勘查与收藏可以共用人手。图谱的保管方式将决定谁能继续利用这批积累。"

 hbe_short_chengdu_plain.3.title: "重新启用的染缸"
 hbe_short_chengdu_plain.3.desc: "锦坊为远来的买主织了一匹新绣，晒过几日后，青色却渐渐发灰。买主不肯收货，掌染师傅说是新染料的问题，供料商却指出织坊用过旧缸。学徒留下了每次下料的记号，过去没人愿看这些杂乱的纸片。\n\n新缸已经烧好，买主愿再试一批货。师傅提出由旧行会统一验色，年轻染户则希望凭试布争取订单。府署须决定最初为坏锦支付的代价，最后应换来一家作坊的信用，还是更广的技艺传习。\n\n“失色的锦样”第3篇。"

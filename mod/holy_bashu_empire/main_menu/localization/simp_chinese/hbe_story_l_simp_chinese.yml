 hbe_story_central_hills.201.title: "坡田共护章程"
 hbe_story_central_hills.201.desc: "新修的埂没有在地图上变成一条笔直的线。村落仍按坡势和来水安排维修，仓中也为无力修埂的人留下一份种粮。田主不能只凭家世免去分担，乡民也不能借共同田地逃避照料。共护章程把丰年和旱年的责任一同留下。\n\n各村带走田图与工钱的副本，新住户的名字也添进维修份额。下次旱年到来，借粮和修埂仍须分别核看，不能因一家暂时无钱出工就删去救助。"

 hbe_short_northern_shudao.3.title: "更册上的新记号"
 hbe_short_northern_shudao.3.desc: "细沙与供货的办法已有安排，守更者照几种器具相互比较，开始留下更多停漏与补刻的记录。\n\n守更人用同一时刻比较几种漏壶，终于能把停漏记在更册边。关军不想让这些批注流出，担心过客据此猜到城门值夜。公开经验与维持守备，需要新的分界。更册边上多了一条停漏的短记，恰与城门换岗挨在一起。关将用手压住那一页，府学的人却还想抄走修漏的数目。"

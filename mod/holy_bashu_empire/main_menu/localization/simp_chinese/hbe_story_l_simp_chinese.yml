 hbe_story_chengdu_plain.111.title: "青神竹纸的销路"
 hbe_story_chengdu_plain.111.desc: "青神纸户用[Concept('hbe_history_bamboo_paper', '细竹制出的纸张')|e]卖不出去，驿署宁愿从熟识的商人手中采购。纸户的小女儿把一包样纸带进府城，请书记试写，字迹却让围观者颇为满意。\n\n旧供货商强调多年守约的功劳，纸户则请求一次公开比价。若府署转向新纸，旧商人会失去收入；若继续沿用旧合同，地方纸坊便难以承担扩大采办的费用。"

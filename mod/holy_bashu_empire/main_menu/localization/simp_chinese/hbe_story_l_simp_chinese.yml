 hbe_short_chengdu_plain.2.title: "学徒留下的颜色"
 hbe_short_chengdu_plain.2.desc: "锦坊为远来的买主织了一匹新绣，晒过几日后，青色却渐渐发灰。买主不肯收货，掌染师傅说是新染料的问题，供料商却指出织坊用过旧缸。学徒留下了每次下料的记号，过去没人愿看这些杂乱的纸片。\n\n新的试染布被挂在同一面墙上，旧缸中的颜色仍先褪去。学徒请求把记号抄成正式的染簿，师傅担心配方随之传到其他作坊。订单已经补交，怎样保存这份记录成为新的争执。\n\n“失色的锦样”第2篇。"

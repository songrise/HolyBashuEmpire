 hbe_short_northern_shudao.1.title: "失准的守更"
 hbe_short_northern_shudao.1.desc: "商人带来一只沙漏，说它比阴天的日影可靠。驿吏用它记守更，半夜却发现潮气让细沙结住。老驿卒仍按自己记住的路程报刻，年轻人要求把器具和经验一起查验，免得以后只凭失准的漏壶扣工钱。\n\n关军希望照原先报刻处罚迟到者，驿卒请求重新核算。我们可以先退扣钱，比较不同记时办法，也可以维护更册，再以一次赏钱结束争论。被扣钱的驿卒带来同夜送粮的凭记，报刻和到站时刻只差一小段。他要求先弄清那只漏，别让下一班人再替坏器具担责。"

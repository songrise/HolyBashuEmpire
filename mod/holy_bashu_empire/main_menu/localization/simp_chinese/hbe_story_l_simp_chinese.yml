 hbe_short_northern_shudao.22.title: "缺页的旧账本"
 hbe_short_northern_shudao.22.desc: "书箱的免关已有裁处，清点经卷与商货时，师生从旧账本里找到了本府商号的借据。\n\n一箱账本里有本府商号的旧借据，几名货主请求取回，不愿公开。府学师生想借它们学习记账，商人担心姓名被传开。府署可以留匿名副本，也可把账本退还原主。借据上的欠数仍能辨认，姓名却恰在师生最想抄的一页。认领的商人愿送几册新纸，只求先把那本旧账从案上拿回。"

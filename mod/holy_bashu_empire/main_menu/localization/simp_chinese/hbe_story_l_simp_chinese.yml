 hbe_short_central_hills.2.title: "旱田边的试种"
 hbe_short_central_hills.2.desc: "义仓收粮的办法已经裁定，新旧谷种仍有人在不同田块种下，下一季的实收也已送来。\n\n小粒谷在旱坡上结穗更好，水田里却不及旧种。乡老请求允许不同田块用不同种子，田主希望统一采办，省去反复查种的钱。府署可以保留差异，也可以只推广成熟田的标准。两块相邻田的谷穗放到一处，靠坡的一块与近水的一块恰好不同。记收的书记问，来年该照田势分种，还是照仓价分种。"

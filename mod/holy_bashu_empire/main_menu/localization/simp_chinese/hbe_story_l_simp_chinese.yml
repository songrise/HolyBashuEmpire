 hbe_migration.9.title: "新祠与旧桥之间"
 hbe_migration.9.desc: "转籍与续租的请求已有裁处，几位久住的长者仍想办一处[Concept('hbe_history_huiguan', '会馆')|e]，照料来客，也保存共同的货账与工钱。\n\n几位新户长者请求在旧桥旁建一座共同会馆。馆中既可收留后来者，也可登记货物与工钱。旧族担心会馆另成一套号令，行会则认为，若能把各地来客交给会馆担保，城中的账目会更容易查清。这些人当年带着行李来到渡口，如今已经能凑出一笔修桥钱。他们希望出资后能在桥约上署名，而不是只在碑末列作寄居的善人。我们可以承认会馆的共同见证，也可以把它限制为施济之所，不准参与乡议。"

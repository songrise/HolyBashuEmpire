 hbe_short_southwestern_valleys.21.title: "门外的解释"
 hbe_short_southwestern_valleys.21.desc: "诸谷议事时，一位会说两种话的年轻人被安排坐在门外，只能替长者转述。去年修桥的许多钱契出自他的手，几个村寨希望他能直接说明记录。主持者认为座次关乎旧有尊卑，不宜因会写字而更改。\n\n府署可以让青年入席说明，也可维持原座次，或给他固定的译写席。新的发言权会使议事更清楚，也会触动主持者的体面。\n\n“议事时的座次”第1篇。"

 hbe_short_eastern_river.11.title: "新岸地的条件"
 hbe_short_eastern_river.11.desc: "河水改道后，一座旧船坞落在浅滩边，船匠仍靠修小船生活。大船商提出搬坞到深水处，要求府署替他取得岸地。船匠愿搬，却担心搬去以后只能给同一家商号做活。旧址旁的小渔户也需要留下修船的地方。\n\n岸地主人要价很高，愿以多年船费代替现钱。府署可以买下共用岸地，也可以准商号承包，或只修通旧坞前的水道。不同安排会决定谁还能独立接活。岸主在地契旁另放了一张逐年船费单，船匠则带着旧坞的量尺。小船要不要有自己的入口，今天就得在岸线上画出来。"

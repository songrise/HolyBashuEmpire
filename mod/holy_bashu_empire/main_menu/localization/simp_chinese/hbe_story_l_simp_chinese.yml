 hbe_short_southwestern_valleys.11.title: "铁匠接谁的活"
 hbe_short_southwestern_valleys.11.desc: "寨中铁匠做出一扇结实的铁门，寨主请求只准供给自己的仓房。几个普通住户也想买锁护粮，铁匠担心拒绝寨主便失去炭料。赶市的商人带来外地铁价，说这门活路不该只靠一家供养。\n\n府署可以给铁匠一批公共仓锁订单，也可以维护寨主的独供约，或准住户按旧契购买。保护出资与放开经营都需要明定期限。铁匠炉前摆着公仓与寨主两份订单，供炭的人却说，料一断便两份都做不成。住户只想先领到自己订的农具。"

 hbe_story_southern_salt_wine.3.desc: "药铺称巨骨能补虚损，已经收下数十份预订。师生发现晒干的骨块有明显石质，却拿不出足以说服病家的解释。\n\n井户愿把药钱用于修井，医者则要求暂停销售。我们若取消预订，须处理药商的损失；若准许继续出售，调查也将失去更多完整标本。\n\n本篇是“井下巨骨”的第3章。前面的选择将决定最后保留哪一种长期章程。"

 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_2_3: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.2.c: "将幼兽献入府城，由贵族供养。"
 hbe_story_chengdu_plain.2.d: "到此为止，不再投入后续事业。"
 hbe_story_chengdu_plain.2.title: "一只受伤的幼兽"
 hbe_story_chengdu_plain.2.desc: "当年的兽皮与足迹使府署留意起竹林，巡山者随后一直托沿路村户传递消息。\n\n巡山者带回一只脚掌受伤的幼兽。它只肯吃嫩竹，衙中马夫却不断往食盆里添谷物。附近竹农愿供应鲜竹，但要求免去一季驿役。医者希望留下幼兽观察。几名使者已请求把它送入府城，他们认为这种异兽足以显扬本府。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_3_1: "共用地界"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_3_1: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_next_6_tt: "下一章将在约6年后继续。"
 hbe_story_chengdu_plain.3.a: "用其他官田安置垦户。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_3_2: "实地查验"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_3_2: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.3.b: "测绘兽径，保留相连的竹林。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_3_3: "承认田册"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_3_3: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.3.c: "承认新田地契，以田租补贴兽苑。"
 hbe_story_chengdu_plain.3.d: "到此为止，不再投入后续事业。"
 hbe_story_chengdu_plain.3.title: "山界上的新田"
 hbe_story_chengdu_plain.3.desc: "救治幼兽让府署第一次接触到养兽的难处，也使山中竹林成了各方共同在意的地方。\n\n垦户在当年发现幼兽的坡地开出了新田，巡山者却发现旧有竹林已经连成零碎的几片。乡老说，没有这些田，几户新来的家庭便过不了冬。我们若划定护兽山界，就须补偿受影响的农户；若任由田地扩展，也不能再向府城保证山中仍有活兽。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_4_1: "保留山界"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_4_1: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_next_7_tt: "下一章将在约7年后继续。"
 hbe_story_chengdu_plain.4.a: "尊重山契，以兽图代替活兽。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_4_2: "公开图录"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_4_2: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.4.b: "只准学者来访，不准搬走白熊。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_4_3: "限期承包"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_4_3: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.4.c: "试办一次远送，由商人承担补给。"
 hbe_story_chengdu_plain.4.d: "到此为止，不再投入后续事业。"
 hbe_story_chengdu_plain.4.title: "瑞兽是否应当远送"
 hbe_story_chengdu_plain.4.desc: "新田与竹林的界线经过一次裁处，村户和兽苑都开始按各自留下的凭记办事。\n\n外来使者愿以贵重礼物换取一对白熊。养兽人提醒我们，幼兽途中离开鲜竹便会衰弱，驿站也没有照料它们的经验。商人提出沿途雇人补给，贵族则认为拒绝赠兽会损害礼仪。山民也翻出祖辈留下的山契，追问外来采办是否会越过原有的竹山界线。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_5_1: "赈济口粮"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_5_1: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.5.a: "为村民赔粮，开放另一片竹山。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_5_2: "实地查验"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_5_2: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.5.b: "调查各处竹林，建立轮换供养。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_5_3: "府第供养"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_5_3: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.5.c: "围住兽苑，把野外供养交给村寨。"
 hbe_story_chengdu_plain.5.d: "到此为止，不再投入后续事业。"
 hbe_story_chengdu_plain.5.title: "竹花之年"
 hbe_story_chengdu_plain.5.desc: "远来使者的请求已作裁处，送兽的难处与沿途补给的开支都有人记在案中。\n\n山中大片竹林开花，白熊沿河谷来到村落，翻动了农家的粮窖。守林人说，旧竹将在结籽后枯死，新竹长成还要几年。村民要求驱走兽群，养兽人则请求拨款采竹。无论竹山归村寨经营还是供城苑采办，眼下的旧办法都已不能保证兽群得到食物。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_6_1: "共同见证"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_6_1: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_next_8_tt: "下一章将在约8年后继续。"
 hbe_story_chengdu_plain.6.a: "让巡山人和乡老共同校订。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_6_2: "公开图录"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_6_2: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.6.b: "按多年观察刊印，不沿袭旧传。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_6_3: "府第供养"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_6_3: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.6.c: "保留瑞兽传说，制作献礼画册。"
 hbe_story_chengdu_plain.6.d: "到此为止，不再投入后续事业。"
 hbe_story_chengdu_plain.6.title: "画册中的习性"
 hbe_story_chengdu_plain.6.desc: "竹花过后，村落与养兽人留下了许多供食记录，旧画册却还没有收入这些见闻。\n\n医者和巡山者的记录已经积累数册，画师却把[Concept('hbe_history_panda', '白熊')|e]画成了食铁的猛兽。乡民拿出它啃竹的痕迹，要求把自己的见闻也写入册中。府学愿刊行新图志，但几个旧家族坚持保留能显扬本府的传说。我们须决定图志怎样署名、怎样讲述这些山林。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_7_1: "足额雇工"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_7_1: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.7.a: "把巡护交给山村，按年付酬。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_7_2: "共同传习"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_7_2: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.7.b: "设立府学观察席，训练巡山人。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_7_3: "陈馆迎客"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_7_3: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.7.c: "由府城兽苑购买供养，不再干预山村。"
 hbe_story_chengdu_plain.7.d: "到此为止，不再投入后续事业。"
 hbe_story_chengdu_plain.7.title: "下一代巡山人"
 hbe_story_chengdu_plain.7.desc: "图册经过整理，山中见闻与府城传说各有了保存的去处，留下记录的人也渐渐老去。\n\n旧日发现白熊的猎户已经去世，他的孙辈希望接领巡山职役，却不肯再按祖辈的工钱出山。竹农也要求把供养费用写进常年的公账。若此事仍靠一代人的恩赏维持，前人留下的图册便可能成为最后的记录。我们需要为后人留下能履行的安排。"
 STATIC_MODIFIER_NAME_hbe_story_ending_chengdu_plain_1: "山林护兽约"
 STATIC_MODIFIER_DESC_hbe_story_ending_chengdu_plain_1: "长期章程。具体影响见下列数值。"
 hbe_story_chengdu_plain.8.a: "山林护兽约。"
 hbe_story_chengdu_plain.201.a: "把章程留给后来者。"
 hbe_story_chengdu_plain.201.title: "山林护兽约"
 hbe_story_chengdu_plain.201.desc: "巡山的人带来最后一册记录。山民的柴路、竹农的供养和白熊往来的兽径，终于被写在同一张图上。府城使者仍想把珍兽送进城苑，村寨却已经能说清哪些山地须留下，哪些田可继续耕作。护育不再只是一次放归，而是每年都要履行的共同约定。\n\n新接班的巡山人将工钱簿交给村寨查认，竹农也领回记有供养份额的副本。来年无论换谁主持，兽径与柴路都须照约保留，缺下的照料也有人能够追问。"
 STATIC_MODIFIER_NAME_hbe_story_ending_chengdu_plain_2: "锦城瑞兽馆"
 STATIC_MODIFIER_DESC_hbe_story_ending_chengdu_plain_2: "长期章程。具体影响见下列数值。"
 hbe_story_chengdu_plain.8.b: "锦城瑞兽馆。"
 hbe_story_chengdu_plain.202.a: "把章程留给后来者。"
 hbe_story_chengdu_plain.202.title: "锦城瑞兽馆"
 hbe_story_chengdu_plain.202.desc: "城苑的竹院已经换过几任养兽人，来访者能够看见活兽，也能够读到它们的饮食与习性。巡山人担心远离山林的供养越来越贵，商人则愿承担一部分费用。府署选择把这些年的成果留在瑞兽馆中，声名与访客将伴着一笔持续的开支。\n\n养兽人把日常食料与接待宾客的开支分列两栏，负责供竹的人按册领酬。瑞兽馆开门以后，官署仍须年年为活兽的照料付账，不能只收下远客的赞赏。"
 hbe_story_chengdu_plain.8.c: "封存旧案，不另立长期章程。"
 hbe_story_chengdu_plain.8.title: "山林与城苑的约定"
 hbe_story_chengdu_plain.8.desc: "巡山与供养的接续已有安排，接任者如今拿着旧簿，请求把临时做法定成能长期遵行的章程。\n\n早年救起的那只幼兽早已不在，养兽人仍沿用它留下的记录。山中的村寨与府城各有自己的供养方式，却都希望将这些年的功劳写入最后的章程。我们可以让山林承担保育，让城苑负责展示，也可以继续优先满足远来的宾客。这次决定将为本府留下长久的制度。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_101_1: "夜市开灯"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_101_1: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.101.a: "以公款付更钱，开放摊位。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_101_2: "行会旧规"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_101_2: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.101.b: "允许坊长收钱，限明收费。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_101_3: "商户供席"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_101_3: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.101.c: "让织户与商人共同安排夜市。"
 hbe_story_chengdu_plain.101.title: "锦城夜市的灯钱"
 hbe_story_chengdu_plain.101.desc: "锦江边的夜市连续开了几晚，织户周氏第一次把自家的[Concept('hbe_history_embroidery', '细绣')|e]卖给了远来的客人。回家时，她却发现巡夜人正挨铺收取灯钱，数额比白日的摊税还高。\n\n巡夜人说，新市场使他们不得不添人守更；坊长拿出旧规，要求商人各自承担。若府署出钱维持灯火，夜市便能继续开放，但旧有行会也会失去决定谁能摆摊的权利。周氏已交了一笔钱，仍不知道明晚能否再来。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_102_1: "共同传习"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_102_1: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.102.a: "资助补抄，让工匠继续借阅。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_102_2: "旧礼作保"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_102_2: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.102.b: "公开追责，重申府学藏书规矩。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_102_3: "作坊试制"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_102_3: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.102.c: "把染色页另印成工匠小册。"
 hbe_story_chengdu_plain.102.title: "府学借出的孤本"
 hbe_story_chengdu_plain.102.desc: "成都府学的一部旧书被抄书人借到锦坊，回来时少了几页。掌书者指责坊中工匠不知珍惜，年轻绣工却说缺页记着几种从未见过的染色法，大家只是想抄下它们。\n\n有人提议把书锁回库中，也有人愿出纸墨钱补抄。府学的名望需要维护，实用技法也值得流传。原来借书的抄手已在门外等候三日，他怕被逐出府学，却不肯承认工匠的求知有错。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_103_1: "保留山界"

 hbe_story_eastern_river.5.title: "修船木料的去处"
 hbe_story_eastern_river.5.desc: "江边几处树林已供不出旧年修船所需的长木，船匠要求优先采购山中木料。寺院与村寨也在用同样的树木修桥。\n\n引水谱能减少触礁，却不能替船场补足材料。我们须决定怎样让船匠、山民和桥工共用有限的木材。\n\n本篇是“峡江引水谱”的第5章。前面的选择将决定最后保留哪一种长期章程。"

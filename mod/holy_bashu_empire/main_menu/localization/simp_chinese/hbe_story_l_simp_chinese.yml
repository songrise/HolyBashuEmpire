 hbe_story_northern_shudao.6.desc: "商队带来一件刻度细密的[Concept('hbe_history_timekeeping', '观测器')|e]，府学请匠人仿制，旧掌历者却担心异乡技法使自己的历法失去地位。\n\n军府更关心它能否帮助测距。我们可以把新器纳入观测，也可以只用于关防，或继续优先修整现有的器物。\n\n本篇是“山壁上的星历”的第6章。前面的选择将决定最后保留哪一种长期章程。"

 hbe_story_northern_shudao.108.title: "梓潼书生的路费"
 hbe_story_northern_shudao.108.desc: "梓潼书生被选中前往邻府讲学，却凑不起路费。他的父亲愿卖掉农具，府学中的富户子弟则说，既无力出行便应把名额让给别人。\n\n老师请求从府库给一份旅费，掌库官担心以后人人援例。我们可以设按学业发放的助学钱，也可依旧由家族承担，或让商人资助讲学。谁能走出本府，不应只取决于家中恰好能卖掉什么。"

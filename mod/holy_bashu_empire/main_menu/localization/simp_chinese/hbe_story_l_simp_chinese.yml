 hbe_story_eastern_river.101.title: "大足石壁上的姓名"
 hbe_story_eastern_river.101.desc: "[Concept('hbe_history_dazu', '大足')|e]石工在造像旁刻下自己的名字，出资家族却要求磨去，称只有供养者的名号应当留下。石工的儿子拿出父亲多年留下的凿痕，请我们允许后人知道是谁完成了这面石壁。\n\n寺院担心争执影响后续供养，书生则认为工匠的技法同样值得记载。府署可以保护署名，也可另立一块名册，或按供养家族的意思处置。留下什么名字，也会决定下一批工匠愿以怎样的条件来此。"

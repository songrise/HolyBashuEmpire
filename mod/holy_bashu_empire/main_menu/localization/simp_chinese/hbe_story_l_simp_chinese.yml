 hbe_short_shared.113.title: "两处坟地的祭钱"
 hbe_short_shared.113.desc: "亲族来住的请求已经处理，长者也从旧乡回到子女身边，两处祭扫的花费又引出新的争议。\n\n长者回来后，子女请求在新乡留一处祭田，旧族认为他们的祖坟仍在外地，不应再分公地。府署可以准自购，也可只认可原有祭祀名额。长者把旧乡带回的祭土收在木匣里，子女询问新乡的地价。旧族愿许他们祭扫，却不愿从公地里另分一份。"

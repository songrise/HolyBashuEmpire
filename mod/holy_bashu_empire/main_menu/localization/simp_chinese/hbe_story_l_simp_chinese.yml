 hbe_story_central_hills.5.title: "仓册中的旱年"
 hbe_story_central_hills.5.desc: "护土试种留下了一批收成记录，年轻书记开始拿它们核对仓中保存的灾年借粮。\n\n二十余年积下的仓册记着旱年与水灾，年轻书记发现修埂最多的村落往往少借一些赈粮。仓吏希望据此改变赈贷额度。贫村担心自己因无力修埂而失去救助。府署须决定把记录用于共同修治，还是用于区分各村责任。"

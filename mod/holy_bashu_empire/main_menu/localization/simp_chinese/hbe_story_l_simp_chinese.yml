 hbe_story_chengdu_plain.106.title: "唐昌田里的水碓"
 hbe_story_chengdu_plain.106.desc: "彭州匠人把磨粮水碓改得更省力，乡民争着把谷物送来，原来替人舂米的几户却突然少了收入。匠人说旧活计迟早要改变，村长却要求我们先想好这些人如何过冬。\n\n府署可出钱教他们修理水碓，也可按旧户保留一部分舂米名额。商人提出包下水碓，换取几年独家磨粮。机器旁已经排起长队，领头的妇人只希望今天能把米带回去。"

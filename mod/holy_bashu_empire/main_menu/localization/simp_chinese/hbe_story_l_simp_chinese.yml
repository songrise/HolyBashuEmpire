 hbe_story_northern_shudao.109.title: "龙安山中的兽患"
 hbe_story_northern_shudao.109.desc: "龙安一处牧场接连损失牲畜，牧户要求猎杀山中的猛兽。采药人却说，兽群被新开的柴路赶到了旧牧场边。\n\n猎户愿出力，只须保证赏钱；乡老请求先调整柴路和放牧区域。府署可以为牧户补偿，调查兽径，也可悬赏捕猎。牧场主人已经把围栏加高，穷牧户却连重新购置一只羊的钱也没有。"

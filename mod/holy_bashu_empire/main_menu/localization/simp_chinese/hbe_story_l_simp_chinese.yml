 hbe_short_shared.63.d: "停止后续办理，到此结束。"
 hbe_short_shared.63.title: "下一袋归还的种粮"
 hbe_short_shared.63.desc: "虫害与补种已有安排，收割的人带回不同模样的谷，掌仓人又问起当初借出的种粮。\n\n借种户带回不同颜色的谷子，掌仓人要求严格按原种归还。新户认为能留足播种的好谷即可，旧仓户担心账目因此混乱。还种的人各带来一袋好谷，掌仓人逐袋拿去与旧样比。谷已经长过一季，仓格和借据却仍只写着最初那一种名字。"
 STATIC_MODIFIER_NAME_hbe_short_choice_shared_8_1_1: "按证裁断"

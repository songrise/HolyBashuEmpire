l_simp_chinese:
 hbe_story_chengdu_plain_branch_1_tt: "这项安排使本国更倾向“山林护兽约”的道路。"
 hbe_story_chengdu_plain_ready_1_tt: "历次选择已经支持“山林护兽约”的道路。"

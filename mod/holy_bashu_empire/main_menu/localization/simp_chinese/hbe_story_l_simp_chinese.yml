 hbe_story_western_tea_horse.4.title: "一场马疫"
 hbe_story_western_tea_horse.4.desc: "冬牧地点已有裁处，马群沿茶路往来，几处收治点却在同一季报来了急病。\n\n病马沿驿路传播，高价战马和普通驮马都出现相似症状。驿吏要求继续开市，医马人则请求暂时隔开新来的马群。停市会损害茶商收入，不停市可能让更多牲畜患病。军府催促我们保证下一季能够征调的马数。"

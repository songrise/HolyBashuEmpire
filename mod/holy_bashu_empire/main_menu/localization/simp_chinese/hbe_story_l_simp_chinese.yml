 hbe_story_southwestern_valleys.7.title: "旧桥约的继承者"
 hbe_story_southwestern_valleys.7.desc: "援手与留守已有安排，几次修桥留下新的工钱记录，年轻人却不愿再照旧丁册出工。\n\n最初签订桥约的人已陆续退任，年轻村民不愿继续按祖辈的丁额出工。关署认为旧约仍有效，商人则希望改成按货量缴钱。桥还需要人照料，旧有功劳却不足以分配眼下的负担。新章程必须明确谁能参与重新议约。"

 hbe_story_northern_shudao.113.title: "驿路上的失物袋"
 hbe_story_northern_shudao.113.desc: "蜀道驿卒拾到一袋钱，数日后两名商人都带着担保人来认领。年轻驿卒记得其中一枚钱上的缺口，却因没有家族作保而不被信任。\n\n府署可按物证查验，也可接受较有声望的担保，或让商人行会共同审理。驿卒已经把袋子原样存进关库，他担心自己守规矩的结果反而是赔上多年工钱。处理此事也会影响沿途人是否还愿意上交拾物。"

 hbe_short_southwestern_valleys.2.title: "损坏的船板"
 hbe_short_southwestern_valleys.2.desc: "盐源湖上的两家渔户共用一只大船，一家想载盐换钱，另一家仍靠打鱼供粮。盐商愿预付运费，条件是整季都用船。岸边村寨请求保留雨季渡人，旧船契却没有把这些用途分开写过。\n\n船板开裂后，盐商认为渔具划伤了船，渔户说货载过重。船匠愿查验，但须停船数日。府署可垫修船费，也可让出资者先决定修法。\n\n“湖上两家的渔船”第2篇。"

 hbe_short_shared.209.title: "没有族人作保的匠人"
 hbe_short_shared.209.desc: "一名外乡匠人申请接修城梯的活，因没有本地亲族作保而被拒。过去替他订货的商人愿担保，却要求匠人以后只为自己供货。掌工程的人称没有担保便无法追究坏工，匠人拿出的旧作品无人愿看。\n\n府署可以以实作验工，也可以维护家族担保，或允许商人作保但限定独供期限。我们所选的凭据，会使更多有手艺的人留下，也可能让旧承包者觉得自己失去了惯有的保护。"

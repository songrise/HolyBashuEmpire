 hbe_story_southwestern_valleys.6.title: "相邻两谷的水势"
 hbe_story_southwestern_valleys.6.desc: "桥头集市的份额暂有裁处，邻谷一场山洪却带来了新的急事，要借走本谷一批熟练匠人。\n\n邻谷的桥在山洪中受损，请求借用我们的铁匠和绳匠。本谷村民担心新雨将至，反对把维修人手送走。若两谷能互相供养工匠，以后便可共同应对水患；若优先守住本谷，我们也须接受邻谷下次拒绝援手。"

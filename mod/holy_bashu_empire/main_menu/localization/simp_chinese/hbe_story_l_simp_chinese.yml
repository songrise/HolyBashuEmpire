 hbe_story_southern_salt_wine.4.desc: "新凿的井壁露出几层颜色不同的石带，骨节集中在其中一层。老井工记得另一处井口也曾见过相似排列，愿带师生沿山查找。\n\n掌盐官只关心哪一层更容易出卤，府学却希望把各井的石层画成一张长图。查访需要人手，也会让井主担心秘密外泄。\n\n本篇是“井下巨骨”的第4章。前面的选择将决定最后保留哪一种长期章程。"

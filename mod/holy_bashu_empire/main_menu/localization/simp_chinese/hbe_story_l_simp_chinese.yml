 hbe_story_central_hills.102.title: "内江糖灶的新手"
 hbe_story_central_hills.102.desc: "内江糖灶收了几名外乡学徒，本地灶工说他们不懂得掌火，要求把试煎的损失都记在学徒名下。老师傅却发现其中一个新手正好调出了更清的糖色。\n\n坊主希望留下他的办法，行会只愿给他普通搬运的工钱。府署可主持公开试煎，也可维护旧工阶，或让师傅自定传习。一个尚无积蓄的学徒，不该只在出错时才被记下名字。"

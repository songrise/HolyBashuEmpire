 hbe_short_southwestern_valleys.23.title: "留给后来者的席位"
 hbe_short_southwestern_valleys.23.desc: "误译与粮差已经处理，下一次议事的日期将近，各寨又来询问谁能接下长久的译写位置。\n\n下一次议事前，主持者问译写席是否可以由自己的子弟继承。几个村寨认为应按记录能力推举，青年愿意教会更多人，也担心自己得到解释记录的机会后，后来者仍会被挡在门外。府署可以定考核，也可以承认旧席的传承。来学译写的年轻人站在旧座次后，族老指着祖辈的席牌。以后谁能看账、谁只能替人传话，须在新名册上写清。"

 hbe_story_southwestern_valleys.1.desc: "一条山溪两岸的村寨各架一座绳桥，过路商人须缴两次费用。年长的织绳人说，两桥若共用一组桥头，维修也会容易许多。\n\n村寨担心失去旧日收取的桥钱，府署则希望借修桥统一通行。我们要先决定由谁保管桥头、由谁付工钱。\n\n本篇是“谷中桥约”的第1章。前面的选择将决定最后保留哪一种长期章程。"

 hbe_story_central_hills.202.a: "把章程留给后来者。"
 hbe_story_central_hills.202.title: "坡田统一田册"
 hbe_story_central_hills.202.desc: "统一田册列明田界、水口和修埂份额，府署终于能把过去分散的租额核在一起。旧村长请求保留几处按乡约供粮的例外，掌册官答应另附一页。国家得到更清楚的收入与控制，乡民也将面对更整齐的征收。\n\n书记把租额与水口分别装订，乡老仍保留核对的副本。往后的田讼可以查到具体份额，官署得到更齐整的征收凭据，也须解释每一次更改。"
 hbe_story_central_hills.8.c: "封存旧案，不另立长期章程。"
 hbe_story_central_hills.8.title: "留给后人的坡田"
 hbe_story_central_hills.8.desc: "修埂分担已经重议，几册田图、仓账与工钱簿放到一起，各村请求留下可长期沿用的规矩。\n\n旧年常被冲坏的坡地已能耕种，义仓也保存着历年接续的账簿。乡老请求把修治写成乡约，掌田官希望合并所有田册。前者让村落共同主持水土，后者让府署掌握租额与责任。我们最后选择的制度，将影响后人怎样守住这些田。"

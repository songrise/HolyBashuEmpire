 hbe_story_northern_shudao.112.title: "顺庆的两份族谱"
 hbe_story_northern_shudao.112.desc: "顺庆两家人都称自己应当主持修桥，因为旧族谱记载祖先最早捐过土地。新住户拿出最近几年的工钱清单，请求也在桥约上署名。\n\n族老坚持祖先的功劳不可重写，书记则认为桥还依靠今天的人维修。府署可以并记旧事与新出资，也可保留旧族的主持权，或把修桥完全转为公账。让人愿意继续出钱，比仅为古老的名字排序更难。"

 hbe_story_central_hills.106.title: "潼川春市的草席"
 hbe_story_central_hills.106.desc: "潼川春市的草席摊突然被指定只准旧行会摆设，新住户把自己编好的席子又背回村里。行会说，名额能保护货色，商人却发现旧摊的席价已经上涨。\n\n府署可开放试售，也可维持旧行规，或设公开验货。一个刚搬来的老人没有名望作保，却能把席边编得紧实。决定谁能卖货，既影响行会的地位，也影响本府能否得到更多便宜的日用品。"

 hbe_story_southwestern_valleys.2.title: "木契与桥工"
 hbe_story_southwestern_valleys.2.desc: "桥头与出资已有初议，开工点人时，村寨的木刻旧约与官署纸契摆在了同一张桌上。\n\n新桥所需人手已备齐，村寨却只带来木刻的旧约。府城书记坚持所有承诺都应改成纸契，织绳人担心自己认不得新条文。翻译者愿把两种凭证并存，掌关官则希望纸契由府署独存。桥尚未接通，保管权已成为各方最在意的事。"

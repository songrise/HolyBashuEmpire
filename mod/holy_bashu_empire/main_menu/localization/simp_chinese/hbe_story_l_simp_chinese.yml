 hbe_story_eastern_river.7.desc: "新式大船吃水更深，年轻引水人要求重新测量一些旧航道。书坊愿承印新版谱册，却不肯承担每年改版的成本。\n\n老船帮担心新人借新谱取代自己的位置。府署需要把更新、训练与收费安排在同一份船约中。\n\n本篇是“峡江引水谱”的第7章。前面的选择将决定最后保留哪一种长期章程。"

 hbe_short_eastern_river.22.title: "纸上多出的一行字"
 hbe_short_eastern_river.22.desc: "一位拓工在峡壁旧刻上留下数张纸样，过路船户愿把它们带到城中出售。村寨认为石刻记着祖辈渡江的旧事，不该由陌生人定价。拓工说，若无人买纸，明年便没人再来查记那些正被风雨磨平的字。\n\n几张新拓本出现了原石没有的题名，商人说只是方便买主辨认。拓工要求把补题与原字分开，乡老认为不分清便会改写旧事。府署可公开核验，也可让商铺担保自己的题名。\n\n“峡中留下的拓本”第2篇。"

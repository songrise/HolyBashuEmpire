 hbe_short_northern_shudao.11.title: "谁来补上这几日"
 hbe_short_northern_shudao.11.desc: "关军与村寨各留一册轮戍工钱，名字相同，记的日期却不一样。几名士兵已经回乡耕作，仍被算在缺役的人里。书记说两册无法对照，只能请家族作保；士兵认为自己守过的城门不该由家世来证明。\n\n城上催来下一班的缺岗数，村民则带着已经排好的农时，请求先查清那些重算的日子。若等两册逐页核完，眼前便无人接更；若先照军册点人，几家已经守足日数的住户又须丢下田里的活。军官将需要补上的班次写在案边，乡老请求把有争议的姓名另圈出来，至少不要让一场旧账立刻变成下一场追役。"

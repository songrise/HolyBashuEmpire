 hbe_story_northern_shudao.3.title: "一次未中的月食"
 hbe_story_northern_shudao.3.desc: "水刻补上了阴天报时的缺口，守更人与府学都留下一些可供相互核对的夜间记录。\n\n新抄的历书预告月食，山口观测者却没有看到记载的景象。寺院的讲者认为这是灾异，府学怀疑抄录时弄错了日期。驿卒保留的几份时刻记录可以帮助查验，但公开核对也会使掌历者难堪。"

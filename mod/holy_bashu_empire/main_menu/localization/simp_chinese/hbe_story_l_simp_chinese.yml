 hbe_short_central_hills.21.title: "旧借能否重算"
 hbe_short_central_hills.21.desc: "修桥时几家人替穷户垫过粮，十年后债簿仍在收息。旧桥已修好，债主却把新的维修钱也记在同一页上。乡老请求府署查清当年的担保，商人说若轻易免债，下次没人肯为公共事业出钱。\n\n借户只记得自己出过工，没有完整钱契。府署可以核对当年的工钱，将已出的劳作抵账，也可以维护现有债簿，或为贫户买断一部分旧债。\n\n“桥边的债簿”第1篇。"

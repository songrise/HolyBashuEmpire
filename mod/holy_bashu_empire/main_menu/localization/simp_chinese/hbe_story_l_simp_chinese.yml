 hbe_story_southwestern_valleys.4.title: "从绳桥到铁索"
 hbe_story_southwestern_valleys.4.desc: "险绳修复以后，桥户开始估算下一次换绳的用度，进谷铁匠也带来了一截铁链。\n\n铁匠提出以铁索替代部分主绳，木桥户却担心自己失去维修生计。运铁进谷的成本也远高于原有草绳。商人愿垫付材料，条件是获得多年桥钱。村寨可以继续自修，府署也能为铁索承担头一笔费用。"

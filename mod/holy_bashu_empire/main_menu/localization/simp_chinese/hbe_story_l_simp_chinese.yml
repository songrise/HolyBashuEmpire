 hbe_story_central_hills.4.title: "绿肥与旧收成"
 hbe_story_central_hills.4.desc: "小坝用水已有裁处，几户佃农趁休耕种下护土作物，又带来了关于旧租的新争议。\n\n府学提出在休耕地种植护土绿肥，几户佃农已经试出了较稳的收成。田主却认为休耕地仍应缴纳旧租。若承认试种期间减租，其他田主也会要求补偿；若坚持原额，村民便没有余力继续试种。"

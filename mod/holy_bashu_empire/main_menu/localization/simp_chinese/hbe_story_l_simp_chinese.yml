 hbe_story_western_tea_horse.107.title: "松潘雪后的行期"
 hbe_story_western_tea_horse.107.desc: "松潘大雪封住山道，关将仍按旧日名册要求商队启程。领队提醒他，几处风口连熟悉道路的牧人也不肯带路。\n\n商人愿多付一笔护行钱，牧人却说钱不能让积雪停止崩落。府署可以重新定期，派人先查道路，或要求守军护送。一个赶马少年已经把货篓卸了下来，他不想为了账册上写下的日期失去同行的人。"

 hbe_story_northern_shudao.5.title: "送不齐的观测簿"
 hbe_story_northern_shudao.5.desc: "星台与记录点已有安置，山间记录积到一定数量后，怎样收齐簿册又成了问题。\n\n山路受阻后，几处测候簿无法按时送到府城。驿吏想借机把所有测候者纳入驿役，村寨却坚持只按旧约交送。书坊愿教村民抄写副本，只需府署承担纸墨。关将则希望把原件锁在各自的关库，免得泄露夜间守望。"

 hbe_short_southern_salt_wine.12.desc: "泸州酒户订做一批较薄的酒瓮，船户说装船更轻，窑工却担心长途碰撞。第一批货在合江卸船时破了数只，酒户指责船上的垫草不足。窑工带来完好的空瓮，要求把装载与烧造分开查验。\n\n试装发现薄瓮需要更厚的垫草，省下的陶料未必能抵过装载成本。年轻窑工提出改做圆肩，船帮希望继续用熟悉的老瓮。新器具可以试行，旧办法也有稳定交货的价值。\n\n“顺流而下的酒瓮”第2篇。"

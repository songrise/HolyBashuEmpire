 hbe_story_western_tea_horse.3.desc: "商队请求在村落冬牧场养病马，村民担心自己的牛羊没有草吃。马商愿付租，但只肯向一位村寨头领交钱。\n\n牧人提出分区轮牧，府署需要先确认谁有权出租这些草场。缺少这一层安排，医马人便无法维持牲畜过冬。\n\n本篇是“山路上的医马人”的第3章。前面的选择将决定最后保留哪一种长期章程。"

 hbe_short_shared.113.desc: "一位迁来多年的长者准备回湖广祭扫，请求带走自己留下的地契副本。田主认为长期离乡会使契约失效，子女愿继续耕作。长者说回去并非舍弃新乡，但他不愿把祖先的坟地永远留在一封旧信里。\n\n长者回来后，子女请求在新乡留一处祭田，旧族认为他们的祖坟仍在外地，不应再分公地。府署可以准自购，也可只认可原有祭祀名额。\n\n“返回旧乡的长者”第3篇。"

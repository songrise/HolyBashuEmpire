 hbe_short_shared.63.title: "下一袋归还的种粮"
 hbe_short_shared.63.desc: "迁户用从旧乡带来的种子播下第一季田，邻村愿借种，却要求新户先参加义仓担保。种子不多，新户担心借出去后自家无粮，旧户又怕新来的田迟早要分走灌水。\n\n借种户带回不同颜色的谷子，掌仓人要求严格按原种归还。新户认为能留足播种的好谷即可，旧仓户担心账目因此混乱。\n\n“荒地上的借种”第3篇。"

 hbe_short_eastern_river.3.title: "最后一张夜行券"
 hbe_short_eastern_river.3.desc: "灯号与江号已有试行办法，几趟粮船平安过去以后，谁能使用这套经验又成了问题。\n\n粮船依新号过峡，请求把夜行办法写进共同船约。军官想只向受护船只发券，船帮希望所有付过灯钱的人都能查阅。规则可以扩大，也可以留作军府的护航权。最后一张夜行券已经填好船名，码头还有几位出过灯钱的船主等着。他们想带走的既是许可，也是一份能自己辨认的夜号。"

 hbe_story_central_hills.2.title: "新埂挡住旧路"
 hbe_story_central_hills.2.desc: "坡面的修治有了开头，村民随后才发现，新埂把原来去义仓的近路拦在了田外。\n\n新修的梯埂挡住了村民去义仓的近路，筑埂者却说若拆开缺口，雨水便会再次冲走土壤。粮商要求另修道路。几户田主愿出地，却不愿再出役夫。若府署继续依赖旧役额，修好的梯田也会让乡里生出新的怨恨。"

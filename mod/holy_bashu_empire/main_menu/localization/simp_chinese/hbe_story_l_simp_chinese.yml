 hbe_story_northern_shudao.6.title: "异乡的仪器"
 hbe_story_northern_shudao.6.desc: "簿册的保管与交送已有办法，来往商队又带来了本地匠人不曾见过的[Concept('hbe_history_timekeeping', '观测器')|e]。\n\n商队带来一件刻度细密的观测器，府学请匠人仿制，旧掌历者却担心异乡技法使自己的历法失去地位。军府更关心它能否帮助测距。我们可以把新器纳入观测，也可以只用于关防，或继续优先修整现有的器物。"

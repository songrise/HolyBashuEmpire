 hbe_story_chengdu_plain.112.title: "春社的戏台"
 hbe_story_chengdu_plain.112.desc: "成都平原的春社搭起戏台，一位说唱人把收税吏的口音学得惟妙惟肖。乡民笑得热闹，税吏却要求停演，称这会让百姓轻视官府。\n\n社首愿删去相关段子，也希望府署不要因此撤掉整场春社。商人已付钱订了台前席位，穷户则只挤在台后听声。我们处理这桩小事的方式，会让人知道哪些笑话能说，哪些人能在共同的节日里占一席。"

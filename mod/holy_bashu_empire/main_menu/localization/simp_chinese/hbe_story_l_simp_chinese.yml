 hbe_story_central_hills.1.title: "雨后露出的红土"
 hbe_story_central_hills.1.desc: "简州与潼川的坡田遭春雨冲刷，田主仍按旧亩数收租，佃户却只能在沟底找到冲走的种子。乡老请求沿坡修埂，掌库官则希望先核定减产。\n\n修埂要动用土地，也可能改变相邻田界。我们须决定怎样补偿田主，又怎样留下可继续耕种的土壤。"

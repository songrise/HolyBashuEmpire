 hbe_story_chengdu_plain.108.title: "临邛客栈的女账房"
 hbe_story_chengdu_plain.108.desc: "邛州一间客栈的女账房把多年欠账整理清楚，查出几名富商重复抵押同一批货。商人们称她无权作证，还找来亲族要求掌柜将她辞退。\n\n掌柜带来完整账册，愿让府署逐笔核验。若认可她的记录，小商户会多一种保护自己的办法；若只接受有家族担保的人作证，旧秩序容易维持，但几笔重押也可能就此蒙混过去。女账房已把原件分成两份存放。"

 hbe_story_western_tea_horse.106.title: "石泉的陌生药方"
 hbe_story_western_tea_horse.106.desc: "石泉府医见到一种牧人常用的草药，愿试着记录，寺中医者却担心病家因此放弃熟悉的治疗。牧人只请求不要在未经试用前把药篓全部烧掉。\n\n一个旧病反复的驿夫愿配合查验，但希望府署为休工期间的饭钱作保。我们可以支持共同诊治，也可暂禁陌生药物，或只把它用于牲畜。药方的来历与药效，并不一定能由同一种担保说明。"

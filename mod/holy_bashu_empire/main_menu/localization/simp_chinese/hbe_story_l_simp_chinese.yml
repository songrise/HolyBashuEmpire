 hbe_story_chengdu_plain.102.c: "把染色页另印成工匠小册。"
 hbe_story_chengdu_plain.102.title: "府学借出的孤本"
 hbe_story_chengdu_plain.102.desc: "成都府学的一部旧书被抄书人借到锦坊，回来时少了几页。掌书者指责坊中工匠不知珍惜，年轻绣工却说缺页记着几种从未见过的染色法，大家只是想抄下它们。\n\n有人提议把书锁回库中，也有人愿出纸墨钱补抄。府学的名望需要维护，实用技法也值得流传。原来借书的抄手已在门外等候三日，他怕被逐出府学，却不肯承认工匠的求知有错。"

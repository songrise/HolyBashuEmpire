 hbe_short_shared.92.title: "路钱去了哪里"
 hbe_short_shared.92.desc: "路钱的诉状已经受理查问，收费凭据送到案上，几项私家支用终于显了出来。\n\n查账发现部分路钱确实修过桥，另一些却用在管事家中。乡老担心全部追回会使下季无人修桥，迁户请求把私用与公用分开。修桥的料钱有几笔能对上，管事家中用去的几笔却只写着代办。乡民请他把两样分开，不肯用一场新修桥盖过旧账。"

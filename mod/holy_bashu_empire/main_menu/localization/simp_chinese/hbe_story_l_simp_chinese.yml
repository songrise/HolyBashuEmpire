 hbe_story_eastern_river.108.title: "云阳江边的木排"
 hbe_story_eastern_river.108.desc: "云阳商人扎起一列木排准备顺江运走，村民却发现其中用了几根原定修桥的长木。木商称自己按价付过钱，供桥的乡老则说那笔交易没有得到村中同意。\n\n若把木排拆开，商人会误了交货；若任其离岸，修桥便要再等一季。府署可安排换木，也可重定采办责任，或先让木排起行，从货利中收钱补桥。几方争执时，江水已经开始上涨。"

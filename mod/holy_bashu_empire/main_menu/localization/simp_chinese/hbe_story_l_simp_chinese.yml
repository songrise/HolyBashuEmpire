 hbe_short_southwestern_valleys.13.title: "锁住的欠粮"
 hbe_short_southwestern_valleys.13.desc: "钥匙已有保管办法，铁门也照议启闭；有人来取种粮时，旧欠粮租却又堵住了仓门。\n\n一名穷户因欠租被锁在仓外，自己的种粮也拿不出来。铁匠请求锁只保护财货，不成为无据扣粮的办法。府署可以按契查欠，也可以认可寨主的原有收租权。借粮人带着播种的空袋来，掌仓者却把旧租数盖在袋口。眼下不放种粮，秋后的欠数只会更难补齐。"

 hbe_story_northern_shudao.105.c: "另修便道，让商船共同出资。"
 hbe_story_northern_shudao.105.title: "广元江岸的纤路"
 hbe_story_northern_shudao.105.desc: "广元纤夫发现江岸一段旧路被圈成私地，领地管事要求他们绕行山坡。搬运一船粮食因此多耗了两天，船主却不愿增加纤钱。\n\n管事提出，只要商船逐次缴钱便可重新通行。府署可以确认共用纤路，也可向领主租地，或另修道路。纤夫已经把肩上的血痕展示给书记，他们要争取的只是过去一直能走的一段岸边。"

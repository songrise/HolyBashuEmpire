 hbe_short_shared.52.title: "不一样的药草"
 hbe_short_shared.52.desc: "外乡医者在本村开药铺，本地医者指责他未受行规。病家觉得新药价低，却担心所用药草与以前不同。两位医者都愿把治过的人列出来，家属希望比较病程，不愿只凭谁的名字更熟悉。\n\n一种旧乡药草确有用处，却不适合所有病人。老医者请求不得当作包治的名号，新医者同意改写药单。\n\n“一间新药铺”第2篇。"

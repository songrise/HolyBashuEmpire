 hbe_short_shared.11.title: "修过的屋顶"
 hbe_short_shared.11.desc: "一户迁来的人暂住旧院，院主起初只收少量柴钱，如今认为他们已有作坊，应当改收租。迁户修过屋顶，也替院主照料过老人，却没有把这些写成钱契。邻里愿作证，双方都担心争执传到行会。\n\n院主要求立即补租，迁户请求将修屋工钱抵去。府署可以核对劳作，也可维护原主的收租权，或为双方重立短契。修屋的木屑还没扫净，院主已经把原租约拿来。住户递上亲手补过的梁木清单，请他逐项看完。"

 hbe_migration.6.title: "仓门前的新旧户"
 hbe_migration.6.desc: "工牌与客作的办法已有裁处，留在本地的人家仍各靠田租或工钱维生，一季连雨又带来了缺粮。\n\n一场连雨使新垦田欠收，义仓门前出现了从未领过粮的家庭。掌仓人认为，他们没有缴足往年的仓粮，不能与旧户同样借贷。旧村的穷户也在排队，担心最后几袋种粮会被不熟悉的人领走。乡医提醒府署，饥饿与疾病不认户册上的入籍年份。商人愿垫一批粮，却要求新户以日后的工钱抵债。我们可以增购粮食，让新旧穷户共领；也可以按缴粮记录发放，把剩下的人交给商人或亲族照料。"

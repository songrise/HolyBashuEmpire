 hbe_short_shared.208.title: "义仓外的一匹骡子"
 hbe_short_shared.208.desc: "新来的赶马人把骡子抵给义仓换粮，约定秋后取回。掌仓人却在收粮前把骡子租给商队，回来时骡腿受伤。赶马人说那是全家沿山路谋生的牲畜，不能只按粮钱赔算。\n\n我们可以付照料费并追究借用，或保护义仓担保、给他延期还粮，也可要求商队承担治疗并重新写明抵押的使用权。仓粮与交易的信用都需要维护，牲畜的损失却已经落在一家人身上。"

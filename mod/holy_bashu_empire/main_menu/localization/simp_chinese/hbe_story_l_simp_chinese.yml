 hbe_story_central_hills.5.title: "仓册中的旱年"
 hbe_story_central_hills.5.desc: "几代人留下的仓册记着旱年与水灾，年轻书记发现修埂最多的村落往往少借一些赈粮。仓吏希望据此改变赈贷额度。\n\n贫村担心自己因无力修埂而失去救助。府署须决定把记录用于共同修治，还是用于区分各村责任。\n\n本篇是“坡田与水土”的第5章。前面的选择将决定最后保留哪一种长期章程。"

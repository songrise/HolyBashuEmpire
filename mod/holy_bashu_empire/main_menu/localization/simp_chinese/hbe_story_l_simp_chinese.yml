 hbe_short_central_hills.1.title: "先收哪一种粮"
 hbe_short_central_hills.1.desc: "义仓新收的谷子颗粒较小，掌仓人认为只宜低价收进。新垦户说这种谷子更耐旱，不能只凭模样定价。旧仓册记录了丰年产量，却没有把去年干旱时各田的损失写在一起。\n\n掌仓人希望维持旧价，贫户请求先按口粮收购。府署可以出钱分仓保存，也可以按旧规则快速入账，或拿出少量谷种做对照。掌仓人抓了一把细谷放在秤旁，种户却把同一块田旱年剩下的收成也带来了。单看颗粒，谁也说服不了谁。"

 hbe_story_chengdu_plain.2.title: "一只受伤的幼兽"
 hbe_story_chengdu_plain.2.desc: "巡山者带回一只脚掌受伤的幼兽。它只肯吃嫩竹，衙中马夫却不断往食盆里添谷物。附近竹农愿供应鲜竹，但要求免去一季驿役。\n\n医者希望留下幼兽观察。几名使者已请求把它送入府城，他们认为这种异兽足以显扬本府。\n\n本篇是“竹林中的白熊”的第2章。前面的选择将决定最后保留哪一种长期章程。"

 hbe_short_shared.23.title: "下一次招工"
 hbe_short_shared.23.desc: "雇工簿的记法已有裁处，渡口重新招人的日子将近，家属请求先把照料伤者的责任写明。\n\n伤者恢复后想回渡口做活，家属担心再次出事。船主愿多付一点工钱，条件是不再追究旧账。府署可以明定短工责任，也可只安排一次补偿。招工的牌又挂回渡口，几位家长先去看药舍有没有人在。船主想照旧议工钱，众人却要求先把受伤后的照料说清。"

 hbe_story_chengdu_plain.103.title: "汉州田边的白鹭"
 hbe_story_chengdu_plain.103.desc: "汉州渠吏准备清理田边杂草，几名农户却拦住了役夫。他们说白鹭每年在这里繁殖，平日还能捉走稻田里的虫子。领役者只看见一段不整齐的渠岸，担心上官责怪工期。\n\n农户愿自行清出水口，留下靠田的一片草地；府学医者也想辨认鸟类与虫害的关系。若按旧图一并铲除，渠道会更容易巡视，却会让乡民觉得官府只认图纸上的笔画。"

 hbe_story_chengdu_plain.113.title: "府医的两张药方"
 hbe_story_chengdu_plain.113.desc: "平原几村的发热病人越来越多，府医拿出新药方，乡医则继续使用祖传的煎剂。一个失去儿子的父亲来到堂下，要求他们说清楚两种药为何不同。\n\n府医愿记录每位病人的病程，却需要纸笔与助手；乡医担心这会被用来追究自己。我们可以资助共同查验，也可以指定一种办法，或先把钱用于病家最缺的清水和粮食。"

 hbe_short_chengdu_plain.3.title: "重新启用的染缸"
 hbe_short_chengdu_plain.3.desc: "试染记录已有保存办法，旧货的争执暂告一段落，买主又递来了下一批订单。\n\n新缸已经烧好，买主愿再试一批货。师傅提出由旧行会统一验色，年轻染户则希望凭试布争取订单。府署须决定最初为坏锦支付的代价，最后应换来一家作坊的信用，还是更广的技艺传习。买主把新布迎光抖开，又问柜后那些还没有行会印记的年轻人，谁能担保下一批也不褪色。"

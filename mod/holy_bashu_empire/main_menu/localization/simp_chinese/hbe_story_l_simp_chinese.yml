 hbe_short_southern_salt_wine.12.title: "两种装船办法"
 hbe_short_southern_salt_wine.12.desc: "第一批货损已有处理，下一趟装船以前，船户与窑工又拿几只空瓮做了比较。\n\n试装发现薄瓮需要更厚的垫草，省下的陶料未必能抵过装载成本。年轻窑工提出改做圆肩，船帮希望继续用熟悉的老瓮。新器具可以试行，旧办法也有稳定交货的价值。两种空瓮摆在码头，一只轻，一只耐碰。装船人要把它们放进同一段水路里比较，货主却只愿付一次足额船费。"

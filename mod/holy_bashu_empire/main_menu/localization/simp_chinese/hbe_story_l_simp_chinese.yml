 hbe_short_shared.71.title: "亏损算谁的"
 hbe_short_shared.71.desc: "两个不同乡籍的染户合开作坊，一家供染料，一家供劳作。头一季赚了钱，双方却对未写入契纸的试染损失有不同记忆。行会愿作保，要求这座新坊沿用本地配方与价目。\n\n府署可核对试染，认可劳作投入，也可维护最初的出资额，或让行会代为结账。不同计法会使其中一方失去继续合开的意愿。供料账与出工记放在染缸两边，一份有现钱，另一份只有手印。两家都承认试染赔过，却各认不同的份额。"

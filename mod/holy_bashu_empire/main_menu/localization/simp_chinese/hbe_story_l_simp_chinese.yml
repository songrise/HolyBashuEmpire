 hbe_story_northern_shudao.7.title: "历书换了主持者"
 hbe_story_northern_shudao.7.desc: "主持测候的学者去世，家族请求由长子继任。几处驿站却推举了熟悉观测的年轻书记，他们还未得到显赫家族的担保。\n\n若把测候职位世袭下去，早年的共同记录可能成为一家私藏；若公开择人，也要安置旧掌历者的家属。\n\n本篇是“山壁上的星历”的第7章。前面的选择将决定最后保留哪一种长期章程。"

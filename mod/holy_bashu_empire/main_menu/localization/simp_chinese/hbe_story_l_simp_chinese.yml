 hbe_story_southwestern_valleys.7.title: "旧桥约的继承者"
 hbe_story_southwestern_valleys.7.desc: "最初签订桥约的人已换过几代，年轻村民不愿继续按祖辈的丁额出工。关署认为旧约仍有效，商人则希望改成按货量缴钱。\n\n桥还需要人照料，旧有功劳却不足以分配眼下的负担。新章程必须明确谁能参与重新议约。\n\n本篇是“谷中桥约”的第7章。前面的选择将决定最后保留哪一种长期章程。"

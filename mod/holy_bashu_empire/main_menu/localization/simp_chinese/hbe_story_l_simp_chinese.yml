 hbe_story_southwestern_valleys.6.title: "相邻两谷的水势"
 hbe_story_southwestern_valleys.6.desc: "邻谷的桥在山洪中受损，请求借用我们的铁匠和绳匠。本谷村民担心新雨将至，反对把维修人手送走。\n\n若两谷能互相供养工匠，以后便可共同应对水患；若优先守住本谷，我们也须接受邻谷下次拒绝援手。\n\n本篇是“谷中桥约”的第6章。前面的选择将决定最后保留哪一种长期章程。"

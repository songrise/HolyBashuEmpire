 hbe_short_chengdu_plain.22.title: "查界人带回的石碑"
 hbe_short_chengdu_plain.22.desc: "彭州山脚两村共用一片竹山，旧界图只画了山脊，没有标出近年改道的溪流。修渠时一队人伐了对方认作自家的竹子，双方都带着残根来府署。竹农提醒我们，春笋还没出土，再封山一年会误了整个采办季。\n\n向导在旧竹丛中找到一块小碑，碑上写的是共养竹林的轮伐次序。碑并不能说明所有边界，却使只凭地契的一方陷入尴尬。府署可以恢复轮伐，也可以把旧碑只当作辅助见证。\n\n“竹山的两张界图”第2篇。"

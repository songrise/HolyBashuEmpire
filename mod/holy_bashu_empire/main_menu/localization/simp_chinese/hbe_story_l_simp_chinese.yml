 hbe_short_shared.111.title: "回乡算不算离籍"
 hbe_short_shared.111.desc: "一位迁来多年的长者准备回湖广祭扫，请求带走自己留下的地契副本。田主认为长期离乡会使契约失效，子女愿继续耕作。长者说回去并非舍弃新乡，但他不愿把祖先的坟地永远留在一封旧信里。\n\n府署可认可子女继续承契，也可按旧例暂停名额，或让家属明确担保。长者已经付过路钱，船期不能无限等待。\n\n“返回旧乡的长者”第1篇。"

 hbe_story_southern_salt_wine.5.title: "巨兽的足印"
 hbe_story_southern_salt_wine.5.desc: "井壁上的记录逐渐连成图，查访者也开始留意井外溪流与裸露的山石。\n\n山溪露出一块留有三趾凹痕的石板，乡民说它是巨龙踏过的痕迹。师生把凹痕与旧骨架比照，认为它们可能来自在水边行走的巨兽。搬走石板会改变溪边的道路，原处村寨要求留下副本。府城的陈列者则希望得到原件，借此补全多年积累的图志。"

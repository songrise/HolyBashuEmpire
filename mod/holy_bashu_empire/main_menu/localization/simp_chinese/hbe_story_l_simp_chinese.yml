 hbe_short_chengdu_plain.23.title: "下一季的采办"
 hbe_short_chengdu_plain.23.desc: "旧碑、现契与新图已经处理，到了春竹采办时，两村又把工钱和料价提上案头。\n\n两村愿提供春竹，但各自要求先结清查界时的工钱。渠署请求把竹料长期列入官办供应，竹农则希望按季议价。新的界约应当把采办的收益与照料竹山的责任一同写明。竹农带来新笋的估数，渠署却拿着去年签过的料价。查界人的工钱也还压在同一张账后，谁都不愿先供下一批。"

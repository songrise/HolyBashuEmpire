 hbe_story_eastern_river.113.desc: "川东船场收下几名外乡徒弟，本地船匠担心工价因此下降，要求每家船场限制名额。一个擅长补板的新徒却刚修好本地师傅放弃的一艘旧船。\n\n船主希望留下新手，行会坚持先照顾旧户。我们可以用资助传习增加活计，也可保留旧户名额，或按修船质量发牌。允许怎样的人接近船架，将影响江上能够维持多少只船。"

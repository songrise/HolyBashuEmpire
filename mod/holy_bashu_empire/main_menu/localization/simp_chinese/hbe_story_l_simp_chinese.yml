 hbe_short_shared.103.title: "愿不愿再留一年"
 hbe_short_shared.103.desc: "外乡船工替旧船帮修好了一艘险些报废的船，船主答应给他一份跑船名额。船帮却认为资格只传本帮子弟，提议给一笔工钱代替。船工不愿永远做岸边短工，家属已在渡口租了住处。\n\n船工在修船和往来船夫的讲述中熟悉了本地险滩，又来请求正式入帮。此前的工钱、试用与担保各有期限，都还没有给他一个长久的位置。船帮愿收，但要求他放弃旧乡的师傅称呼。府署可以承认两种传习，也可让入帮完全按旧规办理。\n\n“新来的船工”第3篇。"

 hbe_short_southern_salt_wine.23.title: "新井前的祭礼"
 hbe_short_southern_salt_wine.23.desc: "扩井时井工掘到几块旧墓砖。墓上没有清楚的姓氏，附近村民却不愿任由井主推平。掌盐官说新井能够补足今年盐额，师生希望趁开工前记下砖上图样。家属是否仍在本地，没人敢给出保证。\n\n新井已经开出卤水，村民要求在井前留下纪念旧墓的石记。盐商认为这会使过客不安，想把碑移到村口。我们可以保留在原处，也可以把图样收入府学，让井场保持通行。\n\n“井旁的旧墓”第3篇。"

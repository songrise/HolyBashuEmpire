 hbe_story_western_tea_horse.105.title: "茂州冬市的水井"
 hbe_story_western_tea_horse.105.desc: "茂州冬市的住户把水井围起，只许旧户取水。来赶市的牧人不得不去结冰的河边，已有牲畜在坡上跌伤。\n\n井主说，多来的客人使井水供应不足，愿开放取水，只须府署承担扩井。我们也可另建客井，或限制赶市的人数。水井旁的小争执，会影响牧人以后是继续来此，还是把马匹与羊毛带到别处。"

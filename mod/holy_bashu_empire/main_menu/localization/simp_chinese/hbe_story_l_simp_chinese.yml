 hbe_story_northern_shudao.4.desc: "平地书生建议在府城建星台，山口观测者却说高处能避开许多灯火和烟尘。供养官担心高台离驿路太远，材料难以运到。\n\n若让村民无偿搬石，旧有岗役就会再度加重。我们也可以缩小星台，把几处记录点连起来使用。\n\n本篇是“山壁上的星历”的第4章。前面的选择将决定最后保留哪一种长期章程。"

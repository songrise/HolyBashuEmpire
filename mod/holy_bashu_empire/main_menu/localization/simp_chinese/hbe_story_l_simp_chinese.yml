 hbe_story_southern_salt_wine.7.title: "代代相传的井谱"
 hbe_story_southern_salt_wine.7.desc: "年轻井工已会在挖到巨骨时留下周围石片，师生也能按旧编号找到许多井口。几家盐场请求以这些记录换取府署对新井的支持。\n\n府学担心图谱落入少数井主手中；掌盐官则认为实用勘查与收藏可以共用人手。图谱的保管方式将决定谁能继续利用这批积累。\n\n本篇是“井下巨骨”的第7章。前面的选择将决定最后保留哪一种长期章程。"

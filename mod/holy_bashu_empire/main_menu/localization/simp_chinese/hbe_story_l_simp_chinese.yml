 hbe_story_chengdu_plain.110.title: "眉州旧宅的诗稿"
 hbe_story_chengdu_plain.110.desc: "眉州书生在一处旧宅找到几页诗稿，宅主却想把它们卖给远来的收藏者。当地读书人请求府署买下原件，既为本地文脉留存，也让穷学生能有所借阅。\n\n宅主提醒我们，屋顶已经漏了多年，任何买书者都没有问过住户的日子。府署可以连同修屋出资，也可制作副本，或借收藏者的钱兴办一次公开讲读。保住纸页和照顾住户，应当一并考虑。"

 hbe_short_shared.31.title: "蒙舍的空位"
 hbe_short_shared.31.desc: "外来匠人请求让子女进府学旁的蒙舍，旧教读说名额已给本地家族。孩子能认工账上的数字，却不懂老师要求的旧文。几名商人愿资助纸墨，条件是蒙舍也教账法。\n\n府署可以增设教读，也可维护旧有名额，或把商人的纸墨变成共同小课。孩子的家属已经备好一份薄礼，却不知道老师是否愿收。蒙舍的长凳已经坐满，新来的孩子带着自家的纸片站在窗边。老师说收得下人，还得有人教、有人供纸。"

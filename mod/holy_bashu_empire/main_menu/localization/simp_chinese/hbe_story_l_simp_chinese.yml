 hbe_story_southwestern_valleys.108.desc: "雷波铁匠做出一种结实的新锁，寨主要求只给自己使用，担心普通住户也能把粮食锁起来，拒绝交出欠粮。铁匠的妹妹说，自家粮袋正需要防盗。\n\n府署可以准许普遍售锁，保护寨主的采办权，或将新锁先用于公共仓房。器物改变了谁能掌握自家财物，也使旧有借粮与追偿方式受到挑战。铁匠不希望一项改进只成为更容易扣粮的工具。"

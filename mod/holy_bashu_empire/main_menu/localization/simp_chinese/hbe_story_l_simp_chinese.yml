 hbe_short_western_tea_horse.3.title: "回来的空篓"
 hbe_short_western_tea_horse.3.desc: "一支商队在山口遇雨，外层茶砖受了潮，里面仍可冲饮。收茶人只肯按废茶收购，茶户请求拆开分验。赶马人说，如果每篓都拆，包装又得重做，雪来之前恐怕赶不到下一处市集。\n\n商队回市时带来用过的篾篓，茶户把遮盖与装载的得失逐一说给纸户听。纸户带来改过的垫纸试样，愿以较低价换取更广的订单；出资商号则要求，今后若采用新包装，须先给自己一段独供期限。府署可以公开做法，也可保护一段时间的独家供货。\n\n“被雨打湿的茶砖”第3篇。"

 hbe_short_shared.43.title: "来年的清渠簿"
 hbe_short_shared.43.desc: "席钱与修亭份额经过重议，下一年的清渠簿又要编写，迁户请求把调役从一次宽免变成可循的办法。\n\n来年的清渠簿又要重写，新户再次请求把礼期列入安排，领役人则要求保留紧急征工。此前的临时裁定，尚未成为往后每年都能援引的办法。府署可以承认礼期，也可只给逐案宽免，或建立付酬替役。领役人拿来的新簿又空着祭期一栏，乡民却已将各自的日子记在纸上。这次若仍只批一句宽免，明年还得再来请。"

 hbe_story_central_hills.202.title: "坡田统一田册"
 hbe_story_central_hills.202.desc: "统一田册列明田界、水口和修埂份额，府署终于能把过去分散的租额核在一起。旧村长请求保留几处按乡约供粮的例外，掌册官答应另附一页。国家得到更清楚的收入与控制，乡民也将面对更整齐的征收。\n\n几十年的笔记、工钱与争执没有凭空消失。它们被保存进新的章程，成为后来主持者必须继续履行的责任。至此，这段事业已经收束，获得的长期收益将随国家延续。"
 hbe_story_central_hills.8.c: "封存旧案，不另立长期章程。"
 hbe_story_central_hills.8.title: "留给后人的坡田"
 hbe_story_central_hills.8.desc: "旧年常被冲坏的坡地已能耕种，义仓也保存着连续数代的账簿。乡老请求把修治写成乡约，掌田官希望合并所有田册。\n\n前者让村落共同主持水土，后者让府署掌握租额与责任。我们最后选择的制度，将影响后人怎样守住这些田。\n\n历年的选择已经留下方向；最后的章程只能从已经得到支持的道路中确定。"

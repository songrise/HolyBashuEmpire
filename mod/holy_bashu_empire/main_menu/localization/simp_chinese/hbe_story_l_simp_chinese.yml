 hbe_short_northern_shudao.2.title: "细沙的来处"
 hbe_short_northern_shudao.2.desc: "失准的守更已经议处，旧沙漏留下继续修验，匠人从漏口筛出了粗细不同的砂粒。\n\n匠人发现沙粒大小不同，商人愿以另一批细沙替换，但要求独占驿站器具订单。年轻驿吏已经筛出合用的砂，请求公开筛法。府署可以把改进留给各站，也可以维持一家供货。两碗砂摆在漏口旁，一碗已经筛匀。商人指着随货来的供给纸，说修好这一只并不等于每座驿站都能照着自己做。"

 hbe_story_chengdu_plain.5.title: "竹花之年"
 hbe_story_chengdu_plain.5.desc: "山中大片竹林开花，白熊沿河谷来到村落，翻动了农家的粮窖。守林人说，旧竹将在结籽后枯死，新竹长成还要几年。\n\n村民要求驱走兽群，养兽人则请求开仓买竹。无论竹山归村寨经营还是供城苑采办，眼下的旧办法都已不能保证兽群得到食物。\n\n本篇是“竹林中的白熊”的第5章。前面的选择将决定最后保留哪一种长期章程。"

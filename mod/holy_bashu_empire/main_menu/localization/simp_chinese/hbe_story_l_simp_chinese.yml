 hbe_story_southwestern_valleys.3.title: "雨中断了一股绳"
 hbe_story_southwestern_valleys.3.desc: "桥工的凭证已经议定，雨季来得比预料更早，过桥人带来了主绳受损的消息。\n\n暴雨冲断一股主绳，过桥的商队暂时停在山寨。旧桥户愿出绳，要求先减免下一年的桥税。守军主张立即抽丁修复，匠人则希望先检查所有受力处。赶工或查验都会占用乡里的劳力，我们须承担相应的后果。"

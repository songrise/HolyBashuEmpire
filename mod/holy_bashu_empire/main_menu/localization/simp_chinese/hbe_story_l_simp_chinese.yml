 hbe_story_western_tea_horse.109.title: "河曲草场的界标"
 hbe_story_western_tea_horse.109.desc: "松潘河曲的两处牧户各在草场上立了界标，经过的马队不知道向谁付钱。双方都搬出旧年见证人，却说不清河道改移后原界究竟在哪里。\n\n府署可按现状重定草场，也可维持原约并给受损者补偿，或划出一段共用牧地。马队的牲畜已经饿了半日，若界争拖下去，他们只会记得这个原本能够歇脚的地方如今很难通行。"

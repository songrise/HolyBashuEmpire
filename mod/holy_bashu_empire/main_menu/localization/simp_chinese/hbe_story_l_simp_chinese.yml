 hbe_story_chengdu_plain.105.title: "彭州山门的药篓"
 hbe_story_chengdu_plain.105.desc: "彭州山民背着药篓来到城门，却被认作私取官山木料。老采药人掏出一张字迹模糊的旧凭证，守门者仍要扣下整篓草药。他的女儿正等着这笔钱购粮。\n\n医者请求把采药与伐木分开登记，山门官则担心人人以药材为借口进入禁山。我们可以重订采办凭证，维持严禁，也可以请山民与医者共同监督。无论采用哪种办法，这一家人的旧凭证都须有一个明确的处置。"

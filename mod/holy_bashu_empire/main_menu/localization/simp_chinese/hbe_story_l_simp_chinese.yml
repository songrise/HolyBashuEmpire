 hbe_short_northern_shudao.22.title: "缺页的旧账本"
 hbe_short_northern_shudao.22.desc: "一批书箱从蜀道运来，货主要求沿途免关，称它们要送给府学。驿吏打开其中一箱，发现既有经卷，也有商家的账本。赶马人只知道自己收过路费，不愿替货主证明每页纸的用途。\n\n一箱账本里有本府商号的旧借据，几名货主请求取回，不愿公开。府学师生想借它们学习记账，商人担心姓名被传开。府署可以留匿名副本，也可把账本退还原主。\n\n“山路上的书箱”第2篇。"

 hbe_story_eastern_river.2.title: "汛期与枯水"
 hbe_story_eastern_river.2.desc: "新的滩记已经用于行船，到了另一季水势，领航人发现同一处旧记还不足以应付。\n\n同一道[Concept('hbe_history_river', '江滩')|e]在夏汛和冬水时呈现不同形状，领航人各持一张地图，彼此指责对方误导船队。码头已挤满等待起航的粮船。若建立分季的水势谱，需要反复跑船；若先制定统一航路，就得暂时限制一些船只的装载。"

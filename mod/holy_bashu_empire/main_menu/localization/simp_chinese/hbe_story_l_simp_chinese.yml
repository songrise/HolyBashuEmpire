 hbe_short_southern_salt_wine.3.title: "不再挑卤的人"
 hbe_short_southern_salt_wine.3.desc: "铜管的改法已有安排，几次试装终于减少了渗漏，井灶却不再需要原来那么多挑卤人。\n\n铜管终于能连续出水，几个原来的挑卤工却被井主辞退。他们曾在停灶时帮忙修管，请求转学煎盐。府署可供养传习，也可只给一笔工钱，把雇用交给井主。原来的挑卤人还留着扁担，站在已经不用来回运卤的井道边。他们不是来拆新管，只想知道下月还能到哪里领工钱。"

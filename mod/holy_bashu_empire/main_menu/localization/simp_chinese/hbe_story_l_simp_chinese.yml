 hbe_short_shared.203.title: "坊里的两种尺寸"
 hbe_short_shared.203.desc: "外乡木匠按旧乡尺寸做了一批箱子，本地货主发现装不进约好的船舱。木匠愿改，却认为契纸上没有写明哪一种尺，货主坚持本地买卖当然照本地办法。学徒拿着两把尺站在仓前，不知道该把哪一种刻度磨去。\n\n府署可以共同验尺寸并补改作的钱，也可以维护本地行规，或让新匠人公开两种尺的换算。解决这批箱子只是眼前的事，以后谁能读懂契纸才会决定他们能否继续接单。"

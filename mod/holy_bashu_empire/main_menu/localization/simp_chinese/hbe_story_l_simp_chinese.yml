 hbe_short_shared.81.title: "先拆哪一段栏"
 hbe_short_shared.81.desc: "迁户在山脚养起牲畜，原来的山民担心牧路被围。新户不认识旧界标，说自己照官给的荒地册开围栏。山民愿帮他们过冬，却希望以后仍能沿这条坡路进山。\n\n府署可以补地拆栏，也可维护荒地册，或先留公共牧路。两个家庭的牲畜已经挤在同一处溪边，界线需要比纸上更清楚。围栏尽头恰好抵到旧牧路，牲畜饮水的地方又只有一处。双方各拿着一张不同的界图，谁都不肯先撤自己的木桩。"

 hbe_short_shared.61.title: "这一袋种子"
 hbe_short_shared.61.desc: "迁户用从旧乡带来的种子播下第一季田，邻村愿借种，却要求新户先参加义仓担保。种子不多，新户担心借出去后自家无粮，旧户又怕新来的田迟早要分走灌水。\n\n府署可以供粮让新户留种，也可按旧仓约办，或设小块试田供两村观察。眼前的互借需要有人分担歉收风险。新户带着空粮袋等种，旧户先指着分水簿。若连下种前的口粮都留不够，再好的谷种也可能先被拿去充饥。"

 hbe_story_southern_salt_wine.112.title: "盐引背面的字"
 hbe_story_southern_salt_wine.112.desc: "叙州账房在旧盐引背面发现几行细字，写着转押时加收的利息。持券的寡妇说，丈夫生前只告诉她这是能够换回盐货的凭证。\n\n债主认为她既继承了凭证，也应当承担全部条款。府署可以核查这些细字何时添上，也可要求担保家族偿付，或承认券据并给她延期。我们需要保护交割的信用，同时让持券者知道自己究竟允诺过什么。"

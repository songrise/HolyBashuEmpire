 hbe_short_western_tea_horse.22.title: "第一次关门的夜"
 hbe_short_western_tea_horse.22.desc: "灶火的使用次序已经议定，守屋人开始逐日记柴，第一回缺钱的夜客也到了门前。\n\n守屋人因为客人欠柴钱而关门，一名驿卒请求无钱者也能先借火。村寨认为善意不能代替冬天的草料。府署可以建立小额公账，也可以要求商队预付担保。守屋人把最后几根干柴放到桌边，来客却摸不出现钱。收柴的钱与救急的一把火，今夜必须有个说得明白的办法。"

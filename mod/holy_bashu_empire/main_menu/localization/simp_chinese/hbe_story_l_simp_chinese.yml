 hbe_short_shared.101.title: "一次修船算什么"
 hbe_short_shared.101.desc: "外乡船工替旧船帮修好了一艘险些报废的船，船主答应给他一份跑船名额。船帮却认为资格只传本帮子弟，提议给一笔工钱代替。船工不愿永远做岸边短工，家属已在渡口租了住处。\n\n府署可按技艺认可名额，也可维护旧帮传承，或准短期随船试用。行会担心新名额会压低船费，船主则不想失去好匠人。修好的船还停在岸边，船工拿着船主答应名额的凭纸。船帮愿给的钱已经数好，却没有替他留一张随船的位子。"

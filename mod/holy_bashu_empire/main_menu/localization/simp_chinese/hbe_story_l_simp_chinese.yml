 hbe_story_central_hills.3.title: "一座小坝的归属"
 hbe_story_central_hills.3.desc: "便道与护埂的争执暂告一段落，村民又送来一张溪沟小坝的图，图下还压着磨坊主的诉状。\n\n村民在溪沟建起小坝，几处坡田因此能留住灌溉水。下游的磨坊主指称溪水变少，要求拆坝。乡老愿分季放水，磨坊主却只接受明确的契纸。水土工程逐渐改变了地方的旧有收益，我们不能只看坝上增出的粮食。"

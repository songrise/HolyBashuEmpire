 hbe_story_eastern_river.1.title: "老船夫的滩记"
 hbe_story_eastern_river.1.desc: "夔峡船夫在竹片上刻出暗礁位置，新来的船主却只认府署旧图。去年损失的货船恰好沉在老图没有标出的浅滩。\n\n船夫愿带人复测，但要求把自己的姓名与工钱写在谱首。守军则认为江道记录不宜让过路商人随意抄走。\n\n本篇是“峡江引水谱”的第1章。前面的选择将决定最后保留哪一种长期章程。"

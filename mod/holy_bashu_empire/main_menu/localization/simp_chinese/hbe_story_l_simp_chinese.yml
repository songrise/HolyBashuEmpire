 hbe_story_southwestern_valleys.5.desc: "铁索的试用与采办已有安排，过桥的牲畜货物多起来，桥边新生意又引出了争执。\n\n新桥让牲畜和商货更容易通过，谷中不同村寨也开始争夺集市位置。旧桥户指责新来商人没有参加修桥，却分走了生意。桥约必须处理这些新增收益。我们可以重定共用集市，也可以按出资分配桥边摊位。"

 hbe_migration.10.c: "到此封存旧案，不再另立永久章程。"
 hbe_migration.10.title: "户册里的下一代"
 hbe_migration.10.desc: "会馆与修桥见证已经议处，几位长者带着历年的准驳与账册，请求给后来者留下能够遵循的章程。\n\n最早来问田地的几位长者已经去世，他们的子女把旧乡信件、入蜀路凭与本府契纸一并交来。书记从中翻出准入、限留、担保与过境的不同批语，发现它们仍是遇事逐案援引，没有一份办法能说清后来的家庭应当怎样申请。旧户请求保留祖辈出钱修桥养仓的份额，新户则想让多年居住与出资得到持续承认。前几次府议留下的支持各不相同，如今须据此为下一代定下一条能够遵循的路。"

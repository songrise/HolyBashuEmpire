 hbe_short_southwestern_valleys.23.title: "留给后来者的席位"
 hbe_short_southwestern_valleys.23.desc: "诸谷议事时，一位会说两种话的年轻人被安排坐在门外，只能替长者转述。去年修桥的许多钱契出自他的手，几个村寨希望他能直接说明记录。主持者认为座次关乎旧有尊卑，不宜因会写字而更改。\n\n下一次议事前，主持者问译写席是否可以由自己的子弟继承。几个村寨认为应按记录能力推举，青年愿意教会更多人，也担心自己得到解释记录的机会后，后来者仍会被挡在门外。府署可以定考核，也可以承认旧席的传承。\n\n“议事时的座次”第3篇。"

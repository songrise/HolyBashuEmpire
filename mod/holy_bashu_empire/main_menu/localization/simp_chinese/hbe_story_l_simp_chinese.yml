 hbe_short_shared.214.d: "暂缓裁定，不再由府库出资。"
 hbe_short_shared.214.title: "新老住户一起失火"
 hbe_short_shared.214.desc: "一场火烧过旧村与新户草棚，修坊的人先给有族人担保者发木料。新户没有本地宗祠，只能在空地等剩下的料。商人愿贷款重建，条件是住户日后以低价供货。\n\n府署可以按损失配料，让新旧穷户都能复屋，也可以维护族担保、给新户短期工钱，或公开重建借约，限制追加的利息。重建的次序，将使失去同样房屋的人看到不同的待遇。"

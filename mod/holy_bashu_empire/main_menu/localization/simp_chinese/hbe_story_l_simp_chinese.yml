 hbe_short_shared.201.title: "入籍钱的去处"
 hbe_short_shared.201.desc: "几户外来人家为入籍交过钱，来到府署却发现自己的名字仍在临住册里。书吏说钱是查验来路的费用，转入正册还需另请担保。旧户认为所有人都照此办理，新户却拿出旧收据，要求说明当初承诺的究竟是什么。\n\n掌库官希望维持这笔收入，以免以后查验无钱可用；乡老愿替长期住户见证，但不愿为刚下船的人负责。我们可以退还无据的费用，重订入籍办法，也可以保留旧担保而给穷户宽限。"

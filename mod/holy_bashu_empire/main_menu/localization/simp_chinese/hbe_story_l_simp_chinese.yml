 hbe_story_western_tea_horse.2.title: "药草与马价"
 hbe_story_western_tea_horse.2.desc: "牧人用山草洗伤口，几匹驮马恢复了行走。药商却抬高同类草药的价格，声称只有自己的采办能保证药性。\n\n山民愿带人寻找草场，军府则要求收走整批药材。若不处理采办，新的技法也会只让少数马商受益。\n\n本篇是“山路上的医马人”的第2章。前面的选择将决定最后保留哪一种长期章程。"

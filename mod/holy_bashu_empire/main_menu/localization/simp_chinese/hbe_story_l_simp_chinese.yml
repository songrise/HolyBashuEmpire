 hbe_short_southern_salt_wine.23.title: "新井前的祭礼"
 hbe_short_southern_salt_wine.23.desc: "砖上图样与认墓见证各有了保存的去处，井口重新忙起来，旧墓该怎样被记住又引起争论。\n\n新井已经开出卤水，村民要求在井前留下纪念旧墓的石记。盐商认为这会使过客不安，想把碑移到村口。我们可以保留在原处，也可以把图样收入府学，让井场保持通行。祭礼要走的路恰好经过运卤的空地，井户怕误了出货。村民愿另定时辰，却不肯让碑上连井口旧址都不再提起。"

 hbe_story_western_tea_horse.8.a: "茶路医马学舍。"
 hbe_story_western_tea_horse.201.a: "把章程留给后来者。"
 hbe_story_western_tea_horse.201.title: "茶路医马学舍"
 hbe_story_western_tea_horse.201.desc: "医马人的学生沿茶路分到各站，药方、繁育簿和草场记录不再只由一座官苑保管。牧户能够送病马来舍中，也能按用途出售驮马。学舍不能替每一支商队免去山路的风险，却给沿途的人留下了持续照料牲畜的办法。\n\n几十年的笔记、工钱与争执没有凭空消失。它们被保存进新的章程，成为后来主持者必须继续履行的责任。至此，这段事业已经收束，获得的长期收益将随国家延续。"
 STATIC_MODIFIER_NAME_hbe_story_ending_western_tea_horse_2: "良马官苑"

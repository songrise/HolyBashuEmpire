 hbe_story_eastern_river.4.desc: "引水牌的真伪有了查验办法，领航者却仍要面对峡中夜色与急涨的江水。\n\n守望者试用火光和鼓声向下游报汛，邻岸村民却抱怨夜间信号使他们无法休息。船主愿为灯油出钱，但不肯承担全部岗役。沿江村寨希望把报汛也用于防盗。若让守军独办，村寨便少了一项能自行利用的设施。"

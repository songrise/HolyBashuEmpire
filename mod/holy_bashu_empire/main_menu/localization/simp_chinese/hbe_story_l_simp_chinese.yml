 hbe_short_western_tea_horse.21.title: "谁能先用灶火"
 hbe_short_western_tea_horse.21.desc: "牧人愿在山口修一间歇脚屋，给冬行商队留灶和草料。城中客栈认为这会分走自己的住客，守军请求把屋子列为官用驿舍。出木料的村寨只希望过路者付足柴草钱，不愿承担新的固定岗役。\n\n府署可以资助共用小屋，也可以把它交给守军，或准村寨收取明定的柴草费。不同主持者会改变商队与乡民使用它的次序。灶前只容得下几个人，先到的军差已经把柴堆拢到一边。村中守屋人等着一句话，才敢招呼门外的夜客。"

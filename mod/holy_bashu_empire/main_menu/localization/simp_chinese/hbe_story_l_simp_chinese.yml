 hbe_short_chengdu_plain.23.title: "下一季的采办"
 hbe_short_chengdu_plain.23.desc: "彭州山脚两村共用一片竹山，旧界图只画了山脊，没有标出近年改道的溪流。修渠时一队人伐了对方认作自家的竹子，双方都带着残根来府署。竹农提醒我们，春笋还没出土，再封山一年会误了整个采办季。\n\n两村愿提供春竹，但各自要求先结清查界时的工钱。渠署请求把竹料长期列入官办供应，竹农则希望按季议价。新的界约应当把采办的收益与照料竹山的责任一同写明。\n\n“竹山的两张界图”第3篇。"

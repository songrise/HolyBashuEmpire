 hbe_short_northern_shudao.21.title: "经卷还是商货"
 hbe_short_northern_shudao.21.desc: "一批书箱从[Concept('hbe_history_shudao', '蜀道')|e]运来，货主要求沿途免关，称它们要送给府学。驿吏打开其中一箱，发现既有经卷，也有商家的账本。赶马人只知道自己收过路费，不愿替货主证明每页纸的用途。\n\n府学愿领走经卷，商人则坚持整批都应免关。我们可以逐箱登记，也可以先照货主担保放行，或只免去确实供学的部分。赶马人把各箱捆绳一一解开，货主却催他别弄乱书页。府学领书的人只肯认自己订过的那几部，经卷之外的账册还没有去处。"

 hbe_story_southern_salt_wine.110.title: "嘉州桥头的施粥"
 hbe_story_southern_salt_wine.110.desc: "嘉州桥头的寺院连续施粥，附近酒商却抱怨雇来的搬运夫不再愿意接受低饭钱。主持说，人在饥饿时允下的工钱，不能算作公允。\n\n粮商愿捐米，条件是在粥棚前挂出自家名号。府署可以共同供养粥棚，也可劝寺院缩减施粥，或让商人负责采办。一个带着两个孩子的寡妇已来领过三次粥，她不希望自己的去处取决于商人争夺名声。"

 hbe_short_shared.21.title: "先救哪一本账"
 hbe_short_shared.21.desc: "迁户的孩子与本地孩子一同在渡口做短工，其中一个摔伤后，两家都说自己付过护工的钱。船主认为孩子只是临时帮忙，不算雇工；医者请求先把伤者送进药舍，再查谁为这一天担保。\n\n府署可以先付医钱，也可让船主按约赔付，或请两家共同作保。伤者躺在岸边，账本却还在船舱里。两家抱来染血的旧衣，船主拿来的账却先列着误工。药舍的人催问医钱，谁都不能等账算清才照料孩子。"

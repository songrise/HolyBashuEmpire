 hbe_short_southwestern_valleys.13.title: "锁住的欠粮"
 hbe_short_southwestern_valleys.13.desc: "寨中铁匠做出一扇结实的铁门，寨主请求只准供给自己的仓房。几个普通住户也想买锁护粮，铁匠担心拒绝寨主便失去炭料。赶市的商人带来外地铁价，说这门活路不该只靠一家供养。\n\n一名穷户因欠租被锁在仓外，自己的种粮也拿不出来。铁匠请求锁只保护财货，不成为无据扣粮的办法。府署可以按契查欠，也可以认可寨主的原有收租权。\n\n“山寨门前的铁门”第3篇。"

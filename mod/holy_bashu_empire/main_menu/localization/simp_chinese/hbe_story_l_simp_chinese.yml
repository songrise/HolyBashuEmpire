 hbe_story_southern_salt_wine.103.title: "富顺井绳的赔钱"
 hbe_story_southern_salt_wine.103.desc: "富顺井绳突然断裂，一名井工落入井中。井主认为是工人换班时操作不当，工人的弟弟却拿出早已磨损的绳头，称大家曾多次要求更换。\n\n盐商等着提货，停井查验会打乱几笔交割；若立即复工，家属可能再也得不到答复。府署需要决定赔钱与查验怎样进行，也须向其他井户说明，同样的事故今后该由谁承担。"

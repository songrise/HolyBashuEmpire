 hbe_story_eastern_river.111.desc: "忠州果农把邻地带来的枝条接在旧树上，第一季结出较好的果子。旧园主却要求将这种枝条只用于自家的贡果，称外来技法应当由有地位的人主持。\n\n果农愿让乡民学习接枝，也怕失去依靠园主维持的地租宽限。府署可以资助公开传习，设立试验园，或承认贡果园的优先权。枝条很小，围绕它的安排却会决定技艺今后走进多少片果园。"

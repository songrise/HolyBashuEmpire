 hbe_short_shared.32.title: "第一份试卷"
 hbe_short_shared.32.desc: "教读与名额已有初步安排，孩子们交出第一批习作，老师对礼文和账法的评判却并不相同。\n\n孩子在算账题上答得好，旧教读认为不能因此省去礼文。商人请求按用途分课，贵族则希望维持统一选拔。一张卷子礼文抄得齐整，另一张能算清一船货的账。两位老师把卷子交换过一遍，谁也不愿按另一套标准落名次。"

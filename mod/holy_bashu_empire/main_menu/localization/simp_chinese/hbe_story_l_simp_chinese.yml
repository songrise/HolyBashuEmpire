 hbe_short_shared.12.title: "院中多了一台织机"
 hbe_short_shared.12.desc: "屋顶与租钱的争执暂告一段落，院中添了一台织机，住屋的用途又成了新的问题。\n\n迁户添了织机，院主想收部分织货作为房钱。邻居认为作坊噪声需要另议，工匠担心新租让自己永远无法搬走。织机占去半间屋，门外却还晾着一家人的衣被。院主想从货利里分租，织户只肯把房钱写成能够预先算清的数。"

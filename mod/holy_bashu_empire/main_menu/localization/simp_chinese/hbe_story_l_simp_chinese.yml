 hbe_story_northern_shudao.103.title: "巴州雨夜的灯油"
 hbe_story_northern_shudao.103.desc: "巴州驿夫在雨夜送信，灯油却在半路耗尽。回到驿站后，他被指责误了行期，油簿上又写着足额支领。驿夫带来空油瓶，要求当面核对。\n\n掌站者称油价上涨，只能按旧额凑数；商人愿供油，但要求免去下一次关费。府署可补足采购，也可追究掌站者，或以商路通行交换灯油。驿夫的工钱，不能继续代替没人愿意公开的差额。"

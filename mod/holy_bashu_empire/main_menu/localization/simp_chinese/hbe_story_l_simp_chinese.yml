 hbe_short_western_tea_horse.1.title: "先验还是先走"
 hbe_short_western_tea_horse.1.desc: "一支商队在山口遇雨，外层茶砖受了潮，里面仍可冲饮。收茶人只肯按废茶收购，茶户请求拆开分验。赶马人说，如果每篓都拆，包装又得重做，雪来之前恐怕赶不到下一处市集。\n\n府署可以雇人拆验，给商队补误期，也可以按旧货约迅速结价。茶户愿让出一部分价钱，条件是府署承认受潮程度并不相同。\n\n“被雨打湿的茶砖”第1篇。"

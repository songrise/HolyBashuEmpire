 hbe_story_western_tea_horse.2.title: "药草与马价"
 hbe_story_western_tea_horse.2.desc: "修蹄与洗伤的办法传开，茶队重新上路，药铺柜上的几味寻常山草却涨了价。\n\n牧人用山草洗伤口，几匹驮马恢复了行走。药商却抬高同类草药的价格，声称只有自己的采办能保证药性。山民愿带人寻找草场，军府则要求收走整批药材。若不处理采办，新的技法也会只让少数马商受益。"

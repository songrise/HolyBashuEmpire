 hbe_story_eastern_river.104.c: "交守军办渡，统一票价。"
 hbe_story_eastern_river.104.title: "涪州渡口的婚礼"
 hbe_story_eastern_river.104.desc: "涪州一对新人过渡时被要求分别按两岸的规矩缴钱，新娘的亲族因此在船上争吵。船夫说，自己也得向两处守岸人交费，不能独自免去。\n\n几家商户愿为共同渡约出钱，只求今后不再重复收费。两岸家族却担心旧有礼仪因此失去效力。府署可从这桩婚事开始重订渡规，也可只给新人免钱，或由守军统一经营渡船。"

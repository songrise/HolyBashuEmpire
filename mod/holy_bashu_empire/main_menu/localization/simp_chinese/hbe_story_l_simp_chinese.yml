 hbe_short_shared.3.title: "新菜留在旧市"
 hbe_short_shared.3.desc: "取水的争执已有处理，新菜逐渐有了买主，短期安排却将到期，摊主想留下长久的位置。\n\n新摊户希望留下，旧行会提出统一价目和名字。府署可以承认不同风味，也可纳入行会，或以卫生与质量定摊牌。几家摊主各端来一碗不同口味的饭，行会递来的价目却只留了一种做法。常买新菜的客人也围着等答复。"

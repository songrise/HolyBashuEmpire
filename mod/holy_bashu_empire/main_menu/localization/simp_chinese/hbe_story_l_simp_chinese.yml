 hbe_short_eastern_river.12.title: "归拢的旧工具"
 hbe_short_eastern_river.12.desc: "河水改道后，一座旧船坞落在浅滩边，船匠仍靠修小船生活。大船商提出搬坞到深水处，要求府署替他取得岸地。船匠愿搬，却担心搬去以后只能给同一家商号做活。旧址旁的小渔户也需要留下修船的地方。\n\n船坞重新清点接活所需的器具，木匠发现旧工具尚能修小船，却难以支撑商号提出的大船修造。岸地的安排尚须照旧契执行，添置工具又成了新的争执。商号愿出工具钱，要求匠人签下较长的供货约。我们可供公共工具，也可让匠人与商号自行担保。\n\n“岸边的旧船坞”第2篇。"

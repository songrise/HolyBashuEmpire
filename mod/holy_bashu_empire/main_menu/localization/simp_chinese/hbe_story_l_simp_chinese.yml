 hbe_story_eastern_river.201.title: "百滩共用船约"
 hbe_story_eastern_river.201.desc: "船夫们把水势谱摊在码头，按江段重新推举领航人。村寨的夜号和船帮的复测记录都能进入下一版，不必再等某一家人的旧牌。船约给过滩者留下了共同使用的办法，也把维护的责任留给真正走这条江的人。\n\n新领航人照谱认过自己的江段，码头把复测钱写进下一季公账。水势仍会改变，公谱可以由走船的人继续改写，也须由他们共同承担误记与失修。"
 STATIC_MODIFIER_NAME_hbe_story_ending_eastern_river_2: "川江护航总署"
 STATIC_MODIFIER_DESC_hbe_story_ending_eastern_river_2: "长期章程。具体影响见下列数值。"

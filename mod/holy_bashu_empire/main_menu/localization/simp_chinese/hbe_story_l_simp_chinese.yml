 hbe_short_shared.2.title: "谁能用这口井"
 hbe_short_shared.2.desc: "新灶的摆摊资格已有裁处，备食时的取水却不在原先议定的份额里，摊主又找到了府署。\n\n新摊户被挡在共井之外，只能另雇人取水。旧户担心客人多了会不够用，乡医提醒不洁的水会影响整个集市。井边挑水的人排到摊棚，旧铺说自己出过修井钱，新摊则带着已经交过的修亭收据。"

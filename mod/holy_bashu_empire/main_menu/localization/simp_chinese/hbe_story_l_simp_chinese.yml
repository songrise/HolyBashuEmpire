 hbe_short_shared.72.title: "想带走的配方"
 hbe_short_shared.72.desc: "试染亏损已有一次分账，合坊仍有货待做，一名师傅却来问自己的配方能否带走。\n\n一名师傅准备另开小坊，要求带走自己试出的配方。出料的伙伴认为配方也受过自己的损失，应有使用份额。师傅的配方纸还沾着染料，伙伴拿来的却是当年赔过的料钱。分开以后谁还能照方接单，旧契并没有写过。"

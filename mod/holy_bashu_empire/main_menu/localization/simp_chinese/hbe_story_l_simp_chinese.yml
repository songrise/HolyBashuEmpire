 hbe_short_shared.52.title: "不一样的药草"
 hbe_short_shared.52.desc: "药铺的开门资格已有裁处，两位医者开始比较药样，病家的记录也送到了案前。\n\n一种旧乡药草确有用处，却不适合所有病人。老医者请求不得当作包治的名号，新医者同意改写药单。两位医者各取出一种同名山草，叶形已有分别。病家请他们先说哪些病能用，再谈铺上的名声。"

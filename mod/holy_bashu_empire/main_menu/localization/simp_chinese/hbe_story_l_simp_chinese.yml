 hbe_short_northern_shudao.12.title: "旧签押下面的日期"
 hbe_short_northern_shudao.12.desc: "前次府议处理了缺役与替岗的急务，争议名册仍留待核对。如今书记找到了同一张旧签押。\n\n两位书记把旧签押迎着窗光展开，发现回乡的日期没有涂改，抄进军册时却成了起役的日期。返乡士兵又交来当日退还腰牌的凭记，那几日缺役终于有了可查的来处。村民请求退回错扣的粮钱，军官却不愿当众承认旧册失准，怕下一次点名也遭质疑。书记提议在后堂重抄一册，士兵则希望新册上能留下亲手签认的地方，免得同一张旧押又被抄错。"

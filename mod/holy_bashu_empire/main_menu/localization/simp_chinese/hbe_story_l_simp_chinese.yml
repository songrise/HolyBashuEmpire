 hbe_short_western_tea_horse.22.title: "第一次关门的夜"
 hbe_short_western_tea_horse.22.desc: "牧人愿在山口修一间歇脚屋，给冬行商队留灶和草料。城中客栈认为这会分走自己的住客，守军请求把屋子列为官用驿舍。出木料的村寨只希望过路者付足柴草钱，不愿承担新的固定岗役。\n\n守屋人因为客人欠柴钱而关门，一名驿卒请求无钱者也能先借火。村寨认为善意不能代替冬天的草料。府署可以建立小额公账，也可以要求商队预付担保。\n\n“雪路上的歇脚屋”第2篇。"

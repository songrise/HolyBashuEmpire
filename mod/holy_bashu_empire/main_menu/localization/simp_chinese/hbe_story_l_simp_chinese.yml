 hbe_story_southern_salt_wine.109.title: "荣县小井的官价"
 hbe_story_southern_salt_wine.109.desc: "荣县小井的出卤不如大井稳定，灶户请求按小批盐货交税，掌盐者却仍按满灶估量。一个井户为了交足官盐，买回了原本由自己售出的盐包。\n\n若按实际产量核税，府库将少收一笔钱；若维持定额，一些小井可能彻底停煎。大盐商愿把这些井包下来，只要求长期的交割权。我们如何处理小井，会改变盐场今后由多少家人经营。"

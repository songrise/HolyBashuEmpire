 hbe_story_chengdu_plain_ready_2_tt: "历次选择已经支持“锦城瑞兽馆”的道路。"
 hbe_story_chengdu_plain_stop_tt: "本国停止后续投入；这条事件链到此结束，不获得永久结局章程。"

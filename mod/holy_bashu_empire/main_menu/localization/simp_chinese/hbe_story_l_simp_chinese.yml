 hbe_story_central_hills.104.desc: "遂宁义仓换了看守，旧钥匙却仍留在乡老家中。新看守要求收回，乡老说村中出过大半粮食，不能任由府署独自开仓。\n\n一名借粮的农户在两家之间往返，始终领不到当季种粮。府署可以设置共同开启的办法，也可集中保管钥匙，或将仓粮按出资分账。仓中粮食尚好，难处在于谁能批准它被用于急需。"

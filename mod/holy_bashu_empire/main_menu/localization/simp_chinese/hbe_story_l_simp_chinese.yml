 hbe_story_central_hills.107.desc: "射洪书生请求酒户资助一部地方志，酒户愿出钱，却要求写入自家酒窖的优点。编书者的朋友说，这种赞语会使整部志书失去信用。\n\n府学没有足够纸墨，拒绝出资便可能使刊印搁置。我们可以承担部分费用，限定出资者的署名，也可准双方自己达成安排。酒户真正想得到的是体面，而书生需要留下可以被后人查验的记载。"

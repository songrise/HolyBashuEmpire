 hbe_short_southern_salt_wine.22.title: "砖上并非家谱"
 hbe_short_southern_salt_wine.22.desc: "旧墓的处置已有裁定，师生留下的砖样与几家的认墓说法，如今终于能够放在一起比较。\n\n师生抄出的图样记着采盐与祭祀，和几家声称的墓主不完全相合。乡老请求不要当众拆穿旧说，井主愿出钱修一处公墓。不同见证可以并存，也可以由府署统一裁断。几家认墓人都等着听裁处，师生却只能说明砖上画了什么。把图样记下来，与替墓主人补出一个姓氏，是两件不同的事。"

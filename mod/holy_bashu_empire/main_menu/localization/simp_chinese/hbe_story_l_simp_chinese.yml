 hbe_story_eastern_river.202.title: "川江护航总署"
 hbe_story_eastern_river.202.desc: "护航船队接过统一的通行券，江岸各站不再各收一遍。军府能够把领航、运输与守备一起安排，商船也须接受船队的行期和费用。多年争论留下的水势谱，最后成为总署调度江道的凭据。\n\n几十年的笔记、工钱与争执没有凭空消失。它们被保存进新的章程，成为后来主持者必须继续履行的责任。至此，这段事业已经收束，获得的长期收益将随国家延续。"
 hbe_story_eastern_river.8.c: "封存旧案，不另立长期章程。"
 hbe_story_eastern_river.8.title: "百滩共用的船约"
 hbe_story_eastern_river.8.desc: "最初的滩记已经抄成数代水势谱，许多引水人的姓名也只留在谱后。沿江各府愿把这些经验定成长期通行规则。\n\n我们可以让谱册随船夫流传，也可以把它与护航船队的权利结合。两条道路都能使江运受益，却会把江道交给不同的人主持。\n\n历年的选择已经留下方向；最后的章程只能从已经得到支持的道路中确定。"

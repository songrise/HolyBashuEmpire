 hbe_story_southwestern_valleys.113.title: "诸谷相逢的婚宴"
 hbe_story_southwestern_valleys.113.desc: "两处山谷的家人相会办婚宴，席上却为哪一种称谓先被念出而起争执。新郎的姨母提醒大家，早年的桥约本就是靠双方愿意听懂对方的话才订下来。\n\n府署可安排共同见证，按旧有等级排定礼数，也可让新人自行决定。婚宴的饭钱不多，来往的亲族却会把这一次安排记得很久。我们可以保全熟悉的体面，也可以为今后更多跨谷的家庭留下方便。"

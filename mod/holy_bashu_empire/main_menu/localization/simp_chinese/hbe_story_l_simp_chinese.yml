 hbe_story_eastern_river.201.title: "百滩共用船约"
 hbe_story_eastern_river.201.desc: "船夫们把水势谱摊在码头，按江段重新推举领航人。村寨的夜号和船帮的复测记录都能进入下一版，不必再等某一家人的旧牌。船约给过滩者留下了共同使用的办法，也把维护的责任留给真正走这条江的人。\n\n几十年的笔记、工钱与争执没有凭空消失。它们被保存进新的章程，成为后来主持者必须继续履行的责任。至此，这段事业已经收束，获得的长期收益将随国家延续。"

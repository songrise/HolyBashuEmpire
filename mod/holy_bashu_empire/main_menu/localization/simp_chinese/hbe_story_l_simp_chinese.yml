 hbe_short_northern_shudao.3.title: "更册上的新记号"
 hbe_short_northern_shudao.3.desc: "商人带来一只沙漏，说它比阴天的日影可靠。驿吏用它记守更，半夜却发现潮气让细沙结住。老驿卒仍按自己记住的路程报刻，年轻人要求把器具和经验一起查验，免得以后只凭失准的漏壶扣工钱。\n\n守更人用同一时刻比较几种漏壶，终于能把停漏记在更册边。关军不想让这些批注流出，担心过客据此猜到城门值夜。公开经验与维持守备，需要新的分界。\n\n“驿站里的沙漏”第3篇。"

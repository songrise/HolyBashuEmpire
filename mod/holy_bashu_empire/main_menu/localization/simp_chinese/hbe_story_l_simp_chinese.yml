 hbe_story_central_hills.103.title: "仁寿地契上的红线"
 hbe_story_central_hills.103.desc: "仁寿书记在新地契上画了一条笔直红线，却把旧村路也圈进了田主地界。农户每天绕行，田主则拿着新契声称自己没有违背官府。\n\n旧路没有完整图纸，只有几位老人记得过去怎样走。府署可以听取乡老并改契，也可另修村路，或以减租换取田主开放通行。书记认为这只是地图上的小误差，走路的人却得每天为它付出时间。"

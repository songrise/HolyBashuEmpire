 hbe_story_central_hills.113.title: "乡兵教头的田租"
 hbe_story_central_hills.113.desc: "川中乡兵教头在操练期间欠下田租，田主扣走了他的农具。乡兵说，教头修过村墙，府署也曾夸赞，却从未给足误农的补偿。\n\n军府希望他继续训练，田主则要求保障地租。我们可以出钱补租，让村民共同供养，或减少操练次数。保留一位熟悉乡里的人，比发一份新的名册更难，也需要在平日说明军务占用了谁的劳动。"

 hbe_migration.7.title: "同一条路上的两种话"
 hbe_migration.7.desc: "义仓救济已经议处，核对住处、租地与粮契时，官署发现同一片地竟留下了几种互不相合的写法。\n\n入蜀已有多年的家庭仍用旧乡的称呼记田界和牲畜，官署新派的书记却照府城用语抄写。一场租地纠纷因此多出三道彼此矛盾的证词，乡老和外来长者都认为自己的话被故意改了。年轻读书人愿兼学两种说法，为契纸附上解释；一些旧户认为，这会让外乡人的规矩渐渐进入本府。新的户籍若要真正起作用，就须让持契的人认得它。我们可以为互译与教读出钱，也可以坚持同一册式，只在争执发生时另找担保。"

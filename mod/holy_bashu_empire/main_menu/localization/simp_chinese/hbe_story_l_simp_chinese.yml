 hbe_short_southern_salt_wine.1.title: "停灶还是交盐"
 hbe_short_southern_salt_wine.1.desc: "井户从铁匠处买来一根铜管，想把卤水引到稍远的灶边。铜管省下挑卤人手，却在第一个寒夜漏了水。几名灶工被烫伤，供料匠人坚持这不是铜料的问题。新井筹资已经到期，停灶将使担保人先付利钱。\n\n医者希望先让伤者休养，井主则要赶交旧约。我们可以赔付停灶工钱，也可以要求井户自行承担改造，或准用旧木管暂时恢复生产。伤者把缠过的旧布带到井主面前，担保人则拿着快到期的借纸，要求府署说清停灶的钱由谁先付。"

 hbe_story_northern_shudao.202.a: "把章程留给后来者。"
 hbe_story_northern_shudao.202.title: "关军传时网"
 hbe_story_northern_shudao.202.desc: "关城的更鼓依同一套时刻响起，测候人和守望兵把仪器编入轮戍。公开讲读让位于军用传时，驿刻却比从前整齐。府署将几十年的积累交给关军，换来更可靠的山路防务与供给。\n\n各关试过同一套夜间传时，守更人分别领了更册。观测者的工钱与器具随关防供养，往后记录怎样发出、发给谁，也由军府依守备安排。"
 hbe_story_northern_shudao.8.c: "封存旧案，不另立长期章程。"
 hbe_story_northern_shudao.8.title: "山路上的同一时刻"
 hbe_story_northern_shudao.8.desc: "测候主持已经换任，新任者带着各站旧簿，开始商议记录与传时应当怎样延续。\n\n各站已经能把日影、水刻和星辰记录互相核对。府城希望刊出新的山地历书，关军则要求先统一夜间传时。先人留下的记录既能服务学问，也能帮助守关。长期制度将决定测候者今后依靠府学、村寨，还是军府。"

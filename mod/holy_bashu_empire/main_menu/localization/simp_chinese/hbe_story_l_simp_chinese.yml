 hbe_story_northern_shudao.106.desc: "昭化驿吏在木板上刻出山道，来客可以摸着刻痕辨认分岔。府城画师认为这种地图粗陋，建议换成装裱精美的纸图。\n\n一位目力衰弱的老赶马人说，自己只会用这块木板。匠人愿增刻里程，书坊也能印副本。府署可资助两者并用，也可只保留体面的图样，或把更新交给赶马人的行会。地图怎样制作，应当考虑真正走山路的人。"

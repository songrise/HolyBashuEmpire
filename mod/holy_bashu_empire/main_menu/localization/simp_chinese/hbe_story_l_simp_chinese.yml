 hbe_story_central_hills.112.title: "义仓门前的婚事"
 hbe_story_central_hills.112.desc: "川中两家人为婚礼借粮，仓吏却发现一方去年还未还清。族老坚持婚事关系家族体面，要求照例发粮，贫户则抱怨自己的口粮申请反而要排队。\n\n府署可把婚礼与救急分开办理，也可准族老担保，或让宴席缩小规模。粮食既能保全礼数，也能救济眼前的饥饿。我们如何安排这一次，将成为下一户来借粮的人援引的例子。"

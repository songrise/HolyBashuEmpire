 hbe_story_southern_salt_wine.108.title: "长宁竹海的租界"
 hbe_story_southern_salt_wine.108.desc: "长宁竹户发现几片原供全村取用的竹林已被记入豪族租册。族中管事愿让他们继续砍竹，只须按担收钱。一个年轻竹匠因此不得不把刚做好的篮子全部卖掉缴租。\n\n旧乡约与新租册都盖着地方的印记。府署可重新核定公用竹林，也可承认租册并给竹户减税，或以作坊采购补贴他们。我们不能让两份彼此矛盾的文书继续同时生效。"

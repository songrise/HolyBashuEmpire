 hbe_story_western_tea_horse.110.title: "茶市中的婚约"
 hbe_story_western_tea_horse.110.desc: "茶马市中两家人为婚约争执，牧户想以马匹抵付，府城家族却坚持只收现钱。一位已经相识多年的年轻女子请求他们不要把婚事变成一场不断加价的交割。\n\n族老说，婚礼关系家族声望，不能临时改变礼数。府署可以认可不同嫁资，也可依旧按城中规矩，或安排双方共同见证。一次婚约若得到妥当处理，也会影响其他来客是否把这里看作能长期居住的地方。"

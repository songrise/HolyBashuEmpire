 hbe_short_southwestern_valleys.22.desc: "诸谷议事时，一位会说两种话的年轻人被安排坐在门外，只能替长者转述。去年修桥的许多钱契出自他的手，几个村寨希望他能直接说明记录。主持者认为座次关乎旧有尊卑，不宜因会写字而更改。\n\n两份记录把一袋粮写成了两袋，青年认为此前长者转述时省去了一处解释。主持者不愿公开认错，村民请求立即减去追加的粮额。府署可公开更正，也可用公粮补回差额。\n\n“议事时的座次”第2篇。"

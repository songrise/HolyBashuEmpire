 hbe_short_shared.23.title: "下一次招工"
 hbe_short_shared.23.desc: "迁户的孩子与本地孩子一同在渡口做短工，其中一个摔伤后，两家都说自己付过护工的钱。船主认为孩子只是临时帮忙，不算雇工；医者请求先把伤者送进药舍，再查谁为这一天担保。\n\n伤者恢复后想回渡口做活，家属担心再次出事。船主愿多付一点工钱，条件是不再追究旧账。府署可以明定短工责任，也可只安排一次补偿。\n\n“渡口的两个孩子”第3篇。"

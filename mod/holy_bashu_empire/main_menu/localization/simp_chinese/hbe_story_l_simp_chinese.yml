 hbe_story_western_tea_horse.103.title: "荥经桥头的病马"
 hbe_story_western_tea_horse.103.desc: "荥经桥头一匹病马突然倒下，桥户要求货主将它拖走，医马人却请求先卸下茶篓。商队说赶路要紧，若耽误一天便会误了关市。\n\n桥边一家人愿给马添草，条件是府署免去他们尚欠的一次岗役。我们可以出钱安置，也可责令商队承担，或让桥户把照料列入收费。对商队而言它是一匹可以更换的驮马，对沿路住户而言却是又一项没有写进旧约的劳作。"

 hbe_short_southwestern_valleys.3.title: "新的共船木牌"
 hbe_short_southwestern_valleys.3.desc: "破船板已经修复，费用与载重各有裁处，两家想让今后的轮用有一份可当面查认的凭据。\n\n船修好时，村寨提出把渡人也列在木牌上。盐商担心以后每次运货都要等人，渔户愿少收一点船钱换取固定时段。新的木牌可以成为共同安排，也可以只保证买卖。新木牌还没刻字，两家便各带来一份行期。村民等渡船的时刻，与盐货到岸的时刻又排到了一处。"

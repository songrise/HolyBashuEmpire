 hbe_story_southwestern_valleys.201.title: "诸谷共桥约"
 hbe_story_southwestern_valleys.201.desc: "桥上的绳结、铁索和旧木契被收入共同桥约。不同村寨仍保留自己的说法，却能够按使用与维修记录重新分担。过路的商队只须面对一套共用办法，养桥的人也能在下一次议约时说出自己的贡献。\n\n新议约人各领一份副本，匠人也在维修簿上留下当年的份额。下一次洪水来时，各谷可以按这份约定借人借料，后来出工的人同样有权核问。"
 STATIC_MODIFIER_NAME_hbe_story_ending_southwestern_valleys_2: "关桥总署"
 STATIC_MODIFIER_DESC_hbe_story_ending_southwestern_valleys_2: "长期章程。具体影响见下列数值。"
 hbe_story_southwestern_valleys.8.b: "关桥总署。"
 hbe_story_southwestern_valleys.202.a: "把章程留给后来者。"
 hbe_story_southwestern_valleys.202.title: "关桥总署"
 hbe_story_southwestern_valleys.202.desc: "关桥总署在各谷设下统一的票牌，税费与维修钱进入同一公账。村寨不再各自收取桥钱，守军却可以更快地调动铁匠和人手。诸谷得到了贯通的道路，也把对通行权的部分主持交给了府署。\n\n各桥换上关署票牌，收钱与维修分别登记。商队只须照一套办法通行，村寨则须通过公账追问用度；关署接下收入，也接下失修时不能推给旁人的责任。"
 hbe_story_southwestern_valleys.8.c: "封存旧案，不另立长期章程。"
 hbe_story_southwestern_valleys.8.title: "连起诸谷的道路"
 hbe_story_southwestern_valleys.8.desc: "桥约的接续已经重议，村寨和关署拿着各自的账册，商量诸谷今后共同遵行的办法。\n\n绳桥、铁索与桥边集市已经把几处山谷连在一起。村寨愿把互助定成长期桥约，关署则希望统一处理税费和防务。共同主持可以保留各谷的声音，统一关署能使过路人只面对一套规则。最后的安排将决定后人怎样使用这些桥。"

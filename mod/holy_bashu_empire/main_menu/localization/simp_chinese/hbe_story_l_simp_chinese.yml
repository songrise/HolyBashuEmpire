 hbe_short_shared.83.title: "春天移回的围栏"
 hbe_short_shared.83.desc: "冬牧与救助已经议定，牲畜撑过了雪季，春天重新划栏时，旧地名与官册名又对不上。\n\n新户愿照冬牧约改栏，山民请求木牌能记两种地名。书记认为一册一名便于征税，府署可承认双名，也可保留官名附注。围栏照约移回，木牌上却还空着地名。两家带来的称呼不同，走的却是同一条进山路。"

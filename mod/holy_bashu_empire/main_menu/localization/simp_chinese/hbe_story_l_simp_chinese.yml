 hbe_story_southern_salt_wine.1.title: "石层里的巨骨"
 hbe_story_southern_salt_wine.1.desc: "荣州与富顺一带的井工在凿石时碰到一截硕大的骨节，铁钎敲下的碎片比常见兽骨沉重。井主催促继续下凿，药商却愿买走这些所谓[Concept('hbe_history_zigong_fossils', '龙骨')|e]。\n\n若把骨节连同周围石层挖出，井口便要停工。几名府学师生请求保留原处的样貌，以免后人只看到磨成粉末的残片。\n\n本篇是“井下巨骨”的第1章。前面的选择将决定最后保留哪一种长期章程。"

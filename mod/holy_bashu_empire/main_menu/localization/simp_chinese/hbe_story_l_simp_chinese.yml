 hbe_short_shared.213.title: "抄错的出生地"
 hbe_short_shared.213.desc: "一名在本府出生的少年领工牌时，册上却写着父亲的湖广旧籍。书记认为家族籍贯不因孩子出生地改变，少年请求按自己从未离开的地方登记。旧族担心年轻一代都转为本地正户后，现有名额不足分配。\n\n府署可以认本府出生与成长的记录，也可以保留家族旧籍，或以固定年数的居住办理转籍。少年的师傅已经给他留了一张工桌，工牌上的一行字却决定他能否接到长期订单。"

 STATIC_MODIFIER_DESC_hbe_shared_choice_218_2: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_short_shared.218.b: "由族老逐案担保，维护旧序。"
 STATIC_MODIFIER_NAME_hbe_shared_choice_218_3: "公开核账 · 乡里互认"
 STATIC_MODIFIER_DESC_hbe_shared_choice_218_3: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_short_shared.218.c: "先准共同查账，留转籍期限。"
 hbe_short_shared.218.d: "暂缓裁定，不再由府库出资。"
 hbe_short_shared.218.title: "乡册背面的名字"
 hbe_short_shared.218.desc: "年末重抄乡册时，书记把暂住的迁户另列在最后几页。几个新户已经纳税多年，也参加过修桥，却仍没有参与查账的资格。族老愿把其中几位富户移到正册，不愿让所有人援用同一条办法。\n\n府署可以按居住、纳税与出资公开转籍，也可以保留族老逐案担保，或先给予查账资格，暂不更改乡册。新的共同天下究竟用什么承认一个人，将在这些看似细小的次序中留下答案。"
 hbe_migration.2.desc.open: "依开簿收户的裁定，第一批家庭暂住在城外的草棚里。负责查田的书吏给他们指了一片荒坡，但村民说那里虽然多年无人耕作，冬天却要放牲畜，春天还得从坡脚引水。入册并未替他们定下田界，安置仍须再作安排。\n\n我们若把地直接交给新户，开垦会更快，旧有牧路却需要补偿；若只准他们向田主租种，府库可以少花一笔钱，他们也可能很快背上无力偿还的预支。几根新插的木桩已经把草坡分成小块，尚无人说得清哪一道界线得到了承认。\n\n“湖广填四川”第2章。入籍、工牌与乡约的历次决定，会影响最后留下的共同章程。"
 hbe_migration.2.desc.sponsored: "依工种与担保分批留下的人家，有的在作坊借宿，有的仍住在渡口。几位担保人请求给愿意耕作的家庭指一片荒坡，村民却说，那里虽然多年无人耕作，冬天仍要放牲畜，春天还得从坡脚引水。获准居留，也没有免去地界上的争论。\n\n我们若把地直接交给新户，开垦会更快，旧有牧路却需要补偿；若只准他们向田主租种，府库可以少花一笔钱，他们也可能很快背上无力偿还的预支。几根新插的木桩已经把草坡分成小块，尚无人说得清哪一道界线得到了承认。\n\n“湖广填四川”第2章。入籍、工牌与乡约的历次决定，会影响最后留下的共同章程。"
 hbe_migration.2.desc.transit: "首批船客依照只准过境的裁定继续赶路，渡口的租地争议却没有消失。后来又有几户人家带着田主的邀约而来，请求重议一片荒坡的开垦。村民说那里虽多年无人耕作，冬天仍要放牲畜，春天还得从坡脚引水。旧有的过境裁定尚未撤销，这次若准开垦，便须另给这些家庭留下的凭据。\n\n我们若把地直接交给新户，开垦会更快，旧有牧路却需要补偿；若只准他们向田主租种，府库可以少花一笔钱，他们也可能很快背上无力偿还的预支。几根新插的木桩已经把草坡分成小块，尚无人说得清哪一道界线得到了承认。\n\n“湖广填四川”第2章。入籍、工牌与乡约的历次决定，会影响最后留下的共同章程。"

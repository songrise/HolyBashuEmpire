 hbe_story_southern_salt_wine.201.title: "巨骨公藏与井谱"
 hbe_story_southern_salt_wine.201.desc: "一块块巨骨按井口与石层排列起来，师生终于能够辨认旧图中混在一起的残片。井工的姓名写在出土记录里，访学者可以借阅井谱而不必先购买药商的旧说。盐井仍要出卤，巨骨却有了独立于盐价的价值：后来的查验者可以从这些材料继续追问。\n\n学生将最后一张足印拓片编好，留出可供后来人补写的空页。井户仍可开井，遇到新的骨层时却已有一套不必另等名望担保的记录办法。"

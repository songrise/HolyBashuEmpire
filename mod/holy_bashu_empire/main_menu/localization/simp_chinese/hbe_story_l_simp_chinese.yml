 hbe_short_eastern_river.22.title: "纸上多出的一行字"
 hbe_short_eastern_river.22.desc: "石刻的拓印与交易已有裁处，几张辗转流出的纸样却添了新字，村寨再次带样来认。\n\n几张新拓本出现了原石没有的题名，商人说只是方便买主辨认。拓工要求把补题与原字分开，乡老认为不分清便会改写旧事。府署可公开核验，也可让商铺担保自己的题名。原字边沿残损，后添的题名反而格外清楚。拓工把纸转向窗光，请众人看墨色接上的那一道边。"

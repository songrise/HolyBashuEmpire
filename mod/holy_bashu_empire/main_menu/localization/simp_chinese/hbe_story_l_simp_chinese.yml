 hbe_short_southern_salt_wine.3.title: "不再挑卤的人"
 hbe_short_southern_salt_wine.3.desc: "井户从铁匠处买来一根铜管，想把卤水引到稍远的灶边。铜管省下挑卤人手，却在第一个寒夜漏了水。几名灶工被烫伤，供料匠人坚持这不是铜料的问题。新井筹资已经到期，停灶将使担保人先付利钱。\n\n铜管终于能连续出水，几个原来的挑卤工却被井主辞退。他们曾在停灶时帮忙修管，请求转学煎盐。府署可供养传习，也可只给一笔工钱，把雇用交给井主。\n\n“盐灶上的新铜管”第3篇。"

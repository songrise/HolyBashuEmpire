 hbe_story_southern_salt_wine.101.desc: "嘉定寺门整修的石工已经数月没有领到工钱，主持却仍要求添刻一排精美浮雕。石工许伯把最后一只凿子放到府衙门前，称自己愿放弃雕饰，只求领回应得的银钱。\n\n寺院提醒我们，这座山门会吸引远来的香客；附近村民则只看见被抽走的壮丁。府署可为工钱垫款，也可缩减雕饰，或借香客捐钱完成工程。不同做法将让山门留下不同的纪念。"

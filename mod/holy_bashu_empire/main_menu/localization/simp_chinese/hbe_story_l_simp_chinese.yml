 hbe_short_eastern_river.2.title: "对岸传来的回声"
 hbe_short_eastern_river.2.desc: "江防站更换了一种较响的号角，远处村寨却把它误认成山中祭号。一次夜汛时，粮船仍照旧号出发，险些撞上漂木。军官要求所有村寨学会新号，村民则认为江岸站从未问过他们旧有的报水办法。\n\n试号在峡中产生回声，听者仍会把上游和下游混淆。船夫建议辅以灯数，乡民却担心夜间灯油成为新的摊派。府署可以供油，也可以让受护的商船付费。\n\n“夜里听不见的江号”第2篇。"

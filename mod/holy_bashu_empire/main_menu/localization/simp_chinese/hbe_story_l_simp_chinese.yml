 hbe_short_southern_salt_wine.11.title: "码头边的碎片"
 hbe_short_southern_salt_wine.11.desc: "泸州酒户订做一批较薄的酒瓮，船户说装船更轻，窑工却担心长途碰撞。第一批货在合江卸船时破了数只，酒户指责船上的垫草不足。窑工带来完好的空瓮，要求把装载与烧造分开查验。\n\n船户愿赔破瓮，但不肯承认酒也由自己赔。商人要求府署立即定损，否则下一批酒货会改走别处。我们可以暂赔货损，组织试装，也可以沿用旧船约迅速结案。\n\n“顺流而下的酒瓮”第1篇。"

 hbe_story_central_hills.201.a: "把章程留给后来者。"
 hbe_story_central_hills.201.title: "坡田共护章程"
 hbe_story_central_hills.201.desc: "新修的埂没有在地图上变成一条笔直的线。村落仍按坡势和来水安排维修，仓中也为无力修埂的人留下一份种粮。田主不能只凭家世免去分担，乡民也不能借共同田地逃避照料。共护章程把丰年和旱年的责任一同留下。\n\n几十年的笔记、工钱与争执没有凭空消失。它们被保存进新的章程，成为后来主持者必须继续履行的责任。至此，这段事业已经收束，获得的长期收益将随国家延续。"

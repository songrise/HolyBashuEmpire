 hbe_story_chengdu_plain.104.title: "绵竹酒坊的清曲"
 hbe_story_chengdu_plain.104.desc: "绵竹酒坊试出一种香气清淡的新曲，坊主却没有把配方告诉自己的长工。长工阿祺攒钱办酒席，请师父收他为徒，得到的答复仍是：这项技法只传亲族。\n\n邻近酒户愿凑钱让府署主持试酿，也有人主张保护一家人的秘方。若把技法公开，更多酒坊能受益；若由府署指定作坊供货，则能换来较稳的礼酒，却会压缩小酒户的生计。"

 hbe_short_shared.215.d: "暂缓裁定，不再由府库出资。"
 hbe_short_shared.215.title: "该交给谁的渡口钱"
 hbe_short_shared.215.desc: "几户迁来船家出过修渡钱，却仍按客船支付较高的渡费。渡口主持说出钱是自愿捐助，旧户的免渡来自祖先修桥。船家请求让自己的出资也能得到一段明确的通行权。\n\n我们可以按近期出资重订免渡，也可以保留旧权而退还部分钱，或把所有渡费与维修钱列入同一公账。今天不能总称捐助没有凭据，明天又要求这些人继续为公共渡口出钱。"

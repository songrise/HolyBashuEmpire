 hbe_story_western_tea_horse.202.a: "把章程留给后来者。"
 hbe_story_western_tea_horse.202.title: "良马官苑"
 hbe_story_western_tea_horse.202.desc: "官苑把良马与照料者的姓名记在同一册中，军府可以按轮戍与征调安排供养。普通驮马仍由牧户经营，最好的马却先满足官用。多年医治与繁育积累变成稳定的军马来源，也变成府库须长期承担的责任。\n\n官苑在交马册旁附上病历，照料者依年领酬。军府因此能够预先安排马源，也必须持续负担草料和医治，不会因一次选得良马便省去后来的供养。"
 hbe_story_western_tea_horse.8.c: "封存旧案，不另立长期章程。"
 hbe_story_western_tea_horse.8.title: "接续的马路"
 hbe_story_western_tea_horse.8.desc: "学徒的传习与去向已经安排，沿途各站和官苑都来请求，把多年试办的照料办法留下来。\n\n两代牧人留下的药方与病历已经能帮助新商队越过山口。府署希望把医马学舍定为常设，军府则主张把它并入官苑。前者依靠开放传习维持茶路，后者能为官马提供稳定照料。早年来此的牧户也要求在新章程上保留自己的名字。"

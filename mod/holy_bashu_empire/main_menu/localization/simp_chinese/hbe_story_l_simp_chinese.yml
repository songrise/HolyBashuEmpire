 hbe_short_shared.112.title: "寄回来的旧信"
 hbe_short_shared.112.desc: "长者回乡与承契的请求已有裁处，他随后寄来旧乡的信，问亲族能否也来找个住处。\n\n长者从旧乡寄来一封介绍亲族的信，请求他们也能来住。族老担心一封接一封的信使户册无法控制，田主愿招来做工。信封沿水路压出折痕，介绍来的亲族还没有启程。族老请先定一个名额，田主则在旁列着缺工的田。"

 hbe_short_eastern_river.23.title: "下一次雨季"
 hbe_short_eastern_river.23.desc: "拓本题名的争论暂有处理，石壁上的字却仍在风雨中剥落，保存原物的事已经不能再等。\n\n石面缺损又扩大了，村寨愿搭小棚遮雨，却需要船户运木。买主希望把最完整的石块移走保存。我们可以让它留在峡中，也可以接受异地保管，或保留纸本而减少对山路的开凿。守石的人带来新掉下的碎屑，运木船主也报了搭棚的价。是否移走原石还没定，下一轮江雨却已经沿峡吹来。"

 hbe_short_shared.102.desc: "外乡船工替旧船帮修好了一艘险些报废的船，船主答应给他一份跑船名额。船帮却认为资格只传本帮子弟，提议给一笔工钱代替。船工不愿永远做岸边短工，家属已在渡口租了住处。\n\n结算这段日子的修船与码头杂作时，外乡船工发现自己的饭钱比旧工少。获准试船的活计另照原约办理，船帮却认为，只要尚未正式入帮，做什么都应自带口粮。家属请求承认他的实际劳作，府署可重核雇用，也可只给一次救济。\n\n“新来的船工”第2篇。"

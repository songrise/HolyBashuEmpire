 hbe_story_chengdu_plain.107.title: "邛州窑口的颜色"
 hbe_story_chengdu_plain.107.desc: "[Concept('hbe_history_qiong', '邛州窑工')|e]在一批坏坯上烧出新的釉色，师父却要求把这些器物打碎，免得毁掉作坊的声誉。小徒把其中一只藏在草棚，过路商人见后愿出高价订购。\n\n如今窑主想拿回配方，徒弟希望以自己的名字试烧，府署也收到将新器用作礼物的建议。试验会耗去柴薪和好泥，单凭一次烧成还不能保证下一批成色。我们得决定谁来承担这些风险。"

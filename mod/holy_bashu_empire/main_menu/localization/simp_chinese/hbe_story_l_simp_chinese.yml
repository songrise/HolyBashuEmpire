 hbe_story_chengdu_plain.7.d: "到此为止，不再投入后续事业。"
 hbe_story_chengdu_plain.7.title: "下一代巡山人"
 hbe_story_chengdu_plain.7.desc: "旧日发现白熊的猎户已经去世，他的孙辈希望接领巡山职役，却不肯再按祖辈的工钱出山。竹农也要求把供养费用写进常年的公账。\n\n若此事仍靠一代人的恩赏维持，前人留下的图册便可能成为最后的记录。我们需要为后人留下能履行的安排。\n\n本篇是“竹林中的白熊”的第7章。前面的选择将决定最后保留哪一种长期章程。"
 STATIC_MODIFIER_NAME_hbe_story_ending_chengdu_plain_1: "山林护兽约"
 STATIC_MODIFIER_DESC_hbe_story_ending_chengdu_plain_1: "长期章程。具体影响见下列数值。"
 hbe_story_chengdu_plain.8.a: "山林护兽约。"
 hbe_story_chengdu_plain.201.a: "把章程留给后来者。"
 hbe_story_chengdu_plain.201.title: "山林护兽约"
 hbe_story_chengdu_plain.201.desc: "巡山的人带来最后一册记录。山民的柴路、竹农的供养和白熊往来的兽径，终于被写在同一张图上。府城使者仍想把珍兽送进城苑，村寨却已经能说清哪些山地须留下，哪些田可继续耕作。护育不再只是一次放归，而是每年都要履行的共同约定。\n\n几十年的笔记、工钱与争执没有凭空消失。它们被保存进新的章程，成为后来主持者必须继续履行的责任。至此，这段事业已经收束，获得的长期收益将随国家延续。"
 STATIC_MODIFIER_NAME_hbe_story_ending_chengdu_plain_2: "锦城瑞兽馆"
 STATIC_MODIFIER_DESC_hbe_story_ending_chengdu_plain_2: "长期章程。具体影响见下列数值。"
 hbe_story_chengdu_plain.8.b: "锦城瑞兽馆。"
 hbe_story_chengdu_plain.202.a: "把章程留给后来者。"
 hbe_story_chengdu_plain.202.title: "锦城瑞兽馆"
 hbe_story_chengdu_plain.202.desc: "城苑的竹院已经换过几代养兽人，来访者能够看见活兽，也能够读到它们的饮食与习性。巡山人担心远离山林的供养越来越贵，商人则愿承担一部分费用。府署选择把这些年的成果留在瑞兽馆中，声名与访客将伴着一笔持续的开支。\n\n几十年的笔记、工钱与争执没有凭空消失。它们被保存进新的章程，成为后来主持者必须继续履行的责任。至此，这段事业已经收束，获得的长期收益将随国家延续。"
 hbe_story_chengdu_plain.8.c: "封存旧案，不另立长期章程。"
 hbe_story_chengdu_plain.8.title: "山林与城苑的约定"
 hbe_story_chengdu_plain.8.desc: "早年救起的那只幼兽早已不在，养兽人仍沿用它留下的记录。山中的村寨与府城各有自己的供养方式，却都希望将这些年的功劳写入最后的章程。\n\n我们可以让山林承担保育，让城苑负责展示，也可以继续优先满足远来的宾客。这次决定将为本府留下长久的制度。\n\n历年的选择已经留下方向；最后的章程只能从已经得到支持的道路中确定。"

 hbe_short_shared.53.title: "留下来的医者"
 hbe_short_shared.53.desc: "药方与药样各有了查验的办法，试办诊治的期限却快到了，病家和医者都需要一个长久去处。\n\n经过这些日子的会诊与查方，一些病家愿继续找这位外乡医者问诊。他请求正式留下自己的铺号；本地医者愿收他的子弟为徒，却希望今后的诊治并入旧铺。府署可承认独立药铺，也可促成共用药舍。外乡医者的药柜仍是借来的，病家却已认得那个门口。本地旧铺递来合铺的条件，独立铺号还等着官署落笔。"

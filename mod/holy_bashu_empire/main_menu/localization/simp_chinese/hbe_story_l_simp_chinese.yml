 hbe_short_shared.218.d: "暂缓裁定，不再由府库出资。"
 hbe_short_shared.218.title: "乡册背面的名字"
 hbe_short_shared.218.desc: "年末重抄乡册时，书记把暂住的迁户另列在最后几页。几个新户已经纳税多年，也参加过修桥，却仍没有参与查账的资格。族老愿把其中几位富户移到正册，不愿让所有人援用同一条办法。\n\n府署可以按居住、纳税与出资公开转籍，也可以保留族老逐案担保，或先给予查账资格，暂不更改乡册。新的共同天下究竟用什么承认一个人，将在这些看似细小的次序中留下答案。"
 hbe_migration.2.desc.open: "首批船客领到渡口口粮，姓名录进新簿。他们开始找田与住处，开簿时没有写明的地界却陆续有人来争。\n\n查田书吏指给求租的人一片荒坡，旧村却说冬天要在那里放牲畜，春天还须从坡脚引水。田主愿招佃户开荒，请求将整块地列入自己的庄册；几户人家已经借来木桩，想先把可修的埂标出来。若另给新户小契，旧牧路便须补偿；若让田主包办出租，租额又可能在下一季上调。过境与居留的先前裁定仍须分别遵守，这一次应给哪些家庭开垦凭据，眼下还没有定论。"
 hbe_migration.2.desc.sponsored: "匠人与佃户依工种、担保分批留下，有人借宿作坊，有人仍等在渡口。担保人又送来一份开荒请求。\n\n查田书吏指给求租的人一片荒坡，旧村却说冬天要在那里放牲畜，春天还须从坡脚引水。田主愿招佃户开荒，请求将整块地列入自己的庄册；几户人家已经借来木桩，想先把可修的埂标出来。若另给新户小契，旧牧路便须补偿；若让田主包办出租，租额又可能在下一季上调。过境与居留的先前裁定仍须分别遵守，这一次应给哪些家庭开垦凭据，眼下还没有定论。"
 hbe_migration.2.desc.transit: "首批船客照只准过境的裁定继续赶路。后来又有几户带着田主邀约而来，请求另议城外荒坡的开垦。\n\n查田书吏指给求租的人一片荒坡，旧村却说冬天要在那里放牲畜，春天还须从坡脚引水。田主愿招佃户开荒，请求将整块地列入自己的庄册；几户人家已经借来木桩，想先把可修的埂标出来。若另给新户小契，旧牧路便须补偿；若让田主包办出租，租额又可能在下一季上调。过境与居留的先前裁定仍须分别遵守，这一次应给哪些家庭开垦凭据，眼下还没有定论。"
 hbe_story_chengdu_plain.2.desc.after_a: "山民收下指路的工钱，带巡山者认过竹径。猎户答应留下活兽，近来送到府署的也不再只有兽皮。\n\n巡山者带回一只脚掌受伤的幼兽。它只肯吃嫩竹，衙中马夫却不断往食盆里添谷物。附近竹农愿供应鲜竹，但要求免去一季驿役。医者希望留下幼兽观察。几名使者已请求把它送入府城，他们认为这种异兽足以显扬本府。"
 hbe_story_chengdu_plain.2.desc.after_b: "医者与画师从山中带回几张草图，记下兽迹旁被咬断的嫩竹。两人仍托沿途村户留意活兽。\n\n巡山者带回一只脚掌受伤的幼兽。它只肯吃嫩竹，衙中马夫却不断往食盆里添谷物。附近竹农愿供应鲜竹，但要求免去一季驿役。医者希望留下幼兽观察。几名使者已请求把它送入府城，他们认为这种异兽足以显扬本府。"
 hbe_story_chengdu_plain.2.desc.after_c: "兽皮获准照旧出售，猎户从中得了利。山民偶尔捎来的消息，却让府署知道竹林中还有活兽。\n\n巡山者带回一只脚掌受伤的幼兽。它只肯吃嫩竹，衙中马夫却不断往食盆里添谷物。附近竹农愿供应鲜竹，但要求免去一季驿役。医者希望留下幼兽观察。几名使者已请求把它送入府城，他们认为这种异兽足以显扬本府。"
 hbe_story_chengdu_plain.3.desc.after_a: "竹农领到了照料的报酬，幼兽伤愈后回到山中。巡山者隔一阵便去看那处放归的坡地。\n\n垦户在当年发现幼兽的坡地开出了新田，巡山者却发现旧有竹林已经连成零碎的几片。乡老说，没有这些田，几户新来的家庭便过不了冬。我们若划定护兽山界，就须补偿受影响的农户；若任由田地扩展，也不能再向府城保证山中仍有活兽。"
 hbe_story_chengdu_plain.3.desc.after_b: "医者在竹院记下幼兽怎样进食、换毛，来送竹的农户也渐渐认得了它的习性。\n\n垦户在当年发现幼兽的坡地开出了新田，巡山者却发现旧有竹林已经连成零碎的几片。乡老说，没有这些田，几户新来的家庭便过不了冬。我们若划定护兽山界，就须补偿受影响的农户；若任由田地扩展，也不能再向府城保证山中仍有活兽。"
 hbe_story_chengdu_plain.3.desc.after_c: "幼兽送进府城后，贵族负担了供养，山中竹农则多了一份向兽苑交竹的生意。\n\n垦户在当年发现幼兽的坡地开出了新田，巡山者却发现旧有竹林已经连成零碎的几片。乡老说，没有这些田，几户新来的家庭便过不了冬。我们若划定护兽山界，就须补偿受影响的农户；若任由田地扩展，也不能再向府城保证山中仍有活兽。"
 hbe_story_chengdu_plain.4.desc.after_a: "垦户迁往另拨的官田，旧坡重新留给竹林。村民记着这笔安置，外来采办者也开始打听山界。\n\n外来使者愿以贵重礼物换取一对白熊。养兽人提醒我们，幼兽途中离开鲜竹便会衰弱，驿站也没有照料它们的经验。商人提出沿途雇人补给，贵族则认为拒绝赠兽会损害礼仪。山民也翻出祖辈留下的山契，追问外来采办是否会越过原有的竹山界线。"
 hbe_story_chengdu_plain.4.desc.after_b: "巡山者把零散兽径连在图上，伐竹人依图避开几处狭窄通路。山契由此添了新的界记。\n\n外来使者愿以贵重礼物换取一对白熊。养兽人提醒我们，幼兽途中离开鲜竹便会衰弱，驿站也没有照料它们的经验。商人提出沿途雇人补给，贵族则认为拒绝赠兽会损害礼仪。山民也翻出祖辈留下的山契，追问外来采办是否会越过原有的竹山界线。"
 hbe_story_chengdu_plain.4.desc.after_c: "新田地契得到承认，田租按议定办法补贴城苑。养兽人仍须从剩下的竹山筹集鲜竹。\n\n外来使者愿以贵重礼物换取一对白熊。养兽人提醒我们，幼兽途中离开鲜竹便会衰弱，驿站也没有照料它们的经验。商人提出沿途雇人补给，贵族则认为拒绝赠兽会损害礼仪。山民也翻出祖辈留下的山契，追问外来采办是否会越过原有的竹山界线。"
 hbe_story_chengdu_plain.5.desc.after_a: "使者带走了画册，活兽留在本地。乡老将那次拒送的批语收在山契旁，供后来采办者查认。\n\n山中大片竹林开花，白熊沿河谷来到村落，翻动了农家的粮窖。守林人说，旧竹将在结籽后枯死，新竹长成还要几年。村民要求驱走兽群，养兽人则请求拨款采竹。无论竹山归村寨经营还是供城苑采办，眼下的旧办法都已不能保证兽群得到食物。"
 hbe_story_chengdu_plain.5.desc.after_b: "来访学者获准入山观察，随行者不得把白熊带走。养兽人也向他们说明了鲜竹的用量。\n\n山中大片竹林开花，白熊沿河谷来到村落，翻动了农家的粮窖。守林人说，旧竹将在结籽后枯死，新竹长成还要几年。村民要求驱走兽群，养兽人则请求拨款采竹。无论竹山归村寨经营还是供城苑采办，眼下的旧办法都已不能保证兽群得到食物。"
 hbe_story_chengdu_plain.5.desc.after_c: "商人承担了远送的补给，沿途驿站为这趟差事备过鲜竹。留下的采办账让养兽人看清了供养的开支。\n\n山中大片竹林开花，白熊沿河谷来到村落，翻动了农家的粮窖。守林人说，旧竹将在结籽后枯死，新竹长成还要几年。村民要求驱走兽群，养兽人则请求拨款采竹。无论竹山归村寨经营还是供城苑采办，眼下的旧办法都已不能保证兽群得到食物。"
 hbe_story_chengdu_plain.6.desc.after_a: "府署赔了受损的粮食，又让巡山者引兽群去另一片竹山。村民逐渐记住了它们饥饿时会走的路。\n\n医者和巡山者的记录已经积累数册，画师却把[Concept('hbe_history_panda', '白熊')|e]画成了食铁的猛兽。乡民拿出它啃竹的痕迹，要求把自己的见闻也写入册中。府学愿刊行新图志，但几个旧家族坚持保留能显扬本府的传说。我们须决定图志怎样署名、怎样讲述这些山林。"
 hbe_story_chengdu_plain.6.desc.after_b: "几处竹林按长势轮换供养，巡山者把竹花、枯竹与兽群行迹记在同一本簿中。\n\n医者和巡山者的记录已经积累数册，画师却把[Concept('hbe_history_panda', '白熊')|e]画成了食铁的猛兽。乡民拿出它啃竹的痕迹，要求把自己的见闻也写入册中。府学愿刊行新图志，但几个旧家族坚持保留能显扬本府的传说。我们须决定图志怎样署名、怎样讲述这些山林。"
 hbe_story_chengdu_plain.6.desc.after_c: "城苑加固围护，野外缺食仍由村寨照料。两处养兽人开始各记一份食料与损失。\n\n医者和巡山者的记录已经积累数册，画师却把[Concept('hbe_history_panda', '白熊')|e]画成了食铁的猛兽。乡民拿出它啃竹的痕迹，要求把自己的见闻也写入册中。府学愿刊行新图志，但几个旧家族坚持保留能显扬本府的传说。我们须决定图志怎样署名、怎样讲述这些山林。"
 hbe_story_chengdu_plain.7.desc.after_a: "巡山人和乡老共同改过图稿，画师在几处传说旁添上了实见的注记。村民的名字第一次留在册尾。\n\n旧日发现白熊的猎户已经去世，他的孙辈希望接领巡山职役，却不肯再按祖辈的工钱出山。竹农也要求把供养费用写进常年的公账。若此事仍靠一代人的恩赏维持，前人留下的图册便可能成为最后的记录。我们需要为后人留下能履行的安排。"
 hbe_story_chengdu_plain.7.desc.after_b: "新图志按多年观察刊印，画师删去了没有见证的旧说。医者开始把不同年份的记录放在一处核对。\n\n旧日发现白熊的猎户已经去世，他的孙辈希望接领巡山职役，却不肯再按祖辈的工钱出山。竹农也要求把供养费用写进常年的公账。若此事仍靠一代人的恩赏维持，前人留下的图册便可能成为最后的记录。我们需要为后人留下能履行的安排。"
 hbe_story_chengdu_plain.7.desc.after_c: "献礼画册保留了瑞兽传说，府城宾客颇为喜爱。照料活兽的人仍另留着一本日常食料簿。\n\n旧日发现白熊的猎户已经去世，他的孙辈希望接领巡山职役，却不肯再按祖辈的工钱出山。竹农也要求把供养费用写进常年的公账。若此事仍靠一代人的恩赏维持，前人留下的图册便可能成为最后的记录。我们需要为后人留下能履行的安排。"
 hbe_story_chengdu_plain.8.desc.after_a: "巡护按年付酬后，山村开始推举接班的人。竹农希望新领工钱的人也能照看兽径旁的竹林。\n\n早年救起的那只幼兽早已不在，养兽人仍沿用它留下的记录。山中的村寨与府城各有自己的供养方式，却都希望将这些年的功劳写入最后的章程。我们可以让山林承担保育，让城苑负责展示，也可以继续优先满足远来的宾客。这次决定将为本府留下长久的制度。"
 hbe_story_chengdu_plain.8.desc.after_b: "府学留出观察席，年轻人跟着巡山者学记行迹。几册旧图已经成了他们出门时的行装。\n\n早年救起的那只幼兽早已不在，养兽人仍沿用它留下的记录。山中的村寨与府城各有自己的供养方式，却都希望将这些年的功劳写入最后的章程。我们可以让山林承担保育，让城苑负责展示，也可以继续优先满足远来的宾客。这次决定将为本府留下长久的制度。"
 hbe_story_chengdu_plain.8.desc.after_c: "府城兽苑按约购买供养，山村自行安排竹料。养兽人须分别向苑中和山户说明每年的用度。\n\n早年救起的那只幼兽早已不在，养兽人仍沿用它留下的记录。山中的村寨与府城各有自己的供养方式，却都希望将这些年的功劳写入最后的章程。我们可以让山林承担保育，让城苑负责展示，也可以继续优先满足远来的宾客。这次决定将为本府留下长久的制度。"
 hbe_story_southern_salt_wine.2.desc.after_a: "井工领到停工补偿，把骨节连着石片搬进仓房。别处井口听见消息，也开始留意钎下的异物。\n\n各井送来的骨头已经堆满半间仓房，药商把形状相近的骨节串成一条巨龙。井工却指出，其中几块来自不同的岩层，根本不在同一处。府学希望逐井编号，井主不愿为抄录耽误工期。若没有清楚的来历，我们以后也无法分辨一具骨架由多少种生物拼成。"
 hbe_story_southern_salt_wine.2.desc.after_b: "石匠与师生共同看过巨骨，井工学着保留周围石片。零散残骨随后不断送来。\n\n各井送来的骨头已经堆满半间仓房，药商把形状相近的骨节串成一条巨龙。井工却指出，其中几块来自不同的岩层，根本不在同一处。府学希望逐井编号，井主不愿为抄录耽误工期。若没有清楚的来历，我们以后也无法分辨一具骨架由多少种生物拼成。"
 hbe_story_southern_salt_wine.2.desc.after_c: "药商收走一批龙骨，盐井继续出卤。几块无人肯买的残骨仍留在井边，引来师生查看。\n\n各井送来的骨头已经堆满半间仓房，药商把形状相近的骨节串成一条巨龙。井工却指出，其中几块来自不同的岩层，根本不在同一处。府学希望逐井编号，井主不愿为抄录耽误工期。若没有清楚的来历，我们以后也无法分辨一具骨架由多少种生物拼成。"
 hbe_story_southern_salt_wine.3.desc.after_a: "仓房按井口和石层分了架，搬骨的井工也能指出哪几块本不该摆在一起。\n\n药铺称巨骨能补虚损，已经收下数十份预订。师生发现晒干的骨块有明显石质，却拿不出足以说服病家的解释。井户愿把药钱用于修井，医者则要求暂停销售。我们若取消预订，须处理药商的损失；若准许继续出售，调查也将失去更多完整标本。"
 hbe_story_southern_salt_wine.3.desc.after_b: "那条拼出的巨龙被拆开查验，师生在骨节背面记下形状与接合处的疑点。\n\n药铺称巨骨能补虚损，已经收下数十份预订。师生发现晒干的骨块有明显石质，却拿不出足以说服病家的解释。井户愿把药钱用于修井，医者则要求暂停销售。我们若取消预订，须处理药商的损失；若准许继续出售，调查也将失去更多完整标本。"
 hbe_story_southern_salt_wine.3.desc.after_c: "巨龙陈列仍在，来客替盐场添了生意。师生却继续收着不合骨架的碎料。\n\n药铺称巨骨能补虚损，已经收下数十份预订。师生发现晒干的骨块有明显石质，却拿不出足以说服病家的解释。井户愿把药钱用于修井，医者则要求暂停销售。我们若取消预订，须处理药商的损失；若准许继续出售，调查也将失去更多完整标本。"
 hbe_story_southern_salt_wine.4.desc.after_a: "预订药钱退回病家，完整骨块留进仓房。医者把几份旧药单也附在旁边，待以后继续查验。\n\n新凿的井壁露出几层颜色不同的石带，骨节集中在其中一层。老井工记得另一处井口也曾见过相似排列，愿带师生沿山查找。掌盐官只关心哪一层更容易出卤，府学却希望把各井的石层画成一张长图。查访需要人手，也会让井主担心秘密外泄。"
 hbe_story_southern_salt_wine.4.desc.after_b: "医者领到查验旧方的经费，开始把所谓龙骨与普通石料分开记录，师生则重访出骨的井口。\n\n新凿的井壁露出几层颜色不同的石带，骨节集中在其中一层。老井工记得另一处井口也曾见过相似排列，愿带师生沿山查找。掌盐官只关心哪一层更容易出卤，府学却希望把各井的石层画成一张长图。查访需要人手，也会让井主担心秘密外泄。"
 hbe_story_southern_salt_wine.4.desc.after_c: "药商获准收购碎料，并须自行承担药效承诺。井户卖完碎料后，仍留着难以开价的大块骨节。\n\n新凿的井壁露出几层颜色不同的石带，骨节集中在其中一层。老井工记得另一处井口也曾见过相似排列，愿带师生沿山查找。掌盐官只关心哪一层更容易出卤，府学却希望把各井的石层画成一张长图。查访需要人手，也会让井主担心秘密外泄。"
 hbe_story_southern_salt_wine.5.desc.after_a: "井工领了误期钱，带师生逐井辨认石带。旧日只记出卤深浅的井谱添了几笔骨层位置。\n\n山溪露出一块留有三趾凹痕的石板，乡民说它是巨龙踏过的痕迹。师生把凹痕与旧骨架比照，认为它们可能来自在水边行走的巨兽。搬走石板会改变溪边的道路，原处村寨要求留下副本。府城的陈列者则希望得到原件，借此补全多年积累的图志。"
 hbe_story_southern_salt_wine.5.desc.after_b: "各井编号与石层图公开后，师生终于能把两处相隔甚远的井壁放在一起比较。\n\n山溪露出一块留有三趾凹痕的石板，乡民说它是巨龙踏过的痕迹。师生把凹痕与旧骨架比照，认为它们可能来自在水边行走的巨兽。搬走石板会改变溪边的道路，原处村寨要求留下副本。府城的陈列者则希望得到原件，借此补全多年积累的图志。"
 hbe_story_southern_salt_wine.5.desc.after_c: "石层图留在盐署，井主用它参考钻井。沿溪走访的井工仍把见过的异石报了上来。\n\n山溪露出一块留有三趾凹痕的石板，乡民说它是巨龙踏过的痕迹。师生把凹痕与旧骨架比照，认为它们可能来自在水边行走的巨兽。搬走石板会改变溪边的道路，原处村寨要求留下副本。府城的陈列者则希望得到原件，借此补全多年积累的图志。"
 hbe_story_southern_salt_wine.6.desc.after_a: "原处小亭护住足印，村寨照着图版向过路人解释石面的凹痕。师生带回拓片继续比对。\n\n府学新图志把骨架画成几种巨兽，删去了飞龙的翅膀。寺观的讲者批评这种画法冒犯旧说，盐商却发现宾客对这些不同寻常的形象更感兴趣。抄书人希望刊出观察依据，让读者自己判断。我们必须决定怎样保护查验者，又怎样回应依靠旧传维生的人。"
 hbe_story_southern_salt_wine.6.desc.after_b: "不同足印的拓片摊进府学，学生用木尺比量趾距，又把旧骨架拿来核对。\n\n府学新图志把骨架画成几种巨兽，删去了飞龙的翅膀。寺观的讲者批评这种画法冒犯旧说，盐商却发现宾客对这些不同寻常的形象更感兴趣。抄书人希望刊出观察依据，让读者自己判断。我们必须决定怎样保护查验者，又怎样回应依靠旧传维生的人。"
 hbe_story_southern_salt_wine.6.desc.after_c: "原石运入陈馆，修路的钱照约付给村寨。陈列者请画师把石上足印与巨骨画在一页。\n\n府学新图志把骨架画成几种巨兽，删去了飞龙的翅膀。寺观的讲者批评这种画法冒犯旧说，盐商却发现宾客对这些不同寻常的形象更感兴趣。抄书人希望刊出观察依据，让读者自己判断。我们必须决定怎样保护查验者，又怎样回应依靠旧传维生的人。"
 hbe_story_southern_salt_wine.7.desc.after_a: "府署准不同说法并存，也停了强索乡民献骨的差役。愿意送来残片的人开始说明各自的来历。\n\n年轻井工已会在挖到巨骨时留下周围石片，师生也能按旧编号找到许多井口。几家盐场请求以这些记录换取府署对新井的支持。府学担心图谱落入少数井主手中；掌盐官则认为实用勘查与收藏可以共用人手。图谱的保管方式将决定谁能继续利用这批积累。"
 hbe_story_southern_salt_wine.7.desc.after_b: "查验记录刊出后，有人写信挑错，也有井工补送当年遗下的石片，旧编号越发有了用处。\n\n年轻井工已会在挖到巨骨时留下周围石片，师生也能按旧编号找到许多井口。几家盐场请求以这些记录换取府署对新井的支持。府学担心图谱落入少数井主手中；掌盐官则认为实用勘查与收藏可以共用人手。图谱的保管方式将决定谁能继续利用这批积累。"
 hbe_story_southern_salt_wine.7.desc.after_c: "陈馆继续以龙骨奇观接待宾客，府学争论留在馆外。盐商仍靠井谱安排开凿和收藏。\n\n年轻井工已会在挖到巨骨时留下周围石片，师生也能按旧编号找到许多井口。几家盐场请求以这些记录换取府署对新井的支持。府学担心图谱落入少数井主手中；掌盐官则认为实用勘查与收藏可以共用人手。图谱的保管方式将决定谁能继续利用这批积累。"
 hbe_story_southern_salt_wine.8.desc.after_a: "井户共同保管井谱，师生可以借阅。年轻井工拿着旧编号，在新凿的石壁上继续记位置。\n\n早年陆续留下的骨架、石层图和足印终于能相互比照。师生请求给其中几种[Concept('hbe_history_zigong_fossils', '巨兽')|e]定名，药商和陈列者也提出了自己的称呼。这些巨兽的年代远在我们熟悉的家谱之外。最后的整理既可成为地方学问，也可成为盐场招徕宾客的珍藏。"
 hbe_story_southern_salt_wine.8.desc.after_b: "常年查验席教会新一批人保存石片、画骨节。师生开始将多年材料按来处重新排列。\n\n早年陆续留下的骨架、石层图和足印终于能相互比照。师生请求给其中几种[Concept('hbe_history_zigong_fossils', '巨兽')|e]定名，药商和陈列者也提出了自己的称呼。这些巨兽的年代远在我们熟悉的家谱之外。最后的整理既可成为地方学问，也可成为盐场招徕宾客的珍藏。"
 hbe_story_southern_salt_wine.8.desc.after_c: "盐署接收井谱，也承接了新井筹资。陈列者与掌盐官开始合议怎样利用这些收藏。\n\n早年陆续留下的骨架、石层图和足印终于能相互比照。师生请求给其中几种[Concept('hbe_history_zigong_fossils', '巨兽')|e]定名，药商和陈列者也提出了自己的称呼。这些巨兽的年代远在我们熟悉的家谱之外。最后的整理既可成为地方学问，也可成为盐场招徕宾客的珍藏。"
 hbe_story_eastern_river.2.desc.after_a: "船夫领了复测的工钱，名字也留在新滩记上。码头按新图试过几趟船，冬夏水势的差别才显出来。\n\n同一道[Concept('hbe_history_river', '江滩')|e]在夏汛和冬水时呈现不同形状，领航人各持一张地图，彼此指责对方误导船队。码头已挤满等待起航的粮船。若建立分季的水势谱，需要反复跑船；若先制定统一航路，就得暂时限制一些船只的装载。"
 hbe_story_eastern_river.2.desc.after_b: "船匠和画师随船记录，将竹片上的记号移进图册。领航人随后带来几份彼此不合的水位注记。\n\n同一道[Concept('hbe_history_river', '江滩')|e]在夏汛和冬水时呈现不同形状，领航人各持一张地图，彼此指责对方误导船队。码头已挤满等待起航的粮船。若建立分季的水势谱，需要反复跑船；若先制定统一航路，就得暂时限制一些船只的装载。"
 hbe_story_eastern_river.2.desc.after_c: "旧滩记封入江防站，守军先按它安排江运。行船者仍托熟识的领航人传递水势变化。\n\n同一道[Concept('hbe_history_river', '江滩')|e]在夏汛和冬水时呈现不同形状，领航人各持一张地图，彼此指责对方误导船队。码头已挤满等待起航的粮船。若建立分季的水势谱，需要反复跑船；若先制定统一航路，就得暂时限制一些船只的装载。"
 hbe_story_eastern_river.3.desc.after_a: "停航船户得到补贴，各季水位逐次入册。谱上添了更多记号，持谱领航的人也随之多起来。\n\n商船为了赶上行期，雇用了持假牌的引水人。真正熟悉江道的船夫要求限制外来同行，商人则不愿再为指定领航者支付高价。府署可以逐人考试，也可以由船帮担保。留下哪一种制度，将影响谱册怎样在江上发挥作用。"
 hbe_story_eastern_river.3.desc.after_b: "分季水势谱经几趟查验，开始由码头抄发。新船主愿意付钱雇识谱的人过滩。\n\n商船为了赶上行期，雇用了持假牌的引水人。真正熟悉江道的船夫要求限制外来同行，商人则不愿再为指定领航者支付高价。府署可以逐人考试，也可以由船帮担保。留下哪一种制度，将影响谱册怎样在江上发挥作用。"
 hbe_story_eastern_river.3.desc.after_c: "粮船依限载办法先行，军运得以按期通过。商船为追赶行期，争着寻找能带船过滩的引水人。\n\n商船为了赶上行期，雇用了持假牌的引水人。真正熟悉江道的船夫要求限制外来同行，商人则不愿再为指定领航者支付高价。府署可以逐人考试，也可以由船帮担保。留下哪一种制度，将影响谱册怎样在江上发挥作用。"
 hbe_story_eastern_river.4.desc.after_a: "船帮共同担保的引水牌按江段发出，码头可以追查领航者的来历。夜间过船又添了新的难处。\n\n守望者试用火光和鼓声向下游报汛，邻岸村民却抱怨夜间信号使他们无法休息。船主愿为灯油出钱，但不肯承担全部岗役。沿江村寨希望把报汛也用于防盗。若让守军独办，村寨便少了一项能自行利用的设施。"
 hbe_story_eastern_river.4.desc.after_b: "识谱与实测取代世袭名额，几名年轻船夫领到了新牌。他们请求补齐夜间辨路的办法。\n\n守望者试用火光和鼓声向下游报汛，邻岸村民却抱怨夜间信号使他们无法休息。船主愿为灯油出钱，但不肯承担全部岗役。沿江村寨希望把报汛也用于防盗。若让守军独办，村寨便少了一项能自行利用的设施。"
 hbe_story_eastern_river.4.desc.after_c: "江防船队接管领航，商船照例付费。守军随后试着把沿江几个报汛岗连起来使用。\n\n守望者试用火光和鼓声向下游报汛，邻岸村民却抱怨夜间信号使他们无法休息。船主愿为灯油出钱，但不肯承担全部岗役。沿江村寨希望把报汛也用于防盗。若让守军独办，村寨便少了一项能自行利用的设施。"
 hbe_story_eastern_river.5.desc.after_a: "村寨参加报汛，也减去一部分岗役。灯油与值夜的账由各岸送到码头，船匠又递来了修船清单。\n\n江边几处树林已供不出旧年修船所需的长木，船匠要求优先采购山中木料。寺院与村寨也在用同样的树木修桥。引水谱能减少触礁，却不能替船场补足材料。我们须决定怎样让船匠、山民和桥工共用有限的木材。"
 hbe_story_eastern_river.5.desc.after_b: "统一夜号抄入谱册后，领航人能够相互辨认来船。江运仍须停下来换板、补舵。\n\n江边几处树林已供不出旧年修船所需的长木，船匠要求优先采购山中木料。寺院与村寨也在用同样的树木修桥。引水谱能减少触礁，却不能替船场补足材料。我们须决定怎样让船匠、山民和桥工共用有限的木材。"
 hbe_story_eastern_river.5.desc.after_c: "军哨按令设下，商船承担灯油钱。受护船只增多，军用船场也开始催取更多修造木料。\n\n江边几处树林已供不出旧年修船所需的长木，船匠要求优先采购山中木料。寺院与村寨也在用同样的树木修桥。引水谱能减少触礁，却不能替船场补足材料。我们须决定怎样让船匠、山民和桥工共用有限的木材。"
 hbe_story_eastern_river.6.desc.after_a: "山村立了采伐限额，共用桥梁先得到木料。船匠不得不把其余修造需求记得更细。\n\n上游和下游各设了引水收费站，持有同一本谱册的船主仍须交两笔费用。两地守望者都说自己的岗役不可缺少。船帮建议凭一张通行券结算，再由两府分账。接受此法需要公开各站费用，也会减少本府独自定价的余地。"
 hbe_story_eastern_river.6.desc.after_b: "船匠试改船架，省下几根难得的长木。各站在工钱册上另记了改造与维护的费用。\n\n上游和下游各设了引水收费站，持有同一本谱册的船主仍须交两笔费用。两地守望者都说自己的岗役不可缺少。船帮建议凭一张通行券结算，再由两府分账。接受此法需要公开各站费用，也会减少本府独自定价的余地。"
 hbe_story_eastern_river.6.desc.after_c: "军用船场优先得木，山中采购归军府调度。商船请求把已经承担的修造钱列入通行核算。\n\n上游和下游各设了引水收费站，持有同一本谱册的船主仍须交两笔费用。两地守望者都说自己的岗役不可缺少。船帮建议凭一张通行券结算，再由两府分账。接受此法需要公开各站费用，也会减少本府独自定价的余地。"
 hbe_story_eastern_river.7.desc.after_a: "两府凭通行券分账，船主免去重复征收。发券者开始核对哪一本水势谱仍合眼下的江道。\n\n新式大船吃水更深，年轻引水人要求重新测量一些旧航道。书坊愿承印新版谱册，却不肯承担每年改版的成本。老船帮担心新人借新谱取代自己的位置。府署需要把更新、训练与收费安排在同一份船约中。"
 hbe_story_eastern_river.7.desc.after_b: "各站工钱与收费表公开，船帮可以查问开支。书坊却指出，更新旧谱还缺一笔常年费用。\n\n新式大船吃水更深，年轻引水人要求重新测量一些旧航道。书坊愿承印新版谱册，却不肯承担每年改版的成本。老船帮担心新人借新谱取代自己的位置。府署需要把更新、训练与收费安排在同一份船约中。"
 hbe_story_eastern_river.7.desc.after_c: "本府保留收费，换取优先护航。受护船队换上大船后，旧谱中的几处水深已显得不足。\n\n新式大船吃水更深，年轻引水人要求重新测量一些旧航道。书坊愿承印新版谱册，却不肯承担每年改版的成本。老船帮担心新人借新谱取代自己的位置。府署需要把更新、训练与收费安排在同一份船约中。"
 hbe_story_eastern_river.8.desc.after_a: "船户共捐维持改版，谱尾留着出资与复测人的姓名。沿江各站想让后来的船也照此分担。\n\n最初的滩记已经抄成数代水势谱，一些老引水人的姓名如今只留在谱后。沿江各府愿把这些经验定成长期通行规则。我们可以让谱册随船夫流传，也可以把它与护航船队的权利结合。两条道路都能使江运受益，却会把江道交给不同的人主持。"
 hbe_story_eastern_river.8.desc.after_b: "定期复测与公开训练办了起来，年轻引水人开始接过旧船夫的江段。各站要求留下长久的约定。\n\n最初的滩记已经抄成数代水势谱，一些老引水人的姓名如今只留在谱后。沿江各府愿把这些经验定成长期通行规则。我们可以让谱册随船夫流传，也可以把它与护航船队的权利结合。两条道路都能使江运受益，却会把江道交给不同的人主持。"
 hbe_story_eastern_river.8.desc.after_c: "军府承印水势谱，先发给受护船只。沿江站点也请求把领航、发谱和护送定为常例。\n\n最初的滩记已经抄成数代水势谱，一些老引水人的姓名如今只留在谱后。沿江各府愿把这些经验定成长期通行规则。我们可以让谱册随船夫流传，也可以把它与护航船队的权利结合。两条道路都能使江运受益，却会把江道交给不同的人主持。"
 hbe_story_northern_shudao.2.desc.after_a: "村民收下记录晨昏的工钱，把山影与天光一日日画在木片上。入雨季以后，许多木片再也添不上记号。\n\n连日阴雨让驿卒看不到日影，误时的粮队停在关门外。匠人带来一只[Concept('hbe_history_timekeeping', '漏壶')|e]，认为流水计时可以补足山口的缺陷。漏壶需要定期校验，也会消耗驿站人手。几个关将希望把它留在军营，书生则请求与城中旧刻相互对照。"
 hbe_story_northern_shudao.2.desc.after_b: "山口立起测影的表，书记记下各处山势的差别。连日阴云却让新旧刻度都失去了依凭。\n\n连日阴雨让驿卒看不到日影，误时的粮队停在关门外。匠人带来一只[Concept('hbe_history_timekeeping', '漏壶')|e]，认为流水计时可以补足山口的缺陷。漏壶需要定期校验，也会消耗驿站人手。几个关将希望把它留在军营，书生则请求与城中旧刻相互对照。"
 hbe_story_northern_shudao.2.desc.after_c: "关牌先依统一时刻换发，守军按牌轮戍。粮队遇上阴雨时，驿卒仍难说明究竟误了多少时辰。\n\n连日阴雨让驿卒看不到日影，误时的粮队停在关门外。匠人带来一只[Concept('hbe_history_timekeeping', '漏壶')|e]，认为流水计时可以补足山口的缺陷。漏壶需要定期校验，也会消耗驿站人手。几个关将希望把它留在军营，书生则请求与城中旧刻相互对照。"
 hbe_story_northern_shudao.3.desc.after_a: "驿站轮值看漏壶，没有另添村役。看壶人留下的几张报刻纸，正好可以拿来核对历书。\n\n新抄的历书预告月食，山口观测者却没有看到记载的景象。寺院的讲者认为这是灾异，府学怀疑抄录时弄错了日期。驿卒保留的几份时刻记录可以帮助查验，但公开核对也会使掌历者难堪。"
 hbe_story_northern_shudao.3.desc.after_b: "水刻与日影互校，几处驿站记下了同一夜的时刻。掌历者开始让他们照新历候月。\n\n新抄的历书预告月食，山口观测者却没有看到记载的景象。寺院的讲者认为这是灾异，府学怀疑抄录时弄错了日期。驿卒保留的几份时刻记录可以帮助查验，但公开核对也会使掌历者难堪。"
 hbe_story_northern_shudao.3.desc.after_c: "关军先配了漏壶，开闭关门较从前整齐。府学请守更人保留一晚记录，待月食后送来查验。\n\n新抄的历书预告月食，山口观测者却没有看到记载的景象。寺院的讲者认为这是灾异，府学怀疑抄录时弄错了日期。驿卒保留的几份时刻记录可以帮助查验，但公开核对也会使掌历者难堪。"
 hbe_story_northern_shudao.4.desc.after_a: "各站的记录送进府学，祈禳费也停收了。书生开始寻找一处能长期对照天象的地方。\n\n平地书生建议在府城建星台，山口观测者却说高处能避开许多灯火和烟尘。供养官担心高台离驿路太远，材料难以运到。若让村民无偿搬石，旧有岗役就会再度加重。我们也可以缩小星台，把几处记录点连起来使用。"
 hbe_story_northern_shudao.4.desc.after_b: "历书经公开复核，抄错与实见分别记下。参与查验的人请求有一处安放仪器的常设观测点。\n\n平地书生建议在府城建星台，山口观测者却说高处能避开许多灯火和烟尘。供养官担心高台离驿路太远，材料难以运到。若让村民无偿搬石，旧有岗役就会再度加重。我们也可以缩小星台，把几处记录点连起来使用。"
 hbe_story_northern_shudao.4.desc.after_c: "军府祭礼安定了关民，守更者仍奉命保存夜间记录。关将希望此后能在近处校验时刻。\n\n平地书生建议在府城建星台，山口观测者却说高处能避开许多灯火和烟尘。供养官担心高台离驿路太远，材料难以运到。若让村民无偿搬石，旧有岗役就会再度加重。我们也可以缩小星台，把几处记录点连起来使用。"
 hbe_story_northern_shudao.5.desc.after_a: "小台以雇工修成，村落记录点也保留下来。府学很快发现，各处簿册比石料更难按时送到。\n\n山路受阻后，几处测候簿无法按时送到府城。驿吏想借机把所有测候者纳入驿役，村寨却坚持只按旧约交送。书坊愿教村民抄写副本，只需府署承担纸墨。关将则希望把原件锁在各自的关库，免得泄露夜间守望。"
 hbe_story_northern_shudao.5.desc.after_b: "高处星台立起，供养人按期送粮。山路一旦不通，台上的观测便只能积在当地。\n\n山路受阻后，几处测候簿无法按时送到府城。驿吏想借机把所有测候者纳入驿役，村寨却坚持只按旧约交送。书坊愿教村民抄写副本，只需府署承担纸墨。关将则希望把原件锁在各自的关库，免得泄露夜间守望。"
 hbe_story_northern_shudao.5.desc.after_c: "关城兼作星台，守望与观测共用人手。各关保管的记录，却渐渐用了不同的抄法。\n\n山路受阻后，几处测候簿无法按时送到府城。驿吏想借机把所有测候者纳入驿役，村寨却坚持只按旧约交送。书坊愿教村民抄写副本，只需府署承担纸墨。关将则希望把原件锁在各自的关库，免得泄露夜间守望。"
 hbe_story_northern_shudao.6.desc.after_a: "副本由府库供纸墨，各站仍照旧约送簿。匠人如今可以带着抄本，比较不同器具留下的刻度。\n\n商队带来一件刻度细密的[Concept('hbe_history_timekeeping', '观测器')|e]，府学请匠人仿制，旧掌历者却担心异乡技法使自己的历法失去地位。军府更关心它能否帮助测距。我们可以把新器纳入观测，也可以只用于关防，或继续优先修整现有的器物。"
 hbe_story_northern_shudao.6.desc.after_b: "各站学会誊录互校，一处漏记可以拿另一处补看。商队带来的新器因而有了可供试较的旧簿。\n\n商队带来一件刻度细密的[Concept('hbe_history_timekeeping', '观测器')|e]，府学请匠人仿制，旧掌历者却担心异乡技法使自己的历法失去地位。军府更关心它能否帮助测距。我们可以把新器纳入观测，也可以只用于关防，或继续优先修整现有的器物。"
 hbe_story_northern_shudao.6.desc.after_c: "观测原件留在关库，军人接管交送。关将开始留意商队所说、也许能兼作测距的新器具。\n\n商队带来一件刻度细密的[Concept('hbe_history_timekeeping', '观测器')|e]，府学请匠人仿制，旧掌历者却担心异乡技法使自己的历法失去地位。军府更关心它能否帮助测距。我们可以把新器纳入观测，也可以只用于关防，或继续优先修整现有的器物。"
 hbe_story_northern_shudao.7.desc.after_a: "匠人修整过旧器，许多小处偏差记进工簿。主持测候的人开始教年轻书记辨认这些修补。\n\n主持测候的学者去世，家族请求由长子继任。几处驿站却推举了熟悉观测的年轻书记，他们还未得到显赫家族的担保。若把测候职位世袭下去，早年的共同记录可能成为一家私藏；若公开择人，也要安置旧掌历者的家属。"
 hbe_story_northern_shudao.7.desc.after_b: "府学准许比较异乡技法，年轻人轮流照看新旧器物。旧掌历者也将自己的校验簿交来。\n\n主持测候的学者去世，家族请求由长子继任。几处驿站却推举了熟悉观测的年轻书记，他们还未得到显赫家族的担保。若把测候职位世袭下去，早年的共同记录可能成为一家私藏；若公开择人，也要安置旧掌历者的家属。"
 hbe_story_northern_shudao.7.desc.after_c: "军匠仿制新器，用于关防测距。关军手里的观测与修器记录随之多了起来。\n\n主持测候的学者去世，家族请求由长子继任。几处驿站却推举了熟悉观测的年轻书记，他们还未得到显赫家族的担保。若把测候职位世袭下去，早年的共同记录可能成为一家私藏；若公开择人，也要安置旧掌历者的家属。"
 hbe_story_northern_shudao.8.desc.after_a: "旧学者的家属得到供养，各站也推举了接班者。新任书记正把分散的观测重新编入年册。\n\n各站已经能把日影、水刻和星辰记录互相核对。府城希望刊出新的山地历书，关军则要求先统一夜间传时。先人留下的记录既能服务学问，也能帮助守关。长期制度将决定测候者今后依靠府学、村寨，还是军府。"
 hbe_story_northern_shudao.8.desc.after_b: "观测簿成为择人的凭据，掌历职位没有照家谱传下去。新主持者请求把考核和刊历都定为常例。\n\n各站已经能把日影、水刻和星辰记录互相核对。府城希望刊出新的山地历书，关军则要求先统一夜间传时。先人留下的记录既能服务学问，也能帮助守关。长期制度将决定测候者今后依靠府学、村寨，还是军府。"
 hbe_story_northern_shudao.8.desc.after_c: "关军接过测候主持，将看器、报刻与守望分派下去。各关希望用同一份时刻表长期轮值。\n\n各站已经能把日影、水刻和星辰记录互相核对。府城希望刊出新的山地历书，关军则要求先统一夜间传时。先人留下的记录既能服务学问，也能帮助守关。长期制度将决定测候者今后依靠府学、村寨，还是军府。"
 hbe_story_central_hills.2.desc.after_a: "佃户得到减租，修埂的人领到了工钱。春雨没有再冲垮那段坡，去义仓的旧路却被新土埂隔断了。\n\n新修的梯埂挡住了村民去义仓的近路，筑埂者却说若拆开缺口，雨水便会再次冲走土壤。粮商要求另修道路。几户田主愿出地，却不愿再出役夫。若府署继续依赖旧役额，修好的梯田也会让乡里生出新的怨恨。"
 hbe_story_central_hills.2.desc.after_b: "测绘者画出坡面和来水，试种田旁也筑起一段护埂。邻村来取粮的人发现近路不能照旧走了。\n\n新修的梯埂挡住了村民去义仓的近路，筑埂者却说若拆开缺口，雨水便会再次冲走土壤。粮商要求另修道路。几户田主愿出地，却不愿再出役夫。若府署继续依赖旧役额，修好的梯田也会让乡里生出新的怨恨。"
 hbe_story_central_hills.2.desc.after_c: "掌田官重核田册后安排修治，田主依新册恢复收租。新埂所在的田界，又恰好压住一条旧路。\n\n新修的梯埂挡住了村民去义仓的近路，筑埂者却说若拆开缺口，雨水便会再次冲走土壤。粮商要求另修道路。几户田主愿出地，却不愿再出役夫。若府署继续依赖旧役额，修好的梯田也会让乡里生出新的怨恨。"
 hbe_story_central_hills.3.desc.after_a: "府库出钱接上便道，村民不必从埂上踩过。修路时，他们又提出上游小坝的蓄水办法。\n\n村民在溪沟建起小坝，几处坡田因此能留住灌溉水。下游的磨坊主指称溪水变少，要求拆坝。乡老愿分季放水，磨坊主却只接受明确的契纸。水土工程逐渐改变了地方的旧有收益，我们不能只看坝上增出的粮食。"
 hbe_story_central_hills.3.desc.after_b: "排水缺口经过几场雨的试验，书记记下哪里最易冲坏。村民把相似的办法用到了溪沟小坝上。\n\n村民在溪沟建起小坝，几处坡田因此能留住灌溉水。下游的磨坊主指称溪水变少，要求拆坝。乡老愿分季放水，磨坊主却只接受明确的契纸。水土工程逐渐改变了地方的旧有收益，我们不能只看坝上增出的粮食。"
 hbe_story_central_hills.3.desc.after_c: "便道按田界划出，田主承担了议定的工役。附近几户也依各自田界谈起坝上蓄水的分配。\n\n村民在溪沟建起小坝，几处坡田因此能留住灌溉水。下游的磨坊主指称溪水变少，要求拆坝。乡老愿分季放水，磨坊主却只接受明确的契纸。水土工程逐渐改变了地方的旧有收益，我们不能只看坝上增出的粮食。"
 hbe_story_central_hills.4.desc.after_a: "磨坊停磨得到补偿，坝上坝下开始按季分水。丰水时闲下的坡地，引来府学的人试种绿肥。\n\n府学提出在休耕地种植护土绿肥，几户佃农已经试出了较稳的收成。田主却认为休耕地仍应缴纳旧租。若承认试种期间减租，其他田主也会要求补偿；若坚持原额，村民便没有余力继续试种。"
 hbe_story_central_hills.4.desc.after_b: "来水量与坝口大小有了记录，几处田也能分清灌水次序。佃户想试试，留住水以后还能怎样养土。\n\n府学提出在休耕地种植护土绿肥，几户佃农已经试出了较稳的收成。田主却认为休耕地仍应缴纳旧租。若承认试种期间减租，其他田主也会要求补偿；若坚持原额，村民便没有余力继续试种。"
 hbe_story_central_hills.4.desc.after_c: "水权入了田册，府署可以据册核租。田主随即问起，休耕地若换种护土作物，租额是否照旧。\n\n府学提出在休耕地种植护土绿肥，几户佃农已经试出了较稳的收成。田主却认为休耕地仍应缴纳旧租。若承认试种期间减租，其他田主也会要求补偿；若坚持原额，村民便没有余力继续试种。"
 hbe_story_central_hills.5.desc.after_a: "试种田获准减租，乡民将收成写进共用记录。仓吏随后翻出旧年的借粮册，想看看这些田过去借过多少粮。\n\n二十余年积下的仓册记着旱年与水灾，年轻书记发现修埂最多的村落往往少借一些赈粮。仓吏希望据此改变赈贷额度。贫村担心自己因无力修埂而失去救助。府署须决定把记录用于共同修治，还是用于区分各村责任。"
 hbe_story_central_hills.5.desc.after_b: "不同坡地按计划试种，主持者把土色、收成与投入逐年对照。有人提议再把赈贷记录一并拿来。\n\n二十余年积下的仓册记着旱年与水灾，年轻书记发现修埂最多的村落往往少借一些赈粮。仓吏希望据此改变赈贷额度。贫村担心自己因无力修埂而失去救助。府署须决定把记录用于共同修治，还是用于区分各村责任。"
 hbe_story_central_hills.5.desc.after_c: "成熟田块重新入册，田主因推广得到奖励。掌仓人也想据这些新田册调整各村的赈贷。\n\n二十余年积下的仓册记着旱年与水灾，年轻书记发现修埂最多的村落往往少借一些赈粮。仓吏希望据此改变赈贷额度。贫村担心自己因无力修埂而失去救助。府署须决定把记录用于共同修治，还是用于区分各村责任。"
 hbe_story_central_hills.6.desc.after_a: "无力修埂的村落得到资助，种粮和雇工分开记账。下一季，他们也想有机会试种商人带来的新种。\n\n商人带来适于坡地的新种，佃农希望在瘠地试种，田主却要求先保证旧有粮租。府学认为它可能减少饥荒，也担心陌生作物改变土壤。我们可以为试种承担头几年的风险，也可以只准在划出的田块上种植，或让田主自行决定。"
 hbe_story_central_hills.6.desc.after_b: "仓册与坡田图合在一起校核，书记看清了几处受灾的差别。府学想在瘠地上再试一种作物。\n\n商人带来适于坡地的新种，佃农希望在瘠地试种，田主却要求先保证旧有粮租。府学认为它可能减少饥荒，也担心陌生作物改变土壤。我们可以为试种承担头几年的风险，也可以只准在划出的田块上种植，或让田主自行决定。"
 hbe_story_central_hills.6.desc.after_c: "赈贷与税额按田况重核，田主有了新的分担凭据。商人带来新种时，双方又争起试种期该怎样计租。\n\n商人带来适于坡地的新种，佃农希望在瘠地试种，田主却要求先保证旧有粮租。府学认为它可能减少饥荒，也担心陌生作物改变土壤。我们可以为试种承担头几年的风险，也可以只准在划出的田块上种植，或让田主自行决定。"
 hbe_story_central_hills.7.desc.after_a: "府署替贫户承担了试种担保，也留下口粮田。新住户因此接过一些坡地，却未必认得早年的修埂旧约。\n\n最初参与修埂的乡民渐渐退老，新住户拒绝按旧册承担维修。旧家族则说，自家祖辈出过土地，应当少出工钱。坡田需要持续修治，早年的功劳却不能替代眼下的人手。各村要求我们重订分担办法。"
 hbe_story_central_hills.7.desc.after_b: "试验田逐年留下记录，巡验者知道哪几段埂最不能失修。轮到摊派工钱时，旧出工册却遭到了质疑。\n\n最初参与修埂的乡民渐渐退老，新住户拒绝按旧册承担维修。旧家族则说，自家祖辈出过土地，应当少出工钱。坡田需要持续修治，早年的功劳却不能替代眼下的人手。各村要求我们重订分担办法。"
 hbe_story_central_hills.7.desc.after_c: "田主出资推广新种，租额也写入契纸。新旧田户都希望，今后的修埂份额能照眼下的受益重算。\n\n最初参与修埂的乡民渐渐退老，新住户拒绝按旧册承担维修。旧家族则说，自家祖辈出过土地，应当少出工钱。坡田需要持续修治，早年的功劳却不能替代眼下的人手。各村要求我们重订分担办法。"
 hbe_story_central_hills.8.desc.after_a: "各村改按受益田亩分担，祖辈供过地的住户也须说明眼下的份额。乡老请求把这条办法写进乡约。\n\n旧年常被冲坏的坡地已能耕种，义仓也保存着历年接续的账簿。乡老请求把修治写成乡约，掌田官希望合并所有田册。前者让村落共同主持水土，后者让府署掌握租额与责任。我们最后选择的制度，将影响后人怎样守住这些田。"
 hbe_story_central_hills.8.desc.after_b: "巡验簿公开每次修补，接任者能查出谁出过工、谁领过钱。府署想让这些散簿有一处共同归档。\n\n旧年常被冲坏的坡地已能耕种，义仓也保存着历年接续的账簿。乡老请求把修治写成乡约，掌田官希望合并所有田册。前者让村落共同主持水土，后者让府署掌握租额与责任。我们最后选择的制度，将影响后人怎样守住这些田。"
 hbe_story_central_hills.8.desc.after_c: "田册重新列明维修责任，由田主担保落实。掌田官请求把分水、租额与工役并成一套常册。\n\n旧年常被冲坏的坡地已能耕种，义仓也保存着历年接续的账簿。乡老请求把修治写成乡约，掌田官希望合并所有田册。前者让村落共同主持水土，后者让府署掌握租额与责任。我们最后选择的制度，将影响后人怎样守住这些田。"
 hbe_story_western_tea_horse.2.desc.after_a: "牧人领了治马的工钱，也获准在本地旅居。驮马渐能行走后，茶队开始照他的办法寻找山草。\n\n牧人用山草洗伤口，几匹驮马恢复了行走。药商却抬高同类草药的价格，声称只有自己的采办能保证药性。山民愿带人寻找草场，军府则要求收走整批药材。若不处理采办，新的技法也会只让少数马商受益。"
 hbe_story_western_tea_horse.2.desc.after_b: "医者跟着牧人记下修蹄和洗伤的做法，药单渐渐传到别的茶队，采药的人也多起来。\n\n牧人用山草洗伤口，几匹驮马恢复了行走。药商却抬高同类草药的价格，声称只有自己的采办能保证药性。山民愿带人寻找草场，军府则要求收走整批药材。若不处理采办，新的技法也会只让少数马商受益。"
 hbe_story_western_tea_horse.2.desc.after_c: "可用战马先由军府收治，照料者把草药用量报进官册。药商很快听到了新的采办消息。\n\n牧人用山草洗伤口，几匹驮马恢复了行走。药商却抬高同类草药的价格，声称只有自己的采办能保证药性。山民愿带人寻找草场，军府则要求收走整批药材。若不处理采办，新的技法也会只让少数马商受益。"
 hbe_story_western_tea_horse.3.desc.after_a: "山民按采办领钱，茶队可以向不同人买药。到了冬天，养病马所需的草场却难再临时筹措。\n\n商队请求在村落冬牧场养病马，村民担心自己的牛羊没有草吃。马商愿付租，但只肯向一位村寨头领交钱。牧人提出分区轮牧，府署需要先确认谁有权出租这些草场。缺少这一层安排，医马人便无法维持牲畜过冬。"
 hbe_story_western_tea_horse.3.desc.after_b: "药圃留出几处试方，医者分记伤马的恢复。天气转冷以后，留下观察的马群需要另找冬牧地。\n\n商队请求在村落冬牧场养病马，村民担心自己的牛羊没有草吃。马商愿付租，但只肯向一位村寨头领交钱。牧人提出分区轮牧，府署需要先确认谁有权出租这些草场。缺少这一层安排，医马人便无法维持牲畜过冬。"
 hbe_story_western_tea_horse.3.desc.after_c: "官马药材归军府统一采办，供药暂时稳定。官吏又要求在驿路附近为病马找一处冬牧场。\n\n商队请求在村落冬牧场养病马，村民担心自己的牛羊没有草吃。马商愿付租，但只肯向一位村寨头领交钱。牧人提出分区轮牧，府署需要先确认谁有权出租这些草场。缺少这一层安排，医马人便无法维持牲畜过冬。"
 hbe_story_western_tea_horse.4.desc.after_a: "各村户分得牧租，原有牛羊的草地也留下了。来往马群日渐聚到几处共同水口。\n\n病马沿驿路传播，高价战马和普通驮马都出现相似症状。驿吏要求继续开市，医马人则请求暂时隔开新来的马群。停市会损害茶商收入，不停市可能让更多牲畜患病。军府催促我们保证下一季能够征调的马数。"
 hbe_story_western_tea_horse.4.desc.after_b: "分区轮牧试行后，医马人得以比较各处恢复情况。下一批沿驿路来的马，却带来了相似的病症。\n\n病马沿驿路传播，高价战马和普通驮马都出现相似症状。驿吏要求继续开市，医马人则请求暂时隔开新来的马群。停市会损害茶商收入，不停市可能让更多牲畜患病。军府催促我们保证下一季能够征调的马数。"
 hbe_story_western_tea_horse.4.desc.after_c: "官马冬牧地划定，村寨按议得到补偿。驿路不断送来新马，苑中也开始出现来历不明的病畜。\n\n病马沿驿路传播，高价战马和普通驮马都出现相似症状。驿吏要求继续开市，医马人则请求暂时隔开新来的马群。停市会损害茶商收入，不停市可能让更多牲畜患病。军府催促我们保证下一季能够征调的马数。"
 hbe_story_western_tea_horse.5.desc.after_a: "停市的损失得到赔付，新旧马群分开照料。等道路恢复，养病母马也陆续生下了幼驹。\n\n医马人照料的母马生下小驹，马商希望提前订购，军府要求按旧约优先挑选。牧人认为长期收治应当留下一部分后代。这批幼马既能补充商队，也能改变本府的马源。我们必须把繁育收益与照料责任一起分配。"
 hbe_story_western_tea_horse.5.desc.after_b: "隔离圈与逐站追查留下了病历，医马人终于能找出一些相似的来路。几匹挺过疫病的母马已经产驹。\n\n医马人照料的母马生下小驹，马商希望提前订购，军府要求按旧约优先挑选。牧人认为长期收治应当留下一部分后代。这批幼马既能补充商队，也能改变本府的马源。我们必须把繁育收益与照料责任一起分配。"
 hbe_story_western_tea_horse.5.desc.after_c: "军府先稳住官马供给，并限制民间转售。照料过这些马的牧人如今来问，所生幼驹应当归谁。\n\n医马人照料的母马生下小驹，马商希望提前订购，军府要求按旧约优先挑选。牧人认为长期收治应当留下一部分后代。这批幼马既能补充商队，也能改变本府的马源。我们必须把繁育收益与照料责任一起分配。"
 hbe_story_western_tea_horse.6.desc.after_a: "一部分幼马留给牧户，商队也可以预订。到验马时，牧人发现适合窄路的小马仍卖不过低地大马。\n\n低地来的大马在山路上耗粮更多，山中小马却能驮着茶篓经过窄道。军府仍按体格给马定价，牧人提出按路段衡量。若重定马价，旧马商会失去一些收益；若维持旧标准，适合山路的牲畜便得不到供养。"
 hbe_story_western_tea_horse.6.desc.after_b: "繁育簿将血缘与病历连起来，医马人能说明每匹幼马的来历。旧市价却仍只看体格高矮。\n\n低地来的大马在山路上耗粮更多，山中小马却能驮着茶篓经过窄道。军府仍按体格给马定价，牧人提出按路段衡量。若重定马价，旧马商会失去一些收益；若维持旧标准，适合山路的牲畜便得不到供养。"
 hbe_story_western_tea_horse.6.desc.after_c: "官苑按约优先选马，并给照料者补偿。军官挑走高大的马，茶队却来问能走窄道的小马在哪里。\n\n低地来的大马在山路上耗粮更多，山中小马却能驮着茶篓经过窄道。军府仍按体格给马定价，牧人提出按路段衡量。若重定马价，旧马商会失去一些收益；若维持旧标准，适合山路的牲畜便得不到供养。"
 hbe_story_western_tea_horse.7.desc.after_a: "按用途收马以后，山路驮马有了相应价钱。更多牧户愿意送孩子跟医马人学手艺。\n\n学舍里既有府城医者，也有牧户子弟，旧行会要求只向有担保的家族传授技法。年轻人却已能独自处理几种常见马病。封闭传习可以保护行会，开放学舍则能让更多驿站获得帮助。军府愿支付工钱，条件是毕业者先为官马效力。"
 hbe_story_western_tea_horse.7.desc.after_b: "不同路段的试行记进簿中，年轻人跟着量过脚程，也已学会几种常见的修蹄办法。\n\n学舍里既有府城医者，也有牧户子弟，旧行会要求只向有担保的家族传授技法。年轻人却已能独自处理几种常见马病。封闭传习可以保护行会，开放学舍则能让更多驿站获得帮助。军府愿支付工钱，条件是毕业者先为官马效力。"
 hbe_story_western_tea_horse.7.desc.after_c: "军用标准保留，山路辅助马另行供养。官苑需要更多会照料这两类马的人，便向学舍催要学生。\n\n学舍里既有府城医者，也有牧户子弟，旧行会要求只向有担保的家族传授技法。年轻人却已能独自处理几种常见马病。封闭传习可以保护行会，开放学舍则能让更多驿站获得帮助。军府愿支付工钱，条件是毕业者先为官马效力。"
 hbe_story_western_tea_horse.8.desc.after_a: "牧户子弟获准入舍，旧师傅收下几名没有家族担保的年轻人。沿路驿站开始请他们去照料病马。\n\n两代牧人留下的药方与病历已经能帮助新商队越过山口。府署希望把医马学舍定为常设，军府则主张把它并入官苑。前者依靠开放传习维持茶路，后者能为官马提供稳定照料。早年来此的牧户也要求在新章程上保留自己的名字。"
 hbe_story_western_tea_horse.8.desc.after_b: "治马记录成为考核依据，药方也向学者公开。毕业的年轻人请求有一份能长期做下去的差事。\n\n两代牧人留下的药方与病历已经能帮助新商队越过山口。府署希望把医马学舍定为常设，军府则主张把它并入官苑。前者依靠开放传习维持茶路，后者能为官马提供稳定照料。早年来此的牧户也要求在新章程上保留自己的名字。"
 hbe_story_western_tea_horse.8.desc.after_c: "官苑给医马人固定工钱，学生按约先为官马效力。军府请求把这项供养定为常设。\n\n两代牧人留下的药方与病历已经能帮助新商队越过山口。府署希望把医马学舍定为常设，军府则主张把它并入官苑。前者依靠开放传习维持茶路，后者能为官马提供稳定照料。早年来此的牧户也要求在新章程上保留自己的名字。"
 hbe_story_southwestern_valleys.2.desc.after_a: "两寨开始共同看桥，旧桥钱的损失也有补偿。准备开工时，双方拿来的凭据却只有各自保存的木契。\n\n新桥所需人手已备齐，村寨却只带来木刻的旧约。府城书记坚持所有承诺都应改成纸契，织绳人担心自己认不得新条文。翻译者愿把两种凭证并存，掌关官则希望纸契由府署独存。桥尚未接通，保管权已成为各方最在意的事。"
 hbe_story_southwestern_valleys.2.desc.after_b: "织绳人和匠人合议过桥头做法，材料与人手也点过数。等到签认工钱，府城书记却读不懂村寨的旧木刻。\n\n新桥所需人手已备齐，村寨却只带来木刻的旧约。府城书记坚持所有承诺都应改成纸契，织绳人担心自己认不得新条文。翻译者愿把两种凭证并存，掌关官则希望纸契由府署独存。桥尚未接通，保管权已成为各方最在意的事。"
 hbe_story_southwestern_valleys.2.desc.after_c: "府署设下桥头，准备统一通行费。村寨依旧带着祖辈的木契来认工役，不肯只收一张看不懂的纸。\n\n新桥所需人手已备齐，村寨却只带来木刻的旧约。府城书记坚持所有承诺都应改成纸契，织绳人担心自己认不得新条文。翻译者愿把两种凭证并存，掌关官则希望纸契由府署独存。桥尚未接通，保管权已成为各方最在意的事。"
 hbe_story_southwestern_valleys.3.desc.after_a: "木契与纸契都获准作证，织绳人照两份凭记领工。雨季到来时，他们又抱着旧契赶到桥头。\n\n暴雨冲断一股主绳，过桥的商队暂时停在山寨。旧桥户愿出绳，要求先减免下一年的桥税。守军主张立即抽丁修复，匠人则希望先检查所有受力处。赶工或查验都会占用乡里的劳力，我们须承担相应的后果。"
 hbe_story_southwestern_valleys.3.desc.after_b: "年轻人学着用两种文字记桥工，匠人领料也有了对照。第一场暴雨却让新抄的簿册添上了急修一项。\n\n暴雨冲断一股主绳，过桥的商队暂时停在山寨。旧桥户愿出绳，要求先减免下一年的桥税。守军主张立即抽丁修复，匠人则希望先检查所有受力处。赶工或查验都会占用乡里的劳力，我们须承担相应的后果。"
 hbe_story_southwestern_valleys.3.desc.after_c: "纸契由府署保管，工役份额逐项确认。雨季桥上出事，村寨便请掌契的官吏照约安排人手。\n\n暴雨冲断一股主绳，过桥的商队暂时停在山寨。旧桥户愿出绳，要求先减免下一年的桥税。守军主张立即抽丁修复，匠人则希望先检查所有受力处。赶工或查验都会占用乡里的劳力，我们须承担相应的后果。"
 hbe_story_southwestern_valleys.4.desc.after_a: "桥户减了税，也领到修复的工钱。换下来的旧绳摊在桥头，铁匠看过后提出新的做法。\n\n铁匠提出以铁索替代部分主绳，木桥户却担心自己失去维修生计。运铁进谷的成本也远高于原有草绳。商人愿垫付材料，条件是获得多年桥钱。村寨可以继续自修，府署也能为铁索承担头一笔费用。"
 hbe_story_southwestern_valleys.4.desc.after_b: "所有受力处查过一遍，主绳整组更换。匠人把磨损最重的几段留给入谷的铁匠比较。\n\n铁匠提出以铁索替代部分主绳，木桥户却担心自己失去维修生计。运铁进谷的成本也远高于原有草绳。商人愿垫付材料，条件是获得多年桥钱。村寨可以继续自修，府署也能为铁索承担头一笔费用。"
 hbe_story_southwestern_valleys.4.desc.after_c: "守军和役夫先接通了要道，赶路的商队得以出谷。桥户却提醒官吏，同样的草绳下次还会磨断。\n\n铁匠提出以铁索替代部分主绳，木桥户却担心自己失去维修生计。运铁进谷的成本也远高于原有草绳。商人愿垫付材料，条件是获得多年桥钱。村寨可以继续自修，府署也能为铁索承担头一笔费用。"
 hbe_story_southwestern_valleys.5.desc.after_a: "村寨继续养桥，铁索只在几段试用。桥头方便了驮队通行，商人随后要求添设摊棚。\n\n新桥让牲畜和商货更容易通过，谷中不同村寨也开始争夺集市位置。旧桥户指责新来商人没有参加修桥，却分走了生意。桥约必须处理这些新增收益。我们可以重定共用集市，也可以按出资分配桥边摊位。"
 hbe_story_southwestern_valleys.5.desc.after_b: "府库出了铁钱，当地匠人学会接索和养护。来试桥的驮队留下后，桥边很快聚起新摊。\n\n新桥让牲畜和商货更容易通过，谷中不同村寨也开始争夺集市位置。旧桥户指责新来商人没有参加修桥，却分走了生意。桥约必须处理这些新增收益。我们可以重定共用集市，也可以按出资分配桥边摊位。"
 hbe_story_southwestern_valleys.5.desc.after_c: "关桥署募集铁钱，收费期限也写进凭契。出资者因而提出，桥旁铺位也该先给自己经营。\n\n新桥让牲畜和商货更容易通过，谷中不同村寨也开始争夺集市位置。旧桥户指责新来商人没有参加修桥，却分走了生意。桥约必须处理这些新增收益。我们可以重定共用集市，也可以按出资分配桥边摊位。"
 hbe_story_southwestern_valleys.6.desc.after_a: "各寨留有摊位，过客也获准交易。邻谷的人来市上时，顺道打听本谷能否借出养桥匠人。\n\n邻谷的桥在山洪中受损，请求借用我们的铁匠和绳匠。本谷村民担心新雨将至，反对把维修人手送走。若两谷能互相供养工匠，以后便可共同应对水患；若优先守住本谷，我们也须接受邻谷下次拒绝援手。"
 hbe_story_southwestern_valleys.6.desc.after_b: "出资与维修记录列入定期重议，各寨开始按实际投入说话。邻谷求援的使者也带着一份自家的损桥清单。\n\n邻谷的桥在山洪中受损，请求借用我们的铁匠和绳匠。本谷村民担心新雨将至，反对把维修人手送走。若两谷能互相供养工匠，以后便可共同应对水患；若优先守住本谷，我们也须接受邻谷下次拒绝援手。"
 hbe_story_southwestern_valleys.6.desc.after_c: "铺位依关署许可分配，商货税费有了主持。邻谷桥坏后，第一个来借人的也是关署派出的信使。\n\n邻谷的桥在山洪中受损，请求借用我们的铁匠和绳匠。本谷村民担心新雨将至，反对把维修人手送走。若两谷能互相供养工匠，以后便可共同应对水患；若优先守住本谷，我们也须接受邻谷下次拒绝援手。"
 hbe_story_southwestern_valleys.7.desc.after_a: "两谷出钱共同供养匠人，修桥时可以相互调派。几次借人之后，旧丁额已不能说明各家的实出。\n\n最初签订桥约的人已陆续退任，年轻村民不愿继续按祖辈的丁额出工。关署认为旧约仍有效，商人则希望改成按货量缴钱。桥还需要人照料，旧有功劳却不足以分配眼下的负担。新章程必须明确谁能参与重新议约。"
 hbe_story_southwestern_valleys.7.desc.after_b: "匠人依两谷水势改进桥脚，查验与借料逐项记下。年轻村民拿着这些新簿，开始质疑旧约中的工额。\n\n最初签订桥约的人已陆续退任，年轻村民不愿继续按祖辈的丁额出工。关署认为旧约仍有效，商人则希望改成按货量缴钱。桥还需要人照料，旧有功劳却不足以分配眼下的负担。新章程必须明确谁能参与重新议约。"
 hbe_story_southwestern_valleys.7.desc.after_c: "关署只派出议定的人手，本谷仍得优先维修。接下来的桥工点名，却有年轻人不肯再按祖辈的丁额应役。\n\n最初签订桥约的人已陆续退任，年轻村民不愿继续按祖辈的丁额出工。关署认为旧约仍有效，商人则希望改成按货量缴钱。桥还需要人照料，旧有功劳却不足以分配眼下的负担。新章程必须明确谁能参与重新议约。"
 hbe_story_southwestern_valleys.8.desc.after_a: "各寨重新推举议约人，年轻的出工者也能带着凭据入席。他们请求把互借工匠与通行办法合成新约。\n\n绳桥、铁索与桥边集市已经把几处山谷连在一起。村寨愿把互助定成长期桥约，关署则希望统一处理税费和防务。共同主持可以保留各谷的声音，统一关署能使过路人只面对一套规则。最后的安排将决定后人怎样使用这些桥。"
 hbe_story_southwestern_valleys.8.desc.after_b: "分担照使用与维修重核，几家旧桥户也须说明眼下的份额。账算清后，各谷请求留下一份共用凭约。\n\n绳桥、铁索与桥边集市已经把几处山谷连在一起。村寨愿把互助定成长期桥约，关署则希望统一处理税费和防务。共同主持可以保留各谷的声音，统一关署能使过路人只面对一套规则。最后的安排将决定后人怎样使用这些桥。"
 hbe_story_southwestern_valleys.8.desc.after_c: "旧桥约收入关署公账，桥工与商货统一核算。官吏想把这套办法推广到连通的几处山谷。\n\n绳桥、铁索与桥边集市已经把几处山谷连在一起。村寨愿把互助定成长期桥约，关署则希望统一处理税费和防务。共同主持可以保留各谷的声音，统一关署能使过路人只面对一套规则。最后的安排将决定后人怎样使用这些桥。"
 hbe_short_chengdu_plain.2.desc.after_a: "府库垫上货期的损失，旧缸停用待查。染户另试的布样已经晾过几轮，学徒也带来了下料记号。\n\n新的试染布被挂在同一面墙上，旧缸中的颜色仍先褪去。学徒请求把记号抄成正式的染簿，师傅担心配方随之传到其他作坊。订单已经补交，怎样保存这份记录成为新的争执。学徒把沾着靛色的纸片一张张铺平；师傅先伸手遮住了其中两行下料数目。"
 hbe_short_chengdu_plain.2.desc.after_b: "订单按担保补交，坊主暂时守住了买主。学徒却留着几片褪色试布，还想查明旧缸出了什么问题。\n\n新的试染布被挂在同一面墙上，旧缸中的颜色仍先褪去。学徒请求把记号抄成正式的染簿，师傅担心配方随之传到其他作坊。订单已经补交，怎样保存这份记录成为新的争执。学徒把沾着靛色的纸片一张张铺平；师傅先伸手遮住了其中两行下料数目。"
 hbe_short_chengdu_plain.2.desc.after_c: "几家染户共同分担试染，把不同缸里的布挂在一起。学徒留下的记号终于有人拿来逐项核对。\n\n新的试染布被挂在同一面墙上，旧缸中的颜色仍先褪去。学徒请求把记号抄成正式的染簿，师傅担心配方随之传到其他作坊。订单已经补交，怎样保存这份记录成为新的争执。学徒把沾着靛色的纸片一张张铺平；师傅先伸手遮住了其中两行下料数目。"
 hbe_short_chengdu_plain.3.desc.after_a: "公用染簿已经抄成，学徒的名字留在试色旁。别家染户照簿试过颜色，也想接下一批货。\n\n新缸已经烧好，买主愿再试一批货。师傅提出由旧行会统一验色，年轻染户则希望凭试布争取订单。府署须决定最初为坏锦支付的代价，最后应换来一家作坊的信用，还是更广的技艺传习。买主把新布迎光抖开，又问柜后那些还没有行会印记的年轻人，谁能担保下一批也不褪色。"
 hbe_short_chengdu_plain.3.desc.after_b: "染簿交回本坊，配方没有外传。买主听说旧缸已查清，托人来问下一批锦什么时候交。\n\n新缸已经烧好，买主愿再试一批货。师傅提出由旧行会统一验色，年轻染户则希望凭试布争取订单。府署须决定最初为坏锦支付的代价，最后应换来一家作坊的信用，还是更广的技艺传习。买主把新布迎光抖开，又问柜后那些还没有行会印记的年轻人，谁能担保下一批也不褪色。"
 hbe_short_chengdu_plain.3.desc.after_c: "各坊只见到耐色结果，仍须自行摸索配方。几家年轻染户带来自己的试布，请求参加新一轮验货。\n\n新缸已经烧好，买主愿再试一批货。师傅提出由旧行会统一验色，年轻染户则希望凭试布争取订单。府署须决定最初为坏锦支付的代价，最后应换来一家作坊的信用，还是更广的技艺传习。买主把新布迎光抖开，又问柜后那些还没有行会印记的年轻人，谁能担保下一批也不褪色。"
 hbe_short_chengdu_plain.12.desc.after_a: "府库出了修屋钱，诗卷得以暂留旧宅。书生趁这段时日补抄缺页，发现两份抄本的题名并不相同。\n\n两份抄本的作者姓名不同，旧宅主人说是祖辈手误，收藏者却希望沿用较有名气的一位。书生请求保留疑问，不把推测刻成事实。掌礼官认为未定作者的诗不宜用在官宴。两张抄页写着同一句诗，题下却是不同的人名。书生不肯替任何一张涂去旧字，只请掌礼官把两页一同看完。"
 hbe_short_chengdu_plain.12.desc.after_b: "原买卖照旧履行，书生只抄下当时可见的篇页。送书以前，收藏者却拿出另一份署名不同的抄本。\n\n两份抄本的作者姓名不同，旧宅主人说是祖辈手误，收藏者却希望沿用较有名气的一位。书生请求保留疑问，不把推测刻成事实。掌礼官认为未定作者的诗不宜用在官宴。两张抄页写着同一句诗，题下却是不同的人名。书生不肯替任何一张涂去旧字，只请掌礼官把两页一同看完。"
 hbe_short_chengdu_plain.12.desc.after_c: "收藏者供钱整理，诗卷的来源也公开了。书生比对旁人送来的散页时，发现作者姓名对不上。\n\n两份抄本的作者姓名不同，旧宅主人说是祖辈手误，收藏者却希望沿用较有名气的一位。书生请求保留疑问，不把推测刻成事实。掌礼官认为未定作者的诗不宜用在官宴。两张抄页写着同一句诗，题下却是不同的人名。书生不肯替任何一张涂去旧字，只请掌礼官把两页一同看完。"
 hbe_short_chengdu_plain.13.desc.after_a: "两种署名与疑问一同刊出，书生没有强定作者。读过抄本的邻人开始请求亲自听他讲诗。\n\n抄本终于离开了潮湿的箱子，邻里请求借旧宅办一次讲读。主人担心来客会损坏门窗，书坊愿收席钱维修。我们可以供养公共讲读，也可以让旧宅只接待受邀的宾客。邻人已经凑来几张长凳，主人却先在门槛旁放了一只收礼的盒子。书坊的人站在院中，等着决定这场讲读要发几份读本。"
 hbe_short_chengdu_plain.13.desc.after_b: "官宴沿用了通行署名，收藏者保住了预期的声名。旧宅里的抄本仍引来一些想听诗的人。\n\n抄本终于离开了潮湿的箱子，邻里请求借旧宅办一次讲读。主人担心来客会损坏门窗，书坊愿收席钱维修。我们可以供养公共讲读，也可以让旧宅只接待受邀的宾客。邻人已经凑来几张长凳，主人却先在门槛旁放了一只收礼的盒子。书坊的人站在院中，等着决定这场讲读要发几份读本。"
 hbe_short_chengdu_plain.13.desc.after_c: "诗卷留在府学查验，官宴另选了篇目。书生整理旧卷的消息却已传遍邻里，有人想在旧宅办讲读。\n\n抄本终于离开了潮湿的箱子，邻里请求借旧宅办一次讲读。主人担心来客会损坏门窗，书坊愿收席钱维修。我们可以供养公共讲读，也可以让旧宅只接待受邀的宾客。邻人已经凑来几张长凳，主人却先在门槛旁放了一只收礼的盒子。书坊的人站在院中，等着决定这场讲读要发几份读本。"
 hbe_short_chengdu_plain.22.desc.after_a: "两村暂按共用办法采竹，已伐的料也得到补偿。照料竹林的人清理旧径时，找到一块埋在残根旁的小碑。\n\n向导在旧竹丛中找到一块小碑，碑上写的是共养竹林的轮伐次序。碑并不能说明所有边界，却使只凭地契的一方陷入尴尬。府署可以恢复轮伐，也可以把旧碑只当作辅助见证。碑角缺了一块，两边乡老各自补说了不同的旧事。向导只认得自己挖出它的位置，不肯替哪一方证明整座山。"
 hbe_short_chengdu_plain.22.desc.after_b: "山脊旧图仍是裁断的凭据，乡老暂时保住了担保。新住户沿界查找旧记，翻出一块另记轮伐的石碑。\n\n向导在旧竹丛中找到一块小碑，碑上写的是共养竹林的轮伐次序。碑并不能说明所有边界，却使只凭地契的一方陷入尴尬。府署可以恢复轮伐，也可以把旧碑只当作辅助见证。碑角缺了一块，两边乡老各自补说了不同的旧事。向导只认得自己挖出它的位置，不肯替哪一方证明整座山。"
 hbe_short_chengdu_plain.22.desc.after_c: "两村向导领钱查界，沿旧竹径认过水口。在一处倒伏竹丛下面，他们发现了碑上留下的旧约。\n\n向导在旧竹丛中找到一块小碑，碑上写的是共养竹林的轮伐次序。碑并不能说明所有边界，却使只凭地契的一方陷入尴尬。府署可以恢复轮伐，也可以把旧碑只当作辅助见证。碑角缺了一块，两边乡老各自补说了不同的旧事。向导只认得自己挖出它的位置，不肯替哪一方证明整座山。"
 hbe_short_chengdu_plain.23.desc.after_a: "轮伐恢复，新户也有了采竹份额。两村拿着同一份次序，准备与渠署谈下一季的料价。\n\n两村愿提供春竹，但各自要求先结清查界时的工钱。渠署请求把竹料长期列入官办供应，竹农则希望按季议价。新的界约应当把采办的收益与照料竹山的责任一同写明。竹农带来新笋的估数，渠署却拿着去年签过的料价。查界人的工钱也还压在同一张账后，谁都不愿先供下一批。"
 hbe_short_chengdu_plain.23.desc.after_b: "现契得到承认，共用竹料另行补偿。两村仍各有采办的份额，都想知道下一季怎样结钱。\n\n两村愿提供春竹，但各自要求先结清查界时的工钱。渠署请求把竹料长期列入官办供应，竹农则希望按季议价。新的界约应当把采办的收益与照料竹山的责任一同写明。竹农带来新笋的估数，渠署却拿着去年签过的料价。查界人的工钱也还压在同一张账后，谁都不愿先供下一批。"
 hbe_short_chengdu_plain.23.desc.after_c: "碑文与界图一并登记，竹农可以照册查认轮伐。渠署随后请求把来年的竹料也写进供应约。\n\n两村愿提供春竹，但各自要求先结清查界时的工钱。渠署请求把竹料长期列入官办供应，竹农则希望按季议价。新的界约应当把采办的收益与照料竹山的责任一同写明。竹农带来新笋的估数，渠署却拿着去年签过的料价。查界人的工钱也还压在同一张账后，谁都不愿先供下一批。"
 hbe_short_southern_salt_wine.2.desc.after_a: "灶工领到停灶工钱，伤者得以休养。拆下的铜管送到匠人案上，管口几道细裂终于显了出来。\n\n匠人查出管口受冷时会缩动，接头应当留出余量。老井主请求把办法只用于自家井灶，灶工希望其他作坊也能少受一次伤。掌盐官提出以公开查验换取新井采办。匠人把冷水浇在接头上，细缝又冒出一线卤水。灶工围着看，盐署来的吏员却先问样管应当盖谁的印。"
 hbe_short_southern_salt_wine.2.desc.after_b: "旧木管先恢复了出卤，井主另付夜班钱。铜管没有再上灶，匠人得以慢慢查验漏水的接头。\n\n匠人查出管口受冷时会缩动，接头应当留出余量。老井主请求把办法只用于自家井灶，灶工希望其他作坊也能少受一次伤。掌盐官提出以公开查验换取新井采办。匠人把冷水浇在接头上，细缝又冒出一线卤水。灶工围着看，盐署来的吏员却先问样管应当盖谁的印。"
 hbe_short_southern_salt_wine.2.desc.after_c: "匠人与井主共同修补，灶工也来指认漏水时的位置。几次冷暖试过之后，接头留下了新的裂痕。\n\n匠人查出管口受冷时会缩动，接头应当留出余量。老井主请求把办法只用于自家井灶，灶工希望其他作坊也能少受一次伤。掌盐官提出以公开查验换取新井采办。匠人把冷水浇在接头上，细缝又冒出一线卤水。灶工围着看，盐署来的吏员却先问样管应当盖谁的印。"
 hbe_short_southern_salt_wine.3.desc.after_a: "接头做法公开，别井也派人来试装。铜管渐能连续出水，原来挑卤的人却少了活计。\n\n铜管终于能连续出水，几个原来的挑卤工却被井主辞退。他们曾在停灶时帮忙修管，请求转学煎盐。府署可供养传习，也可只给一笔工钱，把雇用交给井主。原来的挑卤人还留着扁担，站在已经不用来回运卤的井道边。他们不是来拆新管，只想知道下月还能到哪里领工钱。"
 hbe_short_southern_salt_wine.3.desc.after_b: "改法留作本井秘法，匠人领了奖励。井主换好铜管后，开始缩减原来挑卤的班次。\n\n铜管终于能连续出水，几个原来的挑卤工却被井主辞退。他们曾在停灶时帮忙修管，请求转学煎盐。府署可供养传习，也可只给一笔工钱，把雇用交给井主。原来的挑卤人还留着扁担，站在已经不用来回运卤的井道边。他们不是来拆新管，只想知道下月还能到哪里领工钱。"
 hbe_short_southern_salt_wine.3.desc.after_c: "盐署定下管样，各井照样验收。连续供卤省下许多人手，一些参与装管的工人反而失去了旧差。\n\n铜管终于能连续出水，几个原来的挑卤工却被井主辞退。他们曾在停灶时帮忙修管，请求转学煎盐。府署可供养传习，也可只给一笔工钱，把雇用交给井主。原来的挑卤人还留着扁担，站在已经不用来回运卤的井道边。他们不是来拆新管，只想知道下月还能到哪里领工钱。"
 hbe_short_southern_salt_wine.12.desc.after_a: "府库垫付破瓮损失，船户与窑工腾出一趟空船试装。垫草和瓮肩的差别随即显了出来。\n\n试装发现薄瓮需要更厚的垫草，省下的陶料未必能抵过装载成本。年轻窑工提出改做圆肩，船帮希望继续用熟悉的老瓮。新器具可以试行，旧办法也有稳定交货的价值。两种空瓮摆在码头，一只轻，一只耐碰。装船人要把它们放进同一段水路里比较，货主却只愿付一次足额船费。"
 hbe_short_southern_salt_wine.12.desc.after_b: "旧船约结清货损，酒货先照原行期出发。窑工不愿下次再赔，仍带着几只空瓮请船户比较装法。\n\n试装发现薄瓮需要更厚的垫草，省下的陶料未必能抵过装载成本。年轻窑工提出改做圆肩，船帮希望继续用熟悉的老瓮。新器具可以试行，旧办法也有稳定交货的价值。两种空瓮摆在码头，一只轻，一只耐碰。装船人要把它们放进同一段水路里比较，货主却只愿付一次足额船费。"
 hbe_short_southern_salt_wine.12.desc.after_c: "窑户与船户共同担保新货，双方都得承担破损。他们于是约在码头，把两种装载办法逐一试过。\n\n试装发现薄瓮需要更厚的垫草，省下的陶料未必能抵过装载成本。年轻窑工提出改做圆肩，船帮希望继续用熟悉的老瓮。新器具可以试行，旧办法也有稳定交货的价值。两种空瓮摆在码头，一只轻，一只耐碰。装船人要把它们放进同一段水路里比较，货主却只愿付一次足额船费。"
 hbe_short_southern_salt_wine.13.desc.after_a: "圆肩试烧得到资助，窑工按趟记下破损。商人看过试样，来问这批新瓮可否只替自己烧造。\n\n商人带来下一批酒货的订单，提出若改用试样中的新瓮，便愿付高价，但只准刻自己的铺号。窑工认为应刻烧造者的记号，船户则想在瓮底留下装载检验。府署可以让这些责任都被看见，也可以以一家担保简化交易。窑工先在湿坯上按了自己的记号，商人的伙计却说，若不磨掉这几个字，这一批便不算独供货。"
 hbe_short_southern_salt_wine.13.desc.after_b: "酒货换回熟悉的老瓮，船帮行期没有耽搁。商人仍看中了试样中的薄瓮，想单独订一批。\n\n商人带来下一批酒货的订单，提出若改用试样中的新瓮，便愿付高价，但只准刻自己的铺号。窑工认为应刻烧造者的记号，船户则想在瓮底留下装载检验。府署可以让这些责任都被看见，也可以以一家担保简化交易。窑工先在湿坯上按了自己的记号，商人的伙计却说，若不磨掉这几个字，这一批便不算独供货。"
 hbe_short_southern_salt_wine.13.desc.after_c: "几段水路分别试了装法，买主可以按运程选价。商人看中其中一种货样，提出一份独供订单。\n\n商人带来下一批酒货的订单，提出若改用试样中的新瓮，便愿付高价，但只准刻自己的铺号。窑工认为应刻烧造者的记号，船户则想在瓮底留下装载检验。府署可以让这些责任都被看见，也可以以一家担保简化交易。窑工先在湿坯上按了自己的记号，商人的伙计却说，若不磨掉这几个字，这一批便不算独供货。"
 hbe_short_southern_salt_wine.22.desc.after_a: "井工暂缓开凿，误期由府署补偿。师生趁停工抄完墓砖，也把几户人家的说法分别记下。\n\n师生抄出的图样记着采盐与祭祀，和几家声称的墓主不完全相合。乡老请求不要当众拆穿旧说，井主愿出钱修一处公墓。不同见证可以并存，也可以由府署统一裁断。几家认墓人都等着听裁处，师生却只能说明砖上画了什么。把图样记下来，与替墓主人补出一个姓氏，是两件不同的事。"
 hbe_short_southern_salt_wine.22.desc.after_b: "墓砖另行安葬，盐井照约开工。师生保留的拓样却与认墓人所说的家谱有些出入。\n\n师生抄出的图样记着采盐与祭祀，和几家声称的墓主不完全相合。乡老请求不要当众拆穿旧说，井主愿出钱修一处公墓。不同见证可以并存，也可以由府署统一裁断。几家认墓人都等着听裁处，师生却只能说明砖上画了什么。把图样记下来，与替墓主人补出一个姓氏，是两件不同的事。"
 hbe_short_southern_salt_wine.22.desc.after_c: "师生和乡老共同记录墓砖，认墓的几家也各留了见证。抄清图样以后，一些说法开始对不上。\n\n师生抄出的图样记着采盐与祭祀，和几家声称的墓主不完全相合。乡老请求不要当众拆穿旧说，井主愿出钱修一处公墓。不同见证可以并存，也可以由府署统一裁断。几家认墓人都等着听裁处，师生却只能说明砖上画了什么。把图样记下来，与替墓主人补出一个姓氏，是两件不同的事。"
 hbe_short_southern_salt_wine.23.desc.after_a: "几家的见证一同保存，府署没有强定墓主。新井出卤以后，村民希望在井旁留下共同的纪念。\n\n新井已经开出卤水，村民要求在井前留下纪念旧墓的石记。盐商认为这会使过客不安，想把碑移到村口。我们可以保留在原处，也可以把图样收入府学，让井场保持通行。祭礼要走的路恰好经过运卤的空地，井户怕误了出货。村民愿另定时辰，却不肯让碑上连井口旧址都不再提起。"
 hbe_short_southern_salt_wine.23.desc.after_b: "墓主与补偿依府署记录裁定，井户也按议办理。开井以后，村民又请求保留墓砖原处的石记。\n\n新井已经开出卤水，村民要求在井前留下纪念旧墓的石记。盐商认为这会使过客不安，想把碑移到村口。我们可以保留在原处，也可以把图样收入府学，让井场保持通行。祭礼要走的路恰好经过运卤的空地，井户怕误了出货。村民愿另定时辰，却不肯让碑上连井口旧址都不再提起。"
 hbe_short_southern_salt_wine.23.desc.after_c: "井户承担共同葬地的供养，迁放的砖样得以留存。村民仍想让过路人知道，新井下面原来有什么。\n\n新井已经开出卤水，村民要求在井前留下纪念旧墓的石记。盐商认为这会使过客不安，想把碑移到村口。我们可以保留在原处，也可以把图样收入府学，让井场保持通行。祭礼要走的路恰好经过运卤的空地，井户怕误了出货。村民愿另定时辰，却不肯让碑上连井口旧址都不再提起。"
 hbe_short_eastern_river.2.desc.after_a: "船夫与村寨领了试号的钱，沿江几处人相互应答。真到峡口试吹时，山壁却把回声送回了错误的方向。\n\n试号在峡中产生回声，听者仍会把上游和下游混淆。船夫建议辅以灯数，乡民却担心夜间灯油成为新的摊派。府署可以供油，也可以让受护的商船付费。试号的人隔岸挥手，喊声却从背后的岩壁传来。带灯的船夫提出再试一次，先来请取灯油的人却问这笔钱记在哪家账上。"
 hbe_short_eastern_river.2.desc.after_b: "军令先统一江号，祭礼另有时段。守号人照令试吹，仍发现两岸听见的方位不一样。\n\n试号在峡中产生回声，听者仍会把上游和下游混淆。船夫建议辅以灯数，乡民却担心夜间灯油成为新的摊派。府署可以供油，也可以让受护的商船付费。试号的人隔岸挥手，喊声却从背后的岩壁传来。带灯的船夫提出再试一次，先来请取灯油的人却问这笔钱记在哪家账上。"
 hbe_short_eastern_river.2.desc.after_c: "两套号分别登记，报水与祭礼各有用途。船夫试着辨认来源，却又被峡中的回声骗过一次。\n\n试号在峡中产生回声，听者仍会把上游和下游混淆。船夫建议辅以灯数，乡民却担心夜间灯油成为新的摊派。府署可以供油，也可以让受护的商船付费。试号的人隔岸挥手，喊声却从背后的岩壁传来。带灯的船夫提出再试一次，先来请取灯油的人却问这笔钱记在哪家账上。"
 hbe_short_eastern_river.3.desc.after_a: "府署供灯油，村民学着按灯数报汛。几趟粮船照新法过峡后，船帮开始询问怎样查阅整套办法。\n\n粮船依新号过峡，请求把夜行办法写进共同船约。军官想只向受护船只发券，船帮希望所有付过灯钱的人都能查阅。规则可以扩大，也可以留作军府的护航权。最后一张夜行券已经填好船名，码头还有几位出过灯钱的船主等着。他们想带走的既是许可，也是一份能自己辨认的夜号。"
 hbe_short_eastern_river.3.desc.after_b: "商船付费，关军统一设灯。灯油账送来结算时，船主也想知道交过钱究竟能换来什么权利。\n\n粮船依新号过峡，请求把夜行办法写进共同船约。军官想只向受护船只发券，船帮希望所有付过灯钱的人都能查阅。规则可以扩大，也可以留作军府的护航权。最后一张夜行券已经填好船名，码头还有几位出过灯钱的船主等着。他们想带走的既是许可，也是一份能自己辨认的夜号。"
 hbe_short_eastern_river.3.desc.after_c: "险滩先设了灯，其他江段仍照旧号行船。粮船走过几种信号交接的地方，请求有一份能随船携带的凭记。\n\n粮船依新号过峡，请求把夜行办法写进共同船约。军官想只向受护船只发券，船帮希望所有付过灯钱的人都能查阅。规则可以扩大，也可以留作军府的护航权。最后一张夜行券已经填好船名，码头还有几位出过灯钱的船主等着。他们想带走的既是许可，也是一份能自己辨认的夜号。"
 hbe_short_eastern_river.12.desc.after_a: "府署买下共用岸地，小船仍能入坞。船匠搬来旧工具，发现其中许多只适合修原来的小船。\n\n船坞重新清点接活所需的器具，木匠发现旧工具尚能修小船，却难以支撑商号提出的大船修造。岸地的安排尚须照旧契执行，添置工具又成了新的争执。商号愿出工具钱，要求匠人签下较长的供货约。我们可供公共工具，也可让匠人与商号自行担保。旧凿、长锯与新架的料价各列一行，账上却没有写明不用商号料钱的人能否照样借架。匠人想先把这一条问清，再领下一批木材。"
 hbe_short_eastern_river.12.desc.after_b: "商号承包岸地，雇用与船费写入契纸。清点旧器具时，船匠又发现大船修造还缺不少工具。\n\n船坞重新清点接活所需的器具，木匠发现旧工具尚能修小船，却难以支撑商号提出的大船修造。岸地的安排尚须照旧契执行，添置工具又成了新的争执。商号愿出工具钱，要求匠人签下较长的供货约。我们可供公共工具，也可让匠人与商号自行担保。旧凿、长锯与新架的料价各列一行，账上却没有写明不用商号料钱的人能否照样借架。匠人想先把这一条问清，再领下一批木材。"
 hbe_short_eastern_river.12.desc.after_c: "旧水道修通，搬坞暂缓。船匠仍在浅岸接活，商号提出的大船生意却需要另添器具。\n\n船坞重新清点接活所需的器具，木匠发现旧工具尚能修小船，却难以支撑商号提出的大船修造。岸地的安排尚须照旧契执行，添置工具又成了新的争执。商号愿出工具钱，要求匠人签下较长的供货约。我们可供公共工具，也可让匠人与商号自行担保。旧凿、长锯与新架的料价各列一行，账上却没有写明不用商号料钱的人能否照样借架。匠人想先把这一条问清，再领下一批木材。"
 hbe_short_eastern_river.13.desc.after_a: "公用工具买来后，匠人可以借用，不必先答应独供。新船一到，谁先用工架又有了争执。\n\n新船入坞时，几个老渔户仍被排在最后。船匠请求为小船保留固定时段，商号说停修一天大船损失更多。此前的岸地与工具契约并未说清小船的排期。府署如今须决定，修船时段应怎样在渔户与大船商之间分配。一条渔船已经在岸边等了两天，修大船的工架却一直没空。渔户带来的鱼坏了半筐，商号的伙计仍把下一张大船单压到最上面。"
 hbe_short_eastern_river.13.desc.after_b: "商号出钱添工具，匠人签下较长的供货约。等新船入坞，小渔户才发现自己的排期越来越靠后。\n\n新船入坞时，几个老渔户仍被排在最后。船匠请求为小船保留固定时段，商号说停修一天大船损失更多。此前的岸地与工具契约并未说清小船的排期。府署如今须决定，修船时段应怎样在渔户与大船商之间分配。一条渔船已经在岸边等了两天，修大船的工架却一直没空。渔户带来的鱼坏了半筐，商号的伙计仍把下一张大船单压到最上面。"
 hbe_short_eastern_river.13.desc.after_c: "新工架经过试用，师傅留下了操作记录。大小船都来找匠人，眼下的工架却只能轮着用。\n\n新船入坞时，几个老渔户仍被排在最后。船匠请求为小船保留固定时段，商号说停修一天大船损失更多。此前的岸地与工具契约并未说清小船的排期。府署如今须决定，修船时段应怎样在渔户与大船商之间分配。一条渔船已经在岸边等了两天，修大船的工架却一直没空。渔户带来的鱼坏了半筐，商号的伙计仍把下一张大船单压到最上面。"
 hbe_short_eastern_river.22.desc.after_a: "府署资助查记，村寨和拓工共同看过原样。拓本送进书铺后，乡老却认出纸上多了原石没有的题名。\n\n几张新拓本出现了原石没有的题名，商人说只是方便买主辨认。拓工要求把补题与原字分开，乡老认为不分清便会改写旧事。府署可公开核验，也可让商铺担保自己的题名。原字边沿残损，后添的题名反而格外清楚。拓工把纸转向窗光，请众人看墨色接上的那一道边。"
 hbe_short_eastern_river.22.desc.after_b: "拓本可以出售，村寨照约分成。买主送来一张新货样，上面却添了乡老从未见过的字。\n\n几张新拓本出现了原石没有的题名，商人说只是方便买主辨认。拓工要求把补题与原字分开，乡老认为不分清便会改写旧事。府署可公开核验，也可让商铺担保自己的题名。原字边沿残损，后添的题名反而格外清楚。拓工把纸转向窗光，请众人看墨色接上的那一道边。"
 hbe_short_eastern_river.22.desc.after_c: "拓售暂禁，寺院接下照料石刻的差事。此前流出的几张纸样仍在城中辗转，有人补了醒目的新题。\n\n几张新拓本出现了原石没有的题名，商人说只是方便买主辨认。拓工要求把补题与原字分开，乡老认为不分清便会改写旧事。府署可公开核验，也可让商铺担保自己的题名。原字边沿残损，后添的题名反而格外清楚。拓工把纸转向窗光，请众人看墨色接上的那一道边。"
 hbe_short_eastern_river.23.desc.after_a: "补题与原字公开分清，买主能够照说明认货。乡老仍担心，下一场雨会把尚未拓清的字磨去。\n\n石面缺损又扩大了，村寨愿搭小棚遮雨，却需要船户运木。买主希望把最完整的石块移走保存。我们可以让它留在峡中，也可以接受异地保管，或保留纸本而减少对山路的开凿。守石的人带来新掉下的碎屑，运木船主也报了搭棚的价。是否移走原石还没定，下一轮江雨却已经沿峡吹来。"
 hbe_short_eastern_river.23.desc.after_b: "商铺担保自己的题名，也受宣传称呼的限制。原石继续受雨水侵蚀，供货的人开始担心来年无样可拓。\n\n石面缺损又扩大了，村寨愿搭小棚遮雨，却需要船户运木。买主希望把最完整的石块移走保存。我们可以让它留在峡中，也可以接受异地保管，或保留纸本而减少对山路的开凿。守石的人带来新掉下的碎屑，运木船主也报了搭棚的价。是否移走原石还没定，下一轮江雨却已经沿峡吹来。"
 hbe_short_eastern_river.23.desc.after_c: "原样留进府学，另印的过峡故事供人阅读。看护石刻的人却来报，原处又掉下了一小片石面。\n\n石面缺损又扩大了，村寨愿搭小棚遮雨，却需要船户运木。买主希望把最完整的石块移走保存。我们可以让它留在峡中，也可以接受异地保管，或保留纸本而减少对山路的开凿。守石的人带来新掉下的碎屑，运木船主也报了搭棚的价。是否移走原石还没定，下一轮江雨却已经沿峡吹来。"
 hbe_short_northern_shudao.2.desc.after_a: "误扣的钱退回守更人，沙漏与水刻一起试用。拆漏的匠人发现，沙粒结住的地方恰好粗细不一。\n\n匠人发现沙粒大小不同，商人愿以另一批细沙替换，但要求独占驿站器具订单。年轻驿吏已经筛出合用的砂，请求公开筛法。府署可以把改进留给各站，也可以维持一家供货。两碗砂摆在漏口旁，一碗已经筛匀。商人指着随货来的供给纸，说修好这一只并不等于每座驿站都能照着自己做。"
 hbe_short_northern_shudao.2.desc.after_b: "更册仍照原报刻处理，守更者领了赏钱。为了少生下一次误时，匠人还是拆开旧漏查过细沙。\n\n匠人发现沙粒大小不同，商人愿以另一批细沙替换，但要求独占驿站器具订单。年轻驿吏已经筛出合用的砂，请求公开筛法。府署可以把改进留给各站，也可以维持一家供货。两碗砂摆在漏口旁，一碗已经筛匀。商人指着随货来的供给纸，说修好这一只并不等于每座驿站都能照着自己做。"
 hbe_short_northern_shudao.2.desc.after_c: "商号接下修漏的责任，并以行期作保。换沙时，年轻驿吏筛出了一小碗较匀净的砂。\n\n匠人发现沙粒大小不同，商人愿以另一批细沙替换，但要求独占驿站器具订单。年轻驿吏已经筛出合用的砂，请求公开筛法。府署可以把改进留给各站，也可以维持一家供货。两碗砂摆在漏口旁，一碗已经筛匀。商人指着随货来的供给纸，说修好这一只并不等于每座驿站都能照着自己做。"
 hbe_short_northern_shudao.3.desc.after_a: "筛沙的做法传到各站，驿卒自己也能修漏。试用时，他们开始把停漏与补刻写在更册边上。\n\n守更人用同一时刻比较几种漏壶，终于能把停漏记在更册边。关军不想让这些批注流出，担心过客据此猜到城门值夜。公开经验与维持守备，需要新的分界。更册边上多了一条停漏的短记，恰与城门换岗挨在一起。关将用手压住那一页，府学的人却还想抄走修漏的数目。"
 hbe_short_northern_shudao.3.desc.after_b: "商号独家供货，器具按期验收。守更人仍须逐夜记录停漏，免得把器具坏损算成自己误时。\n\n守更人用同一时刻比较几种漏壶，终于能把停漏记在更册边。关军不想让这些批注流出，担心过客据此猜到城门值夜。公开经验与维持守备，需要新的分界。更册边上多了一条停漏的短记，恰与城门换岗挨在一起。关将用手压住那一页，府学的人却还想抄走修漏的数目。"
 hbe_short_northern_shudao.3.desc.after_c: "府学留下两件器具比较，驿卒照约送来报刻。新添的批注渐渐比原来的更册正文还要细。\n\n守更人用同一时刻比较几种漏壶，终于能把停漏记在更册边。关军不想让这些批注流出，担心过客据此猜到城门值夜。公开经验与维持守备，需要新的分界。更册边上多了一条停漏的短记，恰与城门换岗挨在一起。关将用手压住那一页，府学的人却还想抄走修漏的数目。"
 hbe_short_northern_shudao.12.desc.after_a: "府署出钱雇人替岗，返乡的士兵赶上了农忙。两方书记随后把有争议的签押摊到一处，追查错记从何而来。\n\n两位书记把旧签押迎着窗光展开，发现回乡的日期没有涂改，抄进军册时却成了起役的日期。返乡士兵又交来当日退还腰牌的凭记，那几日缺役终于有了可查的来处。村民请求退回错扣的粮钱，军官却不愿当众承认旧册失准，怕下一次点名也遭质疑。书记提议在后堂重抄一册，士兵则希望新册上能留下亲手签认的地方，免得同一张旧押又被抄错。"
 hbe_short_northern_shudao.12.desc.after_b: "关军按军册补足役额，轮戍者领了赏钱。村中仍有人拿着回乡凭记，请求说明那几日为何重算。\n\n两位书记把旧签押迎着窗光展开，发现回乡的日期没有涂改，抄进军册时却成了起役的日期。返乡士兵又交来当日退还腰牌的凭记，那几日缺役终于有了可查的来处。村民请求退回错扣的粮钱，军官却不愿当众承认旧册失准，怕下一次点名也遭质疑。书记提议在后堂重抄一册，士兵则希望新册上能留下亲手签认的地方，免得同一张旧押又被抄错。"
 hbe_short_northern_shudao.12.desc.after_c: "有争议的追补暂缓，军官与村寨各派书记核账。两册终于翻到同一张签押，日期的错处显了出来。\n\n两位书记把旧签押迎着窗光展开，发现回乡的日期没有涂改，抄进军册时却成了起役的日期。返乡士兵又交来当日退还腰牌的凭记，那几日缺役终于有了可查的来处。村民请求退回错扣的粮钱，军官却不愿当众承认旧册失准，怕下一次点名也遭质疑。书记提议在后堂重抄一册，士兵则希望新册上能留下亲手签认的地方，免得同一张旧押又被抄错。"
 hbe_short_northern_shudao.13.desc.after_a: "错记公开更正，粮钱退回士兵家中。军官将改过的页交给村寨，准备据此编下一轮轮戍。\n\n下一轮名册送到村里，年轻人指着空栏问：换班迟到、提前回乡和病中替岗，应当各算哪一天。军官承认旧日期出了错，却仍须保证城门逐夜有人。府库可以预留雇替的钱，关军也愿集中供养一批常守的人；村寨则提出自己议定轮值，每季把工钱和实出日数送来查认。新册上的姓名已经写齐，这些空栏该怎样填，才会决定错账以后还会不会重来。"
 hbe_short_northern_shudao.13.desc.after_b: "官署在内部重抄名册，并给受影响者补偿。村民收了钱，仍希望下一轮不用再靠私下追认日期。\n\n下一轮名册送到村里，年轻人指着空栏问：换班迟到、提前回乡和病中替岗，应当各算哪一天。军官承认旧日期出了错，却仍须保证城门逐夜有人。府库可以预留雇替的钱，关军也愿集中供养一批常守的人；村寨则提出自己议定轮值，每季把工钱和实出日数送来查认。新册上的姓名已经写齐，这些空栏该怎样填，才会决定错账以后还会不会重来。"
 hbe_short_northern_shudao.13.desc.after_c: "士兵与乡老共同签下新册，回乡和起役的日子分别记清。军官随即送来下一季的值守安排。\n\n下一轮名册送到村里，年轻人指着空栏问：换班迟到、提前回乡和病中替岗，应当各算哪一天。军官承认旧日期出了错，却仍须保证城门逐夜有人。府库可以预留雇替的钱，关军也愿集中供养一批常守的人；村寨则提出自己议定轮值，每季把工钱和实出日数送来查认。新册上的姓名已经写齐，这些空栏该怎样填，才会决定错账以后还会不会重来。"
 hbe_short_northern_shudao.22.desc.after_a: "书箱逐一登记，赶马人领了误期钱。府学接过经卷时，也看见了夹在另一箱里的几本旧账。\n\n一箱账本里有本府商号的旧借据，几名货主请求取回，不愿公开。府学师生想借它们学习记账，商人担心姓名被传开。府署可以留匿名副本，也可把账本退还原主。借据上的欠数仍能辨认，姓名却恰在师生最想抄的一页。认领的商人愿送几册新纸，只求先把那本旧账从案上拿回。"
 hbe_short_northern_shudao.22.desc.after_b: "书箱照货主担保放行，师生随后开始清点所收经卷。夹带的旧账本却引来了几家本府商号认领。\n\n一箱账本里有本府商号的旧借据，几名货主请求取回，不愿公开。府学师生想借它们学习记账，商人担心姓名被传开。府署可以留匿名副本，也可把账本退还原主。借据上的欠数仍能辨认，姓名却恰在师生最想抄的一页。认领的商人愿送几册新纸，只求先把那本旧账从案上拿回。"
 hbe_short_northern_shudao.22.desc.after_c: "供学书箱免了关，其余照例纳钱。府学与货主分别取货时，几本缺页账册又出了归属争议。\n\n一箱账本里有本府商号的旧借据，几名货主请求取回，不愿公开。府学师生想借它们学习记账，商人担心姓名被传开。府署可以留匿名副本，也可把账本退还原主。借据上的欠数仍能辨认，姓名却恰在师生最想抄的一页。认领的商人愿送几册新纸，只求先把那本旧账从案上拿回。"
 hbe_short_northern_shudao.23.desc.after_a: "账本留下匿名副本，原姓名不向学舍公开。师生用过几回，便来请求以后也能稳定购到纸墨。\n\n书坊愿沿这条路继续供纸，要求统一免关凭证。关吏担心人人把商货写成教读，府学却缺稳定的纸墨。我们可以按用量立券，也可把采办统一交给关署。书坊把一季用纸的估数交来，关吏又列出上回几箱混装的账。若只写一句供学免关，下次过路的人便还要在山口争同样的话。"
 hbe_short_northern_shudao.23.desc.after_b: "账本退还原主，财货凭据照旧保护。府学少了这批教材，又向过路书坊询问能否常年供纸。\n\n书坊愿沿这条路继续供纸，要求统一免关凭证。关吏担心人人把商货写成教读，府学却缺稳定的纸墨。我们可以按用量立券，也可把采办统一交给关署。书坊把一季用纸的估数交来，关吏又列出上回几箱混装的账。若只写一句供学免关，下次过路的人便还要在山口争同样的话。"
 hbe_short_northern_shudao.23.desc.after_c: "行会核过旧账，只把记法公开给师生。书坊见府学确有用纸之需，开始谈下一批纸货的免关。\n\n书坊愿沿这条路继续供纸，要求统一免关凭证。关吏担心人人把商货写成教读，府学却缺稳定的纸墨。我们可以按用量立券，也可把采办统一交给关署。书坊把一季用纸的估数交来，关吏又列出上回几箱混装的账。若只写一句供学免关，下次过路的人便还要在山口争同样的话。"
 hbe_short_central_hills.2.desc.after_a: "两种谷分仓收下，贫户也得到交粮宽限。仓吏留下各田收成，下一季便能按地块比较新旧种。\n\n小粒谷在旱坡上结穗更好，水田里却不及旧种。乡老请求允许不同田块用不同种子，田主希望统一采办，省去反复查种的钱。府署可以保留差异，也可以只推广成熟田的标准。两块相邻田的谷穗放到一处，靠坡的一块与近水的一块恰好不同。记收的书记问，来年该照田势分种，还是照仓价分种。"
 hbe_short_central_hills.2.desc.after_b: "义仓依旧价收粮，仓册没有改动。几户新垦户仍在自家瘠地留了一小块新种，请人来看实收。\n\n小粒谷在旱坡上结穗更好，水田里却不及旧种。乡老请求允许不同田块用不同种子，田主希望统一采办，省去反复查种的钱。府署可以保留差异，也可以只推广成熟田的标准。两块相邻田的谷穗放到一处，靠坡的一块与近水的一块恰好不同。记收的书记问，来年该照田势分种，还是照仓价分种。"
 hbe_short_central_hills.2.desc.after_c: "谷种分给几处田做对照，种户把不同地势记在木牌上。到了收割时，几块田的差别便看得清了。\n\n小粒谷在旱坡上结穗更好，水田里却不及旧种。乡老请求允许不同田块用不同种子，田主希望统一采办，省去反复查种的钱。府署可以保留差异，也可以只推广成熟田的标准。两块相邻田的谷穗放到一处，靠坡的一块与近水的一块恰好不同。记收的书记问，来年该照田势分种，还是照仓价分种。"
 hbe_short_central_hills.3.desc.after_a: "种户依坡势分种，府署供了记录的纸墨。仓吏收齐几份账，开始盘算来年应留哪一种种粮。\n\n新种与旧种都要进入仓中，掌仓人请求多设一格，清楚记下借种与还种。田主愿出仓钱，条件是优先借到好种。我们可以设公共留种，也可以承认出资者的优先权。留种的木格只有几处空位，出过钱的仓户已经贴上姓名。没有余粮的借户仍站在门口，想知道开春还能不能来借。"
 hbe_short_central_hills.3.desc.after_b: "成熟田依统一标准记收，田租有了依据。小田种户仍捧来新谷，请求仓里为它留一个格子。\n\n新种与旧种都要进入仓中，掌仓人请求多设一格，清楚记下借种与还种。田主愿出仓钱，条件是优先借到好种。我们可以设公共留种，也可以承认出资者的优先权。留种的木格只有几处空位，出过钱的仓户已经贴上姓名。没有余粮的借户仍站在门口，想知道开春还能不能来借。"
 hbe_short_central_hills.3.desc.after_c: "贫户自愿领种试用，几块瘠田留下了收成。供过种粮的人来问，下一季是否应当由自己先借。\n\n新种与旧种都要进入仓中，掌仓人请求多设一格，清楚记下借种与还种。田主愿出仓钱，条件是优先借到好种。我们可以设公共留种，也可以承认出资者的优先权。留种的木格只有几处空位，出过钱的仓户已经贴上姓名。没有余粮的借户仍站在门口，想知道开春还能不能来借。"
 hbe_short_central_hills.12.desc.after_a: "不同剪枝的桑树留下记号，桑农照叶期记了几次采收。蚕户拿这些新叶试养，也留下了成蚕的差别。\n\n蚕户发现不同龄的春蚕吃叶也不同，新枝并非处处合用。老师傅愿参与记录，却请求不要让外乡人的姓名列在最前。府署可以并记发现，也可以按行会旧次序刊册。写册的人空着署名一栏，桑农和蚕师都等着。叶从哪家来、蚕由谁养，两份记录缺了任何一边都难查明。"
 hbe_short_central_hills.12.desc.after_b: "旧采叶合同继续履行，桑农没能改掉议定的交货量。他仍留几株树照信上剪枝，把叶另送熟识的蚕户。\n\n蚕户发现不同龄的春蚕吃叶也不同，新枝并非处处合用。老师傅愿参与记录，却请求不要让外乡人的姓名列在最前。府署可以并记发现，也可以按行会旧次序刊册。写册的人空着署名一栏，桑农和蚕师都等着。叶从哪家来、蚕由谁养，两份记录缺了任何一边都难查明。"
 hbe_short_central_hills.12.desc.after_c: "桑农获准自售桑叶，买主可以按叶色验货。几家蚕户试买以后，带着不同的成蚕记录找来。\n\n蚕户发现不同龄的春蚕吃叶也不同，新枝并非处处合用。老师傅愿参与记录，却请求不要让外乡人的姓名列在最前。府署可以并记发现，也可以按行会旧次序刊册。写册的人空着署名一栏，桑农和蚕师都等着。叶从哪家来、蚕由谁养，两份记录缺了任何一边都难查明。"
 hbe_short_central_hills.13.desc.after_a: "桑农与师傅并列署名，新法准许公开传习。收信人的旧乡亲族听说有了成册的办法，又寄信来问。\n\n女儿想把新册寄给旧乡，邻里担心别处学会后会抢走订单。书坊认为传来传去才能改进，行会主张只准本府收徒。府署须决定早先收到的一封信，能否再沿商路送回。回信的纸已经裁好，桑农却被告知不许抄走册中几页。旧乡当初愿寄来办法，如今正等着听本府试出的结果。"
 hbe_short_central_hills.13.desc.after_b: "小册按行会次序刊出，老师傅的名望得以保全。桑农仍想寄一册回旧乡，答复最初捎信的人。\n\n女儿想把新册寄给旧乡，邻里担心别处学会后会抢走订单。书坊认为传来传去才能改进，行会主张只准本府收徒。府署须决定早先收到的一封信，能否再沿商路送回。回信的纸已经裁好，桑农却被告知不许抄走册中几页。旧乡当初愿寄来办法，如今正等着听本府试出的结果。"
 hbe_short_central_hills.13.desc.after_c: "蚕户留下简册，照成蚕结果继续比较。桑农见几处田都能照着做，便想把后来补出的记录寄回旧乡。\n\n女儿想把新册寄给旧乡，邻里担心别处学会后会抢走订单。书坊认为传来传去才能改进，行会主张只准本府收徒。府署须决定早先收到的一封信，能否再沿商路送回。回信的纸已经裁好，桑农却被告知不许抄走册中几页。旧乡当初愿寄来办法，如今正等着听本府试出的结果。"
 hbe_short_central_hills.22.desc.after_a: "工钱抵去无据追加，借户暂时少了一笔欠项。债主送来另一本底册，旧账里的桥钱也随之露出来。\n\n商人交出一本原册，上面的利率较低。书记说后来的抄本混入了桥钱，债主要求不要让一次错抄损害多年信用。府署可以公开更正，也可安排双方在共同见证下重立契纸。新翻出的册子上，同一份桥料在不同年份各收过一次利。债主的家人请求到后堂重契，乡民却都等在堂外。"
 hbe_short_central_hills.22.desc.after_b: "债簿仍被承认，借户获得延期。乡民趁宽限核对旧收据，却发现债主另一册上的金额不同。\n\n商人交出一本原册，上面的利率较低。书记说后来的抄本混入了桥钱，债主要求不要让一次错抄损害多年信用。府署可以公开更正，也可安排双方在共同见证下重立契纸。新翻出的册子上，同一份桥料在不同年份各收过一次利。债主的家人请求到后堂重契，乡民却都等在堂外。"
 hbe_short_central_hills.22.desc.after_c: "府库买断贫户的一部分旧债，掌库人因而要求查看底账。债主拿来的另一册又添了几项陌生的利息。\n\n商人交出一本原册，上面的利率较低。书记说后来的抄本混入了桥钱，债主要求不要让一次错抄损害多年信用。府署可以公开更正，也可安排双方在共同见证下重立契纸。新翻出的册子上，同一份桥料在不同年份各收过一次利。债主的家人请求到后堂重契，乡民却都等在堂外。"
 hbe_short_central_hills.23.desc.after_a: "错计利息公开取消，乡民终于知道哪些钱付过两次。下一次修桥在即，他们不愿再照旧法借款。\n\n新的桥脚需要维修，先前的债主仍愿垫钱，但要求明确还期。乡民愿按受益出资，不再把费用压在几个穷户身上。府署可以改成共同公账，也可以以担保维持旧有垫款。修桥的人已把木料数点清，商人愿再垫一笔。上一回付过工钱的住户却不肯先签，要求把哪家借、哪家还当面写全。"
 hbe_short_central_hills.23.desc.after_b: "双方私下重订欠契，债主保住了名望。乡民却仍问，新一季桥工是否又得先从他家借钱。\n\n新的桥脚需要维修，先前的债主仍愿垫钱，但要求明确还期。乡民愿按受益出资，不再把费用压在几个穷户身上。府署可以改成共同公账，也可以以担保维持旧有垫款。修桥的人已把木料数点清，商人愿再垫一笔。上一回付过工钱的住户却不肯先签，要求把哪家借、哪家还当面写全。"
 hbe_short_central_hills.23.desc.after_c: "桥钱另列公账，共同见证者可以查阅。下一次修桥的人手已点齐，谁先垫料钱却还未定。\n\n新的桥脚需要维修，先前的债主仍愿垫钱，但要求明确还期。乡民愿按受益出资，不再把费用压在几个穷户身上。府署可以改成共同公账，也可以以担保维持旧有垫款。修桥的人已把木料数点清，商人愿再垫一笔。上一回付过工钱的住户却不肯先签，要求把哪家借、哪家还当面写全。"
 hbe_short_western_tea_horse.2.desc.after_a: "茶砖逐包分验，误期的钱也付给了驮户。搬货时，人们发现篓底的垫纸比上层先湿透。\n\n纸户提出在篾篓内加一层纸，茶商担心多花采办钱。试装能少受潮，却会增加驮马负担。我们可资助两种包装对照，也可让商人自己承担更换。纸户带来的垫样卷在旧篓旁，薄厚各不相同。驮户先试了马负，货主又问，少坏的茶是否抵得过多出的纸钱。"
 hbe_short_western_tea_horse.2.desc.after_b: "货价照旧约结清，茶队赶上行期。驮户不愿下一趟再赔损失，把湿篓留下请纸户查看。\n\n纸户提出在篾篓内加一层纸，茶商担心多花采办钱。试装能少受潮，却会增加驮马负担。我们可资助两种包装对照，也可让商人自己承担更换。纸户带来的垫样卷在旧篓旁，薄厚各不相同。驮户先试了马负，货主又问，少坏的茶是否抵得过多出的纸钱。"
 hbe_short_western_tea_horse.2.desc.after_c: "公用验茶按受潮程度分价，几家货主看过拆开的茶包。有人想让纸户试做更合用的篓底垫纸。\n\n纸户提出在篾篓内加一层纸，茶商担心多花采办钱。试装能少受潮，却会增加驮马负担。我们可资助两种包装对照，也可让商人自己承担更换。纸户带来的垫样卷在旧篓旁，薄厚各不相同。驮户先试了马负，货主又问，少坏的茶是否抵得过多出的纸钱。"
 hbe_short_western_tea_horse.3.desc.after_a: "新垫纸经过试装，马负与茶损分别记下。茶队带回空篓，也带回了几张沿途换过纸的记录。\n\n商队回市时带来用过的篾篓，茶户把遮盖与装载的得失逐一说给纸户听。纸户带来改过的垫纸试样，愿以较低价换取更广的订单；出资商号则要求，今后若采用新包装，须先给自己一段独供期限。府署可以公开做法，也可保护一段时间的独家供货。纸户想把折法教给下一家茶行，出资者却拿出旧订单，要求先写一段只供自家的日子。"
 hbe_short_western_tea_horse.3.desc.after_b: "旧篓继续使用，船马户多加遮盖。回程的人仍看过几种新包装，带回来问能否在下季试用。\n\n商队回市时带来用过的篾篓，茶户把遮盖与装载的得失逐一说给纸户听。纸户带来改过的垫纸试样，愿以较低价换取更广的订单；出资商号则要求，今后若采用新包装，须先给自己一段独供期限。府署可以公开做法，也可保护一段时间的独家供货。纸户想把折法教给下一家茶行，出资者却拿出旧订单，要求先写一段只供自家的日子。"
 hbe_short_western_tea_horse.3.desc.after_c: "商人换装的订单给了纸户，纸户照样交过一批。空篓回来后，旁人也想知道怎样折叠和垫放。\n\n商队回市时带来用过的篾篓，茶户把遮盖与装载的得失逐一说给纸户听。纸户带来改过的垫纸试样，愿以较低价换取更广的订单；出资商号则要求，今后若采用新包装，须先给自己一段独供期限。府署可以公开做法，也可保护一段时间的独家供货。纸户想把折法教给下一家茶行，出资者却拿出旧订单，要求先写一段只供自家的日子。"
 hbe_short_western_tea_horse.12.desc.after_a: "病马停下驮运，医马人领钱照料。剃去旧烙印旁的毛以后，一道更早的伤痕显了出来。\n\n医马人辨出第二处烙印盖在旧伤上，几位牧人记得这匹马曾从雪路走失。商人要求按买卖凭证处理，牧人请求考虑实际照料过它的人。府署可以并查旧伤与市契，也可只认可官验记录。老牧人用手指出旧伤的方向，官验人则认定烙印与市契齐全。两种见证都摆在眼前，单问马价已经答不了。"
 hbe_short_western_tea_horse.12.desc.after_b: "马匹依市契交给买主，并约定暂限使用。买主查看旧烙印时，发现它下面还有一块伤疤。\n\n医马人辨出第二处烙印盖在旧伤上，几位牧人记得这匹马曾从雪路走失。商人要求按买卖凭证处理，牧人请求考虑实际照料过它的人。府署可以并查旧伤与市契，也可只认可官验记录。老牧人用手指出旧伤的方向，官验人则认定烙印与市契齐全。两种见证都摆在眼前，单问马价已经答不了。"
 hbe_short_western_tea_horse.12.desc.after_c: "两方山寨担保寄养，照料人逐日看过马身。清洗烙印附近时，他认出一处在交割以前便有的旧伤。\n\n医马人辨出第二处烙印盖在旧伤上，几位牧人记得这匹马曾从雪路走失。商人要求按买卖凭证处理，牧人请求考虑实际照料过它的人。府署可以并查旧伤与市契，也可只认可官验记录。老牧人用手指出旧伤的方向，官验人则认定烙印与市契齐全。两种见证都摆在眼前，单问马价已经答不了。"
 hbe_short_western_tea_horse.13.desc.after_a: "牧人证词与伤痕一同查过，双方依新凭据结算。下一次冬市，卖马人想让验马时也留下这些见证。\n\n双方终于愿意按补价和照料费结案，请求以后在冬市先查烙印。旧验马人担心新规使自己失去主持，年轻牧人愿帮忙记马病。府署可训练共同验马，也可继续依旧验牌收货。下一拨马匹到市，验牌的人照旧伸手查印。牧户带着一册病历来，想在交钱之前也把伤病翻给买主看。"
 hbe_short_western_tea_horse.13.desc.after_b: "官验市契仍是裁断的依据，旧验牌照例使用。牧人却带着伤马病历，要求以后别再只看烙印。\n\n双方终于愿意按补价和照料费结案，请求以后在冬市先查烙印。旧验马人担心新规使自己失去主持，年轻牧人愿帮忙记马病。府署可训练共同验马，也可继续依旧验牌收货。下一拨马匹到市，验牌的人照旧伸手查印。牧户带着一册病历来，想在交钱之前也把伤病翻给买主看。"
 hbe_short_western_tea_horse.13.desc.after_c: "医马舍登记病历，双方议过补价交割。下一次买马的人听说此事，便想借那份病历预先查验。\n\n双方终于愿意按补价和照料费结案，请求以后在冬市先查烙印。旧验马人担心新规使自己失去主持，年轻牧人愿帮忙记马病。府署可训练共同验马，也可继续依旧验牌收货。下一拨马匹到市，验牌的人照旧伸手查印。牧户带着一册病历来，想在交钱之前也把伤病翻给买主看。"
 hbe_short_western_tea_horse.22.desc.after_a: "歇脚屋收了公款，准新旧旅人借火。守屋人接下差事，才发现柴草用得比原来估算的快。\n\n守屋人因为客人欠柴钱而关门，一名驿卒请求无钱者也能先借火。村寨认为善意不能代替冬天的草料。府署可以建立小额公账，也可以要求商队预付担保。守屋人把最后几根干柴放到桌边，来客却摸不出现钱。收柴的钱与救急的一把火，今夜必须有个说得明白的办法。"
 hbe_short_western_tea_horse.22.desc.after_b: "灶火先供军用，村寨照议得到补偿。赶路的商人仍来借宿，守屋人不知额外柴钱应向谁收。\n\n守屋人因为客人欠柴钱而关门，一名驿卒请求无钱者也能先借火。村寨认为善意不能代替冬天的草料。府署可以建立小额公账，也可以要求商队预付担保。守屋人把最后几根干柴放到桌边，来客却摸不出现钱。收柴的钱与救急的一把火，今夜必须有个说得明白的办法。"
 hbe_short_western_tea_horse.22.desc.after_c: "村寨自办歇脚屋，柴草费公开张贴。遇上有人身无现钱，守屋人却不知是否还该开门。\n\n守屋人因为客人欠柴钱而关门，一名驿卒请求无钱者也能先借火。村寨认为善意不能代替冬天的草料。府署可以建立小额公账，也可以要求商队预付担保。守屋人把最后几根干柴放到桌边，来客却摸不出现钱。收柴的钱与救急的一把火，今夜必须有个说得明白的办法。"
 hbe_short_western_tea_horse.23.desc.after_a: "小额公账供旅人借火，守屋人能够核销柴钱。雪季过去，他送来下一季修屋顶的料单。\n\n又一季的商队带来修屋的消息，小屋虽然能歇脚，屋顶却仍须按时维护。村寨愿保留冬用，守军想全年驻守，商人希望把屋旁变成交易处。府署须决定这一处歇脚，最后服务的是旅人、军路还是边市。旧顶梁还撑得住，补草与工钱却得在下一场雪前付清。村寨愿出人，商队希望换到稳定的歇脚时段。"
 hbe_short_western_tea_horse.23.desc.after_b: "商队预付柴草，守屋人依约收钱。雪季过去，商队又想知道来年能否一直保留落脚处。\n\n又一季的商队带来修屋的消息，小屋虽然能歇脚，屋顶却仍须按时维护。村寨愿保留冬用，守军想全年驻守，商人希望把屋旁变成交易处。府署须决定这一处歇脚，最后服务的是旅人、军路还是边市。旧顶梁还撑得住，补草与工钱却得在下一场雪前付清。村寨愿出人，商队希望换到稳定的歇脚时段。"
 hbe_short_western_tea_horse.23.desc.after_c: "客栈行会轮供柴草，山中小屋暂时撑过寒夜。负责轮供的人如今来问，破屋顶该由谁出钱修。\n\n又一季的商队带来修屋的消息，小屋虽然能歇脚，屋顶却仍须按时维护。村寨愿保留冬用，守军想全年驻守，商人希望把屋旁变成交易处。府署须决定这一处歇脚，最后服务的是旅人、军路还是边市。旧顶梁还撑得住，补草与工钱却得在下一场雪前付清。村寨愿出人，商队希望换到稳定的歇脚时段。"
 hbe_short_southwestern_valleys.2.desc.after_a: "盐货另雇了船，渔船继续照料打鱼与渡人。清理旧船时，船工仍在曾载重的地方发现了裂板。\n\n船板开裂后，盐商认为渔具划伤了船，渔户说货载过重。船匠愿查验，但须停船数日。府署可垫修船费，也可让出资者先决定修法。匠人把裂板翻给两家看，旧钉眼旁又添了新磨痕。盐商催着下水，船工却请先把下一趟能装多重写明。"
 hbe_short_southwestern_valleys.2.desc.after_b: "盐商预付约得到承认，渔户也领了赏钱。连跑几趟货以后，一块旧船板开始向舱里渗水。\n\n船板开裂后，盐商认为渔具划伤了船，渔户说货载过重。船匠愿查验，但须停船数日。府署可垫修船费，也可让出资者先决定修法。匠人把裂板翻给两家看，旧钉眼旁又添了新磨痕。盐商催着下水，船工却请先把下一趟能装多重写明。"
 hbe_short_southwestern_valleys.2.desc.after_c: "载货与渡人分了时段，两家照木牌轮用。换班检查时，船工发现船底有一处裂纹。\n\n船板开裂后，盐商认为渔具划伤了船，渔户说货载过重。船匠愿查验，但须停船数日。府署可垫修船费，也可让出资者先决定修法。匠人把裂板翻给两家看，旧钉眼旁又添了新磨痕。盐商催着下水，船工却请先把下一趟能装多重写明。"
 hbe_short_southwestern_valleys.3.desc.after_a: "府署垫付修船费，匠人与两家一同查过裂板。船下水以前，他们想把往后的轮用办法写清。\n\n船修好时，村寨提出把渡人也列在木牌上。盐商担心以后每次运货都要等人，渔户愿少收一点船钱换取固定时段。新的木牌可以成为共同安排，也可以只保证买卖。新木牌还没刻字，两家便各带来一份行期。村民等渡船的时刻，与盐货到岸的时刻又排到了一处。"
 hbe_short_southwestern_valleys.3.desc.after_b: "盐商先修好船，费用依约从货利扣回。渔户担心将来仍要先看货约，要求重新议定渡人时段。\n\n船修好时，村寨提出把渡人也列在木牌上。盐商担心以后每次运货都要等人，渔户愿少收一点船钱换取固定时段。新的木牌可以成为共同安排，也可以只保证买卖。新木牌还没刻字，两家便各带来一份行期。村民等渡船的时刻，与盐货到岸的时刻又排到了一处。"
 hbe_short_southwestern_valleys.3.desc.after_c: "两家共同修船，载重限额写进船契。等船重新下水，两方又来确认怎样轮派船工。\n\n船修好时，村寨提出把渡人也列在木牌上。盐商担心以后每次运货都要等人，渔户愿少收一点船钱换取固定时段。新的木牌可以成为共同安排，也可以只保证买卖。新木牌还没刻字，两家便各带来一份行期。村民等渡船的时刻，与盐货到岸的时刻又排到了一处。"
 hbe_short_southwestern_valleys.12.desc.after_a: "铁匠接下公仓订单，也能替住户做活。新门装好以后，寨主与粮户却各自要求保管钥匙。\n\n寨仓换上新锁，掌仓者把钥匙交给自己的亲族。仓中还存着住户寄放的粮，乡老因此要求共同开仓；铁匠的供货约却没有规定钥匙由谁保管。寨主认为公开钥匙会使仓粮失去保护。府署可设共同保管，也可只让官吏负责清点。两把钥匙放在粮册两侧，看仓人问谁来签下每次开门的时日。只要一方不到场，寄放的粮便也取不出来。"
 hbe_short_southwestern_valleys.12.desc.after_b: "独供约照旧履行，铁坊保住了炭料。寨仓装上新门，两方却都说自己的旧粮契准许开仓。\n\n寨仓换上新锁，掌仓者把钥匙交给自己的亲族。仓中还存着住户寄放的粮，乡老因此要求共同开仓；铁匠的供货约却没有规定钥匙由谁保管。寨主认为公开钥匙会使仓粮失去保护。府署可设共同保管，也可只让官吏负责清点。两把钥匙放在粮册两侧，看仓人问谁来签下每次开门的时日。只要一方不到场，寄放的粮便也取不出来。"
 hbe_short_southwestern_valleys.12.desc.after_c: "独供期限写进凭约，铁匠又接了别家的活。寨仓铁门做成，两把钥匙却找不到共同的保管办法。\n\n寨仓换上新锁，掌仓者把钥匙交给自己的亲族。仓中还存着住户寄放的粮，乡老因此要求共同开仓；铁匠的供货约却没有规定钥匙由谁保管。寨主认为公开钥匙会使仓粮失去保护。府署可设共同保管，也可只让官吏负责清点。两把钥匙放在粮册两侧，看仓人问谁来签下每次开门的时日。只要一方不到场，寄放的粮便也取不出来。"
 hbe_short_southwestern_valleys.13.desc.after_a: "开仓由两方登记，两把钥匙分开保管。借粮人来取种粮时，一方却以旧欠为由不肯到场。\n\n一名穷户因欠租被锁在仓外，自己的种粮也拿不出来。铁匠请求锁只保护财货，不成为无据扣粮的办法。府署可以按契查欠，也可以认可寨主的原有收租权。借粮人带着播种的空袋来，掌仓者却把旧租数盖在袋口。眼下不放种粮，秋后的欠数只会更难补齐。"
 hbe_short_southwestern_valleys.13.desc.after_b: "钥匙交寨主，府署按期查粮。借粮人捧着旧凭据来取粮，仍被寨主以欠租拦在门外。\n\n一名穷户因欠租被锁在仓外，自己的种粮也拿不出来。铁匠请求锁只保护财货，不成为无据扣粮的办法。府署可以按契查欠，也可以认可寨主的原有收租权。借粮人带着播种的空袋来，掌仓者却把旧租数盖在袋口。眼下不放种粮，秋后的欠数只会更难补齐。"
 hbe_short_southwestern_valleys.13.desc.after_c: "官署收管钥匙，看仓人领足工钱。查粮簿送来时，有人指出粮户的种粮也一并锁在旧欠之下。\n\n一名穷户因欠租被锁在仓外，自己的种粮也拿不出来。铁匠请求锁只保护财货，不成为无据扣粮的办法。府署可以按契查欠，也可以认可寨主的原有收租权。借粮人带着播种的空袋来，掌仓者却把旧租数盖在袋口。眼下不放种粮，秋后的欠数只会更难补齐。"
 hbe_short_southwestern_valleys.22.desc.after_a: "年轻译写人获准入席，能亲自说明契纸。他随后发现，同一袋粮在两种说法中竟有不同的分量。\n\n两份记录把一袋粮写成了两袋，青年认为此前长者转述时省去了一处解释。主持者不愿公开认错，村民请求立即减去追加的粮额。府署可公开更正，也可用公粮补回差额。粮袋已经抬到堂前，旧译与新译却各写一种分量。若只补足差额，不说明错在何处，下一张契纸仍会照旧抄。"
 hbe_short_southwestern_valleys.22.desc.after_b: "议事仍由长者转述，旧座次保留。译写人等在门外核对抄件，认出一笔转述过的粮数有误。\n\n两份记录把一袋粮写成了两袋，青年认为此前长者转述时省去了一处解释。主持者不愿公开认错，村民请求立即减去追加的粮额。府署可公开更正，也可用公粮补回差额。粮袋已经抬到堂前，旧译与新译却各写一种分量。若只补足差额，不说明错在何处，下一张契纸仍会照旧抄。"
 hbe_short_southwestern_valleys.22.desc.after_c: "译写席只负责核对契纸，暂不主持议事。年轻人比对两份凭记，发现旧译多算了一袋粮。\n\n两份记录把一袋粮写成了两袋，青年认为此前长者转述时省去了一处解释。主持者不愿公开认错，村民请求立即减去追加的粮额。府署可公开更正，也可用公粮补回差额。粮袋已经抬到堂前，旧译与新译却各写一种分量。若只补足差额，不说明错在何处，下一张契纸仍会照旧抄。"
 hbe_short_southwestern_valleys.23.desc.after_a: "粮数公开更正，译写人的见证得到保护。各寨便想在下一轮议事时，也带一名懂两种写法的人来。\n\n下一次议事前，主持者问译写席是否可以由自己的子弟继承。几个村寨认为应按记录能力推举，青年愿意教会更多人，也担心自己得到解释记录的机会后，后来者仍会被挡在门外。府署可以定考核，也可以承认旧席的传承。来学译写的年轻人站在旧座次后，族老指着祖辈的席牌。以后谁能看账、谁只能替人传话，须在新名册上写清。"
 hbe_short_southwestern_valleys.23.desc.after_b: "差额得到补回，主持者保住了声名。年轻译写人却问，日后是否还只能等长者替自己说话。\n\n下一次议事前，主持者问译写席是否可以由自己的子弟继承。几个村寨认为应按记录能力推举，青年愿意教会更多人，也担心自己得到解释记录的机会后，后来者仍会被挡在门外。府署可以定考核，也可以承认旧席的传承。来学译写的年轻人站在旧座次后，族老指着祖辈的席牌。以后谁能看账、谁只能替人传话，须在新名册上写清。"
 hbe_short_southwestern_valleys.23.desc.after_c: "双语对照留给各寨查认，错粮不再只凭口传。几个年轻人来请求，学习抄录以后也能轮流入席。\n\n下一次议事前，主持者问译写席是否可以由自己的子弟继承。几个村寨认为应按记录能力推举，青年愿意教会更多人，也担心自己得到解释记录的机会后，后来者仍会被挡在门外。府署可以定考核，也可以承认旧席的传承。来学译写的年轻人站在旧座次后，族老指着祖辈的席牌。以后谁能看账、谁只能替人传话，须在新名册上写清。"
 hbe_short_shared.2.desc.after_a: "迁户领了短期摊牌，新灶获准开火。赶上集日，两家摊主却在取水的井边争了起来。\n\n新摊户被挡在共井之外，只能另雇人取水。旧户担心客人多了会不够用，乡医提醒不洁的水会影响整个集市。井边挑水的人排到摊棚，旧铺说自己出过修井钱，新摊则带着已经交过的修亭收据。"
 hbe_short_shared.2.desc.after_b: "摊位仍照旧担保办理，本地铺位保留。外乡摊户为准备次日饭食来取水，又被旧井的规矩挡住。\n\n新摊户被挡在共井之外，只能另雇人取水。旧户担心客人多了会不够用，乡医提醒不洁的水会影响整个集市。井边挑水的人排到摊棚，旧铺说自己出过修井钱，新摊则带着已经交过的修亭收据。"
 hbe_short_shared.2.desc.after_c: "几处灶口共同验食，也按议分担修亭钱。添灶以后，用水却超过了原先由旧铺承担的份额。\n\n新摊户被挡在共井之外，只能另雇人取水。旧户担心客人多了会不够用，乡医提醒不洁的水会影响整个集市。井边挑水的人排到摊棚，旧铺说自己出过修井钱，新摊则带着已经交过的修亭收据。"
 hbe_short_shared.3.desc.after_a: "井口扩修，共用取水的工钱得到补偿。新旧摊主都能备食，接下来的生意便要谈长久摊牌了。\n\n新摊户希望留下，旧行会提出统一价目和名字。府署可以承认不同风味，也可纳入行会，或以卫生与质量定摊牌。几家摊主各端来一碗不同口味的饭，行会递来的价目却只留了一种做法。常买新菜的客人也围着等答复。"
 hbe_short_shared.3.desc.after_b: "旧井仍按原例使用，客摊另得供水。外乡菜已有几位熟客，摊主来问过了短期还能否继续做。\n\n新摊户希望留下，旧行会提出统一价目和名字。府署可以承认不同风味，也可纳入行会，或以卫生与质量定摊牌。几家摊主各端来一碗不同口味的饭，行会递来的价目却只留了一种做法。常买新菜的客人也围着等答复。"
 hbe_short_shared.3.desc.after_c: "井钱按用量分担，新旧摊户都有清楚份额。生意做过几轮，几家旧铺又要求统一菜价与做法。\n\n新摊户希望留下，旧行会提出统一价目和名字。府署可以承认不同风味，也可纳入行会，或以卫生与质量定摊牌。几家摊主各端来一碗不同口味的饭，行会递来的价目却只留了一种做法。常买新菜的客人也围着等答复。"
 hbe_short_shared.12.desc.after_a: "修屋工钱抵了房租，迁户终于能住进不漏雨的屋子。屋里添了一台织机，院主又来商量租价。\n\n迁户添了织机，院主想收部分织货作为房钱。邻居认为作坊噪声需要另议，工匠担心新租让自己永远无法搬走。织机占去半间屋，门外却还晾着一家人的衣被。院主想从货利里分租，织户只肯把房钱写成能够预先算清的数。"
 hbe_short_shared.12.desc.after_b: "院主的旧租约得到维护，迁户获准短期宽限。为了按期付租，他们在院中摆起一台织机。\n\n迁户添了织机，院主想收部分织货作为房钱。邻居认为作坊噪声需要另议，工匠担心新租让自己永远无法搬走。织机占去半间屋，门外却还晾着一家人的衣被。院主想从货利里分租，织户只肯把房钱写成能够预先算清的数。"
 hbe_short_shared.12.desc.after_c: "双方重订维修与房租，迁户住了下来。等织机搬入院中，院主却说做活的房钱不能与住屋相同。\n\n迁户添了织机，院主想收部分织货作为房钱。邻居认为作坊噪声需要另议，工匠担心新租让自己永远无法搬走。织机占去半间屋，门外却还晾着一家人的衣被。院主想从货利里分租，织户只肯把房钱写成能够预先算清的数。"
 hbe_short_shared.13.desc.after_a: "房租不再按货利分成，织户能照自己的订单做活。住过一段时日后，他们又请求登记门牌。\n\n迁户准备买下自己的住处，请求在门牌上写本府住户。院主愿售，旧族却认为买屋不等于取得共同乡议的名额。查户的人停在门前，只在院主名下画了记号。真正每日开门、纳租和修路的一家，仍等不到自己的门牌。"
 hbe_short_shared.13.desc.after_b: "院主获准按货利收租，织户继续留在院中。到了查户，旧屋契却仍只写着院主一家的名字。\n\n迁户准备买下自己的住处，请求在门牌上写本府住户。院主愿售，旧族却认为买屋不等于取得共同乡议的名额。查户的人停在门前，只在院主名下画了记号。真正每日开门、纳租和修路的一家，仍等不到自己的门牌。"
 hbe_short_shared.13.desc.after_c: "府署担保了首季小坊房钱，织户另找地方接活。搬出旧院以后，一家人仍缺一张能证明长住的门牌。\n\n迁户准备买下自己的住处，请求在门牌上写本府住户。院主愿售，旧族却认为买屋不等于取得共同乡议的名额。查户的人停在门前，只在院主名下画了记号。真正每日开门、纳租和修路的一家，仍等不到自己的门牌。"
 hbe_short_shared.22.desc.after_a: "医钱先付给药舍，两个孩子得到照料。等伤势稍定，家属才拿着雇用的旧账回来查问。\n\n账本只记着“渡口小工”，没有两人的名字。书记希望按原账结案，家属请求以后每个短工都应有名。账上只写着几个短工和一笔饭钱，家属指着那一行问，哪一份才是自己孩子做过的活。"
 hbe_short_shared.22.desc.after_b: "船主被令赔付，暂不能再招短工。查赔钱时，家属却发现旧账连孩子的姓名都没有记。\n\n账本只记着“渡口小工”，没有两人的名字。书记希望按原账结案，家属请求以后每个短工都应有名。账上只写着几个短工和一笔饭钱，家属指着那一行问，哪一份才是自己孩子做过的活。"
 hbe_short_shared.22.desc.after_c: "两家共同照料孩子，药钱分别登记。准备结算误工时，他们才知道原先的账里只写着短工人数。\n\n账本只记着“渡口小工”，没有两人的名字。书记希望按原账结案，家属请求以后每个短工都应有名。账上只写着几个短工和一笔饭钱，家属指着那一行问，哪一份才是自己孩子做过的活。"
 hbe_short_shared.23.desc.after_a: "短工姓名增记入账，家属也能查看。船主准备再招人时，众人便拿着新账追问受伤后的责任。\n\n伤者恢复后想回渡口做活，家属担心再次出事。船主愿多付一点工钱，条件是不再追究旧账。府署可以明定短工责任，也可只安排一次补偿。招工的牌又挂回渡口，几位家长先去看药舍有没有人在。船主想照旧议工钱，众人却要求先把受伤后的照料说清。"
 hbe_short_shared.23.desc.after_b: "旧账仍照原记处理，船主保住了声名。伤者家属收下议定补偿，仍担心下一批孩子会遇到同样的事。\n\n伤者恢复后想回渡口做活，家属担心再次出事。船主愿多付一点工钱，条件是不再追究旧账。府署可以明定短工责任，也可只安排一次补偿。招工的牌又挂回渡口，几位家长先去看药舍有没有人在。船主想照旧议工钱，众人却要求先把受伤后的照料说清。"
 hbe_short_shared.23.desc.after_c: "渡口设了共用雇工簿，短工与船主都留有凭记。下一次招工将至，谁来照料伤者还没有常例。\n\n伤者恢复后想回渡口做活，家属担心再次出事。船主愿多付一点工钱，条件是不再追究旧账。府署可以明定短工责任，也可只安排一次补偿。招工的牌又挂回渡口，几位家长先去看药舍有没有人在。船主想照旧议工钱，众人却要求先把受伤后的照料说清。"
 hbe_short_shared.32.desc.after_a: "蒙舍增了教读，新旧户的孩子得以同学。第一回收上来的试卷，却让老师对该考什么有了分歧。\n\n孩子在算账题上答得好，旧教读认为不能因此省去礼文。商人请求按用途分课，贵族则希望维持统一选拔。一张卷子礼文抄得齐整，另一张能算清一船货的账。两位老师把卷子交换过一遍，谁也不愿按另一套标准落名次。"
 hbe_short_shared.32.desc.after_b: "旧名额保留，新户另找教读。两处老师交换过试卷，才发现礼文与账法的取舍完全不同。\n\n孩子在算账题上答得好，旧教读认为不能因此省去礼文。商人请求按用途分课，贵族则希望维持统一选拔。一张卷子礼文抄得齐整，另一张能算清一船货的账。两位老师把卷子交换过一遍，谁也不愿按另一套标准落名次。"
 hbe_short_shared.32.desc.after_c: "商人供了纸墨，公共账法课开了起来。几名孩子带着算账习作去求进学，老师却仍按旧卷评定。\n\n孩子在算账题上答得好，旧教读认为不能因此省去礼文。商人请求按用途分课，贵族则希望维持统一选拔。一张卷子礼文抄得齐整，另一张能算清一船货的账。两位老师把卷子交换过一遍，谁也不愿按另一套标准落名次。"
 hbe_short_shared.33.desc.after_a: "礼文与账法分开评定，不再按出身限卷。老师将几份新卷留了下来，想据此申请正式的教读位置。\n\n新课吸引了更多住户，原老师希望主持权传给子弟。家属认为出钱不能换来永久名额，府署可按教读成绩择人，也可尊重旧家供养。家长们带来孩子最早与最近的习作，旧家却递上一份祖辈主持蒙舍的名册。新聘纸上先空着教读人的姓名。"
 hbe_short_shared.33.desc.after_b: "旧试卷取人的规矩保留，府学的名次没有改动。几家新户仍带来孩子进步的习作，请求留下自己的老师。\n\n新课吸引了更多住户，原老师希望主持权传给子弟。家属认为出钱不能换来永久名额，府署可按教读成绩择人，也可尊重旧家供养。家长们带来孩子最早与最近的习作，旧家却递上一份祖辈主持蒙舍的名册。新聘纸上先空着教读人的姓名。"
 hbe_short_shared.33.desc.after_c: "几位老师共同留卷比较，纸上能看出各家孩子的长进。谁应当长久主持教读，便成了接下来的争议。\n\n新课吸引了更多住户，原老师希望主持权传给子弟。家属认为出钱不能换来永久名额，府署可按教读成绩择人，也可尊重旧家供养。家长们带来孩子最早与最近的习作，旧家却递上一份祖辈主持蒙舍的名册。新聘纸上先空着教读人的姓名。"
 hbe_short_shared.42.desc.after_a: "祭期与出工日分开登记，迁户得以调役。等到祭席布置，修渠时没有争完的份额又变成了席钱。\n\n新户请求在旧亭祭祀，被要求另交席钱。掌亭者称旧户多年修亭，新户认为自己已依此前的裁定出工、担费，不该因籍贯再多交一份。收席钱的人先扣去旧户的减免，再把余数摊给来人。新户递上此前的工钱凭记，问自己出过的份额为何没有算进去。"
 hbe_short_shared.42.desc.after_b: "清渠照旧日举行，府署另给祭钱。新户办席时，仍被要求比旧户多分一份用亭的费用。\n\n新户请求在旧亭祭祀，被要求另交席钱。掌亭者称旧户多年修亭，新户认为自己已依此前的裁定出工、担费，不该因籍贯再多交一份。收席钱的人先扣去旧户的减免，再把余数摊给来人。新户递上此前的工钱凭记，问自己出过的份额为何没有算进去。"
 hbe_short_shared.42.desc.after_c: "府署雇人补渠，两方祭期都保留。共同祭亭摆起席案时，谁出过多少又引起争论。\n\n新户请求在旧亭祭祀，被要求另交席钱。掌亭者称旧户多年修亭，新户认为自己已依此前的裁定出工、担费，不该因籍贯再多交一份。收席钱的人先扣去旧户的减免，再把余数摊给来人。新户递上此前的工钱凭记，问自己出过的份额为何没有算进去。"
 hbe_short_shared.43.desc.after_a: "席钱按实际使用分担，不再另分新旧户。次年编清渠簿时，迁户请求调役也照此有一条共同办法。\n\n来年的清渠簿又要重写，新户再次请求把礼期列入安排，领役人则要求保留紧急征工。此前的临时裁定，尚未成为往后每年都能援引的办法。府署可以承认礼期，也可只给逐案宽免，或建立付酬替役。领役人拿来的新簿又空着祭期一栏，乡民却已将各自的日子记在纸上。这次若仍只批一句宽免，明年还得再来请。"
 hbe_short_shared.43.desc.after_b: "旧户的减免保留，新户得到缴钱宽限。下一年役簿送来，迁户仍想知道能否再按自己的祭期调日。\n\n来年的清渠簿又要重写，新户再次请求把礼期列入安排，领役人则要求保留紧急征工。此前的临时裁定，尚未成为往后每年都能援引的办法。府署可以承认礼期，也可只给逐案宽免，或建立付酬替役。领役人拿来的新簿又空着祭期一栏，乡民却已将各自的日子记在纸上。这次若仍只批一句宽免，明年还得再来请。"
 hbe_short_shared.43.desc.after_c: "修亭出资重新登记，两方终于能对照各自份额。编下一年役簿时，众人希望这种核对不必年年重争。\n\n来年的清渠簿又要重写，新户再次请求把礼期列入安排，领役人则要求保留紧急征工。此前的临时裁定，尚未成为往后每年都能援引的办法。府署可以承认礼期，也可只给逐案宽免，或建立付酬替役。领役人拿来的新簿又空着祭期一栏，乡民却已将各自的日子记在纸上。这次若仍只批一句宽免，明年还得再来请。"
 hbe_short_shared.52.desc.after_a: "新医获准限期诊治，病家按日留下病程。看过几份记录以后，两位医者开始争论同名药草的用法。\n\n一种旧乡药草确有用处，却不适合所有病人。老医者请求不得当作包治的名号，新医者同意改写药单。两位医者各取出一种同名山草，叶形已有分别。病家请他们先说哪些病能用，再谈铺上的名声。"
 hbe_short_shared.52.desc.after_b: "旧行规保留，病家另得药钱。外乡医者没有正式铺号，仍带着旧药样来说明自己的配方。\n\n一种旧乡药草确有用处，却不适合所有病人。老医者请求不得当作包治的名号，新医者同意改写药单。两位医者各取出一种同名山草，叶形已有分别。病家请他们先说哪些病能用，再谈铺上的名声。"
 hbe_short_shared.52.desc.after_c: "两位医者共同会诊，各自分担查验。比较药样时，他们才发现所称的同一种草并不完全相同。\n\n一种旧乡药草确有用处，却不适合所有病人。老医者请求不得当作包治的名号，新医者同意改写药单。两位医者各取出一种同名山草，叶形已有分别。病家请他们先说哪些病能用，再谈铺上的名声。"
 hbe_short_shared.53.desc.after_a: "药草的适用病症公开，包治的名目撤去。外乡医者愿按新记法长住诊治，来问正式铺号的事。\n\n经过这些日子的会诊与查方，一些病家愿继续找这位外乡医者问诊。他请求正式留下自己的铺号；本地医者愿收他的子弟为徒，却希望今后的诊治并入旧铺。府署可承认独立药铺，也可促成共用药舍。外乡医者的药柜仍是借来的，病家却已认得那个门口。本地旧铺递来合铺的条件，独立铺号还等着官署落笔。"
 hbe_short_shared.53.desc.after_b: "本地医者主持定方，病家暂照议定办法取药。外乡医者仍想留下行医，却不愿一直只做旧铺的帮手。\n\n经过这些日子的会诊与查方，一些病家愿继续找这位外乡医者问诊。他请求正式留下自己的铺号；本地医者愿收他的子弟为徒，却希望今后的诊治并入旧铺。府署可承认独立药铺，也可促成共用药舍。外乡医者的药柜仍是借来的，病家却已认得那个门口。本地旧铺递来合铺的条件，独立铺号还等着官署落笔。"
 hbe_short_shared.53.desc.after_c: "药样留进府学继续比较，两位医者也各存病历。限期诊治将满，病家想知道以后到哪里找人。\n\n经过这些日子的会诊与查方，一些病家愿继续找这位外乡医者问诊。他请求正式留下自己的铺号；本地医者愿收他的子弟为徒，却希望今后的诊治并入旧铺。府署可承认独立药铺，也可促成共用药舍。外乡医者的药柜仍是借来的，病家却已认得那个门口。本地旧铺递来合铺的条件，独立铺号还等着官署落笔。"
 hbe_short_shared.62.desc.after_a: "口粮先供给缺粮人家，两村共同留种。下种以后，农户发现同一批种在不同田边受虫害的情形不一样。\n\n新种有一部分遭虫，旧户认为不应继续推广，迁户指出另一块坡田结穗较好。我们可以比较田势，也可先恢复熟悉的作物。几株伤苗连着田泥放在案上，靠水与背坡的虫痕并不一样。农户想知道该换种、换田，还是先把虫查清。"
 hbe_short_shared.62.desc.after_b: "借种依旧仓担保，原有水额保留。迁户仍在分到的田里下了种，却开始送来被虫咬过的秧苗。\n\n新种有一部分遭虫，旧户认为不应继续推广，迁户指出另一块坡田结穗较好。我们可以比较田势，也可先恢复熟悉的作物。几株伤苗连着田泥放在案上，靠水与背坡的虫痕并不一样。农户想知道该换种、换田，还是先把虫查清。"
 hbe_short_shared.62.desc.after_c: "共同试田由府库供种，几家农户分头照料。初苗长起时，医者看到不同地块有不同的虫痕。\n\n新种有一部分遭虫，旧户认为不应继续推广，迁户指出另一块坡田结穗较好。我们可以比较田势，也可先恢复熟悉的作物。几株伤苗连着田泥放在案上，靠水与背坡的虫痕并不一样。农户想知道该换种、换田，还是先把虫查清。"
 hbe_short_shared.63.desc.after_a: "种子依田势分种，虫害逐块记下。到收粮时，各家带回的谷色和粒形已不像原来那一袋。\n\n借种户带回不同颜色的谷子，掌仓人要求严格按原种归还。新户认为能留足播种的好谷即可，旧仓户担心账目因此混乱。还种的人各带来一袋好谷，掌仓人逐袋拿去与旧样比。谷已经长过一季，仓格和借据却仍只写着最初那一种名字。"
 hbe_short_shared.63.desc.after_b: "农户恢复旧种，仓粮沿用熟悉的办法。先前试下的新谷仍有收成，借种人不知可否用它偿还。\n\n借种户带回不同颜色的谷子，掌仓人要求严格按原种归还。新户认为能留足播种的好谷即可，旧仓户担心账目因此混乱。还种的人各带来一袋好谷，掌仓人逐袋拿去与旧样比。谷已经长过一季，仓格和借据却仍只写着最初那一种名字。"
 hbe_short_shared.63.desc.after_c: "医者与农户共同查虫，留下几种田况的记录。收割后，掌仓人却只认借出时的原种。\n\n借种户带回不同颜色的谷子，掌仓人要求严格按原种归还。新户认为能留足播种的好谷即可，旧仓户担心账目因此混乱。还种的人各带来一袋好谷，掌仓人逐袋拿去与旧样比。谷已经长过一季，仓格和借据却仍只写着最初那一种名字。"
 hbe_short_shared.72.desc.after_a: "两家按劳作与试染共担损失，账算过以后仍能继续合做。一名师傅却想另开小坊，带走自己试出的配方。\n\n一名师傅准备另开小坊，要求带走自己试出的配方。出料的伙伴认为配方也受过自己的损失，应有使用份额。师傅的配方纸还沾着染料，伙伴拿来的却是当年赔过的料钱。分开以后谁还能照方接单，旧契并没有写过。"
 hbe_short_shared.72.desc.after_b: "货利按出资额分账，伙伴拿回议定的份额。做试染的师傅觉得手艺未被算足，开始筹备自己的小坊。\n\n一名师傅准备另开小坊，要求带走自己试出的配方。出料的伙伴认为配方也受过自己的损失，应有使用份额。师傅的配方纸还沾着染料，伙伴拿来的却是当年赔过的料钱。分开以后谁还能照方接单，旧契并没有写过。"
 hbe_short_shared.72.desc.after_c: "共同账房接下旧账，两家暂不拆坊。新一轮试染还没结钱，一名师傅先提出带走配方另做生意。\n\n一名师傅准备另开小坊，要求带走自己试出的配方。出料的伙伴认为配方也受过自己的损失，应有使用份额。师傅的配方纸还沾着染料，伙伴拿来的却是当年赔过的料钱。分开以后谁还能照方接单，旧契并没有写过。"
 hbe_short_shared.73.desc.after_a: "师傅获准另作，伙伴按议得到限期补偿。两人来往仍有旧活，一名学徒因而想跟两边学。\n\n两位师傅继续做活，却都想留下同一个学徒。无论配方最后留在合坊还是另作使用，家属都希望孩子能向两人传习，行会则要求固定师傅。府署须决定，收徒应怎样分担工钱与传艺责任。学徒先收好自己的工具，家属却不肯替孩子只认一位师傅。两家都要有人干活，也都不愿白教另一家的徒弟。"
 hbe_short_shared.73.desc.after_b: "配方留在合坊，出资人的份额得到维护。师傅没有带走旧方，学徒却还记着他教过的染法。\n\n两位师傅继续做活，却都想留下同一个学徒。无论配方最后留在合坊还是另作使用，家属都希望孩子能向两人传习，行会则要求固定师傅。府署须决定，收徒应怎样分担工钱与传艺责任。学徒先收好自己的工具，家属却不肯替孩子只认一位师傅。两家都要有人干活，也都不愿白教另一家的徒弟。"
 hbe_short_shared.73.desc.after_c: "一部分做法公开，特殊订货仍由原坊保留。两位师傅继续各管一摊，也都想留下同一个学徒。\n\n两位师傅继续做活，却都想留下同一个学徒。无论配方最后留在合坊还是另作使用，家属都希望孩子能向两人传习，行会则要求固定师傅。府署须决定，收徒应怎样分担工钱与传艺责任。学徒先收好自己的工具，家属却不肯替孩子只认一位师傅。两家都要有人干活，也都不愿白教另一家的徒弟。"
 hbe_short_shared.82.desc.after_a: "迁户得了补地，围栏让出了旧牧路。入冬后，沿这条路来的山民看见他们的牲畜仍挤在雪坡下。\n\n迁户的牲畜不惯雪路，山民愿提供草料和向导。旧牧主要求新户先承认牧界，府署可以供草料，也可要求双方以救助重订冬牧约。山民把干草背到坡下，迁户的牲畜还站在雪里。帮忙的人愿先开草捆，旧牧主却要对方先认界。"
 hbe_short_shared.82.desc.after_b: "荒地册的地界保留，山民另得便道。第一场雪落下时，近在两边的牲畜仍须共用水口与草料。\n\n迁户的牲畜不惯雪路，山民愿提供草料和向导。旧牧主要求新户先承认牧界，府署可以供草料，也可要求双方以救助重订冬牧约。山民把干草背到坡下，迁户的牲畜还站在雪里。帮忙的人愿先开草捆，旧牧主却要对方先认界。"
 hbe_short_shared.82.desc.after_c: "双方共同查界，溪边暂留共用。冬雪一来，围栏另一边的迁户却还不懂怎样带牲畜走山路。\n\n迁户的牲畜不惯雪路，山民愿提供草料和向导。旧牧主要求新户先承认牧界，府署可以供草料，也可要求双方以救助重订冬牧约。山民把干草背到坡下，迁户的牲畜还站在雪里。帮忙的人愿先开草捆，旧牧主却要对方先认界。"
 hbe_short_shared.83.desc.after_a: "府署供了草料，救助没有等界争分明。熬过冬天的新户想改围栏，也愿听山民说明旧地名。\n\n新户愿照冬牧约改栏，山民请求木牌能记两种地名。书记认为一册一名便于征税，府署可承认双名，也可保留官名附注。围栏照约移回，木牌上却还空着地名。两家带来的称呼不同，走的却是同一条进山路。"
 hbe_short_shared.83.desc.after_b: "新户承认旧牧界，山民依约帮忙照料。到了春天，双方准备按冬牧约把围栏重新立好。\n\n新户愿照冬牧约改栏，山民请求木牌能记两种地名。书记认为一册一名便于征税，府署可承认双名，也可保留官名附注。围栏照约移回，木牌上却还空着地名。两家带来的称呼不同，走的却是同一条进山路。"
 hbe_short_shared.83.desc.after_c: "两边按实际照料重订冬牧约，共同记下草料与带路。春天改栏时，山民想把这些路名也留下来。\n\n新户愿照冬牧约改栏，山民请求木牌能记两种地名。书记认为一册一名便于征税，府署可承认双名，也可保留官名附注。围栏照约移回，木牌上却还空着地名。两家带来的称呼不同，走的却是同一条进山路。"
 hbe_short_shared.92.desc.after_a: "迁户与旧户的姓名都获准留在诉状上，管事须拿出收费凭据。账册送来后，众人看见了修桥之外的花销。\n\n查账发现部分路钱确实修过桥，另一些却用在管事家中。乡老担心全部追回会使下季无人修桥，迁户请求把私用与公用分开。修桥的料钱有几笔能对上，管事家中用去的几笔却只写着代办。乡民请他把两样分开，不肯用一场新修桥盖过旧账。"
 hbe_short_shared.92.desc.after_b: "诉状只认旧户联署，迁户仍须托人转达。旧户递来的查账请求，照样翻出了管事家中的支用。\n\n查账发现部分路钱确实修过桥，另一些却用在管事家中。乡老担心全部追回会使下季无人修桥，迁户请求把私用与公用分开。修桥的料钱有几笔能对上，管事家中用去的几笔却只写着代办。乡民请他把两样分开，不肯用一场新修桥盖过旧账。"
 hbe_short_shared.92.desc.after_c: "府署先查收费，联署资格留待后议。管事交来的账册却写着几笔与公路无关的用钱。\n\n查账发现部分路钱确实修过桥，另一些却用在管事家中。乡老担心全部追回会使下季无人修桥，迁户请求把私用与公用分开。修桥的料钱有几笔能对上，管事家中用去的几笔却只写着代办。乡民请他把两样分开，不肯用一场新修桥盖过旧账。"
 hbe_short_shared.93.desc.after_a: "私用的钱被追回，公用工钱保留。管事失了继续主持的凭据，众人开始商量下季谁来收路钱。\n\n管事辞去主持后，旧户请求由族老继任，新户提出按使用和出资推举。府署可承认共同主持，也可保留旧名额而公开账本。收钱的牌子还挂在路口，原管事已经交出旧册。谁来接任，会决定出过钱的新户下次能否亲自问账。"
 hbe_short_shared.93.desc.after_b: "管事照议补修，保留了原有名望。等到新一季，他却不愿再亲自主持，旧户于是提起继任的人选。\n\n管事辞去主持后，旧户请求由族老继任，新户提出按使用和出资推举。府署可承认共同主持，也可保留旧名额而公开账本。收钱的牌子还挂在路口，原管事已经交出旧册。谁来接任，会决定出过钱的新户下次能否亲自问账。"
 hbe_short_shared.93.desc.after_c: "收费转入共同公账，查验者轮派。管事交出旧册以后，谁能长久主持收钱与修路仍须再议。\n\n管事辞去主持后，旧户请求由族老继任，新户提出按使用和出资推举。府署可承认共同主持，也可保留旧名额而公开账本。收钱的牌子还挂在路口，原管事已经交出旧册。谁来接任，会决定出过钱的新户下次能否亲自问账。"
 hbe_short_shared.102.desc.after_a: "外乡船工凭技艺领到试船名额，修船和杂作仍须另算工钱。到结账时，他发现短工饭钱比旧工少了一份。\n\n结算这段日子的修船与码头杂作时，外乡船工发现自己的饭钱比旧工少。获准试船的活计另照原约办理，船帮却认为，只要尚未正式入帮，做什么都应自带口粮。家属请求承认他的实际劳作，府署可重核雇用，也可只给一次救济。同一天做过的活各记一行，饭钱却在新旧工之间少了一份。船工带家属来认账，没有要求把试用期也算作正式入帮。"
 hbe_short_shared.102.desc.after_b: "船工收了修船钱，名额仍留在旧帮。他继续接渡口杂作，结钱时却发现连饭钱也与旧工不同。\n\n结算这段日子的修船与码头杂作时，外乡船工发现自己的饭钱比旧工少。获准试船的活计另照原约办理，船帮却认为，只要尚未正式入帮，做什么都应自带口粮。家属请求承认他的实际劳作，府署可重核雇用，也可只给一次救济。同一天做过的活各记一行，饭钱却在新旧工之间少了一份。船工带家属来认账，没有要求把试用期也算作正式入帮。"
 hbe_short_shared.102.desc.after_c: "船主担保他限期随船，另有修船杂作依日结算。算到岸上这笔饭钱，船帮仍只把他当临时过客。\n\n结算这段日子的修船与码头杂作时，外乡船工发现自己的饭钱比旧工少。获准试船的活计另照原约办理，船帮却认为，只要尚未正式入帮，做什么都应自带口粮。家属请求承认他的实际劳作，府署可重核雇用，也可只给一次救济。同一天做过的活各记一行，饭钱却在新旧工之间少了一份。船工带家属来认账，没有要求把试用期也算作正式入帮。"
 hbe_short_shared.103.desc.after_a: "欠下的饭钱按实作补回，雇用也重订了。船工想继续留下做活，又来请求一个正式的入帮位置。\n\n船工在修船和往来船夫的讲述中熟悉了本地险滩，又来请求正式入帮。此前的工钱、试用与担保各有期限，都还没有给他一个长久的位置。船帮愿收，但要求他放弃旧乡的师傅称呼。府署可以承认两种传习，也可让入帮完全按旧规办理。船工仍能说出修过那条船的旧伤，却不知道正式入帮要在哪一栏放下自己的师承。船帮的名册已经送来，正等他的名字。"
 hbe_short_shared.103.desc.after_b: "一家人得了一次救济，船帮的入帮规矩没有改。临时钱终会用完，船工仍想凭手艺争到长久的位置。\n\n船工在修船和往来船夫的讲述中熟悉了本地险滩，又来请求正式入帮。此前的工钱、试用与担保各有期限，都还没有给他一个长久的位置。船帮愿收，但要求他放弃旧乡的师傅称呼。府署可以承认两种传习，也可让入帮完全按旧规办理。船工仍能说出修过那条船的旧伤，却不知道正式入帮要在哪一栏放下自己的师承。船帮的名册已经送来，正等他的名字。"
 hbe_short_shared.103.desc.after_c: "船主与船帮共同供粮，船工暂时能安顿家属。短期安排将满，他又带着做过的工单来请求入帮。\n\n船工在修船和往来船夫的讲述中熟悉了本地险滩，又来请求正式入帮。此前的工钱、试用与担保各有期限，都还没有给他一个长久的位置。船帮愿收，但要求他放弃旧乡的师傅称呼。府署可以承认两种传习，也可让入帮完全按旧规办理。船工仍能说出修过那条船的旧伤，却不知道正式入帮要在哪一栏放下自己的师承。船帮的名册已经送来，正等他的名字。"
 hbe_short_shared.112.desc.after_a: "子女获准继续承契，长者领着路凭回乡祭扫。过些时日，一封介绍旧乡亲族的信送到了府署。\n\n长者从旧乡寄来一封介绍亲族的信，请求他们也能来住。族老担心一封接一封的信使户册无法控制，田主愿招来做工。信封沿水路压出折痕，介绍来的亲族还没有启程。族老请先定一个名额，田主则在旁列着缺工的田。"
 hbe_short_shared.112.desc.after_b: "长者离乡期间暂停部分名额，旧籍规矩仍照例保留。他到湖广后寄来一封信，想替亲族打听来住的办法。\n\n长者从旧乡寄来一封介绍亲族的信，请求他们也能来住。族老担心一封接一封的信使户册无法控制，田主愿招来做工。信封沿水路压出折痕，介绍来的亲族还没有启程。族老请先定一个名额，田主则在旁列着缺工的田。"
 hbe_short_shared.112.desc.after_c: "家属共同担保限期回乡，长者赶上了船。信从旧乡寄回来，又把另一批亲人的去向带上了案头。\n\n长者从旧乡寄来一封介绍亲族的信，请求他们也能来住。族老担心一封接一封的信使户册无法控制，田主愿招来做工。信封沿水路压出折痕，介绍来的亲族还没有启程。族老请先定一个名额，田主则在旁列着缺工的田。"
 hbe_short_shared.113.desc.after_a: "亲族来住按实际住行查认，不能只凭这一封信独占名额。长者归来以后，子女开始为两处祭扫筹钱。\n\n长者回来后，子女请求在新乡留一处祭田，旧族认为他们的祖坟仍在外地，不应再分公地。府署可以准自购，也可只认可原有祭祀名额。长者把旧乡带回的祭土收在木匣里，子女询问新乡的地价。旧族愿许他们祭扫，却不愿从公地里另分一份。"
 hbe_short_shared.113.desc.after_b: "亲族来住受限，旧户名额保留。长者回来时听过裁处，仍想让自己的子女在新乡留一处祭田。\n\n长者回来后，子女请求在新乡留一处祭田，旧族认为他们的祖坟仍在外地，不应再分公地。府署可以准自购，也可只认可原有祭祀名额。长者把旧乡带回的祭土收在木匣里，子女询问新乡的地价。旧族愿许他们祭扫，却不愿从公地里另分一份。"
 hbe_short_shared.113.desc.after_c: "亲族依工种分批接纳，租约也有期限。长者从旧乡回来，子女又来问能否买地留作祭祀。\n\n长者回来后，子女请求在新乡留一处祭田，旧族认为他们的祖坟仍在外地，不应再分公地。府署可以准自购，也可只认可原有祭祀名额。长者把旧乡带回的祭土收在木匣里，子女询问新乡的地价。旧族愿许他们祭扫，却不愿从公地里另分一份。"
 hbe_migration.2.desc.after_a: "首批船客领到渡口口粮，姓名录进新簿。他们开始找田与住处，开簿时没有写明的地界却陆续有人来争。\n\n查田书吏指给求租的人一片荒坡，旧村却说冬天要在那里放牲畜，春天还须从坡脚引水。田主愿招佃户开荒，请求将整块地列入自己的庄册；几户人家已经借来木桩，想先把可修的埂标出来。若另给新户小契，旧牧路便须补偿；若让田主包办出租，租额又可能在下一季上调。过境与居留的先前裁定仍须分别遵守，这一次应给哪些家庭开垦凭据，眼下还没有定论。"
 hbe_migration.2.desc.after_b: "匠人与佃户依工种、担保分批留下，有人借宿作坊，有人仍等在渡口。担保人又送来一份开荒请求。\n\n查田书吏指给求租的人一片荒坡，旧村却说冬天要在那里放牲畜，春天还须从坡脚引水。田主愿招佃户开荒，请求将整块地列入自己的庄册；几户人家已经借来木桩，想先把可修的埂标出来。若另给新户小契，旧牧路便须补偿；若让田主包办出租，租额又可能在下一季上调。过境与居留的先前裁定仍须分别遵守，这一次应给哪些家庭开垦凭据，眼下还没有定论。"
 hbe_migration.2.desc.after_c: "首批船客照只准过境的裁定继续赶路。后来又有几户带着田主邀约而来，请求另议城外荒坡的开垦。\n\n查田书吏指给求租的人一片荒坡，旧村却说冬天要在那里放牲畜，春天还须从坡脚引水。田主愿招佃户开荒，请求将整块地列入自己的庄册；几户人家已经借来木桩，想先把可修的埂标出来。若另给新户小契，旧牧路便须补偿；若让田主包办出租，租额又可能在下一季上调。过境与居留的先前裁定仍须分别遵守，这一次应给哪些家庭开垦凭据，眼下还没有定论。"
 hbe_migration.3.desc.after_a: "新户领到小契，旧牧路另有补偿。等到村中摆祭席，有些人却发现田契不能替自己换来宗祠里的位置。\n\n两支同姓人家为祭席上的座次争执起来。新户带来湖广旧乡的谱牒，声称应按辈分入席；本地族老却说，宗祠、桥梁和义仓都是旧户多年出钱修成，不能仅凭相同的姓就分得主持权。新来的长者愿捐纸墨，替族中补抄旧谱，也愿记下一路入蜀的经历。年轻人已在田间互相帮工，却不明白为何同桌吃一顿饭会触动祖先的体面。府署可以承认共同入籍，把祭席另行议定，也可以保留旧族的次序，只让新户在祠外设席。"
 hbe_migration.3.desc.after_b: "佃户照限定租额向田主租种，头几年总算有了安排。进村帮工以后，谱牒与祭席的先后又使两支同姓人家起了争执。\n\n两支同姓人家为祭席上的座次争执起来。新户带来湖广旧乡的谱牒，声称应按辈分入席；本地族老却说，宗祠、桥梁和义仓都是旧户多年出钱修成，不能仅凭相同的姓就分得主持权。新来的长者愿捐纸墨，替族中补抄旧谱，也愿记下一路入蜀的经历。年轻人已在田间互相帮工，却不明白为何同桌吃一顿饭会触动祖先的体面。府署可以承认共同入籍，把祭席另行议定，也可以保留旧族的次序，只让新户在祠外设席。"
 hbe_migration.3.desc.after_c: "新垦暂缓，旧庄地界先行确认。几户已有租约的外来人家仍来往村中，其中一支正为祭席的座次请旧族认亲。\n\n两支同姓人家为祭席上的座次争执起来。新户带来湖广旧乡的谱牒，声称应按辈分入席；本地族老却说，宗祠、桥梁和义仓都是旧户多年出钱修成，不能仅凭相同的姓就分得主持权。新来的长者愿捐纸墨，替族中补抄旧谱，也愿记下一路入蜀的经历。年轻人已在田间互相帮工，却不明白为何同桌吃一顿饭会触动祖先的体面。府署可以承认共同入籍，把祭席另行议定，也可以保留旧族的次序，只让新户在祠外设席。"
 hbe_migration.4.desc.after_a: "共同入籍得到承认，祭席另行商议。新旧人家开始更常在田间往来，合修的一条支渠却引出了旧水账。\n\n新住户修通一条支渠，渠尾的几片田终于可以播种。上游村民却拿出旧分水簿，指责他们从未承担清渠的旧账。渠工说，过去没人愿意修这一段，如今田里有了水，人人又想起它属于哪一本册子。新村请求按受益田亩分水，也愿补出一份日后的维修钱；旧村坚持先偿还历年的欠工。若准新村用水，府库须替双方核算旧账，并安抚上游；若把新渠暂时封住，旧村会安心，新垦户这一季却只能望着已翻过的田。"
 hbe_migration.4.desc.after_b: "两份谱册分别保存，两边都可出力修桥。新村的人也照着这份共事的先例，提出参加修渠与分水。\n\n新住户修通一条支渠，渠尾的几片田终于可以播种。上游村民却拿出旧分水簿，指责他们从未承担清渠的旧账。渠工说，过去没人愿意修这一段，如今田里有了水，人人又想起它属于哪一本册子。新村请求按受益田亩分水，也愿补出一份日后的维修钱；旧村坚持先偿还历年的欠工。若准新村用水，府库须替双方核算旧账，并安抚上游；若把新渠暂时封住，旧村会安心，新垦户这一季却只能望着已翻过的田。"
 hbe_migration.4.desc.after_c: "旧族保留主持，外来支系另立祭所。村外租种的住户仍须修渠，新添的渠尾田又碰上了旧村水额。\n\n新住户修通一条支渠，渠尾的几片田终于可以播种。上游村民却拿出旧分水簿，指责他们从未承担清渠的旧账。渠工说，过去没人愿意修这一段，如今田里有了水，人人又想起它属于哪一本册子。新村请求按受益田亩分水，也愿补出一份日后的维修钱；旧村坚持先偿还历年的欠工。若准新村用水，府库须替双方核算旧账，并安抚上游；若把新渠暂时封住，旧村会安心，新垦户这一季却只能望着已翻过的田。"
 hbe_migration.5.desc.after_a: "渠尾村落获准用水，维修按受益田亩重订。修仓与做水口的工匠也有了新活，一位外乡木匠开始独自接单。\n\n来自湖广的木匠在本府学会了新的榫口，几个蜀地徒弟也跟着他做活。行会认为他尚未有自己的铺号，不该独立接单；年轻工匠则说，去年修仓和造船时，行会明明承认过他的手艺。商人愿为外乡师傅担保，条件是他先完成一批低价货。若府署发给工牌，作坊之间会出现新的竞争，旧行会也会失去一些份额；若只让他以客匠身份做工，眼下的规矩得以维持，徒弟们却可能跟着他去别处寻找铺面。"
 hbe_migration.5.desc.after_b: "新村水额暂限，旧账分期偿还。做过渠上木作的外乡师傅留下工钱凭记，又想凭手艺申请工牌。\n\n来自湖广的木匠在本府学会了新的榫口，几个蜀地徒弟也跟着他做活。行会认为他尚未有自己的铺号，不该独立接单；年轻工匠则说，去年修仓和造船时，行会明明承认过他的手艺。商人愿为外乡师傅担保，条件是他先完成一批低价货。若府署发给工牌，作坊之间会出现新的竞争，旧行会也会失去一些份额；若只让他以客匠身份做工，眼下的规矩得以维持，徒弟们却可能跟着他去别处寻找铺面。"
 hbe_migration.5.desc.after_c: "旧村水额保留，新村须另寻水源。承做仓屋与零星渠工的外乡匠人仍在本府做活，却没有自己的铺号。\n\n来自湖广的木匠在本府学会了新的榫口，几个蜀地徒弟也跟着他做活。行会认为他尚未有自己的铺号，不该独立接单；年轻工匠则说，去年修仓和造船时，行会明明承认过他的手艺。商人愿为外乡师傅担保，条件是他先完成一批低价货。若府署发给工牌，作坊之间会出现新的竞争，旧行会也会失去一些份额；若只让他以客匠身份做工，眼下的规矩得以维持，徒弟们却可能跟着他去别处寻找铺面。"
 hbe_migration.6.desc.after_a: "工牌依手艺发下，外乡师傅可以自行收徒接单。作坊里多了几名学徒，连雨后的缺粮也渐渐传到城中。\n\n一场连雨使新垦田欠收，义仓门前出现了从未领过粮的家庭。掌仓人认为，他们没有缴足往年的仓粮，不能与旧户同样借贷。旧村的穷户也在排队，担心最后几袋种粮会被不熟悉的人领走。乡医提醒府署，饥饿与疾病不认户册上的入籍年份。商人愿垫一批粮，却要求新户以日后的工钱抵债。我们可以增购粮食，让新旧穷户共领；也可以按缴粮记录发放，把剩下的人交给商人或亲族照料。"
 hbe_migration.6.desc.after_b: "师傅获准限期客作，工钱货期都有凭据。几户靠这类短约生活的人家，在连雨以后先断了口粮。\n\n一场连雨使新垦田欠收，义仓门前出现了从未领过粮的家庭。掌仓人认为，他们没有缴足往年的仓粮，不能与旧户同样借贷。旧村的穷户也在排队，担心最后几袋种粮会被不熟悉的人领走。乡医提醒府署，饥饿与疾病不认户册上的入籍年份。商人愿垫一批粮，却要求新户以日后的工钱抵债。我们可以增购粮食，让新旧穷户共领；也可以按缴粮记录发放，把剩下的人交给商人或亲族照料。"
 hbe_migration.6.desc.after_c: "旧行会保有接单资格，官署只按需收购成品。留在城外的客匠与租种户仍要过日子，连雨却使他们的积粮见底。\n\n一场连雨使新垦田欠收，义仓门前出现了从未领过粮的家庭。掌仓人认为，他们没有缴足往年的仓粮，不能与旧户同样借贷。旧村的穷户也在排队，担心最后几袋种粮会被不熟悉的人领走。乡医提醒府署，饥饿与疾病不认户册上的入籍年份。商人愿垫一批粮，却要求新户以日后的工钱抵债。我们可以增购粮食，让新旧穷户共领；也可以按缴粮记录发放，把剩下的人交给商人或亲族照料。"
 hbe_migration.7.desc.after_a: "义仓增购了口粮，新旧穷户一起领粮。登记借粮和住处时，书记却发现几家报来的地名与官册对不上。\n\n入蜀已有多年的家庭仍用旧乡的称呼记田界和牲畜，官署新派的书记却照府城用语抄写。一场租地纠纷因此多出三道彼此矛盾的证词，乡老和外来长者都认为自己的话被故意改了。年轻读书人愿兼学两种说法，为契纸附上解释；一些旧户认为，这会让外乡人的规矩渐渐进入本府。新的户籍若要真正起作用，就须让持契的人认得它。我们可以为互译与教读出钱，也可以坚持同一册式，只在争执发生时另找担保。"
 hbe_migration.7.desc.after_b: "借粮由府署担保，缺粮家庭按季偿还。重写借据时，两种乡音里相同的田界却被抄成了不同的位置。\n\n入蜀已有多年的家庭仍用旧乡的称呼记田界和牲畜，官署新派的书记却照府城用语抄写。一场租地纠纷因此多出三道彼此矛盾的证词，乡老和外来长者都认为自己的话被故意改了。年轻读书人愿兼学两种说法，为契纸附上解释；一些旧户认为，这会让外乡人的规矩渐渐进入本府。新的户籍若要真正起作用，就须让持契的人认得它。我们可以为互译与教读出钱，也可以坚持同一册式，只在争执发生时另找担保。"
 hbe_migration.7.desc.after_c: "粮食照旧缴粮册发放，一些新户只得另找亲友。事后核对租地与借粮的凭记，又露出了乡音与官册的差别。\n\n入蜀已有多年的家庭仍用旧乡的称呼记田界和牲畜，官署新派的书记却照府城用语抄写。一场租地纠纷因此多出三道彼此矛盾的证词，乡老和外来长者都认为自己的话被故意改了。年轻读书人愿兼学两种说法，为契纸附上解释；一些旧户认为，这会让外乡人的规矩渐渐进入本府。新的户籍若要真正起作用，就须让持契的人认得它。我们可以为互译与教读出钱，也可以坚持同一册式，只在争执发生时另找担保。"
 hbe_migration.8.desc.after_a: "互译教读办起，新旧户可以共同查契。几年后，那些认得两种称呼的年轻人，却仍要为自己的户别重新请证。\n\n新一代已在蜀地长大，几户人家却又收拾行李，准备沿江返回。他们说这里有田，也有作坊，但一遇征役或田讼，自己仍被称为外来的客户。旧乡来信劝他们留下，说蜀中已经有人能代为接应新的亲族。田主不愿失去做惯农事的佃户，旧族却反对把来路不同的人一律列为正户。府署若承认长期居住与纳税的记录，就须调整旧有名额；若继续要求亲族担保，新户会明白，多年劳作仍换不来一份自己的位置。"
 hbe_migration.8.desc.after_b: "统一册式附上乡里称谓，持契人总算认得自家田。可到了换役与田讼，租住多年的家庭仍未必算作正户。\n\n新一代已在蜀地长大，几户人家却又收拾行李，准备沿江返回。他们说这里有田，也有作坊，但一遇征役或田讼，自己仍被称为外来的客户。旧乡来信劝他们留下，说蜀中已经有人能代为接应新的亲族。田主不愿失去做惯农事的佃户，旧族却反对把来路不同的人一律列为正户。府署若承认长期居住与纳税的记录，就须调整旧有名额；若继续要求亲族担保，新户会明白，多年劳作仍换不来一份自己的位置。"
 hbe_migration.8.desc.after_c: "官署只用府城册式，有争议的人仍须另找担保。住了多年的几家收起这些凭纸，开始打听返回旧乡的船。\n\n新一代已在蜀地长大，几户人家却又收拾行李，准备沿江返回。他们说这里有田，也有作坊，但一遇征役或田讼，自己仍被称为外来的客户。旧乡来信劝他们留下，说蜀中已经有人能代为接应新的亲族。田主不愿失去做惯农事的佃户，旧族却反对把来路不同的人一律列为正户。府署若承认长期居住与纳税的记录，就须调整旧有名额；若继续要求亲族担保，新户会明白，多年劳作仍换不来一份自己的位置。"
 hbe_migration.9.desc.after_a: "居住与纳税成为转籍凭据，一些久住家庭录进正册。几位长者开始筹钱，想给后来的亲友留一处落脚的[Concept('hbe_history_huiguan', '会馆')|e]。\n\n几位新户长者请求在旧桥旁建一座共同会馆。馆中既可收留后来者，也可登记货物与工钱。旧族担心会馆另成一套号令，行会则认为，若能把各地来客交给会馆担保，城中的账目会更容易查清。这些人当年带着行李来到渡口，如今已经能凑出一笔修桥钱。他们希望出资后能在桥约上署名，而不是只在碑末列作寄居的善人。我们可以承认会馆的共同见证，也可以把它限制为施济之所，不准参与乡议。"
 hbe_migration.9.desc.after_b: "长期租约得以续订，新旧住户仍分册保留。长者想合办[Concept('hbe_history_huiguan', '会馆')|e]，替今后来住的人担保，也保存各家的货账。\n\n几位新户长者请求在旧桥旁建一座共同会馆。馆中既可收留后来者，也可登记货物与工钱。旧族担心会馆另成一套号令，行会则认为，若能把各地来客交给会馆担保，城中的账目会更容易查清。这些人当年带着行李来到渡口，如今已经能凑出一笔修桥钱。他们希望出资后能在桥约上署名，而不是只在碑末列作寄居的善人。我们可以承认会馆的共同见证，也可以把它限制为施济之所，不准参与乡议。"
 hbe_migration.9.desc.after_c: "正户名额仍由旧族担保，几家人没有得到转籍。留下的长者遂提出合办[Concept('hbe_history_huiguan', '会馆')|e]，先为往来同乡找一处可托付的地方。\n\n几位新户长者请求在旧桥旁建一座共同会馆。馆中既可收留后来者，也可登记货物与工钱。旧族担心会馆另成一套号令，行会则认为，若能把各地来客交给会馆担保，城中的账目会更容易查清。这些人当年带着行李来到渡口，如今已经能凑出一笔修桥钱。他们希望出资后能在桥约上署名，而不是只在碑末列作寄居的善人。我们可以承认会馆的共同见证，也可以把它限制为施济之所，不准参与乡议。"
 hbe_migration.10.desc.after_a: "会馆的见证获准写入乡约，修桥出资也留下了姓名。馆中人将历年路凭与新约归到一处，来问后代是否还须重新办起。\n\n最早来问田地的几位长者已经去世，他们的子女把旧乡信件、入蜀路凭与本府契纸一并交来。书记从中翻出准入、限留、担保与过境的不同批语，发现它们仍是遇事逐案援引，没有一份办法能说清后来的家庭应当怎样申请。旧户请求保留祖辈出钱修桥养仓的份额，新户则想让多年居住与出资得到持续承认。前几次府议留下的支持各不相同，如今须据此为下一代定下一条能够遵循的路。"
 hbe_migration.10.desc.after_b: "会馆获准试办，账目由府署核验。年末交账时，长者又捧来多年居住与出资的凭记，请求留下长久办法。\n\n最早来问田地的几位长者已经去世，他们的子女把旧乡信件、入蜀路凭与本府契纸一并交来。书记从中翻出准入、限留、担保与过境的不同批语，发现它们仍是遇事逐案援引，没有一份办法能说清后来的家庭应当怎样申请。旧户请求保留祖辈出钱修桥养仓的份额，新户则想让多年居住与出资得到持续承认。前几次府议留下的支持各不相同，如今须据此为下一代定下一条能够遵循的路。"
 hbe_migration.10.desc.after_c: "会馆只准施济，乡议仍由旧户主持。长者把获准和未获准的批语分别收好，希望后代至少知道应照哪条规矩申请。\n\n最早来问田地的几位长者已经去世，他们的子女把旧乡信件、入蜀路凭与本府契纸一并交来。书记从中翻出准入、限留、担保与过境的不同批语，发现它们仍是遇事逐案援引，没有一份办法能说清后来的家庭应当怎样申请。旧户请求保留祖辈出钱修桥养仓的份额，新户则想让多年居住与出资得到持续承认。前几次府议留下的支持各不相同，如今须据此为下一代定下一条能够遵循的路。"

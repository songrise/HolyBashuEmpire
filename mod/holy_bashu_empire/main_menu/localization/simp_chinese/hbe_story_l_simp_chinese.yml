 hbe_short_eastern_river.2.title: "对岸传来的回声"
 hbe_short_eastern_river.2.desc: "江号与祭号的用途已有裁处，实际试用时，峡壁回声仍让船夫分不清上游和下游。\n\n试号在峡中产生回声，听者仍会把上游和下游混淆。船夫建议辅以灯数，乡民却担心夜间灯油成为新的摊派。府署可以供油，也可以让受护的商船付费。试号的人隔岸挥手，喊声却从背后的岩壁传来。带灯的船夫提出再试一次，先来请取灯油的人却问这笔钱记在哪家账上。"

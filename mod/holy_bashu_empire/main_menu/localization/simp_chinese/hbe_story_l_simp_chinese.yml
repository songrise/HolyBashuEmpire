 hbe_short_western_tea_horse.2.desc: "一支商队在山口遇雨，外层茶砖受了潮，里面仍可冲饮。收茶人只肯按废茶收购，茶户请求拆开分验。赶马人说，如果每篓都拆，包装又得重做，雪来之前恐怕赶不到下一处市集。\n\n纸户提出在篾篓内加一层纸，茶商担心多花采办钱。试装能少受潮，却会增加驮马负担。我们可资助两种包装对照，也可让商人自己承担更换。\n\n“被雨打湿的茶砖”第2篇。"

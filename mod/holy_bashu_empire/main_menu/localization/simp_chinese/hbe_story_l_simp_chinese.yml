 hbe_story_eastern_river.202.a: "把章程留给后来者。"
 hbe_story_eastern_river.202.title: "川江护航总署"
 hbe_story_eastern_river.202.desc: "护航船队接过统一的通行券，江岸各站不再各收一遍。军府能够把领航、运输与守备一起安排，商船也须接受船队的行期和费用。多年争论留下的水势谱，最后成为总署调度江道的凭据。\n\n各站开始使用同一张通行券，护航官将领航与值夜编到一起。船户往后有了可依的行期，也须照总署办法缴费、领谱，不能再各循旧牌。"
 hbe_story_eastern_river.8.c: "封存旧案，不另立长期章程。"
 hbe_story_eastern_river.8.title: "百滩共用的船约"
 hbe_story_eastern_river.8.desc: "谱册已有更新与传习的办法，沿江各站开始商议，谁应当长期主持这份积累。\n\n最初的滩记已经抄成数代水势谱，一些老引水人的姓名如今只留在谱后。沿江各府愿把这些经验定成长期通行规则。我们可以让谱册随船夫流传，也可以把它与护航船队的权利结合。两条道路都能使江运受益，却会把江道交给不同的人主持。"

 hbe_short_shared.202.title: "尚未写明的墓地"
 hbe_short_shared.202.desc: "一户新来人家在山脚埋葬长者，旧村认为那片坡地留作公共牧路，请求移墓。家属说安葬时问过附近住户，没人说过这一条旧约。墓旁已经栽下小树，孩子每天都沿那条路走去。\n\n乡老提出另给葬地，费用应由迁户承担；医者提醒，近来人家接连迁入，迟早需要一处有共同规则的葬地。府署可以为迁葬出钱，也可以保护现墓、改牧路，或坚持旧界却设一次救济。"

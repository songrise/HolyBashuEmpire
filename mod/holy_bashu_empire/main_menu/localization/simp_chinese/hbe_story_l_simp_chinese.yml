 hbe_story_northern_shudao.111.title: "达州关外的空仓"
 hbe_story_northern_shudao.111.desc: "达州商队在关外等待放行，附近仓房却因税额过高而一直空着。仓主宁愿不收货，也不愿承担货物受潮后的赔钱。\n\n关吏主张减税招货，府库却指望这笔收入支付守关。我们可以改定仓税，提供短期担保，或把仓房交给守军。一个卖粮小贩已经把粮袋拆开晾晒，他等不起关吏与仓主把旧规争论到下一季。"

 hbe_migration.2.title: "一块尚未开出的田"
 hbe_migration.2.desc: "渡口仍有等待田地的人家：有人已按先前裁定留下，有人只获临时借住，另有人带着新的担保前来。书吏指向城外的一片荒坡，村民却说，那里虽然多年无人耕作，冬天仍要放牲畜，春天还得从坡脚引水。此前的居留安排没有定下这片地的归属。\n\n我们若把地直接交给新户，开垦会更快，旧有牧路却需要补偿；若只准他们向田主租种，府库可以少花一笔钱，他们也可能很快背上无力偿还的预支。几根新插的木桩已经把草坡分成小块，尚无人说得清哪一道界线得到了承认。\n\n“湖广填四川”第2章。入籍、工牌与乡约的历次决定，会影响最后留下的共同章程。"

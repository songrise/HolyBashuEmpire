 hbe_story_northern_shudao.2.title: "阴云下的驿刻"
 hbe_story_northern_shudao.2.desc: "连日阴雨让驿卒看不到日影，误时的粮队停在关门外。匠人带来一只[Concept('hbe_history_timekeeping', '漏壶')|e]，认为流水计时可以补足山口的缺陷。\n\n漏壶需要定期校验，也会消耗驿站人手。几个关将希望把它留在军营，书生则请求与城中旧刻相互对照。\n\n本篇是“山壁上的星历”的第2章。前面的选择将决定最后保留哪一种长期章程。"

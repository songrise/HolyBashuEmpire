 hbe_short_shared.41.title: "同一天的两件事"
 hbe_short_shared.41.desc: "几户新住民按旧乡祭日备饭，恰与本村清渠的日期相逢。领役人认为他们借礼俗逃工，新户说自己已经在别的日子出过力。乡老愿另定一日，却担心以后人人都按自家习俗请求改役。\n\n府署可允许调役，也可维护既定役日，或雇人先补渠工。不同安排都需有人承担延期或雇用的钱。清渠的人手已经点过，祭席也摆好了。迁户拿来两份同一天的安排，请书记至少把实际出过工的日子记清。"

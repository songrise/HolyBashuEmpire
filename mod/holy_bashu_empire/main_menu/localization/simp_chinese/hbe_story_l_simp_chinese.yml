 hbe_story_southern_salt_wine.8.title: "给巨兽留下名字"
 hbe_story_southern_salt_wine.8.desc: "前几代人留下的骨架、石层图和足印终于能相互比照。师生请求给其中几种[Concept('hbe_history_zigong_fossils', '巨兽')|e]定名，药商和陈列者也提出了自己的称呼。\n\n这些巨兽的年代远在我们熟悉的家谱之外。最后的整理既可成为地方学问，也可成为盐场招徕宾客的珍藏。\n\n历年的选择已经留下方向；最后的章程只能从已经得到支持的道路中确定。"

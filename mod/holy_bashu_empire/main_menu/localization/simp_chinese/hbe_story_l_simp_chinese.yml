 hbe_story_northern_shudao.2.title: "阴云下的驿刻"
 hbe_story_northern_shudao.2.desc: "山口晨昏有了初步记录，阴雨到来后，驿卒发现单凭日影还无法守住行期。\n\n连日阴雨让驿卒看不到日影，误时的粮队停在关门外。匠人带来一只[Concept('hbe_history_timekeeping', '漏壶')|e]，认为流水计时可以补足山口的缺陷。漏壶需要定期校验，也会消耗驿站人手。几个关将希望把它留在军营，书生则请求与城中旧刻相互对照。"

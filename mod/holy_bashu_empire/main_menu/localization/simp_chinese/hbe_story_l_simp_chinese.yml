 hbe_story_western_tea_horse.108.desc: "松州织毯人愿收一位府城学徒，却要求他先住进牧户，了解图纹背后的旧事。学徒的担保家族认为这是失了体面，要求将传习改在城中。\n\n织毯人说，若只学几种颜色，便不算学会这门手艺。府署可认可双方约定，也可安排城中授课，或让商人只采购成品。怎样传习，将影响牧户今后是否还愿把技法带到城里，而不仅仅是一位学徒怎样生活。"

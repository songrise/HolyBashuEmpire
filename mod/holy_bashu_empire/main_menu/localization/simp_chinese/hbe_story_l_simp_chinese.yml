 hbe_short_eastern_river.23.title: "下一次雨季"
 hbe_short_eastern_river.23.desc: "一位拓工在峡壁旧刻上留下数张纸样，过路船户愿把它们带到城中出售。村寨认为石刻记着祖辈渡江的旧事，不该由陌生人定价。拓工说，若无人买纸，明年便没人再来查记那些正被风雨磨平的字。\n\n石面缺损又扩大了，村寨愿搭小棚遮雨，却需要船户运木。买主希望把最完整的石块移走保存。我们可以让它留在峡中，也可以接受异地保管，或保留纸本而减少对山路的开凿。\n\n“峡中留下的拓本”第3篇。"

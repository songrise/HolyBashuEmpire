 hbe_short_shared.13.title: "能不能留下门牌"
 hbe_short_shared.13.desc: "织机与房租已有新的约定，一家人继续在本地居住做工，却还没有在乡册上留下自己的住处。\n\n迁户准备买下自己的住处，请求在门牌上写本府住户。院主愿售，旧族却认为买屋不等于取得共同乡议的名额。查户的人停在门前，只在院主名下画了记号。真正每日开门、纳租和修路的一家，仍等不到自己的门牌。"

 hbe_story_central_hills.109.title: "广安山村的染缸"
 hbe_story_central_hills.109.desc: "广安村民用山草染布，染坊主却称这些颜色不合行会规矩，不许他们进城销售。一个买家穿着新染的布衣来到府衙，证明自己正是按这种颜色订货。\n\n染坊愿收村民作工，但不准他们保留自己的配方。府署可准许新布试售，也可按旧行会验色，或出钱让两种技法相互比较。市场究竟需要什么，不应只由最早取得牌照的人说了算。"

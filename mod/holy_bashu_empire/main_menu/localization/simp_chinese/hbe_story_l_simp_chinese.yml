 hbe_short_shared.62.d: "停止后续办理，到此结束。"
 hbe_short_shared.62.title: "田里的虫"
 hbe_short_shared.62.desc: "借种与供水已经裁处，农户种下第一批谷，随后却带来了田边的虫害消息。\n\n新种有一部分遭虫，旧户认为不应继续推广，迁户指出另一块坡田结穗较好。我们可以比较田势，也可先恢复熟悉的作物。几株伤苗连着田泥放在案上，靠水与背坡的虫痕并不一样。农户想知道该换种、换田，还是先把虫查清。"

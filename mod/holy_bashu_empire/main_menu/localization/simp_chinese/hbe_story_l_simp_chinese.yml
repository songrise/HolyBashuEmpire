 hbe_migration.10.title: "户册里的下一代"
 hbe_migration.10.desc: "最早的几位船客已经去世，他们的子女把旧乡信件、入蜀路凭和本府地契一起交来。书记翻到户册最前面的空白页，看见早年的过境凭记、担保字据与临时居留批语仍夹在一起，没有一份办法适用于所有后来的人。经过几十年的开垦、争执与互助，我们须给后来者留下一种可以遵循的办法。\n\n新户请求以居住与出资获得同等承认，旧户则希望把祖辈供养桥仓的功劳继续保留下来。府署可以建立接纳新人的长期章程，也可以确认本府由旧户主持、外来者须逐案担保的秩序。此前的每一次决定，都使其中一种安排更容易得到乡里的接受。\n\n“湖广填四川”第10章。入籍、工牌与乡约的历次决定，会影响最后留下的共同章程。"

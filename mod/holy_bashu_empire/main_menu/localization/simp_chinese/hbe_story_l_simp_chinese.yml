 hbe_short_shared.73.title: "旧坊的新学徒"
 hbe_short_shared.73.desc: "配方与旧货的使用已有裁处，两位师傅仍有各自的活计，同一个学徒又使他们坐回案前。\n\n两位师傅继续做活，却都想留下同一个学徒。无论配方最后留在合坊还是另作使用，家属都希望孩子能向两人传习，行会则要求固定师傅。府署须决定，收徒应怎样分担工钱与传艺责任。学徒先收好自己的工具，家属却不肯替孩子只认一位师傅。两家都要有人干活，也都不愿白教另一家的徒弟。"

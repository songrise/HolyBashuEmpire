 hbe_story_southern_salt_wine.5.title: "巨兽的足印"
 hbe_story_southern_salt_wine.5.desc: "山溪露出一块留有三趾凹痕的石板，乡民说它是巨龙踏过的痕迹。师生把凹痕与旧骨架比照，认为它们可能来自在水边行走的巨兽。\n\n搬走石板会改变溪边的道路，原处村寨要求留下副本。府城的陈列者则希望得到原件，借此补全多年积累的图志。\n\n本篇是“井下巨骨”的第5章。前面的选择将决定最后保留哪一种长期章程。"

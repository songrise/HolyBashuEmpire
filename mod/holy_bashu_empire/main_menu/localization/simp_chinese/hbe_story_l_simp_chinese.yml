 hbe_story_chengdu_plain.3.title: "山界上的新田"
 hbe_story_chengdu_plain.3.desc: "垦户在当年发现幼兽的坡地开出了新田，巡山者却发现旧有竹林已经连成零碎的几片。乡老说，没有这些田，几户新来的家庭便过不了冬。\n\n我们若划定护兽山界，就须补偿受影响的农户；若任由田地扩展，也不能再向府城保证山中仍有活兽。\n\n本篇是“竹林中的白熊”的第3章。前面的选择将决定最后保留哪一种长期章程。"

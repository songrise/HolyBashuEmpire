 hbe_short_central_hills.23.title: "下一次修桥钱"
 hbe_short_central_hills.23.desc: "修桥时几家人替穷户垫过粮，十年后债簿仍在收息。旧桥已修好，债主却把新的维修钱也记在同一页上。乡老请求府署查清当年的担保，商人说若轻易免债，下次没人肯为公共事业出钱。\n\n新的桥脚需要维修，先前的债主仍愿垫钱，但要求明确还期。乡民愿按受益出资，不再把费用压在几个穷户身上。府署可以改成共同公账，也可以以担保维持旧有垫款。\n\n“桥边的债簿”第3篇。"

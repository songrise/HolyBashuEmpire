 hbe_story_northern_shudao.5.desc: "山路受阻后，几处测候簿无法按时送到府城。驿吏想借机把所有测候者纳入驿役，村寨却坚持只按旧约交送。\n\n书坊愿教村民抄写副本，只需府署承担纸墨。关将则希望把原件锁在各自的关库，免得泄露夜间守望。\n\n本篇是“山壁上的星历”的第5章。前面的选择将决定最后保留哪一种长期章程。"

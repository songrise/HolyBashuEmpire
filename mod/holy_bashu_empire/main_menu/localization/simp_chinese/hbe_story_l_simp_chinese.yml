 hbe_migration.4.title: "新渠末端的村落"
 hbe_migration.4.desc: "祭席与谱册的争议暂有安排，新旧村落仍须共用水土，渠尾新修的一段水路又带来新的分担问题。\n\n新住户修通一条支渠，渠尾的几片田终于可以播种。上游村民却拿出旧分水簿，指责他们从未承担清渠的旧账。渠工说，过去没人愿意修这一段，如今田里有了水，人人又想起它属于哪一本册子。新村请求按受益田亩分水，也愿补出一份日后的维修钱；旧村坚持先偿还历年的欠工。若准新村用水，府库须替双方核算旧账，并安抚上游；若把新渠暂时封住，旧村会安心，新垦户这一季却只能望着已翻过的田。"

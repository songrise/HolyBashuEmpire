 hbe_story_eastern_river.105.title: "武隆山中的蜂蜜"
 hbe_story_eastern_river.105.desc: "武隆山民把野蜂蜜送到府城，买家称有些蜜味混杂，只肯按最低价收购。采蜜人说，不同山花本就会酿出不同味道，若只收一种，他便须多走几日险路。\n\n府医愿辨识不同蜜源，商人则希望统一货色便于转售。我们可以资助分类，也可确认一种官价，或准山民在市中直接交易。采蜜人的手臂还留着蜂蜇，他不愿自己的劳作只换来一句货色不纯。"

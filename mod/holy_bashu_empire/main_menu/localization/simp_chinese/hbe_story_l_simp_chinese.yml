 hbe_story_western_tea_horse.5.title: "小马驹的去处"
 hbe_story_western_tea_horse.5.desc: "医马人照料的母马生下小驹，马商希望提前订购，军府要求按旧约优先挑选。牧人认为长期收治应当留下一部分后代。\n\n这批幼马既能补充商队，也能改变本府的马源。我们必须把繁育收益与照料责任一起分配。\n\n本篇是“山路上的医马人”的第5章。前面的选择将决定最后保留哪一种长期章程。"

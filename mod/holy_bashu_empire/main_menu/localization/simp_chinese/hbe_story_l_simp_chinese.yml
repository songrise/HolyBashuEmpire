 hbe_story_western_tea_horse.3.title: "冬季草场"
 hbe_story_western_tea_horse.3.desc: "采药有了安排，养病的马却不能只靠几味草药过冬；茶队带来了新的草场请求。\n\n商队请求在村落冬牧场养病马，村民担心自己的牛羊没有草吃。马商愿付租，但只肯向一位村寨头领交钱。牧人提出分区轮牧，府署需要先确认谁有权出租这些草场。缺少这一层安排，医马人便无法维持牲畜过冬。"

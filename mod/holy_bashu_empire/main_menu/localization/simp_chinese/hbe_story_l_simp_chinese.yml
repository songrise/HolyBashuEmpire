 hbe_story_eastern_river.6.title: "两府各收一遍"
 hbe_story_eastern_river.6.desc: "木料分配有了裁处，船场和守望站各自留下账目，船主却发现同一次过峡仍须两次掏钱。\n\n上游和下游各设了引水收费站，持有同一本谱册的船主仍须交两笔费用。两地守望者都说自己的岗役不可缺少。船帮建议凭一张通行券结算，再由两府分账。接受此法需要公开各站费用，也会减少本府独自定价的余地。"

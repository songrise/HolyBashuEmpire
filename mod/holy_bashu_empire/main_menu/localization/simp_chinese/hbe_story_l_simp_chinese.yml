 hbe_short_eastern_river.21.title: "可不可以拓这面石壁"
 hbe_short_eastern_river.21.desc: "一位拓工在峡壁旧刻上留下数张纸样，过路船户愿把它们带到城中出售。村寨认为石刻记着祖辈渡江的旧事，不该由陌生人定价。拓工说，若无人买纸，明年便没人再来查记那些正被风雨磨平的字。\n\n乡老希望先限定拓印范围，商人请求把整面石刻收入货册。府署可以为查记出钱，也可以让拓工付村寨分成，或暂禁出售。保存与交易需要明确各自的权利。拓工把一张未裁的纸样贴在案上，乡老指出其中几行与渡江旧约有关。商人却只问，照料石壁的钱能否从卖纸里分出。"

 hbe_short_northern_shudao.13.title: "下一轮轮戍"
 hbe_short_northern_shudao.13.desc: "旧册的错处已经另作处理，城门仍须轮流有人值守，下一轮点名又将送到村中。\n\n下一轮名册送到村里，年轻人指着空栏问：换班迟到、提前回乡和病中替岗，应当各算哪一天。军官承认旧日期出了错，却仍须保证城门逐夜有人。府库可以预留雇替的钱，关军也愿集中供养一批常守的人；村寨则提出自己议定轮值，每季把工钱和实出日数送来查认。新册上的姓名已经写齐，这些空栏该怎样填，才会决定错账以后还会不会重来。"

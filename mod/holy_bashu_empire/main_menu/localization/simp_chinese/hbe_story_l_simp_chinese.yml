 hbe_story_southern_salt_wine.6.title: "龙骨与旧说"
 hbe_story_southern_salt_wine.6.desc: "府学新图志把骨架画成几种巨兽，删去了飞龙的翅膀。寺观的讲者批评这种画法冒犯旧说，盐商却发现宾客对这些不同寻常的形象更感兴趣。\n\n抄书人希望刊出观察依据，让读者自己判断。我们必须决定怎样保护查验者，又怎样回应依靠旧传维生的人。\n\n本篇是“井下巨骨”的第6章。前面的选择将决定最后保留哪一种长期章程。"

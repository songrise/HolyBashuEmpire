 hbe_story_eastern_river.103.title: "两江会流的鱼网"
 hbe_story_eastern_river.103.desc: "重庆渔户在两江会流处放下细网，几日便捕到许多小鱼。老渔民担心来年无鱼可捕，鱼商却称城中买家已经预付货钱。\n\n禁用细网会减少今季收入，也可能让穷渔户失去偿还预支的机会。府署可以给他们换网，也可划出禁捕时段，或依照旧约允许本季捕完。城中宴席的鱼价，正与江上住户下一年的生计联系在一起。"

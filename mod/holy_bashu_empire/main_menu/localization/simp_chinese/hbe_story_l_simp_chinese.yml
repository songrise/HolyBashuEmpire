 hbe_story_chengdu_plain.2.a: "付钱请竹农照料，伤愈后放归。"
 STATIC_MODIFIER_NAME_hbe_story_choice_chengdu_plain_2_2: "实地查验"
 STATIC_MODIFIER_DESC_hbe_story_choice_chengdu_plain_2_2: "由这次抉择形成的短期安排。具体影响见下列数值。"
 hbe_story_chengdu_plain.2.b: "为医者留出一处安静的竹院。"

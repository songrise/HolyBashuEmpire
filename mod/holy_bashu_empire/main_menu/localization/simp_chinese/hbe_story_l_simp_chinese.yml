 hbe_story_southwestern_valleys.107.desc: "马湖村寨过节时把鼓搬到渡船，船上来客纷纷停留，掌渡者却担心误了官货行期。击鼓者说，旧年正是在同一条船上与邻寨订下往来之约。\n\n府署可另给节船，安排共用时段，也可优先保证官货。商人希望借节日开市，却不愿承担渡船的修补。怎样安排这面鼓，将影响村寨的节日能否与新增加的商货一同留在渡口。"

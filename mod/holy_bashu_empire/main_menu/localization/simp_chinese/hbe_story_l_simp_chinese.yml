 hbe_short_southwestern_valleys.12.title: "寨仓里的两把钥匙"
 hbe_short_southwestern_valleys.12.desc: "铁门与供货的争执已有裁处，门装进寨仓以后，保管钥匙的人选又引来两方争论。\n\n寨仓换上新锁，掌仓者把钥匙交给自己的亲族。仓中还存着住户寄放的粮，乡老因此要求共同开仓；铁匠的供货约却没有规定钥匙由谁保管。寨主认为公开钥匙会使仓粮失去保护。府署可设共同保管，也可只让官吏负责清点。两把钥匙放在粮册两侧，看仓人问谁来签下每次开门的时日。只要一方不到场，寄放的粮便也取不出来。"

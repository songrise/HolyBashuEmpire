 hbe_short_eastern_river.1.title: "先定谁的号"
 hbe_short_eastern_river.1.desc: "江防站更换了一种较响的号角，远处村寨却把它误认成山中祭号。一次夜汛时，粮船仍照旧号出发，险些撞上漂木。军官要求所有村寨学会新号，村民则认为江岸站从未问过他们旧有的报水办法。\n\n军官请求禁止民间祭号在夜里吹奏，乡老认为这会使旧礼无处举行。我们可以组织船夫与村寨重新试号，也可以先按军令统一，再给村民另定祭期。\n\n“夜里听不见的江号”第1篇。"

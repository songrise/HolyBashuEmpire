 hbe_short_western_tea_horse.11.title: "马暂留在哪里"
 hbe_short_western_tea_horse.11.desc: "一匹从冬市买来的马带着两处烙印，新旧马主都说自己拥有它。新买主已把马交给赶马人驮货，旧主人拿出的见证又来自另一座山寨。商人担心争执扩大，马医却发现旧烙处一直没有愈合。\n\n两方都不肯把马留给对方，府署可付钱请马医照料，也可以先依市契交还买主，或让山寨共同作保。处置暂时的照料，比立即定出最后归属更急。\n\n“马群中的旧烙印”第1篇。"

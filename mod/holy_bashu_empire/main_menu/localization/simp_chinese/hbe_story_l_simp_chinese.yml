 hbe_short_shared.216.d: "暂缓裁定，不再由府库出资。"
 hbe_short_shared.216.title: "移来的一口铁锅"
 hbe_short_shared.216.desc: "一家湖广人带来一口旧铁锅，借给邻里煮共同的饭。锅裂以后，两家都说对方烧火过猛，旧乡匠人愿修，本地铁坊只肯回炉。家属不愿仅按废铁价交出它，锅上还留着几代人添补过的痕迹。\n\n府署可以为修锅出钱，比较两种技法，也可以按本地铁坊办法处理，或让两家共同订新锅、保存旧补片。小物的价钱不大，它在新乡被怎样对待却会被许多人记住。"

 hbe_short_northern_shudao.12.title: "旧签押下面的日期"
 hbe_short_northern_shudao.12.desc: "关军与村寨各留一册轮戍工钱，名字相同，记的日期却不一样。几名士兵已经回乡耕作，仍被算在缺役的人里。书记说两册无法对照，只能请家族作保；士兵认为自己守过的城门不该由家世来证明。\n\n核对发现书记把回乡日写成了起役日。军官担心公开更改会损害守备声望，村寨请求立即退还错扣的粮钱。府署可公开改册，也可内部重抄，保留官署体面。\n\n“轮戍人的两册工钱”第2篇。"

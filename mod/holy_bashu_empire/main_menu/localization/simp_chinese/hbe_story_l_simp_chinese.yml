 hbe_story_eastern_river.109.title: "酉阳山市的两种话"
 hbe_story_eastern_river.109.desc: "酉阳山市的一笔交换因翻译争执而中止，买家以为自己已经付清，卖家却说还有一匹布没有交。兼做翻译的年轻人属于其中一个村寨，另一方不肯相信他的说法。\n\n府署可派书记学习当地语言，也可要求交易一律按府城契纸办理，或让不同村寨共同挑选翻译。商货不多，这一次处理却会影响下次赶市的人是否还愿意带货下山。"

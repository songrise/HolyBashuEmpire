 hbe_short_eastern_river.13.title: "船坞开门的时候"
 hbe_short_eastern_river.13.desc: "工具的出资与使用已有安排，船坞接下新活以后，先修哪条船却没有写在旧约里。\n\n新船入坞时，几个老渔户仍被排在最后。船匠请求为小船保留固定时段，商号说停修一天大船损失更多。此前的岸地与工具契约并未说清小船的排期。府署如今须决定，修船时段应怎样在渔户与大船商之间分配。一条渔船已经在岸边等了两天，修大船的工架却一直没空。渔户带来的鱼坏了半筐，商号的伙计仍把下一张大船单压到最上面。"

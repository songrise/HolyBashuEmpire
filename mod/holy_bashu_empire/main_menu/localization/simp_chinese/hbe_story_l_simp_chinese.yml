 hbe_story_southwestern_valleys.102.title: "盐源盐池的水口"
 hbe_story_southwestern_valleys.102.desc: "盐源盐池边的农户在上游修小水口，盐户认为它使卤水变淡，要求立刻拆掉。农户却说，若无水口，刚种下的田地便会干裂。\n\n老盐工愿与农户一起分季用水，掌盐者只想维持定额产盐。府署可以组织查验，也可补偿农户改种，或重新分配盐池税额。两方都依靠同一股来水，单听一种收益便很难看清另一方失去的是什么。"

 hbe_story_central_hills.2.title: "新埂挡住旧路"
 hbe_story_central_hills.2.desc: "新修的梯埂挡住了村民去义仓的近路，筑埂者却说若拆开缺口，雨水便会再次冲走土壤。粮商要求另修道路。\n\n几户田主愿出地，却不愿再出役夫。若府署继续依赖旧役额，修好的梯田也会让乡里生出新的怨恨。\n\n本篇是“坡田与水土”的第2章。前面的选择将决定最后保留哪一种长期章程。"

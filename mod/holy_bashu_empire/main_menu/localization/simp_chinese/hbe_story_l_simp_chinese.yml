 hbe_story_eastern_river.7.title: "纸谱与新船"
 hbe_story_eastern_river.7.desc: "引水收费的办法已经裁定，几年后，换了船型的船主又把旧谱送回案上。\n\n新式大船吃水更深，年轻引水人要求重新测量一些旧航道。书坊愿承印新版谱册，却不肯承担每年改版的成本。老船帮担心新人借新谱取代自己的位置。府署需要把更新、训练与收费安排在同一份船约中。"

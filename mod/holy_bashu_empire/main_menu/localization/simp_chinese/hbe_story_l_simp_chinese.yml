 hbe_story_western_tea_horse.102.desc: "名山来了一位外地制茶师，提出改变杀青的火候。本地老师傅愿与他比较，却担心学徒学会新法后离开原有作坊。\n\n茶户已备好一批鲜叶，若试验失败便没有第二次采摘可用。府署可以分担试制，限定先在小批茶上比较，或依旧保护旧坊的供货。来客没有在此安家，他希望得到的既有工钱，也有能够继续授徒的身份。"

 hbe_story_southern_salt_wine.201.title: "巨骨公藏与井谱"
 hbe_story_southern_salt_wine.201.desc: "一块块巨骨按井口与石层排列起来，师生终于能够辨认旧图中混在一起的残片。井工的姓名写在出土记录里，访学者可以借阅井谱而不必先购买药商的旧说。盐井仍要出卤，巨骨却有了独立于盐价的价值：后来的查验者可以从这些材料继续追问。\n\n几十年的笔记、工钱与争执没有凭空消失。它们被保存进新的章程，成为后来主持者必须继续履行的责任。至此，这段事业已经收束，获得的长期收益将随国家延续。"

 hbe_short_shared.212.title: "新乡来的纸伞"
 hbe_short_shared.212.desc: "外乡纸户试做轻巧的油纸伞，集市客人很快买走几把。旧作坊指责他们用了不惯本地雨季的纸，要求暂停出售。纸户愿拿伞在雨中比较，商人却已经订好一批要随茶队进山的货。\n\n我们可以给试验与退货留出时间，也可以保护旧作坊的验货权，或让买主按使用路段自己选择。若新手艺只需旧行会一声反对便停下，新户可能留下田，却不会留下自己的技艺。"

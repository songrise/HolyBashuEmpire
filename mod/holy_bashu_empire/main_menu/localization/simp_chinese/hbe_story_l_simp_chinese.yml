 hbe_short_shared.53.title: "留下来的医者"
 hbe_short_shared.53.desc: "外乡医者在本村开药铺，本地医者指责他未受行规。病家觉得新药价低，却担心所用药草与以前不同。两位医者都愿把治过的人列出来，家属希望比较病程，不愿只凭谁的名字更熟悉。\n\n经过这些日子的会诊与查方，一些病家愿继续找这位外乡医者问诊。他请求正式留下自己的铺号；本地医者愿收他的子弟为徒，却希望今后的诊治并入旧铺。府署可承认独立药铺，也可促成共用药舍。\n\n“一间新药铺”第3篇。"

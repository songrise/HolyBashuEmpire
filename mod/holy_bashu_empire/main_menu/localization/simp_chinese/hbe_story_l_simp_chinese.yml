 hbe_short_shared.205.desc: "一名迁来的妇人去集市卖布，被守门者扣下旧乡的路凭。守门人说路凭已经过期，家属却拿出在本府做工的工钱册。她的行李还在城门边，布贩正在等这一天的货。\n\n官署可以认可实际住行并补发路凭，也可要求继续寻找旧籍担保，或先放货再查人。新户是否能像旧户一样出入城门，会影响商人愿不愿给他们长期订单。"

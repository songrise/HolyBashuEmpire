 hbe_story_eastern_river.106.title: "合州铁匠的练炉"
 hbe_story_eastern_river.106.desc: "合州铁匠试用新炉，却需要比旧法更多的木炭。附近村民反对继续砍山，军府又在催要一批器械。炉边的学徒已经学会调火，不愿再回到效率较低的旧炉。\n\n府署可以给铁匠寻找新炭源，也可限制试炉，或让军府为专用炉承担材料。技法的收益与供养它的人手不在同一处，若只看出炉的铁器，山中的代价便会落在没人询问的住户身上。"

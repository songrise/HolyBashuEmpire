 hbe_story_southern_salt_wine.113.title: "酒坊留给学徒的席位"
 hbe_story_southern_salt_wine.113.desc: "川南几家酒坊准备合办祭师宴，却只准掌柜入席。年轻学徒想把自己试酿的新酒带来，师父担心他们尚不懂得行会礼数。\n\n一位没有儿子的老掌柜愿收徒，却要求府署承认外姓学徒也能继承作坊。贵族中的出资人反对，称坊产应当继续留在熟悉的家族手中。宴席上的一张座位，如今牵涉到了多年劳作之后谁能接掌炉火。"

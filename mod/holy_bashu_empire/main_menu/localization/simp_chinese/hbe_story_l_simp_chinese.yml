 hbe_story_western_tea_horse.7.title: "医马人的学生"
 hbe_story_western_tea_horse.7.desc: "马价和用途经过重议，照料的手艺越来越受用，旧行会却开始追问谁有资格进门学艺。\n\n学舍里既有府城医者，也有牧户子弟，旧行会要求只向有担保的家族传授技法。年轻人却已能独自处理几种常见马病。封闭传习可以保护行会，开放学舍则能让更多驿站获得帮助。军府愿支付工钱，条件是毕业者先为官马效力。"

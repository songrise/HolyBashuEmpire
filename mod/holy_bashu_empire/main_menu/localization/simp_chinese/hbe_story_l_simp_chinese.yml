 hbe_short_western_tea_horse.2.title: "篾篓里的新垫纸"
 hbe_short_western_tea_horse.2.desc: "茶损与行期已有处理，拆下的湿篓仍放在交割场，纸户从垫纸上看出了改装的余地。\n\n纸户提出在篾篓内加一层纸，茶商担心多花采办钱。试装能少受潮，却会增加驮马负担。我们可资助两种包装对照，也可让商人自己承担更换。纸户带来的垫样卷在旧篓旁，薄厚各不相同。驮户先试了马负，货主又问，少坏的茶是否抵得过多出的纸钱。"

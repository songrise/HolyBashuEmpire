 hbe_short_western_tea_horse.13.title: "下次冬市的验马"
 hbe_short_western_tea_horse.13.desc: "旧伤与市契的争议已有处理，到了下次冬市，怎样在交钱以前查清马况又成了问题。\n\n双方终于愿意按补价和照料费结案，请求以后在冬市先查烙印。旧验马人担心新规使自己失去主持，年轻牧人愿帮忙记马病。府署可训练共同验马，也可继续依旧验牌收货。下一拨马匹到市，验牌的人照旧伸手查印。牧户带着一册病历来，想在交钱之前也把伤病翻给买主看。"

 hbe_story_eastern_river.107.title: "夔州峡口的旧棺"
 hbe_story_eastern_river.107.desc: "夔州山民在崖缝中发现一具旧棺，船主想把它带到码头供宾客观看。村寨长者坚持棺中遗骨应当留在原处，府学师生则请求制作图录。\n\n搬运需要凿开部分石壁，留下它又会使行商失去一项招徕来客的生意。我们可以只让师生记录，也可与村寨议定参观，或由府署收存遗物。谁能解释旧人的生活，不该仅由出价最高的人决定。"

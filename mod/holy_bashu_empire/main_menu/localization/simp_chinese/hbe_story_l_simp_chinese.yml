 hbe_migration.8.title: "留下还是再走"
 hbe_migration.8.desc: "新一代已在蜀地长大，几户人家却又收拾行李，准备沿江返回。他们说这里有田，也有作坊，但一遇征役或田讼，自己仍被称为外来的客户。旧乡来信劝他们留下，说蜀中已经有人能代为接应新的亲族。\n\n田主不愿失去做惯农事的佃户，旧族却反对把来路不同的人一律列为正户。府署若承认长期居住与纳税的记录，就须调整旧有名额；若继续要求亲族担保，新户会明白，多年劳作仍换不来一份自己的位置。\n\n“湖广填四川”第8章。入籍、工牌与乡约的历次决定，会影响最后留下的共同章程。"

 hbe_short_western_tea_horse.23.title: "再一季的小屋"
 hbe_short_western_tea_horse.23.desc: "牧人愿在山口修一间歇脚屋，给冬行商队留灶和草料。城中客栈认为这会分走自己的住客，守军请求把屋子列为官用驿舍。出木料的村寨只希望过路者付足柴草钱，不愿承担新的固定岗役。\n\n又一季的商队带来修屋的消息，小屋虽然能歇脚，屋顶却仍须按时维护。村寨愿保留冬用，守军想全年驻守，商人希望把屋旁变成交易处。府署须决定这一处歇脚，最后服务的是旅人、军路还是边市。\n\n“雪路上的歇脚屋”第3篇。"

 hbe_story_northern_shudao.4.title: "星台建在哪里"
 hbe_story_northern_shudao.4.desc: "那次未能对上的月食留下了几份证词，各方都想少些临时争辩，多一处能反复查验的地方。\n\n平地书生建议在府城建星台，山口观测者却说高处能避开许多灯火和烟尘。供养官担心高台离驿路太远，材料难以运到。若让村民无偿搬石，旧有岗役就会再度加重。我们也可以缩小星台，把几处记录点连起来使用。"

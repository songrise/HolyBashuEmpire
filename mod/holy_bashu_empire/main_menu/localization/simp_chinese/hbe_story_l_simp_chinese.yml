 hbe_short_southern_salt_wine.13.title: "瓮上刻谁的号"
 hbe_short_southern_salt_wine.13.desc: "泸州酒户订做一批较薄的酒瓮，船户说装船更轻，窑工却担心长途碰撞。第一批货在合江卸船时破了数只，酒户指责船上的垫草不足。窑工带来完好的空瓮，要求把装载与烧造分开查验。\n\n商人带来下一批酒货的订单，提出若改用试样中的新瓮，便愿付高价，但只准刻自己的铺号。窑工认为应刻烧造者的记号，船户则想在瓮底留下装载检验。府署可以让这些责任都被看见，也可以以一家担保简化交易。\n\n“顺流而下的酒瓮”第3篇。"

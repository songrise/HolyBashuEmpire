 hbe_short_chengdu_plain.11.title: "诗卷要不要出售"
 hbe_short_chengdu_plain.11.desc: "一个行脚书生借住旧宅，替主人整理潮湿的诗卷。修屋需要的钱比卖书所得还多，书生却从夹页中找出几首从未刊印的旧诗。附近书坊愿替他刻板，条件是把旧宅主人的名字列在篇首。\n\n主人已经答应把书卖给一位收藏者。书生请求多留一个月，让书坊抄完缺页。我们可以买下这段时间，也可以维护原来的买卖，或让收藏者为整理出钱。书生带着未干的抄页前来，收藏者的仆人已经在院外捆箱。多留一天，修屋的木料和搬书的行期便都要重新算过。"

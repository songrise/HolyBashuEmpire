 hbe_migration.5.title: "外乡师傅的工牌"
 hbe_migration.5.desc: "来自湖广的木匠在本府学会了新的榫口，几个蜀地徒弟也跟着他做活。行会认为他尚未有自己的铺号，不该独立接单；年轻工匠则说，去年修仓和造船时，行会明明承认过他的手艺。\n\n商人愿为外乡师傅担保，条件是他先完成一批低价货。若府署发给工牌，作坊之间会出现新的竞争，旧行会也会失去一些份额；若只让他以客匠身份做工，眼下的规矩得以维持，徒弟们却可能跟着他去别处寻找铺面。\n\n“湖广填四川”第5章。入籍、工牌与乡约的历次决定，会影响最后留下的共同章程。"

 hbe_story_western_tea_horse.7.title: "医马人的学生"
 hbe_story_western_tea_horse.7.desc: "学舍里既有府城医者，也有牧户子弟，旧行会要求只向有担保的家族传授技法。年轻人却已能独自处理几种常见马病。\n\n封闭传习可以保护行会，开放学舍则能让更多驿站获得帮助。军府愿支付工钱，条件是毕业者先为官马效力。\n\n本篇是“山路上的医马人”的第7章。前面的选择将决定最后保留哪一种长期章程。"

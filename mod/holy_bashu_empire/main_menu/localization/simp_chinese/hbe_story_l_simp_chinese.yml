 hbe_story_southern_salt_wine.107.title: "合江船上的歌"
 hbe_story_southern_salt_wine.107.desc: "合江船工编出一支新歌，唱到船主克扣饭钱时，岸边的人纷纷跟唱。船主要求官府禁唱，并称船工已经用饭钱预支过衣料。\n\n老船工带来几季的清单，愿当众说清每一笔借款。若府署查账，会触怒掌握船位的人；若只是禁止歌谣，也无法解决船上长期积累的争执。码头的下一班船已经催着他们离岸。"

 hbe_story_western_tea_horse.113.title: "山口的两支歌"
 hbe_story_western_tea_horse.113.desc: "茶路上来往的人在驿站唱起不同的歌，府城官员嫌其中一支听不懂，要求只准唱熟悉的曲调。守站人却发现，两支歌都在提醒赶马人同一处险弯。\n\n书生愿把歌词记下，行商也想请歌者在市中演唱。我们可以承认不同声音，统一军用号令，或把民间歌声留给私人宴席。听懂一支歌需要时间，沿路行人是否愿意继续开口却可能由一次禁令决定。"

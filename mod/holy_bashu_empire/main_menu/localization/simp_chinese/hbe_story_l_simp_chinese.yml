 hbe_story_eastern_river.112.desc: "川东几村在江上放河灯祭奠亡者，灯船却堵住了晚到的商船。船主要求把祭礼移到别处，家属说自己的亲人正是在这个渡口失踪。\n\n乡老愿缩短仪式，商人也可等一夜，但谁都不肯先退。府署可以资助岸边祭礼，规定共用时段，或优先保证货运。一个孩子把灯又捡回了岸上，问母亲是否连这盏灯也得为城里的订单让路。"

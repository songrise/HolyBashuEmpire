 hbe_story_western_tea_horse.112.title: "边市留下的马铃"
 hbe_story_western_tea_horse.112.desc: "茶马市散后，驿卒拾到一只刻有家族记号的马铃，几位商人请求把它融成新铃。驿卒却记得主人是曾为我们带路的老牧人。\n\n府署可以派人寻主，存入公库，或按行会旧例让失物出售。马铃价值不高，但来此赶市的人会从处理方式看出，官府是否还记得未写进大宗契纸的小物与旧情。驿卒愿自己走一趟，只希望沿路有地方可以借宿。"

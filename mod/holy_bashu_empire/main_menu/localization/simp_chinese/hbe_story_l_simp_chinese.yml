 hbe_migration.8.c: "仍须旧族担保，维持正户名额。"
 hbe_migration.8.title: "留下还是再走"
 hbe_migration.8.desc: "契纸的用语已有裁定，多年住行渐渐留下记录，下一代却仍在询问这些记录能替自己换来怎样的身份。\n\n新一代已在蜀地长大，几户人家却又收拾行李，准备沿江返回。他们说这里有田，也有作坊，但一遇征役或田讼，自己仍被称为外来的客户。旧乡来信劝他们留下，说蜀中已经有人能代为接应新的亲族。田主不愿失去做惯农事的佃户，旧族却反对把来路不同的人一律列为正户。府署若承认长期居住与纳税的记录，就须调整旧有名额；若继续要求亲族担保，新户会明白，多年劳作仍换不来一份自己的位置。"

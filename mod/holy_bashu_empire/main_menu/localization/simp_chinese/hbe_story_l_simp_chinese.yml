 hbe_short_central_hills.22.title: "债主的另一本册"
 hbe_short_central_hills.22.desc: "修桥时几家人替穷户垫过粮，十年后债簿仍在收息。旧桥已修好，债主却把新的维修钱也记在同一页上。乡老请求府署查清当年的担保，商人说若轻易免债，下次没人肯为公共事业出钱。\n\n商人交出一本原册，上面的利率较低。书记说后来的抄本混入了桥钱，债主要求不要让一次错抄损害多年信用。府署可以公开更正，也可安排双方在共同见证下重立契纸。\n\n“桥边的债簿”第2篇。"

 hbe_story_southern_salt_wine.202.a: "把章程留给后来者。"
 hbe_story_southern_salt_wine.202.title: "盐城龙骨陈馆"
 hbe_story_southern_salt_wine.202.desc: "龙骨陈馆的门打开了，盐场来客在巨骨前停步，商人也愿为修井出钱。陈列保留了许多让人惊叹的形状，却没有解决师生争论的每一个疑点。府署把奇观与盐业连在一起，今后的主持者须同时面对宾客的期待和井户的账目。\n\n陈列者在开馆前再点过骨架，掌盐官另核了一遍供馆的钱。往后新井与新展都须争取这份收入，主持者也得向井户说明每次采买和修造。"
 hbe_story_southern_salt_wine.8.c: "封存旧案，不另立长期章程。"
 hbe_story_southern_salt_wine.8.title: "给巨兽留下名字"
 hbe_story_southern_salt_wine.8.desc: "井谱已有持续保管的办法，多年积累的骨架、石层与足印，终于到了可以总校的一天。\n\n早年陆续留下的骨架、石层图和足印终于能相互比照。师生请求给其中几种[Concept('hbe_history_zigong_fossils', '巨兽')|e]定名，药商和陈列者也提出了自己的称呼。这些巨兽的年代远在我们熟悉的家谱之外。最后的整理既可成为地方学问，也可成为盐场招徕宾客的珍藏。"

 hbe_short_chengdu_plain.12.title: "署名之前的疑问"
 hbe_short_chengdu_plain.12.desc: "诗卷经过一次整理与抄录，几张原先夹在书中的散页又带出了署名疑问。\n\n两份抄本的作者姓名不同，旧宅主人说是祖辈手误，收藏者却希望沿用较有名气的一位。书生请求保留疑问，不把推测刻成事实。掌礼官认为未定作者的诗不宜用在官宴。两张抄页写着同一句诗，题下却是不同的人名。书生不肯替任何一张涂去旧字，只请掌礼官把两页一同看完。"

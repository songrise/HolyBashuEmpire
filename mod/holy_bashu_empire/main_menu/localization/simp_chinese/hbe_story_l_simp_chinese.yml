 hbe_story_southern_salt_wine.6.title: "龙骨与旧说"
 hbe_story_southern_salt_wine.6.desc: "足印为巨骨添了新的线索，画师据骨架与石痕重画兽形，几处地方与旧传相差很大。\n\n府学新图志把骨架画成几种巨兽，删去了飞龙的翅膀。寺观的讲者批评这种画法冒犯旧说，盐商却发现宾客对这些不同寻常的形象更感兴趣。抄书人希望刊出观察依据，让读者自己判断。我们必须决定怎样保护查验者，又怎样回应依靠旧传维生的人。"

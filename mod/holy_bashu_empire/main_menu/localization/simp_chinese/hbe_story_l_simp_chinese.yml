 hbe_story_southwestern_valleys.111.title: "永宁谷口的宿账"
 hbe_story_southwestern_valleys.111.desc: "永宁宿店替来往商队记下饭钱，却把不识纸字的赶马人列作无人担保的欠户。赶马人拿出雇主交给自己的木牌，称饭钱本应由货主支付。\n\n宿店怕木牌无效，商人又已离开谷口。府署可以核实木牌并替赶马人追偿，也可要求家族担保，或为沿路宿店设统一账册。一个已经完成护行的人，不应到最后才知道自己的口粮并未算在工钱里面。"

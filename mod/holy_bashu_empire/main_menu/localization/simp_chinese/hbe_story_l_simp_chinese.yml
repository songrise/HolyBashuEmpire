 hbe_story_southern_salt_wine.2.title: "拼不回去的骨架"
 hbe_story_southern_salt_wine.2.desc: "各井送来的骨头已经堆满半间仓房，药商把形状相近的骨节串成一条巨龙。井工却指出，其中几块来自不同的岩层，根本不在同一处。\n\n府学希望逐井编号，井主不愿为抄录耽误工期。若没有清楚的来历，我们以后也无法分辨一具骨架由多少种生物拼成。\n\n本篇是“井下巨骨”的第2章。前面的选择将决定最后保留哪一种长期章程。"

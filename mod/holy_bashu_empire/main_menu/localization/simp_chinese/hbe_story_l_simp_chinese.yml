 hbe_short_shared.91.title: "可不可以联署"
 hbe_short_shared.91.desc: "迁户与旧户一起控告一名收路钱的管事，管事说迁户不在旧乡约中，没有资格联署。旧户愿替他们担保，条件是新户日后修桥也出同样的份额。诉状因此既问收费，也问谁算这条路上的人。\n\n府署可按实际住行受理，也可只认旧户联署，或先查收费凭据。管事希望在受理之前便把迁户的名字划去。迁户的手印已经按在诉状末尾，管事仍要书记把那几行裁掉。旧户出面担保，也请先说明这条路将来由谁修。"

 hbe_short_southwestern_valleys.2.title: "损坏的船板"
 hbe_short_southwestern_valleys.2.desc: "两家的船用已有安排，清舱时船工发现了一块受损的旧板，修船的责任又须另议。\n\n船板开裂后，盐商认为渔具划伤了船，渔户说货载过重。船匠愿查验，但须停船数日。府署可垫修船费，也可让出资者先决定修法。匠人把裂板翻给两家看，旧钉眼旁又添了新磨痕。盐商催着下水，船工却请先把下一趟能装多重写明。"

 hbe_migration.5.title: "外乡师傅的工牌"
 hbe_migration.5.desc: "分水与渠工旧账已经裁处，替本府做过木作的外乡师傅又带着旧工单，来问能否独立接活。\n\n来自湖广的木匠在本府学会了新的榫口，几个蜀地徒弟也跟着他做活。行会认为他尚未有自己的铺号，不该独立接单；年轻工匠则说，去年修仓和造船时，行会明明承认过他的手艺。商人愿为外乡师傅担保，条件是他先完成一批低价货。若府署发给工牌，作坊之间会出现新的竞争，旧行会也会失去一些份额；若只让他以客匠身份做工，眼下的规矩得以维持，徒弟们却可能跟着他去别处寻找铺面。"

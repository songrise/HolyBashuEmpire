 hbe_short_chengdu_plain.1.title: "谁该赔这匹锦"
 hbe_short_chengdu_plain.1.desc: "锦坊为远来的买主织了一匹新绣，晒过几日后，青色却渐渐发灰。买主不肯收货，掌染师傅说是新染料的问题，供料商却指出织坊用过旧缸。学徒留下了每次下料的记号，过去没人愿看这些杂乱的纸片。\n\n坊主请求府署先替他补出货期，以免失去外地订单。染户愿共同查缸，但要求查验时不要先给某一家定罪。我们若立即按旧担保追偿，货期可以赶上，真正的失色原因却可能留到下一匹锦。\n\n“失色的锦样”第1篇。"

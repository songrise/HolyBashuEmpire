 hbe_short_chengdu_plain.12.title: "署名之前的疑问"
 hbe_short_chengdu_plain.12.desc: "一个行脚书生借住旧宅，替主人整理潮湿的诗卷。修屋需要的钱比卖书所得还多，书生却从夹页中找出几首从未刊印的旧诗。附近书坊愿替他刻板，条件是把旧宅主人的名字列在篇首。\n\n两份抄本的作者姓名不同，旧宅主人说是祖辈手误，收藏者却希望沿用较有名气的一位。书生请求保留疑问，不把推测刻成事实。掌礼官认为未定作者的诗不宜用在官宴。\n\n“借来的诗卷”第2篇。"

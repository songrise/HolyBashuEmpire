 hbe_short_southern_salt_wine.21.title: "谁来认这座墓"
 hbe_short_southern_salt_wine.21.desc: "扩井时井工掘到几块旧墓砖。墓上没有清楚的姓氏，附近村民却不愿任由井主推平。掌盐官说新井能够补足今年盐额，师生希望趁开工前记下砖上图样。家属是否仍在本地，没人敢给出保证。\n\n几户人家都说与旧墓有渊源，却拿不出完整家谱。府署若暂缓开井，可给各方查认的时间；若照井约动工，盐额容易完成，乡里却会认为官府只认出卤。\n\n“井旁的旧墓”第1篇。"

 hbe_short_shared.93.desc: "路钱中的公私支出已经处理，原管事交出了旧账，新一季的主持人却还没有定下。\n\n管事辞去主持后，旧户请求由族老继任，新户提出按使用和出资推举。府署可承认共同主持，也可保留旧名额而公开账本。收钱的牌子还挂在路口，原管事已经交出旧册。谁来接任，会决定出过钱的新户下次能否亲自问账。"

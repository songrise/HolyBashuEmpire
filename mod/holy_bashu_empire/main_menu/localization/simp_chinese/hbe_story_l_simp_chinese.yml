 hbe_story_northern_shudao.107.title: "剑门关下的葬地"
 hbe_story_northern_shudao.107.desc: "剑门一名轮戍兵去世，家属请求把他葬在离关城较近的坡地。守将称那片地需要留作军用，乡民则愿给一处旧荒田。\n\n这名士兵曾替村寨修过桥，乡老希望府署承认他的劳作。我们可以给家属择地并减役，也可坚持军地用途，或设一处共同葬地。若所有答谢都止于送葬时的几句赞语，下一批轮戍者也会看见这种安排。"

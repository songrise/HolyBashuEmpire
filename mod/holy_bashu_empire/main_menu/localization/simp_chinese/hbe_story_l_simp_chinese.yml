 hbe_story_northern_shudao.7.title: "历书换了主持者"
 hbe_story_northern_shudao.7.desc: "新旧器物经过一轮比较与修整，熟悉操作的年轻人逐渐多起来，原先的主持者却病倒了。\n\n主持测候的学者去世，家族请求由长子继任。几处驿站却推举了熟悉观测的年轻书记，他们还未得到显赫家族的担保。若把测候职位世袭下去，早年的共同记录可能成为一家私藏；若公开择人，也要安置旧掌历者的家属。"

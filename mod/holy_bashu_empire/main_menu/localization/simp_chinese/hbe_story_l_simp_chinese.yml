 hbe_short_southwestern_valleys.22.title: "误译的一袋粮"
 hbe_short_southwestern_valleys.22.desc: "译写人的席位已有裁处，核对两份契纸时，他从同一笔交粮中认出了误译。\n\n两份记录把一袋粮写成了两袋，青年认为此前长者转述时省去了一处解释。主持者不愿公开认错，村民请求立即减去追加的粮额。府署可公开更正，也可用公粮补回差额。粮袋已经抬到堂前，旧译与新译却各写一种分量。若只补足差额，不说明错在何处，下一张契纸仍会照旧抄。"

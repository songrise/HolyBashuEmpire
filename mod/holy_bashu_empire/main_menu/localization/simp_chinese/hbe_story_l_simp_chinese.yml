 hbe_migration.2.title: "一块尚未开出的田"
 hbe_migration.2.desc: "渡口先前已作居留裁处，仍有已留、暂住或新带担保前来的人家等着田地，荒坡的归属却未议清。\n\n查田书吏指给求租的人一片荒坡，旧村却说冬天要在那里放牲畜，春天还须从坡脚引水。田主愿招佃户开荒，请求将整块地列入自己的庄册；几户人家已经借来木桩，想先把可修的埂标出来。若另给新户小契，旧牧路便须补偿；若让田主包办出租，租额又可能在下一季上调。过境与居留的先前裁定仍须分别遵守，这一次应给哪些家庭开垦凭据，眼下还没有定论。"

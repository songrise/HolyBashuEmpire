 hbe_story_eastern_river.6.desc: "上游和下游各设了引水收费站，持有同一本谱册的船主仍须交两笔费用。两地守望者都说自己的岗役不可缺少。\n\n船帮建议凭一张通行券结算，再由两府分账。接受此法需要公开各站费用，也会减少本府独自定价的余地。\n\n本篇是“峡江引水谱”的第6章。前面的选择将决定最后保留哪一种长期章程。"

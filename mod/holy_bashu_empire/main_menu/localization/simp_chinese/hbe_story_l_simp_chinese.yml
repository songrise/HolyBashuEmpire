 hbe_story_northern_shudao.201.title: "山地测候公课"
 hbe_story_northern_shudao.201.desc: "山口各站把记录送进测候台，旧仪器与新历书被放在同一张案上。主持者可以更换，查验的方法却不能随家世改变。学舍每年招收能够读簿和修器的年轻人，蜀道的晨昏从此有了一份可供后来者复核的共同记录。\n\n几十年的笔记、工钱与争执没有凭空消失。它们被保存进新的章程，成为后来主持者必须继续履行的责任。至此，这段事业已经收束，获得的长期收益将随国家延续。"

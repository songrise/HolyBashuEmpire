 hbe_migration.1.title: "峡口来的船"
 hbe_migration.1.desc: "一队船只停在峡口，船上既有湖北的佃户，也有背着木匣的江西匠人。他们带来的不是官府移文，而是同乡写在旧纸上的几行字：蜀中有人愿租地，也有人缺做工的手。渡口的乡老翻着本府户册，说来路不明的人不能凭一封私信分走水口和柴山。来往船户把这阵求田寻工的动静称作“[Concept('hbe_history_huguang_migration', '湖广填四川')|e]”。\n\n船上的老人已经把农具卸上岸，孩子却仍睡在空粮袋间。市民愿意招用匠人，田主希望有人开垦，旧户则怕将来税粮不足时，新旧人口会按同一份丁额出役。府署必须先决定，这些人算过路的客人，还是可以留下的住户。"

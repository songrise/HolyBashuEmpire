 hbe_story_central_hills.3.title: "一座小坝的归属"
 hbe_story_central_hills.3.desc: "村民在溪沟建起小坝，几处坡田因此能留住灌溉水。下游的磨坊主指称溪水变少，要求拆坝。\n\n乡老愿分季放水，磨坊主却只接受明确的契纸。水土工程逐渐改变了地方的旧有收益，我们不能只看坝上增出的粮食。\n\n本篇是“坡田与水土”的第3章。前面的选择将决定最后保留哪一种长期章程。"

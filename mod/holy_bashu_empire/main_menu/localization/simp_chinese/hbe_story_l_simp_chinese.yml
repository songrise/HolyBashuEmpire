 hbe_story_chengdu_plain.109.title: "蒲江茶园的旧坟"
 hbe_story_chengdu_plain.109.desc: "蒲江茶户在开垦荒坡时挖到几处旧坟，附近家族声称整片茶园都是祖茔的一部分。茶户已付过地钱，搬走便会失去几年劳作。\n\n族老愿接受一笔祭祀费用，却不肯承认茶户今后的土地权利。府署可以核实墓界，也可以划出别处土地，或让双方订下共有之约。茶户留下的地契没有画出界线，这正是当初交易最省事、如今却最棘手的地方。"

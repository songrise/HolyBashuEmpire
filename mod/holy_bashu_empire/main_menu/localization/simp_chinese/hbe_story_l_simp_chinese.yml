 hbe_short_northern_shudao.23.title: "下一批纸货"
 hbe_short_northern_shudao.23.desc: "一批书箱从蜀道运来，货主要求沿途免关，称它们要送给府学。驿吏打开其中一箱，发现既有经卷，也有商家的账本。赶马人只知道自己收过路费，不愿替货主证明每页纸的用途。\n\n书坊愿沿这条路继续供纸，要求统一免关凭证。关吏担心人人把商货写成教读，府学却缺稳定的纸墨。我们可以按用量立券，也可把采办统一交给关署。\n\n“山路上的书箱”第3篇。"

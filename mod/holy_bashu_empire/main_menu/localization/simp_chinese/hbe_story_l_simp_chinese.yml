 hbe_short_chengdu_plain.2.title: "学徒留下的颜色"
 hbe_short_chengdu_plain.2.desc: "坏锦的赔付已有裁处，学徒仍保存着几批试染的布片，供染户继续查验。\n\n新的试染布被挂在同一面墙上，旧缸中的颜色仍先褪去。学徒请求把记号抄成正式的染簿，师傅担心配方随之传到其他作坊。订单已经补交，怎样保存这份记录成为新的争执。学徒把沾着靛色的纸片一张张铺平；师傅先伸手遮住了其中两行下料数目。"

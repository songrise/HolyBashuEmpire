 hbe_short_central_hills.22.title: "债主的另一本册"
 hbe_short_central_hills.22.desc: "旧借的处理已有裁处，几张收据与债主的底册却对不上，桥工旧账还须再查一遍。\n\n商人交出一本原册，上面的利率较低。书记说后来的抄本混入了桥钱，债主要求不要让一次错抄损害多年信用。府署可以公开更正，也可安排双方在共同见证下重立契纸。新翻出的册子上，同一份桥料在不同年份各收过一次利。债主的家人请求到后堂重契，乡民却都等在堂外。"

 hbe_story_western_tea_horse.201.title: "茶路医马学舍"
 hbe_story_western_tea_horse.201.desc: "医马人的学生沿茶路分到各站，药方、繁育簿和草场记录不再只由一座官苑保管。牧户能够送病马来舍中，也能按用途出售驮马。学舍不能替每一支商队免去山路的风险，却给沿途的人留下了持续照料牲畜的办法。\n\n学生带着抄过的药方分赴驿站，牧户按册送来病马。学舍要继续收人、供药、记录失手，沿途的人才有理由把下一匹病马交给他们。"

 hbe_story_central_hills.6.title: "坡地上的新作物"
 hbe_story_central_hills.6.desc: "商人带来适于坡地的新种，佃农希望在瘠地试种，田主却要求先保证旧有粮租。府学认为它可能减少饥荒，也担心陌生作物改变土壤。\n\n我们可以为试种承担头几年的风险，也可以只准在划出的田块上种植，或让田主自行决定。\n\n本篇是“坡田与水土”的第6章。前面的选择将决定最后保留哪一种长期章程。"

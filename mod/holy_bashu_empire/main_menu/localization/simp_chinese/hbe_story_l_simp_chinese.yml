 hbe_story_southwestern_valleys.106.title: "汉源山里的梨树"
 hbe_story_southwestern_valleys.106.desc: "汉源山民把耐寒的梨枝带到府城，园吏嫌枝条形状粗陋，不准进入官苑。一个买家却称这类梨在山路上保存得更久，愿为试种出钱。\n\n府署可设试园，准山民自行销售，或维持官苑的旧有标准。山民更关心来年能否继续带枝下山，不愿仅因一次贡果挑选便被认定货色低劣。什么样的树值得保留，也不只由枝叶是否齐整决定。"

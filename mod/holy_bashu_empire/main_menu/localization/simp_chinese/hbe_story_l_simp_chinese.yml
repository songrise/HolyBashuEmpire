 hbe_short_shared.217.d: "暂缓裁定，不再由府库出资。"
 hbe_short_shared.217.title: "没有人领走的旧信"
 hbe_short_shared.217.desc: "驿站积下几封寄给迁戶的旧信，收信人已经去世或迁到另一处。驿吏请求按例销毁，以免继续占用人手；同乡愿沿新村找人，却须先知道信封上的地名和称谓。几封信中还夹着为入蜀做准备的路钱。\n\n府署可以付路费继续查送，也可以按旧例封存，或由[Concept('hbe_history_huiguan', '同乡会馆')|e]共同登记寻人。保留旧乡的联系会添一份开支，也可能让后来者找到一个更确定的落脚处。"

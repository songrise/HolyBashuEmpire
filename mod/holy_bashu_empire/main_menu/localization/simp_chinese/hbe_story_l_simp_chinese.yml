 hbe_short_southern_salt_wine.2.title: "接头里的细裂"
 hbe_short_southern_salt_wine.2.desc: "停灶与交盐的冲突已有裁处，漏水的旧接头仍留在工棚，匠人继续查它遇冷后的变化。\n\n匠人查出管口受冷时会缩动，接头应当留出余量。老井主请求把办法只用于自家井灶，灶工希望其他作坊也能少受一次伤。掌盐官提出以公开查验换取新井采办。匠人把冷水浇在接头上，细缝又冒出一线卤水。灶工围着看，盐署来的吏员却先问样管应当盖谁的印。"

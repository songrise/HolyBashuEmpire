 hbe_short_western_tea_horse.23.title: "再一季的小屋"
 hbe_short_western_tea_horse.23.desc: "柴草与收钱已有办法，小屋撑过了一季寒夜，旧屋顶却不能再只靠临时添草维持。\n\n又一季的商队带来修屋的消息，小屋虽然能歇脚，屋顶却仍须按时维护。村寨愿保留冬用，守军想全年驻守，商人希望把屋旁变成交易处。府署须决定这一处歇脚，最后服务的是旅人、军路还是边市。旧顶梁还撑得住，补草与工钱却得在下一场雪前付清。村寨愿出人，商队希望换到稳定的歇脚时段。"

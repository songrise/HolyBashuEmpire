 hbe_short_central_hills.3.desc: "义仓新收的谷子颗粒较小，掌仓人认为只宜低价收进。新垦户说这种谷子更耐旱，不能只凭模样定价。旧仓册记录了丰年产量，却没有把去年干旱时各田的损失写在一起。\n\n新种与旧种都要进入仓中，掌仓人请求多设一格，清楚记下借种与还种。田主愿出仓钱，条件是优先借到好种。我们可以设公共留种，也可以承认出资者的优先权。\n\n“仓中的两种谷子”第3篇。"

 hbe_short_northern_shudao.23.title: "下一批纸货"
 hbe_short_northern_shudao.23.desc: "旧账的归还与教读已有安排，书坊想把临时送书改成长久生意，又来询问免关凭证。\n\n书坊愿沿这条路继续供纸，要求统一免关凭证。关吏担心人人把商货写成教读，府学却缺稳定的纸墨。我们可以按用量立券，也可把采办统一交给关署。书坊把一季用纸的估数交来，关吏又列出上回几箱混装的账。若只写一句供学免关，下次过路的人便还要在山口争同样的话。"

 hbe_story_western_tea_horse.6.title: "两种马的脚程"
 hbe_story_western_tea_horse.6.desc: "幼驹的归属有了安排，等到马市重新估价，体格与山路脚程之间的差别又引起争论。\n\n低地来的大马在山路上耗粮更多，山中小马却能驮着茶篓经过窄道。军府仍按体格给马定价，牧人提出按路段衡量。若重定马价，旧马商会失去一些收益；若维持旧标准，适合山路的牲畜便得不到供养。"

 hbe_short_shared.102.title: "短工缺的一顿饭"
 hbe_short_shared.102.desc: "修船的报酬与跑船名额已有裁处，船工继续接过一些渡口杂作，结算时又遇到了新旧工的饭钱差别。\n\n结算这段日子的修船与码头杂作时，外乡船工发现自己的饭钱比旧工少。获准试船的活计另照原约办理，船帮却认为，只要尚未正式入帮，做什么都应自带口粮。家属请求承认他的实际劳作，府署可重核雇用，也可只给一次救济。同一天做过的活各记一行，饭钱却在新旧工之间少了一份。船工带家属来认账，没有要求把试用期也算作正式入帮。"

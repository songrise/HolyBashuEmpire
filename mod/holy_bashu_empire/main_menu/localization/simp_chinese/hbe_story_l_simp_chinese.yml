 hbe_story_western_tea_horse.6.title: "两种马的脚程"
 hbe_story_western_tea_horse.6.desc: "低地来的大马在山路上耗粮更多，山中小马却能驮着茶篓经过窄道。军府仍按体格给马定价，牧人提出按路段衡量。\n\n若重定马价，旧马商会失去一些收益；若维持旧标准，适合山路的牲畜便得不到供养。\n\n本篇是“山路上的医马人”的第6章。前面的选择将决定最后保留哪一种长期章程。"

 hbe_short_shared.207.title: "送到新乡的嫁资"
 hbe_short_shared.207.desc: "一个新户姑娘的嫁资是旧乡带来的织具，本地媒人说不如土地体面，要求家属另补银钱。男方愿接受织具，族老担心一旦承认，旧婚约上的嫁资标准也会跟着改变。\n\n府署可以认可双方自己的约定，也可以维持旧礼、给予有限资助，或安排共同见证，限制婚约之后不断追加的索取。两家已经摆好席，姑娘却仍在门后等媒人决定她带来的东西算不算足够。"

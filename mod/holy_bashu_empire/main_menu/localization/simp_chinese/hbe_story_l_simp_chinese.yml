 hbe_short_central_hills.11.title: "信上的剪枝法"
 hbe_short_central_hills.11.desc: "一位外乡桑农写信教女儿在新乡种桑，信中提到几种不同于本地的剪枝办法。女儿给邻里试过，几株桑树长得好，行会却认为她未经旧师傅传习，不该向织户收取蚕叶钱。\n\n织户愿为试种付钱，旧桑户担心自己的叶价下跌。府署可以资助公开比较，也可以保护旧合同，或准新桑户只卖自家枝叶。桑农拿出旧乡信上的几笔枝形，师傅先问这几株树若少出一季叶，原合同的缺数该由谁补。"

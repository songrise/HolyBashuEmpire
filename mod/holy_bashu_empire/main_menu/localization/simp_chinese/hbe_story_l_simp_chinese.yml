 hbe_story_western_tea_horse.101.title: "雅州茶篓上的名字"
 hbe_story_western_tea_horse.101.desc: "雅州茶商把收购来的茶装进统一篓袋，山村茶户原有的记号都被削去了。一个茶户在市中发现自家茶叶以另一家名号售出，索要说明时却被告知自己已经卖断。\n\n茶商认为统一货色有利于远途交易，府署也需要稳定的交割；茶户则希望保留质量好的茶能带来的名声。我们可以规定产地记号，确认卖断契约，或设公用验茶。谁的名字留在篓上，也会决定来年谁能得到更好的订单。"

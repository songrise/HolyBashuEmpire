 hbe_story_southern_salt_wine.106.title: "泸州城外的火窖"
 hbe_story_southern_salt_wine.106.desc: "泸州酒窖失火，主人指责附近住户不肯帮忙扑救。住户却说，酒窖的看守从来不许他们经过井边，起火时也没有水可取。\n\n坊主愿重建酒窖，要求府署征调民夫；乡老请求先开放取水。商人已订好下一季的酒货，重建迟延会损害本府收入。我们需要把防火与采办安排在一起，而不是等下次火起再为责任争吵。"

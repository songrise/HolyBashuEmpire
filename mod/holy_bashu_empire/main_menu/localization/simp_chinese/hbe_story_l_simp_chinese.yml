 hbe_short_southwestern_valleys.3.title: "新的共船木牌"
 hbe_short_southwestern_valleys.3.desc: "盐源湖上的两家渔户共用一只大船，一家想载盐换钱，另一家仍靠打鱼供粮。盐商愿预付运费，条件是整季都用船。岸边村寨请求保留雨季渡人，旧船契却没有把这些用途分开写过。\n\n船修好时，村寨提出把渡人也列在木牌上。盐商担心以后每次运货都要等人，渔户愿少收一点船钱换取固定时段。新的木牌可以成为共同安排，也可以只保证买卖。\n\n“湖上两家的渔船”第3篇。"

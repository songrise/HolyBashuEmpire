 hbe_story_southern_salt_wine.202.title: "盐城龙骨陈馆"
 hbe_story_southern_salt_wine.202.desc: "龙骨陈馆的门打开了，盐场来客在巨骨前停步，商人也愿为修井出钱。陈列保留了许多让人惊叹的形状，却没有解决师生争论的每一个疑点。府署把奇观与盐业连在一起，今后的主持者须同时面对宾客的期待和井户的账目。\n\n几十年的笔记、工钱与争执没有凭空消失。它们被保存进新的章程，成为后来主持者必须继续履行的责任。至此，这段事业已经收束，获得的长期收益将随国家延续。"

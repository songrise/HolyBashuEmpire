 hbe_story_central_hills.4.title: "绿肥与旧收成"
 hbe_story_central_hills.4.desc: "府学提出在休耕地种植护土绿肥，几户佃农已经试出了较稳的收成。田主却认为休耕地仍应缴纳旧租。\n\n若承认试种期间减租，其他田主也会要求补偿；若坚持原额，村民便没有余力继续试种。\n\n本篇是“坡田与水土”的第4章。前面的选择将决定最后保留哪一种长期章程。"

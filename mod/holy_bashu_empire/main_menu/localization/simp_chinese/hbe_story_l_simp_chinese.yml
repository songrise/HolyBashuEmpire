 hbe_short_shared.1.title: "集市上的新灶"
 hbe_short_shared.1.desc: "几户湖广人把自己的酿豆办法带到新乡，集市第一次卖出不一样的饭食。旧摊户认为他们未曾参加过市亭维修，不应占据最好的铺位；乡医愿品验食物，年轻人却已在两种口味之间来回排队。\n\n新摊户愿按季交钱，旧行会仍要求由本地人担保。府署可以给短期摊牌，也可维持担保，或让各摊共同安排灶口。\n\n“第一口乡音”第1篇。"

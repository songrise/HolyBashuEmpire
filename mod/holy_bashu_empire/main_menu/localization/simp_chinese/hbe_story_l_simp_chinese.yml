 hbe_story_western_tea_horse.104.desc: "汶川牧户带来新织的毯子，府城商人嫌图纹陌生，只肯按普通粗织收购。牧户的女儿说，那些纹样记录了家族迁居的路线，不愿为卖货全部拆去。\n\n府署可让图纹作为当地货色的标识，也可资助适合城中买家的新样，或仅按保暖耐用验货。交易可以改变织法，也可能让原有记忆渐渐失去讲述的场合。她把一条小毯留给了负责翻译的书记。"

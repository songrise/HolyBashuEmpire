 hbe_short_western_tea_horse.12.title: "烙印旁的旧伤"
 hbe_short_western_tea_horse.12.desc: "一匹从冬市买来的马带着两处烙印，新旧马主都说自己拥有它。新买主已把马交给赶马人驮货，旧主人拿出的见证又来自另一座山寨。商人担心争执扩大，马医却发现旧烙处一直没有愈合。\n\n医马人辨出第二处烙印盖在旧伤上，几位牧人记得这匹马曾从雪路走失。商人要求按买卖凭证处理，牧人请求考虑实际照料过它的人。府署可以并查旧伤与市契，也可只认可官验记录。\n\n“马群中的旧烙印”第2篇。"

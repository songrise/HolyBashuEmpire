 hbe_short_shared.42.title: "祭席上的席钱"
 hbe_short_shared.42.desc: "清渠与祭日的冲突已有裁处，两方都为办席筹钱，祭亭的旧份额却又被翻了出来。\n\n新户请求在旧亭祭祀，被要求另交席钱。掌亭者称旧户多年修亭，新户认为自己已依此前的裁定出工、担费，不该因籍贯再多交一份。收席钱的人先扣去旧户的减免，再把余数摊给来人。新户递上此前的工钱凭记，问自己出过的份额为何没有算进去。"

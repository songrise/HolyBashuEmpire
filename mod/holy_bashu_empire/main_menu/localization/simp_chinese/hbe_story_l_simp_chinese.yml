 hbe_story_central_hills.105.desc: "安岳工匠制作石窟拓片，准备在邻府出售，寺院却要求每张先缴供养钱。工匠的弟子把墨纸用完后，仍未凑够第一笔收费。\n\n寺院需要修补洞窟，也担心来客损伤石面。府学请求保留研究副本，商人愿预订大批拓片。我们可以划定可拓区域，资助修护，或让寺院专营。收藏与传习都依靠石面仍能留给后来的人。"

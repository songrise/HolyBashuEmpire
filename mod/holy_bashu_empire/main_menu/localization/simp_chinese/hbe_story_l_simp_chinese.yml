 hbe_story_southwestern_valleys.105.title: "黎州渡口的木契"
 hbe_story_southwestern_valleys.105.desc: "黎州渡口几户村民拿着木契请求保留旧有免费通行，守渡者却说新纸册中没有他们的名字。村民无法说清旧契是谁刻的，只记得祖辈一直凭它过河。\n\n府署可听取沿岸见证，给予重新登记，也可只承认纸册，或改成按每年维护次数免钱。木契的真假需要核实，不能让不识官文的人因此永远无法陈述自己履行过的责任。"

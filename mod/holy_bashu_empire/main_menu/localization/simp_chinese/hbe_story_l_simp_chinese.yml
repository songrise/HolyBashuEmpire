 hbe_short_western_tea_horse.12.title: "烙印旁的旧伤"
 hbe_short_western_tea_horse.12.desc: "马的寄养与交割已有临时安排，照料者随后在烙印旁认出旧伤，买卖双方又来请断。\n\n医马人辨出第二处烙印盖在旧伤上，几位牧人记得这匹马曾从雪路走失。商人要求按买卖凭证处理，牧人请求考虑实际照料过它的人。府署可以并查旧伤与市契，也可只认可官验记录。老牧人用手指出旧伤的方向，官验人则认定烙印与市契齐全。两种见证都摆在眼前，单问马价已经答不了。"

 hbe_story_southern_salt_wine.102.title: "峨眉山下的柴路"
 hbe_story_southern_salt_wine.102.desc: "峨眉山下寺院封住一条旧柴路，称香火既盛，山林应当专供寺中使用。采柴妇人每天不得不多绕一座山，孩子们也跟着离开了田边。\n\n寺院愿施粥，却不愿重新开放柴路。山民请求划出明确的采柴区域，府署也可另给木料，或把入山权统一发给有担保的住户。这条路看似不起眼，却决定着许多家庭每天能余下多少时间。"

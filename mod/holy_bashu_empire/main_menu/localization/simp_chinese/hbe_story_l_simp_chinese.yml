 hbe_story_western_tea_horse.1.title: "走不动的驮马"
 hbe_story_western_tea_horse.1.desc: "雅州茶队的驮马在山口跛行，马商说它们只是劳累，藏地牧人却认出了蹄底的病变。换马要花钱，继续赶路则可能失去整队牲畜。\n\n牧人愿示范修蹄，但要求府署不再把他的同伴当作无籍过客。军府也希望把这项技法留给战马使用。"

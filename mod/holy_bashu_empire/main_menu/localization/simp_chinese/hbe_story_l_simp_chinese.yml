 hbe_story_southwestern_valleys.112.title: "谷中铁坊的烟"
 hbe_story_southwestern_valleys.112.desc: "西南谷中铁坊扩了炉火，烟尘落在邻村的晾粮处。坊主称风向难料，粮户却说以前的小炉从未造成这样大的损失。\n\n匠人提出调整炉口，但要停工几日；商人希望先赶交器械。府署可以补偿粮户并改炉，也可让村民迁移晾粮，或重订开炉时刻。扩大生产的收益在坊中，损耗却出现在另一户人的粮袋里。"

 hbe_short_chengdu_plain.22.title: "查界人带回的石碑"
 hbe_short_chengdu_plain.22.desc: "竹山边界已有一次裁处，村民沿旧径寻找凭据时，又发现一份关于共同养竹的见证。\n\n向导在旧竹丛中找到一块小碑，碑上写的是共养竹林的轮伐次序。碑并不能说明所有边界，却使只凭地契的一方陷入尴尬。府署可以恢复轮伐，也可以把旧碑只当作辅助见证。碑角缺了一块，两边乡老各自补说了不同的旧事。向导只认得自己挖出它的位置，不肯替哪一方证明整座山。"

 hbe_short_central_hills.23.title: "下一次修桥钱"
 hbe_short_central_hills.23.desc: "桥工旧账经过核对，余下欠款与公用支出各有了处理。下一次修桥又需要一笔先付的材料钱。\n\n新的桥脚需要维修，先前的债主仍愿垫钱，但要求明确还期。乡民愿按受益出资，不再把费用压在几个穷户身上。府署可以改成共同公账，也可以以担保维持旧有垫款。修桥的人已把木料数点清，商人愿再垫一笔。上一回付过工钱的住户却不肯先签，要求把哪家借、哪家还当面写全。"

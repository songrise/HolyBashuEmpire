 hbe_story_northern_shudao.1.title: "山口的日影"
 hbe_story_northern_shudao.1.desc: "[Concept('hbe_history_jianmen', '剑门')|e]驿卒按[Concept('hbe_history_timekeeping', '日影')|e]估量行程，府城的历书却与山口晨昏相差许多。一个樵夫指出，高山遮住了冬日的早光，平地的时刻不能照搬到关上。\n\n府学愿在几个山口立表，关将则希望先让驿站统一换牌。测候或军用传时，都需要沿路村民参加。\n\n本篇是“山壁上的星历”的第1章。前面的选择将决定最后保留哪一种长期章程。"

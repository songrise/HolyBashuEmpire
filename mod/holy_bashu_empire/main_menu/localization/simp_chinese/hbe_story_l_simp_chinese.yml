 hbe_story_central_hills.7.title: "堤埂谁来维修"
 hbe_story_central_hills.7.desc: "最初参与修埂的乡民大多已去世，新住户拒绝按旧册承担维修。旧家族则说，自家祖辈出过土地，应当少出工钱。\n\n坡田需要持续修治，早年的功劳却不能替代眼下的人手。各村要求我们重订分担办法。\n\n本篇是“坡田与水土”的第7章。前面的选择将决定最后保留哪一种长期章程。"

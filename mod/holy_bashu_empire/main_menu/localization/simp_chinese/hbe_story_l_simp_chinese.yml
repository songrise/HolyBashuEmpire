 hbe_story_central_hills.110.title: "华蓥山下的炭钱"
 hbe_story_central_hills.110.desc: "华蓥山下几户人家烧炭供铁坊，收购者却连续压价，称路上损耗比从前更多。炭户的长子决定卖掉驴，改去城中做短工。\n\n铁坊需要稳定炭源，府署可查验损耗，也可把路费从关税中减免，或让铁坊直接与炭户订约。继续只谈一担炭的市价，便会忽略维持采办所需的牲畜、道路与村中留得住的人。"

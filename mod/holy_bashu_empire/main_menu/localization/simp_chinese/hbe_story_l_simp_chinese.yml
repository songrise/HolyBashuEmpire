 hbe_short_chengdu_plain.21.title: "界图没有画的水"
 hbe_short_chengdu_plain.21.desc: "彭州山脚两村共用一片竹山，旧界图只画了山脊，没有标出近年改道的溪流。修渠时一队人伐了对方认作自家的竹子，双方都带着残根来府署。竹农提醒我们，春笋还没出土，再封山一年会误了整个采办季。\n\n乡老请求按旧山脊裁断，新住户认为应以现水道为界。若立即判给一方，另一村可能不再供渠工竹料。我们也可先作共同采办，等两村一起完成查界。\n\n“竹山的两张界图”第1篇。"

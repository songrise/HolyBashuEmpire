 hbe_story_central_hills.111.title: "岳池农户的早种"
 hbe_story_central_hills.111.desc: "岳池几户农人提前下种，邻人认为他们破坏了共同看水的时刻。早种者却拿出去年留下的天气记录，说这能避开一场常见的晚旱。\n\n若允许各自改期，共用水口的安排会变复杂；若强令按旧期下种，也可能失去一项有用经验。府署可以划出试验田，调整分水，或维持乡约。最先下种的农户已经欠了种钱，他无法等到来年再证明自己的判断。"

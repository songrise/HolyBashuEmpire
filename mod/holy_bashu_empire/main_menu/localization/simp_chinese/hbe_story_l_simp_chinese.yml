 hbe_short_shared.206.desc: "迁来的石工替村里刻修桥碑，习惯把出钱者与出工者并列。旧族认为出工者只是受雇，不应与祖辈供地的名字同列。石工愿改字，几个搬石人却说自己的工钱尚未付清，碑上的体面来得比现钱还早。\n\n府署可以补工钱并保留并列，也可以尊重旧碑次序，或另刻一页工账。哪一种名字留在桥头，也会让后来者知道自己的劳作能得到怎样的承认。"

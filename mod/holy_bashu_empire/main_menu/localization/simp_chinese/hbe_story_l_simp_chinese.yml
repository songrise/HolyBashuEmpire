 hbe_story_southwestern_valleys.110.title: "普格谷中的铜鼓"
 hbe_story_southwestern_valleys.110.desc: "普格村寨准备修补铜鼓，外来收藏者却愿出高价把它买走。鼓主的家人需要这笔钱，其他住户说，共同祭礼不能由一家人独自决定。\n\n府署可资助修鼓，安排公共保管，也可承认鼓主的出售权。铜鼓既是器物，也是村寨共同使用多年的见证。怎样处置，不能只靠今天谁拥有将它抬进屋里的力气来说明。"

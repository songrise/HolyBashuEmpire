 hbe_story_northern_shudao.201.title: "山地测候公课"
 hbe_story_northern_shudao.201.desc: "山口各站把记录送进测候台，旧仪器与新历书被放在同一张案上。主持者可以更换，查验的方法却不能随家世改变。学舍每年招收能够读簿和修器的年轻人，蜀道的晨昏从此有了一份可供后来者复核的共同记录。\n\n新来的学生领走一份抄本，学舍留下原簿与修器记录。主持者以后仍会更替，接任时须把器物、工钱与未能对上的观测一并交清。"

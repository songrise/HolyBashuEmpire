 hbe_short_shared.43.title: "来年的清渠簿"
 hbe_short_shared.43.desc: "几户新住民按旧乡祭日备饭，恰与本村清渠的日期相逢。领役人认为他们借礼俗逃工，新户说自己已经在别的日子出过力。乡老愿另定一日，却担心以后人人都按自家习俗请求改役。\n\n来年的清渠簿又要重写，新户再次请求把礼期列入安排，领役人则要求保留紧急征工。此前的临时裁定，尚未成为往后每年都能援引的办法。府署可以承认礼期，也可只给逐案宽免，或建立付酬替役。\n\n“迁来的祭日”第3篇。"

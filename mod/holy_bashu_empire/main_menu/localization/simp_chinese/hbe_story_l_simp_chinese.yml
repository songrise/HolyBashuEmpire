 hbe_story_southern_salt_wine.105.title: "宜宾江口的转秤"
 hbe_story_southern_salt_wine.105.desc: "宜宾江口的盐包过了两道秤，重量竟差了许多。搬运夫陈二发现一处秤砣内填了轻木，却被商人的护卫拦住，不准继续拆验。\n\n掌秤者说，这种差额已经算进旧年的运费。若府署公开查验，几笔长期合同都可能重算；若只在今后更换新秤，过去受损的井户便拿不到补偿。陈二的搬运名额，也取决于哪一方还能容忍他的指认。"

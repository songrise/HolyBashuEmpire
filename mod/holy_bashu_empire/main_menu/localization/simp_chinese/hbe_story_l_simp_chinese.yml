 hbe_story_western_tea_horse.111.desc: "牧人向山门寺院送了羊毛，主持却要求先改用寺中认可的礼数，否则不予收下。翻译者解释，这是牧户答谢受助的方式，并不表示轻慢。\n\n府署可劝寺院承认不同来历的馈赠，也可要求来客遵守统一礼规，或把羊毛用于共设的病马棚。牧人已在山门前等待许久，他想知道曾经得到的帮助是否还允许自己以熟悉的方法回报。"

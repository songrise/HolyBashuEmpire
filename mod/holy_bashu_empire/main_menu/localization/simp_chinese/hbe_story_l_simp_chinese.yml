 hbe_story_northern_shudao.110.title: "平武矿口的水"
 hbe_story_northern_shudao.110.desc: "平武矿工把废石倒入溪沟，山下村民的饮水渐渐浑浊。矿主说，另运废石会增加成本，暂时停矿又会误了军府的铁料。\n\n一个取水的孩子在溪边滑伤，家属因此要求府署立即处理。我们可以出钱修排水，也可让矿主承担改造，或先把饮水引到别处。眼前的采购压力，不能使矿口与村落之间的溪水永远无人负责。"

 hbe_short_southwestern_valleys.1.title: "这一季载什么"
 hbe_short_southwestern_valleys.1.desc: "盐源湖上的两家渔户共用一只大船，一家想载盐换钱，另一家仍靠打鱼供粮。盐商愿预付运费，条件是整季都用船。岸边村寨请求保留雨季渡人，旧船契却没有把这些用途分开写过。\n\n府署可以另雇盐船，也可认可预付约，或让两家按季交替。渔获、盐货和过湖的行人，不能永远等船主各自答应完所有人。盐货已堆到湖岸，渡人的小船还系在原桩。两家拿来的预付与轮用凭记，都只写了对自己有利的那一半。"

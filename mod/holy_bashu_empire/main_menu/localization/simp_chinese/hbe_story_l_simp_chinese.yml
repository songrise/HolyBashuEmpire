 hbe_story_central_hills.101.title: "简州织户的春假"
 hbe_story_central_hills.101.desc: "简州织户为赶一批布料，错过了自家田地的春耕。坊主愿预付粮钱，却要求他们在下一季继续留在机上。织妇何氏说，这样连田租也只能靠坊主垫付。\n\n乡老请求准织户暂离作坊，商人则催促按期交布。府署可以为延期担保，也可补贴雇人耕田，或承认预付合同。我们要处理的并不只是一批布，还包括工匠今后是否仍有机会依靠自己的田地生活。"

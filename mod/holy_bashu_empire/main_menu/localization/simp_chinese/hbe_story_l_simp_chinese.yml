 hbe_short_southwestern_valleys.12.title: "寨仓里的两把钥匙"
 hbe_short_southwestern_valleys.12.desc: "寨中铁匠做出一扇结实的铁门，寨主请求只准供给自己的仓房。几个普通住户也想买锁护粮，铁匠担心拒绝寨主便失去炭料。赶市的商人带来外地铁价，说这门活路不该只靠一家供养。\n\n寨仓换上新锁，掌仓者把钥匙交给自己的亲族。仓中还存着住户寄放的粮，乡老因此要求共同开仓；铁匠的供货约却没有规定钥匙由谁保管。寨主认为公开钥匙会使仓粮失去保护。府署可设共同保管，也可只让官吏负责清点。\n\n“山寨门前的铁门”第2篇。"

 hbe_story_southwestern_valleys.201.a: "把章程留给后来者。"
 hbe_story_southwestern_valleys.201.title: "诸谷共桥约"
 hbe_story_southwestern_valleys.201.desc: "桥上的绳结、铁索和旧木契被收入共同桥约。不同村寨仍保留自己的说法，却能够按使用与维修记录重新分担。过路的商队只须面对一套共用办法，养桥的人也能在下一次议约时说出自己的贡献。\n\n几十年的笔记、工钱与争执没有凭空消失。它们被保存进新的章程，成为后来主持者必须继续履行的责任。至此，这段事业已经收束，获得的长期收益将随国家延续。"

 hbe_story_northern_shudao.102.desc: "保宁药铺的学徒借来一本医书，掌柜却只允许他照抄方名，不准询问病因。学徒私下记下几位病人的症状，发现同名药方并非总能起效。\n\n府医愿听取他的记录，药铺行会担心这会损害熟悉的处方。若公开比较，病家可能受益，掌柜却会失去一些权威；若封存记录，学徒以后也不会再把自己的观察带到官署。"

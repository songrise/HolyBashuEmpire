 hbe_short_eastern_river.12.title: "归拢的旧工具"
 hbe_short_eastern_river.12.desc: "岸地与搬坞已有一次裁处，船匠回头清点器具，发现旧工具还不足以承接新的修船活。\n\n船坞重新清点接活所需的器具，木匠发现旧工具尚能修小船，却难以支撑商号提出的大船修造。岸地的安排尚须照旧契执行，添置工具又成了新的争执。商号愿出工具钱，要求匠人签下较长的供货约。我们可供公共工具，也可让匠人与商号自行担保。旧凿、长锯与新架的料价各列一行，账上却没有写明不用商号料钱的人能否照样借架。匠人想先把这一条问清，再领下一批木材。"

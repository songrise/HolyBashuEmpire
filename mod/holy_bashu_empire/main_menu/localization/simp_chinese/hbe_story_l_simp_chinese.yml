 hbe_short_shared.211.title: "被抢先收走的荒税"
 hbe_short_shared.211.desc: "新户刚翻过荒地，管事便来收一整季田税，称田界已经写进官册。家属出示先前约定的免税期，管事说那是前任书记的私许。旧户希望所有田都同样交税，却也担心官府会以换任为由否认他们的旧契。\n\n府署可以认免税期，追查过早征收，也可以维护现税额、另给开垦担保，或将减免限定到真正下种的田。今天怎样解释一张旧契，也会影响整个乡里对后来约定的信任。"

 hbe_short_central_hills.13.title: "信寄回旧乡"
 hbe_short_central_hills.13.desc: "桑叶与成蚕的记录已有编排办法，最初那封种桑信又被取出来，桑农想给旧乡一个答复。\n\n女儿想把新册寄给旧乡，邻里担心别处学会后会抢走订单。书坊认为传来传去才能改进，行会主张只准本府收徒。府署须决定早先收到的一封信，能否再沿商路送回。回信的纸已经裁好，桑农却被告知不许抄走册中几页。旧乡当初愿寄来办法，如今正等着听本府试出的结果。"

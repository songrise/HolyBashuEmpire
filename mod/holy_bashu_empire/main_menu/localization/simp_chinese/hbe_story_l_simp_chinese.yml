 hbe_short_northern_shudao.2.title: "细沙的来处"
 hbe_short_northern_shudao.2.desc: "商人带来一只沙漏，说它比阴天的日影可靠。驿吏用它记守更，半夜却发现潮气让细沙结住。老驿卒仍按自己记住的路程报刻，年轻人要求把器具和经验一起查验，免得以后只凭失准的漏壶扣工钱。\n\n匠人发现沙粒大小不同，商人愿以另一批细沙替换，但要求独占驿站器具订单。年轻驿吏已经筛出合用的砂，请求公开筛法。府署可以把改进留给各站，也可以维持一家供货。\n\n“驿站里的沙漏”第2篇。"

 hbe_story_northern_shudao.101.title: "阆中城门的更鼓"
 hbe_story_northern_shudao.101.desc: "阆中更鼓换了主持者，新鼓手照着府城的时刻敲鼓，住在江岸的工匠却仍按旧更开工。一批迟到的货物因此被守门者拦下，商人将责任推给没有及时听鼓的担夫。\n\n老鼓手愿教新人辨认江雾中的回声，府署也可以统一时刻，或准不同坊市保留自己的开闭安排。鼓声原本帮助人们安排生活，如今却有人借它决定谁能进城做买卖。"

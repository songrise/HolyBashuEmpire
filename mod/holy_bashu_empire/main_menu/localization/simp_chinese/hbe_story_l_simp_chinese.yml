 hbe_migration.4.title: "新渠末端的村落"
 hbe_migration.4.desc: "新住户修通一条支渠，渠尾的几片田终于可以播种。上游村民却拿出旧分水簿，指责他们从未承担清渠的旧账。渠工说，过去没人愿意修这一段，如今田里有了水，人人又想起它属于哪一本册子。\n\n新村请求按受益田亩分水，也愿补出一份日后的维修钱；旧村坚持先偿还历年的欠工。若准新村用水，府库须替双方核算旧账，并安抚上游；若把新渠暂时封住，旧村会安心，新垦户这一季却只能望着已翻过的田。\n\n“湖广填四川”第4章。入籍、工牌与乡约的历次决定，会影响最后留下的共同章程。"

 hbe_short_shared.103.title: "愿不愿再留一年"
 hbe_short_shared.103.desc: "饭钱与供粮的争执已有处理，一家人还住在渡口，船工却没有能长久接活的正式名额。\n\n船工在修船和往来船夫的讲述中熟悉了本地险滩，又来请求正式入帮。此前的工钱、试用与担保各有期限，都还没有给他一个长久的位置。船帮愿收，但要求他放弃旧乡的师傅称呼。府署可以承认两种传习，也可让入帮完全按旧规办理。船工仍能说出修过那条船的旧伤，却不知道正式入帮要在哪一栏放下自己的师承。船帮的名册已经送来，正等他的名字。"

 hbe_story_southern_salt_wine.4.title: "石层的先后"
 hbe_story_southern_salt_wine.4.desc: "龙骨药钱的争论告一段落，师生想回到井壁，查明那些骨块原先埋在怎样的石层中。\n\n新凿的井壁露出几层颜色不同的石带，骨节集中在其中一层。老井工记得另一处井口也曾见过相似排列，愿带师生沿山查找。掌盐官只关心哪一层更容易出卤，府学却希望把各井的石层画成一张长图。查访需要人手，也会让井主担心秘密外泄。"

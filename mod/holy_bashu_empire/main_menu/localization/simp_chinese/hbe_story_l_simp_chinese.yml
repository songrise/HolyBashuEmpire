 hbe_story_eastern_river.102.title: "重庆城梯上的担夫"
 hbe_story_eastern_river.102.desc: "重庆担夫在长梯上摔坏一坛货酒，货主要求他偿付全部价钱。守梯人却说，石阶上的破损已报修多次，府署迟迟没有拨款。\n\n担夫的同伴停下搬运，要求先修路，几家商铺因此无法补货。官吏可以追回维修账款，也可让货主共同出资，或先恢复搬运再从新税中筹钱。受伤的人仍坐在梯下，等待我们决定他的欠账该如何计算。"

 hbe_story_eastern_river.3.title: "有人冒领引水牌"
 hbe_story_eastern_river.3.desc: "行期与水位的办法已经议定，过滩生意却引来了许多自称熟悉江道的人。\n\n商船为了赶上行期，雇用了持假牌的引水人。真正熟悉江道的船夫要求限制外来同行，商人则不愿再为指定领航者支付高价。府署可以逐人考试，也可以由船帮担保。留下哪一种制度，将影响谱册怎样在江上发挥作用。"

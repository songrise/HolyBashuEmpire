 hbe_short_central_hills.13.title: "信寄回旧乡"
 hbe_short_central_hills.13.desc: "一位外乡桑农写信教女儿在新乡种桑，信中提到几种不同于本地的剪枝办法。女儿给邻里试过，几株桑树长得好，行会却认为她未经旧师傅传习，不该向织户收取蚕叶钱。\n\n女儿想把新册寄给旧乡，邻里担心别处学会后会抢走订单。书坊认为传来传去才能改进，行会主张只准本府收徒。府署须决定早先收到的一封信，能否再沿商路送回。\n\n“寄来的种桑信”第3篇。"

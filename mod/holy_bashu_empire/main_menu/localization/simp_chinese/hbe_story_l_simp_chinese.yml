 hbe_short_southern_salt_wine.2.desc: "井户从铁匠处买来一根铜管，想把卤水引到稍远的灶边。铜管省下挑卤人手，却在第一个寒夜漏了水。几名灶工被烫伤，供料匠人坚持这不是铜料的问题。新井筹资已经到期，停灶将使担保人先付利钱。\n\n匠人查出管口受冷时会缩动，接头应当留出余量。老井主请求把办法只用于自家井灶，灶工希望其他作坊也能少受一次伤。掌盐官提出以公开查验换取新井采办。\n\n“盐灶上的新铜管”第2篇。"

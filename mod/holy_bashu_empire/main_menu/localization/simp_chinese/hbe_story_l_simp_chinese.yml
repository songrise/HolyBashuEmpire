 hbe_story_central_hills.7.title: "堤埂谁来维修"
 hbe_story_central_hills.7.desc: "新作物已经有人照议定办法种下，坡田仍须年年修护，沿用多年的出工册却越来越难服众。\n\n最初参与修埂的乡民渐渐退老，新住户拒绝按旧册承担维修。旧家族则说，自家祖辈出过土地，应当少出工钱。坡田需要持续修治，早年的功劳却不能替代眼下的人手。各村要求我们重订分担办法。"

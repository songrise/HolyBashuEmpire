 hbe_migration.7.title: "同一条路上的两种话"
 hbe_migration.7.desc: "入蜀已有多年的家庭仍用旧乡的称呼记田界和牲畜，官署新派的书记却照府城用语抄写。一场租地纠纷因此多出三道彼此矛盾的证词，乡老和外来长者都认为自己的话被故意改了。\n\n年轻读书人愿兼学两种说法，为契纸附上解释；一些旧户认为，这会让外乡人的规矩渐渐进入本府。新的户籍若要真正起作用，就须让持契的人认得它。我们可以为互译与教读出钱，也可以坚持同一册式，只在争执发生时另找担保。\n\n“湖广填四川”第7章。入籍、工牌与乡约的历次决定，会影响最后留下的共同章程。"

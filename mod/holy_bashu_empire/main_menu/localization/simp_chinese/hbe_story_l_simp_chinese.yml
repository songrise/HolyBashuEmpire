 hbe_short_eastern_river.13.title: "船坞开门的时候"
 hbe_short_eastern_river.13.desc: "河水改道后，一座旧船坞落在浅滩边，船匠仍靠修小船生活。大船商提出搬坞到深水处，要求府署替他取得岸地。船匠愿搬，却担心搬去以后只能给同一家商号做活。旧址旁的小渔户也需要留下修船的地方。\n\n新船入坞时，几个老渔户仍被排在最后。船匠请求为小船保留固定时段，商号说停修一天大船损失更多。此前的岸地与工具契约并未说清小船的排期。府署如今须决定，修船时段应怎样在渔户与大船商之间分配。\n\n“岸边的旧船坞”第3篇。"

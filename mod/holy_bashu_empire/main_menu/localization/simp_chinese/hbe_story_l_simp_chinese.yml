 hbe_story_central_hills.108.title: "盐亭桑园的围墙"
 hbe_story_central_hills.108.desc: "盐亭豪族在旧桑园外加高围墙，过去捡拾落叶的穷户因此失去一项收入。管事说，桑叶应当留给自家养蚕，不能继续任人取用。\n\n穷户愿按季付小钱，也有人请求府署开辟共用桑地。我们可以议定拾叶权，资助另种桑苗，或维护围墙与旧业主权益。养蚕需要完整的叶量，乡民的生计也不该只能等管事一时兴起。"

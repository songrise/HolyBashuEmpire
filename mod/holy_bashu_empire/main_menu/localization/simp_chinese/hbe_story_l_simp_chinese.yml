 hbe_story_southwestern_valleys.103.title: "德昌果园的嫁接人"
 hbe_story_southwestern_valleys.103.desc: "德昌果园里来了一位熟悉嫁接的客人，老园主愿出钱留他，却不准他给其他果户传授。客人已经与邻村少年约好上山，因而拒绝独家雇约。\n\n府署可资助公共传习，也可保护园主的出资，或让客人自行接活。园主认为技法应当为付钱者服务，邻村果户则希望改好自己收成不稳的树。我们怎样安排传习，也会影响以后是否还有陌生工匠愿意留下。"

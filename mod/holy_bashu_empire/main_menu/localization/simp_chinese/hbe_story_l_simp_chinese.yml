 hbe_story_chengdu_plain.4.title: "瑞兽是否应当远送"
 hbe_story_chengdu_plain.4.desc: "外来使者愿以贵重礼物换取一对白熊。养兽人提醒我们，幼兽途中离开鲜竹便会衰弱，驿站也没有照料它们的经验。\n\n商人提出沿途雇人补给，贵族则认为拒绝赠兽会损害礼仪。山民也翻出祖辈留下的山契，追问外来采办是否会越过原有的竹山界线。\n\n本篇是“竹林中的白熊”的第4章。前面的选择将决定最后保留哪一种长期章程。"

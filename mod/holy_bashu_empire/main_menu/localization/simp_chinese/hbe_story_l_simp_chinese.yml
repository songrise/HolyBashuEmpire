 hbe_short_western_tea_horse.3.title: "回来的空篓"
 hbe_short_western_tea_horse.3.desc: "包装的采办已有裁处，回程空篓让人得以比较不同办法，传习与供货的权利又起了争论。\n\n商队回市时带来用过的篾篓，茶户把遮盖与装载的得失逐一说给纸户听。纸户带来改过的垫纸试样，愿以较低价换取更广的订单；出资商号则要求，今后若采用新包装，须先给自己一段独供期限。府署可以公开做法，也可保护一段时间的独家供货。纸户想把折法教给下一家茶行，出资者却拿出旧订单，要求先写一段只供自家的日子。"

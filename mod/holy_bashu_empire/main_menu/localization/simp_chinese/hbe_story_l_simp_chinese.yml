 hbe_story_northern_shudao.104.c: "准书坊接单，以货利补刻新字。"
 hbe_story_northern_shudao.104.title: "通江山里的木活字"
 hbe_story_northern_shudao.104.desc: "通江书坊用木片刻出可重复排版的字，寺院希望先印经文，驿署则催印关券。刻字者说，少数常用字已经磨损，继续赶印会使整套木字报废。\n\n我们可以资助添刻，指定优先用途，或准书坊自己接单。若只按官署所需抽取人手，书坊便没有余力改进；若完全交给市价决定，贫村仍难得到足够的纸券与读本。"

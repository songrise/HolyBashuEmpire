 hbe_short_southern_salt_wine.13.title: "瓮上刻谁的号"
 hbe_short_southern_salt_wine.13.desc: "几种瓮样与装法有了比较，商人选定一款愿意加价的货，却对瓮上的记号另有要求。\n\n商人带来下一批酒货的订单，提出若改用试样中的新瓮，便愿付高价，但只准刻自己的铺号。窑工认为应刻烧造者的记号，船户则想在瓮底留下装载检验。府署可以让这些责任都被看见，也可以以一家担保简化交易。窑工先在湿坯上按了自己的记号，商人的伙计却说，若不磨掉这几个字，这一批便不算独供货。"

 hbe_short_central_hills.12.desc: "剪枝与卖叶的争执已经裁处，蚕户随后用过几批不同桑叶，想把养蚕结果与来处一同记录。\n\n蚕户发现不同龄的春蚕吃叶也不同，新枝并非处处合用。老师傅愿参与记录，却请求不要让外乡人的姓名列在最前。府署可以并记发现，也可以按行会旧次序刊册。写册的人空着署名一栏，桑农和蚕师都等着。叶从哪家来、蚕由谁养，两份记录缺了任何一边都难查明。"

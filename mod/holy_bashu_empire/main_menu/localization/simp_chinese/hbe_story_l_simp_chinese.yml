 hbe_short_chengdu_plain.13.title: "旧宅里的讲读"
 hbe_short_chengdu_plain.13.desc: "一个行脚书生借住旧宅，替主人整理潮湿的诗卷。修屋需要的钱比卖书所得还多，书生却从夹页中找出几首从未刊印的旧诗。附近书坊愿替他刻板，条件是把旧宅主人的名字列在篇首。\n\n抄本终于离开了潮湿的箱子，邻里请求借旧宅办一次讲读。主人担心来客会损坏门窗，书坊愿收席钱维修。我们可以供养公共讲读，也可以让旧宅只接待受邀的宾客。\n\n“借来的诗卷”第3篇。"

 hbe_story_southern_salt_wine.111.title: "夜里多开的一口灶"
 hbe_story_southern_salt_wine.111.desc: "盐场为赶交货，在夜间多开了一口灶。灶火照亮了工人的住处，也使轮休的人整夜不能入睡。掌事者称订单只剩十日，过后自会恢复旧班。\n\n工人已经听过相同的承诺，要求立刻减少夜煎；盐商则威胁扣掉迟交的货款。府署可以为延期担保，也可强令继续赶工，或替灶户购买更省工的器具。眼前的一批盐，正与下一季仍能劳动的人手相互争用。"

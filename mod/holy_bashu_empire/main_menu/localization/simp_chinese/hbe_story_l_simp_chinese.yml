 hbe_story_northern_shudao.3.desc: "新抄的历书预告月食，山口观测者却没有看到记载的景象。寺院的讲者认为这是灾异，府学怀疑抄录时弄错了日期。\n\n驿卒保留的几份时刻记录可以帮助查验，但公开核对也会使掌历者难堪。\n\n本篇是“山壁上的星历”的第3章。前面的选择将决定最后保留哪一种长期章程。"

 hbe_short_shared.33.title: "教读人的位置"
 hbe_short_shared.33.desc: "试卷的评定已有办法，几位老师各留着自己的教读记录，蒙舍却还缺一份长久的聘任安排。\n\n新课吸引了更多住户，原老师希望主持权传给子弟。家属认为出钱不能换来永久名额，府署可按教读成绩择人，也可尊重旧家供养。家长们带来孩子最早与最近的习作，旧家却递上一份祖辈主持蒙舍的名册。新聘纸上先空着教读人的姓名。"

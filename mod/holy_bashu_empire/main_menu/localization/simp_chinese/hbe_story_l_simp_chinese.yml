 hbe_short_chengdu_plain.13.title: "旧宅里的讲读"
 hbe_short_chengdu_plain.13.desc: "署名的争议暂有安置，诗卷终于有人读到，邻里又为公开讲读递来了请求。\n\n抄本终于离开了潮湿的箱子，邻里请求借旧宅办一次讲读。主人担心来客会损坏门窗，书坊愿收席钱维修。我们可以供养公共讲读，也可以让旧宅只接待受邀的宾客。邻人已经凑来几张长凳，主人却先在门槛旁放了一只收礼的盒子。书坊的人站在院中，等着决定这场讲读要发几份读本。"

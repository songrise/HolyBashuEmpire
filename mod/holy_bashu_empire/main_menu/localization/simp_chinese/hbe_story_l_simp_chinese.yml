 hbe_story_northern_shudao.202.title: "关军传时网"
 hbe_story_northern_shudao.202.desc: "关城的更鼓依同一套时刻响起，测候人和守望兵把仪器编入轮戍。公开讲读让位于军用传时，驿刻却比从前整齐。府署将几十年的积累交给关军，换来更可靠的山路防务与供给。\n\n几十年的笔记、工钱与争执没有凭空消失。它们被保存进新的章程，成为后来主持者必须继续履行的责任。至此，这段事业已经收束，获得的长期收益将随国家延续。"
 hbe_story_northern_shudao.8.c: "封存旧案，不另立长期章程。"
 hbe_story_northern_shudao.8.title: "山路上的同一时刻"
 hbe_story_northern_shudao.8.desc: "各站已经能把日影、水刻和星辰记录互相核对。府城希望刊出新的山地历书，关军则要求先统一夜间传时。\n\n先人留下的记录既能服务学问，也能帮助守关。长期制度将决定测候者今后依靠府学、村寨，还是军府。\n\n历年的选择已经留下方向；最后的章程只能从已经得到支持的道路中确定。"

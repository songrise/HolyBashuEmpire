 hbe_story_southwestern_valleys.109.title: "建昌议事堂的翻译"
 hbe_story_southwestern_valleys.109.desc: "建昌议事堂新来的书记把村寨的几个称谓都写成了同一个字。长者发现自己的承诺被混入另一寨名下，要求重新说明。\n\n书记担心改册使府署失去体面，翻译者愿逐寨核对，却需要沿路住宿与工钱。我们可以公开改正，也可另附注解，或只承认后来统一的称谓。若不分辨谁说过什么，一份看似齐整的议约便难以真正落实。"

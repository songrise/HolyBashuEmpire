 hbe_story_southwestern_valleys.101.title: "盐源湖边的旧船"
 hbe_story_southwestern_valleys.101.desc: "盐源湖边渔户修好一只旧船，领地管事却要求先用来运官货。船主的父亲一直靠这只船捕鱼，若失去几日行期，家中便无法按时缴租。\n\n管事说，临时调船属于旧役额，渔户则出示了已经完役的木牌。府署可以付钱雇船，重核役额，或坚持先运官货。怎样处理旧船，会让湖边住户知道保存好自己的器具是否反而意味着承担更多征用。"

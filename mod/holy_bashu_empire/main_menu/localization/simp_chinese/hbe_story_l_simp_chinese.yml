 hbe_story_southwestern_valleys.8.b: "关桥总署。"
 hbe_story_southwestern_valleys.202.a: "把章程留给后来者。"
 hbe_story_southwestern_valleys.202.title: "关桥总署"
 hbe_story_southwestern_valleys.202.desc: "关桥总署在各谷设下统一的票牌，税费与维修钱进入同一公账。村寨不再各自收取桥钱，守军却可以更快地调动铁匠和人手。诸谷得到了贯通的道路，也把对通行权的部分主持交给了府署。\n\n几十年的笔记、工钱与争执没有凭空消失。它们被保存进新的章程，成为后来主持者必须继续履行的责任。至此，这段事业已经收束，获得的长期收益将随国家延续。"
 hbe_story_southwestern_valleys.8.c: "封存旧案，不另立长期章程。"
 hbe_story_southwestern_valleys.8.title: "连起诸谷的道路"
 hbe_story_southwestern_valleys.8.desc: "绳桥、铁索与桥边集市已经把几处山谷连在一起。村寨愿把互助定成长期桥约，关署则希望统一处理税费和防务。\n\n共同主持可以保留各谷的声音，统一关署能使过路人只面对一套规则。最后的安排将决定后人怎样使用这些桥。\n\n历年的选择已经留下方向；最后的章程只能从已经得到支持的道路中确定。"

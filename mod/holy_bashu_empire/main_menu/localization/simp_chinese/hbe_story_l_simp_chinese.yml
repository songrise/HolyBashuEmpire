 hbe_short_northern_shudao.11.title: "谁来补上这几日"
 hbe_short_northern_shudao.11.desc: "关军与村寨各留一册轮戍工钱，名字相同，记的日期却不一样。几名士兵已经回乡耕作，仍被算在缺役的人里。书记说两册无法对照，只能请家族作保；士兵认为自己守过的城门不该由家世来证明。\n\n军官请求先追补役额，村民要求查清旧账再出人。府署可以雇人替岗，也可以按军册征补，或让两方各派书记查验。\n\n“轮戍人的两册工钱”第1篇。"

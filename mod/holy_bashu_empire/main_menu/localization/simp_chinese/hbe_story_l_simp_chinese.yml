 hbe_story_eastern_river.110.desc: "丰都庙会的一出戏把冤屈带到阴司审理，戏散后，一位妇人照着戏里的格式写了诉状。书记笑她用错称呼，拒绝把纸呈上去。\n\n庙中讲者认为，戏能让不识字的人明白公道；官吏担心百姓拿鬼神故事替代府署规矩。我们可以让书记帮助改写，也可禁止借戏说讼，或让庙会公开教授正当申诉的格式。妇人只想知道自己的事能不能得到听取。"

 hbe_short_central_hills.3.title: "留给下一年的仓格"
 hbe_short_central_hills.3.desc: "试种与记收的办法经过一季检验，种户把收回的谷送到仓前，又争起来年的借种次序。\n\n新种与旧种都要进入仓中，掌仓人请求多设一格，清楚记下借种与还种。田主愿出仓钱，条件是优先借到好种。我们可以设公共留种，也可以承认出资者的优先权。留种的木格只有几处空位，出过钱的仓户已经贴上姓名。没有余粮的借户仍站在门口，想知道开春还能不能来借。"

 hbe_short_western_tea_horse.13.title: "下次冬市的验马"
 hbe_short_western_tea_horse.13.desc: "一匹从冬市买来的马带着两处烙印，新旧马主都说自己拥有它。新买主已把马交给赶马人驮货，旧主人拿出的见证又来自另一座山寨。商人担心争执扩大，马医却发现旧烙处一直没有愈合。\n\n双方终于愿意按补价和照料费结案，请求以后在冬市先查烙印。旧验马人担心新规使自己失去主持，年轻牧人愿帮忙记马病。府署可训练共同验马，也可继续依旧验牌收货。\n\n“马群中的旧烙印”第3篇。"

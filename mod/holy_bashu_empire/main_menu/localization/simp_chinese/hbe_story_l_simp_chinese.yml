 hbe_short_shared.204.title: "新户缴来的旧钱"
 hbe_short_shared.204.desc: "迁户交租时带来几串从旧乡攒下的钱，收租者认为成色不足，要求重新折价。货主愿在市上按重量收，却只肯换成较少的本地钱。家属不懂两种价目的差别，担心一趟入蜀已经把多年积蓄花去大半。\n\n府署可以组织查验，公布折价，也可以维护现有收租规定，或由商人担保分期交割。公开办法会触动靠旧折价获利的人，保留旧例则使新户继续承担不熟悉市场的代价。"

 hbe_short_shared.51.title: "药铺能否开门"
 hbe_short_shared.51.desc: "外乡医者在本村开药铺，本地医者指责他未受行规。病家觉得新药价低，却担心所用药草与以前不同。两位医者都愿把治过的人列出来，家属希望比较病程，不愿只凭谁的名字更熟悉。\n\n府署可以准限期诊治，也可保护本地行规，或请两医共同会诊。病家急等药钱，任何查验都须有一处暂时取药的地方。病家把先前吃过的药包一同带来，新医想先看病程，旧铺却请先查他的开门凭据。"

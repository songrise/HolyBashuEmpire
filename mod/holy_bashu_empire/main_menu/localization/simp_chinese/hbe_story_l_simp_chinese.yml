 hbe_migration.3.title: "同姓而不同乡"
 hbe_migration.3.desc: "荒坡上的田界已有一次裁处，村中仍有租种、帮工和借住的外来支系，祭席上的座次又让他们与旧族发生争执。\n\n两支同姓人家为祭席上的座次争执起来。新户带来湖广旧乡的谱牒，声称应按辈分入席；本地族老却说，宗祠、桥梁和义仓都是旧户多年出钱修成，不能仅凭相同的姓就分得主持权。新来的长者愿捐纸墨，替族中补抄旧谱，也愿记下一路入蜀的经历。年轻人已在田间互相帮工，却不明白为何同桌吃一顿饭会触动祖先的体面。府署可以承认共同入籍，把祭席另行议定，也可以保留旧族的次序，只让新户在祠外设席。"

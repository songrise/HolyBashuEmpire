 hbe_canal_crossbow_renaissance: "渠乡劲弩"
 hbe_age2_chengdu_plain_qualified_tt: "已研究本圈基础军制及「$unlock_crossbowmen_advance$」，并保持HBE成员身份。"
 hbe_canal_crossbow_renaissance_desc: "渠乡把散练改为成列轮射，弩具、箭料与交接日期分册登记。劲弩仍须依托渠务机构供养，遇敌时以先手射击接应友军。\n\n每队500人。研究「$unlock_crossbowmen_advance$」后可用；仍须掌握「$hbe_military_chengdu_plain$」并满足当地机构、供养、役负与共同额度条件。客籍议约仅提供基础军制资格。旧队可依原版规则付费换装，不另增役负。"

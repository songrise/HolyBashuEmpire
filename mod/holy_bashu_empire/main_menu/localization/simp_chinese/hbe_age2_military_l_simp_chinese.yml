 hbe_granary_militia_renaissance_desc: "仓社把守仓、护田与应急集结分列名册，常备者分领粮械。队伍轻装节用，适合长期守备，正面杀伤仍逊于专业战兵。\n\n每队500人。研究「$armory_advance$」后可用；仍须掌握「$hbe_military_central_hills$」并满足当地机构、供养、役负与共同额度条件。客籍议约仅提供基础军制资格。旧队可依原版规则付费换装，不另增役负。"
 hbe_tea_riders_renaissance: "茶路选骑"
 hbe_age2_western_tea_horse_qualified_tt: "已研究本圈基础军制及「$unlock_cavalry_advance$」，并保持HBE成员身份。"
 hbe_tea_riders_renaissance_desc: "茶路护骑按脚程和骑术选补，马料、驮具与交接凭据随队核验。骑手善于绕侧接应，进入密林、湿地或险山时仍须谨慎。\n\n每队500人。研究「$unlock_cavalry_advance$」后可用；仍须掌握「$hbe_military_western_tea_horse$」并满足当地机构、供养、役负与共同额度条件。客籍议约仅提供基础军制资格。旧队可依原版规则付费换装，不另增役负。"

 hbe_valley_soldiers_renaissance_desc: "各寨从旧有编伍中选出熟识山路的兵员，轻装分队按山口会合。丘陵与山地便于其展开，平地硬战仍非所长。\n\n每队500人。研究「$armory_advance$」后可用；仍须掌握「$hbe_military_southwestern_valleys$」并满足当地机构、供养、役负与共同额度条件。客籍议约仅提供基础军制资格。旧队可依原版规则付费换装，不另增役负。"

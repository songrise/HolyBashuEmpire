l_simp_chinese:
 game_concept_hbe_history_huguang_migration: "湖广填四川"
 game_concept_hbe_history_huguang_migration_desc: "#T 历史背景#!\n元末明初已有湖广籍人口迁入川渝，明末清初以后又形成大规模移民潮。来人除今湖北、湖南一带，也有江西、广东、福建等地居民，迁徙改变了当地的聚落、宗族与生活习俗。"
 game_concept_hbe_history_huiguan: "同乡会馆"
 game_concept_hbe_history_huiguan_desc: "#T 历史背景#!\n外来商人和移民按乡籍集资设馆，联络同乡、祭祀聚会，也维护共同的商贸利益。清代重庆留下多处会馆，禹王宫、齐安公所与广东公所构成今天重庆湖广会馆的主体。"
 game_concept_hbe_history_embroidery: "蜀绣"
 game_concept_hbe_history_embroidery_desc: "#T 历史背景#!\n蜀绣以成都为主要传承地，绣工用丝线在底料上逐针绣出纹样。蜀锦则由织工在织机上组织经纬成花。两种技艺都与蜀地丝业相连，制成花纹的方法不同。"
 game_concept_hbe_history_bamboo_paper: "蜀地竹纸"
 game_concept_hbe_history_bamboo_paper_desc: "#T 历史背景#!\n四川夹江等地传承以嫩竹造纸的技艺。纸工浸泡、蒸煮竹料，反复洗料捣浆，再用竹帘抄成纸页、压水干燥。一张竹纸的成色，既取决于原料，也取决于多道工序中的手艺。"
 game_concept_hbe_history_panda: "大熊猫"
 game_concept_hbe_history_panda_desc: "#T 历史背景#!\n四川宝兴邓池沟是大熊猫模式标本的产地。1869年，博物学家阿尔芒·戴维在当地取得标本，送往法国研究，大熊猫由此进入近代动物学的记录与分类。"
 game_concept_hbe_history_zigong_fossils: "自贡恐龙化石"
 game_concept_hbe_history_zigong_fossils_desc: "#T 历史背景#!\n自贡一带保存着丰富的侏罗纪恐龙化石。当地的近代调查始于二十世纪；1979年末，大山铺化石群大规模暴露，此后的发掘为研究恐龙骨骼、古环境与地层提供了重要材料。"
 game_concept_hbe_history_timekeeping: "日影、漏刻与测候"
 game_concept_hbe_history_timekeeping_desc: "#T 历史背景#!\n日晷利用日影测时，漏刻依滴水与水位变化计刻，两者可互相参校。观测星辰另有专门仪器：元代郭守敬改进浑仪结构、创制简仪，用于测量天体位置。"
 game_concept_hbe_history_dazu: "大足石刻"
 game_concept_hbe_history_dazu_desc: "#T 历史背景#!\n大足石刻的重要造像多成于九至十三世纪，题材兼有佛教、道教、儒家思想与日常生活。石壁题记还保存了年代、人物与信仰的信息，使造像之外的地方社会也有迹可寻。"

 hbe_af_result.161.desc: "各处交割清楚，实得成果超过原先预计。\n\n役负实际降低 [SCOPE.GetValue('af_actual_0')|2] 点。\n当地建设速度 +5%，实际持续 [SCOPE.GetValue('af_actual_1')|0] 个月。\n[SCOPE.sLocation('af_location').GetName]实际增加 [SCOPE.GetValue('af_actual_2')|0] 名本国文化、国教农民。\n陆军传统实际增加 [SCOPE.GetValue('af_actual_3')|2] 点。\n\n本届贡献实际增加 [SCOPE.GetValue('af_contribution')|2]。\n条件改变时补退金币：[SCOPE.GetValue('af_fallback_gold')|2] @gold!。"
 hbe_af_public_funding: "公帑筹办"
 hbe_af_public_funding_desc: "各府将工料、雇价与拨款合记一册，按工程所需分期调集公帑。大项营办从此有据可核，不再临时向一乡一户摊派。"
 hbe_af_allow_large_investment: "允许大量投入"
 MODIFIER_TYPE_NAME_hbe_af_allow_large_investment: "允许大量投入"
 MODIFIER_TYPE_DESC_hbe_af_allow_large_investment: "地方事业可以选择大量投入；仍须支付项目所列金币与役负。"
 hbe_af_local_proposals: "地方采议"
 hbe_af_local_proposals_desc: "乡社与府署定期递交工程、招徕与修治的议案，记明地点及所需工料。旧议未定时，可以另取新案比较，再择一项筹办。"
 hbe_af_allow_local_refresh: "允许刷新地区事件"

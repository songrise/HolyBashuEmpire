 MODIFIER_TYPE_DESC_hbe_af_allow_local_refresh: "空闲时可以刷新地区项目，每三个月一次；全国项目及进行中的工程不变。"
 hbe_af_project_1: "清理役簿"
 hbe_af_desc_1: "核对各处役簿，注销重复征调，厘清尚未交接的责任。"

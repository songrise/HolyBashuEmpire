 hbe_af_public_funding: "公帑筹办"
 hbe_af_public_funding_desc: "各府将工料、雇价与拨款合记一册，按工程所需分期调集公帑。大项营办从此有据可核，不再临时向一乡一户摊派。"
 hbe_af_allow_large_investment: "允许大量投入"
 MODIFIER_TYPE_NAME_hbe_af_allow_large_investment: "允许大量投入"
 hbe_af_local_proposals: "地方采议"
 hbe_af_local_proposals_desc: "乡社与府署定期递交工程、招徕与修治的议案，记明地点及所需工料。旧议未定时，可以另取新案比较，再择一项筹办。"
 hbe_af_allow_local_refresh: "允许刷新地方事业"
 MODIFIER_TYPE_NAME_hbe_af_allow_local_refresh: "允许刷新地方事业"
 hbe_af_local_reward_modifier: "地方事业收益"
 MODIFIER_TYPE_NAME_hbe_af_local_reward_modifier: "地方事业收益"
 MODIFIER_TYPE_DESC_hbe_af_local_reward_modifier: "提高地方候选项目的人口、研究、金币等数量型奖励，并延长其限时修正。建筑等级和道路仍按完整一项结算；全国项目、费用与工期不变。"
 hbe_teahouse_public_deliberation: "茶社公议"
 hbe_teahouse_public_deliberation_desc: "府署与乡里在茶社商议工期、轮歇和新户安置。账上已有的分担，仍须有人当面说明。"
 hbe_public_teahouse: "茶社公所"
 hbe_public_teahouse_desc: "供居民饮茶、休憩与议事的政府建筑。每个有效等级每月减少0.5役负，所在地人口同化速度每级增加10%。\n\n全国总等级上限5（含在建），可在同一地点升级或分散建设。满额有效运转每月减少2.5役负。须有雇员并持续取得茶与纸；实际减役随有效建筑等级缩放，同化遵循原版就业与供养规则。"
 hbe_public_teahouse_maintenance: "茶社公所日常供养"
 hbe_public_teahouse_maintenance_desc: "消耗茶与纸，供居民饮茶议事，维持日常接待。"
 hbe_teahouse_monthly_burden_relief: "每月役负自然衰减"
 MODIFIER_TYPE_NAME_hbe_teahouse_monthly_burden_relief: "每月役负自然衰减"
 MODIFIER_TYPE_DESC_hbe_teahouse_monthly_burden_relief: "每月减少全国役负，实际数值按有效建筑等级计算；失去供养时相应收益降低。"
 hbe_af_project_1: "清理役簿"
 hbe_af_desc_1: "核对各处役簿，注销重复征调，厘清尚未交接的责任。"

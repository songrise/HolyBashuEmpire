 hbe_shared_production_support_desc: "同类短期生产筹备取较强效果；同强度的新安排刷新期限，不重复叠加。合计最多提高全局生产效率5%。"
 hbe_shared_food_support_desc: "同类短期粮务协作取较强效果；同强度的新安排刷新期限，不重复叠加。合计最多提高全局粮食产出10%。"
 hbe_prefectural_council: "府州公议"
 hbe_prefectural_council_desc: "各府的水口、田界与工役，不再只凭一封官札处置。市镇与乡里的代表轮流入府，书吏将旧契与新议编成簿册，主持者须向实际承担钱粮的人说明缘由。公议使政令与传习更有根基，也收回了一部分旧门第独断的权力。"
 hbe_mountain_river_dispatch: "山川转运"
 hbe_mountain_river_dispatch_desc: "沿江的仓站与越岭的驿铺共用货簿，船期、马程和交割凭券得以互相衔接。诸侯仍掌各自的商路，却须按同一份约定接济过境货队。转运使商人少走冤路，也要府库长期拨出一份钱粮，承担仓站与护行的责任。"

 hbe_transmission_paper: "槽帘传习"
 hbe_transmission_paper_desc: "老纸匠把细帘的编法留给各坊，先教选料，再教看浆。坊中的常纸照旧出槽，细料另留一份，抄成适合书契与印行的蜀纸。"
 hbe_transmission_paper_effects: "$paper_guild$、$paper_workshop$、$paper_manufactory$、$paper_mill$可选择「细帘兼抄」。保留原有生产；每级副产0.0521 $hbe_shu_paper$，额外消耗0.06 $fiber_crops$、0.02 $lumber$、0.005 $tools$。约8级抵一座$hbe_gate_registry$基础工序。副业可关闭，不提供全局加成。\n$hbe_gate_registry$全国上限增加一座：由两座增至三座（含在建，每处一级）。"

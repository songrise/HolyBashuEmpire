l_simp_chinese:
 hbe_transmission_embroidery: "锦样分授"
 hbe_transmission_embroidery_desc: "锦户把织样分成数份，交给城中的织工。各坊仍织原有的布匹，只拨出少量丝线依样绣作；新学的针法，由讲习院按期校验。"
 hbe_transmission_embroidery_effects: "$fine_cloth_guild$、$fine_cloth_workshop$、$fine_cloth_manufactory$、$fine_cloth_mill$可选择「绣样兼作」。保留原有生产；每级副产0.05 $hbe_shu_embroidery$，额外消耗0.07 $silk$、0.02 $dyes$。约8级抵一座$hbe_brocade_school$基础工序。副业可关闭，不提供全局加成。\n$hbe_brocade_school$全国上限增加一座：由两座增至三座（含在建，每处一级）。"
 hbe_transmission_embroidery_cap_tt: "同类机构基础上限两座；研究「$hbe_transmission_embroidery$」后为三座（含在建），每处最多一级。"
 hbe_transmission_embroidery_license_tt: "本国源自本圈，并已研究「$hbe_tech_chengdu_plain_2$」；客籍与吞并凭据仅承继基础产业，不授予本圈专属进阶工艺"
 hbe_transmission_embroidery_researched_tt: "已研究「$hbe_transmission_embroidery$」"
 hbe_transmission_embroidery_sidework: "绣样兼作"
 hbe_transmission_embroidery_off: "不兼营"
 hbe_transmission_embroidery_sidework_desc: "$fine_cloth_guild$、$fine_cloth_workshop$、$fine_cloth_manufactory$、$fine_cloth_mill$可选择「绣样兼作」。保留原有生产；每级副产0.05 $hbe_shu_embroidery$，额外消耗0.07 $silk$、0.02 $dyes$。约8级抵一座$hbe_brocade_school$基础工序。副业可关闭，不提供全局加成。"
 hbe_transmission_embroidery_off_desc: "仅维持原有工序；不消耗副业原料，也不产出特产。"
 hbe_transmission_well_salt: "井灶合煎"
 hbe_transmission_well_salt_desc: "旧盐场依常法出盐，井户另领木料与铁器，择卤兴业精煎。几家共用的灶具记入一册，精盐单独过秤，日常盐课仍照旧交纳。"
 hbe_transmission_well_salt_effects: "$salt_collector$可选择「兴业精煎」。保留原有生产；每级副产0.1 $hbe_well_salt$，额外消耗0.16 $lumber$、0.05 $tools$。约6级抵一座$hbe_salt_office$基础工序。副业可关闭，不提供全局加成。允许在本国普通盐资源地点建设原版盐场；沿海与沙漠的原有条件保留。\n$hbe_salt_office$全国上限增加一座：由两座增至三座（含在建，每处一级）。"
 hbe_transmission_well_salt_cap_tt: "同类机构基础上限两座；研究「$hbe_transmission_well_salt$」后为三座（含在建），每处最多一级。"
 hbe_transmission_well_salt_license_tt: "本国源自本圈，并已研究「$hbe_tech_southern_salt_wine_1$」；客籍与吞并凭据仅承继基础产业，不授予本圈专属进阶工艺"

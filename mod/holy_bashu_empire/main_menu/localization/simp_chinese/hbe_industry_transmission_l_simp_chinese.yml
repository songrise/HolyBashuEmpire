 hbe_transmission_border_tea: "茶引分庄"
 hbe_transmission_border_tea_desc: "交割场把验茶、压砖与包扎的规矩分给沿途集镇。各镇照做原有手艺，逢茶到市，再按同一分量压砖封包，交给过山的商队。"
 hbe_transmission_border_tea_effects: "$market_village$可选择「茶庄附作」。保留原有生产；每级副产0.0667 $hbe_border_tea$，额外消耗0.07 $tea$、0.012 $paper$、0.006 $tools$。约6级抵一座$hbe_tea_exchange$基础工序。副业可关闭，不提供全局加成。\n$hbe_tea_exchange$全国上限增加一座：由两座增至三座（含在建，每处一级）。"

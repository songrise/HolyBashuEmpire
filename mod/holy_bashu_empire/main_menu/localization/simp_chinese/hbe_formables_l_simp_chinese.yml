 hbe_form_sichuan.a: "合诸府之印，立山川之国。"
 hbe_form_sichuan.title: "成立四川"
 hbe_form_sichuan.title.entry: "成立四川"
 hbe_sichuan_core: "四川核心地区"
 hbe_form_sichuan_desc: "山川虽有旧界，府州终须同治。直属拥有并控制133处核心地区中的至少90处（67%），并持有指定枢纽城市，即可统一旗号。成立后保留原有地区科技、议约与国家传承。"

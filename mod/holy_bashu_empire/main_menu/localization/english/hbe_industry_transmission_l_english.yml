l_english:
 hbe_transmission_embroidery: "Brocade Pattern Sharing"
 hbe_transmission_embroidery_desc: "Brocade households distribute copies of their patterns among the town's weavers. Each workshop keeps its usual cloth production, setting aside a little silk for embroidery. The brocade school checks the work against the master patterns."
 hbe_transmission_embroidery_effects: "Enables Brocade Sidework in $fine_cloth_guild$, $fine_cloth_workshop$, $fine_cloth_manufactory$, $fine_cloth_mill$. Existing production is retained. Each level adds 0.05 $hbe_shu_embroidery$ and consumes 0.07 $silk$, 0.02 $dyes$. About 8 levels match one $hbe_brocade_school$ starter recipe. Sidework can be disabled; no national modifiers are granted.\nAdds one national $hbe_brocade_school$ slot, increasing the cap from two to three, including construction; one level per location."
 hbe_transmission_embroidery_cap_tt: "The national cap is two, increased to three by $hbe_transmission_embroidery$; includes construction, one level per location."
 hbe_transmission_embroidery_license_tt: "Originates in this circle and has researched $hbe_tech_chengdu_plain_2$. Guest and annexation certificates retain starter industries only, not this circle-specific advanced craft."
 hbe_transmission_embroidery_researched_tt: "Has researched $hbe_transmission_embroidery$."
 hbe_transmission_embroidery_sidework: "Brocade Sidework"
 hbe_transmission_embroidery_off: "No Sidework"
 hbe_transmission_embroidery_sidework_desc: "Enables Brocade Sidework in $fine_cloth_guild$, $fine_cloth_workshop$, $fine_cloth_manufactory$, $fine_cloth_mill$. Existing production is retained. Each level adds 0.05 $hbe_shu_embroidery$ and consumes 0.07 $silk$, 0.02 $dyes$. About 8 levels match one $hbe_brocade_school$ starter recipe. Sidework can be disabled; no national modifiers are granted."
 hbe_transmission_embroidery_off_desc: "Retains existing production without sidework inputs or specialty output."
 hbe_transmission_well_salt: "Shared Brine Refining"
 hbe_transmission_well_salt_desc: "The saltworks keep their ordinary production while experienced well households refine a smaller batch in separate pans. Shared equipment is entered in one ledger, and the refined salt is weighed apart from the usual salt dues."
 hbe_transmission_well_salt_effects: "Enables Separate-Pan Brine Refining in $salt_collector$. Existing production is retained. Each level adds 0.1 $hbe_well_salt$ and consumes 0.16 $lumber$, 0.05 $tools$. About 6 levels match one $hbe_salt_office$ starter recipe. Sidework can be disabled; no national modifiers are granted. Also permits native saltworks on owned salt-resource locations; existing coastal and desert eligibility is preserved.\nAdds one national $hbe_salt_office$ slot, increasing the cap from two to three, including construction; one level per location."
 hbe_transmission_well_salt_cap_tt: "The national cap is two, increased to three by $hbe_transmission_well_salt$; includes construction, one level per location."
 hbe_transmission_well_salt_license_tt: "Originates in this circle and has researched $hbe_tech_southern_salt_wine_1$. Guest and annexation certificates retain starter industries only, not this circle-specific advanced craft."
 hbe_transmission_well_salt_researched_tt: "Has researched $hbe_transmission_well_salt$."
 hbe_transmission_well_salt_sidework: "Separate-Pan Brine Refining"
 hbe_transmission_well_salt_off: "No Sidework"
 hbe_transmission_well_salt_sidework_desc: "Enables Separate-Pan Brine Refining in $salt_collector$. Existing production is retained. Each level adds 0.1 $hbe_well_salt$ and consumes 0.16 $lumber$, 0.05 $tools$. About 6 levels match one $hbe_salt_office$ starter recipe. Sidework can be disabled; no national modifiers are granted. Also permits native saltworks on owned salt-resource locations; existing coastal and desert eligibility is preserved."
 hbe_transmission_well_salt_off_desc: "Retains existing production without sidework inputs or specialty output."
 hbe_transmission_paper: "Papermaking Screen Transmission"
 hbe_transmission_paper_desc: "Master papermakers teach the workshops how to weave finer screens, choose their fibers and judge the pulp. Ordinary paper continues to leave the vats, while a small share of selected material becomes Shu paper for contracts and printing."
 hbe_transmission_paper_effects: "Enables Fine-Screen Sidework in $paper_guild$, $paper_workshop$, $paper_manufactory$, $paper_mill$. Existing production is retained. Each level adds 0.0521 $hbe_shu_paper$ and consumes 0.06 $fiber_crops$, 0.02 $lumber$, 0.005 $tools$. About 8 levels match one $hbe_gate_registry$ starter recipe. Sidework can be disabled; no national modifiers are granted.\nAdds one national $hbe_gate_registry$ slot, increasing the cap from two to three, including construction; one level per location."
 hbe_transmission_paper_cap_tt: "The national cap is two, increased to three by $hbe_transmission_paper$; includes construction, one level per location."
 hbe_transmission_paper_license_tt: "Originates in this circle and has researched $hbe_tech_northern_shudao_6$. Guest and annexation certificates retain starter industries only, not this circle-specific advanced craft."
 hbe_transmission_paper_researched_tt: "Has researched $hbe_transmission_paper$."
 hbe_transmission_paper_sidework: "Fine-Screen Sidework"
 hbe_transmission_paper_off: "No Sidework"
 hbe_transmission_paper_sidework_desc: "Enables Fine-Screen Sidework in $paper_guild$, $paper_workshop$, $paper_manufactory$, $paper_mill$. Existing production is retained. Each level adds 0.0521 $hbe_shu_paper$ and consumes 0.06 $fiber_crops$, 0.02 $lumber$, 0.005 $tools$. About 8 levels match one $hbe_gate_registry$ starter recipe. Sidework can be disabled; no national modifiers are granted."

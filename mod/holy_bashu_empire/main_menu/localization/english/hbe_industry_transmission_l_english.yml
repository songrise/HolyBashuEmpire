 hbe_transmission_border_tea: "Branch Tea Processing"
 hbe_transmission_border_tea_desc: "The tea exchange passes its rules for sorting, pressing and wrapping tea to the villages along the route. Their usual crafts continue; when tea reaches the market, a small batch is pressed and packed to standard weights for the mountain caravans."
 hbe_transmission_border_tea_effects: "Enables Village Tea Sidework in $market_village$. Existing production is retained. Each level adds 0.0667 $hbe_border_tea$ and consumes 0.07 $tea$, 0.012 $paper$, 0.006 $tools$. About 6 levels match one $hbe_tea_exchange$ starter recipe. Sidework can be disabled; no national modifiers are granted.\nAdds one national $hbe_tea_exchange$ slot, increasing the cap from two to three, including construction; one level per location."

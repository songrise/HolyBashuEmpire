l_english:
 MODIFIER_TYPE_DESC_ban_exports_of_hbe_border_tea: "Bans exports of border tea from the country’s markets."
 MODIFIER_TYPE_DESC_ban_exports_of_hbe_shu_embroidery: "Bans exports of Shu embroidery from the country’s markets."
 MODIFIER_TYPE_DESC_ban_exports_of_hbe_shu_paper: "Bans exports of Shu paper from the country’s markets."
 MODIFIER_TYPE_DESC_ban_exports_of_hbe_well_salt: "Bans exports of well salt from the country’s markets."
 MODIFIER_TYPE_DESC_ban_imports_of_hbe_border_tea: "Bans imports of border tea into the country’s markets."
 MODIFIER_TYPE_DESC_ban_imports_of_hbe_shu_embroidery: "Bans imports of Shu embroidery into the country’s markets."
 MODIFIER_TYPE_DESC_ban_imports_of_hbe_shu_paper: "Bans imports of Shu paper into the country’s markets."
 MODIFIER_TYPE_DESC_ban_imports_of_hbe_well_salt: "Bans imports of well salt into the country’s markets."
 MODIFIER_TYPE_DESC_can_extract_hbe_border_tea: "Allows extraction where a location already has border tea as its raw material. Does not create deposits or unlock specialty buildings and production methods."
 MODIFIER_TYPE_DESC_can_extract_hbe_shu_embroidery: "Allows extraction where a location already has Shu embroidery as its raw material. Does not create deposits or unlock specialty buildings and production methods."
 MODIFIER_TYPE_DESC_can_extract_hbe_shu_paper: "Allows extraction where a location already has Shu paper as its raw material. Does not create deposits or unlock specialty buildings and production methods."
 MODIFIER_TYPE_DESC_can_extract_hbe_well_salt: "Allows extraction where a location already has well salt as its raw material. Does not create deposits or unlock specialty buildings and production methods."
 MODIFIER_TYPE_DESC_hbe_af_allow_guild_projects: "Adds six guild project roles to local affairs: craft records, materials, quality standards, apprentices, workshops and trial production. Operating specialty institutions reduce their labor burden by 20%; local projects require an institution at the target location."
 MODIFIER_TYPE_DESC_hbe_af_allow_large_investment: "Enables the large-investment tier in local affairs. Pay its listed gold and labor burden for its listed rewards and duration. Switching tiers updates both candidate cards."
 MODIFIER_TYPE_DESC_hbe_af_allow_local_refresh: "While idle, use the round button at the upper right of the local project card to replace that offer. Available once every two years; the national offer and active construction stay unchanged."
 MODIFIER_TYPE_DESC_hbe_border_tea_used_for_minting: "Allows border tea to be used for minting. Minting income and inflation follow the base-game rules."
 MODIFIER_TYPE_DESC_hbe_can_cross_circle_industry: "Allows regional industry buildings and specialty production outside the home circle. Own land in that circle, use communal labor policy, reach 60 fraternity, then pay the listed gold and 10 fraternity to establish access. Local geography and building caps still apply."
 MODIFIER_TYPE_DESC_hbe_elector_can_participate_in_parliament: "Allows this organization’s electors to participate in parliament, subject to the organization rules and parliament requirements."
 MODIFIER_TYPE_DESC_hbe_shu_embroidery_used_for_minting: "Allows Shu embroidery to be used for minting. Minting income and inflation follow the base-game rules."
 MODIFIER_TYPE_DESC_hbe_shu_paper_used_for_minting: "Allows Shu paper to be used for minting. Minting income and inflation follow the base-game rules."
 MODIFIER_TYPE_DESC_hbe_well_salt_used_for_minting: "Allows well salt to be used for minting. Minting income and inflation follow the base-game rules."

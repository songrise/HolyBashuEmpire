l_english:
 hbe_shared_production_support: "Manufacturing Arrangements"
 hbe_shared_food_support: "Food Supply Arrangements"
 hbe_shared_production_support_desc: "Temporary production arrangements retain the stronger effect and refresh the duration for equal-strength arrangements; they do not stack. Maximum production efficiency bonus: 5%."
 hbe_shared_food_support_desc: "Temporary food arrangements retain the stronger effect and refresh the duration for equal-strength arrangements; they do not stack. Maximum food output bonus: 10%."
 hbe_prefectural_council: "Prefectural Councils"
 hbe_prefectural_council_desc: "Representatives from towns and villages bring water rights, land boundaries and labor obligations before the prefecture. Clerks keep old contracts beside the new decisions, and officials answer to those who supply money and labor. Public deliberation strengthens administration and learning while curbing noble discretion."
 hbe_mountain_river_dispatch: "Mountain and River Dispatch"
 hbe_mountain_river_dispatch_desc: "River warehouses and mountain relay stations share cargo records, linking sailing dates, caravan stages and delivery warrants. Each prince retains control of local routes while supporting through traffic under a common agreement. Merchants gain a more reliable network, financed by a continuing claim on tax revenue."

 hbe_canal_crossbow_renaissance: "Canal Veteran Crossbowmen"
 hbe_age2_chengdu_plain_qualified_tt: "Requires home-circle military training, $unlock_crossbowmen_advance$ and HBE membership."
 hbe_canal_crossbow_renaissance_desc: "Canal Veteran Crossbowmen continues the home-circle military tradition with improved equipment and organization.\n\n500 men per regiment. Unlocked by $unlock_crossbowmen_advance$; home-circle $hbe_military_chengdu_plain$, local institutions, supply, burden and shared capacity remain required. Guest compacts grant only basic military rights. Existing regiments use native paid upgrades without an extra burden charge."

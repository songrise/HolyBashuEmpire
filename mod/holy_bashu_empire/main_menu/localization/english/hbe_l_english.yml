 hbe.105.title: "茶马交割"
 hbe.105.desc: "川西茶马圈的商队带回货物，也带回一叠尚未结清的凭据。采茶、换马与过山分别由不同府州承办，途中增加的费用却被留在了最后一道关口。\n\n[Concept('hbe_history_tea', '雅州茶马司')|e]的旧事仍为商人熟知，互市要靠货物，也要靠各方认可的规矩。我们可以动用@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]承接差额，或者拨款重新核验；推迟处置，则会让下一支商队先为自己寻找担保。"
 hbe.105.a: "按[Concept('hbe_term_contract', '旧约')|e]履行。"
 hbe.105.b: "拨三金，重新核账。"
 hbe.105.c: "先喝茶，账下次算。"

 hbe_assembly: "召开帝国茶会"
 hbe_assembly.desc: "皇帝出资召集诸侯，讨论公共经费与自治。五年可召开一次。"
 hbe_assembly.a: "执行"
 hbe.1.title: "山川之间的盟誓"
 hbe.1.desc: "宋元兵事留下的山城与荒田，至今仍在提醒蜀中诸府：险阻足以守境，却不能独自养民。岷江的水、井灶的盐与山外的马，各有其主，也各有所缺。\n\n诸侯于是依[Concept('hbe_term_isolation', '自治盟约')|e]共立[Concept('hbe_term_alliance', '会盟')|e]，分圈治事，推举皇帝主持盐粮交割与道路修复。敕书所保的是诸府的旧权，盟誓所求的是巴蜀的长治；要使两者相容，仍须有人先付出钱粮。"
 hbe.1.a: "先把本府经营起来。"
 hbe.2.title: "匠师呈来新法"
 hbe.2.desc: "官学的案头终于摆上了新修的图样与簿册。学者考订旧法，匠师以实物反复试验，来自乡里的经验也被写入其中。有人说这些不过是祖辈早已熟悉的技艺，有人却指出，旧事一经厘清，便能传授给更多的人。\n\n[Concept('hbe_term_research', '课题')|e]已经告成，府中可以据此筹办后续事业。真正的考验将发生在渠旁、井下与山道上；成书只是一项新法开始被使用的日子。"
 hbe.2.a: "记入本府账簿。"
 hbe.3.title: "工成而后论功"
 hbe.3.desc: "三年工期已满，掌事者带着领料簿、交接凭据与乡里签押来到府衙。曾经在图上细如一线的渠道和道路，如今已有百姓沿它往来；曾经空着的仓位，也终于能够按册交割。\n\n验收官确认本府完成了所承事业，[Concept('hbe_term_regional', '地区履约')|e]因此有了新的凭据。各家自然都愿将功劳写得长些，然而明年的维护与下一次续办，才会决定这番投入能留下多久。"
 hbe.3.a: "这次确实出了力。"
 hbe.4.title: "府库与会盟"
 hbe.4.desc: "掌簿吏将地方账册与[Concept('hbe_term_alliance', '会盟')|e]来文并排铺开。一册记本府的@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]，一册记诸侯共同维持的@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]；各圈的储备、正在资助的[Concept('hbe_term_research', '地方课题')|e]，以及久未兑付的[Concept('hbe_term_debt', '盐债')|e]，也都有案可查。\n\n领主可以更替，债券与[Concept('hbe_term_contract', '契约')|e]却不会随之消失。若要为后来的执政者留下一份可用的家业，我们须先分清哪些是本府已有的积累，哪些只是向盟友许下的承诺。\n\n#T 账册摘录#!\n本国@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]：[ROOT.GetVariable('hbe_yiqi').GetValue|0] / 100。\n帝国@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]：[GetUniqueInternationalOrganization('hbe_empire').MakeScope.GetVariable('hbe_guoqi').GetValue|0] / 100。\n[Concept('hbe_term_research', '地区研究')|e]通过决议资助，完成计时后自动交付；同一时刻只能研究一项。\n[Concept('hbe_term_isolation', '自治盟约')|e]限制域外宣战与战争召集。百年经营继续开放，[Concept('hbe_term_tianfu', '天府加成')|e]不会到期。"
 hbe.4.a: "账看完了，继续忙。"
 hbe.10.title: "初业之后"
 hbe.10.desc: "[Concept('hbe_term_alliance', '会盟')|e]初立时的主持者已渐渐退居幕后，接替他们的人面对的是逐年增加的凭据与[Concept('hbe_term_contract', '旧约')|e]。前一代愿凭交情相助，后一代却要知道父辈究竟答应了什么。\n\n渠工、盐运和互市不再只是一次试办。诸府开始为长期事业筹措人手，要求[Concept('hbe_term_research', '地方课题')|e]与实际履约相互印证。一份能延续的章程，须比一场成功的议会更经得起岁月。"
 hbe.10.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe.11.title: "旧契的分量"
 hbe.11.desc: "库中[Concept('hbe_term_contract', '旧契')|e]已有纸色泛黄者，契尾的名字也有不少只见于家谱。如今承接田地、井灶与船场的人，既享受前人的便利，也被要求继续负担旧日的费用。\n\n有的府州愿按原约办事，有的则主张重新核定水权、路役与交割。若将所有旧承诺一笔勾销，盟友必有疑虑；若不问情势变化，又会让后来者背上无法承担的义务。"
 hbe.11.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe.12.title: "治所更易"
 hbe.12.desc: "几个府州的治所与辖境已经改变，商路却仍沿旧日的河谷伸展。并入大国的城镇保留着自己的仓场、匠人和水渠，[Concept('hbe_term_contract', '旧契')|e]上也仍认得它们的地名。\n\n[Concept('hbe_term_alliance', '会盟')|e]必须决定如何让这些机构继续运作。新领主可以接掌旧府州的事业，却不能凭一次改名便抹去邻地的权利。地区重组所考验的，是我们治理旧有关系的本领。"
 hbe.12.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe.13.title: "山外的货价"
 hbe.13.desc: "过关的商人带来新的市价：同一篓茶、同一引盐，已经不能换回祖辈记忆中的货物。道路未必改变，沿途的需求、损耗与采购条件却时时不同。\n\n诸府必须重新估量[Concept('hbe_term_service', '公共事业')|e]的用途。山外局势纵然纷扰，[Concept('hbe_term_isolation', '自治盟约')|e]仍维持着[Concept('hbe_term_alliance', '会盟')|e]的边界；在其庇护之内，我们也不能把旧账上的价格当作永远不变的天数。"
 hbe.13.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe.14.title: "百年之约"
 hbe.14.desc: "初盟之年的乡人，早已成为家祠中受祭的先辈。渠水依旧入田，井灶仍冒白烟，但主持这些事业的人已换过数代。如今诸府要为这百年的积累重新定名、定责。\n\n[Concept('hbe_term_charter', '百年章程')|e]的验收将检视[Concept('hbe_term_research', '地方课题')|e]与持续交付，而非只看文书上有多少颂辞。若后人仍能借这些机构取水、通商、赈饥，我们今日的签押便有了超出一代人的意义。"
 hbe.14.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe.5.title: "会盟茶议"
 hbe.5.desc: "茶盏沿长案依次摆开，来自平原、江岸与山谷的使者将各自文书交给书记。此次议事既有修渠护运的请款，也有圈际费用的争论；每一项看似微小的差额，背后都牵着一处府库或一季收成。\n\n作为主持者，皇帝可以先以@hbe_guoqi! [Concept('hbe_term_guoqi', '共同信用')|e]承担开支，换取诸府的信任；也可以要求各家多尽一份义务。茶汤尚温，众人却已望向案上的账册，等待我们表明立场。"
 hbe.5.a: "[Concept('hbe_term_service', '公共事业')|e]，皇帝[Concept('hbe_term_pledge', '先认账')|e]。"
 hbe.5.b: "各位也该分担一点。"

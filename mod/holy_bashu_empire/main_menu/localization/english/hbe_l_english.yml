 hbe_banquet.3.title: "凭据与实物"
 hbe_banquet.3.desc: "验收人员回到府衙，随行者带着出库记录、沿途交接与实物清单。纸上所载的数量终于能够与仓场或关驿相互对照，本府承办的[Concept('hbe_term_delivery', '专业交付')|e]已获确认。\n\n[Concept('hbe_term_contribution', '个人履约')|e]由此留下新的记录，然而一段工作完成，还不等于整项事业告成。邻圈仍须交付各自所承的环节，最后的共同收益要待[Concept('hbe_term_round', '本届分账会')|e]结清之后，才能落实到参与者的田地与作坊。"
 hbe_banquet.3.a: "把货与签押一起收好。"
 hbe_banquet.4.title: "同流而至"
 hbe_banquet.4.desc: "各处的交割凭据已送到[Concept('hbe_term_alliance', '会盟')|e]，所需环节无一缺失。货物抵达仓场，费用也能沿凭据追溯到出资者；沿途曾有争论，如今至少都落在可以核验的文书上。\n\n本届事业因此获准结算。参与出资和实际交付的诸府，将获得一段时期的地方经营收益。对于未曾承办的成员，旧有自治与席位仍然保留；这次成功也许会使他们在下一届更愿意与我们共事。"
 hbe_banquet.4.a: "这一届，总算没白忙。"
 hbe_banquet.5.title: "未能结清"
 hbe_banquet.5.desc: "分账期限已到，书记却仍在等候缺失的交割凭据。有的环节迟迟没有到场，有的争端则使已经完成的工作无法共同验收。案上的总数看似齐整，真正能够交付的事业却还差一程。\n\n本届不能列为[Concept('hbe_term_success', '成功工程')|e]。@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]将因共同承诺落空而受损，@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]也随之上升。已履约者仍保有自己的记录，[Concept('hbe_term_isolation', '自治盟约')|e]同样有效；下届重开账时，各府却会比从前更仔细地询问担保是谁。"
 hbe_banquet.5.a: "下届重开账，不撕敕书。"
 hbe_banquet.6.title: "签押未兑"
 hbe_banquet.6.desc: "届中核账的使者已经抵达，国库却无法拿出先前承诺的四金。库吏解释了近来的支出，契尾那枚属于我们的印信却仍清晰可辨，无法随解释一并抹去。\n\n[Concept('hbe_term_alliance', '会盟')|e]不会因此强行取尽本府的钱粮，但这份承诺不能算作履约。盟友对我们的@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]将有所疑虑，@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]也会增加。今后若能以真实出资或货物交付重新取信，今日的缺失才可能被后来的一册账所弥补。"
 hbe_banquet.6.a: "欠的不是一张签名。"
 hbe_project_subsidize: "[Concept('hbe_term_subsidy', '皇帝垫账')|e]：补一项缺口"
 hbe_project_subsidize.desc: "支付十金聘请本地机构补交一个缺失环节。本届限一次；优先补第一项，再补第二、第三项。"
 hbe_project_subsidize.a: "执行"
 hbe_audit_accounts: "[Concept('hbe_term_audit', '公开公账')|e]：[Concept('hbe_term_audit', '三金核账')|e]"
 hbe_audit_accounts.desc: "支付三金，降低四点@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]并增加二点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]；两年可核账一次。"
 hbe_audit_accounts.a: "执行"
 hbe_banquet_ledger: "查看大开席账本"
 hbe_banquet_ledger.desc: "查看立场、本届交付、@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]、长期章程和[Concept('hbe_term_contribution', '个人履约')|e]。"
 hbe_banquet_ledger.a: "执行"
 hbe_banquet.7.title: "会盟总册"
 hbe_banquet.7.desc: "总册以府州为目，以届次为次，逐项记载参与者的立场、交付和未竟之事。墨迹新旧不一，数代书记却一直沿用同样的编排，使后来者能够查到前人的签押。\n\n我们今日看到的既是账目，也是彼此权利与责任的积累。[Concept('hbe_term_contribution', '个人履约')|e]说明本府曾做过什么，[Concept('hbe_term_success', '共同项目')|e]则决定[Concept('hbe_term_charter', '百年章程')|e]何时可以议决；一项未获承认的功绩，还须有实物和见证为它补上最后一笔。\n\n#T 账册摘录#!\n本国立场：[ROOT.GetVariable('hbe_stance').GetValue|0]（1 [Concept('hbe_term_common', '共锅')|e]、2 [Concept('hbe_term_divided', '分锅')|e]、3 账房）。[Concept('hbe_term_contribution', '个人履约')|e]：[ROOT.GetVariable('hbe_contribution').GetValue|0]。\n阶段：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_chapter').GetValue|0] / 5。@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_dispute').GetValue|0] / 100。\n届次：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_round').GetValue|0]；本届月份：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_round_month').GetValue|0] / 36。\n主工程：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_project_kind').GetValue|0]（1 [Concept('hbe_term_saltproject', '盐船共账')|e]、2 [Concept('hbe_term_teaproject', '茶马过蜀道')|e]）。三项交付：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_role_1').GetValue|0] / [GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_role_2').GetValue|0] / [GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_role_3').GetValue|0]。\n[Concept('hbe_term_success', '成功工程')|e]：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_completed_projects').GetValue|0]。章程：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_charter').GetValue|0]（0 未定、1 [Concept('hbe_term_common', '共锅')|e]、2 [Concept('hbe_term_divided', '分锅')|e]、3 账房）。\n[Concept('hbe_term_charter', '百年章程')|e]至少在1437年、[Concept('hbe_term_chapter', '第五阶段')|e]与三十次[Concept('hbe_term_success', '成功工程')|e]后提案，由[Concept('hbe_term_circle', '七圈')|e]授权表决。合并诸侯后，原府州首府仍构成[Concept('hbe_term_seat', '固定代表席位')|e]。"
 hbe_banquet.7.a: "账看完了，继续忙。"
 hbe_banquet.12.title: "分摊之议"
 hbe_banquet.12.desc: "早期事业已有数次交付，诸侯开始发现，临时募款不能长久支撑沿江与山道上的开支。受益较多的府州主张按货量分担，地处上游和关口者则要求计入维护之劳。\n\n第一代主持者曾以交情化解的差额，如今成为公账上的正式争议。@hbe_salt! [Concept('hbe_term_salt', '盐引信用')|e]、@hbe_river! [Concept('hbe_term_river', '江运互保')|e]与各地的新法正在改变交割方式。[Concept('hbe_term_alliance', '会盟')|e]若要继续前行，就须把这些经验写成后来者也能遵循的约定。"
 hbe_banquet.12.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe_banquet.13.title: "故治与新主"
 hbe_banquet.13.desc: "一些旧府州已被整合，原有治所却仍是仓廒、渠工和交割的所在。新领主带着更大的疆域来到[Concept('hbe_term_alliance', '会盟')|e]，旧日机构的掌事者则要求继续依原约分配水权与路役。\n\n诸侯决定仍以原首府维持[Concept('hbe_term_seat', '固定代表席位')|e]，使一次合并不会抹去地方，一次分封也不会凭空增加授权。能够接掌旧治的人，还须接掌它留下的责任。此后，版图上的一处归属将同时牵动几份[Concept('hbe_term_contract', '旧契')|e]。"
 hbe_banquet.13.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe_banquet.14.title: "公治之争"
 hbe_banquet.14.desc: "多年事业使[Concept('hbe_term_alliance', '会盟')|e]有了自己的仓场、簿册与办事人员，诸府对它的期望也逐渐分歧。有人希望皇帝统一筹办公共财政，有人认为圈内议事足以自理，还有人只愿承认能够核验的[Concept('hbe_term_contract', '契约')|e]。\n\n争论并非起于一张文书。井灶的收入、渠田的水权与关驿的轮役，都在决定各地愿交出多少权力。下一代章程尚未成文，各派已经在今日的[Concept('hbe_term_success', '共同项目')|e]中展示自己的治事办法。"
 hbe_banquet.14.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe_banquet.15.title: "长约待议"
 hbe_banquet.15.desc: "最早的盟誓已在各府家谱中留下记载，许多后来者却只熟悉眼前的交割。经过数代延续，[Concept('hbe_term_circle', '七圈')|e]事业已积累到足以重审总约的地步；旧制所能涵盖的情形，也渐渐显得不足。\n\n[Concept('hbe_term_charter', '百年章程')|e]将等待约定的年限与足够的[Concept('hbe_term_success', '成功工程')|e]，再由各圈授权。它不能仅凭一位皇帝的意愿成立。诸府须向那些承担渠工、路役与互市的人说明，为何今日的新约值得他们继续遵守。"
 hbe_banquet.15.a: "[Concept('hbe_term_contract', '旧约')|e]重认，事业续办。"
 hbe_propose_charter_1: "[Concept('hbe_term_charter', '百年章程')|e]：[Concept('hbe_term_charter_common', '一锅巴蜀')|e]"
 hbe_propose_charter_1.desc: "皇帝出五金、消耗二十@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]，开启六个月授权表决。每圈须有超过半数原府州席位赞成，[Concept('hbe_term_circle', '七圈')|e]至少四圈支持。原三十六首府的当前帝国成员领主行使席位，释放小国不增加席位。失败后五年才能重提。"
 hbe_propose_charter_1.a: "执行"
 hbe_ballot_vote_1: "章程授权：支持[Concept('hbe_term_charter_common', '一锅巴蜀')|e]"
 hbe_ballot_vote_1.desc: "明确支持这一份章程，替代本国上次表态；六个月议决期间可调整。本国拥有多个原首府时一并行使这些[Concept('hbe_term_seat', '固定席位')|e]。"
 hbe_ballot_vote_1.a: "执行"
 hbe_propose_charter_2: "[Concept('hbe_term_charter', '百年章程')|e]：[Concept('hbe_term_charter_divided', '万国茶会')|e]"
 hbe_propose_charter_2.desc: "皇帝出五金、消耗二十@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]，开启六个月授权表决。每圈须有超过半数原府州席位赞成，[Concept('hbe_term_circle', '七圈')|e]至少四圈支持。原三十六首府的当前帝国成员领主行使席位，释放小国不增加席位。失败后五年才能重提。"
 hbe_propose_charter_2.a: "执行"
 hbe_ballot_vote_2: "章程授权：支持[Concept('hbe_term_charter_divided', '万国茶会')|e]"
 hbe_ballot_vote_2.desc: "明确支持这一份章程，替代本国上次表态；六个月议决期间可调整。本国拥有多个原首府时一并行使这些[Concept('hbe_term_seat', '固定席位')|e]。"
 hbe_ballot_vote_2.a: "执行"
 hbe_propose_charter_3: "[Concept('hbe_term_charter', '百年章程')|e]：[Concept('hbe_term_charter_contract', '各吃各的，账照样交')|e]"
 hbe_propose_charter_3.desc: "皇帝出五金、消耗二十@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]，开启六个月授权表决。每圈须有超过半数原府州席位赞成，[Concept('hbe_term_circle', '七圈')|e]至少四圈支持。原三十六首府的当前帝国成员领主行使席位，释放小国不增加席位。失败后五年才能重提。"
 hbe_propose_charter_3.a: "执行"
 hbe_ballot_vote_3: "章程授权：支持[Concept('hbe_term_charter_contract', '各吃各的，账照样交')|e]"
 hbe_ballot_vote_3.desc: "明确支持这一份章程，替代本国上次表态；六个月议决期间可调整。本国拥有多个原首府时一并行使这些[Concept('hbe_term_seat', '固定席位')|e]。"
 hbe_ballot_vote_3.a: "执行"
 hbe_banquet.20.title: "章程呈议"
 hbe_banquet.20.desc: "皇帝的提案连同历届交付记录送至本府。使者没有催促立即落印，而是请我们核对本府所掌旧首府的代表席位，确认此议是否符合各处机构与居民的利益。\n\n依[Concept('hbe_term_charter', '百年章程')|e]的议决办法，一圈须有过半原席位赞成才能授权，[Concept('hbe_term_circle', '七圈')|e]至少四圈支持方可成约。议期为六个月，我们可以接受当前文本，也可保留[Concept('hbe_term_contract', '旧约')|e]、要求修订。今日的一次表态，将影响此后很长一段岁月的公治。"
 hbe_banquet.20.a: "同意本次提案。"
 hbe_banquet.20.b: "现约先留着，提案再改改。"
 hbe_banquet.21.title: "新约成文"
 hbe_banquet.21.desc: "各圈的印信终于聚齐，书记将授权文书逐页核对，交由主持者正式颁行。[Concept('hbe_term_charter', '百年章程')|e]由此成为诸府共同认可的规矩，旧日临时安排也有了可以追溯的依据。\n\n获准的章程将按公治、地方自治或[Concept('hbe_term_contract', '契约')|e]治理之法，给予境内事业相应收益。渠工仍要岁修，仓场仍要交割，下一届[Concept('hbe_term_round', '分账会')|e]也不会因此停办。新约为这些劳作定下长久的责任，而它的成效仍须由后来人证明。"
 hbe_banquet.21.a: "锅底换了，账还要记。"
 hbe_banquet.22.title: "议而未定"
 hbe_banquet.22.desc: "归来的使者带回几圈同意的印信，也带回另几圈要求修订的条款。各方并未否认[Concept('hbe_term_alliance', '会盟')|e]本身，却无法就谁主持财政、如何维护地方权利达成足够的授权。\n\n本次提案因此不能成约，旧制继续施行。已经完成的工程和[Concept('hbe_term_contribution', '个人履约')|e]仍记在册中，@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]则因议事未决有所增加。五年之后可以再次呈议；在此之前，我们或许应先以实际事业说明这份章程将如何治事。"
 hbe_banquet.22.a: "皇帝可以提案，不能替圈盖章。"
 hbe_banquet.23.title: "盟中争议"
 hbe_banquet.23.desc: "[Concept('hbe_term_alliance', '会盟')|e]收到的诉状已不再只关乎一批盐货或一次轮役。诸府开始质疑彼此的主持权，旧欠款、交割差额与地方权利被并列写入申诉，@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]已使共同结算难以顺利进行。\n\n有人请公开簿册，以钱粮支持逐项核验；有人愿用积累的@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]担保调停。我们也可以坚持由本府自行处置，但盟友未必会因此重新相信我们的承诺。山外的[Concept('hbe_term_isolation', '自治盟约')|e]仍在，境内的和睦却只能由诸府自己维持。"
 hbe_banquet.23.a: "出五金，公开账簿。"
 hbe_banquet.23.b: "以@hbe_guoqi! [Concept('hbe_term_guoqi', '共同信用')|e]担保调停。"
 hbe_banquet.23.c: "本府自理，先保留意见。"
 hbe_banquet.100.title: "上下游之诉"
 hbe_banquet.100.desc: "新修的水口开始蓄水，上游乡里称此举能保后来的灌溉，下游使者却带着干田的记录来到府衙。两方都援引旧券，也都认为自己依约出了渠工。\n\n[Concept('hbe_history_dujiangyan', '都江堰')|e]的水利向来牵动平原众田，今日的争执亦不能只由一府判定。若派员核验实际水量，便有望重新分定水权；若只维护本府眼前的便利，下一次枯水时节便难再求邻地相助。"
 hbe_banquet.100.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.100.b: "以成熟地方技术公开凭据。"
 hbe_banquet.100.c: "先顾本府，另开一本账。"
 hbe_banquet.101.title: "官学与诸府"
 hbe_banquet.101.desc: "成都的官学拟将各府承担的公款与渠工编成总图，以便新任官吏查阅。绘图者习惯以本城为中心，远处山门和江岸的费用却只作简注，送来的图样因此遭到几府质疑。\n\n[Concept('hbe_history_wenweng', '文翁石室')|e]的旧学使成都享有文教之名，却不能免去治事所需的细察。诸侯要求将地方凭据与实际出资一并载入，使图册能用于分摊，而不只是陈列于学宫。"
 hbe_banquet.101.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.101.b: "以成熟地方技术公开凭据。"
 hbe_banquet.101.c: "先顾本府，另开一本账。"
 hbe_banquet.102.title: "堰上岁修"
 hbe_banquet.102.desc: "堰上掌事者呈报，旧有竹木构件需要更换，部分水道也应及时疏浚。受水各府都承认修治不可拖延，却各自请他府多出一些人手，理由是自家去年已经承担甚重。\n\n[Concept('hbe_history_dujiangyan', '都江堰')|e]之所以历代可用，正在于疏浚与维护不断延续。现有@hbe_water! [Concept('hbe_term_water', '水权储备')|e]或成熟的渠工之法可以帮助核定责任，然而田中将要播下的种子，终究不能等到诸侯把每一项旧功都论清。"
 hbe_banquet.102.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.102.b: "以成熟地方技术公开凭据。"
 hbe_banquet.102.c: "先顾本府，另开一本账。"
 hbe_banquet.103.title: "盐利与公款"
 hbe_banquet.103.desc: "川南的盐商愿为共同事业垫付一笔费用，但送来的承销文书附着数项担保。府库所记的是眼下的采办，商人所求的却是日后可由[Concept('hbe_term_alliance', '会盟')|e]共同承认的债权。\n\n井灶产出的盐是实物，@hbe_salt! [Concept('hbe_term_salt', '盐引信用')|e]则取决于诸方是否愿认同一份凭据。我们可以付费重核担保，也可用成熟的盐政簿册厘清责任；若只接受眼前的钱粮，后来索偿时便难再称这些条款无人知晓。"
 hbe_banquet.103.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.103.b: "以成熟地方技术公开凭据。"
 hbe_banquet.103.c: "先顾本府，另开一本账。"
 hbe_banquet.104.title: "引券重押"
 hbe_banquet.104.desc: "账房发现，同一批尚待出库的盐货被记入了几份承销凭据。经手者辩称，旧债与新款本可互相抵销，灶户却指出，井下的卤水并不会因簿册增厚而多出一担。\n\n[Concept('hbe_history_salt', '卓筒井')|e]之法与井灶技艺可以增加产盐的能力，不能代替实际交割。若今日准许一货多押，@hbe_salt! [Concept('hbe_term_salt', '盐引信用')|e]将比账上所见更为脆弱；逐项核验虽费钱粮，却能使承销者与债主知道各自真正拥有何物。"
 hbe_banquet.104.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.104.b: "以成熟地方技术公开凭据。"
 hbe_banquet.104.c: "先顾本府，另开一本账。"
 hbe_banquet.105.title: "灶户旧欠"
 hbe_banquet.105.desc: "一户灶主的孙辈收到旧年工程的偿款文书，债尾仍写着祖父的名字。家中井灶几经转手，承运者与担保人也换过数次，府库却继续把这笔费用记作原户未偿。\n\n继承事业应承担哪些[Concept('hbe_term_contract', '旧责')|e]，成为盐商与灶户争论的要点。成熟的盐政记录或许能够追明转让经过，拨款调查也可另找见证。若只要求后人照旧偿付，今后肯为共同事业担保的井主就会少些。"
 hbe_banquet.105.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.105.b: "以成熟地方技术公开凭据。"
 hbe_banquet.105.c: "先顾本府，另开一本账。"
 hbe_banquet.106.title: "江岸的分担"
 hbe_banquet.106.desc: "川东使者提出，公款应更多用于忙碌的码头与转仓，而非依沿江各府的旧名望分派。上游府州认为自己承担水程的起点之劳，下游承运者则以到货数量为据，要求重定额度。\n\n[Concept('hbe_history_river', '川江')|e]险急，货物须在不同岸段接力，任何一处的功劳都难独计。我们若愿查验运力与凭据，可以使@hbe_river! [Concept('hbe_term_river', '江运互保')|e]更合实际；若只按本府的位置主张优先，沿江的合作便又多一层疑虑。"
 hbe_banquet.106.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.106.b: "以成熟地方技术公开凭据。"
 hbe_banquet.106.c: "先顾本府，另开一本账。"
 hbe_banquet.107.title: "过滩之费"
 hbe_banquet.107.desc: "一条盐船经过几处险滩，船主带回的收费凭据却比护送次数还多。沿岸机构各称自己维护过航道，水手则说，有的关卡除了验印，并未派人相助。\n\n[Concept('hbe_history_river', '川江')|e]的明滩暗礁本就增加运输损耗，重复收费更会使盐货难以按约抵达。@hbe_river! [Concept('hbe_term_river', '江运互保')|e]应当承认真正的护航，也须辨清仅凭地界索取的费用。公开核验或用成熟的交割记录，都将触及沿岸既得的收入。"
 hbe_banquet.107.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.107.b: "以成熟地方技术公开凭据。"
 hbe_banquet.107.c: "先顾本府，另开一本账。"
 hbe_banquet.108.title: "新主与船牌"
 hbe_banquet.108.desc: "码头已经归属新的领主，旧船牌却仍沿用原府州的印记。巡察人员将一批船只拦在岸边，要求它们重新取得本府许可，船主则出示仍在有效期内的[Concept('hbe_term_contract', '共同合同')|e]。\n\n地方权柄可以更易，[Concept('hbe_history_river', '川江')|e]的交割却不能每次都从头议定。若承认尚在[Concept('hbe_term_alliance', '会盟')|e]内的旧凭据，须辨清它们所保的货物与期限；若将其一概废止，本府也许能增加一次收入，却会损伤往后的互信。"
 hbe_banquet.108.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.108.b: "以成熟地方技术公开凭据。"
 hbe_banquet.108.c: "先顾本府，另开一本账。"
 hbe_banquet.109.title: "轮役的免书"
 hbe_banquet.109.desc: "关驿将下一轮守备名单送到各府，回来的却多是请求豁免的旧书。某家援引前人的战功，某家声称已代修一段道路，还有一府只愿出粮不愿出人。\n\n[Concept('hbe_history_shudao', '蜀道')|e]上的往来仍须有人护持，[Concept('hbe_history_jianmen', '剑门关')|e]的险要也不能替缺额的兵役值守。我们可以核定哪些旧功足以抵役，也可要求各家按[Concept('hbe_term_contract', '共同合同')|e]分担；若让所有免书都算数，守关之责便只会落到少数肯履约的人身上。"
 hbe_banquet.109.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.109.b: "以成熟地方技术公开凭据。"
 hbe_banquet.109.c: "先顾本府，另开一本账。"
 hbe_banquet.110.title: "驿簿虚数"
 hbe_banquet.110.desc: "公账所载的驿马数量颇为充足，查验者沿路却发现，几个站点只能凑出少数疲马。驿吏解释旧马尚未销籍，故仍列入簿册，领款时却未曾作同样的区分。\n\n[Concept('hbe_history_shudao', '蜀道')|e]险长，误报会使接力与采办一并失期。路政[Concept('hbe_term_research', '课题')|e]留下的勘查办法能够帮助追明各段实情，拨款复核亦可寻访经手者。我们须在驿路真正断绝之前，确定账上所列的究竟是可用人马，还是早已过去的一年。"
 hbe_banquet.110.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.110.b: "以成熟地方技术公开凭据。"
 hbe_banquet.110.c: "先顾本府，另开一本账。"
 hbe_banquet.111.title: "关印与守备"
 hbe_banquet.111.desc: "新任掌事者请求邻府出借一枚关印，用以完成本届轮值的签押。邻府愿使公事顺利，却坚持先看到实际守备与交接记录，不能仅凭印信证明关隘有人。\n\n[Concept('hbe_history_jianmen', '剑门关')|e]历来是[Concept('hbe_history_shudao', '蜀道')|e]上的要地，它的名望使一枚关印颇有分量。借印若只为补齐缺页，或可通融；若用来掩盖未曾履行的轮戍，诸府将再难相信此后送来的同类凭据。"
 hbe_banquet.111.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.111.b: "以成熟地方技术公开凭据。"
 hbe_banquet.111.c: "先顾本府，另开一本账。"
 hbe_banquet.112.title: "赈粮名册"
 hbe_banquet.112.desc: "赈粮名册送到府中，掌簿者发现排在前列的几户与仓吏颇有亲缘。仓吏称他们最易查验身份，受灾较重的乡里却指出，有些远村因无人引见而一直未获入册。\n\n@hbe_grain! [Concept('hbe_term_grain', '义仓储备')|e]既由众乡共同积累，其用途便不能只依熟识者安排。按受灾与存粮重新核定，可能触动地方人情；维持现有次序则虽省去眼下的争执，也会使真正缺粮者对共同事业失去信任。"
 hbe_banquet.112.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.112.b: "以成熟地方技术公开凭据。"
 hbe_banquet.112.c: "先顾本府，另开一本账。"
 hbe_banquet.113.title: "界田旧契"
 hbe_banquet.113.desc: "两府争议的一片界田，已经引出数代人的[Concept('hbe_term_contract', '契书')|e]。最初的灌溉约定、后来转让的田亩，以及曾用于抵债的一季收成都被摆到案上，各方均能指出对自己有利的一条。\n\n若只凭最后一枚印断案，便可能损害早年的受水权；若不作裁决，耕作者也不知该向何处纳粮。地方[Concept('hbe_term_contract', '契约')|e]之学与实际见证，正可用于把这些层叠的权利分开核对。"
 hbe_banquet.113.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.113.b: "以成熟地方技术公开凭据。"
 hbe_banquet.113.c: "先顾本府，另开一本账。"
 hbe_banquet.114.title: "丰年修仓"
 hbe_banquet.114.desc: "本圈年成颇好，谷价也渐趋平稳。乡人因此不愿再出粮修补仓廒，认为眼下无饥可赈，府库应将钱粮用于更急的事务。仓吏却呈报，受潮与虫耗已经侵及一部分存粮。\n\n@hbe_grain! [Concept('hbe_term_grain', '义仓储备')|e]若只在歉岁受到重视，往往已来不及补足损失。成熟的粮政记录可以说明维护所费与预备之用，也可付费重核仓况。我们是否愿在丰年承担看似无益的开支，将影响下一次灾年能够援助多少人。"
 hbe_banquet.114.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.114.b: "以成熟地方技术公开凭据。"
 hbe_banquet.114.c: "先顾本府，另开一本账。"
 hbe_banquet.115.title: "沿途验引"
 hbe_banquet.115.desc: "采办的茶货价格并无大变，商队带回的沿途费用却增加了数项。各处山门都要求验引、查量，所用尺度与收费名目又彼此不同，原定的茶马采办因此难以按额完成。\n\n[Concept('hbe_history_tea', '雅州茶马司')|e]的旧制曾使互市有了统一管理，今日的交割同样需要各方认可的办法。我们可以重核沿路费用，也可用成熟的商队凭据求得协调；单将不足推给最后一位承运人，终究只能解决一册账上的问题。"
 hbe_banquet.115.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.115.b: "以成熟地方技术公开凭据。"
 hbe_banquet.115.c: "先顾本府，另开一本账。"
 hbe_banquet.116.title: "山程损耗"
 hbe_banquet.116.desc: "商队已经越过山口，采办与运输两方却在争论途中多出的费用。前者认为货物已交出，后者指出原定预算没有计入绕道与临时安置，双方都将自己的一段经历视作全程的依据。\n\n茶马互市不能只算货价，也须容纳真正发生的运输损耗。@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]与成熟的交割簿册可以提供核验办法；若本府只求卸去眼下的差额，下次愿意接运货物的人便会先要求更重的担保。"
 hbe_banquet.116.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.116.b: "以成熟地方技术公开凭据。"
 hbe_banquet.116.c: "先顾本府，另开一本账。"
 hbe_banquet.117.title: "调停之所"
 hbe_banquet.117.desc: "两位领主都曾出资维护同一处山门，此次争端便各自要求由自己熟识的主持者居中评议。当地议事者担心，若裁决被看作一府的家事，往后便无人再信其调停。\n\n山门的公信来自长期见证，而非一回赠与。我们可以用[Concept('hbe_term_contract', '共同合同')|e]划清资助与裁断的关系，也可另寻双方认可的人核验。任何安排若只顾眼前的体面，都可能损伤这处机构积累多年的用处。"
 hbe_banquet.117.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.117.b: "以成熟地方技术公开凭据。"
 hbe_banquet.117.c: "先顾本府，另开一本账。"
 hbe_banquet.118.title: "约文的两种解读"
 hbe_banquet.118.desc: "府城送往谷中的共治条款，在两份译录里有了不同的意思。一份强调轮值商谈，一份却被理解为固定征收；文书中的数量相同，居民愿意承认的责任却相差甚远。\n\n若未经当地见证便照府城的理解执行，@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]将失去根基。派员与长者逐条核验，或以已有的议约经验重新说明，都须付出人手。真正可行的约定，应使签押两端的人知道自己答应了什么。"
 hbe_banquet.118.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.118.b: "以成熟地方技术公开凭据。"
 hbe_banquet.118.c: "先顾本府，另开一本账。"
 hbe_banquet.119.title: "互市的尺度"
 hbe_banquet.119.desc: "谷口互市仍有人以谷物、布匹与牲畜换取盐茶，府城的账房则要求按同一尺度记录交割。统一凭据有助于核账，却未必能够直接涵盖乡里沿用的每一种交换。\n\n@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]的经验正在两种规矩之间接受检验。若登记换算并寻找双方认可的见证，旧习与[Concept('hbe_term_contract', '共同合同')|e]或能并存；若只命商人照新册填写，账上的齐整未必意味着市中也能照常买卖。"
 hbe_banquet.119.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.119.b: "以成熟地方技术公开凭据。"
 hbe_banquet.119.c: "先顾本府，另开一本账。"
 hbe_banquet.120.title: "共用的山路"
 hbe_banquet.120.desc: "新任掌事者请按地图登记沿途路权，几处山谷居民却带来了早于现有图册的共同通行约。路上桥栈是谁修过、风雪时由谁接应，纸上并未一一记载。\n\n道路的用途原由行旅与维护共同形成。我们可以依据@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]核定[Concept('hbe_term_contract', '旧约')|e]，也可拨款重新寻访见证；若一概按府城的新图收取费用，沿途居民将更难相信共同事业会尊重他们已经付出的劳作。"
 hbe_banquet.120.a: "按[Concept('hbe_term_contract', '共同合同')|e]处理，拨二金核验。"
 hbe_banquet.120.b: "以成熟地方技术公开凭据。"
 hbe_banquet.120.c: "先顾本府，另开一本账。"
 hbe_banquet.200.title: "锦城的公治"
 hbe_banquet.200.desc: "[Concept('hbe_history_shujin', '蜀锦')|e]之名使成都在诸府之间享有声望，城中官学与作坊也确实汇聚了许多能够掌事的人。府臣因此请将首届主持的若干职责留在本城，作为长期公治的根基。\n\n邻府承认成都的便利，却要求一切主持权都附有可验收的责任。我们可以先以出资和履约说明本府足以承担此任，也可以坚持旧有声望已经足够。今日的选择，将影响盟友如何看待锦城此后的倡议。"
 hbe_banquet.200.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.200.b: "守旧例，暂不承诺共担。"
 hbe_banquet.201.title: "汉州水口"
 hbe_banquet.201.desc: "渠吏送来本府各处水口的查验记录，请将共同签押与实际到水一并核对。沿渠乡人担心，若只认可案上的印信，旱时的先后顺序仍会由少数上游田主决定。\n\n[Concept('hbe_history_dujiangyan', '都江堰')|e]水系所维系的利益远超一地，汉州的凭据也须能经邻府查验。付费试办一套实量与签押相合的办法，或许能够积累@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]；守住现有旧例，则可免去一时的支出与地方阻力。"
 hbe_banquet.201.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.201.b: "守旧例，暂不承诺共担。"
 hbe_banquet.202.title: "彭州山门"
 hbe_banquet.202.desc: "山门商路的掌事者请求本府在共同议事中呈报沿途所费。他们说，平原田亩虽易丈量，翻山接运与雨雪时的维护却不能只按土地多少分摊。\n\n彭州既与平原诸府往来，也须回应山中行旅的要求。若出资把这些费用写成可验收的[Concept('hbe_term_contract', '契约')|e]，便能为以后争取认可；若继续只依旧例办事，本府虽少了一项试办之费，山门的疑虑却仍会留待下一届。"
 hbe_banquet.202.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.202.b: "守旧例，暂不承诺共担。"
 hbe_banquet.203.title: "邛州窑火"
 hbe_banquet.203.desc: "邛州的工匠呈来一批新制器物，并请求将领料、烧造与交付分册记录。乡人说起[Concept('hbe_history_qiong', '邛窑')|e]旧法，尤其推重[Concept('hbe_history_qiong', '省油灯')|e]的巧思，认为善制之名应有真正的技艺作凭。\n\n本府若愿[Concept('hbe_term_trial', '资助试办')|e]，便可把匠人的经验纳入[Concept('hbe_term_contract', '共同契约')|e]，使交付不再只凭经手者一句保证。若守旧例，作坊仍能自行经营，邻府却未必愿以同样的信用承认我们送去的器物。"
 hbe_banquet.203.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.203.b: "守旧例，暂不承诺共担。"
 hbe_banquet.204.title: "眉州议疏"
 hbe_banquet.204.desc: "眉州士人援引[Concept('hbe_history_sansu', '三苏')|e]论事之风，为本府撰成一篇议疏，详论共同事业与地方旧权。文辞颇受赞许，书记却请他们另列一份清楚的出资与验收办法，方能交由诸府议定。\n\n文章可以使一项主张传得更远，具体的责任仍须落到府库与乡里。我们若愿[Concept('hbe_term_trial', '出资试办')|e]，议疏便能随实绩一同流传；若只以文名维护旧例，盟友所见的也许终究只是一篇漂亮的文章。"
 hbe_banquet.204.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.204.b: "守旧例，暂不承诺共担。"
 hbe_banquet.205.title: "嘉定的见证"
 hbe_banquet.205.desc: "嘉定的山门与乡里常受请托，为邻地争端出面见证。如今有人希望先取得本府的签押，再补写具体的责任；掌事者却担心，一次空泛的认可会损伤往后调停的公信。\n\n本府可以[Concept('hbe_term_trial', '出资试办')|e]，以实际调查与[Concept('hbe_term_contract', '契约')|e]记录维护见证之名；也可依旧例，将签押视作彼此熟识的便利。对于需要过河、采办与托运的人，一份能够查验的凭据往往比含糊的保证更有分量。"
 hbe_banquet.205.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.205.b: "守旧例，暂不承诺共担。"
 hbe_banquet.206.title: "叙州盐券"
 hbe_banquet.206.desc: "本府的盐商请将承销担保与共同采办一并登记，说明每一份盐引究竟由何人认账。府臣看见可得的盐利，灶户却先问，若承运失期，井主是否也须替沿江的差额负责。\n\n叙州可以用一次[Concept('hbe_term_trial', '出资试办')|e]把责任划得更明，使@hbe_salt! [Concept('hbe_term_salt', '盐引信用')|e]建立在实际交割之上；若维持既有惯例，眼下的交易仍可进行，尚未说清的担保却会随着货物送到更远的地方。"
 hbe_banquet.206.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.206.b: "守旧例，暂不承诺共担。"
 hbe_banquet.207.title: "泸州采办"
 hbe_banquet.207.desc: "共同采办送来的酒坛已经抵达，掌事者提议逐批查验成色与数量。酒户愿意保证所交之物，却要求验收不得无限拖延，否则本府既取其货，又迟迟不认其账。\n\n泸州的试办可以为采办定下明确期限与见证，使府库、商人与邻地都知何时算作交付。出资建立这套[Concept('hbe_term_contract', '契约')|e]将留下[Concept('hbe_term_contribution', '履约记录')|e]；仍依熟人之间的旧例，则免去眼前开支，也保留了旧争端发生的余地。"
 hbe_banquet.207.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.207.b: "守旧例，暂不承诺共担。"
 hbe_banquet.208.title: "长宁竹契"
 hbe_banquet.208.desc: "长宁的掌事者请以竹材制作耐用的交割记号，随货一并送往转仓之处。沿途纸券常因潮湿难辨，收货人既怕误认，也不愿只听承运者口述数目。\n\n这项办法属于本府拟办的新约，须以实物、印记和书记记录相互核对。若愿[Concept('hbe_term_trial', '出资试行')|e]，便可让邻府看到可验收的改进；若维持旧制，本府无需另备费用，行旅却仍要承担凭据受损的疑虑。"
 hbe_banquet.208.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.208.b: "守旧例，暂不承诺共担。"
 hbe_banquet.209.title: "昌州刻券"
 hbe_banquet.209.desc: "本府的出资承诺已被刻在石上，乡人称它比纸契更能流传。账房却指出，钱粮的用途与承担者仍须随实际交割查验，坚固的刻石并不会自动使一次承诺完成。\n\n昌州可以[Concept('hbe_term_trial', '资助试办')|e]，把碑记与可追溯的簿册相互印证；也可将旧有题记视作足够的保证。前者要花费眼下的钱粮，后者则将信任更多地寄托于后来者是否愿继续解释石上所记的责任。"
 hbe_banquet.209.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.209.b: "守旧例，暂不承诺共担。"
 hbe_banquet.210.title: "山城转仓"
 hbe_banquet.210.desc: "重庆的码头与仓场之间须循坡路搬运，商人请在共同预算中计入这段常被忽略的费用。纸上只记船只到岸，岸上的挑运、堆存与再交割却同样需要人手。\n\n[Concept('hbe_history_river', '川江')|e]的货运不止发生在水面。本府若[Concept('hbe_term_trial', '出资试办')|e]转仓[Concept('hbe_term_contract', '契约')|e]，便能使自己的运力和损耗获得共同承认；若只依旧例索取便利，沿江盟友可能仍将这些费用看作重庆一府应当自行承担的事。"
 hbe_banquet.210.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.210.b: "守旧例，暂不承诺共担。"
 hbe_banquet.211.title: "两岸渡牌"
 hbe_banquet.211.desc: "涪州的渡船来往于两岸，船主却常需分别取得许可，再把同一批货物申报两次。两处经手者各有账册，重复验印所费便被夹在交割之后，无人愿意列入共同预算。\n\n本府可以[Concept('hbe_term_trial', '出资试办')|e]一份两岸共同认可的渡牌，以减少争端、积累履约；也可维护各处旧权。方便往来与保全已有收入之间的取舍，将决定邻府是否愿意继续把转运交到我们手中。"
 hbe_banquet.211.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.211.b: "守旧例，暂不承诺共担。"
 hbe_banquet.212.title: "合州水口"
 hbe_banquet.212.desc: "合州的几处水口分别记载进出货物，账房请将同船的重复申报加以核对。地方长者谈起[Concept('hbe_history_diaoyu', '钓鱼城')|e]旧事，提醒诸府，守城与屯粮向来须使各处力量能够相接。\n\n如今要衔接的是仓场与账册。本府若[Concept('hbe_term_trial', '出资试办')|e]一套跨水口的交割办法，便可让[Concept('hbe_term_contract', '共同契约')|e]更易核验；若各自沿用旧簿，眼下的旧权得以保全，重复费用也将继续成为沿江的疑虑。"
 hbe_banquet.212.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.212.b: "守旧例，暂不承诺共担。"
 hbe_banquet.213.title: "峡口护运"
 hbe_banquet.213.desc: "夔州的掌事者愿为过峡货物提供护运，请以实际出动的人手与交割作为领款依据。也有人主张，只要船只经过本府险要之处，便应承担一项固定费用。\n\n[Concept('hbe_history_river', '川江')|e]险滩使熟悉水程的人格外重要，却也使收费容易被险阻掩盖。[Concept('hbe_term_trial', '出资试办')|e]可让夔州以真实的护运取得@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]；依旧例办事虽可省去新约的开支，船主却未必愿将每一笔费用都视作必要之劳。"
 hbe_banquet.213.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.213.b: "守旧例，暂不承诺共担。"
 hbe_banquet.214.title: "酉阳的山程"
 hbe_banquet.214.desc: "府中收到的互市图将几段曲折山路画得十分简略，据此定下的运输额度远高于实际可运之数。沿途掌事者请以站点、歇宿与季候重新估量，不愿让纸上的短路变成商队的过重承诺。\n\n酉阳可以[Concept('hbe_term_trial', '出资试办')|e]沿程查验，让地方经验进入[Concept('hbe_term_contract', '共同契约')|e]；也可先守现有图册。若不说明真正的山程，本府以后每一次交付都可能再次被同样的额度所牵制。"
 hbe_banquet.214.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.214.b: "守旧例，暂不承诺共担。"
 hbe_banquet.215.title: "忠州的届次"
 hbe_banquet.215.desc: "忠州的书记发现，几份来文虽记着同样的费用，却属于不同届次。有人将旧年未偿者并入本届交割，有人则把过去的出资再次作为今日的履约，双方都能出示印信。\n\n将凭据注明届次，看似只是掌簿的小事，却能厘清功劳与债务。本府若[Concept('hbe_term_trial', '出资试办')|e]，便可使后来的[Concept('hbe_term_contract', '契约')|e]更易查验；若仍依经手者的记忆解释旧账，争论很可能比那些经手者活得更久。"
 hbe_banquet.215.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.215.b: "守旧例，暂不承诺共担。"
 hbe_banquet.216.title: "保宁的印信"
 hbe_banquet.216.desc: "保宁主持者请核对[Concept('hbe_term_elector', '选侯')|e]印信所附的担保，不许将同一份承诺反复用于不同事业。府臣认为这样有助维护[Concept('hbe_term_alliance', '会盟')|e]信用，地方旧家却担心，先人的习惯将被新的核验所约束。\n\n[Concept('hbe_history_shudao', '蜀道')|e]的轮役与圈内的授权虽各有用途，签押的分量却同样取决于持印者是否履约。[Concept('hbe_term_trial', '资助试办')|e]能够使本府的见证更受信任；守住旧例，则要接受盟友继续追问印后究竟承担了什么。"
 hbe_banquet.216.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.216.b: "守旧例，暂不承诺共担。"
 hbe_banquet.217.title: "巴州关役"
 hbe_banquet.217.desc: "新铸的关印已送到巴州，掌事者准备以它确认本届轮值。巡察人员同时请求查验驻守与交接记录，指出一枚完整的印信仍须有真实的守备作为凭据。\n\n本府可以出资把人手、粮料与关役编成可验收的[Concept('hbe_term_contract', '契约')|e]，使@hbe_roads! [Concept('hbe_term_roads', '轮戍履约')|e]得到清楚承认；也可维护原有签押方式。关口的事务越是倚赖彼此信任，账上缺少的那一段经历就越难长久略过。"
 hbe_banquet.217.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.217.b: "守旧例，暂不承诺共担。"
 hbe_banquet.218.title: "广元回程"
 hbe_banquet.218.desc: "沿[Concept('hbe_history_shudao', '蜀道')|e]往来的驿使带回一份请款，要求将回程的人马与粮料一并计入。共同预算过去只重送到[Concept('hbe_term_alliance', '会盟')|e]的货物，却未详记返还时仍需维持的关驿与接力。\n\n广元既是行旅经过之地，也须使人马能够持续往返。本府若[Concept('hbe_term_trial', '出资试办')|e]两程交接，便可为今后的轮役争取更清楚的认可；若只维持旧例，遗漏的费用仍将落在沿途少数肯承担者身上。"
 hbe_banquet.218.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.218.b: "守旧例，暂不承诺共担。"
 hbe_banquet.219.title: "剑州栈路"
 hbe_banquet.219.desc: "本府修治的一段险路已可通行，掌事者请以实地查验代替冗长的功绩文书。乡里愿为所出木石作证，邻府却还要求核对这段工程与原定共同事业的关系。\n\n[Concept('hbe_history_jianmen', '剑门关')|e]与[Concept('hbe_history_shudao', '蜀道')|e]的声名来自险要，也来自历代通行者的维护。剑州若愿资助可验收的交接，便能使新修之路进入共同记录；若只援引本府旧功，所得认可未必与所费相称。"
 hbe_banquet.219.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.219.b: "守旧例，暂不承诺共担。"
 hbe_banquet.220.title: "龙安山货"
 hbe_banquet.220.desc: "龙安准备以山中所出货物承担一部分共同费用，账房却在谷口价与府城价之间难以取舍。若按远处高价入账，承运者将负担损耗；若只按产地计价，本府的实际劳作又未能得到承认。\n\n我们可以[Concept('hbe_term_trial', '出资试办')|e]明确的换算与交割，给后来同类事务留下依据；也可依旧例继续商谈。如何把地方之物变成盟友愿认的凭据，正是本府参与公治时首先面对的问题。"
 hbe_banquet.220.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.220.b: "守旧例，暂不承诺共担。"
 hbe_banquet.221.title: "达州驿粮"
 hbe_banquet.221.desc: "达州的驿使换马之后取得了另一份口粮凭据，府中发现这段接力在两地账上都有记载。驿吏声称费用确实发生，审计者则要求分清哪些是连续行程，哪些已经重复给付。\n\n本府若[Concept('hbe_term_trial', '出资试办')|e]驿粮核验，便可让[Concept('hbe_history_shudao', '蜀道')|e]与邻路的接力更为可信；若维护原有做法，则少了一项眼下的开支。共同事业要经得起远行，首先须经得起对同一段行程的两份记述。"
 hbe_banquet.221.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.221.b: "守旧例，暂不承诺共担。"
 hbe_banquet.222.title: "顺庆接运"
 hbe_banquet.222.desc: "顺庆的掌事者请将江船抵岸与驿路启运记在同一份合同里。水程和陆程各有经手者，交接之间的停留与损耗却常由最后收货的一方承担。\n\n本府连接两种运输，既能争取更多公款，也须承担更明确的验收。[Concept('hbe_term_trial', '出资试办')|e]将为跨圈合作留下[Concept('hbe_term_contribution', '履约记录')|e]；仍依各自旧簿办事，则意味着下一次货物换程时，责任仍可能随凭据一同失去去向。"
 hbe_banquet.222.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.222.b: "守旧例，暂不承诺共担。"
 hbe_banquet.223.title: "简州目录"
 hbe_banquet.223.desc: "简州的掌簿吏提出为每届[Concept('hbe_term_contract', '共同合同')|e]编制目录，方便查寻先前的签押。试排之后，他们发现几份名称不同的文书竟指向同一笔旧欠款，几家当事者却一直各按自己的叫法索偿。\n\n本府可以[Concept('hbe_term_trial', '资助这项试办')|e]，使[Concept('hbe_term_contract', '契约')|e]与出资更易查验；也可将它视作书记应自行完成的小事。若愿为眼下的核对付出钱粮，后来的领主或许就不必再从同一箱杂乱旧券中寻找答案。"
 hbe_banquet.223.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.223.b: "守旧例，暂不承诺共担。"
 hbe_banquet.224.title: "遂宁出仓"
 hbe_banquet.224.desc: "遂宁仓吏请以实际出库与受领记录作为赈粮信用的依据。几家乡人已经送来谢意，也有人认为有了题名和见证便应算作交付，未必需要逐项核对数量。\n\n@hbe_grain! [Concept('hbe_term_grain', '义仓储备')|e]应能在急时成为真正可用的粮食。本府若[Concept('hbe_term_trial', '出资试办')|e]出仓[Concept('hbe_term_contract', '契约')|e]，便可使赈济与共同账目相互印证；若依旧例办理，表面上的和睦能够维持，仓中实物与案上功绩却可能渐渐分离。"
 hbe_banquet.224.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.224.b: "守旧例，暂不承诺共担。"
 hbe_banquet.225.title: "潼川印号"
 hbe_banquet.225.desc: "潼川准备为[Concept('hbe_term_contract', '共同契约')|e]的印记编定次序，以便追明每一份文书何时颁行、由谁认领。旧家担心新规使过去的凭据难再援引，书记则说，正因要承认[Concept('hbe_term_contract', '旧约')|e]，才须分清新旧。\n\n[Concept('hbe_term_trial', '出资试办')|e]可以为本府积累一份可验收的事业，也有望减少错引与重复担保。若维护原有惯例，省下的只是眼下的编册费用；后来发生争议时，各方仍须逐枚印信寻找它曾经代表的承诺。"
 hbe_banquet.225.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.225.b: "守旧例，暂不承诺共担。"
 hbe_banquet.226.title: "广安旧粮券"
 hbe_banquet.226.desc: "广安运来旧年的仓粮凭据，请[Concept('hbe_term_alliance', '会盟')|e]承认此前救急时所出的粮食。掌事者同时指出，这些功绩应记入旧届，不能借此免去本届另已答应的交割。\n\n@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]既须尊重过去，也须辨明今日的责任。本府可以[Concept('hbe_term_trial', '出资试办')|e]分届核验，使先人的贡献与现任的履约各得其所；也可以坚持旧券足以涵盖眼下的要求，但其他诸府未必愿以同样的理解共同认账。"
 hbe_banquet.226.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.226.b: "守旧例，暂不承诺共担。"
 hbe_banquet.227.title: "雅州茶马券"
 hbe_banquet.227.desc: "雅州商队把茶货与换得的马匹写在同一页凭据上，采办者觉得简明，承运者却要求分别注明各段责任。[Concept('hbe_history_tea', '雅州茶马司')|e]的旧事仍被传说，今日的互市也须使货与价能够彼此对照。\n\n本府若[Concept('hbe_term_trial', '资助试办')|e]，将采购和运输分项核验，便可使@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]更为可靠；若仍沿用熟人之间的旧法，眼前交易虽能继续，下一次发生损耗时却仍难说明应由哪一方承担。"
 hbe_banquet.227.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.227.b: "守旧例，暂不承诺共担。"
 hbe_banquet.228.title: "茂州轮值"
 hbe_banquet.228.desc: "茂州的山门调停名单上，同一位掌事者被几府同时列作轮值。当地长者说，此人确有公信，却不能一身同时赴几处谷口，名单上的整齐并不能让争端自动平息。\n\n我们可以[Concept('hbe_term_trial', '出资试办')|e]按实际人员交接的议约，让@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]与地方见证更能持续；也可维护旧有名义。对于须走过山路才能到来的调停者，履约首先意味着他确实能够抵达。"
 hbe_banquet.228.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.228.b: "守旧例，暂不承诺共担。"
 hbe_banquet.229.title: "松潘长路"
 hbe_banquet.229.desc: "松潘的商队将沿途站点逐一列出，请府中重新估量运输所费。共同预算过去只留一项山程费用，却未分明雪阻、歇宿和换驮各自发生在何处。\n\n本府可以出资把这些经验写成可验收的[Concept('hbe_term_contract', '契约')|e]，使长路上的劳作不再只见于行旅的口述；也可先依旧例办事。若诸府仍只按图上的一条线分摊，本府此后的交付便会继续承担那些无人愿认的差额。"
 hbe_banquet.229.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.229.b: "守旧例，暂不承诺共担。"
 hbe_banquet.230.title: "盐源旧尺"
 hbe_banquet.230.desc: "盐源互市沿用的量尺与府城新定尺度略有不同，商人因此在换算时各执一词。乡里并不拒绝共同交割，却担心突然改尺会使自己原有的货物与债约一并贬损。\n\n本府若[Concept('hbe_term_trial', '出资试办')|e]登记换算，便能使旧习和新[Concept('hbe_term_contract', '契约')|e]在同一册中相互核验，积累@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]。若维护原来的做法，眼下的买卖不会骤变，跨圈的交易却仍须逐回重新商谈数量。"
 hbe_banquet.230.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.230.b: "守旧例，暂不承诺共担。"
 hbe_banquet.231.title: "德昌轮签"
 hbe_banquet.231.desc: "德昌的议事者提议，共同文书先由各谷轮流见证，再由本府呈报。府臣担心手续增加，地方长者则认为，只有让实际承担者知道条款，府城的签押才不会在谷口失去分量。\n\n[Concept('hbe_term_trial', '资助试办')|e]将花费钱粮，也会给@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]留下可验收的记录；依旧例集中用印则较为简便。我们如何安排两者，将决定日后的共同事业被看作本府命令，还是各地愿意继续履行的约定。"
 hbe_banquet.231.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.231.b: "守旧例，暂不承诺共担。"
 hbe_banquet.232.title: "黎州通行约"
 hbe_banquet.232.desc: "黎州的掌事者请先确认共用山路的商队，再依使用与维护划分费用。旧券只记路权，途中由谁修桥、何时须为行旅开路，却多凭长者记忆相传。\n\n[Concept('hbe_history_tea', '雅州茶马司')|e]曾使周边互市更有章法，今日的山程仍需要实际使用者共同认账。本府若愿[Concept('hbe_term_trial', '出资试办')|e]，便可将这段经验纳入@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]；若仅依旧券行事，未说清的维护之责仍会在下一次风雨后重现。"
 hbe_banquet.232.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.232.b: "守旧例，暂不承诺共担。"
 hbe_banquet.233.title: "马湖渡额"
 hbe_banquet.233.desc: "府库按理想船型定下渡运额度，马湖船户却带来现有船只的量度。水程、吃水与可载之物都有实际限制，纸上多列的一份货物并不能因此送到彼岸。\n\n我们可以[Concept('hbe_term_trial', '出资试办')|e]真实运力的查验，使@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]与共同采办相互印证；也可继续维持旧额。前者须承担眼下的核验之费，后者则让船户在每次交付时为同一项不切实际的承诺寻求通融。"
 hbe_banquet.233.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.233.b: "守旧例，暂不承诺共担。"
 hbe_banquet.234.title: "建昌诸谷议事"
 hbe_banquet.234.desc: "建昌的代表请求，让谷中实际承担互市与维护的人参加议约。府臣认为本府主印已经能够代表辖境，长者却指出，不同山谷的习惯与所费不能只由一份总数涵盖。\n\n若[Concept('hbe_term_trial', '出资试办')|e]地方见证，建昌可以使自己的主持权建立在更清楚的@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]之上；若沿用旧例，议事固然简便，签押所要求的义务却未必为每一处谷口同样理解。"
 hbe_banquet.234.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.234.b: "守旧例，暂不承诺共担。"
 hbe_banquet.235.title: "永宁互市场"
 hbe_banquet.235.desc: "永宁有人建议将互市安排得更近商队必经之处，以减少往返和停留。现有掌事者担心新场所增加巡察之劳，沿途居民则愿以自己的见证换取共同认可。\n\n本府可以[Concept('hbe_term_trial', '出资试办')|e]交割与议约，使便于行旅的安排成为可验收的事业；也可维持现有地点与旧权。互市最终能否为地方所用，取决于货物、人手与规则是否真能在同一处相遇。"
 hbe_banquet.235.a: "出二金，把本府试办写成可验收的[Concept('hbe_term_contract', '契约')|e]。"
 hbe_banquet.235.b: "守旧例，暂不承诺共担。"
 hbe_banquet.30.title: "渠旁与堂上"
 hbe_banquet.30.desc: "本届主持者要求在议事堂增设本府的座位，理由是近年所承渠工甚多。沿江诸侯随即呈上护运凭据，关驿的代表则指出，若无道路通畅，堂中的文书便根本送不到各府。\n\n究竟依旧日名望排列席次，还是按实际事业承认功劳，已成为诸侯彼此试探的题目。一个看似微小的安排，可能决定某府今后是否愿意继续为[Concept('hbe_term_success', '共同项目')|e]承担额外之劳。"
 hbe_banquet.30.a: "拨二金重审共同规则。"
 hbe_banquet.30.b: "拿三点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]担保下一届。"
 hbe_banquet.30.c: "保留本府意见。"
 hbe_banquet.31.title: "先人的签押"
 hbe_banquet.31.desc: "一位使者呈上祖辈留下的保证书，声称本府与[Concept('hbe_term_alliance', '会盟')|e]的情谊由来已久，应免去此次核验。书记承认旧印无误，却在库册中找不到本届相应的出资与货物。\n\n前人的声望可以使一份承诺更易被接受，却不能替后来者完成交割。我们若尊重[Concept('hbe_term_contract', '旧约')|e]，须确认继承它的人同样承担义务；若只按眼前的账数行事，又可能让那些曾经相助的家族觉得被轻慢。"
 hbe_banquet.31.a: "拨二金重审共同规则。"
 hbe_banquet.31.b: "拿三点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]担保下一届。"
 hbe_banquet.31.c: "保留本府意见。"
 hbe_banquet.32.title: "继任者的库册"
 hbe_banquet.32.desc: "皇帝已经更替，公共采办的清单却仍沿用旧例。库吏逐项报出所需钱粮，众人这才发现，有些府州的辖境已变，有些承担费用的机构也早已并入他处。\n\n主持者可以重新安排公款，但每一次更动都会牵涉旧受益者与新负担者。[Concept('hbe_term_alliance', '会盟')|e]若要比一代人的在位更长久，便须使责任随机构和事业延续，而非只追随一枚属于现任的印信。"
 hbe_banquet.32.a: "拨二金重审共同规则。"
 hbe_banquet.32.b: "拿三点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]担保下一届。"
 hbe_banquet.32.c: "保留本府意见。"
 hbe_banquet.33.title: "敕书重录"
 hbe_banquet.33.desc: "府库中的[Concept('hbe_term_isolation', '旧敕书')|e]因纸损需要重录，掌事者因此重新核对了自治与盐粮交割的条款。山外的传闻时时变化，诸侯却仍须依现有盟约维护通商与境内秩序。\n\n重录并非重新立约。有人希望趁此改动几句文字，使本府少负一项义务；也有人坚持原文一字不易。我们应如何保存先人留下的保障，又如何让后来者明白其中的责任，不能只由抄写文书的人决定。"
 hbe_banquet.33.a: "拨二金重审共同规则。"
 hbe_banquet.33.b: "拿三点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]担保下一届。"
 hbe_banquet.33.c: "保留本府意见。"
 hbe_banquet.34.title: "图册上的山路"
 hbe_banquet.34.desc: "新修的圈际图册已经送来，谷中代表却指出，一条常用的山路在图上被缩成了不起眼的支线。沿途需修的桥栈与安置的转运人手，因此未列入共同费用。\n\n纸上的远近与行旅实际所费并不总是相同。若愿重勘道路，@hbe_tea! [Concept('hbe_term_tea', '商队互保')|e]和驿路的经验便能成为依据；若只据现有图册拨款，被漏下的地方将不得不自行补足缺口。"
 hbe_banquet.34.a: "拨二金重审共同规则。"
 hbe_banquet.34.b: "拿三点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]担保下一届。"
 hbe_banquet.34.c: "保留本府意见。"
 hbe_banquet.35.title: "百年约首"
 hbe_banquet.35.desc: "章程草案已经写成，开篇所列的却不是颂辞，而是共同事业应由谁出资、谁验收、谁对未交付之事负责。阅卷的诸侯有人欣慰，有人则认为如此直白有失典礼。\n\n百年的[Concept('hbe_term_contract', '旧约')|e]之所以还能被援引，正在于它留下了可行的办法。我们今日的文书若只适合诵读，却不能用于渠旁与仓场，后来者终究还要为同样的问题再开一次[Concept('hbe_term_alliance', '会盟')|e]。"
 hbe_banquet.35.a: "拨二金重审共同规则。"
 hbe_banquet.35.b: "拿三点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]担保下一届。"
 hbe_banquet.35.c: "保留本府意见。"
 hbe_banquet.36.title: "续约之年"
 hbe_banquet.36.desc: "最早的主持者已无一在世，许多府州也经历了更易与整合。官吏仍按时重开簿册，商队仍在关口请求验印，受水的乡里则继续为下一次岁修备料。\n\n[Concept('hbe_term_alliance', '会盟')|e]的意义已不再只属于开创之人。是否按约交付、是否认可地方旧权，正由今日的领主重新作答。若我们愿把这份事业留给后人，便须承认[Concept('hbe_term_charter', '百年章程')|e]也只是持续治事的开端。"
 hbe_banquet.36.a: "拨二金重审共同规则。"
 hbe_banquet.36.b: "拿三点@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]担保下一届。"
 hbe_banquet.36.c: "保留本府意见。"
 hbe_banquet_success: "共同工程结算"
 hbe_banquet_success_desc: "共同工程结算带来的本地治理收益。"

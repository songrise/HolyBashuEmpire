 hbe_tech_common_1: "研究：乡约与账簿"
 hbe_tech_common_1.desc: "规范公共经费记录，解锁项目出资与回报明细\n费用 3，研究 3 年；须达到 1337 年。"
 hbe_tech_common_1.a: "执行"
 hbe_tech_common_2: "研究：统一度量"
 hbe_tech_common_2.desc: "降低参加公约成员之间的交割摩擦，开放标准[Concept('hbe_term_contract', '契约')|e]\n费用 3，研究 3 年；须达到 1342 年。"
 hbe_tech_common_2.a: "执行"
 hbe_tech_common_3: "研究：帝国工程署"
 hbe_tech_common_3.desc: "主持较大共同工程，提供分摊与验收方案\n费用 6，研究 5 年；须达到 1372 年。"
 hbe_tech_common_3.a: "执行"
 hbe_tech_common_4: "研究：匠人互访"
 hbe_tech_common_4.desc: "签订技术交流协定，学习客座地区的基础工艺\n费用 10，研究 8 年；须达到 1337 年。"
 hbe_tech_common_4.a: "执行"
 hbe_tech_common_5: "研究：行会传习"
 hbe_tech_common_5.desc: "扩大工艺传播，培养地区专精的匠人网络\n费用 10，研究 8 年；须达到 1352 年。"
 hbe_tech_common_5.a: "执行"
 hbe_tech_common_6: "研究：跨区工艺学堂"
 hbe_tech_common_6.desc: "提高跨区协作效率，解锁联邦共同研究项目\n费用 6，研究 5 年；须达到 1372 年。"
 hbe_tech_common_6.a: "执行"
 hbe_tech_common_7: "研究：驿路勘绘"
 hbe_tech_common_7.desc: "为驿路、关隘和商路项目提供勘查方案\n费用 10，研究 8 年；须达到 1337 年。"
 hbe_tech_common_7.a: "执行"
 hbe_tech_common_8: "研究：山河交通总图"
 hbe_tech_common_8.desc: "统筹跨区工程、降低重复筹备成本\n费用 10，研究 8 年；须达到 1372 年。"
 hbe_tech_common_8.a: "执行"
 hbe_tech_chengdu_plain_1: "研究：渠田协作"

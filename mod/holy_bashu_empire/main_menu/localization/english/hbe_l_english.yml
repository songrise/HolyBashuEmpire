 HBE_BANQUET_PANEL_TITLE: "三十六家，一张账单"
 HBE_BANQUET_PANEL_BODY: "本国立场：[Player.MakeScope.GetVariable('hbe_stance').GetValue|0]（1 [Concept('hbe_term_common', '共锅')|e]、2 [Concept('hbe_term_divided', '分锅')|e]、3 账房）。[Concept('hbe_term_contribution', '个人履约')|e]：[Player.MakeScope.GetVariable('hbe_contribution').GetValue|0]。\n阶段：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_chapter').GetValue|0] / 5。@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_dispute').GetValue|0] / 100。\n届次：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_round').GetValue|0]；本届月份：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_round_month').GetValue|0] / 36。\n主工程：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_project_kind').GetValue|0]（1 [Concept('hbe_term_saltproject', '盐船共账')|e]、2 [Concept('hbe_term_teaproject', '茶马过蜀道')|e]）。三项交付：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_role_1').GetValue|0] / [GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_role_2').GetValue|0] / [GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_role_3').GetValue|0]。\n[Concept('hbe_term_success', '成功工程')|e]：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_completed_projects').GetValue|0]。章程：[GetSituationByKey('hbe_banquet').MakeScope.GetVariable('hbe_charter').GetValue|0]（0 未定、1 [Concept('hbe_term_common', '共锅')|e]、2 [Concept('hbe_term_divided', '分锅')|e]、3 账房）。\n[Concept('hbe_term_charter', '百年章程')|e]至少在1437年、[Concept('hbe_term_chapter', '第五阶段')|e]与三十次[Concept('hbe_term_success', '成功工程')|e]后提案，由[Concept('hbe_term_circle', '七圈')|e]授权表决。合并诸侯后，原府州首府仍构成[Concept('hbe_term_seat', '固定代表席位')|e]。"
 HBE_BANQUET_PANEL_HELP: "[Concept('hbe_term_commitment', '前六个月')|e]在决议中出资或签专业合同；半年交付，第十二个月兑现承诺，第三十六个月统一结算。\n三份[Concept('hbe_term_delivery', '专业交付')|e]齐全且@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]低于75才算成功。1437年以后、[Concept('hbe_term_chapter', '第五阶段')|e]且至少30次成功项目，皇帝可提请[Concept('hbe_term_charter', '百年章程')|e]。\n[Concept('hbe_term_common', '共锅')|e]、[Concept('hbe_term_divided', '分锅')|e]、[Concept('hbe_term_ledger', '账房立场')|e]在局势地图上分别为红、蓝、黄。全部帝国成员参加；[Concept('hbe_term_isolation', '自治盟约')|e]一直有效。"

 hbe.106.title: "谷中议约"
 hbe.106.desc: "川西南山谷圈的议事者带来了不同形式的旧凭证：有墨书契纸，也有木刻记号与当众作出的约誓。府城的书记只认其中一部分，谷中长者却认为彼此的见证才使约定可信。\n\n若依@hbe_valleys! [Concept('hbe_term_valleys', '地方共治')|e]承认[Concept('hbe_term_contract', '旧约')|e]，本府须付出已经积累的信誉与人手；另行调查则需要实在的钱粮。我们如何处理这桩争端，将决定谷中居民是否愿意继续把府城的签押视为共同的承诺。"
 hbe.106.a: "按[Concept('hbe_term_contract', '旧约')|e]履行。"
 hbe.106.b: "拨三金，重新核账。"
 hbe.106.c: "先喝茶，账下次算。"

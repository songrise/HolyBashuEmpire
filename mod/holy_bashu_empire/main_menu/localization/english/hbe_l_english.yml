 hbe_status.desc: "查看@hbe_yiqi! [Concept('hbe_term_yiqi', '义气')|e]、@hbe_guoqi! [Concept('hbe_term_guoqi', '锅气')|e]、研究进度和[Concept('hbe_term_isolation', '自治盟约')|e]。"

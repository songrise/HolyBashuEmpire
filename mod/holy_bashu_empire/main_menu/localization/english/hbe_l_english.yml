 hbe_banquet.1.title: "敕书与会盟"
 hbe_banquet.1.desc: "奉命查验盐粮的使者进入议事堂时，诸府的印信已经陈列于案。宋元兵事留下的创伤尚未远去，各地领主却已明白，若渠田失修、驿路断绝，再险要的山城也难以独存。\n\n依[Concept('hbe_term_isolation', '自治盟约')|e]，巴蜀将以共同交割维持与山外的关系，以[Concept('hbe_term_circle', '七圈')|e]议事协调境内诸府。此议被乡里称作巴蜀大开席：既为聚众，也为分担。今后的公款应由谁主持，地方应保有多少自理之权，诸侯正等待我们的回答。"
 hbe_banquet.1.a: "[Concept('hbe_term_common', '共锅派')|e]：[Concept('hbe_term_service', '公共事业')|e]，皇帝牵头。"
 hbe_banquet.1.b: "[Concept('hbe_term_divided', '分锅派')|e]：各府自己管，圈里共同办。"
 hbe_banquet.1.c: "[Concept('hbe_term_ledger', '账房派')|e]：先看合同，再谈情义。"
 hbe_project_fund: "[Concept('hbe_term_round', '分账会')|e]：[Concept('hbe_term_funding', '出资三金')|e]"
 hbe_project_fund.desc: "本届公共经费[Concept('hbe_term_funding', '出资三金')|e]，取得[Concept('hbe_term_contribution', '个人履约')|e]一份。出资不替代[Concept('hbe_term_delivery', '地区专业交付')|e]；项目成功后才有共同收益。"
 hbe_project_fund.a: "执行"
 hbe_project_pledge: "[Concept('hbe_term_round', '分账会')|e]：[Concept('hbe_term_pledge', '先认账')|e]，届中付款"
 hbe_project_pledge.desc: "先签四金承诺，第十二个月核账。届时国库不足会违约，@hbe_dispute! [Concept('hbe_term_dispute', '争席度')|e]上升；不强制把国库扣成负数。"
 hbe_project_pledge.a: "执行"
 hbe_banquet.2.title: "本届事业开账"
 hbe_banquet.2.desc: "盐商将引券压在案角，驿吏摊开山道的图样，转运人则催促诸府先定交割。[Concept('hbe_term_saltproject', '盐船共账')|e]须使井灶、江运与审计相接；[Concept('hbe_term_teaproject', '茶马过蜀道')|e]，则要采办、关驿和互市各尽其责。\n\n有人愿立即出资，有人愿在届中付款，也有人宁肯以本地技艺承担[Concept('hbe_term_delivery', '专业交付')|e]。[Concept('hbe_term_commitment', '承诺期')|e]尚未结束，我们须决定本府承担何种义务。若只有签押而不见货物，三年后的[Concept('hbe_term_round', '分账会')|e]便难以照约结清。"
 hbe_banquet.2.a: "这次出三金。"
 hbe_banquet.2.b: "[Concept('hbe_term_pledge', '先认四金')|e]，届中兑付。"
 hbe_banquet.2.c: "本届先保留意见。"
 hbe_banquet.2.d: "留出额度，稍后签[Concept('hbe_term_delivery', '专业交付')|e]。"
 hbe_project_reconsider: "[Concept('hbe_term_round', '分账会')|e]：撤回暂缓意见"
 hbe_project_reconsider.desc: "在[Concept('hbe_term_commitment', '承诺期')|e]内重新参加，之后可以出资或签地区交付合同。"
 hbe_project_reconsider.a: "执行"
 hbe_project_select_1: "本届工程：[Concept('hbe_term_saltproject', '盐船共账')|e]"
 hbe_project_select_1.desc: "皇帝在前三个月确定主工程，消耗三金。已有[Concept('hbe_term_delivery', '专业交付')|e]时不能改项；出资者和承诺保持有效。"
 hbe_project_select_1.a: "执行"

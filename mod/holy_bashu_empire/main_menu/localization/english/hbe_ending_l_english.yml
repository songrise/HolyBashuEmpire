l_english:
 hbe_ending.1001.title: "失色的锦样 · 公开验色，允许新坊接单"
 hbe_ending.1001.desc: "锦坊为远来的买主织了一匹新绣，晒过几日后，青色却渐渐发灰。买主不肯收货，掌染师傅说是新染料的问题，供料商却指出织坊用过旧缸。学徒留下了每次下料的记号，过去没人愿看这些杂乱的纸片。\n\n新染的试布在街前晾开，旧师傅也来摸了一遍水洗后的颜色。订单不再只认旧铺号，年轻染户终于可以凭自己的手艺回答那批失色的锦。"
 hbe_ending.1001.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1002.title: "失色的锦样 · 由旧行会作保，维持稳定交货"
 hbe_ending.1002.desc: "锦坊为远来的买主织了一匹新绣，晒过几日后，青色却渐渐发灰。买主不肯收货，掌染师傅说是新染料的问题，供料商却指出织坊用过旧缸。学徒留下了每次下料的记号，过去没人愿看这些杂乱的纸片。\n\n旧行会收下新货，也把自己的担保押在交期上。年轻染户仍须经师傅验色，买主则愿再给这个熟悉的铺号一次机会。"
 hbe_ending.1002.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1003.title: "失色的锦样 · 在府学留样，按用途分发订单"
 hbe_ending.1003.desc: "锦坊为远来的买主织了一匹新绣，晒过几日后，青色却渐渐发灰。买主不肯收货，掌染师傅说是新染料的问题，供料商却指出织坊用过旧缸。学徒留下了每次下料的记号，过去没人愿看这些杂乱的纸片。\n\n几块洗过的试布被装订进样册，旁边记着各自合用的染法。坏锦没有被抹去，后来接单的人也有了可以比照的凭据。"
 hbe_ending.1003.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1004.title: "借来的诗卷 · 供公共讲读，留穷户席位"
 hbe_ending.1004.desc: "一个行脚书生借住旧宅，替主人整理潮湿的诗卷。修屋需要的钱比卖书所得还多，书生却从夹页中找出几首从未刊印的旧诗。附近书坊愿替他刻板，条件是把旧宅主人的名字列在篇首。\n\n旧宅门前添了几张矮凳，听读的人把鞋上的泥蹭净才进屋。主人仍惦记旧窗，却第一次听见邻里的孩子接出了诗卷里的下半句。"
 hbe_ending.1004.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1005.title: "借来的诗卷 · 准主人邀客，以礼物补修屋"
 hbe_ending.1005.desc: "一个行脚书生借住旧宅，替主人整理潮湿的诗卷。修屋需要的钱比卖书所得还多，书生却从夹页中找出几首从未刊印的旧诗。附近书坊愿替他刻板，条件是把旧宅主人的名字列在篇首。\n\n诗卷在宾客手中传过一圈，又被主人收回匣中。修屋的礼物已经送到，未获邀请的人仍只能隔着院墙听见几句讲读。"
 hbe_ending.1005.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1006.title: "借来的诗卷 · 让书坊办读本，馆中按日限客"
 hbe_ending.1006.desc: "一个行脚书生借住旧宅，替主人整理潮湿的诗卷。修屋需要的钱比卖书所得还多，书生却从夹页中找出几首从未刊印的旧诗。附近书坊愿替他刻板，条件是把旧宅主人的名字列在篇首。\n\n书坊送来的读本比旧卷粗朴，却经得起反复翻阅。馆门按日开合，旧宅仍有自己的安静，诗句则沿着市街走得更远。"
 hbe_ending.1006.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1007.title: "竹山的两张界图 · 按季议价，由两村共管"
 hbe_ending.1007.desc: "彭州山脚两村共用一片竹山，旧界图只画了山脊，没有标出近年改道的溪流。修渠时一队人伐了对方认作自家的竹子，双方都带着残根来府署。竹农提醒我们，春笋还没出土，再封山一年会误了整个采办季。\n\n春竹下山时，两村的人一起过秤，也核对照料竹山的工日。界图仍有争议的旧线，采办的价钱却已能当面商议。"
 hbe_ending.1007.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1008.title: "竹山的两张界图 · 固定官价，换取长期订单"
 hbe_ending.1008.desc: "彭州山脚两村共用一片竹山，旧界图只画了山脊，没有标出近年改道的溪流。修渠时一队人伐了对方认作自家的竹子，双方都带着残根来府署。竹农提醒我们，春笋还没出土，再封山一年会误了整个采办季。\n\n官办采竹单定下了价钱，村里能预先安排人手。有人念着市上的好价，有人终于不必担心一季竹料无人收取。"
 hbe_ending.1008.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1009.title: "竹山的两张界图 · 准作坊预订，公开轮伐记录"
 hbe_ending.1009.desc: "彭州山脚两村共用一片竹山，旧界图只画了山脊，没有标出近年改道的溪流。修渠时一队人伐了对方认作自家的竹子，双方都带着残根来府署。竹农提醒我们，春笋还没出土，再封山一年会误了整个采办季。\n\n作坊预订的竹料按片出山，轮伐册留在两村都能查看的地方。订单催着赶工，竹农却有了拒绝提前砍尽一坡竹子的依据。"
 hbe_ending.1009.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1010.title: "盐灶上的新铜管 · 给转学煎盐的名额"
 hbe_ending.1010.desc: "井户从铁匠处买来一根铜管，想把卤水引到稍远的灶边。铜管省下挑卤人手，却在第一个寒夜漏了水。几名灶工被烫伤，供料匠人坚持这不是铜料的问题。新井筹资已经到期，停灶将使担保人先付利钱。\n\n旧挑卤工站到煎盐师傅身旁，起初仍习惯去抓肩上的扁担。新铜管替去了旧活计，这一次传习却让他们还能留在井场。"
 hbe_ending.1010.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1011.title: "盐灶上的新铜管 · 付一次工钱，准井主自定雇用"
 hbe_ending.1011.desc: "井户从铁匠处买来一根铜管，想把卤水引到稍远的灶边。铜管省下挑卤人手，却在第一个寒夜漏了水。几名灶工被烫伤，供料匠人坚持这不是铜料的问题。新井筹资已经到期，停灶将使担保人先付利钱。\n\n井主结清约定的工钱，几个旧工各自收好钱串离开。铜管仍连续出卤，下一次雇用的名字则由井主重新写进册里。"
 hbe_ending.1011.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1012.title: "盐灶上的新铜管 · 让盐署雇他们巡查各井管道"
 hbe_ending.1012.desc: "井户从铁匠处买来一根铜管，想把卤水引到稍远的灶边。铜管省下挑卤人手，却在第一个寒夜漏了水。几名灶工被烫伤，供料匠人坚持这不是铜料的问题。新井筹资已经到期，停灶将使担保人先付利钱。\n\n盐署发下巡查凭记，旧工把熟悉的井路重新走了一遍。过去挑过的卤桶不再需要他们，漏水的接头却还认得这几双老练的手。"
 hbe_ending.1012.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1013.title: "顺流而下的酒瓮 · 并刻烧造与装载记号"
 hbe_ending.1013.desc: "泸州酒户订做一批较薄的酒瓮，船户说装船更轻，窑工却担心长途碰撞。第一批货在合江卸船时破了数只，酒户指责船上的垫草不足。窑工带来完好的空瓮，要求把装载与烧造分开查验。\n\n烧造者和装载者在瓮底留下约定的记号，货主不再只问铺号。下一批酒尚未启程，坏瓮应由谁查验已有了可以追问的线索。"
 hbe_ending.1013.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1014.title: "顺流而下的酒瓮 · 由商铺统一担保"
 hbe_ending.1014.desc: "泸州酒户订做一批较薄的酒瓮，船户说装船更轻，窑工却担心长途碰撞。第一批货在合江卸船时破了数只，酒户指责船上的垫草不足。窑工带来完好的空瓮，要求把装载与烧造分开查验。\n\n新瓮统一刻上商铺的号，沿江买主认货也认这一家担保。窑工少了一份显名，交割时却只须面对一套验收办法。"
 hbe_ending.1014.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1015.title: "顺流而下的酒瓮 · 设公用验瓮，让新窑也能供货"
 hbe_ending.1015.desc: "泸州酒户订做一批较薄的酒瓮，船户说装船更轻，窑工却担心长途碰撞。第一批货在合江卸船时破了数只，酒户指责船上的垫草不足。窑工带来完好的空瓮，要求把装载与烧造分开查验。\n\n验瓮桌移到新窑也能进出的院中，船户把试过的装载法教给后来者。旧商铺仍有自己的客人，新窑也能送来第一批合格的货。"
 hbe_ending.1015.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1016.title: "井旁的旧墓 · 留原处石记，准村民祭礼"
 hbe_ending.1016.desc: "扩井时井工掘到几块旧墓砖。墓上没有清楚的姓氏，附近村民却不愿任由井主推平。掌盐官说新井能够补足今年盐额，师生希望趁开工前记下砖上图样。家属是否仍在本地，没人敢给出保证。\n\n石记留在井旁，村里人按旧约前来祭扫。运盐的人绕开那一小片地，井场照常出卤，旧墓没有被新生意完全盖过去。"
 hbe_ending.1016.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1017.title: "井旁的旧墓 · 移碑村口，以盐利供养"
 hbe_ending.1017.desc: "扩井时井工掘到几块旧墓砖。墓上没有清楚的姓氏，附近村民却不愿任由井主推平。掌盐官说新井能够补足今年盐额，师生希望趁开工前记下砖上图样。家属是否仍在本地，没人敢给出保证。\n\n旧碑移到村口，供养的钱从盐利中拨出。村人归家时能看见熟悉的名字，井边空出的路也重新走起了挑盐的人。"
 hbe_ending.1017.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1018.title: "井旁的旧墓 · 府学留图，公布开井时的约定"
 hbe_ending.1018.desc: "扩井时井工掘到几块旧墓砖。墓上没有清楚的姓氏，附近村民却不愿任由井主推平。掌盐官说新井能够补足今年盐额，师生希望趁开工前记下砖上图样。家属是否仍在本地，没人敢给出保证。\n\n旧墓图样和开井时的约定一同入藏，府学借讲读向乡里说明来由。井边留下的痕迹渐淡，纸上的旧事却不再只靠几位老人的记性。"
 hbe_ending.1018.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1019.title: "夜里听不见的江号 · 公开夜行办法，准船帮自查"
 hbe_ending.1019.desc: "江防站更换了一种较响的号角，远处村寨却把它误认成山中祭号。一次夜汛时，粮船仍照旧号出发，险些撞上漂木。军官要求所有村寨学会新号，村民则认为江岸站从未问过他们旧有的报水办法。\n\n船帮把夜号抄给新接船的人，岸上添灯的工钱也列入共账。军船不再独占这份办法，听见江号的船却都须记住回报水势。"
 hbe_ending.1019.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1020.title: "夜里听不见的江号 · 纳入军用护航，按券放行"
 hbe_ending.1020.desc: "江防站更换了一种较响的号角，远处村寨却把它误认成山中祭号。一次夜汛时，粮船仍照旧号出发，险些撞上漂木。军官要求所有村寨学会新号，村民则认为江岸站从未问过他们旧有的报水办法。\n\n夜行券交到护航船队手里，粮船照排定的行期离岸。灯号变得整齐，未入护航的船仍得等白日或另请领航。"
 hbe_ending.1020.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1021.title: "夜里听不见的江号 · 交码头讲习，收费只补灯油"
 hbe_ending.1021.desc: "江防站更换了一种较响的号角，远处村寨却把它误认成山中祭号。一次夜汛时，粮船仍照旧号出发，险些撞上漂木。军官要求所有村寨学会新号，村民则认为江岸站从未问过他们旧有的报水办法。\n\n码头留出讲习的空屋，新船工跟着旧船夫练习应号。收来的钱只补灯油，最先来旁听的是过去总被劝住夜行的小船户。"
 hbe_ending.1021.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1022.title: "岸边的旧船坞 · 保留小船时段，补短期误工"
 hbe_ending.1022.desc: "河水改道后，一座旧船坞落在浅滩边，船匠仍靠修小船生活。大船商提出搬坞到深水处，要求府署替他取得岸地。船匠愿搬，却担心搬去以后只能给同一家商号做活。旧址旁的小渔户也需要留下修船的地方。\n\n渔户按约定的时段把小船推上坞，大船在水边多等了一阵。船匠把新补的木板敲紧，门牌上的共用终于有了实际的一天。"
 hbe_ending.1022.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1023.title: "岸边的旧船坞 · 大船优先，以货利付渔户工钱"
 hbe_ending.1023.desc: "河水改道后，一座旧船坞落在浅滩边，船匠仍靠修小船生活。大船商提出搬坞到深水处，要求府署替他取得岸地。船匠愿搬，却担心搬去以后只能给同一家商号做活。旧址旁的小渔户也需要留下修船的地方。\n\n大船先入坞，货利中拨出的工钱交给暂时让位的渔户。船坞有了稳定收入，小船何时能修仍须随大宗货约安排。"
 hbe_ending.1023.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1024.title: "岸边的旧船坞 · 按船型公开排期，设共同账房"
 hbe_ending.1024.desc: "河水改道后，一座旧船坞落在浅滩边，船匠仍靠修小船生活。大船商提出搬坞到深水处，要求府署替他取得岸地。船匠愿搬，却担心搬去以后只能给同一家商号做活。旧址旁的小渔户也需要留下修船的地方。\n\n共同账房把不同船型的修理日分开列出，船主到岸便能先查。争执并未绝迹，谁被插了队却不再只凭嗓门大的人说了算。"
 hbe_ending.1024.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1025.title: "峡中留下的拓本 · 供木搭棚，留石在原处"
 hbe_ending.1025.desc: "一位拓工在峡壁旧刻上留下数张纸样，过路船户愿把它们带到城中出售。村寨认为石刻记着祖辈渡江的旧事，不该由陌生人定价。拓工说，若无人买纸，明年便没人再来查记那些正被风雨磨平的字。\n\n小棚沿石壁搭好，运木的船户收回约定的工钱。雨仍会落进峡中，村人却愿轮流查看那几道没有搬离故地的旧痕。"
 hbe_ending.1025.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1026.title: "峡中留下的拓本 · 迁入陈馆，补村寨运输钱"
 hbe_ending.1026.desc: "一位拓工在峡壁旧刻上留下数张纸样，过路船户愿把它们带到城中出售。村寨认为石刻记着祖辈渡江的旧事，不该由陌生人定价。拓工说，若无人买纸，明年便没人再来查记那些正被风雨磨平的字。\n\n完整的石块被小心运入陈馆，搬运者在交接时留下见证。来客能近看纹理，旧石所在的崖面却只剩一处颜色稍浅的空位。"
 hbe_ending.1026.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1027.title: "峡中留下的拓本 · 保存拓本，停止扩大石面开凿"
 hbe_ending.1027.desc: "一位拓工在峡壁旧刻上留下数张纸样，过路船户愿把它们带到城中出售。村寨认为石刻记着祖辈渡江的旧事，不该由陌生人定价。拓工说，若无人买纸，明年便没人再来查记那些正被风雨磨平的字。\n\n拓本分送到可以借阅的书架，山路不再为取石继续开凿。石面还有多少经得起雨季无人敢说，纸上的几道痕却已多了几处归宿。"
 hbe_ending.1027.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1028.title: "驿站里的沙漏 · 公开器具改法，隐去守军行期"
 hbe_ending.1028.desc: "商人带来一只沙漏，说它比阴天的日影可靠。驿吏用它记守更，半夜却发现潮气让细沙结住。老驿卒仍按自己记住的路程报刻，年轻人要求把器具和经验一起查验，免得以后只凭失准的漏壶扣工钱。\n\n器具改法送进公开记录，守军行期另行封存。修漏的匠人能彼此比照失误，山口的值夜仍有自己的隐秘。"
 hbe_ending.1028.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1029.title: "驿站里的沙漏 · 把更册全交关军，军用优先"
 hbe_ending.1029.desc: "商人带来一只沙漏，说它比阴天的日影可靠。驿吏用它记守更，半夜却发现潮气让细沙结住。老驿卒仍按自己记住的路程报刻，年轻人要求把器具和经验一起查验，免得以后只凭失准的漏壶扣工钱。\n\n更册由关军保管，漏壶按轮戍逐一检查。过客听见的报更比从前齐整，却无从知道册边那些曾被匠人反复涂改的记号。"
 hbe_ending.1029.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1030.title: "驿站里的沙漏 · 供府学教读，另记城门军册"
 hbe_ending.1030.desc: "商人带来一只沙漏，说它比阴天的日影可靠。驿吏用它记守更，半夜却发现潮气让细沙结住。老驿卒仍按自己记住的路程报刻，年轻人要求把器具和经验一起查验，免得以后只凭失准的漏壶扣工钱。\n\n府学教人读漏，城门军册另置一箱。学徒学会分辨停漏的缘由，守更人也不必再把每一处失误都当作不能开口的军情。"
 hbe_ending.1030.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1031.title: "轮戍人的两册工钱 · 按实日计役，府库供替岗"
 hbe_ending.1031.desc: "关军与村寨各留一册轮戍工钱，名字相同，记的日期却不一样。几名士兵已经回乡耕作，仍被算在缺役的人里。书记说两册无法对照，只能请家族作保；士兵认为自己守过的城门不该由家世来证明。\n\n按实日记下的役期送回村中，替岗的人也领到府库工钱。年轻人背起农具时仍会听见关城更鼓，这次却知道何时该再上山。"
 hbe_ending.1031.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1032.title: "轮戍人的两册工钱 · 集中供养关军，稳定值守"
 hbe_ending.1032.desc: "关军与村寨各留一册轮戍工钱，名字相同，记的日期却不一样。几名士兵已经回乡耕作，仍被算在缺役的人里。书记说两册无法对照，只能请家族作保；士兵认为自己守过的城门不该由家世来证明。\n\n关军供养并入统一安排，临时换岗的叫门声少了。轮戍者在营中安置好铺盖，村里也要重新适应少了这些劳力的时日。"
 hbe_ending.1032.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1033.title: "轮戍人的两册工钱 · 村寨共议轮值，每季公开工钱"
 hbe_ending.1033.desc: "关军与村寨各留一册轮戍工钱，名字相同，记的日期却不一样。几名士兵已经回乡耕作，仍被算在缺役的人里。书记说两册无法对照，只能请家族作保；士兵认为自己守过的城门不该由家世来证明。\n\n各寨在同一张轮值册上核对姓名与工钱，下一季替岗由乡里共议。旧领役人仍来催问，村民却能把自己已经出的日子指给他看。"
 hbe_ending.1033.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1034.title: "山路上的书箱 · 按供学用量发券，公开采购"
 hbe_ending.1034.desc: "一批书箱从蜀道运来，货主要求沿途免关，称它们要送给府学。驿吏打开其中一箱，发现既有经卷，也有商家的账本。赶马人只知道自己收过路费，不愿替货主证明每页纸的用途。\n\n供学纸货按用量入库，教读人与书坊共同看过清单。孩子拿到的新纸不算精美，至少不必等到关署下一次顺便采买。"
 hbe_ending.1034.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1035.title: "山路上的书箱 · 关署统一采办，控制免关"
 hbe_ending.1035.desc: "一批书箱从蜀道运来，货主要求沿途免关，称它们要送给府学。驿吏打开其中一箱，发现既有经卷，也有商家的账本。赶马人只知道自己收过路费，不愿替货主证明每页纸的用途。\n\n书箱随关署货队越过山口，免关凭证也由同一处核发。纸墨供给有了定期，书坊想多送一箱仍须先等官署批记。"
 hbe_ending.1035.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1036.title: "山路上的书箱 · 书坊与府学共同订货，逐年查账"
 hbe_ending.1036.desc: "一批书箱从蜀道运来，货主要求沿途免关，称它们要送给府学。驿吏打开其中一箱，发现既有经卷，也有商家的账本。赶马人只知道自己收过路费，不愿替货主证明每页纸的用途。\n\n书坊与府学把来年用量写在同一份订单，查账时双方都须到场。山路仍可能误期，采办责任却不再随书箱在几处衙门间推来推去。"
 hbe_ending.1036.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1037.title: "仓中的两种谷子 · 设公共留种，不按出资限借"
 hbe_ending.1037.desc: "义仓新收的谷子颗粒较小，掌仓人认为只宜低价收进。新垦户说这种谷子更耐旱，不能只凭模样定价。旧仓册记录了丰年产量，却没有把去年干旱时各田的损失写在一起。\n\n新仓格装入留下的种粮，借种时先看田地需要，不先问谁出了仓钱。掌仓人系回钥匙，也记下这份新办法需要谁来守。"
 hbe_ending.1037.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1038.title: "仓中的两种谷子 · 出资者优先，限定借种价格"
 hbe_ending.1038.desc: "义仓新收的谷子颗粒较小，掌仓人认为只宜低价收进。新垦户说这种谷子更耐旱，不能只凭模样定价。旧仓册记录了丰年产量，却没有把去年干旱时各田的损失写在一起。\n\n出资者先领到好种，借种价目按约张贴。仓里有了愿意继续垫钱的人，排在后面的农户则得为下一季另作打算。"
 hbe_ending.1038.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1039.title: "仓中的两种谷子 · 由仓户推举查种人，公开库存"
 hbe_ending.1039.desc: "义仓新收的谷子颗粒较小，掌仓人认为只宜低价收进。新垦户说这种谷子更耐旱，不能只凭模样定价。旧仓册记录了丰年产量，却没有把去年干旱时各田的损失写在一起。\n\n仓户推举的查种人打开粮格，让借种者一同看过实数。两种谷子仍须分开照料，有多少好种却不再只在掌仓人的口中。"
 hbe_ending.1039.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1040.title: "寄来的种桑信 · 准寄册互学，资助抄印"
 hbe_ending.1040.desc: "一位外乡桑农写信教女儿在新乡种桑，信中提到几种不同于本地的剪枝办法。女儿给邻里试过，几株桑树长得好，行会却认为她未经旧师傅传习，不该向织户收取蚕叶钱。\n\n新册裹好送上商船，女儿在末页添了本地试过的失败。旧乡回信也许要等到来春，这回传习却没有停在本府门口。"
 hbe_ending.1040.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1041.title: "寄来的种桑信 · 限本府传习，保护订单"
 hbe_ending.1041.desc: "一位外乡桑农写信教女儿在新乡种桑，信中提到几种不同于本地的剪枝办法。女儿给邻里试过，几株桑树长得好，行会却认为她未经旧师傅传习，不该向织户收取蚕叶钱。\n\n收徒簿仍只列本府姓名，行会答应替作坊守住订单。女儿把未寄出的册子重新包好，旧乡来的那封信仍压在箱底。"
 hbe_ending.1041.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1042.title: "寄来的种桑信 · 以商人往来交换新种记录"
 hbe_ending.1042.desc: "一位外乡桑农写信教女儿在新乡种桑，信中提到几种不同于本地的剪枝办法。女儿给邻里试过，几株桑树长得好，行会却认为她未经旧师傅传习，不该向织户收取蚕叶钱。\n\n商人把两地新种记录装进货箱，下次还要带对方的试种结果。种桑人不必照抄旧法，也不再把每条新经验都当作只能独守的秘方。"
 hbe_ending.1042.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1043.title: "桥边的债簿 · 按受益分摊，公开借还记录"
 hbe_ending.1043.desc: "修桥时几家人替穷户垫过粮，十年后债簿仍在收息。旧桥已修好，债主却把新的维修钱也记在同一页上。乡老请求府署查清当年的担保，商人说若轻易免债，下次没人肯为公共事业出钱。\n\n新桥钱按受益分摊，替人担债的几户终于从旧欠栏划去名字。债主仍能借钱给工程，账本却要在乡里人面前摊开。"
 hbe_ending.1043.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1044.title: "桥边的债簿 · 保留商人垫款，府署定期担保"
 hbe_ending.1044.desc: "修桥时几家人替穷户垫过粮，十年后债簿仍在收息。旧桥已修好，债主却把新的维修钱也记在同一页上。乡老请求府署查清当年的担保，商人说若轻易免债，下次没人肯为公共事业出钱。\n\n商人照新定还期垫出修桥钱，官署在担保处盖印。村里少了一次临时筹款，也多了一份往后须按期兑现的约。"
 hbe_ending.1044.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1045.title: "桥边的债簿 · 减小工程，乡里自行维护"
 hbe_ending.1045.desc: "修桥时几家人替穷户垫过粮，十年后债簿仍在收息。旧桥已修好，债主却把新的维修钱也记在同一页上。乡老请求府署查清当年的担保，商人说若轻易免债，下次没人肯为公共事业出钱。\n\n工程缩到乡里能照料的大小，桥脚用熟悉的木石补好。过重的货仍须绕行，村民却不用为修一座管不起的桥添债。"
 hbe_ending.1045.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1046.title: "被雨打湿的茶砖 · 公开包装做法，资助传习"
 hbe_ending.1046.desc: "一支商队在山口遇雨，外层茶砖受了潮，里面仍可冲饮。收茶人只肯按废茶收购，茶户请求拆开分验。赶马人说，如果每篓都拆，包装又得重做，雪来之前恐怕赶不到下一处市集。\n\n新包法在货棚里拆开给茶户看，纸户也接到几家小订单。最初出资的人记得那场湿货，后来上路的茶砖却有了更多双会包扎的手。"
 hbe_ending.1046.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1047.title: "被雨打湿的茶砖 · 保护限期独供，稳定交割"
 hbe_ending.1047.desc: "一支商队在山口遇雨，外层茶砖受了潮，里面仍可冲饮。收茶人只肯按废茶收购，茶户请求拆开分验。赶马人说，如果每篓都拆，包装又得重做，雪来之前恐怕赶不到下一处市集。\n\n独供期限写进契中，商号按约继续收货。别人暂时还不能照样接单，最早肯垫钱的人也有了一段可以收回投入的时间。"
 hbe_ending.1047.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1048.title: "被雨打湿的茶砖 · 设公用货样，让买主按路程选择"
 hbe_ending.1048.desc: "一支商队在山口遇雨，外层茶砖受了潮，里面仍可冲饮。收茶人只肯按废茶收购，茶户请求拆开分验。赶马人说，如果每篓都拆，包装又得重做，雪来之前恐怕赶不到下一处市集。\n\n货样摆到公用桌上，长途与短途包法各有位置。买主开始先问要走哪条山路，再问哪一种纸篓更合用。"
 hbe_ending.1048.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1049.title: "马群中的旧烙印 · 训练牧人共同验马"
 hbe_ending.1049.desc: "一匹从冬市买来的马带着两处烙印，新旧马主都说自己拥有它。新买主已把马交给赶马人驮货，旧主人拿出的见证又来自另一座山寨。商人担心争执扩大，马医却发现旧烙处一直没有愈合。\n\n冬市开前，年轻牧人跟着学看旧烙印，也记录马病。旧验马人仍要到场，辨认牲畜的本事却开始由更多人共同掌握。"
 hbe_ending.1049.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1050.title: "马群中的旧烙印 · 保留旧验牌，重申担保"
 hbe_ending.1050.desc: "一匹从冬市买来的马带着两处烙印，新旧马主都说自己拥有它。新买主已把马交给赶马人驮货，旧主人拿出的见证又来自另一座山寨。商人担心争执扩大，马医却发现旧烙处一直没有愈合。\n\n旧验牌保留下来，持牌人重新承诺担保补价与照料。买主认得熟悉的凭记，若再出差错，也知道该到哪一家门前追问。"
 hbe_ending.1050.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1051.title: "马群中的旧烙印 · 医马舍留病历，市契另记买卖"
 hbe_ending.1051.desc: "一匹从冬市买来的马带着两处烙印，新旧马主都说自己拥有它。新买主已把马交给赶马人驮货，旧主人拿出的见证又来自另一座山寨。商人担心争执扩大，马医却发现旧烙处一直没有愈合。\n\n医马舍收好病历，市上买卖另用一份契纸。牧人不必把一次旧伤说成夺马的官司，商人也能分清该付的是马价还是照料费。"
 hbe_ending.1051.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1052.title: "雪路上的歇脚屋 · 村寨养屋，保留冬行救助"
 hbe_ending.1052.desc: "牧人愿在山口修一间歇脚屋，给冬行商队留灶和草料。城中客栈认为这会分走自己的住客，守军请求把屋子列为官用驿舍。出木料的村寨只希望过路者付足柴草钱，不愿承担新的固定岗役。\n\n村寨补好屋顶，备用柴草留在里间。春天的行人未必留意这间小屋，落雪时却仍能在这里推开一扇不问货值的门。"
 hbe_ending.1052.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1053.title: "雪路上的歇脚屋 · 交军路长期驻守"
 hbe_ending.1053.desc: "牧人愿在山口修一间歇脚屋，给冬行商队留灶和草料。城中客栈认为这会分走自己的住客，守军请求把屋子列为官用驿舍。出木料的村寨只希望过路者付足柴草钱，不愿承担新的固定岗役。\n\n守军把铺盖与轮值册搬进小屋，夜里常有一盏值守的灯。歇脚处不再只在冬天开门，也须先照顾军路上的差遣。"
 hbe_ending.1053.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1054.title: "雪路上的歇脚屋 · 准屋旁交易，以货费修顶"
 hbe_ending.1054.desc: "牧人愿在山口修一间歇脚屋，给冬行商队留灶和草料。城中客栈认为这会分走自己的住客，守军请求把屋子列为官用驿舍。出木料的村寨只希望过路者付足柴草钱，不愿承担新的固定岗役。\n\n屋旁添了几处交易位置，修顶钱从货费中慢慢补回。村人仍在冬天存柴，商人也有了愿意停步交谈的地方。"
 hbe_ending.1054.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1055.title: "湖上两家的渔船 · 共记渡人和运货，按时段调船"
 hbe_ending.1055.desc: "盐源湖上的两家渔户共用一只大船，一家想载盐换钱，另一家仍靠打鱼供粮。盐商愿预付运费，条件是整季都用船。岸边村寨请求保留雨季渡人，旧船契却没有把这些用途分开写过。\n\n新木牌列出渡人与运货时段，渔户把磨损的桨重新捆紧。盐货未必能立刻开走，村里人也知道哪趟船会等自己。"
 hbe_ending.1055.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1056.title: "湖上两家的渔船 · 只保证货约，村寨另雇渡船"
 hbe_ending.1056.desc: "盐源湖上的两家渔户共用一只大船，一家想载盐换钱，另一家仍靠打鱼供粮。盐商愿预付运费，条件是整季都用船。岸边村寨请求保留雨季渡人，旧船契却没有把这些用途分开写过。\n\n两家的船按货约出发，村寨另筹渡人的船钱。湖上买卖有了定期，赶集的人却还要等另一个船家点头。"
 hbe_ending.1056.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1057.title: "湖上两家的渔船 · 让两家轮派船工，府署每季查账"
 hbe_ending.1057.desc: "盐源湖上的两家渔户共用一只大船，一家想载盐换钱，另一家仍靠打鱼供粮。盐商愿预付运费，条件是整季都用船。岸边村寨请求保留雨季渡人，旧船契却没有把这些用途分开写过。\n\n两家轮派船工，季末一道到府署对账。木牌没有替他们划桨，至少下次谁该上船、该收多少，已有共同查验的依据。"
 hbe_ending.1057.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1058.title: "山寨门前的铁门 · 按契查欠，先放还种粮"
 hbe_ending.1058.desc: "寨中铁匠做出一扇结实的铁门，寨主请求只准供给自己的仓房。几个普通住户也想买锁护粮，铁匠担心拒绝寨主便失去炭料。赶市的商人带来外地铁价，说这门活路不该只靠一家供养。\n\n铁锁打开，借粮户先领回下一季的种子。欠租仍须按契查清，掌仓人却不能再把一家来年的播种也一并锁进去。"
 hbe_ending.1058.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1059.title: "山寨门前的铁门 · 认可旧租，给穷户短期口粮"
 hbe_ending.1059.desc: "寨中铁匠做出一扇结实的铁门，寨主请求只准供给自己的仓房。几个普通住户也想买锁护粮，铁匠担心拒绝寨主便失去炭料。赶市的商人带来外地铁价，说这门活路不该只靠一家供养。\n\n租约照旧，穷户领到一袋暂渡难关的粮。掌仓人仍保管钥匙，村人明白这次宽缓没有改掉往后交租的办法。"
 hbe_ending.1059.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1060.title: "山寨门前的铁门 · 重新订公仓规则，不许私锁借粮"
 hbe_ending.1060.desc: "寨中铁匠做出一扇结实的铁门，寨主请求只准供给自己的仓房。几个普通住户也想买锁护粮，铁匠担心拒绝寨主便失去炭料。赶市的商人带来外地铁价，说这门活路不该只靠一家供养。\n\n私锁从门上撤下，公仓规则由乡里与府署重核。铁门还在，钥匙却不再只替某一家债主看守粮食。"
 hbe_ending.1060.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1061.title: "议事时的座次 · 按记录能力推举并传习"
 hbe_ending.1061.desc: "诸谷议事时，一位会说两种话的年轻人被安排坐在门外，只能替长者转述。去年修桥的许多钱契出自他的手，几个村寨希望他能直接说明记录。主持者认为座次关乎旧有尊卑，不宜因会写字而更改。\n\n能译写的人坐到案前，旧席长者仍在一旁见证。年轻人读回自己的记录，屋里也有人听见从前总被略去的说法。"
 hbe_ending.1061.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1062.title: "议事时的座次 · 承认旧席传承，限定职责"
 hbe_ending.1062.desc: "诸谷议事时，一位会说两种话的年轻人被安排坐在门外，只能替长者转述。去年修桥的许多钱契出自他的手，几个村寨希望他能直接说明记录。主持者认为座次关乎旧有尊卑，不宜因会写字而更改。\n\n旧席继续传给熟悉的家族，职责却逐项列明。来人仍须先向老席主致意，也能拿着约定问清这次谁应负责。"
 hbe_ending.1062.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1063.title: "议事时的座次 · 各寨轮派译写，保留共同查账"
 hbe_ending.1063.desc: "诸谷议事时，一位会说两种话的年轻人被安排坐在门外，只能替长者转述。去年修桥的许多钱契出自他的手，几个村寨希望他能直接说明记录。主持者认为座次关乎旧有尊卑，不宜因会写字而更改。\n\n这一季由另一寨的人执笔，账册交接前被共同读过。轮流留下名字，让议事不再总从同一户门口开始。"
 hbe_ending.1063.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1064.title: "第一口乡音 · 保留各自风味，公开验食"
 hbe_ending.1064.desc: "几户湖广人把自己的酿豆办法带到新乡，集市第一次卖出不一样的饭食。旧摊户认为他们未曾参加过市亭维修，不应占据最好的铺位；乡医愿品验食物，年轻人却已在两种口味之间来回排队。\n\n摊主照旧乡做法起锅，把用料摊给查验者看。街坊起初有些不惯，后来来买的人已能说清自己喜欢哪一味。"
 hbe_ending.1064.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1065.title: "第一口乡音 · 纳入旧行会，统一价目"
 hbe_ending.1065.desc: "几户湖广人把自己的酿豆办法带到新乡，集市第一次卖出不一样的饭食。旧摊户认为他们未曾参加过市亭维修，不应占据最好的铺位；乡医愿品验食物，年轻人却已在两种口味之间来回排队。\n\n新摊并入行会价目，供料收款都有熟人作保。摊主收好旧乡招徕话，街上买卖则按本地规矩继续。"
 hbe_ending.1065.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1066.title: "第一口乡音 · 按卫生与成色发长期摊牌"
 hbe_ending.1066.desc: "几户湖广人把自己的酿豆办法带到新乡，集市第一次卖出不一样的饭食。旧摊户认为他们未曾参加过市亭维修，不应占据最好的铺位；乡医愿品验食物，年轻人却已在两种口味之间来回排队。\n\n摊牌按卫生与成色核发，旧乡口音不再单独决定去留。掌市人留下复查记录，摊主也知道下次应拿什么应验。"
 hbe_ending.1066.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1067.title: "借住的院落 · 按居住记录给门牌"
 hbe_ending.1067.desc: "一户迁来的人暂住旧院，院主起初只收少量柴钱，如今认为他们已有作坊，应当改收租。迁户修过屋顶，也替院主照料过老人，却没有把这些写成钱契。邻里愿作证，双方都担心争执传到行会。\n\n门牌交到借住者手中，邻里在居住簿上见证。房契仍属原主，这些年修路、用井与守夜的日子却不再全算路过。"
 hbe_ending.1067.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1068.title: "借住的院落 · 只认买屋，乡议仍由旧户主持"
 hbe_ending.1068.desc: "一户迁来的人暂住旧院，院主起初只收少量柴钱，如今认为他们已有作坊，应当改收租。迁户修过屋顶，也替院主照料过老人，却没有把这些写成钱契。邻里愿作证，双方都担心争执传到行会。\n\n门牌仍以买屋为凭，乡议席位留给旧户。借住人安顿好行李，知道生活可以继续，自己的声音却还须由别人带进堂中。"
 hbe_ending.1068.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1069.title: "借住的院落 · 以修路出资取得共同见证"
 hbe_ending.1069.desc: "一户迁来的人暂住旧院，院主起初只收少量柴钱，如今认为他们已有作坊，应当改收租。迁户修过屋顶，也替院主照料过老人，却没有把这些写成钱契。邻里愿作证，双方都担心争执传到行会。\n\n修路的人认下借住户的出资与工日，共同作了见证。没有新房契送来，院里的人却能凭做过的事参加乡里的商量。"
 hbe_ending.1069.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1070.title: "渡口的两个孩子 · 明定责任，训练护工"
 hbe_ending.1070.desc: "迁户的孩子与本地孩子一同在渡口做短工，其中一个摔伤后，两家都说自己付过护工的钱。船主认为孩子只是临时帮忙，不算雇工；医者请求先把伤者送进药舍，再查谁为这一天担保。\n\n护工依新办法查绳看水，临时雇工也听过同样交代。孩子再来渡口帮工时，家属也能核对照料责任，问清再有人受伤该由谁出面。"
 hbe_ending.1070.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1071.title: "渡口的两个孩子 · 给一次补偿，维持旧雇用"
 hbe_ending.1071.desc: "迁户的孩子与本地孩子一同在渡口做短工，其中一个摔伤后，两家都说自己付过护工的钱。船主认为孩子只是临时帮忙，不算雇工；医者请求先把伤者送进药舍，再查谁为这一天担保。\n\n补偿钱交给家属，旧雇用照常接活。渡口很快又响起搬货声，那次惊险却会留在两个家庭对工钱的记忆里。"
 hbe_ending.1071.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1072.title: "渡口的两个孩子 · 药舍定期查伤，船帮分担费用"
 hbe_ending.1072.desc: "迁户的孩子与本地孩子一同在渡口做短工，其中一个摔伤后，两家都说自己付过护工的钱。船主认为孩子只是临时帮忙，不算雇工；医者请求先把伤者送进药舍，再查谁为这一天担保。\n\n药舍按期到渡口查伤，船帮把照料钱列进共账。家属不必等下次出事才求问，那些旧伤也有人愿意再看一眼。"
 hbe_ending.1072.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1073.title: "由谁教孩子读书 · 按教学成绩聘任"
 hbe_ending.1073.desc: "外来匠人请求让子女进府学旁的蒙舍，旧教读说名额已给本地家族。孩子能认工账上的数字，却不懂老师要求的旧文。几名商人愿资助纸墨，条件是蒙舍也教账法。\n\n教读名册按实际课业重核，孩子带回家的字帖也成了凭据。旧乡来历仍被问起，却不再足以抹掉一季教出的本事。"
 hbe_ending.1073.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1074.title: "由谁教孩子读书 · 保留旧家主持，明列公共名额"
 hbe_ending.1074.desc: "外来匠人请求让子女进府学旁的蒙舍，旧教读说名额已给本地家族。孩子能认工账上的数字，却不懂老师要求的旧文。几名商人愿资助纸墨，条件是蒙舍也教账法。\n\n旧家继续主持学席，公共名额逐一列在簿中。新户仍从熟悉的门里求学，哪些位置本该开放却已有明文。"
 hbe_ending.1074.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1075.title: "由谁教孩子读书 · 由住户轮选教读，公账供纸墨"
 hbe_ending.1075.desc: "外来匠人请求让子女进府学旁的蒙舍，旧教读说名额已给本地家族。孩子能认工账上的数字，却不懂老师要求的旧文。几名商人愿资助纸墨，条件是蒙舍也教账法。\n\n住户共同核过纸墨账，下一任先生也由他们轮选。凳子仍旧高低不齐，替孩子付钱的人却能决定请谁来教。"
 hbe_ending.1075.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1076.title: "迁来的祭日 · 承认礼期，按季调役"
 hbe_ending.1076.desc: "几户新住民按旧乡祭日备饭，恰与本村清渠的日期相逢。领役人认为他们借礼俗逃工，新户说自己已经在别的日子出过力。乡老愿另定一日，却担心以后人人都按自家习俗请求改役。\n\n新簿避开祭日，把役工排到下一季。迁户照自己的礼数送过先人，领役人也学着从另一张历上找能够同去做工的日子。"
 hbe_ending.1076.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1077.title: "迁来的祭日 · 保留逐案宽免，维护领役"
 hbe_ending.1077.desc: "几户新住民按旧乡祭日备饭，恰与本村清渠的日期相逢。领役人认为他们借礼俗逃工，新户说自己已经在别的日子出过力。乡老愿另定一日，却担心以后人人都按自家习俗请求改役。\n\n领役人保留逐案宽免，迁户带着礼期凭记再来说明。有人这次得了准许，下一家却还须自己走一遍相同的门路。"
 hbe_ending.1077.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1078.title: "迁来的祭日 · 设付酬替役，让乡里自行筹工"
 hbe_ending.1078.desc: "几户新住民按旧乡祭日备饭，恰与本村清渠的日期相逢。领役人认为他们借礼俗逃工，新户说自己已经在别的日子出过力。乡老愿另定一日，却担心以后人人都按自家习俗请求改役。\n\n付酬替役的账记下，乡里按礼期凑齐人手。有人赴祭，有人领钱上工，过去挤在同一天的两桩责任终于能各自安排。"
 hbe_ending.1078.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1079.title: "一间新药铺 · 承认独立铺号，公开查方"
 hbe_ending.1079.desc: "外乡医者在本村开药铺，本地医者指责他未受行规。病家觉得新药价低，却担心所用药草与以前不同。两位医者都愿把治过的人列出来，家属希望比较病程，不愿只凭谁的名字更熟悉。\n\n新医者挂回自己的铺号，把可查药方留在柜前。病家仍会比较两边医术，至少选择不必先看谁在本地有亲族。"
 hbe_ending.1079.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1080.title: "一间新药铺 · 合入旧药铺，维持行规"
 hbe_ending.1080.desc: "外乡医者在本村开药铺，本地医者指责他未受行规。病家觉得新药价低，却担心所用药草与以前不同。两位医者都愿把治过的人列出来，家属希望比较病程，不愿只凭谁的名字更熟悉。\n\n药柜并入旧铺，医者跟着旧行规接诊。门口少了一个新铺号，病家却仍认得那个曾替他们看病的人。"
 hbe_ending.1080.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1081.title: "一间新药铺 · 设共同药舍，给两医固定酬钱"
 hbe_ending.1081.desc: "外乡医者在本村开药铺，本地医者指责他未受行规。病家觉得新药价低，却担心所用药草与以前不同。两位医者都愿把治过的人列出来，家属希望比较病程，不愿只凭谁的名字更熟悉。\n\n两医按约到共同药舍应诊，固定工钱让他们不必先争招牌。病历放进交接的柜，学徒也听见彼此不同的诊法。"
 hbe_ending.1081.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1082.title: "荒地上的借种 · 按发芽与收成验还"
 hbe_ending.1082.desc: "迁户用从旧乡带来的种子播下第一季田，邻村愿借种，却要求新户先参加义仓担保。种子不多，新户担心借出去后自家无粮，旧户又怕新来的田迟早要分走灌水。\n\n归还的谷子先验发芽与收成，不同颜色分开入格。借种户松开紧攥的袋口，掌仓人也多了一项须亲手查验的责任。"
 hbe_ending.1082.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1083.title: "荒地上的借种 · 按原种验还，保护仓册"
 hbe_ending.1083.desc: "迁户用从旧乡带来的种子播下第一季田，邻村愿借种，却要求新户先参加义仓担保。种子不多，新户担心借出去后自家无粮，旧户又怕新来的田迟早要分走灌水。\n\n原种数目重核，旧仓册照约结清。新户仍得另寻合用谷子，掌仓人则保住前后能一一相对的账目。"
 hbe_ending.1083.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1084.title: "荒地上的借种 · 分仓保存，教住户共同记种"
 hbe_ending.1084.desc: "迁户用从旧乡带来的种子播下第一季田，邻村愿借种，却要求新户先参加义仓担保。种子不多，新户担心借出去后自家无粮，旧户又怕新来的田迟早要分走灌水。\n\n谷子分仓保存，住户跟着掌仓人学记种。还粮不再只是交出一袋同重的东西，也留下下一年能够试验的几条记录。"
 hbe_ending.1084.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1085.title: "合开的染坊 · 准轮随两师传习，明定工钱"
 hbe_ending.1085.desc: "两个不同乡籍的染户合开作坊，一家供染料，一家供劳作。头一季赚了钱，双方却对未写入契纸的试染损失有不同记忆。行会愿作保，要求这座新坊沿用本地配方与价目。\n\n学徒带着写明工钱的契纸在两坊传习，家属也认下新时日。师傅各有得意的颜色，年轻人却不必先割断另一边的来路。"
 hbe_ending.1085.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1086.title: "合开的染坊 · 一师一徒，维护行规"
 hbe_ending.1086.desc: "两个不同乡籍的染户合开作坊，一家供染料，一家供劳作。头一季赚了钱，双方却对未写入契纸的试染损失有不同记忆。行会愿作保，要求这座新坊沿用本地配方与价目。\n\n收徒簿只记一位师傅，另一坊另寻人手。旧规使交代清楚，学徒也须把尚未学完的另一门做法暂时放下。"
 hbe_ending.1086.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1087.title: "合开的染坊 · 设共同试染课，以技艺分工"
 hbe_ending.1087.desc: "两个不同乡籍的染户合开作坊，一家供染料，一家供劳作。头一季赚了钱，双方却对未写入契纸的试染损失有不同记忆。行会愿作保，要求这座新坊沿用本地配方与价目。\n\n两坊把试染安排在同一处，学徒按做成的布色分工。先前争来争去的一个名额，变成几个人都能看见的实作。"
 hbe_ending.1087.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1088.title: "同住一坡的山民 · 木牌记双名，认可共同见证"
 hbe_ending.1088.desc: "迁户在山脚养起牲畜，原来的山民担心牧路被围。新户不认识旧界标，说自己照官给的荒地册开围栏。山民愿帮他们过冬，却希望以后仍能沿这条坡路进山。\n\n双名木牌立回牧路边，两家各按自己的叫法认出同一处溪口。围栏没有再伸过旧路，见证的人也在新约上留下名字。"
 hbe_ending.1088.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1089.title: "同住一坡的山民 · 只用官名，维持地册"
 hbe_ending.1089.desc: "迁户在山脚养起牲畜，原来的山民担心牧路被围。新户不认识旧界标，说自己照官给的荒地册开围栏。山民愿帮他们过冬，却希望以后仍能沿这条坡路进山。\n\n木牌照官册定名，山民沿另留便道上山。旧称仍在人们口中，交租查地时却须先翻到官名下的那一页。"
 hbe_ending.1089.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1090.title: "同住一坡的山民 · 官册附旧名，教两方核对"
 hbe_ending.1090.desc: "迁户在山脚养起牲畜，原来的山民担心牧路被围。新户不认识旧界标，说自己照官给的荒地册开围栏。山民愿帮他们过冬，却希望以后仍能沿这条坡路进山。\n\n官册在旧名旁添附注，两方各找人学核对。书记仍能照册查地，山民也不必每次从解释自家牧路的名字说起。"
 hbe_ending.1090.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1091.title: "递到府署的合姓诉状 · 按使用与出资共同推举"
 hbe_ending.1091.desc: "迁户与旧户一起控告一名收路钱的管事，管事说迁户不在旧乡约中，没有资格联署。旧户愿替他们担保，条件是新户日后修桥也出同样的份额。诉状因此既问收费，也问谁算这条路上的人。\n\n新旧住户依出资与用路记录推举管事，联署名字没有再被划去。下一季收费仍会有人抱怨，主持人却须回到同一本账前作答。"
 hbe_ending.1091.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1092.title: "递到府署的合姓诉状 · 保留旧名额，定期公开账本"
 hbe_ending.1092.desc: "迁户与旧户一起控告一名收路钱的管事，管事说迁户不在旧乡约中，没有资格联署。旧户愿替他们担保，条件是新户日后修桥也出同样的份额。诉状因此既问收费，也问谁算这条路上的人。\n\n族老接下旧名额，也依约定期送出账本。迁户尚未坐到主持位置，修桥钱却再不能只在熟人的内屋里传看。"
 hbe_ending.1092.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1093.title: "递到府署的合姓诉状 · 府署收管，统一路费"
 hbe_ending.1093.desc: "迁户与旧户一起控告一名收路钱的管事，管事说迁户不在旧乡约中，没有资格联署。旧户愿替他们担保，条件是新户日后修桥也出同样的份额。诉状因此既问收费，也问谁算这条路上的人。\n\n路费由府署统一收管，私人的旧收费牌被收回。管事少了一层分争，乡里往后也须向衙门追问哪段路值得先修。"
 hbe_ending.1093.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1094.title: "新来的船工 · 准入帮，保留旧师承"
 hbe_ending.1094.desc: "外乡船工替旧船帮修好了一艘险些报废的船，船主答应给他一份跑船名额。船帮却认为资格只传本帮子弟，提议给一笔工钱代替。船工不愿永远做岸边短工，家属已在渡口租了住处。\n\n船工正式入帮，旧乡师傅的称呼也留在册旁。下次过滩时，他能以本帮身份应号，不必先否认教会自己修船的人。"
 hbe_ending.1094.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1095.title: "新来的船工 · 按旧规入帮，维护船帮体面"
 hbe_ending.1095.desc: "外乡船工替旧船帮修好了一艘险些报废的船，船主答应给他一份跑船名额。船帮却认为资格只传本帮子弟，提议给一笔工钱代替。船工不愿永远做岸边短工，家属已在渡口租了住处。\n\n入帮礼按旧规办完，船主兑现了最初名额。船工有了稳定位置，旧乡称呼则被收进不在帮册上说的家常。"
 hbe_ending.1095.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1096.title: "新来的船工 · 设公开试船，不按籍贯择人"
 hbe_ending.1096.desc: "外乡船工替旧船帮修好了一艘险些报废的船，船主答应给他一份跑船名额。船帮却认为资格只传本帮子弟，提议给一笔工钱代替。船工不愿永远做岸边短工，家属已在渡口租了住处。\n\n试船由熟悉险滩的人共同验看，过关者不再按籍贯分开。船工有了凭实作争取名额的机会，也给后来人留下一道相同的门。"
 hbe_ending.1096.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1097.title: "返回旧乡的长者 · 准自购祭田，承认本府住户"
 hbe_ending.1097.desc: "一位迁来多年的长者准备回湖广祭扫，请求带走自己留下的地契副本。田主认为长期离乡会使契约失效，子女愿继续耕作。长者说回去并非舍弃新乡，但他不愿把祖先的坟地永远留在一封旧信里。\n\n家属用自己的钱买下祭田，旧乡的坟与新乡生活不必再择一丢开。长者收好两处往来凭记，门前仍留着子女耕过的泥。"
 hbe_ending.1097.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1098.title: "返回旧乡的长者 · 保留旧族公地，按旧乡祭扫"
 hbe_ending.1098.desc: "一位迁来多年的长者准备回湖广祭扫，请求带走自己留下的地契副本。田主认为长期离乡会使契约失效，子女愿继续耕作。长者说回去并非舍弃新乡，但他不愿把祖先的坟地永远留在一封旧信里。\n\n公地仍留旧族，家属照旧乡祭期安排归程。长者在新乡住得更久，祖先的名字却仍须循着远处那条路去寻。"
 hbe_ending.1098.a: "让这段往事留在本府的记忆里。"
 hbe_ending.1099.title: "返回旧乡的长者 · 设共同纪念，不另分族田"
 hbe_ending.1099.desc: "一位迁来多年的长者准备回湖广祭扫，请求带走自己留下的地契副本。田主认为长期离乡会使契约失效，子女愿继续耕作。长者说回去并非舍弃新乡，但他不愿把祖先的坟地永远留在一封旧信里。\n\n乡里留出共同纪念的位置，没有另分族田。新旧住户带来各自旧事，长者也第一次把两处乡里的名字说在一起。"
 hbe_ending.1099.a: "让这段往事留在本府的记忆里。"
 hbe_ending.2001.title: "湖广填四川 · 新乡共籍约"
 hbe_ending.2001.desc: "旧簿与新册收进同一只木箱。几十年来关于田地、工钱、礼期与入籍的争论，终于留下了本府将要沿用的办法。\n\n最早入蜀的船已换过几代船板，旧乡的口音也在孩子嘴里变了模样。新簿把长住、劳作与共同出资的人列在一起，旧户不再独守承认新邻的名额。有人仍怀念旧日的次序，院里的几户人却已能拿着同一份凭记商量下一年的田水。"
 hbe_ending.2001.a: "让这段往事留在本府的记忆里。"
 hbe_ending.2002.title: "湖广填四川 · 旧户担保制"
 hbe_ending.2002.desc: "旧簿与新册收进同一只木箱。几十年来关于田地、工钱、礼期与入籍的争论，终于留下了本府将要沿用的办法。\n\n堂前登记仍先由旧户出面担保，来人按各家承诺分批落脚。旧族保住主持与体面，得到引荐的人也多了一处可以求援的门。那些没有担保的人还在等，最后留下的新乡便沿着这些熟悉的门户慢慢展开。"
 hbe_ending.2002.a: "让这段往事留在本府的记忆里。"

l_english:
 game_concept_hbe_history_huguang_migration: "Migration from Huguang to Sichuan"
 game_concept_hbe_history_huguang_migration_desc: "#T Historical background#!\nMigrants from Huguang entered Sichuan and Chongqing during the late Yuan and early Ming. Further large movements followed the Ming–Qing transition. Settlers also came from Jiangxi, Guangdong, Fujian and other regions, reshaping settlements, kinship networks and local customs."
 game_concept_hbe_history_huiguan: "Native-place guild halls"
 game_concept_hbe_history_huiguan_desc: "#T Historical background#!\nMigrant communities and merchants pooled funds for halls organized by place of origin. They maintained hometown ties, hosted communal worship and gatherings, and defended shared commercial interests. Chongqing’s surviving Huguang complex includes Yuwang Palace, the Qi’an Hall and the Guangdong Hall."
 game_concept_hbe_history_embroidery: "Shu embroidery"
 game_concept_hbe_history_embroidery_desc: "#T Historical background#!\nCentred on Chengdu, Shu embroidery creates patterns by stitching silk thread onto a ground fabric. Shu brocade forms its patterns through the arrangement of warp and weft on a loom. Both belong to Sichuan’s silk traditions and require distinct skills."
 game_concept_hbe_history_bamboo_paper: "Bamboo paper in Sichuan"
 game_concept_hbe_history_bamboo_paper_desc: "#T Historical background#!\nJiajiang and other Sichuan communities preserve bamboo papermaking traditions. Makers soak and cook young bamboo, wash and pound it into pulp, form sheets with bamboo screens, then press and dry them. Paper quality depends on both the material and skilled work throughout the process."
 game_concept_hbe_history_panda: "Giant panda"
 game_concept_hbe_history_panda_desc: "#T Historical background#!\nDengchigou in Baoxing, Sichuan, is the type locality of the giant panda. In 1869, naturalist Armand David obtained specimens there and sent them to France for study, bringing the animal into modern zoological description and classification."
 game_concept_hbe_history_zigong_fossils: "Dinosaur fossils of Zigong"
 game_concept_hbe_history_zigong_fossils_desc: "#T Historical background#!\nZigong preserves rich Jurassic dinosaur deposits. Modern investigations began in the twentieth century. Large exposures at Dashanpu in late 1979 led to excavations that supplied important evidence for dinosaur anatomy, ancient environments and geological strata."
 game_concept_hbe_history_timekeeping: "Sundials, water clocks and observation"
 game_concept_hbe_history_timekeeping_desc: "#T Historical background#!\nSundials measure time from a shadow; water clocks use flowing water and changes in water level. Observers could compare these readings. Astronomical instruments served another purpose: Yuan scholar Guo Shoujing simplified the armillary sphere to create the jianyi for measuring celestial positions."
 game_concept_hbe_history_dazu: "Dazu Rock Carvings"
 game_concept_hbe_history_dazu_desc: "#T Historical background#!\nMajor groups of the Dazu carvings date from the ninth to thirteenth centuries. They combine Buddhist, Daoist and Confucian subjects with scenes of daily life. Inscriptions preserve dates, names and religious information, offering evidence about the communities around the sculptures."

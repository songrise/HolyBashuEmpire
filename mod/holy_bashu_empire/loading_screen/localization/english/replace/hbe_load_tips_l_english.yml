l_english:
 LOADING_TIP_0: " #T At dawn, look where the flowers are wet and red; blossoms weigh upon the City of Brocade.#! \n #tooltip_subheading — Du Fu, A Welcome Rain on a Spring Night#!"
 LOADING_TIP_1: " #T At dawn I leave White Emperor City among bright clouds; a thousand li to Jiangling in a single day.#! \n #tooltip_subheading — Li Bai, Leaving White Emperor City at Dawn#!"
 LOADING_TIP_2: " #T Was I meant to be a poet? Through fine rain I ride a donkey into Sword Gate.#! \n #tooltip_subheading — Lu You, A Light Rain on the Road to Sword Gate#!"
 LOADING_TIP_3: " #T The harvests do not fail; the world calls it the Heavenly Storehouse.#! \n #tooltip_subheading — Records of Shu, quoted in Chang Qu, Records of the Lands South of Mount Hua#!"
 LOADING_TIP_4: " #T In the rocky hills of Shu, places near rivers often allow wells to be dug for salt.#! \n #tooltip_subheading — Song Yingxing, The Exploitation of the Works of Nature: Well Salt#!"
 LOADING_TIP_5: " #T Sword Gate rises steep and towering; one man holds the pass, ten thousand cannot break through.#! \n #tooltip_subheading — Li Bai, The Hard Road to Shu#!"
 LOADING_TIP_6: " #T Many taverns line the Bridge of Ten Thousand Li; which one will the traveler choose for the night?#! \n #tooltip_subheading — Zhang Ji, Song of Chengdu#!"
 LOADING_TIP_7: " #T Among zither tunes, only Green Waters is familiar; among teas, my old friend is Mengshan.#! \n #tooltip_subheading — Bai Juyi, Zither and Tea#!"

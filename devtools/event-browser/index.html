<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>巴蜀 · 事件档案</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<header class="topbar"><div class="brand"><span class="seal">蜀</span><div><h1>事件档案</h1><p>神圣巴蜀帝国 <span> / 开发者工具</span></p></div></div><div class="header-actions"><span id="status" role="status">正在读取事件…</span><button id="export">导出目录</button><button id="refresh" class="primary">重新读取源码 ↻</button></div></header>
<div class="app-shell"><aside class="sidebar"><section class="filters"><div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="标题、正文、选项、事件 ID…" aria-label="搜索事件"><kbd>/</kbd></div><div class="filter-grid"><label>事件系列<select id="category"><option value="">全部系列</option></select></label><label>所属地区<select id="region"><option value="">全部地区</option></select></label><label>接入状态<select id="implementation"><option value="all">全部内容</option><option value="implemented">已接入游戏</option><option value="draft">新增草稿</option></select></label><label>事件类型<select id="visibility"><option value="all">全部事件</option><option value="visible">玩家可见</option><option value="hidden">隐藏维护</option></select></label><label>选项数量<select id="choices"><option value="all">全部选项</option><option value="multi">多选项抉择</option><option value="single">单选项通知</option><option value="none">无选项</option></select></label></div></section><div class="list-heading"><span id="result-count">事件目录</span><button id="reset" class="quiet">重置筛选</button></div><nav id="event-list" aria-label="事件目录"></nav><footer class="sidebar-foot"><span>↑ ↓ 浏览事件 · / 搜索</span><span id="file-count"></span></footer></aside>
<main id="detail" tabindex="-1"><div class="empty">正在整理档案…</div></main></div>
<dialog id="error-dialog"><h2>读取失败</h2><p id="error-message"></p><button id="close-error">关闭</button></dialog>
</body></html>
